<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="description" content="The French–Occitan War of 1974 was a short interstate war fought from 9 to 23 September between the État français and the provincial forces of Occitania. France advanced down the Saône toward Mâcon while a Poitevin-led coalition advanced toward Tours. German, Italian, and Spanish pressure ended the fighting and restored the antebellum frontier. The German and Italian regular forces did not deliberately exchange fire."><title>French–Occitan War of 1974 | Fractured Peace Archive</title><link rel="stylesheet" href="styles.css?v=20260816"></head><body data-article="french-occitan-war-1974"><script src="article-data.js"></script><script src="six-lore-french-factions-article-data.js"></script><script src="article-renderer.js?v=1027"></script><script src="app.js?v=1564"></script></body></html>
