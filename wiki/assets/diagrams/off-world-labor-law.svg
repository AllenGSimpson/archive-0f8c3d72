<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Off-world labor relationships</title><desc id="d">Worker, employer, carrier, habitat operator, and technical authority are connected but legally distinct.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131b"/><stop offset="1" stop-color="#10242e"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Employment under life-support dependence</text><text x="60" y="104" fill="#a2b5bf" font-family="Arial,sans-serif" font-size="17">The person supplying work need not control transport, housing, or emergencies</text><g stroke="#6da9b9" stroke-width="3"><path d="M600 290L235 195M600 290L235 425M600 290L965 195M600 290L965 425"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="290" r="105" fill="#214451" stroke="#75b0bf" stroke-width="3"/><text x="600" y="280" fill="#e8f3f5" font-size="23" font-weight="700">RESIDENT</text><text x="600" y="315" fill="#bfd2d8" font-size="15">work · home · return</text><rect x="90" y="130" width="290" height="130" rx="16" fill="#183543" stroke="#568da0"/><text x="235" y="181" fill="#e2eef1" font-size="19" font-weight="700">EMPLOYER</text><text x="235" y="215" fill="#bacdd4" font-size="15">duty · pay · discipline</text><rect x="90" y="360" width="290" height="130" rx="16" fill="#183543" stroke="#568da0"/><text x="235" y="411" fill="#e2eef1" font-size="19" font-weight="700">CARRIER</text><text x="235" y="445" fill="#bacdd4" font-size="15">transport · delay · return seat</text><rect x="820" y="130" width="290" height="130" rx="16" fill="#323d3e" stroke="#aa955c"/><text x="965" y="181" fill="#f7e5b5" font-size="19" font-weight="700">HABITAT OPERATOR</text><text x="965" y="215" fill="#d3cdba" font-size="15">housing · utilities · access</text><rect x="820" y="360" width="290" height="130" rx="16" fill="#403033" stroke="#ba7677"/><text x="965" y="411" fill="#f5dddd" font-size="19" font-weight="700">TECHNICAL COMMAND</text><text x="965" y="445" fill="#d9c3c4" font-size="15">safety · refuge · evacuation</text></g><text x="600" y="565" fill="#9fb3bc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">No single contract can safely control every relationship</text></svg>
