<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">British market opening and its firebreaks</title><desc id="desc">London, New York, and Toronto are linked by finance inside rings representing aggregate ownership limits, protected capacity, and emergency controls.</desc><rect width="1200" height="675" fill="#101923"/><text x="60" y="62" fill="#f8fafc" font-family="Georgia,serif" font-size="32">THE BRITISH OPENING AND ITS FIREBREAKS</text><text x="60" y="96" fill="#9fb3c8" font-family="Arial,sans-serif" font-size="17">Atlantic access within a governed Sterling Commonwealth</text><circle cx="600" cy="355" r="230" fill="none" stroke="#5b8db8" stroke-width="28"/><circle cx="600" cy="355" r="180" fill="none" stroke="#d6b35a" stroke-width="26"/><circle cx="600" cy="355" r="132" fill="#17324d" stroke="#b8d8f0" stroke-width="5"/><text x="600" y="322" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="31">LONDON</text><text x="600" y="357" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17">cross-listings · minority stakes</text><text x="600" y="383" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17">funds · subsidiaries · recognition</text><text x="600" y="430" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-weight="bold" font-size="15">EMERGENCY RESTORATION</text><text x="600" y="505" text-anchor="middle" fill="#ffe8a3" font-family="Arial,sans-serif" font-weight="bold" font-size="16">PROTECTED COMMONWEALTH &amp; STRATEGIC CAPACITY</text><text x="600" y="590" text-anchor="middle" fill="#b9d8f0" font-family="Arial,sans-serif" font-weight="bold" font-size="16">AGGREGATE FOREIGN-OWNERSHIP LIMITS</text><g font-family="Arial,sans-serif"><rect x="75" y="265" width="220" height="105" rx="12" fill="#1e3a5f" stroke="#60a5fa"/><text x="185" y="310" text-anchor="middle" fill="#fff" font-size="24">NEW YORK</text><text x="185" y="341" text-anchor="middle" fill="#bfdbfe" font-size="16">capital and listings</text><rect x="905" y="265" width="220" height="105" rx="12" fill="#4b2430" stroke="#fb7185"/><text x="1015" y="310" text-anchor="middle" fill="#fff" font-size="24">TORONTO</text><text x="1015" y="341" text-anchor="middle" fill="#fecdd3" font-size="16">Commonwealth anchor</text></g><g stroke="#e2e8f0" stroke-width="4" marker-end="url(#b)"><path d="M295 317 H452"/><path d="M905 317 H748"/></g><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e2e8f0"/></marker></defs></svg>
