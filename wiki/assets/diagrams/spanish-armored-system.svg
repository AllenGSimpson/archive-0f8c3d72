<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Spanish armored-force system</title>
  <desc id="desc">Italian Ariete main battle tanks, Occitan light armor, and Spanish-built wheeled carriers and reconnaissance vehicles combine in Spain's armored forces, with road-mobile vehicles documented in Portuguese Angola.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a24"/><stop offset="1" stop-color="#172b35"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d5b86a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" fill="#f2ead9" font-family="Georgia,serif" font-size="34" font-weight="700">Spanish armored-force system</text>
  <text x="600" y="94" text-anchor="middle" fill="#aebdc4" font-family="Arial,sans-serif" font-size="17">allied tracked lineages · national wheeled specialization · selective Latin interoperability</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="300" height="145" rx="18" fill="#213441" stroke="#c98163" stroke-width="3"/>
    <text x="220" y="188" text-anchor="middle" fill="#f2ead9" font-family="Arial,sans-serif" font-size="23" font-weight="700">Italian Ariete series</text>
    <text x="220" y="224" text-anchor="middle" fill="#d7e0e4" font-family="Arial,sans-serif" font-size="18">principal main battle tanks</text>
    <text x="220" y="254" text-anchor="middle" fill="#9fb0b8" font-family="Arial,sans-serif" font-size="15">exact variants and quantities open</text>

    <rect x="450" y="145" width="300" height="145" rx="18" fill="#213441" stroke="#7db19a" stroke-width="3"/>
    <text x="600" y="188" text-anchor="middle" fill="#f2ead9" font-family="Arial,sans-serif" font-size="23" font-weight="700">Occitan light armor</text>
    <text x="600" y="224" text-anchor="middle" fill="#d7e0e4" font-family="Arial,sans-serif" font-size="18">lighter tracked layer</text>
    <text x="600" y="254" text-anchor="middle" fill="#9fb0b8" font-family="Arial,sans-serif" font-size="15">individual Spanish types open</text>

    <rect x="830" y="145" width="300" height="145" rx="18" fill="#213441" stroke="#d5b86a" stroke-width="3"/>
    <text x="980" y="188" text-anchor="middle" fill="#f2ead9" font-family="Arial,sans-serif" font-size="23" font-weight="700">Spanish-built wheeled</text>
    <text x="980" y="224" text-anchor="middle" fill="#d7e0e4" font-family="Arial,sans-serif" font-size="18">carriers · reconnaissance</text>
    <text x="980" y="254" text-anchor="middle" fill="#9fb0b8" font-family="Arial,sans-serif" font-size="15">national industrial specialty</text>
  </g>

  <path d="M220 290V355H480" fill="none" stroke="#d5b86a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 290V345" fill="none" stroke="#d5b86a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M980 290V355H720" fill="none" stroke="#d5b86a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="365" width="540" height="125" rx="20" fill="#2a4050" stroke="#e3d29b" stroke-width="3"/>
    <text x="600" y="412" text-anchor="middle" fill="#fff7e6" font-family="Georgia,serif" font-size="28" font-weight="700">Spanish armored forces</text>
    <text x="600" y="450" text-anchor="middle" fill="#d7e0e4" font-family="Arial,sans-serif" font-size="17">separate national service · licensed production · common ammunition</text>
  </g>

  <path d="M600 490V530" fill="none" stroke="#d5b86a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="310" y="540" width="580" height="50" rx="15" fill="#172832" stroke="#758b95" stroke-width="2"/>
  <text x="600" y="572" text-anchor="middle" fill="#d7e0e4" font-family="Arial,sans-serif" font-size="18">Portuguese Angola: motorized columns · road security · convoy and airborne-force support</text>
</svg>
