<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">German first Moon landing mission profile</title><desc id="desc">A five-stage sequence from the 1967 emergency direct-ascent decision to the German landing on 20 December 1970 and the reuse of booster production for orbital infrastructure.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111714"/><stop offset="1" stop-color="#202825"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="64" y="68" fill="#eee9dc" font-family="Georgia,serif" font-size="31">From emergency mission to orbital harbor</text><text x="64" y="102" fill="#b5ae98" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">GERMAN LUNAR PROGRAM · 1967–1975</text>
  <path d="M105 395H1090" stroke="#c8ae62" stroke-width="6"/><path d="m1090 395-25-14v28z" fill="#c8ae62"/>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 175)"><rect width="190" height="145" rx="13" fill="#302328" stroke="#9b5864"/><text x="18" y="31" fill="#d8c5c8" font-size="14">1967</text><text x="18" y="62" fill="#fff" font-size="19" font-weight="700">Direct-ascent</text><text x="18" y="86" fill="#fff" font-size="19" font-weight="700">decision</text><text x="18" y="116" fill="#c8bcc0" font-size="13">Political deadline creates</text><text x="18" y="135" fill="#c8bcc0" font-size="13">a parallel expendable path</text></g>
    <g transform="translate(285 290)"><rect width="190" height="145" rx="13" fill="#253131" stroke="#618387"/><text x="18" y="31" fill="#b9d0d0" font-size="14">1967–1970</text><text x="18" y="62" fill="#fff" font-size="19" font-weight="700">Enlarged booster</text><text x="18" y="91" fill="#c2d0ce" font-size="13">Minimal surface payload</text><text x="18" y="112" fill="#c2d0ce" font-size="13">Little reserve</text><text x="18" y="133" fill="#c2d0ce" font-size="13">Two-person crew</text></g>
    <g transform="translate(515 145)"><rect width="190" height="175" rx="13" fill="#40361e" stroke="#c8ae62" stroke-width="2"/><text x="18" y="31" fill="#e4d5a7" font-size="14">20 DECEMBER 1970</text><text x="18" y="65" fill="#fff" font-size="20" font-weight="700">First humans</text><text x="18" y="90" fill="#fff" font-size="20" font-weight="700">on the Moon</text><text x="18" y="120" fill="#dfd3b3" font-size="13">Flag · camera · salute</text><text x="18" y="141" fill="#dfd3b3" font-size="13">Limited scientific work</text><text x="18" y="162" fill="#dfd3b3" font-size="13">Successful return</text></g>
    <g transform="translate(745 290)"><rect width="190" height="145" rx="13" fill="#28302a" stroke="#71846f"/><text x="18" y="31" fill="#c6d1c4" font-size="14">1971</text><text x="18" y="62" fill="#fff" font-size="19" font-weight="700">American answer</text><text x="18" y="91" fill="#c8d0c7" font-size="13">Columbia demonstrates</text><text x="18" y="112" fill="#c8d0c7" font-size="13">reusable runway-to-orbit</text><text x="18" y="133" fill="#c8d0c7" font-size="13">transport architecture</text></g>
    <g transform="translate(975 175)"><rect width="170" height="145" rx="13" fill="#24313a" stroke="#668da3"/><text x="18" y="31" fill="#c0d2dc" font-size="14">1971–1975</text><text x="18" y="62" fill="#fff" font-size="19" font-weight="700">Production turns</text><text x="18" y="86" fill="#fff" font-size="19" font-weight="700">toward harbor</text><text x="18" y="116" fill="#c4d2d9" font-size="13">Booster capacity supports</text><text x="18" y="135" fill="#c4d2d9" font-size="13">the Orbitaler Raumhafen</text></g>
  </g>
  <text x="600" y="555" text-anchor="middle" fill="#bcb5a3" font-family="Georgia,serif" font-size="17">Germany wins the date; America answers with the more reusable system.</text>
</svg>
