<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Sumatra's four-state system</title><desc id="desc">Comparison of Aceh, Tapanuli, Minangkabau, and the Sumatran Malay Federation.</desc><rect width="1200" height="650" rx="32" fill="#10171d"/><text x="60" y="70" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">Sumatra’s four-state system</text><text x="60" y="108" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">Four different bargains between sovereignty, inherited institutions, and Japanese capital</text><g font-family="Arial,sans-serif"><g transform="translate(55 160)"><rect width="255" height="320" rx="18" fill="#3d2d20" stroke="#d69d56"/><text x="22" y="46" fill="#f2c079" font-size="25" font-weight="700">ACEH</text><text x="22" y="86" fill="#fff" font-size="18">Sultanate · Kutaraja</text><text x="22" y="130" fill="#a8bbc4" font-size="16">Islamic sovereignty</text><text x="22" y="160" fill="#a8bbc4" font-size="16">Oil and Malacca approach</text><text x="22" y="190" fill="#a8bbc4" font-size="16">Strong concession bargaining</text></g><g transform="translate(335 160)"><rect width="255" height="320" rx="18" fill="#24374b" stroke="#7ca9d4"/><text x="22" y="46" fill="#a7cdf2" font-size="25" font-weight="700">TAPANULI</text><text x="22" y="86" fill="#fff" font-size="18">Federal councils</text><text x="22" y="130" fill="#a8bbc4" font-size="16">Batak highlands</text><text x="22" y="160" fill="#a8bbc4" font-size="16">Christian–Muslim balance</text><text x="22" y="190" fill="#a8bbc4" font-size="16">Education and plantations</text></g><g transform="translate(615 160)"><rect width="255" height="320" rx="18" fill="#3b2530" stroke="#c87e9d"/><text x="22" y="46" fill="#eea8c2" font-size="24" font-weight="700">MINANGKABAU</text><text x="22" y="86" fill="#fff" font-size="18">Bukittinggi · Padang</text><text x="22" y="130" fill="#a8bbc4" font-size="16">Islam and matrilineal law</text><text x="22" y="160" fill="#a8bbc4" font-size="16">Merchants and teachers</text><text x="22" y="190" fill="#a8bbc4" font-size="16">Cultural influence</text></g><g transform="translate(895 160)"><rect width="250" height="320" rx="18" fill="#19372b" stroke="#6ab58a"/><text x="20" y="42" fill="#91dbad" font-size="20" font-weight="700">SUMATRAN MALAY</text><text x="20" y="68" fill="#91dbad" font-size="20" font-weight="700">FEDERATION</text><text x="20" y="108" fill="#fff" font-size="17">Medan · Palembang</text><text x="20" y="150" fill="#a8bbc4" font-size="15">Oil, rubber, tin, ports</text><text x="20" y="179" fill="#a8bbc4" font-size="15">Loose sultanate federation</text><text x="20" y="208" fill="#a8bbc4" font-size="15">Strongest corporate control</text></g></g><path d="M170 525H1035" stroke="#d3aa52" stroke-width="4"/><text x="170" y="557" fill="#f2c079" font-family="Arial,sans-serif" font-size="16">Greater national bargaining power</text><text x="1035" y="557" text-anchor="end" fill="#91dbad" font-family="Arial,sans-serif" font-size="16">Greater corporate dependence</text><text x="60" y="610" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Comparative schematic · not a territorial scale</text></svg>
