<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">German cinema after victory</title>
  <desc id="desc">A timeline linking inherited UFA production to victory epics, dynastic romance, space documentary, and later military realism.</desc>
  <rect width="1200" height="760" fill="#0b1219"/>
  <text x="600" y="62" text-anchor="middle" fill="#f1ddb5" font-family="Georgia,serif" font-size="38">GERMAN CINEMA AFTER VICTORY</text>
  <text x="600" y="101" text-anchor="middle" fill="#9db0bd" font-family="Consolas,monospace" font-size="17">UFA CONTINUITY · STATE SPECTACLE · POPULAR GENRE · CONTROLLED DOUBT</text>
  <line x1="120" y1="354" x2="1080" y2="354" stroke="#72aec9" stroke-width="4"/>
  <g font-family="Consolas,monospace">
    <g transform="translate(80 157)"><rect width="220" height="148" rx="16" fill="#192630" stroke="#d36565" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1950</text><text x="110" y="76" text-anchor="middle" fill="#f1ddb5" font-size="18">DER SIEG IM OSTEN</text><text x="110" y="108" text-anchor="middle" fill="#b9c7cf" font-size="15">victory becomes</text><text x="110" y="130" text-anchor="middle" fill="#b9c7cf" font-size="15">settlement myth</text><line x1="110" y1="148" x2="110" y2="197" stroke="#72aec9" stroke-width="3"/></g>
    <g transform="translate(340 405)"><rect width="220" height="148" rx="16" fill="#192630" stroke="#739ac8" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1953</text><text x="110" y="76" text-anchor="middle" fill="#f1ddb5" font-size="18">GRAUE WÖLFE</text><text x="110" y="108" text-anchor="middle" fill="#b9c7cf" font-size="15">technical naval</text><text x="110" y="130" text-anchor="middle" fill="#b9c7cf" font-size="15">victory narrative</text><line x1="110" y1="-51" x2="110" y2="0" stroke="#72aec9" stroke-width="3"/></g>
    <g transform="translate(600 157)"><rect width="220" height="148" rx="16" fill="#192630" stroke="#bb7bc1" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1955–57</text><text x="110" y="76" text-anchor="middle" fill="#f1ddb5" font-size="18">SISSI</text><text x="110" y="108" text-anchor="middle" fill="#b9c7cf" font-size="15">dynastic romance</text><text x="110" y="130" text-anchor="middle" fill="#b9c7cf" font-size="15">normalizes inheritance</text><line x1="110" y1="148" x2="110" y2="197" stroke="#72aec9" stroke-width="3"/></g>
    <g transform="translate(860 405)"><rect width="220" height="148" rx="16" fill="#192630" stroke="#d6b54f" stroke-width="3"/><text x="110" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1957–75</text><text x="110" y="76" text-anchor="middle" fill="#f1ddb5" font-size="18">SPACE DOCUMENTARY</text><text x="110" y="108" text-anchor="middle" fill="#b9c7cf" font-size="15">real footage,</text><text x="110" y="130" text-anchor="middle" fill="#b9c7cf" font-size="15">political omission</text><line x1="110" y1="-51" x2="110" y2="0" stroke="#72aec9" stroke-width="3"/></g>
  </g>
  <text x="600" y="635" text-anchor="middle" fill="#f1ddb5" font-family="Georgia,serif" font-size="26">No rubble film. No divided Germany. No post-defeat New Cinema.</text>
  <text x="600" y="680" text-anchor="middle" fill="#9db0bd" font-family="Consolas,monospace" font-size="17">VICTORY EPIC · HEIMATFILM · KRIMI · COLONIAL ADVENTURE · SPACE SPECTACLE · MILITARY REALISM</text>
</svg>
