<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Software contract and chain of title</title>
  <desc id="desc">A diagram showing the origin of software rights in authorship and employment, their division into source and executable grants, and later translation, implementation, distribution, maintenance, and escrow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c28"/><stop offset="1" stop-color="#172b36"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7eb6c5"/></marker>
    <style>.t{font-family:Georgia,serif;fill:#f3ead8}.s{font-family:Arial,sans-serif;fill:#b9ced3}.box{fill:#213746;stroke:#7eb6c5;stroke-width:2}.accent{fill:#3c5965}.line{stroke:#7eb6c5;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8aa0a8;stroke-width:2;stroke-dasharray:7 7;fill:none}</style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="60" y="55" class="t" font-size="29">A software title is assembled, not merely possessed</text>
  <text x="60" y="83" class="s" font-size="15">Each arrow requires authority for the particular form, machine, territory, and act</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="210" height="105" rx="12" class="box"/><rect x="55" y="145" width="210" height="30" rx="12" class="accent"/>
    <text x="160" y="167" class="s" font-size="13" text-anchor="middle">ORIGIN</text><text x="160" y="207" class="t" font-size="23" text-anchor="middle">Authorship</text><text x="160" y="232" class="s" font-size="14" text-anchor="middle">creator · credit · contribution</text>
    <rect x="55" y="315" width="210" height="105" rx="12" class="box"/><rect x="55" y="315" width="210" height="30" rx="12" class="accent"/>
    <text x="160" y="337" class="s" font-size="13" text-anchor="middle">INSTITUTION</text><text x="160" y="377" class="t" font-size="23" text-anchor="middle">Employment</text><text x="160" y="402" class="s" font-size="14" text-anchor="middle">bureau · university · company</text>
    <rect x="365" y="120" width="220" height="112" rx="12" class="box"/><rect x="365" y="120" width="220" height="30" rx="12" class="accent"/>
    <text x="475" y="142" class="s" font-size="13" text-anchor="middle">FORM</text><text x="475" y="183" class="t" font-size="23" text-anchor="middle">Source control</text><text x="475" y="208" class="s" font-size="14" text-anchor="middle">inspect · alter · disclose</text>
    <rect x="365" y="335" width="220" height="112" rx="12" class="box"/><rect x="365" y="335" width="220" height="30" rx="12" class="accent"/>
    <text x="475" y="357" class="s" font-size="13" text-anchor="middle">USE</text><text x="475" y="398" class="t" font-size="23" text-anchor="middle">Executable grant</text><text x="475" y="423" class="s" font-size="14" text-anchor="middle">machines · sites · copies</text>
    <rect x="690" y="105" width="205" height="95" rx="12" class="box"/><text x="792" y="145" class="t" font-size="21" text-anchor="middle">Translation</text><text x="792" y="171" class="s" font-size="13" text-anchor="middle">language · notation · text</text>
    <rect x="690" y="230" width="205" height="95" rx="12" class="box"/><text x="792" y="270" class="t" font-size="21" text-anchor="middle">Implementation</text><text x="792" y="296" class="s" font-size="13" text-anchor="middle">cartridge · ROM · device</text>
    <rect x="690" y="355" width="205" height="95" rx="12" class="box"/><text x="792" y="395" class="t" font-size="21" text-anchor="middle">Distribution</text><text x="792" y="421" class="s" font-size="13" text-anchor="middle">media · territory · audience</text>
    <rect x="975" y="145" width="175" height="95" rx="12" class="box"/><text x="1062" y="184" class="t" font-size="21" text-anchor="middle">Maintenance</text><text x="1062" y="210" class="s" font-size="13" text-anchor="middle">repair · update · port</text>
    <rect x="975" y="315" width="175" height="95" rx="12" class="box"/><text x="1062" y="354" class="t" font-size="21" text-anchor="middle">Source escrow</text><text x="1062" y="380" class="s" font-size="13" text-anchor="middle">conditional continuity</text>
  </g>
  <path d="M265 198 C315 198 315 174 365 174" class="line"/><path d="M265 366 C315 366 315 392 365 392" class="line"/><path d="M265 198 C320 198 315 392 365 392" class="dash"/><path d="M265 366 C320 366 315 174 365 174" class="dash"/>
  <path d="M585 174 C635 174 640 152 690 152" class="line"/><path d="M585 174 C635 174 640 277 690 277" class="line"/><path d="M585 392 C640 392 640 402 690 402" class="line"/>
  <path d="M895 152 C940 152 940 192 975 192" class="line"/><path d="M895 277 C940 277 940 362 975 362" class="line"/><path d="M895 402 C945 402 940 192 975 192" class="dash"/>
  <text x="600" y="520" class="s" font-size="14" text-anchor="middle">Lucerne drafting names the grants; national law still decides whether the grantor possessed them.</text>
</svg>
