<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Canadian interceptor lineage, 1955–1968</title>
  <desc id="desc">The CF-100 Mk 4 Canuck leads to operational CF-105A and CF-105B Arrow generations; the 1968 Atlantic Accord validates rather than creates Canada's sovereign program.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08151e"/><stop offset="1" stop-color="#1a2730"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#d4b86a"/></marker><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="900" fill="url(#bg2)"/>
  <text x="82" y="76" fill="#f1dfb3" font-family="Georgia,serif" font-size="40">Canadian interceptor lineage</text>
  <text x="82" y="117" fill="#9fb1bd" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">ALL-WEATHER DEFENCE · ARCTIC RANGE · SOVEREIGN PRODUCTION</text>
  <path d="M120 475H1080" stroke="#d4b86a" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" filter="url(#s)">
    <g transform="translate(80 215)"><rect width="315" height="360" rx="12" fill="#18303c" stroke="#73a8be" stroke-width="2"/><text x="28" y="52" fill="#9cc9d9" font-size="21">1955</text><text x="28" y="98" fill="#f1dfb3" font-size="28" font-weight="700">CF-100 Mk 4</text><text x="28" y="132" fill="#f1dfb3" font-size="24">Canuck</text><path d="M28 160H287" stroke="#557180"/><text x="28" y="202" fill="#fff" font-size="18">ALL-WEATHER</text><text x="28" y="229" fill="#fff" font-size="18">INTERCEPTION</text><text x="28" y="274" fill="#b7c4ca" font-size="17">890 km/h</text><text x="28" y="302" fill="#b7c4ca" font-size="17">900 km radius</text><text x="28" y="330" fill="#b7c4ca" font-size="17">guns · rockets · missiles</text></g>
    <g transform="translate(442 215)"><rect width="315" height="360" rx="12" fill="#2c2939" stroke="#ae93c6" stroke-width="2"/><text x="28" y="52" fill="#ccb5df" font-size="21">1962</text><text x="28" y="98" fill="#f1dfb3" font-size="28" font-weight="700">CF-105A Arrow</text><path d="M28 160H287" stroke="#70647c"/><text x="28" y="202" fill="#fff" font-size="18">MACH 2 ARCTIC</text><text x="28" y="229" fill="#fff" font-size="18">INTERCEPTION</text><text x="28" y="274" fill="#c4bacb" font-size="17">2,250 km/h</text><text x="28" y="302" fill="#c4bacb" font-size="17">1,250 km radius</text><text x="28" y="330" fill="#c4bacb" font-size="17">eight long-range missiles</text></g>
    <g transform="translate(804 215)"><rect width="315" height="360" rx="12" fill="#353024" stroke="#d4b86a" stroke-width="2"/><text x="28" y="52" fill="#e0c97f" font-size="21">1968</text><text x="28" y="98" fill="#f1dfb3" font-size="28" font-weight="700">CF-105B Arrow</text><path d="M28 160H287" stroke="#766c4e"/><text x="28" y="202" fill="#fff" font-size="18">IMPROVED CONTINENTAL</text><text x="28" y="229" fill="#fff" font-size="18">INTERCEPTION</text><text x="28" y="274" fill="#d0c7ad" font-size="17">2,450 km/h</text><text x="28" y="302" fill="#d0c7ad" font-size="17">1,500 km radius</text><text x="28" y="330" fill="#d0c7ad" font-size="17">improved radar · 8 missiles</text></g>
  </g>
  <path d="M804 664H1119V789H804z" fill="#18262e" stroke="#7d94a1"/>
  <text x="827" y="703" fill="#f1dfb3" font-family="Arial,sans-serif" font-size="21" font-weight="700">1968 · Atlantic Accord</text>
  <text x="827" y="738" fill="#c0ccd2" font-family="Arial,sans-serif" font-size="17">Political validation of an existing</text><text x="827" y="764" fill="#c0ccd2" font-family="Arial,sans-serif" font-size="17">sovereign program—not its cause.</text>
  <path d="M962 664V582" stroke="#7d94a1" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="82" y="830" fill="#aebdc6" font-family="Arial,sans-serif" font-size="18">Domestic manufacture connects aircraft, radar, Arctic bases, trained crews, missiles, maintenance, and national command.</text>
</svg>
