<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Human operating system of an interplanetary spacecraft</title>
  <desc id="desc">A central shipboard household linked to command, watches, life support, medicine, communications, maintenance, and contingency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1420"/><stop offset="1" stop-color="#211a19"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9f7b47"/><stop offset="1" stop-color="#5d4330"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g fill="#fff" opacity=".22"><circle cx="74" cy="92" r="2"/><circle cx="215" cy="56" r="1"/><circle cx="1085" cy="97" r="2"/><circle cx="1135" cy="615" r="1.4"/><circle cx="120" cy="640" r="1.3"/></g>
  <text x="600" y="52" text-anchor="middle" fill="#eee6d8" font-family="Georgia,serif" font-size="29">The interplanetary ship as a human operating system</text>
  <text x="600" y="82" text-anchor="middle" fill="#a8acae" font-family="Arial,sans-serif" font-size="15">Vehicle · workplace · household · clinic · government · refuge</text>
  <g stroke="#9ea4aa" stroke-width="2" fill="none" opacity=".72"><path d="M470 285 L328 200"/><path d="M450 350 L300 350"/><path d="M470 420 L328 515"/><path d="M730 285 L872 200"/><path d="M750 350 L900 350"/><path d="M730 420 L872 515"/><path d="M600 470 L600 585"/></g>
  <g filter="url(#shadow)"><rect x="450" y="235" width="300" height="235" rx="22" fill="url(#core)" stroke="#c4a46c" stroke-width="2"/><text x="600" y="282" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">CLOSED CREW WORLD</text><text x="600" y="326" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="28">Shipboard life</text><text x="600" y="362" text-anchor="middle" fill="#f0dfc5" font-family="Arial,sans-serif" font-size="15">Months of local judgment</text><text x="600" y="389" text-anchor="middle" fill="#f0dfc5" font-family="Arial,sans-serif" font-size="15">with no prompt rescue or resupply</text><text x="600" y="432" text-anchor="middle" fill="#ead5b6" font-family="Arial,sans-serif" font-size="13">Every ordinary routine preserves emergency margin.</text></g>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g><rect x="58" y="135" width="270" height="125" rx="14" fill="#263243" stroke="#6784aa"/><text x="193" y="170" text-anchor="middle" fill="#dfeaf7" font-size="14" letter-spacing="1.5">COMMAND</text><text x="193" y="201" text-anchor="middle" fill="#fff" font-size="20">Delegated local authority</text><text x="193" y="230" text-anchor="middle" fill="#c4ceda" font-size="14">intent · limits · logs · succession</text></g>
    <g><rect x="30" y="295" width="270" height="110" rx="14" fill="#2e2a3f" stroke="#8278a8"/><text x="165" y="330" text-anchor="middle" fill="#e8e3f8" font-size="14" letter-spacing="1.5">WATCHES</text><text x="165" y="361" text-anchor="middle" fill="#fff" font-size="20">Work, sleep, and alarms</text><text x="165" y="389" text-anchor="middle" fill="#cbc7dc" font-size="14">cross-training · artificial day</text></g>
    <g><rect x="58" y="455" width="270" height="125" rx="14" fill="#27362e" stroke="#70917b"/><text x="193" y="490" text-anchor="middle" fill="#deebe2" font-size="14" letter-spacing="1.5">LIFE SUPPORT</text><text x="193" y="521" text-anchor="middle" fill="#fff" font-size="20">Food, water, and air</text><text x="193" y="550" text-anchor="middle" fill="#c7d4cb" font-size="14">stores · recovery · protected reserves</text></g>
    <g><rect x="872" y="135" width="270" height="125" rx="14" fill="#38272b" stroke="#a36b70"/><text x="1007" y="170" text-anchor="middle" fill="#f1dfe2" font-size="14" letter-spacing="1.5">MEDICINE</text><text x="1007" y="201" text-anchor="middle" fill="#fff" font-size="20">Care without evacuation</text><text x="1007" y="230" text-anchor="middle" fill="#d8c4c8" font-size="14">body · mind · delayed consultation</text></g>
    <g><rect x="900" y="295" width="270" height="110" rx="14" fill="#24353b" stroke="#668d98"/><text x="1035" y="330" text-anchor="middle" fill="#dceef2" font-size="14" letter-spacing="1.5">COMMUNICATIONS</text><text x="1035" y="361" text-anchor="middle" fill="#fff" font-size="20">Connected correspondence</text><text x="1035" y="389" text-anchor="middle" fill="#c1d3d7" font-size="14">family · experts · official traffic</text></g>
    <g><rect x="872" y="455" width="270" height="125" rx="14" fill="#342f25" stroke="#9b855e"/><text x="1007" y="490" text-anchor="middle" fill="#eee3ce" font-size="14" letter-spacing="1.5">MAINTENANCE</text><text x="1007" y="521" text-anchor="middle" fill="#fff" font-size="20">Repair before replacement</text><text x="1007" y="550" text-anchor="middle" fill="#d4c9b7" font-size="14">inspection · spares · fabrication · EVA</text></g>
    <g><rect x="440" y="570" width="320" height="115" rx="14" fill="#3b2d25" stroke="#af7f61"/><text x="600" y="606" text-anchor="middle" fill="#f3e0d4" font-size="14" letter-spacing="1.5">CONTINGENCY</text><text x="600" y="638" text-anchor="middle" fill="#fff" font-size="20">Refuge, reserve, and abort</text><text x="600" y="667" text-anchor="middle" fill="#dac8bd" font-size="14">survive now without consuming every later escape</text></g>
  </g>
  <text x="600" y="708" text-anchor="middle" fill="#898f93" font-family="Arial,sans-serif" font-size="13">Different national systems produce different commands; distance makes every one of them locally responsible.</text>
</svg>
