<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Formation of the Russian Far Eastern State</title><desc id="desc">Timeline from Japanese occupation committees through the First Far Eastern Republic, federal crisis, Zemsky Sobor, and mature monarchy.</desc>
  <defs><style>.bg{fill:#111718}.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:22px Arial,sans-serif;fill:#c9c7bd}.y{font:bold 25px Arial,sans-serif;fill:#fff}.b{stroke:#bfc6bf;stroke-width:2;rx:18}.a{fill:none;stroke:#efd274;stroke-width:6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efd274"/></marker></defs>
  <rect width="1200" height="720" class="bg"/><text x="60" y="66" class="h">FROM BUFFER REPUBLIC TO ELECTED CROWN</text><text x="60" y="103" class="s">The state is consolidated without claiming the whole Russian inheritance</text>
  <path d="M135 330H1060" class="a" marker-end="url(#m)"/>
  <g transform="translate(55 160)"><rect width="225" height="245" class="b" fill="#263c40"/><text x="112" y="55" text-anchor="middle" class="y">1945–1947</text><text x="112" y="95" text-anchor="middle" class="s">Occupation</text><text x="112" y="130" text-anchor="middle" class="s">committees</text><text x="112" y="180" text-anchor="middle" class="s">Rail · airfields</text><text x="112" y="212" text-anchor="middle" class="s">local councils</text></g>
  <g transform="translate(305 385)"><rect width="225" height="245" class="b" fill="#324753"/><text x="112" y="55" text-anchor="middle" class="y">1947–1951</text><text x="112" y="95" text-anchor="middle" class="s">First Far Eastern</text><text x="112" y="130" text-anchor="middle" class="s">Republic</text><text x="112" y="180" text-anchor="middle" class="s">Federal forms</text><text x="112" y="212" text-anchor="middle" class="s">divided power</text></g>
  <g transform="translate(555 160)"><rect width="225" height="245" class="b" fill="#57432e"/><text x="112" y="55" text-anchor="middle" class="y">1951–1954</text><text x="112" y="95" text-anchor="middle" class="s">Federal crisis</text><text x="112" y="145" text-anchor="middle" class="s">Cabinet collapses</text><text x="112" y="177" text-anchor="middle" class="s">provincial refusals</text><text x="112" y="209" text-anchor="middle" class="s">Japanese arbitration</text></g>
  <g transform="translate(805 385)"><rect width="225" height="245" class="b" fill="#4d3c50"/><text x="112" y="55" text-anchor="middle" class="y">1955–1956</text><text x="112" y="95" text-anchor="middle" class="s">Chita Restoration</text><text x="112" y="145" text-anchor="middle" class="s">Zemsky Sobor</text><text x="112" y="177" text-anchor="middle" class="s">elects Mikhail</text><text x="112" y="209" text-anchor="middle" class="s">Fundamental Law</text></g>
  <text x="1080" y="304" class="y">1985</text><text x="1080" y="342" class="s">Mature</text><text x="1080" y="374" class="s">dependent</text><text x="1080" y="406" class="s">sovereignty</text>
</svg>
