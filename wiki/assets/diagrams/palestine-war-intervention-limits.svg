<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Intervention limits in the Palestine War</title>
  <desc id="desc">Diagram showing British evacuation without succession, Italian restraint of Egypt Syria and Lebanon, permitted volunteers, a bounded Egyptian Gaza zone, and independent Jordanian intervention.</desc>
  <rect width="1200" height="700" fill="#101722"/>
  <text x="600" y="52" fill="#f4e7c3" font-family="Georgia,serif" font-size="30" text-anchor="middle">Intervention limits in the Palestine War</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="70" y="100" width="300" height="110" rx="8" fill="#24394c" stroke="#80a9c7" stroke-width="2"/>
    <text x="220" y="138" fill="#fff" font-size="20" font-weight="700">Britain</text>
    <text x="220" y="169" fill="#d7e5ef" font-size="16">Evacuation protocol</text>
    <text x="220" y="192" fill="#d7e5ef" font-size="16">No successor sovereignty</text>
    <rect x="450" y="100" width="300" height="110" rx="8" fill="#493a22" stroke="#d8b764" stroke-width="2"/>
    <text x="600" y="138" fill="#fff" font-size="20" font-weight="700">Italy</text>
    <text x="600" y="169" fill="#f3e3bd" font-size="16">Controls protected Arab states</text>
    <text x="600" y="192" fill="#f3e3bd" font-size="16">Localizes the conflict</text>
    <rect x="830" y="100" width="300" height="110" rx="8" fill="#24412f" stroke="#81bc90" stroke-width="2"/>
    <text x="980" y="138" fill="#fff" font-size="20" font-weight="700">Jordan</text>
    <text x="980" y="169" fill="#d4ead9" font-size="16">British-aligned, not Italian-controlled</text>
    <text x="980" y="192" fill="#d4ead9" font-size="16">Arab Legion may intervene</text>
    <path d="M220 210V286" stroke="#80a9c7" stroke-width="4" marker-end="url(#blue)"/>
    <path d="M600 210V286" stroke="#d8b764" stroke-width="4" marker-end="url(#gold)"/>
    <path d="M980 210V286" stroke="#81bc90" stroke-width="4" marker-end="url(#green)"/>
    <rect x="70" y="298" width="300" height="120" rx="8" fill="#1b2b39" stroke="#6e8ca2" stroke-width="2"/>
    <text x="220" y="337" fill="#fff" font-size="19" font-weight="700">Coastal authority vacuum</text>
    <text x="220" y="368" fill="#d7e5ef" font-size="15">Ports · roads · depots · cities</text>
    <text x="220" y="392" fill="#d7e5ef" font-size="15">Yishuv and Palestinian institutions</text>
    <rect x="425" y="282" width="350" height="72" rx="8" fill="#31506a" stroke="#77afd4" stroke-width="2"/>
    <text x="600" y="313" fill="#fff" font-size="18" font-weight="700">Permitted</text>
    <text x="600" y="338" fill="#d9e9f4" font-size="15">Volunteers · relief · fundraising · covert aid</text>
    <rect x="425" y="382" width="350" height="72" rx="8" fill="#5a2d2d" stroke="#d87b75" stroke-width="2"/>
    <text x="600" y="413" fill="#fff" font-size="18" font-weight="700">Prohibited</text>
    <text x="600" y="438" fill="#f1d7d5" font-size="15">Regular invasion · independent Arab command</text>
    <rect x="830" y="298" width="300" height="120" rx="8" fill="#31533a" stroke="#9bd0a7" stroke-width="2"/>
    <text x="980" y="337" fill="#fff" font-size="19" font-weight="700">Highland intervention</text>
    <text x="980" y="368" fill="#dceee0" font-size="15">Jerusalem · Nablus · Hebron</text>
    <text x="980" y="392" fill="#dceee0" font-size="15">Latrun · Jordan Valley</text>
    <path d="M600 454V510" stroke="#d8b764" stroke-width="4" marker-end="url(#gold)"/>
    <rect x="400" y="522" width="400" height="90" rx="8" fill="#4a3b2c" stroke="#d0a86b" stroke-width="2"/>
    <text x="600" y="556" fill="#fff" font-size="19" font-weight="700">Egyptian Gaza security zone</text>
    <text x="600" y="585" fill="#f0dfc4" font-size="15">Border and refugee mission · no northward offensive</text>
    <path d="M370 358H425" stroke="#80a9c7" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M775 358H830" stroke="#81bc90" stroke-width="3" marker-end="url(#green)"/>
    <path d="M220 418L420 612" stroke="#8a96a6" stroke-width="3"/>
    <path d="M980 418L780 612" stroke="#8a96a6" stroke-width="3"/>
    <rect x="310" y="620" width="580" height="54" rx="8" fill="#242c38" stroke="#8a96a6" stroke-width="2"/>
    <text x="600" y="654" fill="#fff" font-size="18" font-weight="700">Amman Settlement: coastal Israel · enlarged Jordan</text>
  </g>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#80a9c7"/></marker>
    <marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d8b764"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#81bc90"/></marker>
  </defs>
</svg>
