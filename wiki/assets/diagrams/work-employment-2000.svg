1028" y="331">care work</text><text x="1028" y="360">commuting</text></g></g><g stroke="#759faa" stroke-width="3" marker-end="url(#a)"><path d="M300 305h40"/><path d="M585 305h40"/><path d="M870 305h40"/></g><text x="600" y="490" fill="#a7babf" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">The decisive divide is often not machine versus worker, but recognized versus ceilinged status</text></svg>
