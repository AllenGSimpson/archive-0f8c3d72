<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">German submarine design schools, 1944 to 1985</title>
  <desc id="desc">The Type XXI and Type XXIII Elektroboot foundation divides into fast, stealth and AIP ambush, nuclear attack, conventional guided-missile, and transport schools. Founding types and approximate periods are shown; exact postwar construction and 1985 totals remain open.</desc>
  <defs>
    <style>
      .title{font:700 35px Georgia,serif;fill:#f0eadf}.sub{font:18px Arial,sans-serif;fill:#abb9bf}.head{font:700 17px Arial,sans-serif}.box{stroke-width:2}.label{font:700 17px Arial,sans-serif;fill:#fff}.copy{font:14px Arial,sans-serif;fill:#c7d3d8}.open{font:700 14px Arial,sans-serif;fill:#e6c271}.link{fill:none;stroke:#657f8a;stroke-width:3}.foundation{fill:#253b44;stroke:#638697}.fast{fill:#283f47;stroke:#79adbc}.stealth{fill:#203943;stroke:#5aa1b5}.nuclear{fill:#3a2e34;stroke:#a96d7c}.missile{fill:#3a3528;stroke:#aa8a4f}.transport{fill:#2c382e;stroke:#779272}
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#10181c"/>
  <text x="58" y="60" class="title">German submarine design schools · 1944–1985</text>
  <text x="58" y="96" class="sub">Founding types and approximate periods · exact postwar construction and active totals remain open</text>
  <path d="M600 192 V230 M600 230 H180 V282 M600 230 H405 V282 M600 230 H635 V282 M600 230 H870 V282 M600 230 H1070 V282" class="link"/>
  <g transform="translate(390 125)"><rect width="420" height="68" rx="12" class="box foundation"/><text x="210" y="28" text-anchor="middle" class="label">TYPE XXI · TYPE XXIII · 1944</text><text x="210" y="52" text-anchor="middle" class="copy">ocean and coastal Elektroboot foundation</text></g>
  <text x="58" y="258" class="head" fill="#e6c271">COMPLEMENTARY POSTWAR SCHOOLS</text>
  <g transform="translate(45 282)"><rect width="230" height="145" rx="12" class="box fast"/><text x="115" y="30" text-anchor="middle" class="label">FAST SCHOOL</text><text x="115" y="59" text-anchor="middle" class="copy">Type XXVI · 1945–47</text><text x="115" y="82" text-anchor="middle" class="copy">Type XXV · 1946–47 trials</text><text x="115" y="108" text-anchor="middle" class="copy">sprint and maneuverability</text><text x="115" y="132" text-anchor="middle" class="open">BUILD TOTALS OPEN</text></g>
  <g transform="translate(290 282)"><rect width="230" height="145" rx="12" class="box stealth"/><text x="115" y="30" text-anchor="middle" class="label">STEALTH / AIP</text><text x="115" y="59" text-anchor="middle" class="copy">Type XXIV A · c. 1951</text><text x="115" y="82" text-anchor="middle" class="copy">XXIV B · c. 1954–56</text><text x="115" y="105" text-anchor="middle" class="copy">Type XXIX · c. 1959–61</text><text x="115" y="132" text-anchor="middle" class="open">LAUERBOOT SCHOOL</text></g>
  <g transform="translate(535 282)"><rect width="200" height="145" rx="12" class="box nuclear"/><text x="100" y="30" text-anchor="middle" class="label">NUCLEAR ATTACK</text><text x="100" y="59" text-anchor="middle" class="copy">Type XXX · c. 1962</text><text x="100" y="82" text-anchor="middle" class="copy">Jagd-U-Boot founder</text><text x="100" y="108" text-anchor="middle" class="copy">later classes continue</text><text x="100" y="132" text-anchor="middle" class="open">IDENTITIES OPEN</text></g>
  <g transform="translate(750 282)"><rect width="230" height="145" rx="12" class="box missile"/><text x="115" y="30" text-anchor="middle" class="label">GUIDED MISSILE</text><text x="115" y="59" text-anchor="middle" class="copy">Type XXXI · late 1960s</text><text x="115" y="82" text-anchor="middle" class="copy">submerged conventional strike</text><text x="115" y="108" text-anchor="middle" class="copy">later derivatives continue</text><text x="115" y="132" text-anchor="middle" class="open">NAMES / TOTALS OPEN</text></g>
  <g transform="translate(995 282)"><rect width="160" height="145" rx="12" class="box transport"/><text x="80" y="30" text-anchor="middle" class="label">TRANSPORT</text><text x="80" y="58" text-anchor="middle" class="copy">XXVIII trials</text><text x="80" y="81" text-anchor="middle" class="copy">nuclear freight</text><text x="80" y="104" text-anchor="middle" class="copy">smaller transports</text><text x="80" y="132" text-anchor="middle" class="open">TOTALS OPEN</text></g>
  <path d="M160 455 H1080" class="link" stroke-dasharray="9 7"/>
  <g transform="translate(70 495)"><rect width="1060" height="142" rx="14" fill="#18262d" stroke="#587482" stroke-width="2"/><text x="530" y="34" text-anchor="middle" class="label">REGISTER BOUNDARIES</text><text x="530" y="65" text-anchor="middle" class="copy">Type XXXIII is not fixed as a later German nuclear class; Type XXXIV is not fixed as a later guided-missile class.</text><text x="530" y="92" text-anchor="middle" class="copy">Type XXVII and Type XXXII allocations, former category totals, and the small transport-class ledger are withdrawn.</text><text x="530" y="120" text-anchor="middle" class="open">THE DESIGN SCHOOLS ARE ESTABLISHED; THE COMPLETE POSTWAR HULL REGISTER IS NOT.</text></g>
  <text x="600" y="683" text-anchor="middle" class="sub">Fast performance, quiet ambush, nuclear endurance, conventional bombardment, and protected transport remained complementary missions.</text>
</svg>
