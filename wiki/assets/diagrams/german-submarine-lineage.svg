<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">German submarine lineage, 1944 to 1985</title><desc id="desc">Four submarine branches develop from the Type XXI and Type XXIII Elektroboot inheritance: conventional attack, nuclear attack, guided missile, and submersible transport.</desc>
  <rect width="1200" height="720" rx="24" fill="#10181c"/>
  <text x="58" y="60" fill="#f0eadf" font-family="Georgia,serif" font-size="35">German submarine lineages · 1944–1985</text>
  <text x="58" y="96" fill="#abb9bf" font-family="Arial,sans-serif" font-size="18">Registered introductions and active front-line strength at 1 January 1985</text>
  <g font-family="Arial,sans-serif">
    <line x1="150" y1="138" x2="1110" y2="138" stroke="#54717d" stroke-width="3"/>
    <g fill="#9fb2ba" font-size="14" text-anchor="middle"><text x="150" y="126">1944</text><text x="310" y="126">1951</text><text x="470" y="126">1960</text><text x="630" y="126">1967</text><text x="790" y="126">1974</text><text x="950" y="126">1981</text><text x="1110" y="126">1985</text></g>
    <g stroke="#54717d" stroke-width="2"><line x1="150" y1="131" x2="150" y2="145"/><line x1="310" y1="131" x2="310" y2="145"/><line x1="470" y1="131" x2="470" y2="145"/><line x1="630" y1="131" x2="630" y2="145"/><line x1="790" y1="131" x2="790" y2="145"/><line x1="950" y1="131" x2="950" y2="145"/><line x1="1110" y1="131" x2="1110" y2="145"/></g>
    <text x="58" y="204" fill="#e6c271" font-size="18" font-weight="700">FOUNDATION</text>
    <rect x="190" y="170" width="290" height="74" rx="12" fill="#253b44" stroke="#638697"/><text x="210" y="201" fill="#fff" font-size="19" font-weight="700">Type XXI · Type XXIII</text><text x="210" y="225" fill="#c2d0d5" font-size="15">Ocean and coastal Elektroboote</text>
    <path d="M480 207 H535 V278" fill="none" stroke="#e6c271" stroke-width="3"/>
    <text x="58" y="320" fill="#82c5d6" font-size="18" font-weight="700">CONVENTIONAL ATTACK</text>
    <g fill="#203943" stroke="#5aa1b5"><rect x="210" y="278" width="180" height="78" rx="12"/><rect x="420" y="278" width="180" height="78" rx="12"/><rect x="630" y="278" width="180" height="78" rx="12"/><rect x="840" y="278" width="180" height="78" rx="12"/></g>
    <g fill="#fff" font-size="18" font-weight="700"><text x="230" y="307">Type XXIV</text><text x="440" y="307">Type XXVII</text><text x="650" y="307">Type XXIX</text><text x="860" y="307">Type XXXII</text></g><g fill="#bfd0d6" font-size="14"><text x="230" y="332">1951 · 16 active</text><text x="440" y="332">1954 · 10 active</text><text x="650" y="332">1960 · 0 active</text><text x="860" y="332">1972 · 16 active</text></g>
    <text x="58" y="432" fill="#d39aa8" font-size="18" font-weight="700">NUCLEAR ATTACK</text>
    <g fill="#3a2e34" stroke="#a96d7c"><rect x="510" y="390" width="210" height="78" rx="12"/><rect x="810" y="390" width="210" height="78" rx="12"/></g>
    <g fill="#fff" font-size="18" font-weight="700"><text x="530" y="419">Type XXX</text><text x="830" y="419">Type XXXIII</text></g><g fill="#d6c3c8" font-size="14"><text x="530" y="444">1962 · 10 active</text><text x="830" y="444">1974 · 14 active</text></g>
    <text x="58" y="544" fill="#d8b670" font-size="18" font-weight="700">GUIDED MISSILE</text>
    <g fill="#3a3528" stroke="#aa8a4f"><rect x="600" y="502" width="210" height="78" rx="12"/><rect x="900" y="502" width="210" height="78" rx="12"/></g>
    <g fill="#fff" font-size="18" font-weight="700"><text x="620" y="531">Type XXXI</text><text x="920" y="531">Type XXXIV</text></g><g fill="#d6cdb8" font-size="14"><text x="620" y="556">1967 · 8 active combat</text><text x="920" y="556">1981 · 6 active</text></g>
    <text x="58" y="656" fill="#9eb49b" font-size="18" font-weight="700">TRANSPORT</text>
    <g fill="#2c382e" stroke="#779272"><rect x="390" y="614" width="190" height="66" rx="12"/><rect x="660" y="614" width="190" height="66" rx="12"/><rect x="920" y="614" width="190" height="66" rx="12"/></g>
    <g fill="#fff" font-size="16" font-weight="700"><text x="410" y="642">XXVIII · 1959</text><text x="680" y="642">XXXI/T · 1974</text><text x="940" y="642">XXXV · 1982</text></g><g fill="#c9d3c8" font-size="13"><text x="410" y="663">2 reserve / commercial</text><text x="680" y="663">2 operational</text><text x="940" y="663">2 operational</text></g>
  </g>
</svg>
