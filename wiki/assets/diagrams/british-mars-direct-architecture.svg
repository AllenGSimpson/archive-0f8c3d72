<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">British Mars Direct architecture</title>
  <desc id="desc">Diagram showing the transfer and habitation vehicle, prepositioned return system, surface lander, Valles Marineris expedition, and Commonwealth communications chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset="1" stop-color="#13253a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#d5b25b"/></marker>
    <style>.title{font:700 40px Georgia,serif;fill:#f2ead8}.sub{font:600 17px Arial,sans-serif;letter-spacing:3px;fill:#a8bfd5}.box{fill:#10283e;stroke:#527b9f;stroke-width:3;rx:18}.mars{fill:#33231f;stroke:#a66a52;stroke-width:3;rx:18}.head{font:700 21px Georgia,serif;fill:#f4ead7}.copy{font:16px Arial,sans-serif;fill:#cfdae4}.label{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#d5b25b}.line{stroke:#d5b25b;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#6e93b4;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}.foot{font:15px Arial,sans-serif;fill:#aec0d0}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" class="title">BRITISH MARS DIRECT ARCHITECTURE</text>
  <text x="800" y="105" text-anchor="middle" class="sub">SOVEREIGN ACCESS THROUGH CONCENTRATION, NOT SCALE</text>
  <rect x="55" y="205" width="320" height="230" class="box"/><text x="215" y="248" text-anchor="middle" class="head">EARTH AND COMMONWEALTH</text><text x="215" y="288" text-anchor="middle" class="copy">Launch and Earth-orbit docking</text><text x="215" y="320" text-anchor="middle" class="copy">Distributed national workshare</text><text x="215" y="352" text-anchor="middle" class="copy">Resolution support if required</text><text x="215" y="395" text-anchor="middle" class="label">NO LUNAR STAGING</text>
  <rect x="500" y="175" width="400" height="290" class="box"/><text x="700" y="220" text-anchor="middle" class="head">TRANSFER AND HABITATION VEHICLE</text><text x="700" y="260" text-anchor="middle" class="copy">Small crew · long-duration living</text><text x="700" y="292" text-anchor="middle" class="copy">Command · stores · life support</text><text x="700" y="324" text-anchor="middle" class="copy">Principal interplanetary transfer</text><line x1="555" y1="355" x2="845" y2="355" stroke="#527b9f" stroke-width="2"/><text x="700" y="395" text-anchor="middle" class="copy">Exact stages and propulsion open</text><text x="700" y="430" text-anchor="middle" class="label">ONE CONCENTRATED CREW VEHICLE</text>
  <path d="M375 320H500" class="line"/>
  <rect x="1040" y="145" width="500" height="200" class="mars"/><text x="1290" y="190" text-anchor="middle" class="head">WESTERN VALLES MARINERIS LANDER</text><text x="1290" y="230" text-anchor="middle" class="copy">Entry · descent · landing · surface refuge</text><text x="1290" y="262" text-anchor="middle" class="copy">Geology · atmosphere · navigation · life support</text><text x="1290" y="305" text-anchor="middle" class="label">LIMITED 1998 SURFACE EXPEDITION</text>
  <rect x="1040" y="455" width="500" height="200" class="mars"/><text x="1290" y="500" text-anchor="middle" class="head">PREPOSITIONED RETURN SYSTEM</text><text x="1290" y="540" text-anchor="middle" class="copy">Delivered and checked before the crew</text><text x="1290" y="572" text-anchor="middle" class="copy">Surface, orbit, and Earth-return division open</text><text x="1290" y="615" text-anchor="middle" class="label">DEMONSTRATED DEPARTURE CAPABILITY</text>
  <path d="M900 270H1040" class="line"/><path d="M1290 345V455" class="line"/>
  <rect x="190" y="600" width="650" height="150" class="box"/><text x="515" y="643" text-anchor="middle" class="head">COMMONWEALTH VALLES COMMUNICATIONS CHAIN</text><text x="515" y="683" text-anchor="middle" class="copy">Mapping · weather · navigation · surface relay · tracking · return</text><text x="515" y="718" text-anchor="middle" class="label">THE ROUTE IS THE STRATEGIC POSSESSION</text>
  <path d="M840 650Q950 650 1040 580" class="dash"/><path d="M840 630Q960 500 1040 270" class="dash"/><path d="M515 600Q515 505 640 465" class="dash"/>
  <text x="800" y="830" text-anchor="middle" class="foot">The mission proved access and return; it did not promise a permanent Mars settlement.</text>
</svg>
