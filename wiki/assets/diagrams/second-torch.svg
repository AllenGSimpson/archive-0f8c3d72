<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Second Torch</title><desc id="d">A British East Falkland lodgment is compressed by an intact Argentine defensive network.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#e19483"/></marker></defs><rect width="1200" height="520" rx="24" fill="#09151e"/><text x="600" y="55" text-anchor="middle" fill="#f4f3e9" font-family="Georgia,serif" font-size="32">SECOND TORCH · JULY 1984</text><g font-family="Arial,sans-serif"><rect x="455" y="185" width="290" height="150" rx="18" fill="#153a50" stroke="#82c4df" stroke-width="3"/><text x="600" y="230" text-anchor="middle" fill="#fff" font-size="24">BRITISH LODGMENT</text><text x="600" y="267" text-anchor="middle" fill="#d5eff8" font-size="18">battalions ashore</text><text x="600" y="298" text-anchor="middle" fill="#d5eff8" font-size="18">reinforcement unsustainable</text><g fill="#3f2928" stroke="#dd8d7e" stroke-width="2"><rect x="70" y="120" width="230" height="65" rx="12"/><rect x="70" y="225" width="230" height="65" rx="12"/><rect x="70" y="330" width="230" height="65" rx="12"/><rect x="900" y="120" width="230" height="65" rx="12"/><rect x="900" y="225" width="230" height="65" rx="12"/><rect x="900" y="330" width="230" height="65" rx="12"/></g><g fill="#ffe4df" font-size="18" text-anchor="middle"><text x="185" y="160">AIR ATTACK</text><text x="185" y="265">ANTI-SHIP MISSILES</text><text x="185" y="370">ARTILLERY</text><text x="1015" y="160">MINES</text><text x="1015" y="265">ELECTRONIC WARFARE</text><text x="1015" y="370">PREPARED INFANTRY</text></g><path d="M300 152L447 225M300 257L447 257M300 362L447 295M900 152L753 225M900 257L753 257M900 362L753 295" stroke="#e19483" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="410" width="420" height="62" rx="31" fill="#4d2125" stroke="#ff9c9c" stroke-width="2"/><text x="600" y="449" text-ancho