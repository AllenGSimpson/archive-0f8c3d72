<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Rockwell assassination and investigation</title><desc id="desc">A five-stage timeline from Rockwell's 1975 assassination to Buchanan's restraint, a defective prosecution, execution, and the 1978 Rockwell Commission.</desc><defs><style>.bg{fill:#111714}.box{fill:#1b231e;stroke:#68776c;stroke-width:2}.cream{fill:#eee7d8}.gold{fill:#d4b875}.cyan{fill:#45c7d6}.red{fill:#c56e70}.muted{fill:#aeb8ad}.line{stroke:#87958a;stroke-width:5}.head{font:700 24px Georgia,serif}.date{font:700 19px Arial,sans-serif;letter-spacing:1px}.copy{font:17px Arial,sans-serif}</style></defs><rect class="bg" width="1400" height="700"/><text x="65" y="62" class="head gold">THE ROCKWELL ASSASSINATION AND CRISIS OF PROOF</text><text x="65" y="95" class="copy muted">PUBLIC CERTAINTY COLLAPSED BETWEEN THE 1975 ATTACK AND THE 1978 COMMISSION</text><line x1="120" y1="350" x2="1280" y2="350" class="line"/><g transform="translate(45 150)"><rect width="240" height="400" rx="18" class="box"/><text x="24" y="48" class="date red">1975 · ATTACK</text><text x="24" y="93" class="head cream">Campaign speech</text><text x="24" y="136" class="copy cream">Prepared rifle position</text><text x="24" y="168" class="copy cream">Rockwell killed</text><text x="24" y="223" class="copy muted">Actual rifleman escapes</text><text x="24" y="255" class="copy muted">Public identity unknown</text><text x="24" y="326" class="copy cyan">Accelerationist purpose:</text><text x="24" y="358" class="copy cyan">provoke rebellion</text></g><g transform="translate(312 150)"><rect width="240" height="400" rx="18" class="box"/><text x="24" y="48" class="date cyan">IMMEDIATE</text><text x="24" y="93" class="head cream">Buchanan restrains</text><text x="24" y="136" class="copy cream">No retaliation</text><text x="24" y="168" class="copy cream">Protect institutions</text><text x="24" y="200" class="copy cream">Win lawfully</text><text x="24" y="275" class="copy muted">Killer's political aim</text><text x="24" y="307" class="copy muted">fails</text></g><g transform="translate(579 150)"><rect width="240" height="400" rx="18" class="box"/><text x="24" y="48" class="date red">PROSECUTION</text><text x="24" y="93" class="head cream">Defective case</text><text x="24" y="136" class="copy cream">Anti-Rockwell eccentric</text><text x="24" y="168" class="copy cream">Unreliable confession</text><text x="24" y="200" class="copy cream">Suppressed evidence</text><text x="24" y="275" class="copy muted">Capital process</text><text x="24" y="307" class="copy muted">accelerated</text></g><g transform="translate(846 150)"><rect width="240" height="400" rx="18" class="box"/><text x="24" y="48" class="date red">EXECUTION</text><text x="24" y="93" class="head cream">Closure imposed</text><text x="24" y="136" class="copy cream">Conviction completed</text><text x="24" y="168" class="copy cream">Defendant executed</text><text x="24" y="243" class="copy muted">Later evidence makes</text><text x="24" y="275" class="copy muted">innocence probable</text></g><g transform="translate(1113 150)"><rect width="240" height="400" rx="18" class="box"/><text x="24" y="48" class="date gold">1978 · INQUIRY</text><text x="24" y="93" class="head cream">Rockwell Commission</text><text x="24" y="136" class="copy cream">Official case rejected</text><text x="24" y="168" class="copy cream">Suppression documented</text><text x="24" y="200" class="copy cream">Relief recommended</text><text x="24" y="275" class="copy cyan">Actual assassin still</text><text x="24" y="307" class="copy cyan">unidentified publicly</text></g></svg>
