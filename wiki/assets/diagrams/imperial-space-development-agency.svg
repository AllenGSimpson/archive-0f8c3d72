<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Imperial Space Development Agency seal</title><desc id="desc">Archive reconstruction of a Japanese imperial space agency emblem combining the sun, orbit, and three service paths.</desc>
  <defs><radialGradient id="sun"><stop stop-color="#e6c35b"/><stop offset="1" stop-color="#c7392f"/></radialGradient><linearGradient id="agbg" x2="1" y2="1"><stop stop-color="#101714"/><stop offset="1" stop-color="#1e231f"/></linearGradient><pattern id="aggrid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8ca08f" stroke-opacity=".1"/></pattern></defs>
  <rect width="1200" height="720" fill="url(#agbg)"/><rect width="1200" height="720" fill="url(#aggrid)"/>
  <g transform="translate(600 350)"><circle r="205" fill="none" stroke="#c8a84e" stroke-width="5"/><circle r="142" fill="none" stroke="#e8e3d7" stroke-width="3" stroke-dasharray="8 12"/><ellipse rx="285" ry="95" fill="none" stroke="#e8e3d7" stroke-width="5" transform="rotate(-24)"/><ellipse rx="285" ry="95" fill="none" stroke="#c8a84e" stroke-width="3" transform="rotate(38)"/><circle r="78" fill="url(#sun)" stroke="#f4ead0" stroke-width="5"/><g fill="#e8e3d7"><circle cx="-254" cy="105" r="13"/><circle cx="226" cy="-96" r="13"/><circle cx="196" cy="145" r="10"/></g></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="72" fill="#c8a84e" font-size="22" letter-spacing="6">CABINET DEVELOPMENT AGENCY · FROM 1965</text><text x="600" y="650" fill="#f0ede4" font-size="38" font-family="Georgia, serif">Imperial Space Development Agency</text><text x="600" y="687" fill="#a8aaa5" font-size="17" letter-spacing="3">CIVIL LAUNCHERS · SATELLITES · TRACKING · SAFETY · PROCUREMENT</text></g>
</svg>
