<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sequence of the Second Israeli–Jordanian War</title><desc id="desc">A timeline from the July 1951 assassination of Abdullah through succession crisis, frontier war, Israeli offensive, foreign pressure, and the 1954 ceasefire.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#11191c"/><stop offset="1" stop-color="#202a2c"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#cab77a"/></marker><style>.title{font:700 39px Georgia,serif;fill:#f6f0e4}.sub{font:18px system-ui,sans-serif;letter-spacing:3px;fill:#b6c5c5}.axis{stroke:#cab77a;stroke-width:5;marker-end:url(#arr)}.tick{stroke:#cab77a;stroke-width:4}.card{fill:#283536;stroke:#789091;stroke-width:3}.crisis{fill:#3e3030;stroke:#c68d7e;stroke-width:3}.war{fill:#3c3728;stroke:#d2b75d;stroke-width:4}.head{font:700 22px system-ui,sans-serif;fill:#fff}.copy{font:17px system-ui,sans-serif;fill:#ccd7d5}.date{font:700 18px system-ui,sans-serif;fill:#e2ce91}.foot{font:italic 18px Georgia,serif;fill:#d7d6ce}</style></defs>
  <rect width="1400" height="820" rx="24" fill="url(#bg)"/><text x="70" y="72" class="title">From assassination to limited ceasefire</text><text x="70" y="108" class="sub">SECOND ISRAELI–JORDANIAN WAR · 1951–54</text>
  <line x1="110" y1="650" x2="1300" y2="650" class="axis"/>
  <g transform="translate(70 170)"><rect width="242" height="160" rx="14" class="crisis"/><text x="18" y="40" class="date">20 JULY 1951</text><text x="18" y="78" class="head">Abdullah killed</text><text x="18" y="110" class="copy">Jerusalem assassination</text><text x="18" y="137" class="copy">Talal succeeds</text><line x1="121" y1="160" x2="121" y2="480" class="tick"/></g>
  <g transform="translate(330 365)"><rect width="242" height="160" rx="14" class="card"/><text x="18" y="40" class="date">1951–52</text><text x="18" y="78" class="head">Succession crisis</text><text x="18" y="110" class="copy">palace · Legion · Britain</text><text x="18" y="137" class="copy">Palestinian and Iraqi pressure</text><line x1="121" y1="160" x2="121" y2="125" class="tick"/></g>
  <g transform="translate(590 170)"><rect width="242" height="160" rx="14" class="card"/><text x="18" y="40" class="date">1952–53</text><text x="18" y="78" class="head">Frontier war</text><text x="18" y="110" class="copy">raids · reprisals · water</text><text x="18" y="137" class="copy">roads · refugees · holy places</text><line x1="121" y1="160" x2="121" y2="480" class="tick"/></g>
  <g transform="translate(850 365)"><rect width="242" height="160" rx="14" class="war"/><text x="18" y="40" class="date">1953–54</text><text x="18" y="78" class="head">Israeli offensive</text><text x="18" y="110" class="copy">western Jerusalem · corridor</text><text x="18" y="137" class="copy">limited frontier corrections</text><line x1="121" y1="160" x2="121" y2="125" class="tick"/></g>
  <g transform="translate(1110 170)"><rect width="242" height="160" rx="14" class="card"/><text x="18" y="40" class="date">1954</text><text x="18" y="78" class="head">Ceasefire</text><text x="18" y="110" class="copy">British–Italian pressure</text><text x="18" y="137" class="copy">Amman order survives</text><line x1="121" y1="160" x2="121" y2="480" class="tick"/></g>
  <text x="700" y="744" text-anchor="middle" class="foot">The certified line, operation names, commanders, and losses remain open canon.</text>
</svg>
