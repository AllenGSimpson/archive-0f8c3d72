<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional and legal order of the Greater German Reich</title><desc id="desc">Institutional diagram linking the Führer and leadership law to the Reich Leadership Council, government, Party, Reichstag, courts, citizenship, and imperial territories.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141414"/><stop offset="1" stop-color="#28221f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".4"/></filter></defs>
  <rect width="1200" height="700" rx="26" fill="url(#bg)"/>
  <g fill="none" stroke="#a9977d" stroke-width="3" opacity=".85"><path d="M600 150v62M600 212H245v78M600 212h355v78M600 212v78M245 380v70M600 380v70M955 380v70M245 540h710M600 540v75"/></g>
  <g filter="url(#shadow)" font-family="Georgia,serif" text-anchor="middle">
    <rect x="400" y="40" width="400" height="110" rx="14" fill="#3b2624" stroke="#b98372" stroke-width="3"/><text x="600" y="82" fill="#f4ded5" font-size="29">Führer and Leadership Law</text><text x="600" y="117" fill="#d5bab1" font-size="17">direction · appointment · exception · succession</text>
    <rect x="75" y="290" width="340" height="90" rx="12" fill="#302c28" stroke="#ac9b7d" stroke-width="2"/><text x="245" y="328" fill="#eee6d9" font-size="25">Reich Leadership Council</text><text x="245" y="357" fill="#cec2ae" font-size="16">collective preparation and settlement</text>
    <rect x="430" y="290" width="340" height="90" rx="12" fill="#302c28" stroke="#ac9b7d" stroke-width="2"/><text x="600" y="328" fill="#eee6d9" font-size="25">Reich Government</text><text x="600" y="357" fill="#cec2ae" font-size="16">laws · ministries · budgets · administration</text>
    <rect x="785" y="290" width="340" height="90" rx="12" fill="#302c28" stroke="#ac9b7d" stroke-width="2"/><text x="955" y="328" fill="#eee6d9" font-size="25">NSDAP and Orders</text><text x="955" y="357" fill="#cec2ae" font-size="16">cadres · doctrine · political formation</text>
    <rect x="75" y="450" width="340" height="90" rx="12" fill="#263038" stroke="#7793a4" stroke-width="2"/><text x="245" y="488" fill="#e1ebf0" font-size="25">Reichstag</text><text x="245" y="517" fill="#b9cad4" font-size="16">acclamation · declaration · consent</text>
    <rect x="430" y="450" width="340" height="90" rx="12" fill="#263038" stroke="#7793a4" stroke-width="2"/><text x="600" y="488" fill="#e1ebf0" font-size="25">Courts</text><text x="600" y="517" fill="#b9cad4" font-size="16">ordinary law · political jurisdiction</text>
    <rect x="785" y="450" width="340" height="90" rx="12" fill="#263038" stroke="#7793a4" stroke-width="2"/><text x="955" y="488" fill="#e1ebf0" font-size="25">Administration and Audit</text><text x="955" y="517" fill="#b9cad4" font-size="16">status · records · permits · supervision</text>
    <rect x="280" y="615" width="640" height="55" rx="12" fill="#3a3023" stroke="#b79b5d" stroke-width="2"/><text x="600" y="649" fill="#f0e2be" font-size="23">Unequal citizens, subjects, settlers, clients, and colonial peoples</text>
  </g>
</svg>
