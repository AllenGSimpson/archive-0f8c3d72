<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">American orbital aircraft lineage</title>
  <desc id="desc">Timeline from Pathfinder through Columbia, Liberty, Hercules, Ranger, Enterprise, and Zenith.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#122c43"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#79d7ff"/></marker>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <text x="70" y="66" fill="#edf8ff" font-family="Georgia,serif" font-size="34" font-weight="700">American orbital aircraft lineage</text>
  <text x="70" y="102" fill="#9eb8c9" font-family="Arial,sans-serif" font-size="18">Self-powered horizontal takeoff · one airframe to orbit and back</text>
  <path d="M115 315 H1080" stroke="#79d7ff" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 170)"><rect width="190" height="118" rx="14" fill="#123e59" stroke="#79d7ff"/><text x="18" y="34" fill="#82dcff" font-size="16">1969/70 · XO-1/O-1</text><text x="18" y="66" fill="white" font-size="24" font-weight="700">PATHFINDER</text><text x="18" y="94" fill="#b7ccda" font-size="15">Proof + reconnaissance</text></g>
    <g transform="translate(285 340)"><rect width="190" height="118" rx="14" fill="#24435e" stroke="#85b6e8"/><text x="18" y="34" fill="#9ac8f5" font-size="16">1971 · O-2A/2B</text><text x="18" y="66" fill="white" font-size="24" font-weight="700">COLUMBIA</text><text x="18" y="94" fill="#c2d0df" font-size="15">Moon and tanker pair</text></g>
    <g transform="translate(500 170)"><rect width="190" height="118" rx="14" fill="#1f5362" stroke="#77e0d7"/><text x="18" y="34" fill="#8deade" font-size="16">1972/74 · O-3</text><text x="18" y="66" fill="white" font-size="24" font-weight="700">LIBERTY</text><text x="18" y="94" fill="#c1dfdc" font-size="15">Routine and automatic</text></g>
    <g transform="translate(715 340)"><rect width="190" height="118" rx="14" fill="#4c4530" stroke="#ffd36e"/><text x="18" y="34" fill="#ffe091" font-size="16">1976 · O-4A</text><text x="18" y="66" fill="white" font-size="24" font-weight="700">HERCULES</text><text x="18" y="94" fill="#e0d6b8" font-size="15">Heavy orbital cargo</text></g>
    <g transform="translate(930 170)"><rect width="190" height="118" rx="14" fill="#304c3d" stroke="#8de6ae"/><text x="18" y="34" fill="#9cf0ba" font-size="16">1979 · O-5A</text><text x="18" y="66" fill="white" font-size="24" font-weight="700">RANGER</text><text x="18" y="94" fill="#c7ddce" font-size="15">Service and rescue</text></g>
  </g>
  <path d="M1025 315 V475 H550" fill="none" stroke="#79d7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(340 455)"><rect width="210" height="112" rx="14" fill="#3f385a" stroke="#c3a8ff"/><text x="18" y="32" fill="#d4c0ff" font-size="16">1983 · O-6A</text><text x="18" y="64" fill="white" font-size="24" font-weight="700">ENTERPRISE</text><text x="18" y="91" fill="#d5cde4" font-size="15">High-frequency transport</text></g>
    <g transform="translate(85 455)"><rect width="210" height="112" rx="14" fill="#57343d" stroke="#ff9cad"/><text x="18" y="32" fill="#ffb3c1" font-size="16">1984 · O-7A</text><text x="18" y="64" fill="white" font-size="24" font-weight="700">ZENITH</text><text x="18" y="91" fill="#e6c8cf" font-size="15">Orbital security branch</text></g>
  </g>
  <text x="785" y="555" fill="#9eb8c9" font-family="Arial,sans-serif" font-size="16">Roles specialize as traffic grows; no single vehicle replaces the fleet.</text>
</svg>
