<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Australasian defence system</title><desc id="desc">Australia and New Zealand contribute distinct national capabilities through common boards without forming a federal ANZAC state.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131d"/><stop offset="1" stop-color="#1b2937"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000" flood-opacity=".44"/></filter><style>.ey{font:600 21px Arial,sans-serif;letter-spacing:5px;fill:#83d2db}.ttl{font:700 48px Georgia,serif;fill:#f4efe4}.sub{font:21px Arial,sans-serif;fill:#b7c4cb}.head{font:700 24px Arial,sans-serif;fill:#f6f0e5}.copy{font:18px Arial,sans-serif;fill:#cbd5da}.tiny{font:16px Arial,sans-serif;fill:#aab8c0}.au{fill:#172f48;stroke:#567fa6;stroke-width:2}.nz{fill:#263a34;stroke:#719980;stroke-width:2}.joint{fill:#433b28;stroke:#c2a85d;stroke-width:2}.line{stroke:#cdb568;stroke-width:5;fill:none}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="76" y="72" class="ey">FORTRESS COMMONWEALTH · SOUTHERN PACIFIC</text><text x="76" y="132" class="ttl">Cooperation without federation</text><text x="76" y="174" class="sub">Two sovereign realms combine complementary capabilities while retaining national budgets, commands, and deployment decisions.</text>
  <g filter="url(#shadow)"><rect x="90" y="245" width="510" height="485" rx="28" class="au"/><text x="130" y="300" class="head">AUSTRALIA · SOUTHERN ARSENAL</text><text x="130" y="352" class="copy">Heavy maintenance and munitions</text><text x="130" y="394" class="copy">Long-range aviation and northern bases</text><text x="130" y="436" class="copy">Shipbuilding, vehicles, radar, and missiles</text><text x="130" y="478" class="copy">Woomera testing, launch, and recovery</text><text x="130" y="520" class="copy">Indian Ocean and continental logistics</text><path d="M130 565H560" stroke="#567fa6"/><text x="130" y="610" class="tiny">Strategic strength: scale, industry, range geography,</text><text x="130" y="640" class="tiny">and the ability to sustain major regional forces.</text>
  <rect x="1000" y="245" width="510" height="485" rx="28" class="nz"/><text x="1040" y="300" class="head">NEW ZEALAND · MARITIME STATE</text><text x="1040" y="352" class="copy">Anti-submarine warfare and patrol</text><text x="1040" y="394" class="copy">Food, stores, maintenance, and repair</text><text x="1040" y="436" class="copy">South Pacific access and expeditionary troops</text><text x="1040" y="478" class="copy">Signals, weather, tracking, and timing</text><text x="1040" y="520" class="copy">Ocean rescue and recovery support</text><path d="M1040 565H1470" stroke="#719980"/><text x="1040" y="610" class="tiny">Strategic strength: dependable specialized services,</text><text x="1040" y="640" class="tiny">maritime knowledge, and long-baseline geography.</text>
  <rect x="625" y="330" width="350" height="310" rx="26" class="joint"/><text x="800" y="382" text-anchor="middle" class="head">COMMON BOARDS</text><text x="800" y="432" text-anchor="middle" class="copy">Planning · intelligence</text><text x="800" y="470" text-anchor="middle" class="copy">Procurement · standards</text><text x="800" y="508" text-anchor="middle" class="copy">Exercises · communications</text><text x="800" y="546" text-anchor="middle" class="copy">Operation-specific command</text><path d="M670 579H930" stroke="#8a7944"/><text x="800" y="612" text-anchor="middle" class="tiny">No federal ANZAC government</text></g>
  <path d="M600 485H625M975 485H1000" class="line"/><rect x="340" y="778" width="920" height="70" rx="18" fill="#10232d" stroke="#52707c"/><text x="800" y="822" text-anchor="middle" class="copy">Joint action is negotiated; sovereignty and final deployment authority remain national.</text>
</svg>
