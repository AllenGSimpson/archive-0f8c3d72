<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">National Recovery and Enterprise Act</title><desc id="d">The 1949 recovery settlement retains a bounded social floor and directs incentives toward private investment.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1520"/><stop offset="1" stop-color="#24313a"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#7fa1ae"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f1f5f5" font-family="Georgia,serif" font-size="31">Recovery without regimentation</text><text x="60" y="105" fill="#a8bac0" font-family="Arial,sans-serif" font-size="17">The American domestic settlement of 1949</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="210" width="270" height="205" rx="18" fill="#203945" stroke="#7899a7" stroke-width="3"/><rect x="465" y="190" width="270" height="245" rx="18" fill="#2b4144" stroke="#99a87d" stroke-width="3"/><rect x="860" y="210" width="270" height="205" rx="18" fill="#3b373c" stroke="#ac8e76" stroke-width="3"/><g fill="#eff3f1" font-size="19" font-weight="700"><text x="205" y="255">RETAINED FLOOR</text><text x="600" y="235">RECOVERY ACT</text><text x="995" y="255">PRIVATE EXPANSION</text></g><g fill="#bfced1" font-size="15"><text x="205" y="300">Social Security</text><text x="205" y="328">deposit insurance</text><text x="205" y="356">emergency relief</text><text x="600" y="280">tax / depreciation</text><text x="600" y="308">credit / labor rules</text><text x="600" y="336">housing / roads</text><text x="600" y="364">state grants</text><text x="995" y="300">factories / rail</text><text x="995" y="328">utilities / housing</text><text x="995" y="356">small manufacturers</text></g></g><g stroke="#7fa1ae" stroke-width="3" marker-end="url(#a)"><path d="M340 312h110"/><path d="M735 312h110"/></g><text x="600" y="520" fill="#a9bbbf" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">No permanent mass public employment; no return to pre-New Deal government</text></svg>
