<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Occitan combat-aircraft lineage</title>
  <desc id="desc">Timeline from the 1951 MD 450B Ouragan through Mystère and Mirage aircraft to the 1983 Mirage 2000 C.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a24"/><stop offset="1" stop-color="#20353c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d5b86a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="57" text-anchor="middle" fill="#f2ead9" font-family="Georgia,serif" font-size="34" font-weight="700">Occitan combat-aircraft lineage</text>
  <text x="600" y="88" text-anchor="middle" fill="#afbbc1" font-family="Arial,sans-serif" font-size="17">evacuation-born industry · seven registered generations · 1951–1983</text>
  <path d="M70 380H1135" fill="none" stroke="#d5b86a" stroke-width="5" marker-end="url(#arrow)"/>
  <g fill="#d5b86a"><circle cx="105" cy="380" r="9"/><circle cx="270" cy="380" r="9"/><circle cx="435" cy="380" r="9"/><circle cx="600" cy="380" r="9"/><circle cx="765" cy="380" r="9"/><circle cx="930" cy="380" r="9"/><circle cx="1095" cy="380" r="9"/></g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <rect x="30" y="145" width="150" height="190" rx="16" fill="#293e49" stroke="#7eb19a" stroke-width="3"/><text x="105" y="181" text-anchor="middle" fill="#f2ead9" font-size="17" font-weight="700">MD 450B</text><text x="105" y="207" text-anchor="middle" fill="#f2ead9" font-size="18" font-weight="700">Ouragan</text><text x="105" y="240" text-anchor="middle" fill="#dce3e6" font-size="16">1951</text><text x="105" y="271" text-anchor="middle" fill="#adbbc1" font-size="13">first jet fighter</text><text x="105" y="296" text-anchor="middle" fill="#adbbc1" font-size="13">940 km/h</text><path d="M105 335V371" stroke="#7eb19a" stroke-width="3"/>
    <rect x="195" y="425" width="150" height="190" rx="16" fill="#293e49" stroke="#88a9b9" stroke-width="3"/><text x="270" y="461" text-anchor="middle" fill="#f2ead9" font-size="16" font-weight="700">MD 452C</text><text x="270" y="487" text-anchor="middle" fill="#f2ead9" font-size="17" font-weight="700">Mystère II</text><text x="270" y="520" text-anchor="middle" fill="#dce3e6" font-size="16">1954</text><text x="270" y="551" text-anchor="middle" fill="#adbbc1" font-size="13">swept-wing fighter</text><text x="270" y="576" text-anchor="middle" fill="#adbbc1" font-size="13">1,050 km/h</text><path d="M270 389V425" stroke="#88a9b9" stroke-width="3"/>
    <rect x="360" y="145" width="150" height="190" rx="16" fill="#293e49" stroke="#ca8264" stroke-width="3"/><text x="435" y="181" text-anchor="middle" fill="#f2ead9" font-size="16" font-weight="700">Super Mystère</text><text x="435" y="207" text-anchor="middle" fill="#f2ead9" font-size="18" font-weight="700">B2</text><text x="435" y="240" text-anchor="middle" fill="#dce3e6" font-size="16">1957</text><text x="435" y="271" text-anchor="middle" fill="#adbbc1" font-size="13">fighter-bomber</text><text x="435" y="296" text-anchor="middle" fill="#adbbc1" font-size="13">supersonic</text><path d="M435 335V371" stroke="#ca8264" stroke-width="3"/>
    <rect x="525" y="425" width="150" height="190" rx="16" fill="#293e49" stroke="#d5b86a" stroke-width="3"/><text x="600" y="461" text-anchor="middle" fill="#f2ead9" font-size="18" font-weight="700">Mirage III C</text><text x="600" y="494" text-anchor="middle" fill="#dce3e6" font-size="16">1961</text><text x="600" y="525" text-anchor="middle" fill="#adbbc1" font-size="13">Mach 2 interceptor</text><text x="600" y="550" text-anchor="middle" fill="#adbbc1" font-size="13">four missiles</text><path d="M600 389V425" stroke="#d5b86a" stroke-width="3"/>
    <rect x="690" y="145" width="150" height="190" rx="16" fill="#293e49" stroke="#8ea36e" stroke-width="3"/><text x="765" y="181" text-anchor="middle" fill="#f2ead9" font-size="18" font-weight="700">Mirage III E</text><text x="765" y="214" text-anchor="middle" fill="#dce3e6" font-size="16">1964</text><text x="765" y="245" text-anchor="middle" fill="#adbbc1" font-size="13">fighter-bomber</text><text x="765" y="270" text-anchor="middle" fill="#adbbc1" font-size="13">reconnaissance</text><text x="765" y="295" text-anchor="middle" fill="#adbbc1" font-size="13">4,000 kg stores</text><path d="M765 335V371" stroke="#8ea36e" stroke-width="3"/>
    <rect x="855" y="425" width="150" height="190" rx="16" fill="#293e49" stroke="#9b91b6" stroke-width="3"/><text x="930" y="461" text-anchor="middle" fill="#f2ead9" font-size="18" font-weight="700">Mirage F1 C</text><text x="930" y="494" text-anchor="middle" fill="#dce3e6" font-size="16">1971</text><text x="930" y="525" text-anchor="middle" fill="#adbbc1" font-size="13">air superiority</text><text x="930" y="550" text-anchor="middle" fill="#adbbc1" font-size="13">six missiles</text><path d="M930 389V425" stroke="#9b91b6" stroke-width="3"/>
    <rect x="1020" y="145" width="150" height="190" rx="16" fill="#293e49" stroke="#d3956f" stroke-width="3"/><text x="1095" y="181" text-anchor="middle" fill="#f2ead9" font-size="17" font-weight="700">Mirage 2000 C</text><text x="1095" y="214" text-anchor="middle" fill="#dce3e6" font-size="16">1983</text><text x="1095" y="245" text-anchor="middle" fill="#adbbc1" font-size="13">digital fly-by-wire</text><text x="1095" y="270" text-anchor="middle" fill="#adbbc1" font-size="13">interceptor</text><text x="1095" y="295" text-anchor="middle" fill="#adbbc1" font-size="13">2,530 km/h</text><path d="M1095 335V371" stroke="#d3956f" stroke-width="3"/>
  </g>
  <text x="600" y="690" text-anchor="middle" fill="#b5c1c6" font-family="Arial,sans-serif" font-size="17">registered mission sequence; detailed airframe ancestry and export allocation remain open</text>
</svg>
