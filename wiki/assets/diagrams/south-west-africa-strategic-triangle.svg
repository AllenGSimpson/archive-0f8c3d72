<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">South West Africa strategic triangle</title>
  <desc id="desc">Diagram showing South West Africa between Pretoria's administration, Berlin's colonial memory, London's Cape strategy, and indigenous political claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a22"/><stop offset="1" stop-color="#172c2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b8c7c2"/></marker>
    <style>
      .node{stroke-width:2;filter:url(#shadow)} .head{font:700 28px Georgia,serif;fill:#f1e8d4}.sub{font:18px Arial,sans-serif;fill:#d6dfdc}.small{font:16px Arial,sans-serif;fill:#b9c8c4}.line{fill:none;stroke:#b8c7c2;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:10 9}.label{font:700 17px Arial,sans-serif;fill:#dfd2b6;paint-order:stroke;stroke:#13201f;stroke-width:5px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="head">South West Africa: the unresolved southern hinge</text>
  <path class="line" d="M286 202 C388 228 446 282 492 329"/>
  <path class="line" d="M914 202 C812 228 754 282 708 329"/>
  <path class="line" d="M600 575 C600 528 600 493 600 458"/>
  <path class="line dash" d="M357 530 C425 492 465 457 506 422"/>
  <rect class="node" x="62" y="104" width="390" height="134" rx="18" fill="#394d68" stroke="#7ea2ce"/>
  <text x="257" y="148" text-anchor="middle" class="head">Pretoria</text>
  <text x="257" y="181" text-anchor="middle" class="sub">administration · strategic depth</text>
  <text x="257" y="211" text-anchor="middle" class="small">settler incorporation and Cape security</text>
  <rect class="node" x="748" y="104" width="390" height="134" rx="18" fill="#69403d" stroke="#cb817a"/>
  <text x="943" y="148" text-anchor="middle" class="head">Berlin</text>
  <text x="943" y="181" text-anchor="middle" class="sub">colonial memory · cultural leverage</text>
  <text x="943" y="211" text-anchor="middle" class="small">commercial access and German settler ties</text>
  <rect class="node" x="416" y="307" width="368" height="158" rx="22" fill="#49604b" stroke="#91b58e"/>
  <text x="600" y="352" text-anchor="middle" class="head">South West Africa</text>
  <text x="600" y="386" text-anchor="middle" class="sub">South African-administered territory</text>
  <text x="600" y="417" text-anchor="middle" class="small">legal endpoint and sovereignty remain open</text>
  <rect class="node" x="410" y="548" width="380" height="92" rx="18" fill="#5c5140" stroke="#c5aa75"/>
  <text x="600" y="584" text-anchor="middle" class="head">Indigenous politics</text>
  <text x="600" y="616" text-anchor="middle" class="small">land · labor · representation · self-government</text>
  <rect class="node" x="62" y="470" width="310" height="122" rx="18" fill="#403e63" stroke="#918bd0"/>
  <text x="217" y="512" text-anchor="middle" class="head">London</text>
  <text x="217" y="545" text-anchor="middle" class="sub">Cape-route restraint</text>
  <text x="217" y="575" text-anchor="middle" class="small">keep Pretoria aligned; keep Berlin out</text>
  <text x="376" y="246" class="label">de facto rule</text>
  <text x="748" y="246" class="label">pressure without annexation</text>
  <text x="612" y="522" class="label">claims to political future</text>
  <text x="348" y="470" class="label">strategic tolerance</text>
</svg>
