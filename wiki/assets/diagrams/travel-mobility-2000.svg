<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Travel and mobility in 2000</title><desc id="d">Local, regional, international, and frontier travel pass through documents and infrastructure.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151c"/><stop offset="1" stop-color="#1b2d35"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#799da8"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eff5f5" font-family="Georgia,serif" font-size="31">Travel and mobility in 2000</text><text x="60" y="105" fill="#a6b9bf" font-family="Arial,sans-serif" font-size="17">Distance shrinks faster than political and legal boundaries</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="220" width="220" height="175" rx="18" fill="#203943" stroke="#7798a4" stroke-width="3"/><rect x="340" y="220" width="220" height="175" rx="18" fill="#2d3f42" stroke="#91a37c" stroke-width="3"/><rect x="640" y="220" width="220" height="175" rx="18" fill="#3b373c" stroke="#a78d76" stroke-width="3"/><rect x="920" y="220" width="220" height="175" rx="18" fill="#312f42" stroke="#9285a9" stroke-width="3"/><g fill="#f0f4f2" font-size="19" font-weight="700"><text x="170" y="267">DAILY</text><text x="450" y="267">REGIONAL</text><text x="750" y="267">INTERNATIONAL</text><text x="1030" y="267">FRONTIER</text></g><g fill="#c1d0d2" font-size="15"><text x="170" y="310">walk / rail</text><text x="170" y="338">bus / car</text><text x="450" y="310">motorway / express</text><text x="450" y="338">night train / ferry</text><text x="750" y="310">jet / ocean route</text><text x="750" y="338">passport / currency</text><text x="1030" y="310">orbital transport</text><text x="1030" y="338">mission clearance</text></g></g><g stroke="#799da8" stroke-width="3" marker-end="url(#a)"><path d="M280 307h45"/><path d="M560 307h65"/><path d="M860 307h45"/></g><rect x="315" y="450" width="570" height="75" rx="16" fill="#22343a" stroke="#687f86"/><text x="600" y="482" fill="#d9e2e1" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">ACCESS FILTERS</text><text x="600" y="508" fill="#aebfc1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">income / citizenship / pass / registration / employer / race</text></svg>
