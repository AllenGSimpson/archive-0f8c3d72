<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transport hierarchy of the Russian Far Eastern State</title><desc id="desc">Five transport layers from rail and water bulk movement to aviation, roads, and tracked last-mile vehicles.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:21px Arial,sans-serif;fill:#c9c7bd}.l{font:bold 28px Arial,sans-serif;fill:#fff}.b{stroke:#c3c8c1;stroke-width:2;rx:16}.a{stroke:#efd274;stroke-width:5;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efd274"/></marker></defs>
  <rect width="1200" height="720" fill="#101617"/><text x="55" y="65" class="h">THE FAR EASTERN TRANSPORT HIERARCHY</text><text x="55" y="102" class="s">Capacity falls and flexibility rises as freight moves beyond the railway belt</text>
  <g transform="translate(55 165)"><rect width="205" height="125" class="b" fill="#2e4852"/><text x="102" y="50" text-anchor="middle" class="l">RAIL</text><text x="102" y="84" text-anchor="middle" class="s">Strategic trunk</text><text x="102" y="111" text-anchor="middle" class="s">bulk and passengers</text></g>
  <g transform="translate(280 315)"><rect width="205" height="125" class="b" fill="#28484a"/><text x="102" y="50" text-anchor="middle" class="l">WATER</text><text x="102" y="84" text-anchor="middle" class="s">River and coast</text><text x="102" y="111" text-anchor="middle" class="s">seasonal bulk</text></g>
  <g transform="translate(505 165)"><rect width="205" height="125" class="b" fill="#4c3f2e"/><text x="102" y="50" text-anchor="middle" class="l">AVIATION</text><text x="102" y="84" text-anchor="middle" class="s">People · mail</text><text x="102" y="111" text-anchor="middle" class="s">urgent cargo</text></g>
  <g transform="translate(730 315)"><rect width="205" height="125" class="b" fill="#3d4540"/><text x="102" y="50" text-anchor="middle" class="l">ROADS</text><text x="102" y="84" text-anchor="middle" class="s">Cities and</text><text x="102" y="111" text-anchor="middle" class="s">maintained corridors</text></g>
  <g transform="translate(955 165)"><rect width="205" height="125" class="b" fill="#49394d"/><text x="102" y="50" text-anchor="middle" class="l">TRACKS</text><text x="102" y="84" text-anchor="middle" class="s">Tundra · mines</text><text x="102" y="111" text-anchor="middle" class="s">last mile</text></g>
  <path d="M260 227l20 115M485 377l20-115M710 227l20 115M935 377l20-115" class="a" marker-end="url(#m)"/>
  <rect x="100" y="535" width="1000" height="110" class="b" fill="#26332f"/><text x="600" y="580" text-anchor="middle" class="l">THE SEASONAL CHAIN</text><text x="600" y="619" text-anchor="middle" class="s">Factory → railhead → river or coastal port → district depot → airfield, road, or tracked carrier</text>
</svg>
