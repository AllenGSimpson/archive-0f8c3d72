  <text x="900" y="500" fill="#d8c37a" font-family="Arial,sans-serif" font-size="15" font-weight="700">SEVERAL SPOKES</text><text x="900" y="524" fill="#b9b39f" font-family="Arial,sans-serif" font-size="12">people · services · emergency access</text><path d="M899 493L778 430" stroke="#d8c37a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="613" text-anchor="middle" fill="#a9a590" font-family="Arial,sans-serif" font-size="13">Planning geometry and exact engineering register remain open</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d8c37a"/></marker></defs>
