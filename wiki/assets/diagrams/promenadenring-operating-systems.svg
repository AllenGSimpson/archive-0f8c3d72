<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Promenadenring operating systems</title><desc id="desc">A diagram of the fixed Orbitaler Raumhafen hub, transfer bearing, four rotating pressure sectors, life-support distribution, and mass-balance control.</desc>
  <rect width="1200" height="660" fill="#111512"/><rect x="28" y="28" width="1144" height="604" rx="14" fill="#171d19" stroke="#9a8655" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" fill="#e8e1cf" font-family="Georgia,serif" font-size="30" font-weight="700">Promenadenring operating systems</text>
  <text x="600" y="103" text-anchor="middle" fill="#b9b39f" font-family="Arial,sans-serif" font-size="15">A civic district sustained across a fixed-to-rotating boundary</text>
  <circle cx="600" cy="345" r="214" fill="none" stroke="#987b42" stroke-width="34" opacity=".34"/><circle cx="600" cy="345" r="214" fill="none" stroke="#d8c37a" stroke-width="3"/>
  <path d="M600 131v428M386 345h428" stroke="#111512" stroke-width="8"/>
  <path d="M600 234v-91M711 345h91M600 456v91M489 345h-91" stroke="#8fa0a6" stroke-width="18"/><path d="M600 234v-91M711 345h91M600 456v91M489 345h-91" stroke="#d2ddd8" stroke-width="3"/>
  <circle cx="600" cy="345" r="111" fill="#202b30" stroke="#8fa0a6" stroke-width="3"/><circle cx="600" cy="345" r="56" fill="#2b2520" stroke="#d8c37a" stroke-width="5"/>
  <text x="600" y="337" text-anchor="middle" fill="#f2ead8" font-family="Arial,sans-serif" font-size="17" font-weight="700">TRANSFER</text><text x="600" y="359" text-anchor="middle" fill="#f2ead8" font-family="Arial,sans-serif" font-size="17" font-weight="700">BEARING</text>
  <text x="600" y="292" text-anchor="middle" fill="#d7e0dc" font-family="Arial,sans-serif" font-size="16" font-weight="700">NONROTATING HUB</text><text x="600" y="313" text-anchor="middle" fill="#9fb0b3" font-family="Arial,sans-serif" font-size="12">docks · yards · traffic · reactors</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(600 146)"><rect x="-89" y="-24" width="178" height="48" rx="8" fill="#263b39" stroke="#78a89b"/><text y="-3" fill="#edf4ef" font-size="14" font-weight="700">SECTOR A</text><text y="15" fill="#b9d1c8" font-size="11">homes · clinic</text></g><g transform="translate(799 345)"><rect x="-89" y="-24" width="178" height="48" rx="8" fill="#343446" stroke="#9697bb"/><text y="-3" fill="#f0eff8" font-size="14" font-weight="700">SECTOR B</text><text y="15" fill="#c7c5dd" font-size="11">shops · classrooms</text></g><g transform="translate(600 544)"><rect x="-89" y="-24" width="178" height="48" rx="8" fill="#3d3327" stroke="#b6915f"/><text y="-3" fill="#f6ebdc" font-size="14" font-weight="700">SECTOR C</text><text y="15" fill="#d8c1a2" font-size="11">hotel · kitchens</text></g><g transform="translate(401 345)"><rect x="-89" y="-24" width="178" height="48" rx="8" fill="#303b2a" stroke="#8ba16e"/><text y="-3" fill="#edf3e8" font-size="14" font-weight="700">SECTOR D</text><text y="15" fill="#c3d0b3" font-size="11">workshops · gardens</text></g></g>
  <path d="M450 210c44-47 93-70 150-70M750 210c-44-47-93-70-150-70M750 480c-44 47-93 70-150 70M450 480c44 47 93 70 150 70" fill="none" stroke="#78a89b" stroke-width="5" stroke-dasharray="9 8"/>
  <text x="125" y="183" fill="#d8c37a" font-family="Arial,sans-serif" font-size="15" font-weight="700">LIFE-SUPPORT LOOP</text><text x="125" y="207" fill="#b9b39f" font-family="Arial,sans-serif" font-size="12">air · water · heat · waste</text><path d="M298 196L421 250" stroke="#d8c37a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="902" y="183" fill="#d8c37a" font-family="Arial,sans-serif" font-size="15" font-weight="700">PRESSURE SAFETY</text><text x="902" y="207" fill="#b9b39f" font-family="Arial,sans-serif" font-size="12">bulkheads · refuge · alarms</text><path d="M899 215L786 264" stroke="#d8c37a" stroke-width="2" marker-end="url(#arrow)"/>
