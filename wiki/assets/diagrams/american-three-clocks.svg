<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Three clocks of American government</title><desc id="desc">The president sets a four-year destination, Congress revises method every two years, and corporations preserve continuous execution.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#243542"/></linearGradient><style>.t{font:700 44px Georgia,serif;fill:#f8f2e8}.s{font:18px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.h{font:700 25px Arial,sans-serif;fill:#fff}.n{font:700 60px Georgia,serif;fill:#f2c873}.c{font:18px Arial,sans-serif;fill:#d8e2e7}.f{font:19px Arial,sans-serif;fill:#e2d3aa}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="72" text-anchor="middle" class="t">THE THREE CLOCKS OF AMERICAN GOVERNMENT</text><text x="800" y="112" text-anchor="middle" class="s">DIRECTION · METHOD · INSTITUTIONAL MEMORY · c. 2000</text><g transform="translate(90 190)"><rect width="420" height="420" rx="28" fill="#173446" stroke="#65b8da" stroke-width="4"/><text x="42" y="78" class="n">4</text><text x="118" y="64" class="h">YEARS</text><text x="118" y="96" class="s">PRESIDENCY</text><text x="42" y="160" class="h">SELECTS DESTINATION</text><text x="42" y="218" class="c">National priority</text><text x="42" y="258" class="c">Cabinet and executive attention</text><text x="42" y="298" class="c">Diplomacy, credit, guarantees</text><text x="42" y="358" class="c">A bounded assignment</text><rect x="500" width="420" height="420" rx="28" fill="#332b1e" stroke="#d7b35e" stroke-width="4"/><text x="542" y="78" class="n">2</text><text x="618" y="64" class="h">YEARS</text><text x="618" y="96" class="s">CONGRESS</text><text x="542" y="160" class="h">REVISES METHOD</text><text x="542" y="218" class="c">Appropriations and pace</text><text x="542" y="258" class="c">Contracts and standards</text><text x="542" y="298" class="c">Labor and regional distribution</text><text x="542" y="358" class="c">House volatile · Senate slower</text><rect x="1000" width="420" height="420" rx="28" fill="#24341f" stroke="#8ab46b" stroke-width="4"/><text x="1042" y="78" class="n">∞</text><text x="1118" y="64" class="h">CONTINUOUS</text><text x="1118" y="96" class="s">CORPORATIONS</text><text x="1042" y="160" class="h">REMEMBER EXECUTION</text><text x="1042" y="218" class="c">Personnel and machinery</text><text x="1042" y="258" class="c">Contracts and suppliers</text><text x="1042" y="298" class="c">Data, insurance, procedures</text><text x="1042" y="358" class="c">The operating institutions</text></g><rect x="260" y="675" width="1080" height="86" rx="42" fill="#182936" stroke="#748d99" stroke-width="3"/><text x="800" y="728" text-anchor="middle" class="f">The electorate changes policy faster than it can replace the institutions that carry policy out</text></svg>
