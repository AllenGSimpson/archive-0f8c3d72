<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">National technical styles in international motor racing</title><desc id="desc">Five national or bloc traditions contribute different engineering cultures to Formula One and Group 7.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#f0d172}.s{font:21px Arial,sans-serif;fill:#d4d2c9}.l{font:bold 25px Arial,sans-serif;fill:#fff}.b{stroke:#c8c8bf;stroke-width:2;rx:18}</style></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="65" class="h">FIVE TECHNICAL LANGUAGES</text><text x="58" y="103" class="s">A common rulebook produces visibly different machines</text>
  <g transform="translate(45 150)"><rect width="210" height="440" class="b" fill="#333f48"/><text x="105" y="58" text-anchor="middle" class="l">GERMANY</text><text x="105" y="112" text-anchor="middle" class="s">Fuel injection</text><text x="105" y="150" text-anchor="middle" class="s">instrumentation</text><text x="105" y="188" text-anchor="middle" class="s">high-speed stability</text><text x="105" y="226" text-anchor="middle" class="s">integrated testing</text><text x="105" y="288" text-anchor="middle" class="s">Mercedes-Benz</text><text x="105" y="326" text-anchor="middle" class="s">Auto Union</text><text x="105" y="364" text-anchor="middle" class="s">Porsche</text></g>
  <g transform="translate(270 150)"><rect width="210" height="440" class="b" fill="#4b3638"/><text x="105" y="58" text-anchor="middle" class="l">ITALY</text><text x="105" y="112" text-anchor="middle" class="s">High-rev engines</text><text x="105" y="150" text-anchor="middle" class="s">low mass</text><text x="105" y="188" text-anchor="middle" class="s">handling</text><text x="105" y="226" text-anchor="middle" class="s">road-car prestige</text><text x="105" y="288" text-anchor="middle" class="s">Alfa Romeo</text><text x="105" y="326" text-anchor="middle" class="s">Ferrari</text><text x="105" y="364" text-anchor="middle" class="s">Maserati / Lancia</text></g>
  <g transform="translate(495 150)"><rect width="210" height="440" class="b" fill="#3b4740"/><text x="105" y="58" text-anchor="middle" class="l">BRITAIN</text><text x="105" y="112" text-anchor="middle" class="s">Light chassis</text><text x="105" y="150" text-anchor="middle" class="s">customer engines</text><text x="105" y="188" text-anchor="middle" class="s">rear layouts</text><text x="105" y="226" text-anchor="middle" class="s">rapid iteration</text><text x="105" y="288" text-anchor="middle" class="s">BRM / Cooper</text><text x="105" y="326" text-anchor="middle" class="s">Lotus</text><text x="105" y="364" text-anchor="middle" class="s">private entrants</text></g>
  <g transform="translate(720 150)"><rect width="210" height="440" class="b" fill="#4c3d2d"/><text x="105" y="58" text-anchor="middle" class="l">AMERICA</text><text x="105" y="112" text-anchor="middle" class="s">Large V8s</text><text x="105" y="150" text-anchor="middle" class="s">private capital</text><text x="105" y="188" text-anchor="middle" class="s">hot-rod parts</text><text x="105" y="226" text-anchor="middle" class="s">oval experience</text><text x="105" y="288" text-anchor="middle" class="s">Group 7</text><text x="105" y="326" text-anchor="middle" class="s">endurance</text><text x="105" y="364" text-anchor="middle" class="s">engine supply</text></g>
  <g transform="translate(945 150)"><rect width="210" height="440" class="b" fill="#3c3449"/><text x="105" y="58" text-anchor="middle" class="l">JAPAN</text><text x="105" y="112" text-anchor="middle" class="s">Compact engines</text><text x="105" y="150" text-anchor="middle" class="s">close integration</text><text x="105" y="188" text-anchor="middle" class="s">production rigor</text><text x="105" y="226" text-anchor="middle" class="s">electronics</text><text x="105" y="288" text-anchor="middle" class="s">motorcycles</text><text x="105" y="326" text-anchor="middle" class="s">touring / endurance</text><text x="105" y="364" text-anchor="middle" class="s">later Formula One</text></g>
  <text x="600" y="650" text-anchor="middle" class="s">Sport - research - advertising - industrial espionage - public diplomacy</text>
</svg>
