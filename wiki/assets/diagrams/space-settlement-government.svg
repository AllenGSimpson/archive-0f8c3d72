<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Government of an extraterrestrial settlement</title><desc id="d">Sponsor authority, local administration, technical command, firms, and households form a layered government.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131b"/><stop offset="1" stop-color="#122631"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Settlement government before sovereignty</text><text x="60" y="104" fill="#a2b5bf" font-family="Arial,sans-serif" font-size="17">Administration grows between the sponsor and the systems of ordinary life</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="110" y="150" width="980" height="365" rx="24" fill="#172f3b" stroke="#558a9c" stroke-width="3"/><text x="600" y="190" fill="#e4eff2" font-size="21" font-weight="700">SPONSOR · CHARTER · EXTERNAL AUTHORITY</text><rect x="205" y="225" width="790" height="230" rx="20" fill="#20414c" stroke="#6ca9b8" stroke-width="3"/><text x="600" y="265" fill="#e4eff2" font-size="20" font-weight="700">LOCAL ADMINISTRATION</text><text x="600" y="296" fill="#bdd0d6" font-size="15">records · housing · sanitation · clinics · schools · services</text><rect x="275" y="335" width="280" height="75" rx="12" fill="#3a3e3d" stroke="#aa955c"/><text x="415" y="370" fill="#f7e6b5" font-size="17" font-weight="700">TECHNICAL COMMAND</text><text x="415" y="393" fill="#d6ceba" font-size="13">life support · traffic · emergency</text><rect x="645" y="335" width="280" height="75" rx="12" fill="#3b3034" stroke="#b67275"/><text x="785" y="370" fill="#f5dddd" font-size="17" font-weight="700">FIRMS AND HOUSEHOLDS</text><text x="785" y="393" fill="#dac3c5" font-size="13">work · property · residence</text></g><text x="600" y="565" fill="#9fb3bc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Local government need not imply independent statehood</text></svg>
