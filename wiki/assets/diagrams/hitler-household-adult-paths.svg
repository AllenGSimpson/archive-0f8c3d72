<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Adult paths of the seven Hitler children</title><desc id="desc">Seven parallel biographies leading from the 1985 household into military, religious, archival, cinematic, technical, domestic, and musical adult roles.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09131c"/><stop offset="1" stop-color="#26303a"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f6f0e4}.sub{font:17px Arial,sans-serif;fill:#b9c5cc;letter-spacing:2px}.name{font:700 25px Arial,sans-serif;fill:#fff}.year{font:700 15px Arial,sans-serif;fill:#e0bc72;letter-spacing:1.5px}.copy{font:18px Arial,sans-serif;fill:#d2dbe0}.box{fill:#14232e;stroke:#586d7a;stroke-width:2}.son{stroke:#68a9c8}.daughter{stroke:#b18bb8}.line{stroke:#8395a0;stroke-width:3}.foot{font:17px Arial,sans-serif;fill:#c4d0d6}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="62" text-anchor="middle" class="title">SEVEN PATHS FROM THE RULING HOUSEHOLD</text><text x="800" y="98" text-anchor="middle" class="sub">CHILDHOOD IN 1985 · ADULT ROLES AFTER THE MILLENNIUM</text>
  <rect x="565" y="128" width="470" height="92" rx="22" fill="#2f251d" stroke="#d1a95f" stroke-width="3"/><text x="800" y="165" text-anchor="middle" class="name">WOLFGANG + KATHARINA</text><text x="800" y="196" text-anchor="middle" class="copy">Three sons · four daughters · no automatic crown</text>
  <path d="M800 220V265M130 265H1470" class="line" fill="none"/><g class="line"><path d="M130 265v42M353 265v42M576 265v42M800 265v42M1024 265v42M1247 265v42M1470 265v42"/></g>
  <g transform="translate(25 307)"><rect width="210" height="540" rx="20" class="box son"/><text x="105" y="43" text-anchor="middle" class="name">ALEXANDER</text><text x="105" y="70" text-anchor="middle" class="year">B. 1971</text><text x="24" y="125" class="copy">Officer</text><text x="24" y="165" class="copy">SS Order believer</text><text x="24" y="205" class="copy">Space-settlement</text><text x="24" y="235" class="copy">civilizational</text><text x="24" y="265" class="copy">advocate</text><line x1="24" y1="305" x2="186" y2="305" stroke="#68a9c8"/><text x="24" y="350" class="copy">Order-family</text><text x="24" y="380" class="copy">marriage</text><text x="24" y="435" class="copy">Presumptive heir</text><text x="24" y="475" class="copy">Confirmation still</text><text x="24" y="505" class="copy">required</text></g>
  <g transform="translate(248 307)"><rect width="210" height="540" rx="20" class="box son"/><text x="105" y="43" text-anchor="middle" class="name">KONRAD</text><text x="105" y="70" text-anchor="middle" class="year">B. 1973</text><text x="24" y="125" class="copy">Field route</text><text x="24" y="165" class="copy">to commission</text><text x="24" y="205" class="copy">Sport and racing</text><line x1="24" y1="245" x2="186" y2="245" stroke="#68a9c8"/><text x="24" y="290" class="copy">Refuses rival</text><text x="24" y="320" class="copy">candidacy</text><text x="24" y="375" class="copy">Military and</text><text x="24" y="405" class="copy">administrative</text><text x="24" y="435" class="copy">anchor</text><text x="24" y="495" class="copy">German marriage</text></g>
  <g transform="translate(471 307)"><rect width="210" height="540" rx="20" class="box daughter"/><text x="105" y="43" text-anchor="middle" class="name">JOHANNA</text><text x="105" y="70" text-anchor="middle" class="year">B. 1975</text><text x="24" y="125" class="copy">Family archive</text><text x="24" y="165" class="copy">Catholic convert</text><text x="24" y="205" class="copy">Italian marriage</text><line x1="24" y1="245" x2="186" y2="245" stroke="#b18bb8"/><text x="24" y="290" class="copy">Bridge to Rome</text><text x="24" y="320" class="copy">and Latin world</text><text x="24" y="375" class="copy">Archives + Felix's</text><text x="24" y="405" class="copy">search systems</text></g>
  <g transform="translate(695 307)"><rect width="210" height="540" rx="20" class="box daughter"/><text x="105" y="43" text-anchor="middle" class="name">SOPHIE</text><text x="105" y="70" text-anchor="middle" class="year">B. 1977</text><text x="24" y="125" class="copy">Professional actor</text><text x="24" y="165" class="copy">Cinema career</text><text x="24" y="205" class="copy">Public celebrity</text><line x1="24" y1="245" x2="186" y2="245" stroke="#b18bb8"/><text x="24" y="290" class="copy">Family member and</text><text x="24" y="320" class="copy">independent artist</text><text x="24" y="375" class="copy">Later marriage to</text><text x="24" y="405" class="copy">German officer</text></g>
  <g transform="translate(919 307)"><rect width="210" height="540" rx="20" class="box son"/><text x="105" y="43" text-anchor="middle" class="name">FELIX</text><text x="105" y="70" text-anchor="middle" class="year">B. 1979</text><text x="24" y="125" class="copy">Technical service</text><text x="24" y="165" class="copy">Software engineer</text><text x="24" y="205" class="copy">California mission</text><line x1="24" y1="245" x2="186" y2="245" stroke="#68a9c8"/><text x="24" y="290" class="copy">American marriage</text><text x="24" y="345" class="copy">Prinzensprache</text><text x="24" y="375" class="copy">language project</text><text x="24" y="435" class="copy">Technical role,</text><text x="24" y="465" class="copy">not candidacy</text></g>
  <g transform="translate(1142 307)"><rect width="210" height="540" rx="20" class="box daughter"/><text x="105" y="43" text-anchor="middle" class="name">HELENA</text><text x="105" y="70" text-anchor="middle" class="year">B. 1982</text><text x="24" y="125" class="copy">Some medical</text><text x="24" y="155" class="copy">formation</text><text x="24" y="205" class="copy">Marries at 18</text><text x="24" y="235" class="copy">in 2000</text><line x1="24" y1="275" x2="186" y2="275" stroke="#b18bb8"/><text x="24" y="320" class="copy">Large family</text><text x="24" y="375" class="copy">Domestic center</text><text x="24" y="435" class="copy">Earlier film path</text><text x="24" y="465" class="copy">superseded</text></g>
  <g transform="translate(1365 307)"><rect width="210" height="540" rx="20" class="box daughter"/><text x="105" y="43" text-anchor="middle" class="name">ANNA</text><text x="105" y="70" text-anchor="middle" class="year">B. 1984</text><text x="24" y="125" class="copy">Gifted singer</text><text x="24" y="165" class="copy">Public at 16</text><text x="24" y="205" class="copy">Opera trajectory</text><line x1="24" y1="245" x2="186" y2="245" stroke="#b18bb8"/><text x="24" y="290" class="copy">Vienna</text><text x="24" y="320" class="copy">and Berlin</text><text x="24" y="375" class="copy">Marriage after</text><text x="24" y="405" class="copy">the millennium</text></g>
  <rect x="260" y="895" width="1080" height="54" rx="27" fill="#172c38" stroke="#768d99"/><text x="800" y="929" text-anchor="middle" class="foot">Adult significance spreads across institutions; only Alexander remains first in expectation for the Führership</text>
</svg>
