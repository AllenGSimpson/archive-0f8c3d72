<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chronology of the Ashcombe settlement, 1985 to 1992</title>
  <desc id="desc">A timeline from the Falklands settlement and Thatcher's retirement through Ashcombe's leadership victory, the Peace Election, Halifax cooperation, the Open Door test, and the transfer to Martin Calder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#202f48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="26" fill="url(#background)"/>
  <text x="70" y="78" fill="#f5eee1" font-family="Georgia,serif" font-size="36" font-weight="700">The Ashcombe settlement</text>
  <text x="70" y="116" fill="#b9c4d6" font-family="Arial,sans-serif" font-size="20">From wartime recovery to Responsible Independence, 1985–1992</text>
  <line x1="105" y1="338" x2="1095" y2="338" stroke="#9aaac2" stroke-width="6" stroke-linecap="round"/>
  <g fill="#d7b26d" stroke="#f5eee1" stroke-width="4">
    <circle cx="125" cy="338" r="12"/><circle cx="315" cy="338" r="12"/><circle cx="505" cy="338" r="12"/>
    <circle cx="695" cy="338" r="12"/><circle cx="885" cy="338" r="12"/><circle cx="1075" cy="338" r="12"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <g transform="translate(55 172)">
      <rect width="220" height="128" rx="14" fill="#273a59" stroke="#6f86a8"/>
      <text x="18" y="33" fill="#d7b26d" font-size="18" font-weight="700">1985–87</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">War settlement</text>
      <text x="18" y="88" fill="#cbd5e5" font-size="15">Armistice, inquiry,</text>
      <text x="18" y="109" fill="#cbd5e5" font-size="15">demobilization, review</text>
    </g>
    <g transform="translate(245 380)">
      <rect width="220" height="144" rx="14" fill="#493747" stroke="#a97989"/>
      <text x="18" y="33" fill="#e6b2bf" font-size="18" font-weight="700">Late 1987</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">Orderly succession</text>
      <text x="18" y="88" fill="#ead8df" font-size="15">Thatcher retires;</text>
      <text x="18" y="109" fill="#ead8df" font-size="15">Ashcombe wins the</text>
      <text x="18" y="130" fill="#ead8df" font-size="15">second ballot</text>
    </g>
    <g transform="translate(435 172)">
      <rect width="220" height="128" rx="14" fill="#294443" stroke="#78a29b"/>
      <text x="18" y="33" fill="#a8d3cb" font-size="18" font-weight="700">Feb./Mar. 1988</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">Peace Election</text>
      <text x="18" y="88" fill="#d5e8e4" font-size="15">“Build the Peace”</text>
      <text x="18" y="109" fill="#d5e8e4" font-size="15">wins a working majority</text>
    </g>
    <g transform="translate(625 380)">
      <rect width="220" height="144" rx="14" fill="#3f3c29" stroke="#a89d61"/>
      <text x="18" y="33" fill="#e2d28b" font-size="18" font-weight="700">1988</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">Bounded opening</text>
      <text x="18" y="88" fill="#ece6c6" font-size="15">Halifax security,</text>
      <text x="18" y="109" fill="#ece6c6" font-size="15">commercial, and orbital</text>
      <text x="18" y="130" fill="#ece6c6" font-size="15">cooperation</text>
    </g>
    <g transform="translate(815 172)">
      <rect width="220" height="128" rx="14" fill="#3b304c" stroke="#8e76a9"/>
      <text x="18" y="33" fill="#c7ade4" font-size="18" font-weight="700">1990</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">Open Door test</text>
      <text x="18" y="88" fill="#e1d8ed" font-size="15">Ownership controls and</text>
      <text x="18" y="109" fill="#e1d8ed" font-size="15">reserved capacity hold</text>
    </g>
    <g transform="translate(965 380)">
      <rect width="180" height="144" rx="14" fill="#26394b" stroke="#7192ac"/>
      <text x="18" y="33" fill="#aacce4" font-size="18" font-weight="700">1992</text>
      <text x="18" y="62" fill="#fff" font-size="18" font-weight="700">Transfer</text>
      <text x="18" y="88" fill="#d7e5ef" font-size="15">Calder wins;</text>
      <text x="18" y="109" fill="#d7e5ef" font-size="15">the mixed settlement</text>
      <text x="18" y="130" fill="#d7e5ef" font-size="15">survives</text>
    </g>
  </g>
  <text x="70" y="615" fill="#b9c4d6" font-family="Arial,sans-serif" font-size="17">The settlement joined political succession, maintained capacity, Commonwealth reciprocity, and limited commercial exposure.</text>
</svg>
