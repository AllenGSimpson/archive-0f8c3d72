<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">South Atlantic siege</title><desc id="d">British transatlantic logistics and shorter Argentine mainland supply routes converge upon a divided Falkland archipelago under blockade and attrition.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d5bc70"/></marker></defs><rect width="1200" height="520" rx="24" fill="#07151e"/><text x="600" y="55" text-anchor="middle" fill="#f1f6f5" font-family="Georgia,serif" font-size="32">SOUTH ATLANTIC SIEGE · LATE 1984–1986</text><g font-family="Arial,sans-serif"><rect x="55" y="135" width="265" height="235" rx="18" fill="#15384b" stroke="#76bad4" stroke-width="3"/><text x="187" y="180" text-anchor="middle" fill="#fff" font-size="23">COMMONWEALTH</text><text x="187" y="220" text-anchor="middle" fill="#d6edf5" font-size="17">Atlantic shipping</text><text x="187" y="250" text-anchor="middle" fill="#d6edf5" font-size="17">Cape repair and fuel</text><text x="187" y="280" text-anchor="middle" fill="#d6edf5" font-size="17">escorts · stores · aircraft</text><text x="187" y="325" text-anchor="middle" fill="#ffe7a7" font-size="17">LONGER ROUTE</text><rect x="440" y="120" width="320" height="270" rx="22" fill="#253e32" stroke="#7ab68b" stroke-width="3"/><text x="600" y="165" text-anchor="middle" fill="#effff3" font-size="23">DIVIDED ARCHIPELAGO</text><line x1="600" y1="190" x2="600" y2="345" stroke="#d9c375" stroke-width="3" stroke-dasharray="9 9"/><text x="520" y="235" text-anchor="middle" fill="#d8f1de" font-size="18">WEST</text><text x="520" y="270" text-anchor="middle" fill="#d8f1de" font-size="16">British base</text><text x="680" y="235" text-anchor="middle" fill="#f4d4ce" font-size="18">EAST</text><text x="680" y="270" text-anchor="middle" fill="#f4d4ce" font-size="16">Argentine fortress</text><text x="600" y="365" text-anchor="middle" fill="#fff0b0" font-size="17">blockade · attrition · construction</text><rect x="880" y="135" width="265" height="235" rx="18" fill="#442e2b" stroke="#d99182" stroke-width="3"/><text x="1012" y="180" text-anchor="middle" fill="#fff" font-size="23">ARGENTINA</text><text x="1012" y="220" text-anchor="middle" fill="#f4d6d0" font-size="17">mainland airfields</text><text x="1012" y="250" text-anchor="middle" fill="#f4d6d0" font-size="17">submarines · fast vessels</text><text x="1012" y="280" text-anchor="middle" fill="#f4d6d0" font-size="17">stored supplies</text><text x="1012" y="325" text-anchor="middle" fill="#ffe7a7" font-size="17">SHORTER, CONTESTED ROUTE</text><path d="M320 255H430" stroke="#d5bc70" stroke-width="5" marker-end="url(#a)"/><path d="M880 255H770" stroke="#d5bc70" stroke-width="5" marker-end="url(#a)"/><text x="600" y="465" text-anchor="middle" fill="#c8e5ed" font-size="20">Neither supply system could be closed quickly enough for an easy decision</text></g></svg>
