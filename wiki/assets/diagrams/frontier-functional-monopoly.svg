<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Frontier's functional orbital monopoly</title><desc id="desc">Frontier integrates the infrastructure required for large missions while specialist competitors occupy real market niches.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#21333f"/></linearGradient><style>.t{font:700 45px Georgia,serif;fill:#f8f2e8}.s{font:18px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.h{font:700 24px Arial,sans-serif;fill:#fff}.c{font:18px Arial,sans-serif;fill:#d8e2e7}.k{font:700 17px Arial,sans-serif;fill:#f1c66a;letter-spacing:1px}.f{font:19px Arial,sans-serif;fill:#e2d3aa}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="72" text-anchor="middle" class="t">FRONTIER'S FUNCTIONAL ORBITAL MONOPOLY</text><text x="800" y="112" text-anchor="middle" class="s">NO LEGAL EXCLUSIVITY · ONE DOMINANT NETWORK · c. 2000</text><g stroke="#718b99" stroke-width="5"><path d="M800 290L285 220M800 290L1315 220M800 520L285 650M800 520L1315 650"/></g><rect x="540" y="220" width="520" height="380" rx="36" fill="#173e52" stroke="#69bee1" stroke-width="5"/><text x="800" y="290" text-anchor="middle" class="h">FRONTIER ORBITAL LINES</text><text x="800" y="330" text-anchor="middle" class="k">THE INTEGRATING UTILITY</text><text x="600" y="395" class="c">Reusable crew and freight vehicles</text><text x="600" y="435" class="c">Columbia access · lunar depots</text><text x="600" y="475" class="c">Rescue guarantees · flight heritage</text><text x="600" y="515" class="c">Insurance · crews · supplier estate</text><rect x="80" y="155" width="410" height="190" rx="25" fill="#132a38" stroke="#d5b05b" stroke-width="4"/><text x="285" y="205" text-anchor="middle" class="h">SPECIALIST LAUNCHERS</text><text x="285" y="245" text-anchor="middle" class="c">Microsatellites · polar orbit</text><text x="285" y="280" text-anchor="middle" class="c">Rapid response · niche engines</text><rect x="1110" y="155" width="410" height="190" rx="25" fill="#132a38" stroke="#d5b05b" stroke-width="4"/><text x="1315" y="205" text-anchor="middle" class="h">ORBITAL SERVICES</text><text x="1315" y="245" text-anchor="middle" class="c">Tugs · science · tourism</text><text x="1315" y="280" text-anchor="middle" class="c">Automated and specialist freight</text><rect x="80" y="580" width="410" height="190" rx="25" fill="#132a38" stroke="#8ab46b" stroke-width="4"/><text x="285" y="630" text-anchor="middle" class="h">REGIONAL SUPPLIERS</text><text x="285" y="670" text-anchor="middle" class="c">Hardware · habitats · propellant</text><text x="285" y="705" text-anchor="middle" class="c">Real firms, politically protected</text><rect x="1110" y="580" width="410" height="190" rx="25" fill="#132a38" stroke="#aa91df" stroke-width="4"/><text x="1315" y="630" text-anchor="middle" class="h">FOREIGN CUSTOMERS</text><text x="1315" y="670" text-anchor="middle" class="c">Raumhafen · Resolution</text><text x="1315" y="705" text-anchor="middle" class="c">Stella Maris · commercial slots</text><text x="800" y="842" text-anchor="middle" class="f">You can found a space company; you cannot quickly found a second orbital transportation civilization</text></svg>
