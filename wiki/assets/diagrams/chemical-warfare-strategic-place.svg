<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chemical warfare in the hierarchy of force</title><desc id="desc">Three levels show conventional bombardment as normal war, chemical warfare as prohibited but militarily real, and atomic bombardment as a theoretical taboo beyond it.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.box{fill:#172936;stroke:#607f92;stroke-width:2}.chem{fill:#34361f;stroke:#c2b75d}.atom{fill:#41252b;stroke:#c96973}.tag{font:700 14px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.t{font:700 23px system-ui,sans-serif;fill:#f5eee4}.d{font:15px system-ui,sans-serif;fill:#c4cfd6}.arrow{fill:none;stroke:#e8bd57;stroke-width:5}.tip{fill:#e8bd57}.note{font:italic 16px Georgia,serif;fill:#84c7c3}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">The intermediate weapons taboo</text><text x="48" y="92" class="s">Moral hierarchy and military reality in a world without an atomic arsenal</text>
  <g transform="translate(48 170)"><rect class="box" width="300" height="300" rx="10"/><text x="22" y="40" class="tag">ORDINARY THRESHOLD</text><text x="22" y="84" class="t">Conventional bombardment</text><text x="22" y="126" class="d">Normal instrument of war</text><text x="22" y="158" class="d">Destroys people and works</text><text x="22" y="190" class="d">Air, missile, naval, orbital</text><text x="22" y="238" class="d">Restraint comes from objective,</text><text x="22" y="264" class="d">geography, and escalation</text></g>
  <path d="M348 320 H423" class="arrow"/><polygon points="438,320 417,308 417,332" class="tip"/>
  <g transform="translate(438 145)"><rect class="box chem" width="324" height="350" rx="10"/><text x="22" y="40" class="tag">UGLY MIDDLE GROUND</text><text x="22" y="84" class="t">Chemical warfare</text><text x="22" y="126" class="d">Prohibited or morally blackened</text><text x="22" y="158" class="d">Technically accessible</text><text x="22" y="190" class="d">Demonstrated in India, 1963–65</text><text x="22" y="231" class="d">Effect varies with agent, weather,</text><text x="22" y="257" class="d">protection, density, and cleanup</text><text x="22" y="306" class="d">Sanctions, reciprocal fear,</text><text x="22" y="332" class="d">permanent defensive planning</text></g>
  <path d="M762 320 H837" class="arrow"/><polygon points="852,320 831,308 831,332" class="tip"/>
  <g transform="translate(852 170)"><rect class="box atom" width="300" height="300" rx="10"/><text x="22" y="40" class="tag">THEORETICAL THRESHOLD</text><text x="22" y="84" class="t">Atomic bombardment</text><text x="22" y="126" class="d">No weapon built or tested</text><text x="22" y="158" class="d">Mass radiological destruction</text><text x="22" y="190" class="d">Apocalyptic cultural meaning</text><text x="22" y="238" class="d">First builder risks creating</text><text x="22" y="264" class="d">the arms race it hoped to avoid</text></g>
  <path d="M498 525 C574 580 680 580 756 525" fill="none" stroke="#75beba" stroke-width="3" stroke-dasharray="9 7"/><text x="627" y="604" text-anchor="middle" class="note">Defensive laboratories and protective forces persist even while first use is condemned</text>
  <text x="48" y="642" class="s">Exact agents, national stocks, first user, casualty totals, and universal legal instruments remain open.</text>
</svg>
