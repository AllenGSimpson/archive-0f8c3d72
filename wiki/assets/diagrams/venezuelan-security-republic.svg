<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Venezuelan security republic</title><desc id="desc">Venezuelan elected institutions govern domestic policy beneath American reservations over petroleum security, defense access, strategic communications, and rival military relationships.</desc><rect width="1200" height="610" fill="#11130f"/><text x="58" y="62" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Venezuelan security republic</text><text x="58" y="96" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">Domestic electoral government beneath the Caracas strategic ceiling</text><g font-family="Arial,sans-serif"><rect x="260" y="137" width="680" height="105" rx="14" fill="#252923" stroke="#c7a95b" stroke-width="4"/><text x="600" y="179" text-anchor="middle" fill="#e8e4d8" font-size="24" font-weight="700">VENEZUELAN INSTITUTIONS</text><text x="600" y="211" text-anchor="middle" fill="#a6a89d" font-size="16">elections · ministries · courts · revenue · labor · welfare · public works</text><path d="M600 242V282M160 282H1040M160 282V320M453 282V320M747 282V320M1040 282V320" fill="none" stroke="#596157" stroke-width="4"/><rect x="55" y="320" width="210" height="116" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="160" y="356" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">PETROLEUM</text><text x="160" y="386" text-anchor="middle" fill="#a6a89d" font-size="14">revenue and labor</text><text x="160" y="408" text-anchor="middle" fill="#a6a89d" font-size="14">approved operations</text><rect x="348" y="320" width="210" height="116" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="453" y="356" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">ADVISERS</text><text x="453" y="386" text-anchor="middle" fill="#a6a89d" font-size="14">defense and intelligence</text><text x="453" y="408" text-anchor="middle" fill="#a6a89d" font-size="14">communications security</text><rect x="642" y="320" width="210" height="116" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="747" y="356" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">ACCESS</text><text x="747" y="386" text-anchor="middle" fill="#a6a89d" font-size="14">air · naval · contingency</text><text x="747" y="408" text-anchor="middle" fill="#a6a89d" font-size="14">Venezuelan territory</text><rect x="935" y="320" width="210" height="116" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="1040" y="356" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">LATIN LAYER</text><text x="1040" y="386" text-anchor="middle" fill="#a6a89d" font-size="14">banks · culture · trade</text><text x="1040" y="408" text-anchor="middle" fill="#a6a89d" font-size="14">no strategic control</text><rect x="245" y="494" width="710" height="70" rx="12" fill="#211a18" stroke="#a65348" stroke-width="3"/><text x="600" y="525" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">RIVAL BASES AND OPERATING COMMAND REMAIN EXCLUDED</text><text x="600" y="549" text-anchor="middle" fill="#a6a89d" font-size="14">the intervention precedent gives American review its coercive force</text></g></svg>
