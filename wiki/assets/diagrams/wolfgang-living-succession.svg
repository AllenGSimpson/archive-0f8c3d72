<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wolfgang Hitler's living succession</title><desc id="desc">A five-stage process from motor symptoms and diagnosis through disclosure, designation, confirmation, and transfer.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09141e"/><stop offset="1" stop-color="#263340"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#d2ad68"/></marker><style>.title{font:700 43px Georgia,serif;fill:#f8f3e9}.sub{font:17px Arial,sans-serif;fill:#b8c6cf;letter-spacing:2px}.box{fill:#142735;stroke:#6d8796;stroke-width:3}.num{font:700 22px Arial,sans-serif;fill:#d9b86e}.head{font:700 25px Arial,sans-serif;fill:#fff}.date{font:700 16px Arial,sans-serif;fill:#8ec5dd}.copy{font:18px Arial,sans-serif;fill:#d4dde2}.arrow{stroke:#d2ad68;stroke-width:5;marker-end:url(#arrow)}.open{font:18px Arial,sans-serif;fill:#d9cda9}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="70" text-anchor="middle" class="title">WOLFGANG HITLER'S LIVING SUCCESSION</text><text x="800" y="108" text-anchor="middle" class="sub">ILLNESS DISCLOSED · POWER TRANSFERRED BEFORE INCAPACITY</text>
  <g transform="translate(60 185)"><rect width="260" height="390" rx="22" class="box"/><text x="28" y="46" class="num">01</text><text x="28" y="91" class="head">MOTOR SYMPTOMS</text><text x="28" y="123" class="date">c. 2009–10</text><text x="28" y="175" class="copy">Tremor and other</text><text x="28" y="205" class="copy">subtle changes</text><text x="28" y="255" class="copy">Wolfgang remains</text><text x="28" y="285" class="copy">mentally capable</text><text x="28" y="335" class="copy">Not treated as</text><text x="28" y="365" class="copy">hereditary destiny</text></g>
  <line x1="330" y1="380" x2="360" y2="380" class="arrow"/>
  <g transform="translate(370 185)"><rect width="260" height="390" rx="22" class="box"/><text x="28" y="46" class="num">02</text><text x="28" y="91" class="head">DIAGNOSIS</text><text x="28" y="123" class="date">c. 2010–12</text><text x="28" y="175" class="copy">Probable idiopathic</text><text x="28" y="205" class="copy">Parkinson's disease</text><text x="28" y="255" class="copy">Treatment preserves</text><text x="28" y="285" class="copy">useful function</text><text x="28" y="335" class="copy">Exact wording and</text><text x="28" y="365" class="copy">date remain open</text></g>
  <line x1="640" y1="380" x2="670" y2="380" class="arrow"/>
  <g transform="translate(680 185)"><rect width="260" height="390" rx="22" class="box"/><text x="28" y="46" class="num">03</text><text x="28" y="91" class="head">DISCLOSURE</text><text x="28" y="123" class="date">DATE OPEN</text><text x="28" y="175" class="copy">Illness announced</text><text x="28" y="205" class="copy">instead of hidden</text><text x="28" y="255" class="copy">Succession framed</text><text x="28" y="285" class="copy">as public duty</text><text x="28" y="335" class="copy">Rumor loses control</text><text x="28" y="365" class="copy">of the timetable</text></g>
  <line x1="950" y1="380" x2="980" y2="380" class="arrow"/>
  <g transform="translate(990 185)"><rect width="260" height="390" rx="22" class="box"/><text x="28" y="46" class="num">04</text><text x="28" y="91" class="head">DESIGNATION</text><text x="28" y="123" class="date">DATE OPEN</text><text x="28" y="175" class="copy">Alexander first</text><text x="28" y="205" class="copy">in expectation</text><text x="28" y="255" class="copy">Konrad refuses</text><text x="28" y="285" class="copy">a rival candidacy</text><text x="28" y="335" class="copy">Wolfgang can still</text><text x="28" y="365" class="copy">arbitrate conditions</text></g>
  <line x1="1260" y1="380" x2="1290" y2="380" class="arrow"/>
  <g transform="translate(1300 185)"><rect width="240" height="390" rx="22" class="box"/><text x="28" y="46" class="num">05</text><text x="28" y="91" class="head">TRANSFER</text><text x="28" y="123" class="date">DATE OPEN</text><text x="28" y="175" class="copy">Institutions confirm</text><text x="28" y="205" class="copy">the successor</text><text x="28" y="255" class="copy">Office passes while</text><text x="28" y="285" class="copy">Wolfgang is alive</text><text x="28" y="335" class="copy">Elder adviser and</text><text x="28" y="365" class="copy">family patriarch</text></g>
  <rect x="255" y="655" width="1090" height="110" rx="24" fill="#33291c" stroke="#d2ad68" stroke-width="3"/><text x="800" y="697" text-anchor="middle" class="head">THE CONSTITUTIONAL CONSTANT</text><text x="800" y="733" text-anchor="middle" class="open">Birth creates expectation; incumbent designation and institutional confirmation create the Führer</text>
  <text x="800" y="835" text-anchor="middle" class="open">Exact announcement, designation, confirmation, transfer, retirement, and death dates remain open</text>
</svg>
