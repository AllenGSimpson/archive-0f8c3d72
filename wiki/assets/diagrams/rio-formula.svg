<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Rio formula</title><desc id="d">Five pillars of the 1983 Brazilian-Vatican Falklands proposal lead toward a future sovereignty conference, while islanders and Argentine military leaders reject the transition.</desc><rect width="1200" height="520" rx="24" fill="#0a1720"/><text x="600" y="56" text-anchor="middle" fill="#f4f1df" font-family="Georgia,serif" font-size="32">RIO FORMULA · 1983</text><g font-family="Arial,sans-serif"><g fill="#17384b" stroke="#6eb5d2" stroke-width="2"><rect x="50" y="120" width="200" height="135" rx="14"/><rect x="275" y="120" width="200" height="135" rx="14"/><rect x="500" y="120" width="200" height="135" rx="14"/><rect x="725" y="120" width="200" height="135" rx="14"/><rect x="950" y="120" width="200" height="135" rx="14"/></g><g fill="#edf9fd" font-size="18" text-anchor="middle"><text x="150" y="170">JOINT</text><text x="150" y="200">ADMINISTRATION</text><text x="375" y="170">LOCAL LAW &amp;</text><text x="375" y="200">ISLANDER RIGHTS</text><text x="600" y="170">DEMILITARIZED</text><text x="600" y="200">ARCHIPELAGO</text><text x="825" y="170">SHARED</text><text x="825" y="200">RESOURCES</text><text x="1050" y="170">ARGENTINE</text><text x="1050" y="200">SYMBOLS</text></g><path d="M150 275V320H1050V275M375 275V320M600 275V320M825 275V320" fill="none" stroke="#d6bd6b" stroke-width="4"/><rect x="370" y="320" width="460" height="70" rx="35" fill="#3d3b27" stroke="#d6bd6b" stroke-width="2"/><text x="600" y="363" text-anchor="middle" fill="#fff5c9" font-size="21">20-YEAR TRANSITION → FINAL CONFERENCE</text><path d="M430 390L300 440M770 390L900 440" stroke="#e28b8b" stroke-width="3"/><text x="280" y="468" text-anchor="middle" fill="#ffc8c8" font-size="18">ISLANDERS: probable transfer</text><text x="920" y="468" text-anchor="middle" fill="#ffc8c8" font-size="18">MILITARY: indefinite delay</text></g></svg>
