<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Palestinian urban emergency government, 1947–1948</title>
  <desc id="desc">Diagram comparing the Haifa, Jaffa, and Jerusalem Arab emergency administrations, their common functions, and their alternate-history outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b20"/><stop offset="1" stop-color="#18282b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8fa8a2"/></marker>
    <style>
      .head{font:700 42px Georgia,serif;fill:#f1e5c7}.sub{font:20px Arial,sans-serif;fill:#b8c8c4}.city{font:700 29px Georgia,serif;fill:#fff2cf}.label{font:700 18px Arial,sans-serif;fill:#e9ddc0}.body{font:17px Arial,sans-serif;fill:#d5dedb}.small{font:15px Arial,sans-serif;fill:#b9c7c3}.line{stroke:#8fa8a2;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="76" class="head">Palestinian urban emergency government</text>
  <text x="82" y="112" class="sub">Three city arrangements under the collapse of the Mandate · 1947–1948</text>

  <g filter="url(#shadow)">
    <rect x="80" y="165" width="440" height="292" rx="18" fill="#254c5b" stroke="#5c8ea0" stroke-width="2"/>
    <text x="112" y="211" class="city">Haifa</text>
    <text x="112" y="246" class="label">Arab National Committee</text>
    <text x="112" y="280" class="body">• Fourteen-member urban coalition</text>
    <text x="112" y="311" class="body">• Security, health, supply, finance</text>
    <text x="112" y="342" class="body">• Negotiation with British and Haganah</text>
    <text x="112" y="373" class="body">• Authority weakened by elite departure</text>
    <rect x="110" y="397" width="380" height="38" rx="9" fill="#173743"/>
    <text x="128" y="422" class="small">Outcome: dissolved after Israeli capture</text>

    <rect x="580" y="165" width="440" height="292" rx="18" fill="#5a4730" stroke="#a98a5e" stroke-width="2"/>
    <text x="612" y="211" class="city">Jaffa</text>
    <text x="612" y="246" class="label">National committee and municipality</text>
    <text x="612" y="280" class="body">• Rival civilian and armed authorities</text>
    <text x="612" y="311" class="body">• Municipal services under Mayor Haikal</text>
    <text x="612" y="342" class="body">• Weak revenue, supply, and command</text>
    <text x="612" y="373" class="body">• Negotiation amid siege and exodus</text>
    <rect x="610" y="397" width="380" height="38" rx="9" fill="#40301f"/>
    <text x="628" y="422" class="small">Outcome: collapsed before Israeli occupation</text>

    <rect x="1080" y="165" width="440" height="292" rx="18" fill="#4c3c55" stroke="#8f72a0" stroke-width="2"/>
    <text x="1112" y="211" class="city">Jerusalem</text>
    <text x="1112" y="246" class="label">Arab Emergency Committee</text>
    <text x="1112" y="280" class="body">• AHC departments and local offices</text>
    <text x="1112" y="311" class="body">• Identity, commerce, health, intelligence</text>
    <text x="1112" y="342" class="body">• Municipal and religious counterparts</text>
    <text x="1112" y="373" class="body">• Strongest continuous Arab hinterland</text>
    <rect x="1110" y="397" width="380" height="38" rx="9" fill="#34283b"/>
    <text x="1128" y="422" class="small">Outcome: passed into Hashemite administration</text>
  </g>

  <path class="line" d="M300 458v74h310"/><path class="line" d="M800 458v74"/><path class="line" d="M1300 458v74H990"/>
  <rect x="520" y="520" width="560" height="110" rx="18" fill="#203a39" stroke="#6d9389" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="559" text-anchor="middle" class="label">Common emergency functions</text>
  <text x="800" y="592" text-anchor="middle" class="body">Public order · food and fuel · transport · medical work</text>
  <text x="800" y="618" text-anchor="middle" class="body">finance · information · relief · local defense</text>

  <path class="line" d="M800 632v64"/>
  <rect x="310" y="686" width="980" height="142" rx="18" fill="#222a2c" stroke="#69787b" stroke-width="2"/>
  <text x="800" y="728" text-anchor="middle" class="label">Shared limits</text>
  <text x="800" y="764" text-anchor="middle" class="body">No national chain of command · incomplete police recruitment · incompatible weapons</text>
  <text x="800" y="796" text-anchor="middle" class="body">interrupted roads and telephones · factional rivalry · loss of officials and tax base</text>
  <text x="80" y="872" class="small">Archive reconstruction. Exact memberships, budgets, and departmental boundaries remain open unless stated in a locality article.</text>
</svg>
