<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Cuban selective opening</title><desc id="desc">Cuban sovereign review admits Latin banking, joint ventures, maritime access, and technical services while excluding American corporate control.</desc><rect width="1200" height="590" fill="#11130f"/><text x="60" y="67" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Cuban selective opening</text><text x="60" y="101" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">Functions opened · sovereignty retained · American corporate control excluded</text><g font-family="Arial,sans-serif"><rect x="425" y="145" width="350" height="90" rx="14" fill="#252923" stroke="#c7a95b" stroke-width="4"/><text x="600" y="182" text-anchor="middle" fill="#e8e4d8" font-size="23" font-weight="700">HAVANA REVIEW</text><text x="600" y="211" text-anchor="middle" fill="#a6a89d" font-size="15">sector · partner · ownership · records · security</text><rect x="65" y="300" width="245" height="115" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="187" y="340" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">LATIN BANKING</text><text x="187" y="371" text-anchor="middle" fill="#a6a89d" font-size="15">credit · scudo claims</text><text x="187" y="393" text-anchor="middle" fill="#a6a89d" font-size="15">insurance · settlement</text><rect x="330" y="300" width="245" height="115" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="452" y="340" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">JOINT VENTURES</text><text x="452" y="371" text-anchor="middle" fill="#a6a89d" font-size="15">Cuban law and labor</text><text x="452" y="393" text-anchor="middle" fill="#a6a89d" font-size="15">Latin capital and systems</text><rect x="595" y="300" width="245" height="115" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="717" y="340" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">MARITIME ACCESS</text><text x="717" y="371" text-anchor="middle" fill="#a6a89d" font-size="15">ports · shipping · hotels</text><text x="717" y="393" text-anchor="middle" fill="#a6a89d" font-size="15">trade · repair · tourism</text><rect x="860" y="300" width="275" height="115" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="997" y="340" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">TECHNICAL SERVICES</text><text x="997" y="371" text-anchor="middle" fill="#a6a89d" font-size="15">communications · machinery</text><text x="997" y="393" text-anchor="middle" fill="#a6a89d" font-size="15">management · training</text><rect x="300" y="475" width="600" height="70" rx="12" fill="#211a18" stroke="#a65348" stroke-width="3"/><text x="600" y="505" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">AMERICAN CORPORATE CONTROL REMAINS OUTSIDE</text><text x="600" y="530" text-anchor="middle" fill="#a6a89d" font-size="15">goods may enter indirectly · controlling banking, infrastructure, and data do not</text></g><path d="M600 235V270M187 270H997M187 270V300M452 270V300M717 270V300M997 270V300" fill="none" stroke="#596157" stroke-width="4"/></svg>
