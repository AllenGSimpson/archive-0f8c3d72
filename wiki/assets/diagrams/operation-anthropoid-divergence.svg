<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Operation Anthropoid divergence</title><desc id="desc">Four stages show the weapon failure, bomb throw, slightly advanced vehicle position, severe injury and survival of Reinhard Heydrich.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#171c23"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#788d9b"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg2)"/>
  <text x="55" y="65" fill="#eef4f6" font-family="Georgia,serif" font-size="31">Operation Anthropoid: the altered physical sequence</text><text x="55" y="98" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">Prague · 27 May 1942 · a narrow divergence with decades of consequences</text>
  <g stroke="#788d9b" stroke-width="3" marker-end="url(#arrow)"><path d="M270 315H335"/><path d="M565 315H630"/><path d="M860 315H925"/></g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(45 160)"><rect width="225" height="310" rx="17" fill="#1a2731" stroke="#657d93" stroke-width="3"/><circle cx="112" cy="92" r="46" fill="#657d93"/><path d="M88 92H136M91 77L133 107" stroke="#eef4f6" stroke-width="7" stroke-linecap="round"/><text x="112" y="176" text-anchor="middle" fill="#eef4f6" font-size="20" font-weight="700">WEAPON FAILURE</text><text x="112" y="214" text-anchor="middle" fill="#c3d0d8" font-size="14">Gabčík attempts</text><text x="112" y="236" text-anchor="middle" fill="#c3d0d8" font-size="14">close-range fire;</text><text x="112" y="258" text-anchor="middle" fill="#c3d0d8" font-size="14">the weapon does not fire</text></g>
    <g transform="translate(340 160)"><rect width="225" height="310" rx="17" fill="#27241d" stroke="#b49962" stroke-width="3"/><circle cx="112" cy="92" r="46" fill="#b49962"/><circle cx="112" cy="92" r="13" fill="#17150f"/><path d="M76 92H148M112 56V128" stroke="#f6eedc" stroke-width="4"/><text x="112" y="176" text-anchor="middle" fill="#f7f0de" font-size="20" font-weight="700">BOMB THROWN</text><text x="112" y="214" text-anchor="middle" fill="#d4c8ac" font-size="14">Kubiš throws</text><text x="112" y="236" text-anchor="middle" fill="#d4c8ac" font-size="14">the prepared bomb</text><text x="112" y="258" text-anchor="middle" fill="#d4c8ac" font-size="14">toward the open car</text></g>
    <g transform="translate(635 160)"><rect width="225" height="310" rx="17" fill="#2b211f" stroke="#9a655d" stroke-width="3"/><circle cx="112" cy="92" r="46" fill="#9a655d"/><path d="M70 100H154L142 75H92L76 88Z" fill="none" stroke="#fff0ec" stroke-width="6" stroke-linejoin="round"/><circle cx="91" cy="105" r="8" fill="#fff0ec"/><circle cx="137" cy="105" r="8" fill="#fff0ec"/><path d="M55 125L35 145M67 132L55 157" stroke="#d9b367" stroke-width="5"/><text x="112" y="176" text-anchor="middle" fill="#f4e9e6" font-size="20" font-weight="700">CAR FARTHER ON</text><text x="112" y="214" text-anchor="middle" fill="#d2bcb7" font-size="14">The vehicle travels</text><text x="112" y="236" text-anchor="middle" fill="#d2bcb7" font-size="14">slightly farther;</text><text x="112" y="258" text-anchor="middle" fill="#d2bcb7" font-size="14">the blast falls behind</text></g>
    <g transform="translate(930 160)"><rect width="225" height="310" rx="17" fill="#1b2925" stroke="#6e9b7f" stroke-width="3"/><circle cx="112" cy="92" r="46" fill="#6e9b7f"/><path d="M112 57V127M77 92H147" stroke="#eef6f0" stroke-width="9" stroke-linecap="round"/><text x="112" y="176" text-anchor="middle" fill="#e8f2eb" font-size="20" font-weight="700">SURVIVAL</text><text x="112" y="214" text-anchor="middle" fill="#c1d4c7" font-size="14">Severe wounds and</text><text x="112" y="236" text-anchor="middle" fill="#c1d4c7" font-size="14">infection risk;</text><text x="112" y="258" text-anchor="middle" fill="#c1d4c7" font-size="14">no fatal septic collapse</text></g>
  </g>
  <text x="600" y="530" text-anchor="middle" fill="#d5bd73" font-family="Arial,sans-serif" font-size="16" font-weight="700">Survival is not recovery without cost.</text><text x="600" y="555" text-anchor="middle" fill="#97aab5" font-family="Arial,sans-serif" font-size="14">Multiple operations, prolonged convalescence, chronic pain, stiffness, and scarring remain permanent consequences.</text>
</svg>
