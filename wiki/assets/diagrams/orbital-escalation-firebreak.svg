<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Orbital escalation firebreak</title>
  <desc id="desc">Four bands show routine competition, bounded military confrontation, protected inhabited and strategic infrastructure, and general war.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111c"/><stop offset="1" stop-color="#182737"/></linearGradient>
    <style>.eyebrow{font:600 23px Arial,sans-serif;letter-spacing:5px;fill:#73d5e9}.title{font:700 52px Georgia,serif;fill:#f4f0e7}.sub{font:23px Arial,sans-serif;fill:#b7c2c9}.num{font:700 22px Arial,sans-serif;fill:#07111c}.head{font:700 30px Arial,sans-serif;fill:#f7f3ea}.copy{font:21px Arial,sans-serif;fill:#d9e0e4}.label{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#f7f3ea}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="85" y="80" class="eyebrow">ORBITAL STRATEGY · 1990s–2000s</text>
  <text x="85" y="142" class="title">The orbital firebreak</text>
  <text x="85" y="184" class="sub">Containment depends on what is attacked, what the attack appears to prepare, and whether shared survival remains protected.</text>

  <g transform="translate(85 245)">
    <rect width="1430" height="125" rx="24" fill="#173e49" stroke="#55a9b9" stroke-width="2"/>
    <circle cx="66" cy="62" r="28" fill="#73d5e9"/><text x="66" y="70" text-anchor="middle" class="num">I</text>
    <text x="120" y="48" class="head">NORMAL COMPETITION</text>
    <text x="120" y="84" class="copy">Surveillance · inspection · routine patrols · arms and trade rivalry · declared exercises</text>
    <text x="1300" y="73" text-anchor="middle" class="label">BELOW CRISIS</text>
  </g>

  <g transform="translate(85 390)">
    <rect width="1430" height="155" rx="24" fill="#59481f" stroke="#d0a95b" stroke-width="2"/>
    <circle cx="66" cy="76" r="28" fill="#e8b66b"/><text x="66" y="84" text-anchor="middle" class="num">II</text>
    <text x="120" y="52" class="head">BOUNDED ORBITAL CONFRONTATION</text>
    <text x="120" y="91" class="copy">Jamming · blockade · seizure · towing · attack on declared combat craft</text>
    <text x="120" y="123" class="copy">Possible direct combat while terrestrial homelands remain outside the fight</text>
    <text x="1300" y="86" text-anchor="middle" class="label">LIMITED WAR</text>
  </g>

  <g transform="translate(85 565)">
    <rect width="1430" height="150" rx="24" fill="#602a2c" stroke="#e47472" stroke-width="3"/>
    <circle cx="66" cy="74" r="28" fill="#f0807f"/><text x="66" y="82" text-anchor="middle" class="num">!</text>
    <text x="120" y="50" class="head">PROTECTED FIREBREAK</text>
    <text x="120" y="90" class="copy">Inhabited stations · life support · rescue craft · safe navigation · strategic warning</text>
    <text x="120" y="122" class="copy">Attack threatens every system or appears to prepare general war</text>
    <text x="1300" y="83" text-anchor="middle" class="label">TABOO / AMBIGUITY</text>
  </g>

  <g transform="translate(85 735)">
    <rect width="1430" height="105" rx="24" fill="#32191c" stroke="#b8484b" stroke-width="2"/>
    <circle cx="66" cy="52" r="28" fill="#bd5153"/><text x="66" y="60" text-anchor="middle" class="num">VI</text>
    <text x="120" y="45" class="head">GENERAL WAR</text>
    <text x="120" y="78" class="copy">Core territories · launch fields · strategic industry · ports · mass mobilization</text>
    <text x="1300" y="61" text-anchor="middle" class="label">FIREBREAK FAILED</text>
  </g>
</svg>
