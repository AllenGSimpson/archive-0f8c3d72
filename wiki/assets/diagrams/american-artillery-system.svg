<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">American artillery system from 1963 to 1985</title><desc id="desc">Timeline comparing the M8 and M8A2 155 mm howitzers, M9 203 mm gun, and M6 227 mm multiple rocket launcher by standard range and role.</desc><rect width="1200" height="540" fill="#11191f"/><text x="55" y="62" fill="#f1e8d6" font-family="Georgia,serif" font-size="34">American tracked artillery, 1963–1985</text><text x="55" y="98" fill="#aeb9c1" font-family="Arial,sans-serif" font-size="18">Divisional howitzers · heavy gun · corps rocket artillery</text><line x1="150" y1="214" x2="1090" y2="214" stroke="#71838d" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#315f75"><circle cx="250" cy="214" r="52"/><circle cx="770" cy="214" r="52"/></g><g fill="#73583b"><circle cx="460" cy="214" r="52"/></g><g fill="#46633f"><circle cx="1000" cy="214" r="56"/></g><g fill="#f4ebda" font-size="18" font-weight="bold"><text x="250" y="208">M8</text><text x="250" y="231">1963</text><text x="460" y="208">M9</text><text x="460" y="231">1965</text><text x="770" y="208">M8A2</text><text x="770" y="231">1978</text><text x="1000" y="208">M6</text><text x="1000" y="231">1983</text></g></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#aeb9c1" font-size="16"><text x="250" y="300">155 mm L/39</text><text x="250" y="323">18.1 km</text><text x="460" y="300">203 mm L/25</text><text x="460" y="323">17.0 km</text><text x="770" y="300">155 mm L/39</text><text x="770" y="323">23.5 km</text><text x="1000" y="300">12 × 227 mm</text><text x="1000" y="323">32.0 km</text></g><g fill="#f1e8d6" font-size="17" font-weight="bold"><text x="250" y="382">DIVISIONAL</text><text x="460" y="382">HEAVY</text><text x="770" y="382">DIVISIONAL</text><text x="1000" y="382">CORPS</text></g></g><path d="M250 427 H770" stroke="#315f75" stroke-width="10" stroke-linecap="round"/><text x="510" y="462" fill="#aeb9c1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">M8 lineage: improved ammunition, navigation, and fire-direction link</text><text x="55" y="510" fill="#7f909a" font-family="Arial,sans-serif" font-size="15">Ranges are registered standard ranges; ammunition effects, crews, and production totals remain open.</text></svg>
