<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Commonwealth Caribbean commercial network</title><desc id="desc">Belize, Jamaica, and the Bahamas connect through Commonwealth finance, maritime services, communications, and law while trading heavily with the United States.</desc><rect width="1200" height="610" fill="#11130f"/><text x="58" y="62" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Commonwealth Caribbean commercial network</text><text x="58" y="96" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">Sovereign positions · compatible institutions · mixed American and Commonwealth commerce</text><g font-family="Arial,sans-serif"><rect x="390" y="132" width="420" height="92" rx="14" fill="#252923" stroke="#c7a95b" stroke-width="4"/><text x="600" y="170" text-anchor="middle" fill="#e8e4d8" font-size="23" font-weight="700">COMMONWEALTH ROUTE</text><text x="600" y="200" text-anchor="middle" fill="#a6a89d" font-size="15">London · Canada · Caribbean partners</text><path d="M600 224V266M175 266H1025M175 266V310M600 266V310M1025 266V310" fill="none" stroke="#596157" stroke-width="4"/><rect x="55" y="310" width="240" height="120" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="175" y="347" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">BELIZE</text><text x="175" y="378" text-anchor="middle" fill="#a6a89d" font-size="14">mainland law and ports</text><text x="175" y="402" text-anchor="middle" fill="#a6a89d" font-size="14">Central American hinterland</text><rect x="480" y="310" width="240" height="120" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="600" y="347" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">JAMAICA</text><text x="600" y="378" text-anchor="middle" fill="#a6a89d" font-size="14">institutional and port center</text><text x="600" y="402" text-anchor="middle" fill="#a6a89d" font-size="14">industry · finance · media</text><rect x="905" y="310" width="240" height="120" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="1025" y="347" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">THE BAHAMAS</text><text x="1025" y="378" text-anchor="middle" fill="#a6a89d" font-size="14">finance and tourism</text><text x="1025" y="402" text-anchor="middle" fill="#a6a89d" font-size="14">Atlantic and Florida channels</text><rect x="210" y="492" width="780" height="70" rx="12" fill="#211a18" stroke="#a65348" stroke-width="3"/><text x="600" y="522" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">AMERICAN SCALE AND PROXIMITY SHAPE EVERY MARKET</text><text x="600" y="547" text-anchor="middle" fill="#a6a89d" font-size="14">Commonwealth institutions preserve a second route without excluding ordinary American exchange</text></g></svg>
