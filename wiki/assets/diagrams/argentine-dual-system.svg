<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Argentine postwar dual system</title>
  <desc id="desc">German defense inheritance, American normalization and civilian commerce, and Latin sustainment converge under Argentine institutions.</desc>
  <defs><style>.bg{fill:#08111c}.panel{fill:#101e2c;stroke:#30465d;stroke-width:2}.ar{fill:#75aadb}.de{fill:#59616b}.us{fill:#466da8}.la{fill:#9b7642}.line{stroke:#96a9bc;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:10 8}.h{font:700 28px Georgia,serif;fill:#eef4f7}.t{font:18px Arial,sans-serif;fill:#d5e0e8}.s{font:15px Arial,sans-serif;fill:#9fb0bf}.tag{font:700 15px Arial,sans-serif;fill:#07111a}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#96a9bc"/></marker></defs>
  <rect class="bg" width="1200" height="650" rx="18"/>
  <text class="h" x="600" y="50" text-anchor="middle">Argentina's post-1986 dual system</text>
  <rect class="panel" x="390" y="220" width="420" height="205" rx="14"/><rect class="ar" x="390" y="220" width="420" height="42" rx="14"/><text class="tag" x="600" y="247" text-anchor="middle">ARGENTINE NATIONAL CONTROL</text>
  <text class="t" x="600" y="302" text-anchor="middle">Armed forces · ministries · depots · factories</text><text class="t" x="600" y="337" text-anchor="middle">Courts · customs · currency · procurement</text><text class="t" x="600" y="372" text-anchor="middle">National translation of foreign standards</text><text class="s" x="600" y="405" text-anchor="middle">Command remains Argentine</text>
  <rect class="panel" x="50" y="105" width="285" height="170" rx="12"/><rect class="de" x="50" y="105" width="285" height="38" rx="12"/><text class="tag" x="192" y="130" text-anchor="middle">GERMAN INHERITANCE</text><text class="t" x="72" y="178">Weapons and platforms</text><text class="t" x="72" y="208">Doctrine and staff practice</text><text class="t" x="72" y="238">Tooling and maintenance</text>
  <rect class="panel" x="865" y="105" width="285" height="170" rx="12"/><rect class="us" x="865" y="105" width="285" height="38" rx="12"/><text class="tag" x="1007" y="130" text-anchor="middle">AMERICAN CHANNEL</text><text class="t" x="887" y="178">Arms normalization</text><text class="t" x="887" y="208">Finance and software</text><text class="t" x="887" y="238">Civilian machinery and trade</text>
  <rect class="panel" x="100" y="470" width="360" height="130" rx="12"/><rect class="la" x="100" y="470" width="360" height="38" rx="12"/><text class="tag" x="280" y="495" text-anchor="middle">LATIN SUSTAINMENT</text><text class="t" x="125" y="544">Spanish industrial lead · Italian aviation</text><text class="t" x="125" y="575">Occitan electronics · Portuguese services</text>
  <rect class="panel" x="740" y="470" width="360" height="130" rx="12"/><rect class="ar" x="740" y="470" width="360" height="38" rx="12"/><text class="tag" x="920" y="495" text-anchor="middle">MIXED NATIONAL SYSTEM</text><text class="t" x="765" y="544">Interoperability · conversion · exercises</text><text class="t" x="765" y="575">Parallel supply and documented interfaces</text>
  <path class="line" d="M335 210 C375 220 382 250 410 270"/><path class="line" d="M865 210 C825 220 818 250 790 270"/><path class="line" d="M350 470 C410 430 445 415 480 404"/><path class="line" d="M720 404 C760 430 810 445 850 470"/><path class="line dash" d="M810 345 C885 360 910 410 920 470"/>
</svg>
