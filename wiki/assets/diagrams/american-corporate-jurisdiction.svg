<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">American corporate jurisdiction in space</title><desc id="desc">Private operations sit inside federal jurisdiction while continuous occupation can support a wider national settlement interest.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#102333"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#72b7cb"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">American corporate jurisdiction</text><text x="60" y="105" fill="#a7bac5" font-family="Arial,sans-serif" font-size="17">Separate legal personality within a continuing federal jurisdiction</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="190" width="260" height="210" rx="18" fill="#173547" stroke="#5b91a5"/><text x="200" y="235" fill="#dcedf2" font-size="21" font-weight="700">PRIVATE OPERATOR</text><text x="200" y="278" fill="#b9cbd3" font-size="16">contracts · employment</text><text x="200" y="307" fill="#b9cbd3" font-size="16">ordinary loss · insurance</text><text x="200" y="336" fill="#b9cbd3" font-size="16">commercial decisions</text><text x="200" y="365" fill="#b9cbd3" font-size="16">licensed security</text>
  <rect x="470" y="160" width="260" height="270" rx="18" fill="#183b4e" stroke="#72b7cb" stroke-width="2"/><text x="600" y="205" fill="#e4f6f8" font-size="21" font-weight="700">FEDERAL JURISDICTION</text><text x="600" y="248" fill="#c2d6dd" font-size="16">registry · nationality</text><text x="600" y="277" fill="#c2d6dd" font-size="16">traffic · rescue · crime</text><text x="600" y="306" fill="#c2d6dd" font-size="16">strategic review</text><text x="600" y="335" fill="#c2d6dd" font-size="16">treaty responsibility</text><text x="600" y="375" fill="#e2c877" font-size="15">jurisdiction ≠ authorization</text>
  <rect x="870" y="190" width="260" height="210" rx="18" fill="#303b3f" stroke="#c3ad67"/><text x="1000" y="235" fill="#fff2c5" font-size="21" font-weight="700">SETTLEMENT INTEREST</text><text x="1000" y="278" fill="#d4d2c4" font-size="16">continuous occupation</text><text x="1000" y="307" fill="#d4d2c4" font-size="16">maintained works</text><text x="1000" y="336" fill="#d4d2c4" font-size="16">resident dependence</text><text x="1000" y="365" fill="#d4d2c4" font-size="16">disputed outer extent</text></g>
  <g stroke="#72b7cb" stroke-width="3" marker-end="url(#a)"><path d="M330 295H455"/><path d="M730 295H855"/></g><text x="600" y="520" fill="#9fb2bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Private responsibility, public jurisdiction, and a separately argued national claim</text>
</svg>
