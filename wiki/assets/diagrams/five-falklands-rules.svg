<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Five Falklands Rules</title><desc id="d">Five American limits bound conquest, great-power penetration, mainland attack, German intervention, and settlement.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151d"/><stop offset="1" stop-color="#233039"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f0f4f4" font-family="Georgia,serif" font-size="31">Five Falklands Rules</text><text x="60" y="105" fill="#a4b8bd" font-family="Arial,sans-serif" font-size="17">American limits for a finite war and a consent-based settlement</text><g font-family="Arial,sans-serif"><g><circle cx="115" cy="185" r="35" fill="#315361" stroke="#83a8b2" stroke-width="2"/><text x="115" y="195" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">1</text><rect x="175" y="145" width="920" height="80" rx="14" fill="#20363f" stroke="#6f929d"/><text x="210" y="194" fill="#eff4f3" font-size="19" font-weight="700">NO SOVEREIGNTY BY CONQUEST</text></g><g><circle cx="115" cy="280" r="35" fill="#3d5148" stroke="#94a77d" stroke-width="2"/><text x="115" y="290" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">2</text><rect x="175" y="240" width="920" height="80" rx="14" fill="#293b3e" stroke="#849777"/><text x="210" y="289" fill="#eff4f0" font-size="19" font-weight="700">NO RIVAL GREAT-POWER MILITARY PENETRATION</text></g><g><circle cx="115" cy="375" r="35" fill="#59473e" stroke="#ae8c71" stroke-width="2"/><text x="115" y="385" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">3</text><rect x="175" y="335" width="920" height="80" rx="14" fill="#3b373b" stroke="#9f806c"/><text x="210" y="384" fill="#f3f0ed" font-size="19" font-weight="700">NO MAINLAND ATTACK EXCEPT IMMEDIATE RESPONSE</text></g><g><circle cx="115" cy="470" r="35" fill="#4b3f56" stroke="#9784aa" stroke-width="2"/><text x="115" y="480" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">4</text><rect x="175" y="430" width="420" height="80" rx="14" fill="#34323f" stroke="#8f7fa4"/><text x="210" y="479" fill="#f0edf4" font-size="18" font-weight="700">NO GERMAN COMBAT FORMATIONS</text></g><g><circle cx="655" cy="470" r="35" fill="#315361" stroke="#83a8b2" stroke-width="2"/><text x="655" y="480" fill="#fff" text-anchor="middle" font-size="25" font-weight="700">5</text><rect x="715" y="430" width="380" height="80" rx="14" fill="#20363f" stroke="#6f929d"/><text x="750" y="466" fill="#eff4f3" font-size="17" font-weight="700">SELF-GOVERNMENT</text><text x="750" y="492" fill="#c8d5d7" font-size="15">and islander consent</text></g></g></svg>
