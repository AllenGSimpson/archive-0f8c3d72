<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Civilian journey beyond Earth</title><desc id="desc">A five-stage diagram showing qualification and training, launch, orbital stay, optional lunar extension, and return and review.</desc>
  <rect width="1200" height="540" fill="#11130f"/>
  <text x="60" y="68" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Civilian journey beyond Earth</text>
  <text x="60" y="103" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">A commercial itinerary remained a safety chain shared by carrier, destination, insurer, and public authority</text>
  <path d="M170 282H1030" stroke="#596157" stroke-width="5"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(45 155)"><rect width="210" height="250" rx="12" fill="#1d201c" stroke="#c7a95b" stroke-width="3"/><circle cx="105" cy="127" r="28" fill="#c7a95b"/><text x="105" y="55" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">QUALIFY</text><text x="105" y="87" text-anchor="middle" fill="#a6a89d" font-size="15">medical review</text><text x="105" y="109" text-anchor="middle" fill="#a6a89d" font-size="15">training · insurance</text><text x="105" y="191" text-anchor="middle" fill="#e8e4d8" font-size="15">Passenger accepted</text><text x="105" y="214" text-anchor="middle" fill="#e8e4d8" font-size="15">for one itinerary</text></g>
    <g transform="translate(270 155)"><rect width="210" height="250" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><circle cx="105" cy="127" r="28" fill="#789b8b"/><text x="105" y="55" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">LAUNCH</text><text x="105" y="87" text-anchor="middle" fill="#a6a89d" font-size="15">carrier command</text><text x="105" y="109" text-anchor="middle" fill="#a6a89d" font-size="15">baggage · restraints</text><text x="105" y="191" text-anchor="middle" fill="#e8e4d8" font-size="15">Crew authority</text><text x="105" y="214" text-anchor="middle" fill="#e8e4d8" font-size="15">is immediate</text></g>
    <g transform="translate(495 155)"><rect width="210" height="250" rx="12" fill="#252923" stroke="#d9bd71" stroke-width="3"/><circle cx="105" cy="127" r="28" fill="#d9bd71"/><text x="105" y="55" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">ORBITAL STAY</text><text x="105" y="87" text-anchor="middle" fill="#a6a89d" font-size="15">lodging · viewing</text><text x="105" y="109" text-anchor="middle" fill="#a6a89d" font-size="15">guided activity</text><text x="105" y="191" text-anchor="middle" fill="#e8e4d8" font-size="15">Most accessible</text><text x="105" y="214" text-anchor="middle" fill="#e8e4d8" font-size="15">civilian destination</text></g>
    <g transform="translate(720 155)"><rect width="210" height="250" rx="12" fill="#1d201c" stroke="#8d7352" stroke-width="3"/><circle cx="105" cy="127" r="28" fill="#8d7352"/><text x="105" y="55" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">LUNAR OPTION</text><text x="105" y="87" text-anchor="middle" fill="#a6a89d" font-size="15">transfer · descent</text><text x="105" y="109" text-anchor="middle" fill="#a6a89d" font-size="15">surface refuge</text><text x="105" y="191" text-anchor="middle" fill="#e8e4d8" font-size="15">Rarer, longer,</text><text x="105" y="214" text-anchor="middle" fill="#e8e4d8" font-size="15">lower traffic priority</text></g>
    <g transform="translate(945 155)"><rect width="210" height="250" rx="12" fill="#1d201c" stroke="#a65348" stroke-width="3"/><circle cx="105" cy="127" r="28" fill="#a65348"/><text x="105" y="55" text-anchor="middle" fill="#e8e4d8" font-size="20" font-weight="700">RETURN</text><text x="105" y="87" text-anchor="middle" fill="#a6a89d" font-size="15">re-entry · recovery</text><text x="105" y="109" text-anchor="middle" fill="#a6a89d" font-size="15">medical review</text><text x="105" y="191" text-anchor="middle" fill="#e8e4d8" font-size="15">Delay remains</text><text x="105" y="214" text-anchor="middle" fill="#e8e4d8" font-size="15">a contract risk</text></g>
  </g>
  <text x="600" y="478" text-anchor="middle" fill="#a6a89d" font-family="Arial,sans-serif" font-size="16">Professional traffic pays for the network · leisure passengers use marginal capacity · emergencies supersede private contracts</text>
</svg>
