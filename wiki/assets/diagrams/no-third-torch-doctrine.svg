<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">No Third Torch doctrine</title><desc id="desc">A sequence from the failed Second Torch landing through infrastructure, blockade, attrition, sustainable lodgment, Mount Pleasant, and the capture of Stanley.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.stage{fill:#172936;stroke:#5f7c90;stroke-width:2}.fail{fill:#48282c;stroke:#cf6b73}.prep{fill:#18323a;stroke:#69aaa7}.win{fill:#293b27;stroke:#82aa68}.tag{font:700 13px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c0ccd4}.arrow{fill:none;stroke:#e8bd57;stroke-width:4}.tip{fill:#e8bd57}.rule{font:italic 22px Georgia,serif;fill:#f5eee4}.bracket{fill:none;stroke:#75beba;stroke-width:3}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">From Second Torch to sustainable victory</text><text x="48" y="92" class="s">No operation merely because delay is politically uncomfortable</text>
  <g transform="translate(48 164)"><rect class="stage fail" width="188" height="220" rx="8"/><text x="18" y="34" class="tag">JULY 1984</text><text x="18" y="71" class="t">Second Torch</text><text x="18" y="105" class="d">Premature East</text><text x="18" y="128" class="d">Falkland landing</text><text x="18" y="160" class="d">Integrated defense</text><text x="18" y="183" class="d">defeats beachhead</text></g>
  <path d="M236 274 H273" class="arrow"/><polygon points="284,274 268,265 268,283" class="tip"/>
  <g transform="translate(284 138)"><rect class="stage prep" width="236" height="272" rx="8"/><text x="18" y="34" class="tag">PREPARE THE BASE</text><text x="18" y="71" class="t">South Georgia and</text><text x="18" y="96" class="t">West Falkland</text><text x="18" y="132" class="d">airfields · ports · roads</text><text x="18" y="157" class="d">fuel · hospitals · air defense</text><text x="18" y="182" class="d">escorts · stores · repair</text><text x="18" y="220" class="d">Winter Quay</text><text x="18" y="245" class="d">Lantern</text></g>
  <path d="M520 274 H557" class="arrow"/><polygon points="568,274 552,265 552,283" class="tip"/>
  <g transform="translate(568 138)"><rect class="stage prep" width="230" height="272" rx="8"/><text x="18" y="34" class="tag">CHANGE THE BALANCE</text><text x="18" y="71" class="t">Blockade and attrition</text><text x="18" y="108" class="d">raid, do not yet occupy</text><text x="18" y="133" class="d">reduce submarines</text><text x="18" y="158" class="d">reduce aircraft and sensors</text><text x="18" y="183" class="d">interrupt resupply</text><text x="18" y="220" class="d">local superiority</text><text x="18" y="245" class="d">redundancy · time</text></g>
  <path d="M798 274 H835" class="arrow"/><polygon points="846,274 830,265 830,283" class="tip"/>
  <g transform="translate(846 138)"><rect class="stage win" width="306" height="272" rx="8"/><text x="18" y="34" class="tag">SUSTAINABLE OFFENSIVE</text><text x="18" y="71" class="t">Lodgment to isolation</text><text x="18" y="108" class="d">Crown Gate · March 1985</text><text x="18" y="133" class="d">Blackthorn · April 1985</text><text x="18" y="158" class="d">hold after Cóndor del Sur</text><text x="18" y="183" class="d">Sceptre · Mount Pleasant</text><text x="18" y="220" class="d">methodical siege</text><text x="18" y="245" class="d">Stanley · 1986</text></g>
  <path d="M301 454 V490 H1132 V454" class="bracket"/><text x="716" y="530" text-anchor="middle" class="rule">Infrastructure + local superiority + redundancy + time</text>
  <text x="48" y="610" class="s">The doctrine constrained political timing; it did not prohibit offensive action or eliminate operational risk.</text>
</svg>
