<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Southern Archipelago Council</title><desc id="desc">Common technical coordination without federation among the Southern Archipelago states.</desc><rect width="1200" height="680" rx="32" fill="#10171d"/><text x="60" y="70" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">Common machinery without federation</text><text x="60" y="108" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">The Southern Archipelago Council coordinates movement and standards but cannot govern the states</text><g font-family="Arial,sans-serif"><circle cx="600" cy="342" r="130" fill="#173d4a" stroke="#66b4c3" stroke-width="3"/><text x="600" y="320" text-anchor="middle" fill="#9de0ea" font-size="25" font-weight="700">SOUTHERN</text><text x="600" y="352" text-anchor="middle" fill="#9de0ea" font-size="25" font-weight="700">ARCHIPELAGO</text><text x="600" y="384" text-anchor="middle" fill="#9de0ea" font-size="25" font-weight="700">COUNCIL</text><g fill="#fff" font-size="18"><text x="90" y="205">Shipping lanes</text><text x="90" y="255">Customs documents</text><text x="90" y="305">Weather and disasters</text><text x="90" y="355">Fisheries</text><text x="90" y="405">Postal and radio standards</text><text x="90" y="455">Search and rescue</text></g><g fill="#e3c678" font-size="18"><text x="900" y="205">No common citizenship</text><text x="900" y="255">No common army</text><text x="900" y="305">No taxing power</text><text x="900" y="355">No foreign policy</text><text x="900" y="405">No parliamentary authority</text><text x="900" y="455">No power over national law</text></g><path d="M300 330H450M750 330H900" stroke="#a8bbc4" stroke-width="3"/><text x="600" y="560" text-anchor="middle" fill="#fff" font-size="19">Japan chairs strategic committees · Singapore supplies finance and administrative support</text><text x="600" y="596" text-anchor="middle" fill="#a8bbc4" font-size="17">Fifteen governments implement agreements through their own laws</text></g><text x="60" y="642" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Institutional schematic</text></svg>
