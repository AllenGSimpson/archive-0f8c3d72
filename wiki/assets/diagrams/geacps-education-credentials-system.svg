<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Education and credential system of the Co-Prosperity Sphere</title>
  <desc id="desc">Diagram showing local schools, Japanese technical institutions, national certification, recognition across borders, employers, and returnee conversion.</desc>
  <rect width="920" height="560" fill="#111612"/>
  <rect x="30" y="28" width="860" height="504" rx="18" fill="#182019" stroke="#a88945" stroke-width="3"/>
  <text x="460" y="72" text-anchor="middle" fill="#e8ddbf" font-family="Georgia,serif" font-size="28">Education and credentials in the Japanese sphere</text>
  <text x="460" y="100" text-anchor="middle" fill="#b8b39e" font-family="Arial,sans-serif" font-size="14">National schooling · Japanese technical standards · portable but conditional qualification</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="145" width="220" height="112" rx="12" fill="#26372e" stroke="#789c83" stroke-width="2"/>
    <text x="180" y="177" text-anchor="middle" fill="#f1ead7" font-size="17" font-weight="bold">NATIONAL SCHOOLING</text>
    <text x="180" y="204" text-anchor="middle" fill="#d2d1c5" font-size="14">primary · language · civic history</text>
    <text x="180" y="228" text-anchor="middle" fill="#d2d1c5" font-size="14">teachers · textbooks · examinations</text>
    <rect x="350" y="132" width="220" height="138" rx="12" fill="#3b3421" stroke="#c3a85c" stroke-width="2"/>
    <text x="460" y="164" text-anchor="middle" fill="#fff2c9" font-size="17" font-weight="bold">TECHNICAL FORMATION</text>
    <text x="460" y="191" text-anchor="middle" fill="#ded5bc" font-size="14">secondary school · apprenticeship</text>
    <text x="460" y="215" text-anchor="middle" fill="#ded5bc" font-size="14">university · company institute</text>
    <text x="460" y="239" text-anchor="middle" fill="#ded5bc" font-size="14">Japanese language and standards</text>
    <rect x="630" y="145" width="220" height="112" rx="12" fill="#2f2937" stroke="#9d84ac" stroke-width="2"/>
    <text x="740" y="177" text-anchor="middle" fill="#f1ead7" font-size="17" font-weight="bold">NATIONAL LICENSE</text>
    <text x="740" y="204" text-anchor="middle" fill="#d2d1c5" font-size="14">degree · examination · profession</text>
    <text x="740" y="228" text-anchor="middle" fill="#d2d1c5" font-size="14">home-state legal authority</text>
    <path d="M290 201H350M570 201H630" stroke="#c3a85c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="105" y="335" width="210" height="120" rx="12" fill="#243244" stroke="#7f9bbd" stroke-width="2"/>
    <text x="210" y="367" text-anchor="middle" fill="#f1ead7" font-size="17" font-weight="bold">RECOGNITION</text>
    <text x="210" y="394" text-anchor="middle" fill="#d2d1c5" font-size="14">equivalence · bridging course</text>
    <text x="210" y="418" text-anchor="middle" fill="#d2d1c5" font-size="14">language · security · local law</text>
    <rect x="355" y="335" width="210" height="120" rx="12" fill="#3a2b26" stroke="#ad806d" stroke-width="2"/>
    <text x="460" y="367" text-anchor="middle" fill="#f1ead7" font-size="17" font-weight="bold">EMPLOYMENT</text>
    <text x="460" y="394" text-anchor="middle" fill="#d2d1c5" font-size="14">firm grade · professional permit</text>
    <text x="460" y="418" text-anchor="middle" fill="#d2d1c5" font-size="14">transfer · promotion · pension</text>
    <rect x="605" y="335" width="210" height="120" rx="12" fill="#263a36" stroke="#71a59b" stroke-width="2"/>
    <text x="710" y="367" text-anchor="middle" fill="#f1ead7" font-size="17" font-weight="bold">RETURN CONVERSION</text>
    <text x="710" y="394" text-anchor="middle" fill="#d2d1c5" font-size="14">translated record · retraining</text>
    <text x="710" y="418" text-anchor="middle" fill="#d2d1c5" font-size="14">school and job placement</text>
    <path d="M740 257V302H210V335M740 302H460V335M740 302H710V335" fill="none" stroke="#c3a85c" stroke-width="3"/>
    <text x="460" y="500" text-anchor="middle" fill="#c9c3af" font-size="14">A credential can cross a border more readily than citizenship, but recognition remains conditional.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3a85c"/></marker></defs>
</svg>
