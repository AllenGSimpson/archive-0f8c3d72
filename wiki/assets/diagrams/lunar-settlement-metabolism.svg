<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lunar settlement metabolism</title><desc id="desc">Five connected systems show how transport, power, local materials, habitation, and civic institutions support lunar urbanization while Earth remains connected.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141d"/><stop offset="1" stop-color="#1d2e3c"/></linearGradient><style>.title{font:700 50px Arial,sans-serif;fill:#edf5f7}.sub{font:21px Arial,sans-serif;fill:#9eb4bf;letter-spacing:2px}.box{fill:#132a38;stroke:#6d8996;stroke-width:3}.core{fill:#18394a;stroke:#7bd3e7;stroke-width:5}.head{font:700 27px Arial,sans-serif;fill:#f2f7f9}.copy{font:19px Arial,sans-serif;fill:#b8cbd3}.line{stroke:#78a3b3;stroke-width:8;fill:none}.earth{fill:#255b75;stroke:#8fd7e8;stroke-width:4}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="130" r="255" fill="#d9e2e4" opacity=".08"/>
  <text x="90" y="90" class="title">LUNAR SETTLEMENT METABOLISM</text><text x="92" y="132" class="sub">HOW A PERMANENT BASE BECOMES A MAINTAINED TOWN</text>
  <path d="M305 320H560M1040 320H1295M305 650H560M1040 650H1295M800 435V535" class="line"/>
  <rect x="80" y="225" width="420" height="190" rx="24" class="box"/><text x="290" y="278" text-anchor="middle" class="head">TRANSPORT FROM EARTH</text><text x="290" y="322" text-anchor="middle" class="copy">people · electronics · medicine</text><text x="290" y="354" text-anchor="middle" class="copy">specialist tools · return capacity</text>
  <rect x="1100" y="225" width="420" height="190" rx="24" class="box"/><text x="1310" y="278" text-anchor="middle" class="head">POWER AND RESERVE</text><text x="1310" y="322" text-anchor="middle" class="copy">reactors · solar · storage</text><text x="1310" y="354" text-anchor="middle" class="copy">essential buses · heat rejection</text>
  <rect x="80" y="555" width="420" height="190" rx="24" class="box"/><text x="290" y="608" text-anchor="middle" class="head">LOCAL BULK MATERIAL</text><text x="290" y="652" text-anchor="middle" class="copy">water · oxygen · shielding</text><text x="290" y="684" text-anchor="middle" class="copy">aggregate · glass · simple metals</text>
  <rect x="1100" y="555" width="420" height="190" rx="24" class="box"/><text x="1310" y="608" text-anchor="middle" class="head">CIVIC INSTITUTIONS</text><text x="1310" y="652" text-anchor="middle" class="copy">clinic · school · household · worship</text><text x="1310" y="684" text-anchor="middle" class="copy">records · councils · emergency authority</text>
  <rect x="560" y="260" width="480" height="420" rx="42" class="core"/><text x="800" y="335" text-anchor="middle" class="head">HABITATION AND INDUSTRY</text><text x="800" y="386" text-anchor="middle" class="copy">pressure · water recovery · thermal control</text><text x="800" y="421" text-anchor="middle" class="copy">workshops · mining · roads · local services</text><circle cx="800" cy="505" r="68" class="earth"/><path d="M756 493c35-46 87-44 98-7-24 5-29 26-54 24-20-2-24 20-44 11z" fill="#7fb28d"/><text x="800" y="608" text-anchor="middle" class="head">LUNAR TOWN</text><text x="800" y="642" text-anchor="middle" class="copy">persistent, diverse, and still Earth-dependent</text>
  <text x="90" y="835" class="copy">Growth depends on the whole circuit. Local resources reduce bulk imports; they do not replace terrestrial complexity, law, or return.</text>
</svg>
