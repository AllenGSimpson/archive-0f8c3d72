<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Princely arms market</title><desc id="desc">A flow diagram connecting foreign and Indian suppliers to finance and brokers, transport corridors, individual courts, and long-term maintenance.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111922"/><stop offset="1" stop-color="#262331"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ceb16b"/></marker></defs>
  <rect width="1200" height="740" rx="24" fill="url(#bg)"/><text x="55" y="68" fill="#f4edda" font-family="Georgia,serif" font-size="34">THE PRINCELY ARMS MARKET</text><text x="55" y="104" fill="#9eacb9" font-family="Arial,sans-serif" font-size="17">The dealer's real product is the ability to make a capability arrive—and keep it working.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="158" width="220" height="128" rx="16" fill="#2c4653" stroke="#6da4b4"/><text x="165" y="195" fill="#fff" font-size="21" font-weight="700">SUPPLIERS</text><text x="165" y="229" fill="#d8e8ed" font-size="15">German · Japanese · British</text><text x="165" y="254" fill="#d8e8ed" font-size="15">American · Russian-derived</text><text x="165" y="277" fill="#d8e8ed" font-size="15">Hyderabadi and Indian</text><rect x="355" y="158" width="220" height="128" rx="16" fill="#4b3e2d" stroke="#ceb16b"/><text x="465" y="195" fill="#fff" font-size="21" font-weight="700">FINANCE</text><text x="465" y="229" fill="#eee3c8" font-size="15">Bullion · commodity payment</text><text x="465" y="254" fill="#eee3c8" font-size="15">Court credit · insurance</text><text x="465" y="277" fill="#eee3c8" font-size="15">Guarantees and commissions</text><rect x="655" y="158" width="220" height="128" rx="16" fill="#3d3948" stroke="#9995b1"/><text x="765" y="195" fill="#fff" font-size="21" font-weight="700">BROKERS</text><text x="765" y="229" fill="#e4e0ed" font-size="15">Introductions · licenses · bribes</text><text x="765" y="254" fill="#e4e0ed" font-size="15">Ammunition · specialists</text><text x="765" y="277" fill="#e4e0ed" font-size="15">Training and documentation</text><rect x="955" y="158" width="190" height="128" rx="16" fill="#3d3035" stroke="#bb6970"/><text x="1050" y="195" fill="#fff" font-size="21" font-weight="700">TRANSIT</text><text x="1050" y="229" fill="#edd9dc" font-size="15">Ports · railways</text><text x="1050" y="254" fill="#edd9dc" font-size="15">Several borders</text><text x="1050" y="277" fill="#edd9dc" font-size="15">Fees and warehousing</text></g>
  <path d="M275 222H341M575 222H641M875 222H941" stroke="#ceb16b" stroke-width="5" marker-end="url(#a)"/>
  <path d="M1050 301V375H600V415" fill="none" stroke="#ceb16b" stroke-width="5" marker-end="url(#a)"/>
  <rect x="235" y="430" width="730" height="139" rx="18" fill="#23303b" stroke="#ceb16b" stroke-width="2"/><text x="600" y="470" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="27">INDIVIDUAL COURT PACKAGE</text><text x="600" y="506" text-anchor="middle" fill="#d5dee5" font-family="Arial,sans-serif" font-size="17">12 tanks · 6 aircraft · 2 radars · 40 machine guns</text><text x="600" y="535" text-anchor="middle" fill="#d5dee5" font-family="Arial,sans-serif" font-size="17">three years of ammunition · mechanics · training · spares</text>
  <path d="M600 570V626" stroke="#ceb16b" stroke-width="5" marker-end="url(#a)"/><rect x="330" y="640" width="540" height="63" rx="13" fill="#42392b" stroke="#ceb16b"/><text x="600" y="679" text-anchor="middle" fill="#f1e4c5" font-family="Arial,sans-serif" font-size="19">DEPENDENCE: repair · ammunition · credit · political access</text>
</svg>
