<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">American carrier and reconnaissance vehicle development</title><desc id="desc">A timeline separating full-squad tracked battle taxis from tracked and wheeled reconnaissance vehicles.</desc><rect width="1200" height="520" fill="#101820"/><text x="60" y="64" fill="#f2e9d8" font-family="Georgia,serif" font-size="34">American carrier and reconnaissance system</text><text x="60" y="101" fill="#a8b7c4" font-family="Arial,sans-serif" font-size="18">Distinct registries · shared formation · 1960–1985</text><line x1="160" y1="230" x2="1090" y2="230" stroke="#718392" stroke-width="3"/><line x1="620" y1="350" x2="1090" y2="350" stroke="#718392" stroke-width="3"/><text x="55" y="235" fill="#f2e9d8" font-family="Arial,sans-serif" font-weight="bold" font-size="19">BATTLE TAXI</text><text x="55" y="355" fill="#f2e9d8" font-family="Arial,sans-serif" font-weight="bold" font-size="19">SCOUT</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#2b6177"><circle cx="245" cy="230" r="44"/><circle cx="470" cy="230" r="44"/><circle cx="720" cy="230" r="44"/><circle cx="985" cy="230" r="48"/></g><g fill="#f2e9d8" font-size="17" font-weight="bold"><text x="245" y="225">M4</text><text x="245" y="246">1960</text><text x="470" y="225">M4A1</text><text x="470" y="246">1965</text><text x="720" y="225">M4A2</text><text x="720" y="246">1979</text><text x="985" y="225">M5</text><text x="985" y="246">1983</text></g><g fill="#815d31"><circle cx="760" cy="350" r="44"/><circle cx="1015" cy="350" r="44"/></g><g fill="#fff3d6" font-size="17" font-weight="bold"><text x="760" y="345">M2</text><text x="760" y="366">1983</text><text x="1015" y="345">M3</text><text x="1015" y="366">1984</text></g></g><g fill="#a8b7c4" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="245" y="300">2 + 11 · 12.8 t</text><text x="470" y="300">2 + 11 · 13.2 t</text><text x="720" y="300">2 + 11 · 13.8 t</text><text x="985" y="300">2 + 11 · 18.0 t</text><text x="760" y="425">tracked · 20 mm</text><text x="1015" y="425">8×8 · 25 mm</text></g><text x="60" y="482" fill="#7f909e" font-family="Arial,sans-serif" font-size="16">Cannon-free infantry lift continues beside purpose-built reconnaissance vehicles.</text></svg>
