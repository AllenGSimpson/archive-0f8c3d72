<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Mexican corporate order</title><desc id="desc">Three levels show Mexican domestic primacy, Latin commercial counterweight, and unavoidable American presence, all connected through sovereign gold settlement.</desc><rect width="1200" height="580" fill="#11130f"/><text x="60" y="67" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Mexican corporate order</text><text x="60" y="101" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">Domestic primacy · competing foreign systems · sovereign settlement</text><g font-family="Arial,sans-serif"><rect x="100" y="155" width="1000" height="105" rx="14" fill="#252923" stroke="#c7a95b" stroke-width="4"/><text x="600" y="192" text-anchor="middle" fill="#e8e4d8" font-size="24" font-weight="700">1 · MEXICAN FIRM FIRST</text><text x="600" y="225" text-anchor="middle" fill="#a6a89d" font-size="17">ownership · management · employment · tax · technical capacity</text><rect x="100" y="285" width="480" height="115" rx="14" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="340" y="325" text-anchor="middle" fill="#e8e4d8" font-size="22" font-weight="700">2 · LATIN COUNTERWEIGHT</text><text x="340" y="358" text-anchor="middle" fill="#a6a89d" font-size="16">Spanish-led diversification where</text><text x="340" y="381" text-anchor="middle" fill="#a6a89d" font-size="16">domestic capacity is insufficient</text><rect x="620" y="285" width="480" height="115" rx="14" fill="#1d201c" stroke="#a65348" stroke-width="3"/><text x="860" y="325" text-anchor="middle" fill="#e8e4d8" font-size="22" font-weight="700">3 · AMERICAN PRESENCE</text><text x="860" y="358" text-anchor="middle" fill="#a6a89d" font-size="16">border · price · supply chains</text><text x="860" y="381" text-anchor="middle" fill="#a6a89d" font-size="16">finance · technology · investment</text><rect x="225" y="445" width="750" height="75" rx="12" fill="#1d201c" stroke="#d9bd71" stroke-width="3"/><text x="600" y="477" text-anchor="middle" fill="#e8e4d8" font-size="19" font-weight="700">SOVEREIGN GOLD-DEFINED CURRENCY</text><text x="600" y="502" text-anchor="middle" fill="#a6a89d" font-size="15">settles against both dollar and scudo without joining either system</text></g><path d="M600 260V445M340 400V430H600M860 400V430H600" fill="none" stroke="#596157" stroke-width="4"/></svg>
