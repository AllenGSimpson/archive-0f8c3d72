<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sofia procurement crisis system</title><desc id="desc">Conceptual comparison of German and Latin offers and the Bulgarian compromise.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#f5d46b}.s{font:22px Arial,sans-serif;fill:#c7c1b4}.l{font:bold 27px Arial,sans-serif;fill:#fff}.b{stroke:#c8c0ae;stroke-width:2;rx:16}</style></defs><rect width="1200" height="720" fill="#101513"/><text x="55" y="62" class="h">SOFIA PROCUREMENT CRISIS · 1966</text><text x="55" y="98" class="s">When a technical mission became strategically equivalent to a base</text>
  <rect x="55" y="145" width="315" height="390" class="b" fill="#243b48"/><text x="212" y="196" text-anchor="middle" class="l">GERMAN PACKAGE</text><text x="90" y="245" class="s">• radar network</text><text x="90" y="286" class="s">• interceptors</text><text x="90" y="327" class="s">• signals architecture</text><text x="90" y="368" class="s">• advisers</text><text x="90" y="409" class="s">• Romanian exercises</text><text x="90" y="470" class="s">Claim: Black Sea defense</text>
  <rect x="830" y="145" width="315" height="390" class="b" fill="#5a392f"/><text x="987" y="196" text-anchor="middle" class="l">LATIN COUNTEROFFER</text><text x="865" y="245" class="s">• Occitan–Italian radar</text><text x="865" y="286" class="s">• development loans</text><text x="865" y="327" class="s">• Thessaloniki access</text><text x="865" y="368" class="s">• Greek exercises</text><text x="865" y="409" class="s">• northern airfields</text><text x="865" y="470" class="s">Claim: prevent hidden basing</text>
  <rect x="420" y="190" width="360" height="300" class="b" fill="#4c4930"/><text x="600" y="240" text-anchor="middle" class="l">BULGARIAN COMPROMISE</text><text x="460" y="292" class="s">German equipment</text><text x="460" y="333" class="s">Bulgarian command</text><text x="460" y="374" class="s">Adviser ceilings</text><text x="460" y="415" class="s">Latin counterweight</text><text x="600" y="458" text-anchor="middle" class="l">NO EXCLUSIVE BASE</text>
  <path d="M370 335h50M780 335h50" stroke="#e2d9c3" stroke-width="7"/><text x="600" y="608" text-anchor="middle" class="h">Equipment ≠ operational control</text><text x="600" y="650" text-anchor="middle" class="s">The rule becomes a precedent for the later Verona system.</text>
</svg>
