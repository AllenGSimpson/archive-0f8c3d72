<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">United States Naval Air Corps force, 1948–1975</title>
  <desc id="desc">Four early carrier jets develop into a mature fleet system of Tomcat fleet defense, Intruder maritime strike, Hawkeye airborne warning, and Orion land-based patrol.</desc>
  <rect width="1200" height="980" fill="#11242f"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="66" y="70" fill="#f6efe2" font-family="Georgia, serif" font-size="39" font-weight="700">United States Naval Air Corps Force</text>
    <text x="68" y="108" fill="#c8d8dc" font-size="18">From first carrier jets to layered fleet aviation · 1948–1975</text>

    <line x1="135" y1="175" x2="1080" y2="175" stroke="#78909a" stroke-width="3"/>
    <g fill="#f2d36b" font-size="15" font-weight="700" text-anchor="middle">
      <text x="170" y="151">1948</text><text x="345" y="151">1952</text><text x="500" y="151">1955</text><text x="725" y="151">1971</text><text x="840" y="151">1973</text><text x="950" y="151">1974</text><text x="1050" y="151">1975</text>
    </g>
    <g fill="#78909a"><circle cx="170" cy="175" r="6"/><circle cx="345" cy="175" r="6"/><circle cx="500" cy="175" r="6"/><circle cx="725" cy="175" r="6"/><circle cx="840" cy="175" r="6"/><circle cx="950" cy="175" r="6"/><circle cx="1050" cy="175" r="6"/></g>

    <g fill="#e8eff1" font-size="15" font-weight="700" letter-spacing="1.5">
      <text x="65" y="255">CARRIER FIGHTER</text>
      <text x="65" y="452">ALL-WEATHER DEFENSE</text>
      <text x="65" y="646">MARITIME STRIKE</text>
      <text x="65" y="807">OUTER PATROL</text>
    </g>

    <g stroke="#d9bd63" stroke-width="4" fill="none">
      <path d="M335 310 H370"/><path d="M590 310 H780"/><path d="M625 506 C760 506 770 340 780 340"/>
    </g>
    <g fill="#d9bd63"><path d="M370 310 l-14 -9 v18 z"/><path d="M780 310 l-14 -9 v18 z"/><path d="M780 340 l-14 -9 v18 z"/></g>

    <g>
      <rect x="125" y="270" width="210" height="120" rx="11" fill="#315f75" stroke="#b7ced7" stroke-width="2"/>
      <text x="149" y="304" fill="#fff" font-size="21" font-weight="700">FJ-1 Fury</text>
      <text x="149" y="335" fill="#edf7fa" font-size="14">First carrier jet · 1948</text>
      <text x="149" y="364" fill="#cde7f0" font-size="14">Launch and recovery school</text>
    </g>
    <g>
      <rect x="370" y="250" width="220" height="120" rx="11" fill="#315f75" stroke="#b7ced7" stroke-width="2"/>
      <text x="394" y="284" fill="#fff" font-size="20" font-weight="700">F2H-2 Banshee</text>
      <text x="394" y="315" fill="#edf7fa" font-size="14">Fighter and escort · 1952</text>
      <text x="394" y="344" fill="#cde7f0" font-size="14">Range, altitude, four cannon</text>
    </g>
    <g>
      <rect x="410" y="383" width="215" height="105" rx="11" fill="#485d68" stroke="#aebdc4" stroke-width="2"/>
      <text x="434" y="416" fill="#fff" font-size="20" font-weight="700">F7U-3 Cutlass</text>
      <text x="434" y="447" fill="#edf2f4" font-size="14">Limited tailless fighter · 1955</text>
      <text x="434" y="472" fill="#cfd9dd" font-size="13">Technical lessons, bounded fleet use</text>
    </g>
    <g>
      <rect x="780" y="270" width="260" height="120" rx="11" fill="#315f75" stroke="#b7ced7" stroke-width="2"/>
      <text x="804" y="304" fill="#fff" font-size="21" font-weight="700">F-14A Tomcat</text>
      <text x="804" y="335" fill="#edf7fa" font-size="14">Fleet-defense fighter · 1974</text>
      <text x="804" y="364" fill="#cde7f0" font-size="14">Six long-range missiles</text>
    </g>

    <g>
      <rect x="355" y="505" width="270" height="120" rx="11" fill="#65547c" stroke="#d2c7df" stroke-width="2"/>
      <text x="379" y="539" fill="#fff" font-size="20" font-weight="700">F3D-1 Skyknight</text>
      <text x="379" y="570" fill="#f7f2fb" font-size="14">All-weather defense · 1952</text>
      <text x="379" y="599" fill="#e2daec" font-size="14">Radar fighter and two-person crew</text>
    </g>
    <g>
      <rect x="780" y="475" width="260" height="140" rx="11" fill="#65547c" stroke="#d2c7df" stroke-width="2"/>
      <text x="804" y="509" fill="#fff" font-size="21" font-weight="700">E-2C Hawkeye</text>
      <text x="804" y="540" fill="#f7f2fb" font-size="14">Airborne early warning · 1975</text>
      <text x="804" y="569" fill="#e2daec" font-size="14">Radar, operators, fleet data link</text>
      <text x="804" y="596" fill="#e2daec" font-size="13">Detect · identify · assign · control</text>
    </g>
    <path d="M910 475 V404" stroke="#bca9d2" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
    <path d="M910 404 l-9 14 h18 z" fill="#bca9d2"/>

    <g>
      <rect x="700" y="655" width="300" height="125" rx="11" fill="#8a6530" stroke="#e6c98f" stroke-width="2"/>
      <text x="724" y="690" fill="#fff" font-size="21" font-weight="700">A-6E Intruder</text>
      <text x="724" y="722" fill="#fff8e9" font-size="14">All-weather maritime strike · 1971</text>
      <text x="724" y="751" fill="#f4dfb4" font-size="14">1,600 km radius · 8,100 kg stores</text>
    </g>

    <g>
      <rect x="760" y="815" width="300" height="115" rx="11" fill="#376f58" stroke="#b8d0c5" stroke-width="2"/>
      <text x="784" y="850" fill="#fff" font-size="21" font-weight="700">P-3C Orion</text>
      <text x="784" y="881" fill="#eef7f1" font-size="14">Land-based patrol and ASW · 1973</text>
      <text x="784" y="908" fill="#d4efdf" font-size="14">2,400 km radius beyond the deck cycle</text>
    </g>

    <g font-size="14">
      <rect x="68" y="935" width="18" height="18" rx="3" fill="#315f75"/><text x="98" y="950" fill="#d6e5e9">Carrier fighter</text>
      <rect x="240" y="935" width="18" height="18" rx="3" fill="#65547c"/><text x="270" y="950" fill="#d6e5e9">Warning and all-weather defense</text>
      <rect x="545" y="935" width="18" height="18" rx="3" fill="#8a6530"/><text x="575" y="950" fill="#d6e5e9">Maritime strike</text>
      <rect x="720" y="935" width="18" height="18" rx="3" fill="#376f58"/><text x="750" y="950" fill="#d6e5e9">Land-based patrol</text>
      <text x="1130" y="950" fill="#c8d8dc" text-anchor="end">One fleet · layered reach</text>
    </g>
  </g>
</svg>
