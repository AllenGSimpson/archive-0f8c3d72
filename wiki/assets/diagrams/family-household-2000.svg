<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Family and household life in 2000</title><desc id="d">Household responsibilities connect generations, institutions, paid work, and domestic labor.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a151a"/><stop offset="1" stop-color="#253034"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f3f5f2" font-family="Georgia,serif" font-size="31">Family and household life in 2000</text><text x="60" y="105" fill="#adbdbc" font-family="Arial,sans-serif" font-size="17">Durable families absorb work that technology and institutions do not remove</text><g font-family="Arial,sans-serif" text-anchor="middle"><path d="M600 155l210 150v205H390V305z" fill="#223c42" stroke="#779da4" stroke-width="4"/><circle cx="530" cy="300" r="44" fill="#41565a"/><circle cx="670" cy="300" r="44" fill="#41565a"/><circle cx="600" cy="402" r="38" fill="#536366"/><text x="600" y="470" fill="#eef3f0" font-size="20" font-weight="700">HOUSEHOLD</text><g fill="#26373b" stroke-width="3"><rect x="70" y="175" width="235" height="120" rx="16" stroke="#9dad79"/><rect x="70" y="390" width="235" height="120" rx="16" stroke="#b28b6e"/><rect x="895" y="175" width="235" height="120" rx="16" stroke="#9284ab"/><rect x="895" y="390" width="235" height="120" rx="16" stroke="#8da7af"/></g><g fill="#eff2ef" font-size="18" font-weight="700"><text x="188" y="222">KIN AND CARE</text><text x="188" y="250">children / elders</text><text x="188" y="437">DOMESTIC WORK</text><text x="188" y="465">meals / maintenance</text><text x="1012" y="222">INSTITUTIONS</text><text x="1012" y="250">school / church / state</text><text x="1012" y="437">PAID WORK</text><text x="1012" y="465">wage / profession / shop</text></g></g><g stroke="#758d92" stroke-width="3"><path d="M305 235h145"/><path d="M305 450h145"/><path d="M750 235h145"/><path d="M750 450h145"/></g><text x="600" y="575" fill="#a9b9b8" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Marriage remains the public norm while divorce, dual careers, and multigenerational care expand unevenly</text></svg>
