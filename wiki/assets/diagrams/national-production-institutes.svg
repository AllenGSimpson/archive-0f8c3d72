<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">National Production Institutes</title><desc id="d">A distributed training network connects colleges, unions, firms, laboratories, and industrial regions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151c"/><stop offset="1" stop-color="#1d3037"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f0f5f4" font-family="Georgia,serif" font-size="31">National Production Institutes</text><text x="60" y="105" fill="#a5b9be" font-family="Arial,sans-serif" font-size="17">A distributed answer to the gap between advanced machinery and usable skill</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="325" r="115" fill="#27444a" stroke="#78a0aa" stroke-width="3"/><text x="600" y="310" fill="#eff5f4" font-size="20" font-weight="700">REGIONAL</text><text x="600" y="338" fill="#eff5f4" font-size="20" font-weight="700">INSTITUTE</text><text x="600" y="370" fill="#c1d1d3" font-size="14">instruction / laboratory / placement</text><g fill="#20353b" stroke-width="3"><rect x="80" y="160" width="250" height="105" rx="16" stroke="#8ea579"/><rect x="870" y="160" width="250" height="105" rx="16" stroke="#aa8c71"/><rect x="80" y="430" width="250" height="105" rx="16" stroke="#899faa"/><rect x="870" y="430" width="250" height="105" rx="16" stroke="#9784a9"/></g><g fill="#edf2ef" font-size="17" font-weight="700"><text x="205" y="207">COLLEGES</text><text x="205" y="232">engineering schools</text><text x="995" y="207">FIRMS</text><text x="995" y="232">equipment / placements</text><text x="205" y="477">UNIONS</text><text x="205" y="502">apprenticeships</text><text x="995" y="477">REGIONS</text><text x="995" y="502">plants / public agencies</text></g></g><g stroke="#66858d" stroke-width="3"><path d="M330 235l175 55"/><path d="M870 235l-175 55"/><path d="M330 465l175-90"/><path d="