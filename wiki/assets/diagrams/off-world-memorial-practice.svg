<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Death and memorial practice beyond Earth</title><desc id="d">Medical confirmation leads to civil record, investigation, disposition of remains, religious observance, and memory.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1118"/><stop offset="1" stop-color="#20232b"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f0f2f4" font-family="Georgia,serif" font-size="31">Death beyond Earth</text><text x="60" y="104" fill="#aeb6c0" font-family="Arial,sans-serif" font-size="17">A technical event becomes a civil, religious, familial, and public record</text><g transform="translate(600 315)" fill="none" stroke-width="3"><circle r="190" stroke="#586f83"/><circle r="140" stroke="#708da0"/><circle r="90" stroke="#a18f63"/><circle r="40" stroke="#bf7a7c"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700"><text x="600" y="150" fill="#dbe3e8" font-size="18">PUBLIC MEMORY</text><text x="600" y="205" fill="#dbe3e8" font-size="17">RELIGION AND FAMILY</text><text x="600" y="260" fill="#f0dfae" font-size="17">CIVIL RECORD AND INVESTIGATION</text><text x="600" y="320" fill="#f5dcdc" font-size="16">MEDICAL</text><text x="600" y="342" fill="#f5dcdc" font-size="16">CONFIRMATION</text></g><g font-family="Arial,sans-serif" fill="#aeb8c0" font-size="15"><text x="75" y="525">Recovery may be delayed or impossible.</text><text x="830" y="525">A memorial can exist without recovered remains.</text></g><text x="600" y="580" fill="#929eaa" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">The safety of the living controls every recovery decision</text></svg>
