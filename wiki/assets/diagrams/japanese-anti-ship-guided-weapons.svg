<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese anti-ship guided weapons, 1947–1982</title>
  <desc id="desc">A four-stage lineage showing growth from 35-kilometer radio-command Ōka to 480-kilometer networked over-the-horizon Tsubaki.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111b24"/><stop offset="1" stop-color="#173139"/></linearGradient>
    <linearGradient id="range" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b64b55"/><stop offset="1" stop-color="#2c8172"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter>
    <style>.title{font:700 39px Georgia,serif;fill:#f6efe0}.sub{font:18px Arial,sans-serif;fill:#b8cbce}.name{font:700 22px Arial,sans-serif;fill:#fff}.type{font:700 15px Arial,sans-serif;fill:#f1d16c}.meta{font:15px Arial,sans-serif;fill:#dce8e7}.role{font:14px Arial,sans-serif;fill:#bed0d0}.box{stroke:#b9ccca;stroke-width:1.6;rx:11;filter:url(#shadow)}.line{stroke:#d8bd67;stroke-width:5;fill:none}.scale{font:14px Arial,sans-serif;fill:#b9cbce}.label{font:700 17px Arial,sans-serif;fill:#f0cf68;letter-spacing:1px}.note{font:14px Arial,sans-serif;fill:#b9cbce}</style>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="58" fill="#bb2633"/>
  <text x="70" y="75" class="title">Japanese Anti-Ship Guided Weapons</text>
  <text x="70" y="108" class="sub">Flower-named unmanned fleet weapons · 1947–1982</text>

  <text x="70" y="205" class="label">GUIDANCE AND PLATFORM DEVELOPMENT</text>
  <path d="M170 430 H1070" class="line"/><path d="M1058 420 L1075 430 L1058 440" class="line"/>
  <rect class="box" x="80" y="255" width="245" height="220" fill="#8d4149"/>
  <text x="105" y="295" class="name">Type 7 Ōka</text><text x="105" y="325" class="type">1947 · 35 km</text><text x="105" y="355" class="meta">800 kg warhead</text><text x="105" y="387" class="role">Radio command</text><text x="105" y="413" class="role">Bomber / maritime aircraft</text><text x="105" y="448" class="role">Unmanned—not suicide aviation</text>
  <rect class="box" x="345" y="255" width="245" height="220" fill="#745460"/>
  <text x="370" y="295" class="name">Type 18 Kiku</text><text x="370" y="325" class="type">1958 · 120 km</text><text x="370" y="355" class="meta">500 kg warhead</text><text x="370" y="387" class="role">Radar guided</text><text x="370" y="413" class="role">Maritime strike aircraft</text>
  <rect class="box" x="610" y="255" width="245" height="220" fill="#4d686c"/>
  <text x="635" y="295" class="name">Type 30 Ume</text><text x="635" y="325" class="type">1970 · 250 km</text><text x="635" y="355" class="meta">450 kg warhead</text><text x="635" y="387" class="role">Active radar</text><text x="635" y="413" class="role">Aircraft / surface ship</text>
  <rect class="box" x="875" y="255" width="245" height="220" fill="#2c756c"/>
  <text x="900" y="295" class="name">Type 42 Tsubaki</text><text x="900" y="325" class="type">1982 · 480 km</text><text x="900" y="355" class="meta">400 kg warhead</text><text x="900" y="387" class="role">Networked over the horizon</text><text x="900" y="413" class="role">Long-range maritime aircraft</text>

  <text x="70" y="575" class="label">REGISTERED RANGE</text>
  <rect x="100" y="625" width="960" height="34" rx="17" fill="#243c43"/>
  <rect x="100" y="625" width="960" height="34" rx="17" fill="url(#range)" opacity=".9"/>
  <g fill="#f5d66f"><circle cx="170" cy="642" r="9"/><circle cx="340" cy="642" r="9"/><circle cx="600" cy="642" r="9"/><circle cx="1060" cy="642" r="9"/></g>
  <g class="scale" text-anchor="middle"><text x="170" y="690">35 km</text><text x="340" y="690">120 km</text><text x="600" y="690">250 km</text><text x="1060" y="690">480 km</text></g>
  <text x="70" y="785" class="note">Range increases while control moves from operator command to radar homing and a distributed maritime network.</text>
  <text x="70" y="817" class="note">The register fixes range, warhead, platform, and guidance role; detailed hardware and operational history remain open.</text>
</svg>
