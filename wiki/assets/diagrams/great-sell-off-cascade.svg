<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Great Sell-Off cascade</title><desc id="desc">Timeline from the May ownership report through the June leak, summer divestiture law, September forced sales, and October credit and employment crisis.</desc><rect width="1200" height="700" fill="#101713"/><text x="600" y="66" fill="#d8c58c" text-anchor="middle" font-family="Georgia,serif" font-size="34">THE GREAT SELL-OFF · 1990</text><path d="M110 325 H1090" stroke="#d8c58c" stroke-width="6"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#193f46" stroke="#63c7d7" stroke-width="3"><circle cx="150" cy="325" r="22"/><circle cx="365" cy="325" r="22"/><circle cx="585" cy="325" r="22"/><circle cx="805" cy="325" r="22"/><circle cx="1030" cy="325" r="22"/></g><g fill="#eef2e8" font-size="21"><text x="150" y="185">MAY</text><text x="150" y="220">ownership map</text><text x="365" y="405">JUNE</text><text x="365" y="440">report leaks</text><text x="585" y="185">JULY–AUGUST</text><text x="585" y="220">integrity act</text><text x="805" y="405">SEPTEMBER</text><text x="805" y="440">forced selling</text><text x="1030" y="185">OCTOBER</text><text x="1030" y="220">panic visible</text></g><g fill="#9da99d" font-size="17"><text x="150" y="255">aggregation revealed</text><text x="365" y="475">politics outruns evidence</text><text x="585" y="255">months, not years</text><text x="805" y="475">buyers wait</text><text x="1030" y="255">credit and jobs fail</text></g><path d="M805 500 C850 570 970 570 1030 500" fill="none" stroke="#c45050" stroke-width="5" marker-end="url(#b)"/><text x="920" y="610" fill="#c45050" font-size="20">equity → collateral → credit → employment</text><text x="600" y="660" fill="#9da99d" font-size="17">Archive reconstruction · canonical event sequence</text></g><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c45050"/></marker></defs></svg>
