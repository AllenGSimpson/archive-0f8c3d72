<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">British defeat and reconstruction, 1943–1951</title><desc id="desc">A chronological diagram from Operation Torch through the Second Battle of Britain, White Parachutes, 1947 election, Brick Parliament, and Contract Commonwealth.</desc>
  <rect width="1600" height="900" fill="#101820"/><text x="90" y="95" fill="#f2e8d5" font-family="Georgia,serif" font-size="54">From defeat to the Siege Commonwealth</text><text x="92" y="140" fill="#9eb3c2" font-family="Arial,sans-serif" font-size="24">1943–1951 · military failure, constitutional restraint, parliamentary reconstruction</text>
  <path d="M150 430H1450" stroke="#6f8794" stroke-width="8"/><g font-family="Arial,sans-serif">
    <g transform="translate(180 0)"><circle cy="430" r="24" fill="#b23a48"/><rect x="-110" y="210" width="220" height="145" rx="16" fill="#24323d" stroke="#b23a48" stroke-width="3"/><text x="0" y="255" fill="#f2e8d5" font-size="25" text-anchor="middle">12 April 1943</text><text x="0" y="292" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">Algiers</text><text x="0" y="325" fill="#fff" font-size="22" text-anchor="middle">Capitulation</text></g>
    <g transform="translate(490 0)"><circle cy="430" r="24" fill="#d36b32"/><rect x="-120" y="510" width="240" height="155" rx="16" fill="#24323d" stroke="#d36b32" stroke-width="3"/><text x="0" y="555" fill="#f2e8d5" font-size="25" text-anchor="middle">1945–47</text><text x="0" y="593" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">Strategic</text><text x="0" y="626" fill="#fff" font-size="22" text-anchor="middle">exhaustion</text></g>
    <g transform="translate(800 0)"><circle cy="430" r="24" fill="#f1c75b"/><rect x="-125" y="210" width="250" height="145" rx="16" fill="#24323d" stroke="#f1c75b" stroke-width="3"/><text x="0" y="255" fill="#f2e8d5" font-size="25" text-anchor="middle">1947</text><text x="0" y="292" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">White</text><text x="0" y="325" fill="#fff" font-size="22" text-anchor="middle">Parachutes</text></g>
    <g transform="translate(1110 0)"><circle cy="430" r="24" fill="#5b9bd5"/><rect x="-125" y="510" width="250" height="155" rx="16" fill="#24323d" stroke="#5b9bd5" stroke-width="3"/><text x="0" y="555" fill="#f2e8d5" font-size="25" text-anchor="middle">6 Nov. 1947</text><text x="0" y="593" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">Election &amp;</text><text x="0" y="626" fill="#fff" font-size="22" text-anchor="middle">minority ministry</text></g>
    <g transform="translate(1420 0)"><circle cy="430" r="24" fill="#61a87b"/><rect x="-130" y="210" width="260" height="145" rx="16" fill="#24323d" stroke="#61a87b" stroke-width="3"/><text x="0" y="255" fill="#f2e8d5" font-size="25" text-anchor="middle">1948–51</text><text x="0" y="292" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">Brick</text><text x="0" y="325" fill="#fff" font-size="22" text-anchor="middle">Parliament</text></g>
  </g><text x="800" y="805" fill="#f2e8d5" font-family="Georgia,serif" font-size="32" text-anchor="middle">The Crown survived by refusing dictatorship; Parliament survived by producing material results.</text>
</svg>
