<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Constitutional free enterprise</title><desc id="d">Competitive markets and independent institutions balance with a social floor and strategic state.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151d"/><stop offset="1" stop-color="#273039"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f1f5f3" font-family="Georgia,serif" font-size="31">Constitutional free enterprise</text><text x="60" y="105" fill="#a6b9bd" font-family="Arial,sans-serif" font-size="17">Dispersed economic power as part of constitutional pluralism</text><path d="M600 155v300M300 455h600" stroke="#94a9ad" stroke-width="8"/><path d="M600 175L420 455M600 175l180 280" stroke="#718f98" stroke-width="5"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="115" y="350" width="370" height="130" rx="18" fill="#243c43" stroke="#789fac" stroke-width="3"/><text x="300" y="397" fill="#eff4f3" font-size="20" font-weight="700">MARKETS + INSTITUTIONS</text><text x="300" y="432" fill="#c2d1d3" font-size="15">firms / unions / states / civil liberty</text><rect x="715" y="350" width="370" height="130" rx="18" fill="#3b393d" stroke="#a28d7d" stroke-width="3"/><text x="900" y="397" fill="#f2efed" font-size="20" font-weight="700">PUBLIC OBLIGATIONS</text><text x="900" y="432" fill="#d4c9c2" font-size="15">social floor / defense / strategic capacity</text><circle cx="600" cy="175" r="82" fill="#2b444a" stroke="#85a4ab" stroke-width="3"/><text x="600" y="168" fill="#f0f5f4" font-size="18" font-weight="700">REPUBLIC</text><text x="600" y="197" fill="#c4d3d5" font-size="15">not the party</text></g><text x="600" y="560" fill="#a8b8bb" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">The debate concerns the boundary, not the existence, of a strategic state</text></svg>
