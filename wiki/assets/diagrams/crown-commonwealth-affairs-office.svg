<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Minister of State for Crown and Commonwealth Affairs</title><desc id="desc">The ministerial office connecting Cabinet, Parliament, Commonwealth institutions, and official Palace briefing.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="31" font-weight="700">Crown and Commonwealth Affairs</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">Official information, constitutional distinction, and parliamentary responsibility</text><rect x="395" y="250" width="410" height="130" rx="17" fill="#293846" stroke="#d1b86d" stroke-width="2"/><text x="600" y="289" fill="#f0e8d5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">MINISTER OF STATE</text><text x="600" y="320" fill="#d6c586" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700">Enoch Powell</text><text x="600" y="349" fill="#b5c1c6" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">coordination · briefs · Council representation</text><g fill="#19303d" stroke="#638091"><rect x="70" y="180" width="240" height="105" rx="13"/><rect x="890" y="180" width="240" height="105" rx="13"/><rect x="70" y="405" width="240" height="105" rx="13"/><rect x="890" y="405" width="240" height="105" rx="13"/><rect x="455" y="470" width="290" height="105" rx="13"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#d6c586" font-size="16" font-weight="700"><text x="190" y="216">CABINET &amp; SERVICES</text><text x="1010" y="216">PARLIAMENT</text><text x="190" y="441">COMMONWEALTH COUNCIL</text><text x="1010" y="441">REALMS &amp; PARTNERS</text><text x="600" y="506">PALACE &amp; PRIVY COUNCIL</text></g><g fill="#b5c1c6" font-size="13"><text x="190" y="244">alternatives · assessments</text><text x="190" y="263">treaty and defense policy</text><text x="1010" y="244">authority · supply · answers</text><text x="1010" y="263">ministerial responsibility</text><text x="190" y="469">Dominion and technical warnings</text><text x="190" y="488">recorded objections</text><text x="1010" y="469">different Crowns and advice</text><text x="1010" y="488">protected-state obligations</text><text x="600" y="534">official briefings · tours · constitutional business</text><text x="600" y="553">Private Secretary remains gatekeeper</text></g></g><g stroke="#b49a5a" stroke-width="2" fill="none"><path d="M310 233H395M805 233H890M310 457L395 350M805 350L890 457M600 380V470"/></g><text x="600" y="614" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">The office improves what the sovereign is told; it grants no power to direct the Crown against elected ministers.</text></svg>
