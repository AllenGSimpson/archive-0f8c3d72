<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">War-termination annex</title><desc id="desc">A military plan must pass through four questions about its political end state, territorial changes, recurrence of war, and inherited administration before it can be judged a usable victory.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.input{fill:#3e2b2c;stroke:#bf686c;stroke-width:2}.q{fill:#172936;stroke:#5f7f92;stroke-width:2}.out{fill:#263827;stroke:#82aa68;stroke-width:2}.tag{font:700 13px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.t{font:700 20px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c2cdd4}.arrow{fill:none;stroke:#e8bd57;stroke-width:4}.tip{fill:#e8bd57}.quote{font:italic 22px Georgia,serif;fill:#84c7c3}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">The war-termination annex</text><text x="48" y="92" class="s">Operational success is incomplete until the proposed peace survives four political tests</text>
  <g transform="translate(48 142)"><rect class="input" width="224" height="154" rx="9"/><text x="18" y="38" class="tag">OPERATIONAL CLAIM</text><text x="18" y="77" class="t">“We can seize it.”</text><text x="18" y="111" class="d">forces · route · timetable</text><text x="18" y="135" class="d">losses · immediate objective</text></g>
  <path d="M272 219 H321" class="arrow"/><polygon points="334,219 315,208 315,230" class="tip"/>
  <g transform="translate(334 116)"><rect class="q" width="364" height="214" rx="9"/><text x="18" y="36" class="tag">THE FOUR REQUIRED ANSWERS</text><text x="18" y="73" class="t">1. What condition ends the war?</text><text x="18" y="109" class="t">2. What territory changes hands?</text><text x="18" y="145" class="t">3. What prevents renewed war?</text><text x="18" y="181" class="t">4. What government do we inherit?</text></g>
  <path d="M698 219 H747" class="arrow"/><polygon points="760,219 741,208 741,230" class="tip"/>
  <g transform="translate(760 142)"><rect class="out" width="392" height="154" rx="9"/><text x="18" y="38" class="tag">USABLE POLITICAL VICTORY</text><text x="18" y="77" class="t">Bounded aim and stopping point</text><text x="18" y="111" class="d">administration · legitimacy · mediation</text><text x="18" y="135" class="d">withdrawal · inspection · durable settlement</text></g>
  <path d="M516 330 V383" class="arrow"/><polygon points="516,398 505,379 527,379" class="tip"/>
  <g transform="translate(246 398)"><rect class="input" width="540" height="118" rx="9"/><text x="270" y="39" text-anchor="middle" class="tag">FAILURE OF THE PEACE TEST</text><text x="270" y="75" text-anchor="middle" class="t">Military success without a governable settlement</text><text x="270" y="100" text-anchor="middle" class="d">The war aim is defective even when the operation is feasible</text></g>
  <text x="600" y="580" text-anchor="middle" class="quote">“Fine. Who governs it on Tuesday?”</text>
  <text x="48" y="642" class="s">National titles and forms differ. The shared institution is the demand that strategy explain the peace, not merely the battle.</text>
</svg>
