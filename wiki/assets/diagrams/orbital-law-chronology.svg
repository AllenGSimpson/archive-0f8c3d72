<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Chronology of orbital law</title>
  <desc id="desc">Timeline of the Weather Commons, Kobe Notes, Geneva weapons convention, Stockholm safety convention, and Geneva incidents agreement.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#202a3d"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <text x="58" y="65" fill="white" font-family="Georgia,serif" font-size="34" font-weight="700">Orbital law: safety without demilitarization</text>
  <text x="58" y="101" fill="#aebfce" font-family="Arial,sans-serif" font-size="18">Rules accumulate around public services, contamination, debris, rescue, and dangerous encounters.</text>
  <path d="M100 320 H1100" stroke="#7edcff" stroke-width="6"/>
  <g font-family="Arial,sans-serif" filter="url(#sh)">
    <g transform="translate(55 160)"><circle cx="85" cy="160" r="12" fill="#7edcff"/><rect width="170" height="130" rx="14" fill="#153b4e" stroke="#7edcff"/><text x="18" y="32" fill="#9be8ff" font-size="16">1969–70</text><text x="18" y="61" fill="white" font-size="20" font-weight="700">Weather Commons</text><text x="18" y="88" fill="#c3d6df" font-size="14">Protected public</text><text x="18" y="109" fill="#c3d6df" font-size="14">service category</text></g>
    <g transform="translate(270 345)"><circle cx="85" cy="-25" r="12" fill="#82d9b0"/><rect width="170" height="130" rx="14" fill="#244337" stroke="#82d9b0"/><text x="18" y="32" fill="#9bedbc" font-size="16">1970</text><text x="18" y="61" fill="white" font-size="20" font-weight="700">Kobe Notes</text><text x="18" y="88" fill="#cbe0d2" font-size="14">Radio interference</text><text x="18" y="109" fill="#cbe0d2" font-size="14">and authentication</text></g>
    <g transform="translate(485 160)"><circle cx="85" cy="160" r="12" fill="#f2c76f"/><rect width="170" height="130" rx="14" fill="#4c432e" stroke="#f2c76f"/><text x="18" y="32" fill="#ffe39d" font-size="16">1974</text><text x="18" y="61" fill="white" font-size="20" font-weight="700">Geneva</text><text x="18" y="88" fill="#e2d9ba" font-size="14">Mass-effect weapon</text><text x="18" y="109" fill="#e2d9ba" font-size="14">restrictions</text></g>
    <g transform="translate(700 345)"><circle cx="85" cy="-25" r="12" fill="#b5a1ff"/><rect width="170" height="130" rx="14" fill="#3e3658" stroke="#b5a1ff"/><text x="18" y="32" fill="#cdbfff" font-size="16">1976</text><text x="18" y="61" fill="white" font-size="20" font-weight="700">Stockholm</text><text x="18" y="88" fill="#d8d0e4" font-size="14">Registration · rescue</text><text x="18" y="109" fill="#d8d0e4" font-size="14">debris · salvage</text></g>
    <g transform="translate(915 160)"><circle cx="85" cy="160" r="12" fill="#ff9fb0"/><rect width="205" height="130" rx="14" fill="#55343d" stroke="#ff9fb0"/><text x="18" y="32" fill="#ffbcc7" font-size="16">1982</text><text x="18" y="61" fill="white" font-size="20" font-weight="700">Geneva Incidents</text><text x="18" y="88" fill="#e5ccd2" font-size="14">Close approaches · zones</text><text x="18" y="109" fill="#e5ccd2" font-size="14">notice · life support</text></g>
  </g>
  <g transform="translate(135 535)" font-family="Arial,sans-serif"><text x="0" y="0" fill="#aebfce" font-size="16">What the system does not create:</text><text x="225" y="0" fill="#f1f7fb" font-size="16" font-weight="700">universal disarmament · one enforcement authority · a ban on all conventional orbital weapons</text></g>
</svg>
