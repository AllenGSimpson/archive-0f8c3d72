<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Indian arms market flows</title><desc id="desc">Weapons and support from Britain, Japan, Germany, Russian successors, and commercial sellers pass through ports, courts, concessions, and brokers into mixed Indian arsenals.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.src{fill:#172936;stroke:#5f7f92;stroke-width:2}.market{fill:#2c2520;stroke:#bc8e54;stroke-width:2}.user{fill:#253426;stroke:#78a56c;stroke-width:2}.t{font:700 19px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c2cdd4}.tag{font:700 12px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.line{fill:none;stroke:#d3ad55;stroke-width:3}.tip{fill:#d3ad55}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Indian arms market</text><text x="50" y="92" class="s">Political patronage, commercial sale, surplus, capture, and local manufacture entered the same theater</text>
  <g transform="translate(48 135)"><rect class="src" width="260" height="78" rx="8"/><text x="18" y="31" class="tag">BRITAIN</text><text x="18" y="58" class="d">rifles · TADEN · carriers · aviation</text></g><g transform="translate(48 232)"><rect class="src" width="260" height="78" rx="8"/><text x="18" y="31" class="tag">JAPAN</text><text x="18" y="58" class="d">coherent systems · ammunition · advisers</text></g><g transform="translate(48 329)"><rect class="src" width="260" height="78" rx="8"/><text x="18" y="31" class="tag">GERMANY</text><text x="18" y="58" class="d">small high-quality lots · optics · radios</text></g><g transform="translate(48 426)"><rect class="src" width="260" height="78" rx="8"/><text x="18" y="31" class="tag">RUSSIAN SUCCESSORS</text><text x="18" y="58" class="d">T-34/85 · SU vehicles · surplus</text></g><g transform="translate(48 523)"><rect class="src" width="260" height="78" rx="8"/><text x="18" y="31" class="tag">OTHER / LOCAL</text><text x="18" y="58" class="d">American · Italian · captured · copied</text></g>
  <path d="M308 174 H404 M308 271 H404 M308 368 H404 M308 465 H404 M308 562 H404" class="line"/>
  <g transform="translate(404 192)"><rect class="market" width="356" height="326" rx="12"/><text x="178" y="40" text-anchor="middle" class="tag">MARKET AND TRANSIT NODES</text><text x="24" y="82" class="t">Ports and concessions</text><text x="24" y="110" class="d">Goa · Ceylon · Burmese and captured ports</text><text x="24" y="156" class="t">Princely courts and missions</text><text x="24" y="184" class="d">state purchase · aid · recognition</text><text x="24" y="230" class="t">Brokers and overland routes</text><text x="24" y="258" class="d">Persia · Afghanistan · Indus · caravan</text><text x="24" y="298" class="d">parts and ammunition often incomplete</text></g>
  <path d="M760 355 H858" class="line"/><polygon points="874,355 853,343 853,367" class="tip"/>
  <g transform="translate(874 220)"><rect class="user" width="278" height="270" rx="10"/><text x="18" y="36" class="tag">MIXED INDIAN ARSENALS</text><text x="18" y="78" class="t">Four or five equipment families</text><text x="18" y="111" class="d">ammunition · engines · tracks</text><text x="18" y="137" class="d">radios · tools · manuals</text><text x="18" y="179" class="t">Operational trade-off</text><text x="18" y="212" class="d">low tactical efficiency</text><text x="18" y="238" class="d">no single fatal supply route</text></g>
  <text x="600" y="641" text-anchor="middle" class="s">A weapon's country of origin did not reliably identify the politics of its Indian user.</text>
</svg>
