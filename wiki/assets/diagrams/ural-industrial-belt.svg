<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Eastern Ural industrial belt</title><desc id="desc">Nizhny Tagil, Chelyabinsk, and Magnitogorsk exchange armored design, heavy engineering, and steel east of the German-held Ural crest.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151e"/><stop offset="1" stop-color="#111d2a"/></linearGradient><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="5" height="14" fill="#593334"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d9c26f"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">THE EASTERN-URAL INDUSTRIAL BELT</text>
  <g font-family="Arial,sans-serif">
    <rect x="35" y="110" width="160" height="340" rx="18" fill="url(#hatch)" stroke="#b86666" stroke-width="3"/><text x="115" y="250" text-anchor="middle" fill="#fff" font-size="20" transform="rotate(-90 115 250)">GERMAN-HELD URAL CREST</text>
    <g transform="translate(245 138)"><rect width="250" height="230" rx="18" fill="#253746" stroke="#73a8c7" stroke-width="3"/><text x="125" y="48" text-anchor="middle" fill="#fff" font-size="25">NIZHNY TAGIL</text><text x="125" y="88" text-anchor="middle" fill="#dceaf2" font-size="17">Plant No. 183</text><text x="125" y="118" text-anchor="middle" fill="#dceaf2" font-size="17">medium tanks</text><text x="125" y="148" text-anchor="middle" fill="#dceaf2" font-size="17">design archives</text><text x="125" y="195" text-anchor="middle" fill="#f0d98b" font-size="15">ARMORED LINEAGE</text></g>
    <g transform="translate(590 138)"><rect width="250" height="230" rx="18" fill="#3c3428" stroke="#cba76d" stroke-width="3"/><text x="125" y="48" text-anchor="middle" fill="#fff" font-size="25">CHELYABINSK</text><text x="125" y="88" text-anchor="middle" fill="#f4e6ca" font-size="17">Tankograd</text><text x="125" y="118" text-anchor="middle" fill="#f4e6ca" font-size="17">engines and armor</text><text x="125" y="148" text-anchor="middle" fill="#f4e6ca" font-size="17">heavy engineering</text><text x="125" y="195" text-anchor="middle" fill="#f0d98b" font-size="15">MILITARY REPUBLIC</text></g>
    <g transform="translate(915 138)"><rect width="250" height="230" rx="18" fill="#293a31" stroke="#86b98e" stroke-width="3"/><text x="125" y="48" text-anchor="middle" fill="#fff" font-size="25">MAGNITOGORSK</text><text x="125" y="88" text-anchor="middle" fill="#dff1e2" font-size="17">steel and plate</text><text x="125" y="118" text-anchor="middle" fill="#dff1e2" font-size="17">rails and forgings</text><text x="125" y="148" text-anchor="middle" fill="#dff1e2" font-size="17">ore and furnaces</text><text x="125" y="195" text-anchor="middle" fill="#f0d98b" font-size="15">METALLURGICAL STATE</text></g>
    <path d="M495 252H590" stroke="#d9c26f" stroke-width="5" marker-end="url(#arrow)"/><path d="M915 287H840" stroke="#d9c26f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="705" y="432" text-anchor="middle" fill="#f0d98b" font-size="20">No city retains the complete Soviet supply chain.</text><text x="705" y="470" text-anchor="middle" fill="#bfc8cb" font-size="17">Interdependence sustains production while guarding each factory-state's autonomy.</text>
  </g>
</svg>
