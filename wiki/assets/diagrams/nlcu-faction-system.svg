<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Faction system of the National Liberal–Constitutional Union</title>
  <desc id="desc">Four faction cards show the market-radical wing, Ashcombe stewardship center, Crown-and-Commonwealth right, and Mallory Development Right linked by shared NLCU commitments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1724"/><stop offset="1" stop-color="#1a2a3c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="760" rx="32" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#f4f7fb" font-family="Georgia,serif" font-size="38" font-weight="700">National Liberal–Constitutional Union</text>
  <text x="800" y="108" text-anchor="middle" fill="#a8bac9" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.7">A NEGOTIATED GOVERNING UNION · 1980s–1990s</text>

  <path d="M210 365 H1390" stroke="#668199" stroke-width="4"/>
  <path d="M405 365 C520 365 520 365 610 365" stroke="#668199" stroke-width="4"/>
  <path d="M990 365 C1080 365 1080 365 1195 365" stroke="#668199" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="340" height="372" rx="20" fill="#26354d" stroke="#7b91b1" stroke-width="2"/>
    <rect x="430" y="140" width="340" height="410" rx="20" fill="#244056" stroke="#66a5cc" stroke-width="2"/>
    <rect x="790" y="140" width="340" height="410" rx="20" fill="#40373b" stroke="#a58a75" stroke-width="2"/>
    <rect x="1150" y="178" width="380" height="372" rx="20" fill="#183f59" stroke="#5db8e3" stroke-width="2"/>
  </g>

  <g font-family="Arial,sans-serif">
    <text x="100" y="220" fill="#b7c8e0" font-size="17" font-weight="700">MARKET-RADICAL WING</text>
    <text x="100" y="258" fill="#fff" font-family="Georgia,serif" font-size="28">Sir Julian Rooke</text>
    <text x="100" y="298" fill="#d4dce7" font-size="18">Faster reownership</text><text x="100" y="326" fill="#d4dce7" font-size="18">Freer finance</text><text x="100" y="354" fill="#d4dce7" font-size="18">Narrow strategic schedule</text><text x="100" y="382" fill="#d4dce7" font-size="18">Atlantic commerce</text>
    <line x1="100" y1="419" x2="380" y2="419" stroke="#71849b"/>
    <text x="100" y="455" fill="#9fb0c2" font-size="16">“Complete the transition.”</text>

    <text x="460" y="183" fill="#91d0ed" font-size="17" font-weight="700">STEWARDSHIP CENTER</text>
    <text x="460" y="221" fill="#fff" font-family="Georgia,serif" font-size="28">David Ashcombe</text>
    <text x="460" y="261" fill="#d8e6ee" font-size="18">Private operation</text><text x="460" y="289" fill="#d8e6ee" font-size="18">Protected capacity</text><text x="460" y="317" fill="#d8e6ee" font-size="18">Bounded opening</text><text x="460" y="345" fill="#d8e6ee" font-size="18">Responsible Independence</text>
    <line x1="460" y1="382" x2="740" y2="382" stroke="#5f8dab"/>
    <text x="460" y="418" fill="#afc7d5" font-size="16">“Know what cannot be lost.”</text>

    <text x="820" y="183" fill="#d5b998" font-size="17" font-weight="700">CROWN &amp; COMMONWEALTH</text>
    <text x="820" y="221" fill="#fff" font-family="Georgia,serif" font-size="28">Matthew Halden</text>
    <text x="820" y="261" fill="#e1d8d2" font-size="18">Routes and reserves</text><text x="820" y="289" fill="#e1d8d2" font-size="18">Strategic ownership</text><text x="820" y="317" fill="#e1d8d2" font-size="18">Commonwealth reciprocity</text><text x="820" y="345" fill="#e1d8d2" font-size="18">No hidden dependence</text>
    <line x1="820" y1="382" x2="1100" y2="382" stroke="#8e796a"/>
    <text x="820" y="418" fill="#c8b9af" font-size="16">“Cooperation requires an exit.”</text>

    <text x="1180" y="220" fill="#8ad3f3" font-size="17" font-weight="700">DEVELOPMENT RIGHT</text>
    <text x="1180" y="258" fill="#fff" font-family="Georgia,serif" font-size="28">Edward Mallory</text>
    <text x="1180" y="298" fill="#d5e9f2" font-size="18">Long-horizon construction</text><text x="1180" y="326" fill="#d5e9f2" font-size="18">Heavy lift and settlement</text><text x="1180" y="354" fill="#d5e9f2" font-size="18">Sovereign planetary routes</text><text x="1180" y="382" fill="#d5e9f2" font-size="18">Mixed enterprise</text>
    <line x1="1180" y1="419" x2="1500" y2="419" stroke="#4e98ba"/>
    <text x="1180" y="455" fill="#acd0df" font-size="16">“Use the capacity preserved.”</text>
  </g>

  <g transform="translate(150 602)">
    <rect width="1300" height="94" rx="18" fill="#101d2a" stroke="#344d61"/>
    <text x="650" y="31" text-anchor="middle" fill="#9fb3c4" font-family="Arial,sans-serif" font-size="16" letter-spacing="1.2">SHARED NLCU GROUND</text>
    <text x="650" y="65" text-anchor="middle" fill="#f1f5f8" font-family="Georgia,serif" font-size="23">Crown-in-Parliament · Commonwealth association · mixed enterprise · strategic capacity</text>
  </g>
</svg>
