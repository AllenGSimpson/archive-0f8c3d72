<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prinzensprache design</title><desc id="desc">A functional core surrounded by explicit production interfaces and a path from private work to a logistics proof.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081520"/><stop offset="1" stop-color="#1c3040"/></linearGradient><style>.title{font:700 44px Georgia,serif;fill:#f5f2e9}.sub{font:17px Arial,sans-serif;fill:#b6c8d2;letter-spacing:2px}.core{fill:#21465c;stroke:#80c3df;stroke-width:4}.sat{fill:#122733;stroke:#758e9b;stroke-width:3}.head{font:700 24px Arial,sans-serif;fill:#fff}.copy{font:18px Arial,sans-serif;fill:#cfdae0}.date{font:700 17px Arial,sans-serif;fill:#dfba70}.line{stroke:#7baec3;stroke-width:4}.foot{font:18px Arial,sans-serif;fill:#d4c9a6}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="65" text-anchor="middle" class="title">PRINZENSPRACHE</text><text x="800" y="102" text-anchor="middle" class="sub">FUNCTIONAL-FIRST CORE · PRODUCTION-SYSTEM CONTACT</text>
  <g transform="translate(590 270)"><rect width="420" height="260" rx="36" class="core"/><text x="210" y="70" text-anchor="middle" class="head">TYPED FUNCTIONAL CORE</text><text x="210" y="115" text-anchor="middle" class="copy">Immutable by default</text><text x="210" y="150" text-anchor="middle" class="copy">Composition and testability</text><text x="210" y="185" text-anchor="middle" class="copy">Planform environment</text><text x="210" y="225" text-anchor="middle" class="date">FELIX HITLER · c. 2000–04</text></g>
  <path d="M590 335L430 235M1010 335L1170 235M590 465L430 565M1010 465L1170 565M800 530V675" class="line" fill="none"/>
  <g transform="translate(80 145)"><rect width="350" height="180" rx="22" class="sat"/><text x="175" y="55" text-anchor="middle" class="head">EXPLICIT EFFECTS</text><text x="175" y="100" text-anchor="middle" class="copy">Mutation · exceptions</text><text x="175" y="135" text-anchor="middle" class="copy">System calls</text></g>
  <g transform="translate(1170 145)"><rect width="350" height="180" rx="22" class="sat"/><text x="175" y="55" text-anchor="middle" class="head">COMPATIBILITY</text><text x="175" y="100" text-anchor="middle" class="copy">Foreign libraries</text><text x="175" y="135" text-anchor="middle" class="copy">Existing production code</text></g>
  <g transform="translate(80 565)"><rect width="350" height="180" rx="22" class="sat"/><text x="175" y="55" text-anchor="middle" class="head">ENGINEERING SAFETY</text><text x="175" y="100" text-anchor="middle" class="copy">Dimensional units</text><text x="175" y="135" text-anchor="middle" class="copy">Visible state changes</text></g>
  <g transform="translate(1170 565)"><rect width="350" height="180" rx="22" class="sat"/><text x="175" y="55" text-anchor="middle" class="head">INTERACTIVE WORK</text><text x="175" y="100" text-anchor="middle" class="copy">Exploratory development</text><text x="175" y="135" text-anchor="middle" class="copy">Strict deployment</text></g>
  <g transform="translate(560 675)"><rect width="480" height="125" rx="22" fill="#30281d" stroke="#d7b66f" stroke-width="3"/><text x="240" y="45" text-anchor="middle" class="head">LATER PROOF</text><text x="240" y="80" text-anchor="middle" class="copy">Raumhafen or Mars-logistics system</text><text x="240" y="108" text-anchor="middle" class="date">EXACT PROJECT OPEN</text></g>
  <text x="800" y="855" text-anchor="middle" class="foot">Final public name remains open: Folgewerk · Funktionsplan · Formwerk · or another choice</text>
</svg>
