<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Edward James Mallory and the British planetary settlement, 1988–2000</title>
  <desc id="desc">A timeline showing the Ashcombe inheritance, Mallory's Development Right, the Greenwich Compact, the 1996 election, and the 1998 British Mars landing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1724"/>
      <stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <linearGradient id="nlcu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#358cc8"/>
      <stop offset="1" stop-color="#6fc0e6"/>
    </linearGradient>
    <linearGradient id="labour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a53b4d"/>
      <stop offset="1" stop-color="#d96a76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="30" fill="url(#bg)"/>
  <path d="M0 545 C320 465 560 620 885 535 C1130 471 1340 497 1600 420 L1600 720 L0 720 Z" fill="#0a111b" opacity=".62"/>

  <text x="80" y="78" fill="#f4f7fb" font-family="Georgia, serif" font-size="38" font-weight="700">Edward James Mallory and the planetary settlement</text>
  <text x="80" y="116" fill="#a9bbcb" font-family="Arial, sans-serif" font-size="20" letter-spacing="1.5">FROM RESTORED CAPACITY TO BIPARTISAN CONSTRUCTION · 1988–2000</text>

  <line x1="122" y1="342" x2="1478" y2="342" stroke="#7890a5" stroke-width="4"/>
  <line x1="122" y1="342" x2="670" y2="342" stroke="url(#nlcu)" stroke-width="9"/>
  <line x1="670" y1="342" x2="1010" y2="342" stroke="url(#labour)" stroke-width="9"/>
  <line x1="1010" y1="342" x2="1478" y2="342" stroke="url(#nlcu)" stroke-width="9"/>

  <g filter="url(#shadow)">
    <rect x="72" y="175" width="286" height="118" rx="16" fill="#183a55" stroke="#4b9dd0"/>
    <text x="96" y="211" fill="#8dcff0" font-family="Arial, sans-serif" font-size="17" font-weight="700">1988–1992</text>
    <text x="96" y="242" fill="#fff" font-family="Georgia, serif" font-size="25">Ashcombe inheritance</text>
    <text x="96" y="271" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">Capacity, reserves, Commonwealth machinery</text>

    <rect x="373" y="393" width="272" height="132" rx="16" fill="#183a55" stroke="#4b9dd0"/>
    <text x="397" y="429" fill="#8dcff0" font-family="Arial, sans-serif" font-size="17" font-weight="700">EARLY 1990s</text>
    <text x="397" y="460" fill="#fff" font-family="Georgia, serif" font-size="25">Development Right</text>
    <text x="397" y="488" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">Preserved capability must be exercised</text>
    <text x="397" y="510" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">through long-horizon national projects</text>

    <rect x="657" y="160" width="342" height="146" rx="16" fill="#3d2633" stroke="#b85c6c"/>
    <text x="681" y="196" fill="#ee9eaa" font-family="Arial, sans-serif" font-size="17" font-weight="700">1993–1994</text>
    <text x="681" y="227" fill="#fff" font-family="Georgia, serif" font-size="25">Greenwich Compact</text>
    <text x="681" y="256" fill="#d8cad0" font-family="Arial, sans-serif" font-size="16">Calder + Mallory: Moon, Mars, training,</text>
    <text x="681" y="279" fill="#d8cad0" font-family="Arial, sans-serif" font-size="16">stable funding, distributed procurement</text>

    <rect x="1028" y="393" width="250" height="132" rx="16" fill="#183a55" stroke="#4b9dd0"/>
    <text x="1052" y="429" fill="#8dcff0" font-family="Arial, sans-serif" font-size="17" font-weight="700">1996</text>
    <text x="1052" y="460" fill="#fff" font-family="Georgia, serif" font-size="25">Mallory government</text>
    <text x="1052" y="488" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">Programme retained;</text>
    <text x="1052" y="510" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">construction accelerated</text>

    <rect x="1294" y="175" width="234" height="118" rx="16" fill="#183a55" stroke="#4b9dd0"/>
    <text x="1318" y="211" fill="#8dcff0" font-family="Arial, sans-serif" font-size="17" font-weight="700">1998</text>
    <text x="1318" y="242" fill="#fff" font-family="Georgia, serif" font-size="25">Mars landing</text>
    <text x="1318" y="271" fill="#c6d3de" font-family="Arial, sans-serif" font-size="16">Shared Commonwealth achievement</text>
  </g>

  <g fill="#eef6fc" stroke="#0c1724" stroke-width="5">
    <circle cx="122" cy="342" r="12"/>
    <circle cx="510" cy="342" r="12"/>
    <circle cx="828" cy="342" r="15" fill="#f0d2d7"/>
    <circle cx="1153" cy="342" r="15" fill="#d5f1ff"/>
    <circle cx="1410" cy="342" r="15" fill="#d5f1ff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#a9bbcb" text-anchor="middle">
    <text x="122" y="374">1988</text>
    <text x="510" y="374">c. 1992</text>
    <text x="828" y="374">1993/94</text>
    <text x="1153" y="374">1996</text>
    <text x="1410" y="374">1998</text>
  </g>

  <g transform="translate(80 596)">
    <rect width="1440" height="66" rx="14" fill="#101c2a" stroke="#30495f"/>
    <circle cx="30" cy="33" r="8" fill="#d46070"/>
    <text x="50" y="39" fill="#f2f5f8" font-family="Arial, sans-serif" font-size="18">Calder provisions retained</text>
    <circle cx="314" cy="33" r="8" fill="#5db4df"/>
    <text x="334" y="39" fill="#f2f5f8" font-family="Arial, sans-serif" font-size="18">Mallory expansion implemented</text>
    <path d="M650 33 H715" stroke="#8198aa" stroke-width="3"/>
    <text x="738" y="39" fill="#f2f5f8" font-family="Arial, sans-serif" font-size="18">Result: independent launch, permanent lunar occupation, planetary infrastructure</text>
  </g>
</svg>
