<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">American independent manufacturers and post-crash marques</title>
<desc id="desc">Nash, Hudson, Studebaker and Packard remain separate. Kaiser and Willys combine. The named post-crash allocations place Mercury with Nash, Pontiac with Hudson, American Ford with Studebaker, Lincoln–Continental with Packard and Plymouth with Kaiser–Willys. International Harvester receives much of Ford's truck business; Ford-Werke is separately German-owned.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d2a"/><stop offset="1" stop-color="#26334c"/></linearGradient>
<style>.h{font:700 29px system-ui,sans-serif;fill:#f5f0e4}.t{font:700 21px system-ui,sans-serif;fill:#f5f0e4}.s{font:500 16px system-ui,sans-serif;fill:#c7d7e5}.v{font:700 18px system-ui,sans-serif;fill:#e4c36d}.box{stroke:#9ab2c9;stroke-width:1.5}</style></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/>
<text x="600" y="52" text-anchor="middle" class="h">American independent motor industry</text>
<text x="600" y="85" text-anchor="middle" class="s">Separate manufacturers and the marques acquired after the 1990 crash</text>
<g transform="translate(35 130)"><rect width="210" height="225" rx="16" fill="#254d5c" class="box"/><text x="105" y="36" text-anchor="middle" class="t">Nash–Kelvinator</text><text x="105" y="76" text-anchor="middle" class="s">Compacts and touring</text><text x="105" y="103" text-anchor="middle" class="s">Appliances</text><path d="M25 133h160" stroke="#668b9c"/><text x="105" y="170" text-anchor="middle" class="s">Acquired marque</text><text x="105" y="201" text-anchor="middle" class="v">Mercury</text></g>
<g transform="translate(265 130)"><rect width="210" height="225" rx="16" fill="#365064" class="box"/><text x="105" y="36" text-anchor="middle" class="t">Hudson</text><text x="105" y="76" text-anchor="middle" class="s">Passenger cars</text><text x="105" y="103" text-anchor="middle" class="s">Performance</text><path d="M25 133h160" stroke="#668b9c"/><text x="105" y="170" text-anchor="middle" class="s">Acquired marque</text><text x="105" y="201" text-anchor="middle" class="v">Pontiac</text></g>
<g transform="translate(495 130)"><rect width="210" height="225" rx="16" fill="#494a63" class="box"/><text x="105" y="36" text-anchor="middle" class="t">Studebaker</text><text x="105" y="76" text-anchor="middle" class="s">Passenger cars</text><text x="105" y="103" text-anchor="middle" class="s">Trucks and engineering</text><path d="M25 133h160" stroke="#668b9c"/><text x="105" y="170" text-anchor="middle" class="s">Acquired marque</text><text x="105" y="201" text-anchor="middle" class="v">American Ford</text></g>
<g transform="translate(725 130)"><rect width="210" height="225" rx="16" fill="#5b4662" class="box"/><text x="105" y="36" text-anchor="middle" class="t">Packard</text><text x="105" y="76" text-anchor="middle" class="s">Prestige automobiles</text><text x="105" y="103" text-anchor="middle" class="s">Engines and engineering</text><path d="M25 133h160" stroke="#668b9c"/><text x="105" y="170" text-anchor="middle" class="s">Acquired marque</text><text x="105" y="201" text-anchor="middle" class="v">Lincoln–Continental</text></g>
<g transform="translate(955 130)"><rect width="210" height="225" rx="16" fill="#425841" class="box"/><text x="105" y="36" text-anchor="middle" class="t">Kaiser–Willys</text><text x="105" y="76" text-anchor="middle" class="s">Utility vehicles</text><text x="105" y="103" text-anchor="middle" class="s">Jeep and light trucks</text><path d="M25 133h160" stroke="#668b9c"/><text x="105" y="170" text-anchor="middle" class="s">Acquired marque</text><text x="105" y="201" text-anchor="middle" class="v">Plymouth</text></g>
<g transform="translate(35 390)"><rect width="555" height="105" rx="16" fill="#263b48" class="box"/><text x="25" y="37" class="t">International Harvester</text><text x="25" y="73" class="s">Acquired much of Ford's truck and commercial business</text></g>
<g transform="translate(610 390)"><rect width="555" height="105" rx="16" fill="#343e4f" class="box"/><text x="25" y="37" class="t">Ford-Werke</text><text x="25" y="73" class="s">Separate German ownership; German and US Ford names coexist</text></g>
<rect x="35" y="530" width="1130" height="110" rx="16" fill="#101923" stroke="#668b9c"/>
<text x="60" y="565" class="s">General Motors retained Chevrolet, Buick, Oldsmobile and Cadillac.</text>
<text x="60" y="594" class="s">Chrysler retained Chrysler, Dodge, DeSoto and Imperial.</text>
<text x="60" y="623" class="s">The allocation records ownership outcomes. Individual legal closing dates remain unspecified.</text>
</svg>
