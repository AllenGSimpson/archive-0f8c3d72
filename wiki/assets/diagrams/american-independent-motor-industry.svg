<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">American independent motor-industry consolidation</title>
  <desc id="desc">A schematic showing the 1950 independent automobile field consolidating into American Motors, Studebaker-Packard, and Kaiser-Willys by 1970 and 1985.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d2a"/><stop offset="1" stop-color="#26334c"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e4c36d"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#f5f0e4}.t{font:700 20px system-ui,sans-serif;fill:#f5f0e4}.s{font:500 15px system-ui,sans-serif;fill:#c7d7e5}.box{stroke:#e4c36d;stroke-width:3}.line{stroke:#e4c36d;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" class="h">American independent motor industry · consolidation without extinction</text>
  <text x="600" y="80" text-anchor="middle" class="s">Big Three dominance coexists with three durable specialist paths</text>
  <g transform="translate(45 125)"><rect width="300" height="160" rx="18" fill="#37576c" class="box"/><text x="150" y="34" text-anchor="middle" class="t">Nash-Kelvinator + Hudson</text><text x="150" y="68" text-anchor="middle" class="s">appliances · refrigeration</text><text x="150" y="94" text-anchor="middle" class="s">engineering · performance</text><text x="150" y="124" text-anchor="middle" class="s">merge around 1954</text></g>
  <g transform="translate(450 125)"><rect width="300" height="160" rx="18" fill="#5b4b67" class="box"/><text x="150" y="34" text-anchor="middle" class="t">Studebaker + Packard</text><text x="150" y="68" text-anchor="middle" class="s">volume · trucks · exports</text><text x="150" y="94" text-anchor="middle" class="s">prestige · engines · government</text><text x="150" y="124" text-anchor="middle" class="s">difficult integration</text></g>
  <g transform="translate(855 125)"><rect width="300" height="160" rx="18" fill="#526044" class="box"/><text x="150" y="34" text-anchor="middle" class="t">Kaiser-Frazer + Willys</text><text x="150" y="68" text-anchor="middle" class="s">weaker passenger ambition</text><text x="150" y="94" text-anchor="middle" class="s">Jeep · wagon · truck · 4×4</text><text x="150" y="124" text-anchor="middle" class="s">utility pivot</text></g>
  <path d="M195 285v95M600 285v95M1005 285v95" class="line"/>
  <g transform="translate(45 380)"><rect width="300" height="165" rx="18" fill="#2b6571" class="box"/><text x="150" y="38" text-anchor="middle" class="t">American Motors</text><text x="150" y="73" text-anchor="middle" class="s">fourth full-line producer</text><text x="150" y="103" text-anchor="middle" class="s">compacts · packaging</text><text x="150" y="133" text-anchor="middle" class="s">practical family cars</text></g>
  <g transform="translate(450 380)"><rect width="300" height="165" rx="18" fill="#694e6d" class="box"/><text x="150" y="38" text-anchor="middle" class="t">Studebaker–Packard</text><text x="150" y="73" text-anchor="middle" class="s">prestige and specialist holding</text><text x="150" y="103" text-anchor="middle" class="s">engines · defense · trucks</text><text x="150" y="133" text-anchor="middle" class="s">limited road range</text></g>
  <g transform="translate(855 380)"><rect width="300" height="165" rx="18" fill="#596d45" class="box"/><text x="150" y="38" text-anchor="middle" class="t">Kaiser–Willys</text><text x="150" y="73" text-anchor="middle" class="s">utility and 4×4 specialist</text><text x="150" y="103" text-anchor="middle" class="s">military · export · government</text><text x="150" y="133" text-anchor="middle" class="s">America's Land-Rover counterpart</text></g>
  <g transform="translate(105 590)"><rect width="990" height="52" rx="14" fill="#101923" stroke="#8fb5c7"/><text x="495" y="22" text-anchor="middle" class="s">1970–1985 market: Big Three mass giants · AMC fourth producer · Studebaker–Packard prestige specialist</text><text x="495" y="42" text-anchor="middle" class="s">Kaiser–Willys utility specialist · consolidation without wholesale foreign ownership</text></g>
</svg>
