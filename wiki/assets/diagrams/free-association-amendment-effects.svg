<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Free Association Amendment effects</title><desc id="desc">A diagram showing the political coalition, constitutional rule, public exceptions, protected private sphere, and later corporate consequences of the Free Association Amendment.</desc><defs><style>.bg{fill:#111714}.panel{fill:#1b231e;stroke:#6e7d70;stroke-width:2}.gold{fill:#d4b875}.cyan{fill:#45c7d6}.cream{fill:#eee7d8}.muted{fill:#aeb8ad}.red{fill:#c56e70}.line{stroke:#8f9b90;stroke-width:3;fill:none}.head{font:700 28px Georgia,serif}.copy{font:20px Arial,sans-serif}.small{font:16px Arial,sans-serif;letter-spacing:1px}</style></defs><rect class="bg" width="1400" height="760"/><text x="70" y="64" class="head gold">THE FREE ASSOCIATION SETTLEMENT · 1972–73</text><text x="70" y="96" class="small muted">A LIBERTY FORMULA WITH UNEQUAL PRIVATE CONSEQUENCES</text><rect x="60" y="145" width="330" height="210" rx="18" class="panel"/><text x="90" y="188" class="head cream">Ratifying coalition</text><text x="90" y="230" class="copy cyan">National Renewal</text><text x="90" y="263" class="copy cream">Former Republicans</text><text x="90" y="296" class="copy cream">Southern &amp; border members</text><text x="90" y="329" class="copy cream">Business, religious &amp; moderate votes</text><path d="M390 250H500" class="line"/><polygon points="500,250 480,238 480,262" fill="#8f9b90"/><rect x="500" y="145" width="400" height="210" rx="18" class="panel"/><text x="530" y="188" class="head gold">Constitutional rule</text><text x="530" y="232" class="copy cream">Private persons and institutions</text><text x="530" y="265" class="copy cream">may choose or refuse association.</text><text x="530" y="310" class="small red">EXACT TEXT &amp; AMENDMENT NUMBER OPEN</text><path d="M900 250H1010" class="line"/><polygon points="1010,250 990,238 990,262" fill="#8f9b90"/><rect x="1010" y="145" width="330" height="210" rx="18" class="panel"/><text x="1040" y="188" class="head cream">Public exceptions</text><text x="1040" y="230" class="copy cyan">Public office</text><text x="1040" y="263" class="copy cyan">Military command</text><text x="1040" y="296" class="copy cyan">Penal custody</text><text x="1040" y="329" class="copy cyan">Other sovereign functions</text><path d="M700 355V430" class="line"/><polygon points="700,430 688,410 712,410" fill="#8f9b90"/><rect x="120" y="430" width="510" height="240" rx="18" class="panel"/><text x="150" y="477" class="head cream">Protected private sphere</text><text x="150" y="522" class="copy red">Employment · housing · schools</text><text x="150" y="558" class="copy red">Clubs · commerce · insurance</text><text x="150" y="594" class="copy red">Religious &amp; political membership</text><text x="150" y="638" class="small muted">BROAD FEDERAL CIVIL-RIGHTS LAW BLOCKED</text><path d="M630 550H770" class="line"/><polygon points="770,550 750,538 750,562" fill="#8f9b90"/><rect x="770" y="430" width="510" height="240" rx="18" class="panel"/><text x="800" y="477" class="head cream">Later institutional order</text><text x="800" y="522" class="copy gold">Contractual communities</text><text x="800" y="558" class="copy gold">Employer-linked services &amp; benefits</text><text x="800" y="594" class="copy gold">Private arbitration &amp; security</text><text x="800" y="638" class="small muted">FREEDOM OF EXIT BECOMES THE CENTRAL DISPUTE</text></svg>
