<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reconstruction Truce support matrix</title><desc id="desc">Matrix showing five British party groups and the areas where each supported or contested the minority Reconstruction Ministry.</desc>
  <rect width="1600" height="900" fill="#111a22"/><text x="90" y="88" fill="#f4ead8" font-family="Georgia,serif" font-size="52">Reconstruction Truce · shifting majorities</text><text x="92" y="134" fill="#a7bac5" font-family="Arial,sans-serif" font-size="24">No coalition: each measure assembled a different parliamentary majority</text>
  <g font-family="Arial,sans-serif"><g fill="#f4ead8" font-size="22" text-anchor="middle"><text x="635" y="210">Supply</text><text x="805" y="210">Demobilization</text><text x="975" y="210">Shipping</text><text x="1145" y="210">Arsenal</text><text x="1315" y="210">Health</text></g>
  <g fill="#fff" font-size="25"><text x="105" y="310">Labour</text><text x="105" y="410">Conservatives</text><text x="105" y="510">Union Commonwealth</text><text x="105" y="610">Common Wealth</text><text x="105" y="710">Liberals</text></g>
  <g stroke="#111a22" stroke-width="8"><g fill="#5fa876"><rect x="550" y="255" width="170" height="80"/><rect x="720" y="255" width="170" height="80"/><rect x="890" y="255" width="170" height="80"/><rect x="1060" y="255" width="170" height="80"/><rect x="1230" y="255" width="170" height="80"/></g><g fill="#5b9bd5"><rect x="550" y="355" width="170" height="80"/><rect x="720" y="355" width="170" height="80"/><rect x="890" y="355" width="170" height="80"/><rect x="1060" y="355" width="170" height="80"/></g><g fill="#5fc7d3"><rect x="550" y="455" width="170" height="80"/><rect x="720" y="455" width="170" height="80"/><rect x="890" y="455" width="170" height="80"/><rect x="1060" y="455" width="170" height="80"/></g><g fill="#7b9f63"><rect x="550" y="555" width="170" height="80"/><rect x="720" y="555" width="170" height="80"/><rect x="890" y="555" width="170" height="80"/><rect x="1230" y="555" width="170" height="80"/></g><g fill="#d6b548"><rect x="550" y="655" width="170" height="80"/><rect x="720" y="655" width="170" height="80"/><rect x="890" y="655" width="170" height="80"/><rect x="1230" y="655" width="170" height="80"/></g></g>
  <g fill="#394752" stroke="#111a22" stroke-width="8"><rect x="1230" y="355" width="170" height="80"/><rect x="1230" y="455" width="170" height="80"/><rect x="1060" y="555" width="170" height="80"/><rect x="1060" y="655" width="170" height="80"/></g></g>
  <text x="800" y="825" fill="#f4ead8" font-family="Georgia,serif" font-size="31" text-anchor="middle">Support meant permission to govern, not agreement on the new order.</text>
</svg>
