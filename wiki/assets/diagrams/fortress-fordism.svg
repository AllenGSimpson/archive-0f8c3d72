<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Fortress Fordism</title><desc id="d">Mass production, household consumption, strategic procurement, technical education, and hemispheric resources reinforce one another.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08161d"/><stop offset="1" stop-color="#21343a"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f0f5f4" font-family="Georgia,serif" font-size="31">Fortress Fordism</text><text x="60" y="105" fill="#a5b9bd" font-family="Arial,sans-serif" font-size="17">Private mass production inside a protected strategic continent</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="325" r="112" fill="#29444a" stroke="#7ca4ad" stroke-width="3"/><text x="600" y="312" fill="#f1f5f3" font-size="20" font-weight="700">MASS PRODUCTION</text><text x="600" y="344" fill="#c5d3d4" font-size="15">private firms / public capacity</text><g fill="#20343a" stroke-width="3"><circle cx="225" cy="205" r="92" stroke="#a4ad78"/><circle cx="975" cy="205" r="92" stroke="#b08b70"/><circle cx="225" cy="470" r="92" stroke="#879eac"/><circle cx="975" cy="470" r="92" stroke="#9785aa"/></g><g fill="#edf2ef" font-size="17" font-weight="700"><text x="225" y="200">HOUSEHOLDS</text><text x="225" y="224">wages / consumption</text><text x="975" y="200">PROCUREMENT</text><text x="975" y="224">defense / aerospace</text><text x="225" y="465">RESOURCES</text><text x="225" y="489">domestic / hemisphere</text><text x="975" y="465">SKILLS</text><text x="975" y="489">schools / research</text></g></g><g stroke="#617f87" stroke-width="3"><path d="M310 235l190 55"/><path d="M890 235l-190 55"/><path d="M310 440l190-70"/><path d="M890 440l-190-70"/></g></svg>
