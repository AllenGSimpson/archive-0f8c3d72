<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Japanese late-piston and first-jet aircraft generation, 1944–1952</title>
  <desc id="desc">A chronological diagram of nine Japanese combat aircraft across piston, rocket, and jet propulsion, including the three-stage Shinden family.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b23"/><stop offset="1" stop-color="#182b32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 38px Georgia,serif;fill:#f6f0df}.subtitle{font:18px Arial,sans-serif;fill:#b9c7c9}.year{font:700 19px Arial,sans-serif;fill:#e5c66a}.lane{font:700 17px Arial,sans-serif;fill:#d6e1df;letter-spacing:1px}.name{font:700 18px Arial,sans-serif;fill:#fff}.formal{font:14px Arial,sans-serif;fill:#dce5e4}.role{font:13px Arial,sans-serif;fill:#b8c9c7}.note{font:14px Arial,sans-serif;fill:#b9c7c9}.line{stroke:#718287;stroke-width:3}.family{stroke:#e5c66a;stroke-width:4;fill:none}.box{stroke:#b7c6c4;stroke-width:1.5;rx:10;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1200" height="960" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="58" fill="#bc2633" opacity=".9"/>
  <text x="70" y="75" class="title">Japanese Late-Piston and First-Jet Generation</text>
  <text x="70" y="108" class="subtitle">Nine registered combat aircraft · 1944–1952</text>
  <line x1="185" y1="170" x2="1090" y2="170" class="line"/>
  <g text-anchor="middle"><text x="230" y="154" class="year">1944</text><text x="430" y="154" class="year">1946</text><text x="650" y="154" class="year">1947</text><text x="850" y="154" class="year">1949</text><text x="1050" y="154" class="year">1952</text></g>
  <g fill="#718287"><circle cx="230" cy="170" r="6"/><circle cx="430" cy="170" r="6"/><circle cx="650" cy="170" r="6"/><circle cx="850" cy="170" r="6"/><circle cx="1050" cy="170" r="6"/></g>

  <text x="70" y="255" class="lane">FLEET AND LAND FIGHTERS</text>
  <rect class="box" x="160" y="280" width="270" height="108" fill="#315a67"/>
  <text x="180" y="314" class="name">N1K2-J Shiden Kai</text><text x="180" y="339" class="formal">Type 4 N1K2-J · 1944</text><text x="180" y="365" class="role">Land-based piston fighter</text>
  <rect class="box" x="455" y="280" width="270" height="108" fill="#315a67"/>
  <text x="475" y="314" class="name">A7M3 Reppū</text><text x="475" y="339" class="formal">Type 6 A7M3 · 1946</text><text x="475" y="365" class="role">Carrier piston fighter</text>

  <text x="70" y="464" class="lane">POINT DEFENSE AND SHINDEN FAMILY</text>
  <path d="M300 557 H1030" class="family"/><path d="M1020 547 L1035 557 L1020 567" class="family"/>
  <rect class="box" x="160" y="490" width="250" height="115" fill="#8a3b42"/>
  <text x="180" y="524" class="name">J7W1 Shinden</text><text x="180" y="549" class="formal">Type 6 J7W1 · 1946</text><text x="180" y="575" class="role">Piston point-defense</text>
  <rect class="box" x="475" y="490" width="250" height="115" fill="#8a3b42"/>
  <text x="495" y="524" class="name">J7W2 Shinden Kai</text><text x="495" y="549" class="formal">Type 9 J7W2 · 1949</text><text x="495" y="575" class="role">Jet point-defense</text>
  <rect class="box" x="790" y="490" width="250" height="115" fill="#8a3b42"/>
  <text x="810" y="524" class="name">J7W3 Shinden Kai Ni</text><text x="810" y="549" class="formal">Type 12 J7W3 · 1952</text><text x="810" y="575" class="role">Advanced canard interceptor</text>
  <rect class="box" x="160" y="625" width="250" height="100" fill="#77542f"/>
  <text x="180" y="658" class="name">J8M1 Shūsui</text><text x="180" y="683" class="formal">Type 6 J8M1 · 1946</text><text x="180" y="707" class="role">Rocket point-defense · 7 min</text>

  <text x="70" y="783" class="lane">FIRST OPERATIONAL JETS</text>
  <g>
    <rect class="box" x="330" y="800" width="250" height="78" fill="#28675e"/><text x="348" y="831" class="name">G9N1 Kikka Kai</text><text x="348" y="855" class="role">Strike / reconnaissance · 1946</text>
    <rect class="box" x="600" y="800" width="250" height="78" fill="#28675e"/><text x="618" y="831" class="name">J10N1 Karyū</text><text x="618" y="855" class="role">Heavy interceptor · 1947</text>
    <rect class="box" x="870" y="800" width="250" height="78" fill="#28675e"/><text x="888" y="831" class="name">J11T1 Kogarashi</text><text x="888" y="855" class="role">Light continental fighter · 1949</text>
  </g>
  <text x="70" y="930" class="note">Piston, rocket, and jet types overlap because range, basing, carrier use, and interception impose different requirements.</text>
</svg>
