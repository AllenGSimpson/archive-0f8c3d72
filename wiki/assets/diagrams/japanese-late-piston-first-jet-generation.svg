<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Japanese late-piston and first-jet aircraft generation, 1944–1949</title>
  <desc id="desc">Three overlapping Japanese aircraft lineages show the N1K2-J, A7M, and A8M fleet-fighter transition; the Army Ki-100 Shinden family; and the Kikka, R2Y1, and B8Y1 turbine and systems-aircraft bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b23"/><stop offset="1" stop-color="#182b32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.title{font:700 38px Georgia,serif;fill:#f6f0df}.subtitle{font:18px Arial,sans-serif;fill:#b9c7c9}.year{font:700 19px Arial,sans-serif;fill:#e5c66a}.lane{font:700 17px Arial,sans-serif;fill:#d6e1df;letter-spacing:1px}.name{font:700 18px Arial,sans-serif;fill:#fff}.formal{font:14px Arial,sans-serif;fill:#dce5e4}.role{font:13px Arial,sans-serif;fill:#b8c9c7}.note{font:14px Arial,sans-serif;fill:#b9c7c9}.line{stroke:#718287;stroke-width:3}.family{stroke:#e5c66a;stroke-width:4;fill:none}.box{stroke:#b7c6c4;stroke-width:1.5;rx:10;filter:url(#shadow)}</style>
  </defs>
  <rect width="1200" height="960" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="58" fill="#bc2633" opacity=".9"/>
  <text x="70" y="75" class="title">Japanese Late-Piston and First-Jet Generation</text>
  <text x="70" y="108" class="subtitle">Three overlapping development paths · 1944–1949</text>
  <line x1="185" y1="170" x2="1090" y2="170" class="line"/>
  <g text-anchor="middle"><text x="230" y="154" class="year">1944</text><text x="430" y="154" class="year">1945</text><text x="650" y="154" class="year">1946</text><text x="850" y="154" class="year">1947</text><text x="1050" y="154" class="year">1949</text></g>
  <g fill="#718287"><circle cx="230" cy="170" r="6"/><circle cx="430" cy="170" r="6"/><circle cx="650" cy="170" r="6"/><circle cx="850" cy="170" r="6"/><circle cx="1050" cy="170" r="6"/></g>

  <text x="70" y="242" class="lane">NAVY FLEET-FIGHTER TRANSITION</text>
  <path d="M240 385 H1020" class="family"/><path d="M1010 375 L1025 385 L1010 395" class="family"/>
  <rect class="box" x="110" y="275" width="280" height="130" fill="#315a67"/>
  <text x="132" y="311" class="name">N1K2-J Shiden Kai</text>
  <text x="132" y="339" class="formal">Type 4 · 1944</text>
  <text x="132" y="367" class="role">Mature land-based piston fighter</text>
  <rect class="box" x="460" y="275" width="280" height="130" fill="#315a67"/>
  <text x="482" y="311" class="name">A7M Reppū family</text>
  <text x="482" y="339" class="formal">1945–47</text>
  <text x="482" y="367" class="role">Last principal piston carrier fighter</text>
  <rect class="box" x="810" y="275" width="280" height="130" fill="#315a67"/>
  <text x="832" y="311" class="name">A8M Senpū</text>
  <text x="832" y="339" class="formal">first flight 1947 · service c. 1948–49</text>
  <text x="832" y="367" class="role">Very light Mitsubishi carrier jet</text>

  <text x="70" y="485" class="lane">ARMY KI-100 SHINDEN CANARD FAMILY</text>
  <path d="M240 628 H1020" class="family"/><path d="M1010 618 L1025 628 L1010 638" class="family"/>
  <rect class="box" x="110" y="518" width="280" height="130" fill="#8a3b42"/>
  <text x="132" y="554" class="name">Ki-100-I Shinden</text>
  <text x="132" y="582" class="formal">first flight 1 February 1945</text>
  <text x="132" y="610" class="role">Piston canard proof and development</text>
  <rect class="box" x="460" y="518" width="280" height="130" fill="#8a3b42"/>
  <text x="482" y="554" class="name">Ki-100-II Shinden Kai</text>
  <text x="482" y="582" class="formal">1946–47</text>
  <text x="482" y="610" class="role">First turbojet form · limited service</text>
  <rect class="box" x="810" y="518" width="280" height="130" fill="#8a3b42"/>
  <text x="832" y="554" class="name">Ki-100-III Shinden Kai Ni</text>
  <text x="832" y="582" class="formal">immediate postwar</text>
  <text x="832" y="610" class="role">Stretched turbine-designed fighter</text>

  <text x="70" y="728" class="lane">TURBINE AND SYSTEMS-AIRCRAFT BRIDGE</text>
  <path d="M240 871 H1020" class="family"/><path d="M1010 861 L1025 871 L1010 881" class="family"/>
  <rect class="box" x="110" y="761" width="280" height="130" fill="#28675e"/>
  <text x="132" y="797" class="name">Nakajima Kikka</text>
  <text x="132" y="825" class="formal">first Japanese jet · 1945</text>
  <text x="132" y="853" class="role">Production and conversion school</text>
  <rect class="box" x="460" y="761" width="280" height="130" fill="#28675e"/>
  <text x="482" y="797" class="name">R2Y1 Keiun</text>
  <text x="482" y="825" class="formal">development bridge · 1945</text>
  <text x="482" y="853" class="role">Piston reconnaissance and aerodynamics</text>
  <rect class="box" x="810" y="761" width="280" height="130" fill="#28675e"/>
  <text x="832" y="797" class="name">B8Y1 Keiun Kai</text>
  <text x="832" y="825" class="formal">development c. 1947 · service c. 1949</text>
  <text x="832" y="853" class="role">Twin-engine carrier attack / systems aircraft</text>

  <text x="70" y="930" class="note">J7W remains pre-transfer design context; operational J7W, J10N1, and J11T1 service families are withdrawn.</text>
</svg>
