<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">United States Aerospace Force atmospheric fleet, 1958–1970</title>
  <desc id="desc">A timeline showing the Starfighter, Rapier, Blackbird, Hustler, and Valkyrie interception, training, reconnaissance, and strategic-bombing branches.</desc>
  <rect width="1200" height="980" fill="#111d2d"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="64" y="70" fill="#f5f0e7" font-family="Georgia, serif" font-size="38" font-weight="700">Aerospace Force Atmospheric Fleet</text>
    <text x="66" y="108" fill="#bdcde0" font-size="18">Point defense, strategic reach, and the road to orbit · 1958–1970</text>

    <line x1="150" y1="170" x2="1080" y2="170" stroke="#6f8299" stroke-width="3"/>
    <g fill="#f0d273" font-size="15" font-weight="700" text-anchor="middle">
      <text x="175" y="145">1958</text><text x="305" y="145">1959</text><text x="500" y="145">1963</text><text x="680" y="145">1966</text><text x="790" y="145">1967</text><text x="915" y="145">1969</text><text x="1040" y="145">1970</text>
    </g>
    <g fill="#6f8299"><circle cx="175" cy="170" r="6"/><circle cx="305" cy="170" r="6"/><circle cx="500" cy="170" r="6"/><circle cx="680" cy="170" r="6"/><circle cx="790" cy="170" r="6"/><circle cx="915" cy="170" r="6"/><circle cx="1040" cy="170" r="6"/></g>

    <g fill="#e3ebf5" font-size="14" font-weight="700" letter-spacing="1.3">
      <text x="62" y="255">INTERCEPTION</text>
      <text x="62" y="470">EDGE-OF-SPACE TRAINING</text>
      <text x="62" y="645">RECONNAISSANCE</text>
      <text x="62" y="785">STRATEGIC BOMBING</text>
    </g>

    <line x1="680" y1="205" x2="680" y2="938" stroke="#d06d64" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="592" y="204" width="176" height="38" rx="5" fill="#6b2f35"/>
    <text x="680" y="229" fill="#ffeceb" font-size="14" font-weight="700" text-anchor="middle">MARACAIBO SHOCK · 1966</text>

    <g stroke="#d2b85f" stroke-width="4" fill="none">
      <path d="M350 310 H550"/><path d="M790 310 H875"/>
    </g>
    <g fill="#d2b85f"><path d="M550 310 l-14 -9 v18 z"/><path d="M875 310 l-14 -9 v18 z"/></g>

    <g>
      <rect x="120" y="270" width="230" height="116" rx="11" fill="#2b5c79" stroke="#a9cada" stroke-width="2"/>
      <text x="144" y="304" fill="#fff" font-size="21" font-weight="700">F-104A Starfighter</text>
      <text x="144" y="335" fill="#eff8fc" font-size="14">Point interceptor · 1958</text>
      <text x="144" y="363" fill="#cce7f3" font-size="14">Mach 2 · four missiles</text>
    </g>
    <g>
      <rect x="550" y="250" width="240" height="136" rx="11" fill="#2b5c79" stroke="#a9cada" stroke-width="2"/>
      <text x="574" y="284" fill="#fff" font-size="21" font-weight="700">F-108A Rapier</text>
      <text x="574" y="315" fill="#eff8fc" font-size="14">Strategic interceptor · 1966</text>
      <text x="574" y="343" fill="#cce7f3" font-size="14">1,850 km combat radius</text>
      <text x="574" y="370" fill="#cce7f3" font-size="14">Six long-range missiles</text>
    </g>
    <g>
      <rect x="875" y="250" width="250" height="136" rx="11" fill="#2b5c79" stroke="#a9cada" stroke-width="2"/>
      <text x="899" y="284" fill="#fff" font-size="21" font-weight="700">F-12A Blackbird</text>
      <text x="899" y="315" fill="#eff8fc" font-size="14">Mach 3 interceptor · 1970</text>
      <text x="899" y="343" fill="#cce7f3" font-size="14">24,800 m ceiling</text>
      <text x="899" y="370" fill="#cce7f3" font-size="14">Four long-range missiles</text>
    </g>

    <g>
      <rect x="390" y="455" width="330" height="125" rx="11" fill="#67527e" stroke="#d1c0df" stroke-width="2"/>
      <text x="416" y="490" fill="#fff" font-size="21" font-weight="700">NF-104A Starfighter</text>
      <text x="416" y="522" fill="#f6f1fa" font-size="14">Rocket-assisted aerospace trainer · 1963</text>
      <text x="416" y="551" fill="#e3d8ed" font-size="14">Reaction controls · 36,800 m zoom ceiling</text>
    </g>
    <path d="M720 518 C805 518 835 420 910 390" stroke="#a98bc1" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
    <path d="M910 390 l-18 1 10 15 z" fill="#a98bc1"/>
    <text x="797" y="489" fill="#d7c5e4" font-size="13">pilot-centered aerospace practice</text>

    <g>
      <rect x="665" y="625" width="340" height="126" rx="11" fill="#316c66" stroke="#add1cc" stroke-width="2"/>
      <text x="691" y="660" fill="#fff" font-size="21" font-weight="700">R-11A Blackbird</text>
      <text x="691" y="692" fill="#eef9f7" font-size="14">Mach 3 strategic reconnaissance · 1967</text>
      <text x="691" y="722" fill="#cfe9e5" font-size="14">Cameras · radar · signals sensors</text>
    </g>

    <g stroke="#d2b85f" stroke-width="4" fill="none"><path d="M470 855 H730"/></g>
    <path d="M730 855 l-14 -9 v18 z" fill="#d2b85f"/>
    <g>
      <rect x="170" y="795" width="300" height="126" rx="11" fill="#8b5e2a" stroke="#e5c995" stroke-width="2"/>
      <text x="196" y="830" fill="#fff" font-size="21" font-weight="700">B-58A Hustler</text>
      <text x="196" y="862" fill="#fff7e8" font-size="14">High-supersonic bomber · 1959</text>
      <text x="196" y="892" fill="#f1ddb3" font-size="14">8,000 kg conventional stores</text>
    </g>
    <g>
      <rect x="730" y="795" width="330" height="126" rx="11" fill="#8b5e2a" stroke="#e5c995" stroke-width="2"/>
      <text x="756" y="830" fill="#fff" font-size="21" font-weight="700">B-70A Valkyrie</text>
      <text x="756" y="862" fill="#fff7e8" font-size="14">Mach 3 strategic bomber · 1969</text>
      <text x="756" y="892" fill="#f1ddb3" font-size="14">14,500 kg conventional stores</text>
    </g>

    <g font-size="13">
      <rect x="66" y="945" width="17" height="17" rx="3" fill="#2b5c79"/><text x="94" y="959" fill="#d5e1ef">Interception</text>
      <rect x="200" y="945" width="17" height="17" rx="3" fill="#67527e"/><text x="228" y="959" fill="#d5e1ef">Aerospace training</text>
      <rect x="385" y="945" width="17" height="17" rx="3" fill="#316c66"/><text x="413" y="959" fill="#d5e1ef">Reconnaissance</text>
      <rect x="555" y="945" width="17" height="17" rx="3" fill="#8b5e2a"/><text x="583" y="959" fill="#d5e1ef">Conventional bombing</text>
      <text x="1134" y="959" fill="#bdcde0" text-anchor="end">Atmospheric culmination → orbital pivot</text>
    </g>
  </g>
</svg>
