<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">American mission carriers and self-propelled air defense</title><desc id="desc">The M5 command, mortar, missile, and medical carriers beside three generations of M4 Vulcan air-defense vehicles.</desc><rect width="1200" height="520" fill="#111a1d"/><text x="55" y="62" fill="#f3ead8" font-family="Georgia,serif" font-size="34">Tracked mission and air-defense families</text><text x="55" y="99" fill="#a8b7b3" font-family="Arial,sans-serif" font-size="18">Category names prevent overlapping numbers from becoming ambiguous</text><text x="55" y="162" fill="#f3ead8" font-family="Arial,sans-serif" font-size="20" font-weight="bold">M5-FAMILY MISSION CARRIERS</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#315e59"><rect x="85" y="195" width="225" height="92" rx="10"/><rect x="350" y="195" width="225" height="92" rx="10"/><rect x="615" y="195" width="225" height="92" rx="10"/><rect x="880" y="195" width="225" height="92" rx="10"/></g><g fill="#f3ead8" font-size="19" font-weight="bold"><text x="197" y="230">M6 · 1984</text><text x="462" y="230">M7 · 1984</text><text x="727" y="230">M8 · 1985</text><text x="992" y="230">M9 · 1985</text></g><g fill="#d7e0dc" font-size="15"><text x="197" y="260">command</text><text x="462" y="260">120 mm mortar</text><text x="727" y="260">heavy missile</text><text x="992" y="260">medical</text></g></g><text x="55" y="350" fill="#f3ead8" font-family="Arial,sans-serif" font-size="20" font-weight="bold">20 MM M61 VULCAN AIR DEFENSE</text><line x1="220" y1="414" x2="1025" y2="414" stroke="#7c877e" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#765d31"><circle cx="280" cy="414" r="48"/><circle cx="610" cy="414" r="48"/><circle cx="960" cy="414" r="52"/></g><g fill="#fff3d6" font-size="17" font-weight="bold"><text x="280" y="409">M4</text><text x="280" y="430">1968</text><text x="610" y="409">M4A1</text><text x="610" y="430">1976</text><text x="960" y="409">M4A2</text><text x="960" y="430">1982</text></g></g></svg>
