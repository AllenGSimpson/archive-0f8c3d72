<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Danubian armaments system</title><desc id="desc">German standards and scale feeding specialized Hungarian and Romanian military industries.</desc><rect width="1200" height="560" fill="#11191f"/><text x="55" y="62" fill="#f2e9d7" font-family="Georgia,serif" font-size="34">Danubian armaments system</text><text x="55" y="98" fill="#aab7bf" font-family="Arial,sans-serif" font-size="18">National factories beneath Einheitspakt scale, standards, and supply</text><rect x="400" y="145" width="400" height="105" rx="14" fill="#6a2c2c"/><text x="600" y="185" fill="#f7eadc" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">GERMAN INDUSTRIAL CENTER</text><text x="600" y="218" fill="#e2c9bd" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">designs · scale · standards · credit · market</text><path d="M500 250 L315 345" stroke="#88979f" stroke-width="5"/><path d="M700 250 L885 345" stroke="#88979f" stroke-width="5"/><rect x="95" y="345" width="430" height="140" rx="14" fill="#365c4a"/><rect x="675" y="345" width="430" height="140" rx="14" fill="#315675"/><g fill="#f2e9d7" font-family="Arial,sans-serif" text-anchor="middle"><text x="310" y="385" font-size="23" font-weight="bold">HUNGARY</text><text x="310" y="419" font-size="16">licensed Panzer components · artillery</text><text x="310" y="445" font-size="16">recovery vehicles · ammunition · modifications</text><text x="890" y="385" font-size="23" font-weight="bold">ROMANIA</text><text x="890" y="419" font-size="16">petroleum-service vehicles · mountain equipment</text><text x="890" y="445" font-size="16">ammunition · German-licensed systems</text></g><circle cx="180" cy="215" r="58" fill="#735e35"/><text x="180" y="207" fill="#fff1d2" font-family="Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle">44M TAS</text><text x="180" y="231" fill="#fff1d2" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">1947</text><path d="M235 230 L395 265" stroke="#735e35" stroke-width="4" stroke-dasharray="9 8"/><text x="55" y="530" fill="#7f909a" font-family="Arial,sans-serif" font-size="15">By 1956 the independent Hungarian main-tank line yields to specialization; national military production continues.</text></svg>
