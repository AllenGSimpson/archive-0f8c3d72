<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Founding Formula One industrial field</title>
  <desc id="desc">Comparison of the five manufacturers forming the industrial core of the 1952 Formula One World Championship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111920"/><stop offset="1" stop-color="#070b0e"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .box{fill:#18242c;stroke:#596d78;stroke-width:2;rx:14;filter:url(#shadow)}
      .german{stroke:#b7c4cc}.italian{stroke:#b94747}
      .name{font:700 26px Georgia,serif;fill:#f6f0e4;text-anchor:middle}
      .tag{font:700 15px system-ui,sans-serif;letter-spacing:1.4px;fill:#d4b361;text-anchor:middle}
      .body{font:17px system-ui,sans-serif;fill:#cbd3d7;text-anchor:middle}
      .head{font:700 35px Georgia,serif;fill:#f6f0e4;text-anchor:middle}
      .sub{font:18px system-ui,sans-serif;fill:#bbc7cd;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="600" y="58" class="head">The five founding works traditions</text>
  <text x="600" y="92" class="sub">One championship, five industrial identities, and two titles from the first season</text>

  <rect class="box german" x="75" y="160" width="310" height="185"/>
  <text x="230" y="198" class="tag">GERMAN WORKS AUTHORITY</text>
  <text x="230" y="244" class="name">Mercedes-Benz</text>
  <text x="230" y="282" class="body">Precision · integration · injection</text>
  <text x="230" y="314" class="body">Sustained high-speed reliability</text>

  <rect class="box german" x="445" y="160" width="310" height="185"/>
  <text x="600" y="198" class="tag">SAXON TECHNICAL RIVAL</text>
  <text x="600" y="244" class="name">Auto Union</text>
  <text x="600" y="282" class="body">Unusual layouts · experimentation</text>
  <text x="600" y="314" class="body">Multi-marque industrial laboratory</text>

  <rect class="box italian" x="815" y="160" width="310" height="185"/>
  <text x="970" y="198" class="tag">PUBLIC INDUSTRIAL TEAM</text>
  <text x="970" y="244" class="name">Alfa Corse</text>
  <text x="970" y="282" class="body">IRI backing · Alfetta continuity</text>
  <text x="970" y="314" class="body">Factory prestige and state industry</text>

  <rect class="box italian" x="260" y="405" width="310" height="185"/>
  <text x="415" y="443" class="tag">RACING-LED PRIVATE PRESTIGE</text>
  <text x="415" y="489" class="name">Scuderia Ferrari</text>
  <text x="415" y="527" class="body">Road cars finance competition</text>
  <text x="415" y="559" class="body">Competition makes the marque</text>

  <rect class="box italian" x="630" y="405" width="310" height="185"/>
  <text x="785" y="443" class="tag">SPECIALIST CONSTRUCTOR</text>
  <text x="785" y="489" class="name">Maserati</text>
  <text x="785" y="527" class="body">Customer cars · compact engineering</text>
  <text x="785" y="559" class="body">Independent teams and adaptability</text>

  <rect x="450" y="632" width="300" height="4" fill="#d4b361" rx="2"/>
</svg>
