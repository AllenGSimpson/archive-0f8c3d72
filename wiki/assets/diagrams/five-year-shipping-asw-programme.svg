<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Five-Year Merchant-Shipping and Anti-Submarine Programme</title><desc id="desc">Merchant ships sit inside an anti-submarine route-defense system of escorts, sensors, aviation, submarines, bases, replenishment, and repair.</desc><rect width="1200" height="675" fill="#0c151a"/><rect x="34" y="34" width="1132" height="607" rx="16" fill="#132028" stroke="#b8a36a" stroke-width="2"/><text x="72" y="84" fill="#eee8d8" font-family="Georgia,serif" font-size="28" font-weight="700">FIVE-YEAR MERCHANT-SHIPPING AND ANTI-SUBMARINE PROGRAMME</text><text x="72" y="118" fill="#b8a36a" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">HUNDREDS FOR THE ROUTE</text><line x1="72" y1="142" x2="1128" y2="142" stroke="#526573"/><g font-family="Arial,sans-serif"><path d="M90 425H1110" stroke="#31586d" stroke-width="70"/><path d="M90 425H1110" stroke="#7092a3" stroke-width="3" stroke-dasharray="15 14"/><g fill="#223745" stroke="#7892a0"><rect x="80" y="183" width="236" height="96" rx="10"/><rect x="332" y="183" width="236" height="96" rx="10"/><rect x="584" y="183" width="236" height="96" rx="10"/><rect x="836" y="183" width="292" height="96" rx="10"/></g><g fill="#f0ebdd" font-size="18" font-weight="700" text-anchor="middle"><text x="198" y="221">ESCORTS</text><text x="198" y="247">frigates · destroyers</text><text x="450" y="221">SENSORS</text><text x="450" y="247">radar · sonar</text><text x="702" y="221">AVIATION</text><text x="702" y="247">patrol aircraft · helicopters</text><text x="982" y="221">UNDERSEA FORCE</text><text x="982" y="247">submarines · intelligence</text></g><g fill="#18262f" stroke="#b8a36a"><rect x="118" y="356" width="208" height="138" rx="10"/><rect x="368" y="356" width="208" height="138" rx="10"/><rect x="618" y="356" width="208" height="138" rx="10"/><rect x="868" y="356" width="208" height="138" rx="10"/></g><g fill="#eee8d8" font-size="17" font-weight="700" text-anchor="middle"><text x="222" y="397">MERCHANT HULLS</text><text x="222" y="430">cargo · tanker · reefer</text><text x="222" y="459">bulk · feeder · depot</text><text x="472" y="397">MOBILE SUPPORT</text><text x="472" y="430">replenishment · repair</text><text x="472" y="459">carriers · auxiliaries</text><text x="722" y="397">COMMONWEALTH BASES</text><text x="722" y="430">fuel · stores · airfields</text><text x="722" y="459">signals · route depth</text><text x="972" y="397">INDUSTRIAL FLOOR</text><text x="972" y="430">yards · crews · engines</text><text x="972" y="459">electronics · standards</text></g><rect x="278" y="548" width="644" height="48" rx="24" fill="#b8a36a"/><text x="600" y="578" fill="#0c151a" font-size="18" font-weight="700" text-anchor="middle">TWO SHIPS FOR THE FLAG · HUNDREDS FOR THE ROUTE</text></g></svg>
