<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three postwar papal conclaves</title>
  <desc id="desc">Three panels summarize the principal candidates, governing questions, and elected popes in 1958, 1971, and 1982.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a151d"/><stop offset="1" stop-color="#172630"/></linearGradient></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="58" y="67" fill="#f1eee6" font-family="Georgia,serif" font-size="32">Three elections, one developing settlement</text>
  <text x="58" y="101" fill="#9fb1bc" font-family="Arial,sans-serif" font-size="17">The College changed candidates as the Church's principal institutional problem changed</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(55 140)">
      <rect width="340" height="395" rx="18" fill="#222a2c" stroke="#70a19a" stroke-width="3"/>
      <text x="28" y="48" fill="#e9f4f2" font-size="24" font-weight="700">1958</text>
      <text x="28" y="77" fill="#9ebbb6" font-size="14">THE EASTERN QUESTION</text>
      <path d="M28 99H312" stroke="#41575a"/>
      <text x="28" y="135" fill="#e5e9eb" font-size="15" font-weight="700">Principal field</text>
      <text x="42" y="163" fill="#c4d0d4" font-size="14">Angelo Roncalli</text>
      <text x="42" y="189" fill="#c4d0d4" font-size="14">Gregorio Pietro Agagianian</text>
      <text x="42" y="215" fill="#c4d0d4" font-size="14">Giuseppe Siri</text>
      <text x="28" y="258" fill="#e5e9eb" font-size="15" font-weight="700">Decisive concerns</text>
      <text x="42" y="286" fill="#c4d0d4" font-size="14">Orthodox revival · Armenian survival</text>
      <text x="42" y="312" fill="#c4d0d4" font-size="14">Independence from victorious blocs</text>
      <rect x="28" y="342" width="284" height="34" rx="17" fill="#4d837a"/>
      <text x="170" y="365" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">GREGORY XVII ELECTED</text>
    </g>
    <g transform="translate(430 140)">
      <rect width="340" height="395" rx="18" fill="#282631" stroke="#9185b6" stroke-width="3"/>
      <text x="28" y="48" fill="#f0ecfa" font-size="24" font-weight="700">1971</text>
      <text x="28" y="77" fill="#c1b9d8" font-size="14">RECEIVING THE COUNCIL</text>
      <path d="M28 99H312" stroke="#4d4961"/>
      <text x="28" y="135" fill="#e5e9eb" font-size="15" font-weight="700">Principal field</text>
      <text x="42" y="163" fill="#c9c6d4" font-size="14">Giovanni Battista Montini</text>
      <text x="42" y="189" fill="#c9c6d4" font-size="14">Giuseppe Siri</text>
      <text x="42" y="215" fill="#c9c6d4" font-size="14">Franjo Šeper</text>
      <text x="28" y="258" fill="#e5e9eb" font-size="15" font-weight="700">Decisive movement</text>
      <text x="42" y="286" fill="#c9c6d4" font-size="14">Sheen defines Šeper as a program</text>
      <text x="42" y="312" fill="#c9c6d4" font-size="14">Siri's supporters move to Šeper</text>
      <rect x="28" y="342" width="284" height="34" rx="17" fill="#6d6495"/>
      <text x="170" y="365" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">PAUL VI ELECTED</text>
    </g>
    <g transform="translate(805 140)">
      <rect width="340" height="395" rx="18" fill="#242b31" stroke="#7e9aaf" stroke-width="3"/>
      <text x="28" y="48" fill="#ebf2f7" font-size="24" font-weight="700">1982</text>
      <text x="28" y="77" fill="#b8cbd8" font-size="14">CONSOLIDATION IN LAW</text>
      <path d="M28 99H312" stroke="#455864"/>
      <text x="28" y="135" fill="#e5e9eb" font-size="15" font-weight="700">Principal field</text>
      <text x="42" y="163" fill="#c8d1d7" font-size="14">Giuseppe Siri</text>
      <text x="42" y="189" fill="#c8d1d7" font-size="14">Giovanni Benelli</text>
      <text x="42" y="215" fill="#c8d1d7" font-size="14">Karol Wojtyła and others</text>
      <text x="28" y="258" fill="#e5e9eb" font-size="15" font-weight="700">Decisive movement</text>
      <text x="42" y="286" fill="#c8d1d7" font-size="14">Eastern guarantees</text>
      <text x="42" y="312" fill="#c8d1d7" font-size="14">Wojtyła and Ratzinger bridge blocs</text>
      <rect x="28" y="342" width="284" height="34" rx="17" fill="#55798f"/>
      <text x="170" y="365" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">PIUS XIII ELECTED</text>
    </g>
  </g>
  <text x="600" y="581" text-anchor="middle" fill="#8fa2ad" font-family="Arial,sans-serif" font-size="14">Ballot totals remain secret; coalition movement is reconstructed from later accounts.</text>
</svg>
