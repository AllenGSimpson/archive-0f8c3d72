<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Reciprocal Open Markets</title><desc id="d">American policy divides commerce into open ordinary, negotiated sensitive, and closed strategic categories.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151c"/><stop offset="1" stop-color="#243138"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f1f5f4" font-family="Georgia,serif" font-size="31">Reciprocal Open Markets</text><text x="60" y="105" fill="#a6b9bd" font-family="Arial,sans-serif" font-size="17">Trade with the world without selling the keys to strategic workshops</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="175" width="330" height="305" rx="20" fill="#24463e" stroke="#88a97c" stroke-width="3"/><text x="235" y="225" fill="#eff4ef" font-size="21" font-weight="700">OPEN</text><text x="235" y="260" fill="#c9d9ce" font-size="16">ordinary commerce</text><text x="235" y="310" fill="#b8cbc2" font-size="15">consumer goods</text><text x="235" y="340" fill="#b8cbc2" font-size="15">services / licensing</text><text x="235" y="370" fill="#b8cbc2" font-size="15">portfolio investment</text><text x="235" y="400" fill="#b8cbc2" font-size="15">minority stakes</text><rect x="435" y="175" width="330" height="305" rx="20" fill="#443f37" stroke="#b09872" stroke-width="3"/><text x="600" y="225" fill="#f3f1ec" font-size="21" font-weight="700">NEGOTIATED</text><text x="600" y="260" fill="#d9d0bd" font-size="16">sensitive access</text><text x="600" y="310" fill="#cdc2aa" font-size="15">automobiles / banking</text><text x="600" y="340" fill="#cdc2aa" font-size="15">machine tools</text><text x="600" y="370" fill="#cdc2aa" font-size="15">telecommunications</text><text x="600" y="400" fill="#cdc2aa" font-size="15">commercial aerospace</text><rect x="800" y="175" width="330" height="305" rx="20" fill="#49343a" stroke="#ad7473" stroke-width="3"/><text x="965" y="225" fill="#f5eeee" font-size="21" font-weight="700">CLOSED CONTROL</text><text x="965" y="260" fill="#dfc3c6" font-size="16">strategic capacity</text><text x="965" y="310" fill="#d4b5ba" font-size="15">weapons / launch</text><text x="965" y="340" fill="#d4b5ba" font-size="15">nuclear systems</text><text x="965" y="370" fill="#d4b5ba" font-size="15">ports / core networks</text><text x="965" y="400" fill="#d4b5ba" font-size="15">mobilization assets</text></g><text x="600" y="545" fill="#a8b9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">The 1990 failure came from measuring nominal investors more reliably than ownership networks</text></svg>
