<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Civil administration of Jordan's western provinces</title>
  <desc id="desc">National ministries in Amman supervise western provincial governors, civil servants, courts, police and schools, which work with municipalities, holy-place authorities, refugee camps and property-claims offices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121b20"/><stop offset="1" stop-color="#1b2826"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#91aaa3"/></marker>
    <style>.head{font:700 42px Georgia,serif;fill:#f3e5c3}.sub{font:20px Arial,sans-serif;fill:#b9c8c3}.title{font:700 25px Georgia,serif;fill:#fff0ca}.label{font:700 17px Arial,sans-serif;fill:#eddfbd}.body{font:16px Arial,sans-serif;fill:#d7dfdc}.small{font:14px Arial,sans-serif;fill:#b8c5c1}.line{fill:none;stroke:#91aaa3;stroke-width:3;marker-end:url(#arrow)}.link{fill:none;stroke:#718b86;stroke-width:2;stroke-dasharray:8 7}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="75" y="75" class="head">Civil administration of the western provinces</text>
  <text x="77" y="111" class="sub">National jurisdiction, provincial offices, and retained Palestinian institutions · 1950s onward</text>

  <rect x="475" y="150" width="650" height="112" rx="18" fill="#4b2730" stroke="#9b6570" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="193" text-anchor="middle" class="title">Crown, cabinet, and national ministries</text>
  <text x="800" y="228" text-anchor="middle" class="body">Interior · justice · education · finance · health · works · religious endowments</text>

  <path class="line" d="M800 263v72"/>
  <rect x="400" y="335" width="800" height="114" rx="18" fill="#5a492d" stroke="#a68b57" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="378" text-anchor="middle" class="title">Western provincial governors and regional directorates</text>
  <text x="800" y="414" text-anchor="middle" class="body">Budget coordination · appointments · records · public order · reporting to Amman</text>

  <path class="line" d="M800 450v55H220v45"/><path class="line" d="M800 450v55H595v45"/><path class="line" d="M800 450v100"/><path class="line" d="M800 450v55h580v45"/>

  <rect x="70" y="550" width="300" height="150" rx="17" fill="#314759" stroke="#668aa0" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="590" text-anchor="middle" class="title">Civil service</text>
  <text x="220" y="624" text-anchor="middle" class="body">clerks · engineers · doctors</text>
  <text x="220" y="653" text-anchor="middle" class="body">land officers · tax offices</text>
  <text x="220" y="680" text-anchor="middle" class="small">Mandate continuity and national careers</text>

  <rect x="445" y="550" width="300" height="150" rx="17" fill="#36544a" stroke="#6d9a87" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="590" text-anchor="middle" class="title">Courts</text>
  <text x="595" y="624" text-anchor="middle" class="body">civil · criminal · land</text>
  <text x="595" y="653" text-anchor="middle" class="body">sharia · Christian communal</text>
  <text x="595" y="680" text-anchor="middle" class="small">National appeal, plural inherited law</text>

  <rect x="855" y="550" width="300" height="150" rx="17" fill="#493c57" stroke="#88749d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1005" y="590" text-anchor="middle" class="title">Police</text>
  <text x="1005" y="624" text-anchor="middle" class="body">town stations · rural posts</text>
  <text x="1005" y="653" text-anchor="middle" class="body">frontier · traffic · investigation</text>
  <text x="1005" y="680" text-anchor="middle" class="small">Civil force below the army ceiling</text>

  <rect x="1230" y="550" width="300" height="150" rx="17" fill="#4d4530" stroke="#9b895a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1380" y="590" text-anchor="middle" class="title">Education</text>
  <text x="1380" y="624" text-anchor="middle" class="body">government · municipal · religious</text>
  <text x="1380" y="653" text-anchor="middle" class="body">private · refugee · vocational</text>
  <text x="1380" y="680" text-anchor="middle" class="small">National curriculum, several providers</text>

  <path class="link" d="M220 701v57h1180"/><path class="link" d="M595 701v57"/><path class="link" d="M1005 701v57"/><path class="link" d="M1380 701v57"/>
  <rect x="235" y="758" width="1130" height="88" rx="16" fill="#26383a" stroke="#668783" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="794" text-anchor="middle" class="label">Local and special institutions</text>
  <text x="800" y="824" text-anchor="middle" class="body">municipalities · Jerusalem holy-place bodies · Gaza camps · refugee services · property-claims records</text>

  <text x="76" y="870" class="small">Exact ministry names, districts, staffing tables, court map, and police establishment remain open.</text>
</svg>
