<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Union Commonwealth electoral history, 1947–1975</title>
  <desc id="desc">A bar chart showing 104 seats in 1947, 94 in 1951, 48 in 1955, seven in 1969, and three in 1975, with the Commonwealth Supply Agreement marked from 1951 to 1955.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1722"/><stop offset="1" stop-color="#182c3b"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#236276"/><stop offset="1" stop-color="#63c4d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="86" fill="#f5f2e8" font-family="Georgia,serif" font-size="38">Union Commonwealth in Parliament</text>
  <text x="72" y="125" fill="#9fb5c1" font-family="Arial,sans-serif" font-size="20">Fixed House of Commons representation · unknown intermediate elections remain deliberately unfilled</text>
  <g stroke="#5f7885" stroke-opacity=".35" stroke-width="1">
    <path d="M110 608H1320"/><path d="M110 504H1320"/><path d="M110 400H1320"/><path d="M110 296H1320"/><path d="M110 192H1320"/>
  </g>
  <g fill="#8fa6b2" font-family="Arial,sans-serif" font-size="18" text-anchor="end">
    <text x="92" y="614">0</text><text x="92" y="510">25</text><text x="92" y="406">50</text><text x="92" y="302">75</text><text x="92" y="198">100</text>
  </g>
  <g fill="url(#bar)" filter="url(#shadow)">
    <rect x="170" y="175" width="150" height="433" rx="10"/><rect x="405" y="217" width="150" height="391" rx="10"/><rect x="640" y="408" width="150" height="200" rx="10"/><rect x="935" y="579" width="150" height="29" rx="10"/><rect x="1170" y="596" width="150" height="12" rx="6"/>
  </g>
  <g fill="#f5f2e8" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="245" y="160">104</text><text x="480" y="202">94</text><text x="715" y="393">48</text><text x="1010" y="564">7</text><text x="1245" y="581">3</text>
  </g>
  <g fill="#d4e2e7" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">
    <text x="245" y="645">1947</text><text x="480" y="645">1951</text><text x="715" y="645">1955</text><text x="1010" y="645">1969</text><text x="1245" y="645">1975</text>
  </g>
  <g fill="#94aab5" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">
    <text x="245" y="673">c. 18%</text><text x="480" y="673">c. 19%</text><text x="715" y="673">14.8%</text><text x="1010" y="673">vote open</text><text x="1245" y="673">vote open</text>
  </g>
  <path d="M480 716H715" stroke="#f1c86a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="480" cy="716" r="7" fill="#f1c86a"/><circle cx="715" cy="716" r="7" fill="#f1c86a"/>
  <text x="598" y="741" fill="#f1c86a" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Commonwealth Supply Agreement · influence without Cabinet office</text>
  <text x="860" y="242" fill="#f5f2e8" font-family="Georgia,serif" font-size="25">Policy victory, electoral contraction</text>
  <text x="860" y="276" fill="#a9bdc6" font-family="Arial,sans-serif" font-size="18">Planning, shipping, strategic industry, and veteran guarantees</text>
  <text x="860" y="302" fill="#a9bdc6" font-family="Arial,sans-serif" font-size="18">entered government while Mosley remained outside it.</text>
</svg>
