<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Kaguya Base machine-first settlement sequence</title>
  <desc id="desc">Five development phases lead from orbital survey through machine inspection, cargo delivery, remote construction, and environmental checkout to permanent human occupation, supported by Earth, Hōrai, surface machines, and Japanese command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1923"/><stop offset="1" stop-color="#142b38"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#02070b" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#85a9b8"/></marker>
    <style>
      .title{font:700 38px Georgia,serif;fill:#f4f1e8}.sub{font:17px Arial,sans-serif;fill:#aebdc5}.phase{fill:#183847;stroke:#9fc7d4;stroke-width:2}.phase2{fill:#234f5d}.phase3{fill:#315d69}.phase4{fill:#496b70}.human{fill:#7a653f;stroke:#e8c779;stroke-width:2}.box{fill:#1d2b33;stroke:#7e969f;stroke-width:2}.head{font:700 18px Arial,sans-serif;fill:#f4f1e8}.label{font:700 15px Arial,sans-serif;fill:#f4f1e8}.small{font:14px Arial,sans-serif;fill:#b7c4c9}.date{font:700 15px Arial,sans-serif;fill:#e8c779}.section{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#e8c779}.line{stroke:#85a9b8;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="18" fill="url(#bg)"/>
  <text x="58" y="58" class="title">Kaguya Base: Machine-First Settlement</text>
  <text x="58" y="89" class="sub">The site acquires an operating history before it acquires a permanent resident community</text>

  <text x="58" y="132" class="section">DEVELOPMENT SEQUENCE</text>
  <path d="M195 230 H1205" class="line"/>

  <g filter="url(#shadow)">
    <rect x="45" y="155" width="230" height="112" rx="14" class="phase"/>
    <text x="160" y="183" text-anchor="middle" class="date">1 · SURVEY</text>
    <text x="160" y="210" text-anchor="middle" class="head">Orbital mapping</text>
    <text x="160" y="234" text-anchor="middle" class="small">resources · terrain · relays</text>
    <text x="160" y="254" text-anchor="middle" class="small">candidate-site register</text>

    <rect x="315" y="155" width="230" height="112" rx="14" class="phase phase2"/>
    <text x="430" y="183" text-anchor="middle" class="date">2 · INSPECTION</text>
    <text x="430" y="210" text-anchor="middle" class="head">Surface machines</text>
    <text x="430" y="234" text-anchor="middle" class="small">bearing · slopes · routes</text>
    <text x="430" y="254" text-anchor="middle" class="small">long-duration survival</text>

    <rect x="585" y="155" width="230" height="112" rx="14" class="phase phase3"/>
    <text x="700" y="183" text-anchor="middle" class="date">3 · DELIVERY</text>
    <text x="700" y="210" text-anchor="middle" class="head">Automated landers</text>
    <text x="700" y="234" text-anchor="middle" class="small">power · shelter · stores</text>
    <text x="700" y="254" text-anchor="middle" class="small">construction equipment</text>

    <rect x="855" y="155" width="230" height="112" rx="14" class="phase phase4"/>
    <text x="970" y="183" text-anchor="middle" class="date">4 · CONSTRUCTION</text>
    <text x="970" y="210" text-anchor="middle" class="head">Remote site work</text>
    <text x="970" y="234" text-anchor="middle" class="small">pad · cargo handling</text>
    <text x="970" y="254" text-anchor="middle" class="small">shielding · checkout</text>

    <rect x="1125" y="155" width="230" height="112" rx="14" class="human"/>
    <text x="1240" y="183" text-anchor="middle" class="date">5 · OCCUPATION</text>
    <text x="1240" y="210" text-anchor="middle" class="head">Permanent crew</text>
    <text x="1240" y="234" text-anchor="middle" class="small">late 1990s</text>
    <text x="1240" y="254" text-anchor="middle" class="small">commissioning and repair</text>
  </g>

  <text x="58" y="338" class="section">OPERATING LAYERS</text>
  <g filter="url(#shadow)">
    <rect x="60" y="372" width="285" height="122" rx="14" class="box"/>
    <text x="202" y="402" text-anchor="middle" class="head">Earth network</text>
    <text x="202" y="430" text-anchor="middle" class="small">mission design · certification</text>
    <text x="202" y="453" text-anchor="middle" class="small">analysis · cargo planning</text>
    <text x="202" y="476" text-anchor="middle" class="small">Japanese final authority</text>

    <rect x="385" y="372" width="285" height="122" rx="14" class="box"/>
    <text x="527" y="402" text-anchor="middle" class="head">Hōrai orbital support</text>
    <text x="527" y="430" text-anchor="middle" class="small">robotics supervision · relays</text>
    <text x="527" y="453" text-anchor="middle" class="small">life science · failure triage</text>
    <text x="527" y="476" text-anchor="middle" class="small">crew and traffic coordination</text>

    <rect x="710" y="372" width="285" height="122" rx="14" class="box"/>
    <text x="852" y="402" text-anchor="middle" class="head">Surface machine system</text>
    <text x="852" y="430" text-anchor="middle" class="small">beacons · haulers · manipulators</text>
    <text x="852" y="453" text-anchor="middle" class="small">excavation · inspection</text>
    <text x="852" y="476" text-anchor="middle" class="small">bounded local autonomy</text>

    <rect x="1035" y="372" width="305" height="122" rx="14" class="box"/>
    <text x="1187" y="402" text-anchor="middle" class="head">Resident installation</text>
    <text x="1187" y="430" text-anchor="middle" class="small">power · environmental control</text>
    <text x="1187" y="453" text-anchor="middle" class="small">medicine · hydroponics · stores</text>
    <text x="1187" y="476" text-anchor="middle" class="small">compact Japanese-command crew</text>
  </g>
  <path d="M345 433 H375" class="line"/><path d="M670 433 H700" class="line"/><path d="M995 433 H1025" class="line"/>

  <text x="58" y="552" class="section">INSTITUTIONAL BOUNDARY</text>
  <rect x="60" y="580" width="1280" height="118" rx="14" fill="#16262f" stroke="#6f8994" stroke-width="2"/>
  <text x="92" y="615" class="label">Legal presentation</text><text x="292" y="615" class="small">Co-Prosperity installation</text>
  <text x="92" y="646" class="label">Operational authority</text><text x="292" y="646" class="small">Japanese command, certification, mission keys, and principal symbolism</text>
  <text x="92" y="677" class="label">Associated participation</text><text x="292" y="677" class="small">Designated scientific, technical, and political seats rather than equal ownership</text>
  <text x="910" y="615" class="label">Exact site</text><text x="1055" y="615" class="small">open</text>
  <text x="910" y="646" class="label">First crew</text><text x="1055" y="646" class="small">open</text>
  <text x="910" y="677" class="label">Resident total</text><text x="1055" y="677" class="small">open</text>
</svg>
