<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">British infantry weapons, 1951 to 1985</title><desc id="desc">Timeline showing the Rifle No. 9 and TADEN families, Pattern 76 optical interface, and unadopted 4.85 mm trials.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#162027"/><stop offset="1" stop-color="#33463f"/></linearGradient><style>.h{font-family:Georgia,serif;fill:#f6efdd}.s{font-family:Arial,sans-serif;fill:#d6e0dc}.y{font:700 25px Arial,sans-serif;fill:#dcbc6a}.n{font:700 29px Georgia,serif;fill:#fff}.d{font:18px Arial,sans-serif;fill:#dce5e1}.box{fill:#21342f;stroke:#aebfb6;stroke-width:2}.line{stroke:#d2ae5f;stroke-width:7}</style></defs><rect width="1600" height="900" fill="url(#b)"/><text x="70" y="82" class="h" font-size="49" font-weight="700">British infantry weapons</text><text x="72" y="124" class="s" font-size="22">The 7×43 mm system and the uncompleted caliber transition · 1951–1985</text><path class="line" d="M130 215H1470"/><g fill="#dcbc6a"><circle cx="220" cy="215" r="11"/><circle cx="500" cy="215" r="11"/><circle cx="780" cy="215" r="11"/><circle cx="1060" cy="215" r="11"/><circle cx="1340" cy="215" r="11"/></g><g><text x="185" y="180" class="y">1951</text><text x="465" y="180" class="y">1952–54</text><text x="745" y="180" class="y">1962</text><text x="1025" y="180" class="y">1974–77</text><text x="1305" y="180" class="y">1978–85</text></g><g><rect class="box" x="70" y="290" width="340" height="220" rx="14"/><text x="105" y="345" class="n">Rifle No. 9 Mk 1</text><text x="105" y="387" class="d">Service EM-2 · bullpup</text><text x="105" y="420" class="d">7×43 mm · 20-round magazine</text><text x="105" y="462" class="d">Indian proving ground</text><rect class="box" x="430" y="290" width="340" height="220" rx="14"/><text x="465" y="345" class="n">TADEN family</text><text x="465" y="387" class="d">L4: 50-round belt · bipod</text><text x="465" y="420" class="d">L7: 100-round belt · GPMG</text><text x="465" y="462" class="d">Common 7×43 mm cartridge</text><rect class="box" x="790" y="290" width="340" height="220" rx="14"/><text x="825" y="345" class="n">Rifle No. 9 Mk 2</text><text x="825" y="387" class="d">25-round magazine</text><text x="825" y="420" class="d">Reliability and manufacturing</text><text x="825" y="453" class="d">improvement</text><rect class="box" x="1150" y="290" width="380" height="220" rx="14"/><text x="1185" y="345" class="n">L7A4 and Mk 4</text><text x="1185" y="387" class="d">Improved feed and optics</text><text x="1185" y="420" class="d">Pattern 76 interface</text><text x="1185" y="453" class="d">Principal 1985 rifle system</text></g><rect x="250" y="630" width="1100" height="150" rx="16" fill="#3c3029" stroke="#d28c6e" stroke-width="3"/><text x="300" y="690" class="n">4.85×49 mm trials after 1978</text><text x="300" y="730" class="d">Experimental only · no adoption before 1985</text><text x="300" y="762" class="d">7×43 mm remains effective and logistically entrenched across the Commonwealth.</text><text x="72" y="850" class="s" font-size="20">Enfield Dovetail Pattern 76 is the British optical standard; it is not Picatinny.</text></svg>
