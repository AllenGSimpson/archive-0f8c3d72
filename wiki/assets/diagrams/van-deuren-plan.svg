<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Development of the Van-Deuren Plan</title><desc id="desc">Pierre Van Deuren's integrated Lower Congo development proposal passes through Belgian technical studies and German appropriation before becoming the much larger Kongowerk.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#dcc26f"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#07151e"/><text x="600" y="54" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">FROM LOWER-CONGO PLAN TO KONGOWERK</text>
  <g font-family="Arial,sans-serif">
    <rect x="45" y="130" width="250" height="245" rx="18" fill="#253c42" stroke="#78b3c0" stroke-width="3"/><text x="170" y="174" text-anchor="middle" fill="#fff" font-size="21">1925–1928</text><text x="170" y="214" text-anchor="middle" fill="#d9eef1" font-size="17">Van Deuren proposal</text><text x="170" y="244" text-anchor="middle" fill="#d9eef1" font-size="17">Lower Congo regulation</text><text x="170" y="274" text-anchor="middle" fill="#d9eef1" font-size="17">power · port · industry</text><text x="170" y="325" text-anchor="middle" fill="#ffd99a" font-size="16">INTEGRATED DEVELOPMENT</text>
    <rect x="335" y="130" width="250" height="245" rx="18" fill="#2a3f37" stroke="#83b796" stroke-width="3"/><text x="460" y="174" text-anchor="middle" fill="#fff" font-size="21">1929–1931</text><text x="460" y="214" text-anchor="middle" fill="#e0f1e4" font-size="17">SYNEBA studies</text><text x="460" y="244" text-anchor="middle" fill="#e0f1e4" font-size="17">surveys and archives</text><text x="460" y="274" text-anchor="middle" fill="#e0f1e4" font-size="17">Belgian technical debate</text><text x="460" y="325" text-anchor="middle" fill="#ffd99a" font-size="16">FEASIBILITY WORK</text>
    <rect x="625" y="130" width="250" height="245" rx="18" fill="#41332d" stroke="#cb9973" stroke-width="3"/><text x="750" y="174" text-anchor="middle" fill="#fff" font-size="21">1947–1948</text><text x="750" y="214" text-anchor="middle" fill="#f4dfd2" font-size="17">archives seized</text><text x="750" y="244" text-anchor="middle" fill="#f4dfd2" font-size="17">engineers compelled</text><text x="750" y="274" text-anchor="middle" fill="#f4dfd2" font-size="17">three German options</text><text x="750" y="325" text-anchor="middle" fill="#ffd99a" font-size="16">IMPERIAL APPROPRIATION</text>
    <rect x="915" y="105" width="240" height="295" rx="18" fill="#422b30" stroke="#d47b7f" stroke-width="3"/><text x="1035" y="150" text-anchor="middle" fill="#fff" font-size="21">MAXIMAL OPTION</text><text x="1035" y="200" text-anchor="middle" fill="#f2d6d8" font-size="17">Speer integration</text><text x="1035" y="230" text-anchor="middle" fill="#f2d6d8" font-size="17">Hitler's selection</text><text x="1035" y="275" text-anchor="middle" fill="#ffb8aa" font-size="17">central-basin flooding</text><text x="1035" y="320" text-anchor="middle" fill="#ffd99a" font-size="17">KONGO-GESAMTWERK</text><text x="1035" y="360" text-anchor="middle" fill="#f5d8dc" font-size="15">not Van Deuren's design</text>
    <path d="M295 255H323" stroke="#dcc26f" stroke-width="5" marker-end="url(#arrow)"/><path d="M585 255H613" stroke="#dcc26f" stroke-width="5" marker-end="url(#arrow)"/><path d="M875 255H903" stroke="#dcc26f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="464" text-anchor="middle" fill="#cbe4ea" font-size="20">Continuity of records did not mean continuity of purpose</text>
  </g>
</svg>
