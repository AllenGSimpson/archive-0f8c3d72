<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cislunar logistics cycle</title>
  <desc id="desc">Earth launches crews and complex goods to orbital ports. Ports consolidate traffic to the Moon. Lunar works return water, oxygen, shielding, and simple materials to orbital industry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121d"/><stop offset="1" stop-color="#152637"/></linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48a7cc"/><stop offset="1" stop-color="#245377"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4d8d9"/><stop offset="1" stop-color="#737e85"/></linearGradient>
    <marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64d4ed"/></marker>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e8b66b"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .eyebrow{font:600 23px Arial,sans-serif;letter-spacing:5px;fill:#64d4ed}.title{font:700 52px Georgia,serif;fill:#f5f2e9}.sub{font:24px Arial,sans-serif;fill:#aab8c3}.head{font:700 28px Arial,sans-serif;fill:#f5f2e9}.copy{font:21px Arial,sans-serif;fill:#d6dde1}.small{font:18px Arial,sans-serif;fill:#aab8c3}.routeA{fill:none;stroke:#64d4ed;stroke-width:8;marker-end:url(#arrowA)}.routeB{fill:none;stroke:#e8b66b;stroke-width:8;marker-end:url(#arrowB)}.node{fill:#162b3a;stroke:#456a7c;stroke-width:2}.pill{fill:#0b1b28;stroke:#345365;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="82" class="eyebrow">MATURE SPACE INFRASTRUCTURE</text>
  <text x="90" y="142" class="title">The cislunar logistics cycle</text>
  <text x="90" y="184" class="sub">A route becomes an economy when cargoes, vehicles, and schedules can be separated and recombined.</text>

  <g filter="url(#shadow)">
    <circle cx="245" cy="475" r="142" fill="url(#earth)"/>
    <path d="M125 450c65-28 70-83 133-61 45 16 49 65 103 67-20 40-36 65-73 82-44 20-105 4-163-21z" fill="#6caa77" opacity=".72"/>
    <text x="245" y="686" text-anchor="middle" class="head">EARTH</text>
    <text x="245" y="720" text-anchor="middle" class="small">People · precision goods · medicine</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="615" y="320" width="370" height="310" rx="35" class="node"/>
    <circle cx="800" cy="430" r="80" fill="none" stroke="#b6ced8" stroke-width="14"/>
    <circle cx="800" cy="430" r="20" fill="#e8b66b"/>
    <path d="M695 430h210M800 325v210" stroke="#b6ced8" stroke-width="8"/>
    <text x="800" y="570" text-anchor="middle" class="head">ORBITAL PORTS</text>
    <text x="800" y="605" text-anchor="middle" class="small">Inspect · store · repair · assemble · dispatch</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1355" cy="475" r="118" fill="url(#moon)"/>
    <circle cx="1315" cy="430" r="22" fill="#68747a" opacity=".7"/><circle cx="1390" cy="515" r="29" fill="#68747a" opacity=".6"/><circle cx="1385" cy="408" r="14" fill="#68747a" opacity=".65"/>
    <text x="1355" y="686" text-anchor="middle" class="head">MOON</text>
    <text x="1355" y="720" text-anchor="middle" class="small">Water · oxygen · shielding · materials</text>
  </g>

  <path d="M390 405C480 325 535 315 605 350" class="routeA"/>
  <path d="M610 565C520 625 465 626 382 566" class="routeB"/>
  <path d="M995 355C1090 305 1166 322 1232 392" class="routeA"/>
  <path d="M1235 558C1145 626 1082 620 988 568" class="routeB"/>

  <g transform="translate(395 250)"><rect width="210" height="62" rx="31" class="pill"/><text x="105" y="39" text-anchor="middle" class="copy">launch &amp; crew</text></g>
  <g transform="translate(410 650)"><rect width="205" height="62" rx="31" class="pill"/><text x="102" y="39" text-anchor="middle" class="copy">return cargo</text></g>
  <g transform="translate(1000 250)"><rect width="225" height="62" rx="31" class="pill"/><text x="112" y="39" text-anchor="middle" class="copy">tugs &amp; tankers</text></g>
  <g transform="translate(1000 650)"><rect width="235" height="62" rx="31" class="pill"/><text x="117" y="39" text-anchor="middle" class="copy">lunar bulk mass</text></g>

  <g transform="translate(90 795)"><rect width="1420" height="72" rx="18" fill="#0a1823" stroke="#345365"/><text x="35" y="45" class="copy"><tspan fill="#64d4ed" font-weight="700">GERMANY</tspan><tspan> concentrates heavy assemblies · </tspan><tspan fill="#e8b66b" font-weight="700">AMERICA</tspan><tspan> maximizes cadence and retrieval · every system remains dependent on Earth</tspan></text></g>
</svg>
