<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Columbia lunar mission, 20 July 1971</title>
  <desc id="desc">Two spacecraft leave Canaveral, rendezvous and refuel in Earth orbit, Columbia lands on the Moon, and returns directly to a runway.</desc>
  <defs><linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111e"/><stop offset="1" stop-color="#1b2843"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7edcff"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".4"/></filter></defs>
  <rect width="1200" height="650" rx="26" fill="url(#space)"/>
  <circle cx="1030" cy="390" r="112" fill="#c7c5bd"/><circle cx="995" cy="350" r="21" fill="#aaa9a3"/><circle cx="1070" cy="425" r="30" fill="#b3b1a9"/><circle cx="1040" cy="320" r="13" fill="#a5a49f"/>
  <path d="M105 505 C250 480 285 380 410 330" fill="none" stroke="#7edcff" stroke-width="5" marker-end="url(#a)"/>
  <path d="M105 550 C250 550 300 420 410 350" fill="none" stroke="#f0bd64" stroke-width="4" marker-end="url(#a)"/>
  <path d="M495 325 C700 220 820 255 925 345" fill="none" stroke="#7edcff" stroke-width="5" marker-end="url(#a)"/>
  <path d="M948 430 C840 545 570 565 200 535" fill="none" stroke="#a88cff" stroke-width="5" marker-end="url(#a)"/>
  <g font-family="Arial,sans-serif" filter="url(#s)">
    <g transform="translate(45 450)"><rect width="205" height="105" rx="14" fill="#14374b" stroke="#7edcff"/><text x="18" y="32" fill="#93e5ff" font-size="16">CANAVERAL</text><text x="18" y="61" fill="white" font-size="21" font-weight="700">Two runway launches</text><text x="18" y="86" fill="#bfd5df" font-size="15">OV-2A and OV-2B</text></g>
    <g transform="translate(360 255)"><rect width="240" height="130" rx="14" fill="#25415b" stroke="#85b6e8"/><text x="18" y="32" fill="#a6cef3" font-size="16">LOW EARTH ORBIT</text><text x="18" y="62" fill="white" font-size="22" font-weight="700">Rendezvous + refueling</text><text x="18" y="88" fill="#c6d4df" font-size="15">OV-2B transfers propellant</text><text x="18" y="111" fill="#c6d4df" font-size="15">No 1971 orbital tug</text></g>
    <g transform="translate(855 265)"><rect width="245" height="112" rx="14" fill="#4b4944" stroke="#e2dfd3"/><text x="18" y="32" fill="#f0ede3" font-size="16">THE MOON</text><text x="18" y="62" fill="white" font-size="22" font-weight="700">Vertical landing</text><text x="18" y="88" fill="#e0ded7" font-size="15">Two-person OV-2A crew</text></g>
    <g transform="translate(390 505)"><rect width="350" height="92" rx="14" fill="#393457" stroke="#b9a5ff"/><text x="18" y="31" fill="#cbbcff" font-size="16">DIRECT EARTH RETURN</text><text x="18" y="62" fill="white" font-size="21" font-weight="700">Reentry and Canaveral runway landing</text></g>
  </g>
  <text x="56" y="65" fill="white" font-family="Georgia,serif" font-size="34" font-weight="700">Columbia lunar mission · 20 July 1971</text>
  <text x="56" y="101" fill="#a9bfd0" font-family="Arial,sans-serif" font-size="18">The same OV-2A airframe travels from Florida to the lunar surface and back.</text>
</svg>
