<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">American early-jet generation, 1952–1960</title>
  <desc id="desc">Eight aircraft in Shooting Star, Thunder, Sabre, and Starfire families divided between the Army Air Corps and Aerospace Command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a24"/><stop offset="1" stop-color="#1a303d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter>
    <style>.title{font:700 40px Georgia,serif;fill:#f5efe0}.sub{font:18px Arial,sans-serif;fill:#bccbd0}.year{font:700 18px Arial,sans-serif;fill:#efd06e}.family{font:700 17px Arial,sans-serif;fill:#dce7e9;letter-spacing:1px}.name{font:700 19px Arial,sans-serif;fill:#fff}.meta{font:14px Arial,sans-serif;fill:#dce8ea}.role{font:13px Arial,sans-serif;fill:#c0d0d3}.box{stroke:#b9cacc;stroke-width:1.5;rx:10;filter:url(#shadow)}.line{stroke:#d7bd69;stroke-width:4;fill:none}.axis{stroke:#768990;stroke-width:3}.legend{font:14px Arial,sans-serif;fill:#c4d1d3}.note{font:14px Arial,sans-serif;fill:#b9c9cc}</style>
  </defs>
  <rect width="1200" height="960" fill="url(#bg)"/>
  <g fill="#b31f2d"><rect x="1030" y="38" width="50" height="82"/><rect x="998" y="70" width="114" height="50"/></g>
  <text x="70" y="75" class="title">American Early-Jet Generation</text>
  <text x="70" y="108" class="sub">Delayed procurement and divided service · 1952–1960</text>
  <line x1="170" y1="175" x2="1080" y2="175" class="axis"/>
  <g text-anchor="middle"><text x="210" y="156" class="year">1952</text><text x="390" y="156" class="year">1955</text><text x="570" y="156" class="year">1957</text><text x="770" y="156" class="year">1958</text><text x="1010" y="156" class="year">1960</text></g>
  <g fill="#768990"><circle cx="210" cy="175" r="6"/><circle cx="390" cy="175" r="6"/><circle cx="570" cy="175" r="6"/><circle cx="770" cy="175" r="6"/><circle cx="1010" cy="175" r="6"/></g>

  <text x="65" y="260" class="family">SHOOTING STAR</text><path d="M365 305 H690" class="line"/><path d="M680 295 L696 305 L680 315" class="line"/>
  <rect class="box" x="185" y="270" width="260" height="105" fill="#315e72"/><text x="205" y="303" class="name">P-80A-5 Shooting Star</text><text x="205" y="329" class="meta">Army Air Corps · 1952</text><text x="205" y="353" class="role">Pursuit and research</text>
  <rect class="box" x="695" y="270" width="260" height="105" fill="#8b424c"/><text x="715" y="303" class="name">F-80C Shooting Star</text><text x="715" y="329" class="meta">Aerospace Command · 1958</text><text x="715" y="353" class="role">Transitional interceptor</text>

  <text x="65" y="415" class="family">THUNDER</text><path d="M535 460 H690" class="line"/><path d="M680 450 L696 460 L680 470" class="line"/>
  <rect class="box" x="310" y="425" width="260" height="105" fill="#315e72"/><text x="330" y="458" class="name">F-84E Thunderjet</text><text x="330" y="484" class="meta">Army Air Corps · 1955</text><text x="330" y="508" class="role">Fighter-bomber and escort</text>
  <rect class="box" x="695" y="425" width="260" height="105" fill="#315e72"/><text x="715" y="458" class="name">F-84F Thunderstreak</text><text x="715" y="484" class="meta">Army Air Corps · 1958</text><text x="715" y="508" class="role">Swept-wing tactical strike</text>

  <text x="65" y="570" class="family">SABRE</text><path d="M715 615 H850" class="line"/><path d="M840 605 L856 615 L840 625" class="line"/>
  <rect class="box" x="500" y="580" width="260" height="105" fill="#315e72"/><text x="520" y="613" class="name">F-86A Sabre</text><text x="520" y="639" class="meta">Army Air Corps · 1957</text><text x="520" y="663" class="role">Catch-up day fighter</text>
  <rect class="box" x="855" y="580" width="260" height="105" fill="#315e72"/><text x="875" y="613" class="name">F-86F Sabre</text><text x="875" y="639" class="meta">Army Air Corps · 1960</text><text x="875" y="663" class="role">Mature frontline fighter</text>

  <text x="65" y="725" class="family">STARFIRE</text><path d="M895 770 H940" class="line"/><path d="M930 760 L946 770 L930 780" class="line"/>
  <rect class="box" x="640" y="735" width="270" height="105" fill="#8b424c"/><text x="660" y="768" class="name">F-94C Starfire</text><text x="660" y="794" class="meta">Aerospace Command · 1958</text><text x="660" y="818" class="role">All-weather interceptor</text>
  <rect class="box" x="945" y="735" width="230" height="105" fill="#315e72"/><text x="965" y="768" class="name">F-94D Starfire</text><text x="965" y="794" class="meta">Army Air Corps · 1960</text><text x="965" y="818" class="role">Limited all-weather strike</text>

  <rect x="70" y="885" width="20" height="20" rx="3" fill="#315e72"/><text x="102" y="900" class="legend">Army Air Corps</text><rect x="250" y="885" width="20" height="20" rx="3" fill="#8b424c"/><text x="282" y="900" class="legend">Aerospace Command</text><text x="520" y="900" class="note">P remains the pursuit prefix through 1957; active types move to F in 1958 without renumbering.</text>
</svg>
