<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Cape Route port system</title><desc id="desc">A west-to-east diagram connecting Freetown, Cape Town, Simon's Town, Durban, and the Commonwealth Indian Ocean chain.</desc>
  <rect width="1200" height="500" rx="28" fill="#101820"/><text x="600" y="52" text-anchor="middle" fill="#f1e7ce" font-family="Georgia,serif" font-size="30" font-weight="700">The ports that make the Cape route work</text><text x="600" y="82" text-anchor="middle" fill="#9fb0b7" font-family="Arial,sans-serif" font-size="16">Atlantic receipt · southern repair and defense · Indian Ocean distribution</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(38 145)"><rect width="230" height="190" rx="18" fill="#263f58" stroke="#719bc0" stroke-width="2"/><text x="115" y="42" text-anchor="middle" fill="#f1e7ce" font-size="22" font-weight="700">Freetown</text><text x="115" y="73" text-anchor="middle" fill="#a9c8df" font-size="14">Atlantic receiving port</text><text x="115" y="112" text-anchor="middle" fill="#d9e2e8" font-size="14">Convoys · hospitals</text><text x="115" y="137" text-anchor="middle" fill="#d9e2e8" font-size="14">Fuel · signals · relief</text><text x="115" y="169" text-anchor="middle" fill="#f0c674" font-size="13" font-weight="700">Sierra Leone</text></g>
    <path d="M270 240 H345" stroke="#c9b88f" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(350 105)"><rect width="230" height="150" rx="18" fill="#365145" stroke="#7da78c" stroke-width="2"/><text x="115" y="38" text-anchor="middle" fill="#f1e7ce" font-size="21" font-weight="700">Cape Town</text><text x="115" y="70" text-anchor="middle" fill="#b8d2c0" font-size="14">Commerce · fuel · repair</text><text x="115" y="98" text-anchor="middle" fill="#d9e2e8" font-size="14">Cold stores · rail</text><text x="115" y="128" text-anchor="middle" fill="#f0c674" font-size="13" font-weight="700">Western hinge</text></g>
    <g transform="translate(350 275)"><rect width="230" height="150" rx="18" fill="#4c3e35" stroke="#b58d6d" stroke-width="2"/><text x="115" y="38" text-anchor="middle" fill="#f1e7ce" font-size="21" font-weight="700">Simon's Town</text><text x="115" y="70" text-anchor="middle" fill="#dfc1a9" font-size="14">Fleet base · dockyard</text><text x="115" y="98" text-anchor="middle" fill="#d9e2e8" font-size="14">ASW · training · stores</text><text x="115" y="128" text-anchor="middle" fill="#f0c674" font-size="13" font-weight="700">Naval hinge</text></g>
    <path d="M582 240 H657" stroke="#c9b88f" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(662 145)"><rect width="230" height="190" rx="18" fill="#3d4956" stroke="#8799aa" stroke-width="2"/><text x="115" y="42" text-anchor="middle" fill="#f1e7ce" font-size="22" font-weight="700">Durban</text><text x="115" y="73" text-anchor="middle" fill="#c1ced8" font-size="14">Indian Ocean junction</text><text x="115" y="112" text-anchor="middle" fill="#d9e2e8" font-size="14">Cargo · fuel · rail</text><text x="115" y="137" text-anchor="middle" fill="#d9e2e8" font-size="14">Patrol · repair · stores</text><text x="115" y="169" text-anchor="middle" fill="#f0c674" font-size="13" font-weight="700">Eastern hinge</text></g>
    <path d="M894 240 H969" stroke="#c9b88f" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(974 145)"><rect width="188" height="190" rx="18" fill="#4a3a55" stroke="#9f83af" stroke-width="2"/><text x="94" y="42" text-anchor="middle" fill="#f1e7ce" font-size="20" font-weight="700">Indian Ocean</text><text x="94" y="71" text-anchor="middle" fill="#d2bee0" font-size="14">Commonwealth chain</text><text x="94" y="108" text-anchor="middle" fill="#d9e2e8" font-size="13">East Africa · Aden</text><text x="94" y="133" text-anchor="middle" fill="#d9e2e8" font-size="13">Ceylon · Australia</text><text x="94" y="166" text-anchor="middle" fill="#f0c674" font-size="13" font-weight="700">Bastion India</text></g>
  </g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9b88f"/></marker></defs>
</svg>
