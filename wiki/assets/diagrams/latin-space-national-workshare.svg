<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">National workshare of the Latin Space Community</title>
  <desc id="desc">A four-part diagram joining Italian launch and integration, Occitan avionics, Spanish structures, and Portuguese tracking around the Latin Space Community.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241f22"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8c6132"/><stop offset="1" stop-color="#4f2e28"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .title{font:700 30px Georgia,serif;fill:#f8f0e5}.sub{font:15px system-ui,sans-serif;fill:#c4b8ad}.node{fill:#151d25;stroke:#766b65;stroke-width:1.6}.core{fill:url(#core);stroke:#edc78d;stroke-width:2.4}.line{fill:none;stroke:#d5a65f;stroke-width:2.4;stroke-opacity:.72}.country{font:700 20px system-ui,sans-serif;fill:#fbf3e9}.role{font:14px system-ui,sans-serif;fill:#c8c4c1}.tag{font:700 13px system-ui,sans-serif;fill:#efbf78;letter-spacing:.09em}.center{font:700 25px Georgia,serif;fill:#fff}.center2{font:14px system-ui,sans-serif;fill:#f1dcc0}.footer{font:14px system-ui,sans-serif;fill:#bcb4ae}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(38 38)"><text class="title">Four national programs, one operating system</text><text y="31" class="sub">Latin power rests on reciprocal dependence rather than one supranational hardware monopoly</text></g>
  <path d="M600 340 C485 285 410 220 350 190" class="line"/><path d="M600 340 C715 285 790 220 850 190" class="line"/>
  <path d="M600 340 C485 395 410 470 350 510" class="line"/><path d="M600 340 C715 395 790 470 850 510" class="line"/>
  <g transform="translate(600 340)" filter="url(#shadow)"><circle r="118" class="core"/><circle r="78" fill="none" stroke="#f5dfbb" stroke-opacity=".3" stroke-width="2"/><path d="M-45 -6 H45 M-31 17 H31" stroke="#f7e2bc" stroke-width="7" stroke-linecap="round"/><text y="-55" text-anchor="middle" class="tag">COMMON INTERFACES</text><text y="72" text-anchor="middle" class="center">Latin Space</text><text y="94" text-anchor="middle" class="center2">Community</text></g>
  <g transform="translate(88 118)" filter="url(#shadow)"><rect width="340" height="145" rx="18" class="node"/><text x="24" y="38" class="country">Italy</text><text x="24" y="69" class="role">launchers · propulsion · life support</text><text x="24" y="93" class="role">mission integration · San Marco</text><text x="24" y="118" class="tag">LEADS THE MISSION CHAIN</text></g>
  <g transform="translate(772 118)" filter="url(#shadow)"><rect width="340" height="145" rx="18" class="node"/><text x="24" y="38" class="country">Occitania</text><text x="24" y="69" class="role">guidance · computers · docking</text><text x="24" y="93" class="role">telemetry · instruments · control</text><text x="24" y="118" class="tag">CONTROLS THE INTERFACES</text></g>
  <g transform="translate(88 438)" filter="url(#shadow)"><rect width="340" height="145" rx="18" class="node"/><text x="24" y="38" class="country">Spain</text><text x="24" y="69" class="role">pressure structures · solar arrays</text><text x="24" y="93" class="role">thermal systems · tests · astronomy</text><text x="24" y="118" class="tag">BUILDS THE ENDURING HARDWARE</text></g>
  <g transform="translate(772 438)" filter="url(#shadow)"><rect width="340" height="145" rx="18" class="node"/><text x="24" y="38" class="country">Portugal</text><text x="24" y="69" class="role">tracking · weather · navigation</text><text x="24" y="93" class="role">recovery · medicine · ocean logistics</text><text x="24" y="118" class="tag">KEEPS THE SYSTEM CONNECTED</text></g>
  <text x="600" y="632" text-anchor="middle" class="footer">No member owns every essential function; withdrawal is possible only at prohibitive cost.</text>
</svg>
