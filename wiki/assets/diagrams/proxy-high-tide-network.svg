<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proxy High Tide network</title><desc id="desc">Britain, Japan, Germany, and the United States connect to different Indian and Burmese governments through weapons, advice, recognition, relief, and observation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.p{fill:#172936;stroke:#5f7f92;stroke-width:2}.r{fill:#2c2520;stroke:#bc8e54;stroke-width:2}.i{fill:#253426;stroke:#78a56c;stroke-width:2}.t{font:700 19px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c2cdd4}.tag{font:700 12px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.line{fill:none;stroke:#d3ad55;stroke-width:3}.dash{fill:none;stroke:#7894a6;stroke-width:3;stroke-dasharray:9 7}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Proxy High Tide, 1952–1956</text><text x="50" y="92" class="s">Foreign participation formed overlapping patronage networks rather than two fixed alliances</text>
  <g transform="translate(48 138)"><rect class="p" width="250" height="116" rx="9"/><text x="18" y="31" class="tag">BRITISH COMMONWEALTH</text><text x="18" y="65" class="t">Maritime bastions</text><text x="18" y="91" class="d">southern and western clients</text></g>
  <g transform="translate(48 294)"><rect class="p" width="250" height="116" rx="9"/><text x="18" y="31" class="tag">EMPIRE OF JAPAN</text><text x="18" y="65" class="t">Eastern supply system</text><text x="18" y="91" class="d">Azad Hind and Burma</text></g>
  <g transform="translate(48 450)"><rect class="p" width="250" height="116" rx="9"/><text x="18" y="31" class="tag">GERMANY / UNITED STATES</text><text x="18" y="65" class="t">Limited engagement</text><text x="18" y="91" class="d">recognition · relief · observers</text></g>
  <path d="M298 196 H420" class="line"/><path d="M298 352 H420" class="line"/><path d="M298 508 H420" class="dash"/>
  <g transform="translate(420 116)"><rect class="r" width="354" height="472" rx="12"/><text x="177" y="42" text-anchor="middle" class="tag">DIVIDED INDIAN ORDER</text><text x="24" y="88" class="t">Madras · Mysore</text><text x="24" y="116" class="d">Travancore–Cochin · Maratha Union</text><text x="24" y="168" class="t">Azad Hind · Congress India</text><text x="24" y="196" class="d">Delhi Campaign and Ganges fronts</text><text x="24" y="248" class="t">Hyderabad · princely states</text><text x="24" y="276" class="d">selective foreign ties and mixed arsenals</text><text x="24" y="328" class="t">Burma and Assam routes</text><text x="24" y="356" class="d">corridors, depots, and repeated crisis</text><text x="24" y="408" class="t">Unrecognized districts</text><text x="24" y="436" class="d">local armies · militias · broker networks</text></g>
  <path d="M774 352 H886" class="line"/>
  <g transform="translate(886 258)"><rect class="i" width="266" height="188" rx="9"/><text x="18" y="34" class="tag">1956–1961 OUTCOME</text><text x="18" y="72" class="t">Great Exhaustion</text><text x="18" y="104" class="d">shortages and hardened lines</text><text x="18" y="136" class="t">Colombo System</text><text x="18" y="164" class="d">plural armistices, no unification</text></g>
  <text x="50" y="635" class="s">The umbrella period includes the Delhi Campaign, Burmese disruption, southern client defense, western arms traffic, and many local wars.</text>
</svg>
