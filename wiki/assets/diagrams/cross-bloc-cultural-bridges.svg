<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cross-bloc cultural bridges by 1985</title>
  <desc id="desc">A network linking the American, Commonwealth, German, Latin, and Japanese media systems through performers, language, co-productions, and distribution.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#73b7c7"/></marker></defs>
  <rect width="1200" height="760" fill="#0b1118"/>
  <text x="600" y="55" fill="#f4e4c5" font-family="Georgia,serif" font-size="35" text-anchor="middle">CROSS-BLOC CULTURAL BRIDGES</text>
  <text x="600" y="88" fill="#9eb2bd" font-family="Consolas,monospace" font-size="16" text-anchor="middle">LANGUAGE · CO-PRODUCTION · STAR IMAGE · HOME VIDEO</text>
  <g stroke="#73b7c7" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".85">
    <path d="M345 235 C450 175 750 175 855 235"/><path d="M345 280 C470 330 730 330 855 280"/>
    <path d="M320 305 C380 430 475 490 535 535"/><path d="M880 305 C820 430 725 490 665 535"/>
    <path d="M535 580 C440 615 330 560 285 455"/><path d="M665 580 C760 615 870 560 915 455"/>
    <path d="M310 430 C440 395 760 395 890 430"/><path d="M600 520 C600 430 600 350 600 305"/>
  </g>
  <g font-family="Consolas,monospace" text-anchor="middle">
    <g transform="translate(120 175)"><rect width="270" height="130" rx="12" fill="#17232c" stroke="#d66161" stroke-width="3"/><text x="135" y="38" fill="#fff" font-size="22" font-weight="700">UNITED STATES</text><text x="135" y="70" fill="#c4d5dc" font-size="14">largest commercial reach</text><text x="135" y="95" fill="#c4d5dc" font-size="14">Hollywood · music · home video</text></g>
    <g transform="translate(810 175)"><rect width="270" height="130" rx="12" fill="#17232c" stroke="#6b9ed6" stroke-width="3"/><text x="135" y="38" fill="#fff" font-size="22" font-weight="700">COMMONWEALTH</text><text x="135" y="70" fill="#c4d5dc" font-size="14">English-language bridge</text><text x="135" y="95" fill="#c4d5dc" font-size="14">Beatles · Bond · Connery</text></g>
    <g transform="translate(55 380)"><rect width="285" height="130" rx="12" fill="#17232c" stroke="#b88458" stroke-width="3"/><text x="142" y="38" fill="#fff" font-size="22" font-weight="700">GERMAN SPHERE</text><text x="142" y="70" fill="#c4d5dc" font-size="14">managed prestige and spectacle</text><text x="142" y="95" fill="#c4d5dc" font-size="14">technical film · action stars</text></g>
    <g transform="translate(860 380)"><rect width="285" height="130" rx="12" fill="#17232c" stroke="#d8b64f" stroke-width="3"/><text x="142" y="38" fill="#fff" font-size="22" font-weight="700">JAPANESE SPHERE</text><text x="142" y="70" fill="#c4d5dc" font-size="14">protected imperial market</text><text x="142" y="95" fill="#c4d5dc" font-size="14">Mifune · Sakamoto · genres</text></g>
    <g transform="translate(465 535)"><rect width="270" height="130" rx="12" fill="#17232c" stroke="#b771b7" stroke-width="3"/><text x="135" y="38" fill="#fff" font-size="22" font-weight="700">LATIN BLOC</text><text x="135" y="70" fill="#c4d5dc" font-size="14">glamour and diaspora</text><text x="135" y="95" fill="#c4d5dc" font-size="14">Rome · Madrid · Toulouse</text></g>
    <g transform="translate(470 175)"><rect width="260" height="130" rx="12" fill="#211d2a" stroke="#8d73c6" stroke-width="3"/><text x="130" y="38" fill="#fff" font-size="21" font-weight="700">GLOBAL BRIDGE STAR</text><text x="130" y="70" fill="#ddd0ed" font-size="14">voice, face, body, or persona</text><text x="130" y="95" fill="#ddd0ed" font-size="14">recognizable beyond translation</text></g>
  </g>
  <text x="600" y="710" fill="#f4e4c5" font-family="Georgia,serif" font-size="21" text-anchor="middle">Foreign fame does not erase borders; it makes every border crossing politically visible.</text>
  <text x="600" y="739" fill="#9eb2bd" font-family="Consolas,monospace" font-size="13" text-anchor="middle">COMMERCIAL APPEARANCE ≠ RESIDENCE ≠ POLITICAL SPEECH ≠ BROADCAST ACCESS</text>
</svg>
