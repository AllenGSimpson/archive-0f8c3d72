<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">British and Commonwealth artillery, 1965 to 1985</title><desc id="desc">Timeline comparing Abbot, L118 Light Gun, Bishop II, and Commonwealth L45.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#151c27"/><stop offset="1" stop-color="#34414b"/></linearGradient><style>.h{font-family:Georgia,serif;fill:#f8f1dd}.s{font-family:Arial,sans-serif;fill:#d6dee5}.y{font:700 27px Arial,sans-serif;fill:#e0bd6c}.n{font:700 30px Georgia,serif;fill:#fff}.d{font:19px Arial,sans-serif;fill:#dbe4ea}.box{fill:#21303d;stroke:#9fb4c2;stroke-width:2}.line{stroke:#d0ab5f;stroke-width:7}</style></defs><rect width="1600" height="900" fill="url(#b)"/><text x="70" y="88" class="h" font-size="50" font-weight="700">British and Commonwealth artillery</text><text x="72" y="130" class="s" font-size="22">Four complementary field-artillery roles · 1965–1985</text><path class="line" d="M160 245H1440"/><g><circle cx="260" cy="245" r="12" fill="#e0bd6c"/><circle cx="620" cy="245" r="12" fill="#e0bd6c"/><circle cx="980" cy="245" r="12" fill="#e0bd6c"/><circle cx="1340" cy="245" r="12" fill="#e0bd6c"/></g><g><text x="220" y="208" class="y">1965</text><text x="580" y="208" class="y">1974</text><text x="940" y="208" class="y">1977</text><text x="1300" y="208" class="y">1979</text></g><g><rect class="box" x="90" y="320" width="340" height="260" rx="14"/><text x="125" y="375" class="n">FV433 Abbot</text><text x="125" y="420" class="d">105 mm L13 L/35</text><text x="125" y="454" class="d">16.6 t · 17.4 km</text><text x="125" y="510" class="d">Light tracked divisional</text><text x="125" y="542" class="d">artillery</text><rect class="box" x="450" y="320" width="340" height="260" rx="14"/><text x="485" y="375" class="n">L118 Light Gun</text><text x="485" y="420" class="d">105 mm L19</text><text x="485" y="454" class="d">1.9 t · 17.2 km</text><text x="485" y="510" class="d">Air-portable and</text><text x="485" y="542" class="d">amphibious artillery</text><rect class="box" x="810" y="320" width="340" height="260" rx="14"/><text x="845" y="375" class="n">FV436 Bishop II</text><text x="845" y="420" class="d">155 mm L39</text><text x="845" y="454" class="d">32.0 t · 24.7 km</text><text x="845" y="510" class="d">Medium tracked</text><text x="845" y="542" class="d">divisional artillery</text><rect class="box" x="1170" y="320" width="340" height="260" rx="14"/><text x="1205" y="375" class="n">Commonwealth L45</text><text x="1205" y="420" class="d">155 mm L45</text><text x="1205" y="454" class="d">13.8 t · 30.0 km</text><text x="1205" y="510" class="d">South African-led</text><text x="1205" y="542" class="d">long-range towed gun</text></g><text x="90" y="690" class="s" font-size="22">Falklands baseline: 12 Abbot · 6 Bishop II</text><text x="90" y="738" class="s" font-size="21">Kuwait concentration: Abbot and newly introduced L118</text><text x="90" y="800" fill="#e0bd6c" font-family="Arial,sans-serif" font-size="21">AS-90-equivalent and wheeled G6 class remain outside 1985 service.</text></svg>
