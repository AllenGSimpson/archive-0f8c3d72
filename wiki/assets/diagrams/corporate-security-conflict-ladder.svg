<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Corporate security conflict ladder</title><desc id="desc">Six-stage sequence from a disputed concession through armed confrontation and diplomatic containment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141d"/><stop offset="1" stop-color="#28333c"/></linearGradient><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#d6b265"/></marker><style>.title{font:700 42px Georgia,serif;fill:#f6f1e7}.sub{font:17px Arial,sans-serif;fill:#b9c8d0;letter-spacing:2px}.box{fill:#132735;stroke:#6d8794;stroke-width:3}.hot{fill:#382424;stroke:#d46d68;stroke-width:3}.cool{fill:#263321;stroke:#8eaf6c;stroke-width:3}.num{font:700 19px Arial,sans-serif;fill:#e0bd6f}.head{font:700 20px Arial,sans-serif;fill:#fff}.copy{font:17px Arial,sans-serif;fill:#d4dee3}.arrow{stroke:#d6b265;stroke-width:5;marker-end:url(#arrow)}.foot{font:18px Arial,sans-serif;fill:#d8cba5}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="65" text-anchor="middle" class="title">CORPORATE SECURITY CONFLICT LADDER</text><text x="800" y="102" text-anchor="middle" class="sub">PRIVATE VIOLENCE · PUBLIC DENIAL · INTERSTATE CONTAINMENT</text>
  <g transform="translate(50 190)"><rect width="220" height="340" rx="22" class="box"/><text x="25" y="43" class="num">01</text><text x="25" y="82" class="head">DISPUTED RIGHT</text><text x="25" y="130" class="copy">Concession, road,</text><text x="25" y="158" class="copy">mine, port or site</text><text x="25" y="210" class="copy">Competing contracts</text><text x="25" y="238" class="copy">and jurisdictions</text></g><line x1="280" y1="360" x2="305" y2="360" class="arrow"/>
  <g transform="translate(315 190)"><rect width="220" height="340" rx="22" class="box"/><text x="25" y="43" class="num">02</text><text x="25" y="82" class="head">HARASSMENT</text><text x="25" y="130" class="copy">Delays, seizure,</text><text x="25" y="158" class="copy">roadblocks, sabotage</text><text x="25" y="210" class="copy">Local auxiliaries</text><text x="25" y="238" class="copy">enter the dispute</text></g><line x1="545" y1="360" x2="570" y2="360" class="arrow"/>
  <g transform="translate(580 190)"><rect width="220" height="340" rx="22" class="box"/><text x="25" y="43" class="num">03</text><text x="25" y="82" class="head">ARMED GUARDS</text><text x="25" y="130" class="copy">Company security</text><text x="25" y="158" class="copy">reinforces the site</text><text x="25" y="210" class="copy">Rules of force</text><text x="25" y="238" class="copy">do not match</text></g><line x1="810" y1="360" x2="835" y2="360" class="arrow"/>
  <g transform="translate(845 190)"><rect width="220" height="340" rx="22" class="hot"/><text x="25" y="43" class="num">04</text><text x="25" y="82" class="head">SHOOTING</text><text x="25" y="130" class="copy">Brief confrontation</text><text x="25" y="158" class="copy">and occasional deaths</text><text x="25" y="210" class="copy">Diplomatic escalation</text><text x="25" y="238" class="copy">risk appears</text></g><line x1="1075" y1="360" x2="1100" y2="360" class="arrow"/>
  <g transform="translate(1110 190)"><rect width="220" height="340" rx="22" class="box"/><text x="25" y="43" class="num">05</text><text x="25" y="82" class="head">DENIAL</text><text x="25" y="130" class="copy">Governments call</text><text x="25" y="158" class="copy">actors private</text><text x="25" y="210" class="copy">Host state opens</text><text x="25" y="238" class="copy">an investigation</text></g><line x1="1340" y1="360" x2="1365" y2="360" class="arrow"/>
  <g transform="translate(1375 190)"><rect width="175" height="340" rx="22" class="cool"/><text x="22" y="43" class="num">06</text><text x="22" y="82" class="head">CONTAIN</text><text x="22" y="130" class="copy">Withdrawal</text><text x="22" y="158" class="copy">Compensation</text><text x="22" y="186" class="copy">Arbitration</text><text x="22" y="238" class="copy">No national</text><text x="22" y="266" class="copy">war aim</text></g>
  <rect x="250" y="620" width="1100" height="105" rx="24" fill="#30281d" stroke="#d6b265" stroke-width="3"/><text x="800" y="660" text-anchor="middle" class="head">THE USEFUL FICTION</text><text x="800" y="697" text-anchor="middle" class="foot">Ministries knew about the operation, but no state authorized the confrontation</text>
  <text x="800" y="810" text-anchor="middle" class="foot">American companies are private when responsibility is assigned and American when rights are claimed</text>
</svg>
