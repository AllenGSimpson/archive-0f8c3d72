<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Japanese imperial corporate house network</title><desc id="desc">Network diagram showing the components of a mature Japanese imperial corporate house.</desc>
  <rect width="1200" height="675" fill="#101413"/><rect x="24" y="24" width="1152" height="627" rx="18" fill="#171d1b" stroke="#9e7d35" stroke-width="2"/>
  <text x="60" y="72" fill="#f1ead8" font-family="Georgia,serif" font-size="31" font-weight="700">An imperial corporate house</text>
  <text x="60" y="103" fill="#b9b5a8" font-family="Arial,sans-serif" font-size="15">The zaibatsu survives as a bank-centered federation of finance, trade, industry, research, and overseas concessions.</text>
  <g stroke="#8e773d" stroke-width="3" fill="none"><path d="M600 335L250 190M600 335L600 170M600 335L950 190M600 335L240 470M600 335L600 525M600 335L960 470"/></g>
  <circle cx="600" cy="335" r="108" fill="#5e2024" stroke="#d9b55b" stroke-width="3"/><text x="600" y="318" text-anchor="middle" fill="#fff4d8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">IMPERIAL</text><text x="600" y="349" text-anchor="middle" fill="#ffffff" font-family="Georgia,serif" font-size="24" font-weight="700">Corporate House</text><text x="600" y="375" text-anchor="middle" fill="#f2d79c" font-family="Arial,sans-serif" font-size="13">family prestige · managers · ministry liaison</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="132" width="320" height="104" rx="14" fill="#243a45" stroke="#7192a2"/><text x="250" y="168" text-anchor="middle" fill="#dcecf3" font-size="18" font-weight="700">Principal bank and insurer</text><text x="250" y="197" text-anchor="middle" fill="#b9cbd3" font-size="13">credit · guarantees · reserves · risk</text>
    <rect x="440" y="118" width="320" height="104" rx="14" fill="#25443b" stroke="#6aa68e"/><text x="600" y="154" text-anchor="middle" fill="#e2f4ec" font-size="18" font-weight="700">General trading company</text><text x="600" y="183" text-anchor="middle" fill="#bed9ce" font-size="13">contracts · shipping · information · exchange</text>
    <rect x="790" y="132" width="320" height="104" rx="14" fill="#243a45" stroke="#7192a2"/><text x="950" y="168" text-anchor="middle" fill="#dcecf3" font-size="18" font-weight="700">Shipping and logistics</text><text x="950" y="197" text-anchor="middle" fill="#b9cbd3" font-size="13">fleets · ports · warehouses · schedules</text>
    <rect x="80" y="432" width="320" height="104" rx="14" fill="#42361e" stroke="#b89a52"/><text x="240" y="468" text-anchor="middle" fill="#f3e6bd" font-size="18" font-weight="700">Heavy and consumer industry</text><text x="240" y="497" text-anchor="middle" fill="#dbc996" font-size="13">yards · machinery · chemicals · goods</text>
    <rect x="440" y="486" width="320" height="104" rx="14" fill="#42361e" stroke="#b89a52"/><text x="600" y="522" text-anchor="middle" fill="#f3e6bd" font-size="18" font-weight="700">Research and technical schools</text><text x="600" y="551" text-anchor="middle" fill="#dbc996" font-size="13">laboratories · standards · trained cadres</text>
    <rect x="800" y="432" width="320" height="104" rx="14" fill="#25443b" stroke="#6aa68e"/><text x="960" y="468" text-anchor="middle" fill="#e2f4ec" font-size="18" font-weight="700">Overseas subsidiaries</text><text x="960" y="497" text-anchor="middle" fill="#bed9ce" font-size="13">concessions · local partners · company towns</text>
  </g>
  <text x="600" y="630" text-anchor="middle" fill="#aaa69a" font-family="Arial,sans-serif" font-size="13">Tokyo preserves several rival giants and selected rising enterprises rather than dissolving the houses or permitting one monopoly.</text>
</svg>
