<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Armed Concert escalation ladder</title><desc id="desc">Six steps rise from normal competition through political coercion, forward readiness, peripheral confrontation, limited great-power war, and general war, with multiple exit arrows descending.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1c28"/><stop offset="1" stop-color="#070c12"/></linearGradient><linearGradient id="step" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173743"/><stop offset="1" stop-color="#2b3440"/></linearGradient><style>.title{font:700 31px Georgia,serif;fill:#f5eee4}.sub{font:15px system-ui,sans-serif;fill:#aebdca}.roman{font:700 30px Georgia,serif;fill:#edc35b}.name{font:700 18px system-ui,sans-serif;fill:#f1ece3}.detail{font:13px system-ui,sans-serif;fill:#b9c6d0}.step{fill:url(#step);stroke:#527084;stroke-width:1.5}.exit{fill:none;stroke:#73c9c9;stroke-width:3;stroke-dasharray:8 6}.arrow{fill:#73c9c9}.warn{fill:#8f3f3d;stroke:#da7770;stroke-width:2}.tag{font:700 13px system-ui,sans-serif;fill:#7fd1d0;letter-spacing:.09em}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="42" y="58" class="title">Great-power escalation grammar</text><text x="42" y="87" class="sub">A shared analytical ladder—not one universal readiness code</text>
  <g transform="translate(72 512)"><path d="M0 0 H245 V-70 H430 V-140 H615 V-210 H800 V-280 H985 V-350 H1080 V75 H0Z" fill="#0b141d" stroke="#283c4d"/>
    <g transform="translate(0 0)"><rect width="245" height="70" class="step"/><text x="18" y="31" class="roman">I</text><text x="58" y="27" class="name">Normal competition</text><text x="58" y="49" class="detail">trade · patrols · intelligence</text></g>
    <g transform="translate(245 -70)"><rect width="185" height="140" class="step"/><text x="18" y="38" class="roman">II</text><text x="18" y="70" class="name">Political coercion</text><text x="18" y="94" class="detail">embargoes · warnings</text><text x="18" y="115" class="detail">exercises · recalls</text></g>
    <g transform="translate(430 -140)"><rect width="185" height="210" class="step"/><text x="18" y="38" class="roman">III</text><text x="18" y="70" class="name">Forward readiness</text><text x="18" y="94" class="detail">fleets sortie</text><text x="18" y="115" class="detail">garrisons reinforce</text><text x="18" y="136" class="detail">spacecraft disperse</text></g>
    <g transform="translate(615 -210)"><rect width="185" height="280" class="step"/><text x="18" y="38" class="roman">IV</text><text x="18" y="70" class="name">Peripheral</text><text x="18" y="92" class="name">confrontation</text><text x="18" y="122" class="detail">blockades · seizures</text><text x="18" y="143" class="detail">proxy fighting</text><text x="18" y="164" class="detail">satellite interference</text></g>
    <g transform="translate(800 -280)"><rect width="185" height="350" class="step"/><text x="18" y="38" class="roman">V</text><text x="18" y="70" class="name">Limited great-</text><text x="18" y="92" class="name">power war</text><text x="18" y="122" class="detail">direct combat</text><text x="18" y="143" class="detail">geographic firebreaks</text><text x="18" y="164" class="detail">core homelands spared</text></g>
    <g transform="translate(985 -350)"><rect width="95" height="420" class="warn"/><text x="20" y="43" class="roman">VI</text><text transform="translate(42 205) rotate(-90)" text-anchor="middle" class="name">GENERAL WAR</text></g>
  </g>
  <path d="M1001 128 C920 111 851 130 809 187" class="exit"/><polygon points="805,196 807,177 821,189" class="arrow"/>
  <path d="M806 229 C712 197 628 221 576 292" class="exit"/><polygon points="570,300 573,281 587,294" class="arrow"/>
  <path d="M622 349 C513 314 403 342 341 418" class="exit"/><polygon points="334,426 338,407 352,420" class="arrow"/>
  <text x="772" y="116" class="tag">DIPLOMATIC EXIT</text><text x="532" y="207" class="tag">WITHDRAWAL · MEDIATION</text><text x="252" y="324" class="tag">COMPENSATION · NEW RULES</text>
  <text x="42" y="636" class="sub">The governing test at every rung: can the dispute stop here without creating a new general-war aim?</text>
</svg>
