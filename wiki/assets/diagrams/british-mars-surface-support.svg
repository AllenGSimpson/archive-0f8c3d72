<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">British Mars surface-support package</title>
  <desc id="desc">A diagram linking the pre-landed habitat, surface reactor, pressurized rover, scientific package, and communications chain at western Valles Marineris.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142735"/><stop offset="1" stop-color="#372c2a"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70473a"/><stop offset="0.55" stop-color="#9b6650"/><stop offset="1" stop-color="#4d3532"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <style>.label{font:700 20px Georgia,serif;fill:#f5efe5}.small{font:15px Arial,sans-serif;fill:#d7dde0}.line{stroke:#e5ba73;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 8}.unit{fill:#263943;stroke:#c8d6d9;stroke-width:3}.accent{fill:#d8a35c;stroke:#fff0cd;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <path d="M0 390 C190 345 330 365 475 322 C635 274 763 338 930 303 C1035 280 1120 296 1200 280 V600 H0Z" fill="url(#ground)"/>
  <path d="M0 462 C220 428 398 455 598 413 C810 369 1016 410 1200 366" fill="none" stroke="#c18769" stroke-width="3" opacity=".65"/>
  <text x="52" y="58" class="label" font-size="27">WESTERN VALLES MARINERIS · 1998</text>
  <text x="52" y="88" class="small">Compact Commonwealth surface support</text>
  <g filter="url(#shadow)">
    <g transform="translate(88 265)"><rect class="unit" width="260" height="125" rx="18"/><rect class="accent" x="23" y="33" width="76" height="58" rx="8"/><circle cx="221" cy="62" r="27" fill="#7297a5" stroke="#dcebed" stroke-width="3"/><text x="18" y="-18" class="label">SURFACE HABITAT</text><text x="18" y="151" class="small">Pressure · life support · stores · refuge</text></g>
    <g transform="translate(458 179)"><rect class="unit" width="218" height="122" rx="15"/><circle class="accent" cx="109" cy="61" r="39"/><path d="M109 29v64M77 61h64" stroke="#523a2d" stroke-width="9"/><text x="18" y="-18" class="label">REACTOR</text><text x="18" y="146" class="small">Continuous electrical supply</text></g>
    <g transform="translate(769 300)"><rect class="unit" width="285" height="84" rx="24"/><rect x="58" y="-29" width="135" height="48" rx="14" fill="#7297a5" stroke="#dcebed" stroke-width="3"/><circle cx="58" cy="91" r="25" fill="#1b252b" stroke="#d8a35c" stroke-width="7"/><circle cx="150" cy="91" r="25" fill="#1b252b" stroke="#d8a35c" stroke-width="7"/><circle cx="242" cy="91" r="25" fill="#1b252b" stroke="#d8a35c" stroke-width="7"/><text x="8" y="-52" class="label">PRESSURIZED ROVER</text><text x="8" y="139" class="small">One vehicle · field mobility · refuge</text></g>
    <g transform="translate(420 431)"><rect class="unit" width="265" height="89" rx="14"/><path d="M25 65l36-41 34 29 31-22 36 34" fill="none" stroke="#e5ba73" stroke-width="5"/><circle cx="211" cy="43" r="19" fill="#7297a5" stroke="#dcebed" stroke-width="3"/><text x="14" y="-16" class="label">SCIENTIFIC PACKAGE</text><text x="14" y="116" class="small">Geology · atmosphere · navigation</text></g>
    <g transform="translate(921 102)"><path d="M75 150V25M20 150h110M43 73h64M51 49h48" stroke="#dcebed" stroke-width="6"/><path d="M75 26L20 150M75 26l55 124" stroke="#7297a5" stroke-width="4"/><circle class="accent" cx="75" cy="20" r="11"/><text x="-22" y="180" class="label">COMMUNICATIONS</text><text x="-22" y="205" class="small">Surface relay · Mars orbit · Earth</text></g>
  </g>
  <path class="line" d="M348 327L458 260M676 258L904 314M546 301L544 431M685 469L837 385M1055 279L1014 246"/>
  <g transform="translate(72 528)"><rect width="1056" height="48" rx="12" fill="#18252c" opacity=".88"/><text x="22" y="31" class="small">Habitat and return capability were pre-landed; exact cargo order, ratings, dimensions, route, and site plan remain open.</text></g>
</svg>
