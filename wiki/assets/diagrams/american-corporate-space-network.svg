<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">American corporate space network</title>
  <desc id="desc">Diagram of Frontier Orbital Lines at the center of a network of carriers, lunar resource firms, habitat companies, communications and computing firms, and finance, insurance, media, and political sponsors.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071722"/><stop offset="1" stop-color="#213a4a"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f4f7f8}.sub{font:18px Arial,sans-serif;fill:#b6cad4;letter-spacing:2px}.node{fill:#112d3e;stroke:#67b9de;stroke-width:3}.core{fill:#22333e;stroke:#dfbe59;stroke-width:5}.head{font:700 25px Arial,sans-serif;fill:#fff}.tag{font:700 15px Arial,sans-serif;fill:#84d1f2;letter-spacing:1.2px}.copy{font:17px Arial,sans-serif;fill:#c9d7dd}.link{stroke:#8ca4af;stroke-width:4;fill:none}.gold{fill:#e6cb72}.foot{font:16px Arial,sans-serif;fill:#b9c9d0}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="64" text-anchor="middle" class="title">THE AMERICAN CORPORATE SPACE NETWORK</text><text x="800" y="102" text-anchor="middle" class="sub">SEPARATE OWNERSHIP · SHARED INTERFACES · FRONTIER AS MISSION INTEGRATOR</text>
  <path d="M800 470 L350 260 M800 470 L1250 260 M800 470 L300 720 M800 470 L1300 720 M800 470 L800 840" class="link"/>
  <g transform="translate(560 330)"><rect width="480" height="280" rx="42" class="core"/><text x="240" y="65" text-anchor="middle" class="head">FRONTIER ORBITAL LINES</text><text x="240" y="100" text-anchor="middle" class="tag gold">PRINCIPAL CARRIER AND MISSION INTEGRATOR</text><text x="35" y="148" class="copy">Orbital transport pays for the company</text><text x="35" y="182" class="copy">Lunar industry expands the market</text><text x="35" y="216" class="copy">Mars supplies the governing purpose</text><text x="35" y="250" class="copy">National Orbital Carrier charter from 1993</text></g>
  <g transform="translate(90 155)"><rect width="500" height="220" rx="24" class="node"/><text x="28" y="50" class="head">ORBITAL CARRIERS</text><text x="28" y="84" class="tag">CREW · CARGO · SERVICING · GOVERNMENT CONTRACTS</text><text x="28" y="130" class="copy">Frontier and nominal competitors operate</text><text x="28" y="162" class="copy">specialized fleets through shared pads, depots,</text><text x="28" y="194" class="copy">traffic systems, insurers, and interfaces.</text></g>
  <g transform="translate(1010 155)"><rect width="500" height="220" rx="24" class="node"/><text x="28" y="50" class="head">LUNAR RESOURCE FIRMS</text><text x="28" y="84" class="tag">ICE · OXYGEN · HYDROGEN · MATERIALS · DEPOTS</text><text x="28" y="130" class="copy">Mining and propellant companies supply</text><text x="28" y="162" class="copy">landers, stations, tankers, construction,</text><text x="28" y="194" class="copy">and the interplanetary transport market.</text></g>
  <g transform="translate(55 650)"><rect width="510" height="220" rx="24" class="node"/><text x="28" y="50" class="head">STATION &amp; HABITAT COMPANIES</text><text x="28" y="84" class="tag">LABS · HOUSING · CLINICS · HOTELS · INDUSTRY</text><text x="28" y="130" class="copy">Operators own destinations and modules.</text><text x="28" y="162" class="copy">Frontier transports residents without</text><text x="28" y="194" class="copy">necessarily employing or governing them.</text></g>
  <g transform="translate(1035 650)"><rect width="510" height="220" rx="24" class="node"/><text x="28" y="50" class="head">COMPUTING &amp; COMMUNICATIONS</text><text x="28" y="84" class="tag">RELAYS · NAVIGATION · SCHEDULING · SOFTWARE</text><text x="28" y="130" class="copy">Closed integrated systems coexist with</text><text x="28" y="162" class="copy">interoperability firms that connect vehicles,</text><text x="28" y="194" class="copy">companies, stations, and surface equipment.</text></g>
  <g transform="translate(520 775)"><rect width="560" height="165" rx="24" class="node"/><text x="280" y="48" text-anchor="middle" class="head">FINANCE, INSURANCE &amp; SPONSORSHIP</text><text x="280" y="82" text-anchor="middle" class="tag">BONDS · INDEMNITY · MEDIA · RESEARCH · POLITICAL ACCESS</text><text x="35" y="128" class="copy">Capital and public risk-sharing determine which missions become viable.</text></g>
  <text x="800" y="975" text-anchor="middle" class="foot">Federal government retains launch, safety, treaty, rescue, strategic-review, requisition, and jurisdictional powers while purchasing most civil execution as services.</text>
</svg>
