<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">South Atlantic armed mediation</title><desc id="d">American surveillance and military presence impose boundaries on Germany, Britain and Argentina while directing the war toward a negotiated finite settlement.</desc><rect width="1200" height="520" rx="24" fill="#081620"/><text x="600" y="55" text-anchor="middle" fill="#f3f5ee" font-family="Georgia,serif" font-size="32">SOUTH ATLANTIC ARMED MEDIATION</text><g font-family="Arial,sans-serif"><rect x="420" y="100" width="360" height="130" rx="65" fill="#153b50" stroke="#75bdd8" stroke-width="3"/><text x="600" y="150" text-anchor="middle" fill="#fff" font-size="23">UNITED STATES</text><text x="600" y="185" text-anchor="middle" fill="#d8eff7" font-size="18">monitor · warn · contain · mediate</text><g fill="#402c2b" stroke="#d78c7f" stroke-width="2"><rect x="65" y="300" width="295" height="125" rx="16"/><rect x="452" y="300" width="295" height="125" rx="16"/><rect x="840" y="300" width="295" height="125" rx="16"/></g><g fill="#ffeae5" text-anchor="middle"><text x="212" y="340" font-size="22">GERMANY</text><text x="212" y="375" font-size="17">no state forces</text><text x="212" y="401" font-size="17">no covert combat formations</text><text x="600" y="340" font-size="22">BRITAIN</text><text x="600" y="375" font-size="17">no general mainland war</text><text x="600" y="401" font-size="17">no regime change</text><text x="987" y="340" font-size="22">ARGENTINA</text><text x="987" y="375" font-size="17">no conquest as title</text><text x="987" y="401" font-size="17">no mass-effect weapons</text></g><path d="M515 225L250 292M600 230V290M685 225L950 292" stroke="#d4bd72" stroke-width="4"/><rect x="350" y="455" width="500" height="45" rx="22" fill="#2a3c2d" stroke="#78b486" stroke-width="2"/><text x="600" y="484" text-anchor="middle" fill="#eefff1" font-size="18">FINITE WAR → SELF-GOVERNMENT · DEMILITARIZATION · NEGOTIATION</text></g></svg>
