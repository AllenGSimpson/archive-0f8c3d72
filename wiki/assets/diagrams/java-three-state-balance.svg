<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Java's three-state balance</title><desc id="desc">Schematic division of Java among Sunda, Mataram, and East Java and Madura.</desc><rect width="1200" height="620" rx="32" fill="#10171d"/><text x="60" y="70" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">Java’s three-state balance</text><text x="60" y="108" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">Population, cultural authority, and maritime industry are deliberately separated</text><g font-family="Arial,sans-serif"><g transform="translate(65 170)"><rect width="330" height="280" rx="20" fill="#173d4a" stroke="#66b4c3"/><text x="28" y="50" fill="#9de0ea" font-size="27" font-weight="700">SUNDA</text><text x="28" y="92" fill="#fff" font-size="20">Capital · Bandung</text><text x="28" y="128" fill="#fff" font-size="20">Chartered port · Batavia</text><text x="28" y="176" fill="#a8bbc4" font-size="17">Western population</text><text x="28" y="207" fill="#a8bbc4" font-size="17">Textiles and plantations</text><text x="28" y="238" fill="#a8bbc4" font-size="17">Corporate-commercial port</text></g><g transform="translate(435 170)"><rect width="330" height="280" rx="20" fill="#3c3322" stroke="#d3aa52"/><text x="28" y="50" fill="#f1c86f" font-size="27" font-weight="700">MATARAM</text><text x="28" y="92" fill="#fff" font-size="20">Centers · Yogyakarta</text><text x="28" y="128" fill="#fff" font-size="20">and Surakarta</text><text x="28" y="176" fill="#a8bbc4" font-size="17">Royal courts</text><text x="28" y="207" fill="#a8bbc4" font-size="17">Classical culture and learning</text><text x="28" y="238" fill="#a8bbc4" font-size="17">No commanding seaport</text></g><g transform="translate(805 170)"><rect width="330" height="280" rx="20" fill="#19372b" stroke="#6ab58a"/><text x="28" y="50" fill="#91dbad" font-size="25" font-weight="700">EAST JAVA–MADURA</text><text x="28" y="92" fill="#fff" font-size="20">Capital · Surabaya</text><text x="28" y="128" fill="#fff" font-size="20">Madura · autonomous</text><text x="28" y="176" fill="#a8bbc4" font-size="17">Shipping and naval repair</text><text x="28" y="207" fill="#a8bbc4" font-size="17">Rail and manufacturing</text><text x="28" y="238" fill="#a8bbc4" font-size="17">Eastern-island gateway</text></g></g><path d="M395 310h40M765 310h40" stroke="#f2e7d1" stroke-width="5" stroke-dasharray="8 10"/><text x="600" y="525" text-anchor="middle" fill="#e3c678" font-family="Arial,sans-serif" font-size="19">No one government controls Java’s population, courtly legitimacy, and principal eastern port.</text><text x="60" y="578" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Conceptual arrangement · not a boundary map</text></svg>
