<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Protectorate Raj of Many Indias proposal</title>
  <desc id="desc">Eight families of Indian governments sit beneath four proposed Crown guarantees, which depend on an imperial commitment Britain rejected.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13232d"/><stop offset="1" stop-color="#080d12"/></linearGradient>
    <style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.state{fill:#1a2d39;stroke:#688594;stroke-width:2}.guar{fill:#2a3329;stroke:#809b72;stroke-width:2}.cost{fill:#38272a;stroke:#a86a6d;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf77;letter-spacing:.08em}.t{font:700 17px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.line{stroke:#cfa755;stroke-width:3;fill:none}.dash{stroke:#a66c70;stroke-width:3;stroke-dasharray:9 7;fill:none}</style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="50" y="62" class="h">Protectorate Raj of Many Indias, c. 1957-1960</text><text x="50" y="92" class="s">A plural constitutional settlement whose guarantees required a rejected imperial reconquest</text>
  <g transform="translate(50 140)"><rect class="state" width="435" height="382" rx="11"/><text x="22" y="38" class="tag">PROPOSED GOVERNMENTS</text><g class="t"><text x="25" y="90">Tamil India</text><text x="230" y="90">Maratha India</text><text x="25" y="145">Sikh India</text><text x="230" y="145">Muslim federations</text><text x="25" y="200">Rajput states</text><text x="230" y="200">Bengal states</text><text x="25" y="255">Southern monarchies</text><text x="230" y="255">Frontier territories</text></g><text x="22" y="320" class="d">No single Indian capital would be sovereign</text><text x="22" y="345" class="d">over all the others.</text></g>
  <path class="line" d="M485 330 H570"/>
  <g transform="translate(570 140)"><rect class="guar" width="265" height="382" rx="11"/><text x="20" y="38" class="tag">CROWN GUARANTEES</text><text x="20" y="100" class="t">Common defense</text><text x="20" y="158" class="t">Currency system</text><text x="20" y="216" class="t">Major railways</text><text x="20" y="274" class="t">Interstate arbitration</text><text x="20" y="326" class="d">Many governments kept at peace,</text><text x="20" y="350" class="d">not one India restored.</text></g>
  <path class="dash" d="M835 330 H900"/>
  <g transform="translate(900 140)"><rect class="cost" width="250" height="382" rx="11"/><text x="18" y="38" class="tag">IMPLEMENTATION COST</text><text x="18" y="91" class="t">Hundreds of thousands</text><text x="18" y="116" class="d">of troops</text><text x="18" y="165" class="t">Immense reconstruction</text><text x="18" y="190" class="d">and railway occupation</text><text x="18" y="239" class="t">Religious borders</text><text x="18" y="264" class="d">settled or enforced</text><text x="18" y="313" class="t">War against rejectors</text><text x="18" y="345" class="d">Britain was not willing.</text></g>
  <g transform="translate(300 568)"><rect x="0" y="0" width="600" height="62" rx="8" fill="#252b2f" stroke="#7c8a91" stroke-width="2"/><text x="300" y="27" text-anchor="middle" class="tag">ADOPTED ALTERNATIVE</text><text x="300" y="50" text-anchor="middle" class="d">The Colombo System regulated practical movement without a common sovereign structure.</text></g>
</svg>
