<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Colombian constitutional-security order</title><desc id="desc">The National Compact, American-supported security institutions, autonomous armed economies, and strategic corridors of Colombia.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111d28"/><stop offset="1" stop-color="#28343a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#c8d0ce"/></marker><style>.h{font:700 28px Georgia,serif;fill:#f3ead6}.t{font:700 19px Georgia,serif;fill:#f3ead6}.k{font:700 12px Arial,sans-serif;letter-spacing:1.5px;fill:#afbfbc}.p{font:14px Arial,sans-serif;fill:#d1d7d5}.b{stroke:#748784;stroke-width:2;filter:url(#s)}.l{stroke:#c8d0ce;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" fill="url(#bg)"/><text class="h" x="600" y="45" text-anchor="middle">Colombian constitutional-security order</text><rect class="b" x="405" y="78" width="390" height="110" rx="14" fill="#62582e"/><text class="k" x="600" y="108" text-anchor="middle">CIVILIAN NATIONAL SETTLEMENT</text><text class="t" x="600" y="141" text-anchor="middle">National Compact</text><text class="p" x="600" y="168" text-anchor="middle">Elections · Congress · courts · elite power-sharing</text><rect class="b" x="65" y="235" width="310" height="135" rx="14" fill="#3a5169"/><text class="k" x="220" y="265" text-anchor="middle">STATE SECURITY APPARATUS</text><text class="t" x="220" y="298" text-anchor="middle">Emergency institutions</text><text class="p" x="220" y="326" text-anchor="middle">Army · police · aviation · rivers · signals</text><text class="p" x="220" y="350" text-anchor="middle">American advisers and equipment</text><rect class="b" x="445" y="235" width="310" height="135" rx="14" fill="#3d604b"/><text class="k" x="600" y="265" text-anchor="middle">STRATEGIC STATE GEOGRAPHY</text><text class="t" x="600" y="298" text-anchor="middle">Cities and corridors</text><text class="p" x="600" y="326" text-anchor="middle">Caribbean · Panama approaches · petroleum</text><text class="p" x="600" y="350" text-anchor="middle">Buenaventura · roads · communications</text><rect class="b" x="825" y="235" width="310" height="135" rx="14" fill="#633f45"/><text class="k" x="980" y="265" text-anchor="middle">CONFLICT OUTSIDE THE COMPACT</text><text class="t" x="980" y="298" text-anchor="middle">Autonomous war economies</text><text class="p" x="980" y="326" text-anchor="middle">Smuggling · kidnapping · mining · narcotics</text><text class="p" x="980" y="350" text-anchor="middle">Regional protection and weak administration</text><path class="l" d="M515 188L300 225"/><path class="l" d="M600 188V225"/><path class="l" d="M685 188L900 225"/><path class="l" d="M375 302H435"/><path class="l" d="M755 302H815"/><text class="p" x="600" y="440" text-anchor="middle">Constitutional government persists; the security emergency and rural war persist with it.</text></svg>
