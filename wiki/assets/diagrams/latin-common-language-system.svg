<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Latin Community common-language system</title>
  <desc id="desc">Three layers show symbolic Latin, authentic legal Latin, and technical interface Latin above national-language implementation in four member states.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241c20"/><stop offset="1" stop-color="#08131b"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8c6132"/><stop offset="1" stop-color="#4f2e28"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".4"/></filter><style>.title{font:700 30px Georgia,serif;fill:#f8f0e5}.sub{font:15px system-ui,sans-serif;fill:#c4b8ad}.layer{fill:#151d25;stroke:#766b65;stroke-width:1.5}.top{fill:url(#gold);stroke:#edc78d;stroke-width:2}.head{font:700 18px system-ui,sans-serif;fill:#fbf3e9}.text{font:14px system-ui,sans-serif;fill:#c8c4c1}.tag{font:700 12px system-ui,sans-serif;fill:#efbf78;letter-spacing:.08em}.line{stroke:#d5a65f;stroke-width:2.5}.nation{fill:#0f1820;stroke:#706863;stroke-width:1.4}.footer{font:14px system-ui,sans-serif;fill:#bcb4ae}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(42 38)"><text class="title">One common text, four systems of implementation</text><text y="31" class="sub">Latin supplies shared authority and interfaces while national languages remain the medium of ordinary government and work</text></g>
  <g transform="translate(126 122)" filter="url(#shadow)"><rect class="top" width="948" height="96" rx="17"/><text class="tag" x="28" y="30">SYMBOLIC AND INSTITUTIONAL</text><text class="head" x="28" y="61">Seals · names · currency · treaties · spacecraft · public ceremony</text></g>
  <g transform="translate(126 244)" filter="url(#shadow)"><rect class="layer" width="948" height="96" rx="17"/><text class="tag" x="28" y="30">AUTHENTIC LEGAL LATIN</text><text class="head" x="28" y="61">Joint original text · national translations · Latin controls disputes</text></g>
  <g transform="translate(126 366)" filter="url(#shadow)"><rect class="layer" width="948" height="96" rx="17"/><text class="tag" x="28" y="30">TECHNICAL INTERFACE LATIN</text><text class="head" x="28" y="61">Standards · contracts · telemetry · safety · certification · mission phraseology</text></g>
  <path class="line" d="M250 462V500M483 462V500M717 462V500M950 462V500"/>
  <g transform="translate(140 500)"><rect class="nation" width="220" height="82" rx="14"/><text class="head" x="20" y="34">Italy</text><text class="text" x="20" y="59">Italian domestic work</text></g>
  <g transform="translate(373 500)"><rect class="nation" width="220" height="82" rx="14"/><text class="head" x="20" y="34">Occitania</text><text class="text" x="20" y="59">Occitan and French use</text></g>
  <g transform="translate(607 500)"><rect class="nation" width="220" height="82" rx="14"/><text class="head" x="20" y="34">Spain</text><text class="text" x="20" y="59">Spanish domestic work</text></g>
  <g transform="translate(840 500)"><rect class="nation" width="220" height="82" rx="14"/><text class="head" x="20" y="34">Portugal</text><text class="text" x="20" y="59">Portuguese domestic work</text></g>
  <text x="600" y="630" text-anchor="middle" class="footer">Latin is not the bloc's vernacular. It is the language in which the bloc exists.</text>
</svg>
