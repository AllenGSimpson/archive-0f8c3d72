<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Verona Convention structure</title><desc id="desc">The 1985 convention creates consultation and restraint between the Einheitspakt and Latin Bloc while leaving rivalry and the Bulgarian question unresolved.</desc>
  <rect width="1200" height="520" rx="24" fill="#07151e"/>
  <text x="600" y="54" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">VERONA NON-AGGRESSION CONVENTION · 1985</text>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="125" width="300" height="270" rx="20" fill="#3a2a2d" stroke="#d47b7f" stroke-width="3"/><text x="205" y="170" text-anchor="middle" fill="#fff" font-size="23">EINHEITSPAKT</text><text x="205" y="215" text-anchor="middle" fill="#f2d6d8" font-size="17">German rail and trade rights</text><text x="205" y="245" text-anchor="middle" fill="#f2d6d8" font-size="17">reduced interference in Serbia</text><text x="205" y="290" text-anchor="middle" fill="#ffd89a" font-size="17">GERMAN INTERESTS</text>
    <rect x="845" y="125" width="300" height="270" rx="20" fill="#28383a" stroke="#79b8b9" stroke-width="3"/><text x="995" y="170" text-anchor="middle" fill="#fff" font-size="23">LATIN BLOC</text><text x="995" y="215" text-anchor="middle" fill="#d7eeee" font-size="17">Italian primacy in Serbia</text><text x="995" y="245" text-anchor="middle" fill="#d7eeee" font-size="17">French partition restraint</text><text x="995" y="290" text-anchor="middle" fill="#ffd89a" font-size="17">ITALIAN INTERESTS</text>
    <rect x="430" y="100" width="340" height="330" rx="22" fill="#29382e" stroke="#91bd82" stroke-width="4"/><text x="600" y="145" text-anchor="middle" fill="#fff" font-size="23">THE VERONA RULES</text><text x="600" y="195" text-anchor="middle" fill="#e1f2dd" font-size="17">no direct aggressive war</text><text x="600" y="230" text-anchor="middle" fill="#e1f2dd" font-size="17">notify major exercises</text><text x="600" y="265" text-anchor="middle" fill="#e1f2dd" font-size="17">emergency crisis consultation</text><text x="600" y="300" text-anchor="middle" fill="#e1f2dd" font-size="17">do not encourage client attacks</text><line x1="475" y1="330" x2="725" y2="330" stroke="#91bd82" stroke-width="2"/><text x="600" y="370" text-anchor="middle" fill="#ffd89a" font-size="17">BULGARIA UNRESOLVED</text><text x="600" y="402" text-anchor="middle" fill="#ffb8aa" font-size="16">detente, not alliance</text>
    <path d="M355 260H420" stroke="#d9c26f" stroke-width="5"/><path d="M780 260H845" stroke="#d9c26f" stroke-width="5"/>
    <text x="600" y="475" text-anchor="middle" fill="#cbe4ea" font-size="20">A procedure for managing rivalry, not a settlement of it</text>
  </g>
</svg>
