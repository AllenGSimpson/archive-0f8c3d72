<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Outer-planet exploration routes by 2010</title><desc id="desc">Schematic routes through Jupiter and Saturn toward Uranus and Neptune, distinguishing confirmed later-2000s arrivals from open long-duration destinations.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#18263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.h{font:700 28px Georgia,serif;fill:#f5f0e8}.t{font:16px Arial,sans-serif;fill:#d4dde7}.s{font:13px Arial,sans-serif;fill:#aebccb}.route{fill:none;stroke:#e4b663;stroke-width:4;stroke-dasharray:11 8}.open{fill:none;stroke:#8294ad;stroke-width:4;stroke-dasharray:7 10}.orbit{fill:none;stroke:#51657e;stroke-width:2}</style></defs>
  <rect width="1200" height="600" fill="url(#bg)"/><g fill="#dce8f5" opacity=".7"><circle cx="91" cy="98" r="2"/><circle cx="205" cy="172" r="1.5"/><circle cx="344" cy="70" r="2"/><circle cx="521" cy="132" r="1.5"/><circle cx="742" cy="64" r="2"/><circle cx="938" cy="124" r="1.5"/><circle cx="1107" cy="73" r="2"/><circle cx="1034" cy="510" r="1.5"/><circle cx="611" cy="532" r="2"/><circle cx="271" cy="506" r="1.5"/></g>
  <text x="54" y="60" class="h">OUTER-SYSTEM EXPLORATION · 2010</text><text x="54" y="89" class="s">Schematic route geometry; distances and planet sizes are not to scale</text>
  <path class="route" d="M104 330C224 250 315 262 407 309S602 368 690 286"/><path class="open" d="M690 286C803 205 871 253 940 327S1044 401 1110 309"/>
  <g transform="translate(85 330)"><circle r="26" fill="#d8b15d" filter="url(#glow)"/><text x="-34" y="55" class="t">INNER SYSTEM</text><text x="-30" y="78" class="s">Launch and tracking</text></g>
  <g transform="translate(405 309)"><circle class="orbit" r="76"/><circle r="48" fill="#c89b70"/><path d="M-45-12h90M-42 8h84M-34 27h68" stroke="#795946" stroke-width="6"/><circle cx="51" cy="-16" r="8" fill="#cbd2d8"/><text x="-45" y="95" class="h">JUPITER</text><text x="-72" y="121" class="t">Later-2000s arrival</text><text x="-65" y="145" class="s">First major outer destination</text></g>
  <g transform="translate(690 286)"><ellipse class="orbit" rx="95" ry="26" transform="rotate(-12)"/><circle r="40" fill="#d9c58d"/><path d="M-34-5h68M-28 13h56" stroke="#96845d" stroke-width="5"/><text x="-42" y="92" class="h">SATURN</text><text x="-70" y="118" class="t">Later-2000s arrival</text><text x="-67" y="142" class="s">Flyby; rare orbiter possible</text></g>
  <g transform="translate(940 327)"><circle class="orbit" r="60"/><circle r="34" fill="#85c7ca"/><path d="M0-60v120" stroke="#b9e3e5" stroke-width="3" transform="rotate(82)"/><text x="-52" y="86" class="h">URANUS</text><text x="-76" y="112" class="t">Arrival status open</text><text x="-84" y="136" class="s">Long-duration destination</text></g>
  <g transform="translate(1110 309)"><circle class="orbit" r="56"/><circle r="35" fill="#3f72c8"/><path d="M-25-7h50M-19 11h38" stroke="#264a90" stroke-width="5"/><text x="-75" y="87" class="h">NEPTUNE</text><text x="-77" y="113" class="t">Arrival status open</text><text x="-84" y="137" class="s">Long-duration destination</text></g>
  <g transform="translate(70 505)"><rect width="1060" height="56" rx="12" fill="#0d1925" stroke="#41536b"/><path d="M24 19h60" class="route"/><text x="98" y="25" class="t">Confirmed route to new-generation arrivals</text><path d="M515 19h60" class="open"/><text x="590" y="25" class="t">Planned or possible continuation; exact arrival remains open</text></g>
</svg>
