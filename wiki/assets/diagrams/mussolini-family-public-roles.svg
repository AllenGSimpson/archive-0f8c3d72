<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Public roles of the Mussolini family after victory</title>
  <desc id="desc">A family-role diagram centered on Benito Mussolini and showing Edda and Galeazzo Ciano, Vittorio, Bruno, Romano, and Anna Maria.</desc>
  <rect width="1200" height="650" fill="#11151b"/>
  <text x="600" y="62" text-anchor="middle" fill="#f2ead8" font-family="Georgia,serif" font-size="34">The Founder’s Household after Victory</text>
  <text x="600" y="96" text-anchor="middle" fill="#aeb9c7" font-family="Arial,sans-serif" font-size="17">Dynastic access produces several public roles, but no settled hereditary office</text>
  <g font-family="Arial,sans-serif">
    <rect x="422" y="130" width="356" height="94" rx="16" fill="#26221d" stroke="#d6ae63" stroke-width="3"/>
    <text x="600" y="170" text-anchor="middle" fill="#f0cf8c" font-size="25" font-weight="700">BENITO MUSSOLINI</text>
    <text x="600" y="200" text-anchor="middle" fill="#e7edf2" font-size="17">founder · sole Duce · source of access</text>
    <path d="M600 224 V270 M158 270 H1042" stroke="#6f7b88" stroke-width="3"/>

    <g transform="translate(44 270)"><path d="M114 0 V35" stroke="#6f7b88" stroke-width="3"/><rect y="35" width="228" height="190" rx="14" fill="#202b36" stroke="#d6ae63" stroke-width="2"/><text x="114" y="72" text-anchor="middle" fill="#f0cf8c" font-size="22" font-weight="700">EDDA &amp; CIANO</text><text x="114" y="106" text-anchor="middle" fill="#e7edf2" font-size="16">family diplomacy</text><text x="114" y="134" text-anchor="middle" fill="#e7edf2" font-size="16">court faction</text><text x="114" y="162" text-anchor="middle" fill="#e7edf2" font-size="16">Latin disengagement</text><text x="114" y="198" text-anchor="middle" fill="#b9c3cd" font-size="14">Most competent rival</text></g>
    <g transform="translate(338 270)"><path d="M114 0 V35" stroke="#6f7b88" stroke-width="3"/><rect y="35" width="228" height="190" rx="14" fill="#202b36" stroke="#6bc7d9" stroke-width="2"/><text x="114" y="72" text-anchor="middle" fill="#9fe3ef" font-size="22" font-weight="700">VITTORIO</text><text x="114" y="106" text-anchor="middle" fill="#e7edf2" font-size="16">cinema and newsreels</text><text x="114" y="134" text-anchor="middle" fill="#e7edf2" font-size="16">Grand Council seat</text><text x="114" y="162" text-anchor="middle" fill="#e7edf2" font-size="16">founder’s memory</text><text x="114" y="198" text-anchor="middle" fill="#b9c3cd" font-size="14">Unsuccessful heir</text></g>
    <g transform="translate(632 270)"><path d="M114 0 V35" stroke="#6f7b88" stroke-width="3"/><rect y="35" width="228" height="190" rx="14" fill="#202b36" stroke="#b16464" stroke-width="2"/><text x="114" y="72" text-anchor="middle" fill="#db9b9b" font-size="22" font-weight="700">BRUNO</text><text x="114" y="106" text-anchor="middle" fill="#e7edf2" font-size="16">aviation martyr</text><text x="114" y="134" text-anchor="middle" fill="#e7edf2" font-size="16">academies and awards</text><text x="114" y="162" text-anchor="middle" fill="#e7edf2" font-size="16">untested ideal son</text><text x="114" y="198" text-anchor="middle" fill="#b9c3cd" font-size="14">Dead before divergence</text></g>
    <g transform="translate(926 270)"><path d="M114 0 V35" stroke="#6f7b88" stroke-width="3"/><rect y="35" width="228" height="190" rx="14" fill="#202b36" stroke="#8ca977" stroke-width="2"/><text x="114" y="72" text-anchor="middle" fill="#bad3a4" font-size="22" font-weight="700">ROMANO</text><text x="114" y="106" text-anchor="middle" fill="#e7edf2" font-size="16">jazz and broadcasting</text><text x="114" y="134" text-anchor="middle" fill="#e7edf2" font-size="16">film and composition</text><text x="114" y="162" text-anchor="middle" fill="#e7edf2" font-size="16">cultural diplomacy</text><text x="114" y="198" text-anchor="middle" fill="#b9c3cd" font-size="14">No political claim</text></g>
    <rect x="422" y="548" width="356" height="62" rx="12" fill="#171d25" stroke="#788696"/><text x="600" y="575" text-anchor="middle" fill="#e7edf2" font-size="17">Anna Maria · hospitals, maternal health, relief</text><text x="600" y="598" text-anchor="middle" fill="#aeb9c7" font-size="14">The household’s least political public role</text>
  </g>
</svg>
