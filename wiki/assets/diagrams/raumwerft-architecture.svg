<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Functional architecture of the Raumwerft</title><desc id="desc">A diagram of the distributed German orbital construction yard with structural berth, pressurized workshops, propulsion complex, separated reactor berth, spin test facility, and tug and cargo depot.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121a"/><stop offset="1" stop-color="#1c2930"/></linearGradient><linearGradient id="yard" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#213640"/><stop offset="1" stop-color="#12242d"/></linearGradient><style>.title{font:700 50px Arial,sans-serif;fill:#e8f0f3}.sub{font:22px Arial,sans-serif;fill:#93aab4;letter-spacing:3px}.box{fill:url(#yard);stroke:#afc2ca;stroke-width:3}.haz{fill:#32221d;stroke:#e08363;stroke-width:3}.head{font:700 23px Arial,sans-serif;fill:#f3f6f7}.copy{font:18px Arial,sans-serif;fill:#a9bdc5}.line{stroke:#6c8994;stroke-width:7}.dash{stroke:#d0dde1;stroke-width:3;stroke-dasharray:12 12}.tag{font:700 18px Arial,sans-serif;fill:#71cbe3}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="90" y="85" class="title">RAUMWERFT</text><text x="92" y="127" class="sub">INTERPLANETARY CONSTRUCTION YARD · LATE 1980s</text>
  <rect x="440" y="205" width="720" height="540" rx="32" fill="#0d1c23" stroke="#d9e2e5" stroke-width="5"/><text x="800" y="255" text-anchor="middle" class="head">OPEN STRUCTURAL BERTH</text><text x="800" y="287" text-anchor="middle" class="copy">complete-vessel alignment · cranes · manipulators · fastening</text>
  <path d="M520 465H1080M610 365v200M720 335v260M880 335v260M990 365v200" class="line"/><path d="M535 465H1065" class="dash"/>
  <g transform="translate(605 435)"><rect width="390" height="60" rx="30" fill="#263b45" stroke="#c7d4d8" stroke-width="3"/><circle cx="75" cy="30" r="46" fill="#172a33" stroke="#75a2b2" stroke-width="6"/><circle cx="315" cy="30" r="46" fill="#172a33" stroke="#75a2b2" stroke-width="6"/><rect x="165" y="-20" width="60" height="100" fill="#334e59"/></g>
  <text x="800" y="655" text-anchor="middle" class="tag">MARSPLAN 92 ASSEMBLY AXIS</text>
  <rect x="85" y="230" width="285" height="155" rx="20" class="box"/><text x="228" y="275" text-anchor="middle" class="head">PRESSURIZED SHOPS</text><text x="228" y="312" text-anchor="middle" class="copy">avionics · seals · pumps</text><text x="228" y="341" text-anchor="middle" class="copy">guidance · clean assembly</text><path d="M370 310H440" class="line"/>
  <rect x="85" y="470" width="285" height="155" rx="20" class="box"/><text x="228" y="515" text-anchor="middle" class="head">PROPULSION COMPLEX</text><text x="228" y="552" text-anchor="middle" class="copy">engines · plumbing · tanks</text><text x="228" y="581" text-anchor="middle" class="copy">non-destructive testing</text><path d="M370 550H440" class="line"/>
  <rect x="1230" y="230" width="285" height="155" rx="20" class="box"/><text x="1372" y="275" text-anchor="middle" class="head">SPIN TEST</text><text x="1372" y="312" text-anchor="middle" class="copy">balance · bearings</text><text x="1372" y="341" text-anchor="middle" class="copy">rotating habitation</text><path d="M1160 310H1230" class="line"/>
  <rect x="1230" y="470" width="285" height="155" rx="20" class="box"/><text x="1372" y="515" text-anchor="middle" class="head">TUG &amp; CARGO DEPOT</text><text x="1372" y="552" text-anchor="middle" class="copy">arrival sorting · storage</text><text x="1372" y="581" text-anchor="middle" class="copy">orbital transfer</text><path d="M1160 550H1230" class="line"/>
  <rect x="535" y="820" width="530" height="125" rx="22" class="haz"/><text x="800" y="865" text-anchor="middle" class="head">SEPARATED REACTOR BERTH</text><text x="800" y="902" text-anchor="middle" class="copy">nuclear propulsion and power commissioning</text><path d="M800 745V820" stroke="#e08363" stroke-width="5" stroke-dasharray="12 12"/>
  <text x="90" y="940" class="copy">Attached to the Raumhafen · physically distributed around international habitation</text>
</svg>
