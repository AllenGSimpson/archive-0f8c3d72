<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Commonwealth Indian Ocean chain</title>
  <desc id="desc">A schematic route from South Africa through the Seychelles, Maldives, Ceylon, Christmas and Cocos Islands to Australia, with branches toward Aden, the Gulf, and Indian treaty ports.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2638"/><stop offset="1" stop-color="#153f51"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e9c46a"/></marker>
    <style>
      .label{font:700 22px system-ui,sans-serif;fill:#f4f0e5}.sub{font:500 15px system-ui,sans-serif;fill:#b9d4dc}.node{fill:#163f52;stroke:#f4f0e5;stroke-width:3}.realm{fill:#1d5b63}.protected{fill:#64572c}.territory{fill:#563f60}.route{fill:none;stroke:#e9c46a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);filter:url(#glow)}.branch{fill:none;stroke:#91bbc5;stroke-width:4;stroke-dasharray:10 10;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#sea)"/>
  <path d="M115 390 C235 330 295 285 380 300 S520 370 605 320 S750 260 815 325 S950 410 1085 350" class="route"/>
  <path d="M600 305 C575 210 520 145 460 105" class="branch"/>
  <path d="M660 305 C670 205 725 150 775 108" class="branch"/>
  <g transform="translate(115 390)"><circle r="52" class="node realm"/><text y="-4" text-anchor="middle" class="label">Cape</text><text y="21" text-anchor="middle" class="sub">South Africa</text></g>
  <g transform="translate(365 300)"><circle r="48" class="node territory"/><text y="-4" text-anchor="middle" class="label">Seychelles</text><text y="21" text-anchor="middle" class="sub">western relay</text></g>
  <g transform="translate(590 325)"><circle r="50" class="node protected"/><text y="-4" text-anchor="middle" class="label">Maldives</text><text y="21" text-anchor="middle" class="sub">protected chain</text></g>
  <g transform="translate(765 305)"><circle r="63" class="node realm"/><text y="-10" text-anchor="middle" class="label">Ceylon</text><text y="17" text-anchor="middle" class="sub">Colombo · Trincomalee</text><text y="38" text-anchor="middle" class="sub">fortress capital</text></g>
  <g transform="translate(940 390)"><circle r="55" class="node territory"/><text y="-13" text-anchor="middle" class="label">Christmas</text><text y="12" text-anchor="middle" class="label">+ Cocos</text><text y="34" text-anchor="middle" class="sub">eastern link</text></g>
  <g transform="translate(1090 350)"><circle r="54" class="node realm"/><text y="-4" text-anchor="middle" class="label">Australia</text><text y="21" text-anchor="middle" class="sub">continental anchor</text></g>
  <g transform="translate(440 92)"><rect x="-92" y="-33" width="184" height="66" rx="14" class="node"/><text y="-3" text-anchor="middle" class="label">Aden + Gulf</text><text y="20" text-anchor="middle" class="sub">northern branch</text></g>
  <g transform="translate(795 92)"><rect x="-128" y="-33" width="256" height="66" rx="14" class="node"/><text y="-3" text-anchor="middle" class="label">Indian treaty ports</text><text y="20" text-anchor="middle" class="sub">Bombay · Karachi · south</text></g>
  <g transform="translate(70 535)"><rect width="1060" height="58" rx="16" fill="#091d2a" stroke="#91bbc5"/><text x="530" y="25" text-anchor="middle" class="sub">One geography, several systems: merchant shipping · naval support · aviation · weather · rescue · signals · High Mast telemetry</text><text x="530" y="46" text-anchor="middle" class="sub">Schematic route only; distances and positions are not to scale.</text></g>
</svg>
