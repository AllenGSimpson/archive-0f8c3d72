<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Postwar Japanese armed-forces institutions</title>
  <desc id="desc">A diagram showing the Emperor above Cabinet and the Imperial Defense Council, which coordinate the Army, Navy, and several territorial forms of deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#182735"/></linearGradient>
    <linearGradient id="army" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d7655"/><stop offset="1" stop-color="#3e4937"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315c78"/><stop offset="1" stop-color="#203b52"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d6b86f"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f1eee6">
    <text x="60" y="66" font-size="30" font-weight="700">Postwar Japanese armed-forces order</text>
    <text x="60" y="96" font-size="16" fill="#aebdca">Supreme command, ordinary administration, separate services, and differentiated imperial geography</text>

    <g filter="url(#shadow)">
      <rect x="450" y="125" width="300" height="84" rx="18" fill="#7c2630" stroke="#d6b86f" stroke-width="2"/>
      <circle cx="492" cy="167" r="22" fill="#fff2d1"/><circle cx="492" cy="167" r="12" fill="#c6343e"/>
      <text x="530" y="158" font-size="21" font-weight="700">Emperor of Japan</text>
      <text x="530" y="184" font-size="14" fill="#f3d9d8">formal supreme command · sanction</text>
    </g>

    <path d="M600 209v47" stroke="#d6b86f" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="230" y="270" width="320" height="104" rx="18" fill="#3a4651" stroke="#71889b"/>
      <text x="262" y="305" font-size="21" font-weight="700">Cabinet and ministries</text>
      <text x="262" y="332" font-size="14" fill="#c6d0d8">budgets · law · appointments · diplomacy</text>
      <text x="262" y="355" font-size="14" fill="#c6d0d8">ordinary administration and economic control</text>
      <rect x="650" y="270" width="320" height="104" rx="18" fill="#51472f" stroke="#d6b86f"/>
      <text x="682" y="305" font-size="21" font-weight="700">Imperial Defense Council</text>
      <text x="682" y="332" font-size="14" fill="#e3d9bd">joint strategy · standing coordination</text>
      <text x="682" y="355" font-size="14" fill="#e3d9bd">Army, Navy, Cabinet, strategic establishment</text>
    </g>
    <path d="M550 322h100" stroke="#d6b86f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M390 374v53M810 374v53" stroke="#d6b86f" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="150" y="442" width="420" height="116" rx="20" fill="url(#army)" stroke="#9ba77a" stroke-width="2"/>
      <text x="184" y="480" font-size="23" font-weight="700">Imperial Japanese Army</text>
      <text x="184" y="509" font-size="15" fill="#e2e7d7">continental defense · garrisons · mobilization</text>
      <text x="184" y="534" font-size="15" fill="#e2e7d7">General Staff · Army Ministry · Army aviation</text>
      <rect x="630" y="442" width="420" height="116" rx="20" fill="url(#navy)" stroke="#6ea0bf" stroke-width="2"/>
      <text x="664" y="480" font-size="23" font-weight="700">Imperial Japanese Navy</text>
      <text x="664" y="509" font-size="15" fill="#dbe8ef">carriers · sea lanes · islands · submarines</text>
      <text x="664" y="534" font-size="15" fill="#dbe8ef">naval staff · ministry · fleet and naval aviation</text>
    </g>
    <path d="M570 500h60" stroke="#d6b86f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="489" text-anchor="middle" font-size="12" fill="#d6b86f">joint registers</text>
    <text x="600" y="522" text-anchor="middle" font-size="12" fill="#d6b86f">shared interfaces</text>

    <g font-size="14" text-anchor="middle">
      <rect x="90" y="618" width="230" height="58" rx="14" fill="#273542" stroke="#526779"/><text x="205" y="642" font-weight="700">Integral Japan</text><text x="205" y="662" fill="#b9c5cf">national service and reserve</text>
      <rect x="350" y="618" width="230" height="58" rx="14" fill="#273542" stroke="#526779"/><text x="465" y="642" font-weight="700">Direct possessions</text><text x="465" y="662" fill="#b9c5cf">garrisons and stations</text>
      <rect x="610" y="618" width="230" height="58" rx="14" fill="#273542" stroke="#526779"/><text x="725" y="642" font-weight="700">Associated states</text><text x="725" y="662" fill="#b9c5cf">national forces and missions</text>
      <rect x="870" y="618" width="230" height="58" rx="14" fill="#273542" stroke="#526779"/><text x="985" y="642" font-weight="700">External associates</text><text x="985" y="662" fill="#b9c5cf">guarantees and access</text>
    </g>
    <path d="M360 558v35H205v25M360 593h105v25M840 558v35H725v25M840 593h145v25" fill="none" stroke="#71889b" stroke-width="2"/>
  </g>
</svg>
