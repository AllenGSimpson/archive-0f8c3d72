<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brick Parliament material settlement</title><desc id="desc">Flow diagram from release and resettlement through the Brick Corps, shipping, arsenal, and health measures to the Contract Commonwealth.</desc>
  <rect width="1600" height="900" fill="#111a22"/><text x="90" y="92" fill="#f4ead8" font-family="Georgia,serif" font-size="54">The Brick Parliament's material settlement</text><text x="92" y="138" fill="#a7bac5" font-family="Arial,sans-serif" font-size="24">Work, ships, strategic capacity, and health security before constitutional redesign</text>
  <g font-family="Arial,sans-serif"><rect x="100" y="300" width="280" height="240" rx="22" fill="#263743" stroke="#9ab1bf" stroke-width="4"/><text x="240" y="360" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">Release &amp;</text><text x="240" y="397" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">Resettlement</text><text x="240" y="452" fill="#dce6eb" font-size="20" text-anchor="middle">demobilization · training</text><text x="240" y="486" fill="#dce6eb" font-size="20" text-anchor="middle">reserve obligations</text>
  <path d="M395 420h100" stroke="#f1c75b" stroke-width="8"/><path d="M495 420l-24-16v32z" fill="#f1c75b"/>
  <rect x="500" y="260" width="310" height="320" rx="22" fill="#263743" stroke="#f1c75b" stroke-width="4"/><text x="655" y="330" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">Brick Corps</text><text x="655" y="382" fill="#dce6eb" font-size="21" text-anchor="middle">housing · utilities · ports</text><text x="655" y="420" fill="#dce6eb" font-size="21" text-anchor="middle">railways · schools · hospitals</text><text x="655" y="458" fill="#dce6eb" font-size="21" text-anchor="middle">work · certification · plant</text><text x="655" y="520" fill="#f1c75b" font-size="22" text-anchor="middle">250,000–300,000 at peak</text>
  <path d="M825 420h95" stroke="#f1c75b" stroke-width="8"/><path d="M920 420l-24-16v32z" fill="#f1c75b"/>
  <g transform="translate(930 205)"><rect width="255" height="135" rx="18" fill="#27425a" stroke="#5b9bd5" stroke-width="3"/><text x="128" y="52" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Ships</text><text x="128" y="88" fill="#dce6eb" font-size="19" text-anchor="middle">1948 Fleet Renewal Act</text></g>
  <g transform="translate(930 375)"><rect width="255" height="135" rx="18" fill="#4b3438" stroke="#c95b63" stroke-width="3"/><text x="128" y="52" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Arsenal</text><text x="128" y="88" fill="#dce6eb" font-size="19" text-anchor="middle">1949 Continuity Act</text></g>
  <g transform="translate(930 545)"><rect width="255" height="135" rx="18" fill="#294438" stroke="#61a87b" stroke-width="3"/><text x="128" y="52" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Health</text><text x="128" y="88" fill="#dce6eb" font-size="19" text-anchor="middle">1950 Security Act</text></g>
  <path d="M1200 440h95" stroke="#f1c75b" stroke-width="8"/><path d="M1295 440l-24-16v32z" fill="#f1c75b"/>
  <rect x="1300" y="300" width="240" height="280" rx="22" fill="#263743" stroke="#61a87b" stroke-width="4"/><text x="1420" y="365" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">Contract</text><text x="1420" y="401" fill="#fff" font-size="27" font-weight="700" text-anchor="middle">Commonwealth</text><text x="1420" y="464" fill="#dce6eb" font-size="19" text-anchor="middle">requirements</text><text x="1420" y="497" fill="#dce6eb" font-size="19" text-anchor="middle">contracts</text><text x="1420" y="530" fill="#dce6eb" font-size="19" text-anchor="middle">distributed capacity</text></g>
  <text x="800" y="800" fill="#f4ead8" font-family="Georgia,serif" font-size="32" text-anchor="middle">No faction designed the whole settlement; every later government inherited it.</text>
</svg>
