<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">German old-guard transition, 1970 to 1981</title><desc id="desc">Timeline of retirements, deaths, and succession events that transferred power from Germany's founder generation to narrower second-generation offices.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#141c25"/></linearGradient><linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b665e"/><stop offset=".55" stop-color="#d0b66a"/><stop offset="1" stop-color="#648f8c"/></linearGradient></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="55" y="65" fill="#eef4f6" font-family="Georgia,serif" font-size="31">The founder generation leaves office</text><text x="55" y="98" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">Staggered handoff, retirement, and death · 1970–1981</text>
  <path d="M90 325H1110" stroke="url(#rail)" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 325)"><circle r="13" fill="#8b665e"/><path d="M0-13V-90" stroke="#8b665e" stroke-width="2"/><text x="0" y="-112" text-anchor="middle" fill="#f1e8e5" font-size="16" font-weight="700">1970</text><text x="0" y="-88" text-anchor="middle" fill="#cbbab5" font-size="13">Dönitz and Rommel</text><text x="0" y="-68" text-anchor="middle" fill="#cbbab5" font-size="13">leave daily command</text></g>
    <g transform="translate(260 325)"><circle r="13" fill="#9d765d"/><path d="M0 13V92" stroke="#9d765d" stroke-width="2"/><text x="0" y="117" text-anchor="middle" fill="#f2e8df" font-size="16" font-weight="700">1971–72</text><text x="0" y="139" text-anchor="middle" fill="#ccbda9" font-size="13">Goebbels dies;</text><text x="0" y="159" text-anchor="middle" fill="#ccbda9" font-size="13">Rommel dies</text></g>
    <g transform="translate(420 325)"><circle r="13" fill="#b28e63"/><path d="M0-13V-90" stroke="#b28e63" stroke-width="2"/><text x="0" y="-112" text-anchor="middle" fill="#f6eddb" font-size="16" font-weight="700">1973–74</text><text x="0" y="-88" text-anchor="middle" fill="#d2c4a9" font-size="13">Bormann disabled;</text><text x="0" y="-68" text-anchor="middle" fill="#d2c4a9" font-size="13">Party inheritance divided</text></g>
    <g transform="translate(590 325)"><circle r="13" fill="#d0b66a"/><path d="M0 13V92" stroke="#d0b66a" stroke-width="2"/><text x="0" y="117" text-anchor="middle" fill="#fff4cf" font-size="16" font-weight="700">1976</text><text x="0" y="139" text-anchor="middle" fill="#ddd0a8" font-size="13">Himmler dies;</text><text x="0" y="159" text-anchor="middle" fill="#ddd0a8" font-size="13">Hagedorn confirmed</text></g>
    <g transform="translate(750 325)"><circle r="13" fill="#a8ad72"/><path d="M0-13V-90" stroke="#a8ad72" stroke-width="2"/><text x="0" y="-112" text-anchor="middle" fill="#f4f1d9" font-size="16" font-weight="700">1977</text><text x="0" y="-88" text-anchor="middle" fill="#d1d2af" font-size="13">von Braun and Speer</text><text x="0" y="-68" text-anchor="middle" fill="#d1d2af" font-size="13">leave daily direction</text></g>
    <g transform="translate(920 325)"><circle r="13" fill="#7da183"/><path d="M0 13V92" stroke="#7da183" stroke-width="2"/><text x="0" y="117" text-anchor="middle" fill="#e8f1e9" font-size="16" font-weight="700">1978–79</text><text x="0" y="139" text-anchor="middle" fill="#bed0c1" font-size="13">Heydrich retires;</text><text x="0" y="159" text-anchor="middle" fill="#bed0c1" font-size="13">security powers split</text></g>
    <g transform="translate(1110 325)"><circle r="13" fill="#648f8c"/><path d="M0-13V-90" stroke="#648f8c" stroke-width="2"/><text x="0" y="-112" text-anchor="middle" fill="#e6f2f0" font-size="16" font-weight="700">1980–81</text><text x="0" y="-88" text-anchor="middle" fill="#b9d0cd" font-size="13">Dönitz and Speer die;</text><text x="0" y="-68" text-anchor="middle" fill="#b9d0cd" font-size="13">transition closes</text></g>
  </g>
  <rect x="205" y="515" width="790" height="55" rx="12" fill="#111a21" stroke="#536777"/><text x="600" y="539" text-anchor="middle" fill="#e6edef" font-family="Arial,sans-serif" font-size="15" font-weight="700">Continuity of honor · division of operational authority · no complete inheritance</text><text x="600" y="560" text-anchor="middle" fill="#93a6b2" font-family="Arial,sans-serif" font-size="13">The second generation receives narrower offices, not the founders' full personal empires.</text>
</svg>
