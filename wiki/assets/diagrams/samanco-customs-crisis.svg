<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Samanco customs confrontation</title><desc id="desc">Flow from the Lima Open Commerce Compact through uniform Peruvian customs inspection, Japanese refusal, quay confrontation, and revised access settlement.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:21px Arial,sans-serif;fill:#d1d0c7}.l{font:bold 25px Arial,sans-serif;fill:#fff}.b{stroke:#c5c8c0;stroke-width:2;rx:18}.a{stroke:#efd274;stroke-width:5;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efd274"/></marker></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">THE SAMANCO CUSTOMS COLLISION</text><text x="58" y="103" class="s">Commercial modernization becomes a sovereignty and security crisis</text>
  <g transform="translate(50 180)"><rect width="245" height="260" class="b" fill="#2f4650"/><text x="122" y="52" text-anchor="middle" class="l">LIMA COMPACT</text><text x="122" y="102" text-anchor="middle" class="s">American credit</text><text x="122" y="138" text-anchor="middle" class="s">ports and systems</text><text x="122" y="174" text-anchor="middle" class="s">uniform customs</text><text x="122" y="222" text-anchor="middle" class="s">Peruvian authority</text></g>
  <path d="M295 310h55" class="a" marker-end="url(#m)"/><g transform="translate(365 180)"><rect width="245" height="260" class="b" fill="#4a3d49"/><text x="122" y="52" text-anchor="middle" class="l">INSPECTION</text><text x="122" y="102" text-anchor="middle" class="s">Japanese shipment</text><text x="122" y="138" text-anchor="middle" class="s">older bonded claim</text><text x="122" y="174" text-anchor="middle" class="s">refusal at quay</text><text x="122" y="222" text-anchor="middle" class="s">blocked cargo</text></g>
  <path d="M610 310h55" class="a" marker-end="url(#m)"/><g transform="translate(680 180)"><rect width="245" height="260" class="b" fill="#59392f"/><text x="122" y="52" text-anchor="middle" class="l">CONFRONTATION</text><text x="122" y="102" text-anchor="middle" class="s">Collision</text><text x="122" y="138" text-anchor="middle" class="s">warning shots</text><text x="122" y="174" text-anchor="middle" class="s">casualties and detention</text><text x="122" y="222" text-anchor="middle" class="s">naval deployments</text></g>
  <path d="M925 310h55" class="a" marker-end="url(#m)"/><g transform="translate(940 455)"><rect width="220" height="200" class="b" fill="#374a3f"/><text x="110" y="50" text-anchor="middle" class="l">REVISION</text><text x="110" y="100" text-anchor="middle" class="s">Limited access</text><text x="110" y="136" text-anchor="middle" class="s">joint inspection</text><text x="110" y="172" text-anchor="middle" class="s">no admitted retreat</text></g>
  <text x="60" y="570" class="s">Japan: inherited access</text><text x="60" y="610" class="s">Peru: territorial sovereignty</text><text x="60" y="650" class="s">United States: Monroe protection through corporate systems</text>
</svg>
