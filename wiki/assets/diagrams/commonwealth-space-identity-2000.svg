<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Commonwealth space identity around 2000</title>
  <desc id="desc">National contributions pass through shared Commonwealth institutions into orbital, lunar, and planetary operations.</desc>
  <defs><style>.bg{fill:#10161d}.panel{fill:#18232d;stroke:#527084;stroke-width:2}.shared{fill:#233b47;stroke:#79b7c8;stroke-width:2.5}.out{fill:#2b283e;stroke:#a79bd4;stroke-width:2}.t{fill:#f3f1e9;font:700 24px Georgia,serif}.s{fill:#c7d2d8;font:16px Arial,sans-serif}.k{fill:#89c9d8;font:700 14px Arial,sans-serif;letter-spacing:2px}.line{stroke:#6f91a3;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6f91a3"/></marker></defs>
  <rect width="1200" height="760" class="bg"/><text x="600" y="48" text-anchor="middle" class="t">COMMONWEALTH SPACE IDENTITY, c. 2000</text><text x="600" y="76" text-anchor="middle" class="s">National capability → shared institutions → common routes and settlements</text>
  <g><rect x="40" y="120" width="210" height="90" rx="8" class="panel"/><text x="145" y="150" text-anchor="middle" class="k">BRITAIN</text><text x="145" y="178" text-anchor="middle" class="s">Design · engines</text><text x="145" y="199" text-anchor="middle" class="s">integration · command</text>
  <rect x="40" y="230" width="210" height="90" rx="8" class="panel"/><text x="145" y="260" text-anchor="middle" class="k">CANADA</text><text x="145" y="288" text-anchor="middle" class="s">Avionics · medicine</text><text x="145" y="309" text-anchor="middle" class="s">life science · links</text>
  <rect x="40" y="340" width="210" height="90" rx="8" class="panel"/><text x="145" y="370" text-anchor="middle" class="k">AUSTRALIA</text><text x="145" y="398" text-anchor="middle" class="s">Launch · ranges</text><text x="145" y="419" text-anchor="middle" class="s">tracking · recovery</text>
  <rect x="40" y="450" width="210" height="90" rx="8" class="panel"/><text x="145" y="480" text-anchor="middle" class="k">SOUTHERN AFRICA</text><text x="145" y="508" text-anchor="middle" class="s">Astronomy · minerals</text><text x="145" y="529" text-anchor="middle" class="s">deep-space geometry</text>
  <rect x="40" y="560" width="210" height="90" rx="8" class="panel"/><text x="145" y="590" text-anchor="middle" class="k">NEW ZEALAND &amp; OTHERS</text><text x="145" y="618" text-anchor="middle" class="s">Communications · science</text><text x="145" y="639" text-anchor="middle" class="s">specialist personnel</text></g>
  <g><path d="M250 165 L410 270" class="line"/><path d="M250 275 L410 310" class="line"/><path d="M250 385 L410 350" class="line"/><path d="M250 495 L410 390" class="line"/><path d="M250 605 L410 430" class="line"/>
  <rect x="410" y="205" width="360" height="300" rx="12" class="shared"/><text x="590" y="246" text-anchor="middle" class="k">SHARED COMMONWEALTH SYSTEM</text><text x="590" y="292" text-anchor="middle" class="t">Permanent council</text><text x="590" y="332" text-anchor="middle" class="s">Commonwealth Space Board</text><text x="590" y="372" text-anchor="middle" class="s">Budgetary apportionment</text><text x="590" y="412" text-anchor="middle" class="s">Astronaut corps</text><text x="590" y="452" text-anchor="middle" class="s">Procurement and standards</text></g>
  <g><path d="M770 275 L920 180" class="line"/><path d="M770 355 L920 355" class="line"/><path d="M770 435 L920 530" class="line"/><rect x="920" y="125" width="240" height="110" rx="8" class="out"/><text x="1040" y="164" text-anchor="middle" class="k">ORBIT</text><text x="1040" y="197" text-anchor="middle" class="t">Resolution</text><rect x="920" y="300" width="240" height="110" rx="8" class="out"/><text x="1040" y="339" text-anchor="middle" class="k">MOON</text><text x="1040" y="372" text-anchor="middle" class="t">Serenity</text><rect x="920" y="475" width="240" height="110" rx="8" class="out"/><text x="1040" y="514" text-anchor="middle" class="k">PLANETARY ROUTE</text><text x="1040" y="547" text-anchor="middle" class="t">Mars &amp; network</text></g>
  <text x="600" y="712" text-anchor="middle" class="s">British-led, intergovernmental, and functionally distributed; no Commonwealth federal state</text>
</svg>
