<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Commonwealth planetary operations network</title><desc id="desc">Commonwealth ground stations, ranging and time services, mission operations, and spacecraft at Mars, Venus, Mercury, and heliocentric locations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1b2d"/><stop offset="1" stop-color="#081018"/></linearGradient><style>.t{font:700 34px Georgia,serif;fill:#f4e8c8}.s{font:16px Arial,sans-serif;fill:#aebed0}.h{font:700 19px Arial,sans-serif;fill:#f5ead0}.b{font:14px Arial,sans-serif;fill:#d0dae5}.tag{font:700 12px Arial,sans-serif;letter-spacing:1.1px;fill:#9db4c8}.box{stroke:#7892ac;stroke-width:2}.line{fill:none;stroke:#b4c9da;stroke-width:3}.dash{fill:none;stroke:#7892ac;stroke-width:2;stroke-dasharray:8 8}</style></defs><rect width="1200" height="650" rx="24" fill="url(#bg)"/><text x="55" y="62" class="t">COMMONWEALTH PLANETARY OPERATIONS</text><text x="55" y="92" class="s">Distributed control, common references, and separately maintained planetary branches</text><rect class="box" x="50" y="155" width="285" height="190" rx="18" fill="#243b55"/><text x="75" y="190" class="tag">GROUND SEGMENT</text><text x="75" y="225" class="h">Commonwealth sites</text><text x="75" y="255" class="b"><tspan x="75">Britain · Canada · Australia</tspan><tspan x="75" dy="23">New Zealand · southern Africa</tspan><tspan x="75" dy="23">Indian Ocean and associated sites</tspan></text><rect class="box" x="445" y="135" width="310" height="110" rx="18" fill="#4a465f"/><text x="470" y="172" class="tag">REFERENCE SERVICE</text><text x="470" y="207" class="h">Ranging · time · navigation</text><rect class="box" x="445" y="280" width="310" height="110" rx="18" fill="#3b5260"/><text x="470" y="317" class="tag">MISSION OPERATIONS</text><text x="470" y="352" class="h">Command · telemetry · scheduling</text><path class="line" d="M335 250H445M600 245V280M755 190H880M755 335H880"/><path class="dash" d="M600 390V520M600 520H350M600 520H850"/><rect class="box" x="880" y="120" width="270" height="125" rx="18" fill="#6a4339"/><text x="905" y="157" class="tag">MARS</text><text x="905" y="192" class="h">Orbiter system</text><text x="905" y="218" class="b">Mapping · weather · relay</text><rect class="box" x="880" y="275" width="270" height="125" rx="18" fill="#6a5839"/><text x="905" y="312" class="tag">VENUS</text><text x="905" y="347" class="h">Observation programme</text><text x="905" y="373" class="b">Radar · atmosphere · solar wind</text><rect class="box" x="185" y="470" width="330" height="125" rx="18" fill="#555153"/><text x="210" y="507" class="tag">MERCURY</text><text x="210" y="542" class="h">Sparse planetary orbiters</text><text x="210" y="568" class="b">Surface · fields · exosphere</text><rect class="box" x="685" y="470" width="330" height="125" rx="18" fill="#4e5139"/><text x="710" y="507" class="tag">HELIOCENTRIC</text><text x="710" y="542" class="h">Solar observations</text><text x="710" y="568" class="b">Radiation · particles · warnings</text><text x="55" y="625" class="s">Resolution and Serenity remain the near-Earth institutional nodes; no link removes planetary light-time.</text></svg>
