<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">American federal executive branch</title><desc id="desc">Institutional diagram showing the president, vice president, Executive Office, Cabinet, departments, civil service, Congress, courts, and corporate contractors.</desc>
  <rect width="1200" height="760" fill="#101722"/><rect x="32" y="32" width="1136" height="696" rx="18" fill="#172233" stroke="#53657b" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" fill="#f0f4f8" font-family="Georgia,serif" font-size="31">Federal executive branch of the United States</text>
  <text x="600" y="108" text-anchor="middle" fill="#aebdca" font-family="Arial,sans-serif" font-size="16">constitutional direction · statutory administration · continuous execution</text>
  <rect x="425" y="138" width="350" height="92" rx="12" fill="#194c67" stroke="#67c1e4" stroke-width="2"/><text x="600" y="177" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">President</text><text x="600" y="205" text-anchor="middle" fill="#d9f2fb" font-family="Arial,sans-serif" font-size="15">direction · appointments · faithful execution</text>
  <rect x="90" y="154" width="240" height="66" rx="10" fill="#28374a" stroke="#8da2b8"/><text x="210" y="183" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="20">Congress</text><text x="210" y="205" text-anchor="middle" fill="#c9d5df" font-family="Arial,sans-serif" font-size="13">statute · money · confirmation · oversight</text>
  <rect x="870" y="154" width="240" height="66" rx="10" fill="#28374a" stroke="#8da2b8"/><text x="990" y="183" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="20">Federal courts</text><text x="990" y="205" text-anchor="middle" fill="#c9d5df" font-family="Arial,sans-serif" font-size="13">cases · review · legal limits</text>
  <path d="M330 187 H425M775 187 H870" stroke="#8da2b8" stroke-width="3" fill="none"/><path d="M600 230 V275" stroke="#67c1e4" stroke-width="4"/>
  <rect x="120" y="275" width="280" height="100" rx="12" fill="#243b55" stroke="#6fa0ce"/><text x="260" y="310" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22">Vice President</text><text x="260" y="338" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">succession · Senate presidency</text><text x="260" y="359" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">contingent selection by Senate</text>
  <rect x="460" y="275" width="280" height="100" rx="12" fill="#243b55" stroke="#6fa0ce"/><text x="600" y="307" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22">Executive Office</text><text x="600" y="335" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">budget · policy · security</text><text x="600" y="357" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">information · interagency coordination</text>
  <rect x="800" y="275" width="280" height="100" rx="12" fill="#243b55" stroke="#6fa0ce"/><text x="940" y="310" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22">Cabinet</text><text x="940" y="338" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">department heads · presidential advice</text><text x="940" y="359" text-anchor="middle" fill="#d3e0ec" font-family="Arial,sans-serif" font-size="14">individual statutory responsibility</text>
  <path d="M600 375 V421M940 375 V421" stroke="#6fa0ce" stroke-width="3"/>
  <rect x="300" y="421" width="600" height="88" rx="12" fill="#36502f" stroke="#9abe83" stroke-width="2"/><text x="600" y="456" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="24">Executive departments and agencies</text><text x="600" y="486" text-anchor="middle" fill="#e0ecd9" font-family="Arial,sans-serif" font-size="15">administer statutes · issue lawful rules · grants · enforcement · contracts</text>
  <path d="M600 509 V552" stroke="#9abe83" stroke-width="4"/>
  <rect x="110" y="552" width="450" height="104" rx="12" fill="#4b4030" stroke="#c8a86b" stroke-width="2"/><text x="335" y="588" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="23">Federal civil service</text><text x="335" y="617" text-anchor="middle" fill="#f0dfbf" font-family="Arial,sans-serif" font-size="14">records · expertise · inspection · continuity</text><text x="335" y="639" text-anchor="middle" fill="#f0dfbf" font-family="Arial,sans-serif" font-size="14">public officers and employees</text>
  <rect x="640" y="552" width="450" height="104" rx="12" fill="#49323e" stroke="#c681a1" stroke-width="2"/><text x="865" y="588" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="23">Corporate contractors</text><text x="865" y="617" text-anchor="middle" fill="#f2dbe6" font-family="Arial,sans-serif" font-size="14">plants · finance · software · technical operations</text><text x="865" y="639" text-anchor="middle" fill="#f2dbe6" font-family="Arial,sans-serif" font-size="14">private capacity under public instruments</text>
  <path d="M560 604 H640" stroke="#d3bf8b" stroke-width="3" stroke-dasharray="9 7"/><text x="600" y="690" text-anchor="middle" fill="#aebdca" font-family="Arial,sans-serif" font-size="14">Legal sovereignty remains public even where practical execution depends upon private systems.</text>
</svg>
