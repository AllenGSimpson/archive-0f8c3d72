<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Legal settings of Japanese preservationism</title>
  <desc id="desc">Three columns compare integral Japanese territories, sovereign associated states, and protected or dependent members, all feeding into a shared administrative field of archives, education, media, religion, and technical standards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17222b"/>
      <stop offset="1" stop-color="#0d141a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9eb5c6"/>
    </marker>
    <style>
      .head{font:700 24px Georgia,serif;fill:#f1e8d6}.sub{font:600 17px system-ui,sans-serif;fill:#f1e8d6}.body{font:15px system-ui,sans-serif;fill:#cdd8df}.small{font:13px system-ui,sans-serif;fill:#9fb0bc}.box{stroke:#708896;stroke-width:2}.line{stroke:#9eb5c6;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="560" rx="24" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" class="head">Preservation policy by constitutional setting</text>
  <rect x="32" y="78" width="280" height="270" rx="15" fill="#20384a" class="box"/>
  <rect x="340" y="78" width="280" height="270" rx="15" fill="#31443a" class="box"/>
  <rect x="648" y="78" width="280" height="270" rx="15" fill="#4b3b34" class="box"/>
  <text x="172" y="112" text-anchor="middle" class="sub">Integral Japan</text>
  <text x="480" y="112" text-anchor="middle" class="sub">Sovereign associates</text>
  <text x="788" y="112" text-anchor="middle" class="sub">Protected members</text>
  <text x="54" y="147" class="body">• Japanese nationality</text>
  <text x="54" y="176" class="body">• Regional language and culture</text>
  <text x="54" y="205" class="body">• Local archives and councils</text>
  <text x="54" y="234" class="body">• No separate foreign policy</text>
  <text x="54" y="280" class="small">Chōsen · Taiwan · Ryukyu</text>
  <text x="54" y="304" class="small">Karafuto · Pacific territories</text>
  <text x="362" y="147" class="body">• Separate nationality</text>
  <text x="362" y="176" class="body">• National government or crown</text>
  <text x="362" y="205" class="body">• National script and religion</text>
  <text x="362" y="234" class="body">• Japanese strategic leadership</text>
  <text x="362" y="280" class="small">China · Philippines · Thailand</text>
  <text x="362" y="304" class="small">Manchukuo · Indochina · Mongolia</text>
  <text x="670" y="147" class="body">• Local administration</text>
  <text x="670" y="176" class="body">• External guarantee or mandate</text>
  <text x="670" y="205" class="body">• Protected public culture</text>
  <text x="670" y="234" class="body">• Order may be imposed outside</text>
  <text x="670" y="280" class="small">Protected Malaya · later Burma</text>
  <text x="670" y="304" class="small">Resource and security systems</text>
  <path d="M172 350v55" class="line"/>
  <path d="M480 350v55" class="line"/>
  <path d="M788 350v55" class="line"/>
  <rect x="115" y="412" width="730" height="105" rx="16" fill="#2d3039" stroke="#8d94a6" stroke-width="2"/>
  <text x="480" y="447" text-anchor="middle" class="sub">Shared administrative field after the political movement</text>
  <text x="480" y="478" text-anchor="middle" class="body">archives · education · media · religious institutions · heritage</text>
  <text x="480" y="504" text-anchor="middle" class="body">return policy · terminology · character encoding · localized computing</text>
  <text x="480" y="544" text-anchor="middle" class="small">Cultural protection did not create one citizenship or one constitutional right to statehood.</text>
</svg>
