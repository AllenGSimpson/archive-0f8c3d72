<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Latin Ceres exploration architecture</title>
  <desc id="desc">Diagram connecting the Stella Maris exploration yard, a reusable nuclear exploration ship, asteroid water processing, and a detachable Ceres landing system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111018"/><stop offset="1" stop-color="#221c2c"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#d5b25b"/></marker>
    <style>.title{font:700 40px Georgia,serif;fill:#f1e8d7}.sub{font:600 17px Arial,sans-serif;letter-spacing:3px;fill:#bca9c8}.box{fill:#241f31;stroke:#79668a;stroke-width:3;rx:18}.target{fill:#33271f;stroke:#a77a55;stroke-width:3;rx:18}.head{font:700 22px Georgia,serif;fill:#f4ead7}.copy{font:16px Arial,sans-serif;fill:#d7cedd}.line{stroke:#d5b25b;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#9a85a8;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}.label{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#d5b25b}.foot{font:15px Arial,sans-serif;fill:#bfb3c5}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" class="title">LATIN CERES EXPLORATION ARCHITECTURE</text>
  <text x="800" y="105" text-anchor="middle" class="sub">A REUSABLE EXPLORATORY NAVY BEYOND MARS</text>
  <rect x="55" y="235" width="330" height="250" class="box"/><text x="220" y="278" text-anchor="middle" class="head">STELLA MARIS YARD</text><text x="220" y="318" text-anchor="middle" class="copy">Construction trusses and berth</text><text x="220" y="350" text-anchor="middle" class="copy">Tankage and engine workshops</text><text x="220" y="382" text-anchor="middle" class="copy">Nuclear-system handling</text><text x="220" y="414" text-anchor="middle" class="copy">Habitation research and service</text><text x="220" y="450" text-anchor="middle" class="label">HOME PORT</text>
  <rect x="500" y="180" width="500" height="360" class="box"/><text x="750" y="225" text-anchor="middle" class="head">DEEP-SPACE EXPLORATION SHIP</text><text x="750" y="265" text-anchor="middle" class="copy">Self-contained nuclear-powered vessel</text><text x="750" y="297" text-anchor="middle" class="copy">Long-duration habitation and repair</text><line x1="560" y1="327" x2="940" y2="327" stroke="#79668a" stroke-width="2"/><text x="625" y="365" text-anchor="middle" class="label">PROBES</text><text x="750" y="365" text-anchor="middle" class="label">WATER SYSTEM</text><text x="885" y="365" text-anchor="middle" class="label">LANDER</text><text x="625" y="404" text-anchor="middle" class="copy">Mapping</text><text x="750" y="404" text-anchor="middle" class="copy">Recovery</text><text x="885" y="404" text-anchor="middle" class="copy">Descent</text><text x="625" y="432" text-anchor="middle" class="copy">Navigation</text><text x="750" y="432" text-anchor="middle" class="copy">Purification</text><text x="885" y="432" text-anchor="middle" class="copy">Surface work</text><text x="625" y="460" text-anchor="middle" class="copy">Resources</text><text x="750" y="460" text-anchor="middle" class="copy">Storage</text><text x="885" y="460" text-anchor="middle" class="copy">Ascent</text><text x="750" y="510" text-anchor="middle" class="label">REUSABLE ORBITAL CARRIER</text>
  <path d="M385 360H500" class="line"/>
  <rect x="1120" y="165" width="400" height="210" class="target"/><text x="1320" y="210" text-anchor="middle" class="head">CERES ORBIT AND SURFACE</text><text x="1320" y="250" text-anchor="middle" class="copy">Close survey and navigation</text><text x="1320" y="282" text-anchor="middle" class="copy">Detachable low-gravity landing system</text><text x="1320" y="314" text-anchor="middle" class="copy">Science · samples · resource trials</text><text x="1320" y="345" text-anchor="middle" class="label">FIRST HUMAN LANDING</text>
  <rect x="1120" y="485" width="400" height="210" class="target"/><text x="1320" y="530" text-anchor="middle" class="head">HYDRATED BELT TARGETS</text><text x="1320" y="570" text-anchor="middle" class="copy">Robotic resource reconnaissance</text><text x="1320" y="602" text-anchor="middle" class="copy">Water-bearing material acquisition</text><text x="1320" y="634" text-anchor="middle" class="copy">Endurance and later-route support</text><text x="1320" y="666" text-anchor="middle" class="label">EXTEND THE VOYAGE</text>
  <path d="M1000 290H1120" class="line"/><path d="M1000 450Q1060 450 1060 590H1120" class="line"/><path d="M1120 630Q970 770 790 540" class="dash"/>
  <text x="800" y="825" text-anchor="middle" class="foot">Exact vessel name, propulsion cycle, lander design, target list, and reuse history remain open.</text>
</svg>
