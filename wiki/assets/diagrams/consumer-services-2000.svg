<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Shopping and consumer services in 2000</title><desc id="d">A circular consumer cycle connects shops, payment, delivery, use, and repair.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08161a"/><stop offset="1" stop-color="#243031"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#8aa7a1"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f4f5f1" font-family="Georgia,serif" font-size="31">The consumer-service cycle</text><text x="60" y="105" fill="#aabbb9" font-family="Arial,sans-serif" font-size="17">Retail modernity combines new networks with durable local institutions</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="330" r="94" fill="#294044" stroke="#94aaa5" stroke-width="3"/><text x="600" y="324" fill="#f0f4f1" font-size="20" font-weight="700">HOUSEHOLD</text><text x="600" y="354" fill="#c6d3d0" font-size="15">choice and budget</text><g fill="#233539" stroke-width="3"><rect x="100" y="175" width="220" height="110" rx="16" stroke="#b49a63"/><rect x="490" y="125" width="220" height="110" rx="16" stroke="#889fb0"/><rect x="880" y="175" width="220" height="110" rx="16" stroke="#9b83a9"/><rect x="765" y="445" width="220" height="110" rx="16" stroke="#7fa37b"/><rect x="215" y="445" width="220" height="110" rx="16" stroke="#b0826b"/></g><g fill="#eef2ef" font-size="18" font-weight="700"><text x="210" y="220">SHOP / CATALOGUE</text><text x="210" y="247">market / cooperative</text><text x="600" y="170">PAYMENT</text><text x="600" y="197">cash / account / card</text><text x="990" y="220">ORDER NETWORK</text><text x="990" y="247">telephone / terminal</text><text x="875" y="490">DELIVERY</text><text x="875" y="517">parcel / collection</text><text x="325" y="490">REPAIR / RESALE</text><text x="325" y="517">service / used goods</text></g></g><g stroke="#8aa7a1" stroke-width="3" marker-end="url(#a)"><path d="M320 205l155-34"/><path d="M710 171l155 34"/><path d="M1020 285l-90 145"/><path d="M765 500H450"/><path d="M260 445l-80-145"/></g></svg>
