<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Layers of off-world nationality and identity</title><desc id="d">Terrestrial nationality, sponsor jurisdiction, settlement residence, and local identity overlap.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131b"/><stop offset="1" stop-color="#142532"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Nationality, residence, and identity</text><text x="60" y="104" fill="#a2b5bf" font-family="Arial,sans-serif" font-size="17">Four overlapping statuses develop at different speeds</text><g transform="translate(600 345)" font-family="Arial,sans-serif" text-anchor="middle"><circle r="225" fill="#172e3b" stroke="#4f8497" stroke-width="3"/><circle r="170" fill="#21414c" stroke="#65a0af" stroke-width="3"/><circle r="116" fill="#303e3f" stroke="#a68f58" stroke-width="3"/><circle r="62" fill="#533537" stroke="#c47777" stroke-width="3"/><text y="-188" fill="#dcebef" font-size="18" font-weight="700">TERRESTRIAL NATIONALITY</text><text y="-136" fill="#dcebef" font-size="17" font-weight="700">SPONSOR JURISDICTION</text><text y="-80" fill="#f4e2ae" font-size="17" font-weight="700">SETTLEMENT RESIDENCE</text><text y="6" fill="#f7dddd" font-size="17" font-weight="700">LOCAL</text><text y="30" fill="#f7dddd" font-size="17" font-weight="700">IDENTITY</text></g><text x="600" y="595" fill="#9fb3bc" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Birth on another world changes the record before it changes sovereignty</text></svg>
