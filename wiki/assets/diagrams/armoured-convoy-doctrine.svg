<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Armoured-convoy doctrine</title><desc id="desc">A protected convoy combines reconnaissance, engineers, armored protection, cargo, communications, recovery, medicine, air observation, and a mobile reserve.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.b{fill:#192e39;stroke:#6b8796;stroke-width:2}.g{fill:#24362b;stroke:#7e9d79;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 17px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.road{stroke:#38454b;stroke-width:94}.edge{stroke:#8a969c;stroke-width:3;stroke-dasharray:12 10}.line{stroke:#cfa655;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Armoured-convoy doctrine</text><text x="50" y="92" class="s">Protected movement through a corridor that cannot be occupied continuously</text>
  <path class="road" d="M80 360 H1120"/><path class="edge" d="M80 311 H1120 M80 409 H1120"/>
  <g transform="translate(85 292)"><rect class="b" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">1 · RECCE</text><text x="70" y="67" text-anchor="middle" class="t">Route patrol</text><text x="70" y="96" text-anchor="middle" class="d">Road · bridge</text><text x="70" y="118" text-anchor="middle" class="d">checkpoint</text></g>
  <g transform="translate(250 292)"><rect class="b" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">2 · ENGINEER</text><text x="70" y="67" text-anchor="middle" class="t">Mine / repair</text><text x="70" y="96" text-anchor="middle" class="d">Clear · mark</text><text x="70" y="118" text-anchor="middle" class="d">bypass</text></g>
  <g transform="translate(415 292)"><rect class="g" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">3 · PROTECT</text><text x="70" y="67" text-anchor="middle" class="t">Armor / carrier</text><text x="70" y="96" text-anchor="middle" class="d">Observe · respond</text></g>
  <g transform="translate(580 292)"><rect class="g" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">4 · PURPOSE</text><text x="70" y="67" text-anchor="middle" class="t">Cargo / people</text><text x="70" y="96" text-anchor="middle" class="d">Fuel · food</text><text x="70" y="118" text-anchor="middle" class="d">ammunition</text></g>
  <g transform="translate(745 292)"><rect class="b" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">5 · SUPPORT</text><text x="70" y="67" text-anchor="middle" class="t">Signals / medic</text><text x="70" y="96" text-anchor="middle" class="d">Control · treat</text></g>
  <g transform="translate(910 292)"><rect class="b" width="140" height="136" rx="8"/><text x="70" y="28" text-anchor="middle" class="tag">6 · RECOVER</text><text x="70" y="67" text-anchor="middle" class="t">Repair / rear</text><text x="70" y="96" text-anchor="middle" class="d">Tow · withdraw</text></g>
  <path class="line" d="M485 292 V210 H815 V292"/><g transform="translate(535 145)"><rect class="b" width="230" height="85" rx="8"/><text x="115" y="29" text-anchor="middle" class="tag">AIR OBSERVATION</text><text x="115" y="59" text-anchor="middle" class="d">Aircraft · later helicopters</text></g>
  <path class="line" d="M320 428 V510 H980 V428"/><g transform="translate(500 490)"><rect class="b" width="300" height="85" rx="8"/><text x="150" y="29" text-anchor="middle" class="tag">LOCAL INTELLIGENCE + MOBILE RESERVE</text><text x="150" y="59" text-anchor="middle" class="d">Interpret the route · respond to interruption</text></g>
  <text x="50" y="625" class="s">A tank at the head did not make a convoy resilient if its fuel, signals, recovery, medical, or bridge capacity remained exposed.</text>
</svg>
