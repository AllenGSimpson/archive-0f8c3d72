<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Extraterrestrial criminal jurisdiction</title><desc id="d">Decision path from an internal offense through shared-system emergency authority and concurrent jurisdiction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#102735"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#74b3c4"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Criminal jurisdiction beyond Earth</text><text x="60" y="104" fill="#a3b7c1" font-family="Arial,sans-serif" font-size="17">Place, registry, nationality, and technical danger can point to different authorities</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="205" width="245" height="170" rx="17" fill="#183747" stroke="#5790a5"/><text x="188" y="250" fill="#e3f0f3" font-size="19" font-weight="700">INTERNAL OFFENSE</text><text x="188" y="292" fill="#bcd0d7" font-size="15">responsible module</text><text x="188" y="320" fill="#bcd0d7" font-size="15">registry · nationality</text><rect x="365" y="205" width="245" height="170" rx="17" fill="#24434d" stroke="#72adbb"/><text x="488" y="250" fill="#e3f0f3" font-size="19" font-weight="700">COMMON HAZARD?</text><text x="488" y="292" fill="#bcd0d7" font-size="15">secure scene · disarm</text><text x="488" y="320" fill="#bcd0d7" font-size="15">isolate · preserve life</text><rect x="665" y="205" width="245" height="170" rx="17" fill="#343d3e" stroke="#b29c62"/><text x="788" y="250" fill="#f9e8b8" font-size="19" font-weight="700">MIXED INTERESTS</text><text x="788" y="292" fill="#d4cfbe" font-size="15">several nationalities</text><text x="788" y="320" fill="#d4cfbe" font-size="15">shared evidence</text><rect x="965" y="205" width="170" height="170" rx="17" fill="#402d31" stroke="#bd7778"/><text x="1050" y="250" fill="#f7dede" font-size="19" font-weight="700">CASE</text><text x="1050" y="292" fill="#d8c2c3" font-size="15">prosecution</text><text x="1050" y="320" fill="#d8c2c3" font-size="15">or transfer</text></g><g stroke="#74b3c4" stroke-width="3" marker-end="url(#a)"><path d="M310 290h40"/><path d="M610 290h40"/><path d="M910 290h40"/></g><text x="600" y="500" fill="#9fb3bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Emergency command ends with the hazard; continuing custody needs legal authority</text></svg>
