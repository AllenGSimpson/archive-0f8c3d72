<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Japanese corporate jurisdiction in space</title><desc id="desc">Corporate autonomy is nested inside the imperial legal and strategic system.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160b0c"/><stop offset="1" stop-color="#251719"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f6eeee" font-family="Georgia,serif" font-size="31">Japanese corporate jurisdiction</text><text x="60" y="105" fill="#c7afb1" font-family="Arial,sans-serif" font-size="17">Corporate administration remains inside an imperial strategic envelope</text>
<g transform="translate(600 345)" font-family="Arial,sans-serif" text-anchor="middle"><circle r="225" fill="#2b1719" stroke="#9f5559" stroke-width="3"/><circle r="160" fill="#492326" stroke="#c67879" stroke-width="3"/><circle r="92" fill="#742e32" stroke="#e7a3a0" stroke-width="3"/><circle r="35" fill="#f0e8dd"/><circle r="13" fill="#b82e35"/><text y="-185" fill="#e8cfd0" font-size="18" font-weight="700">IMPERIAL LAW AND EXTERNAL REPRESENTATION</text><text y="-120" fill="#f0d9d8" font-size="18" font-weight="700">STRATEGIC ENVELOPE</text><text y="-75" fill="#dcb6b5" font-size="15">transport · ownership · defense · technology</text><text y="124" fill="#f5dddd" font-size="18" font-weight="700">CORPORATE HOUSE</text><text y="151" fill="#dcb6b5" font-size="15">finance · management · employment · works</text></g><text x="600" y="590" fill="#bda6a7" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">An act may be unauthorized without leaving Japanese jurisdiction</text></svg>
