<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Japanese merchant-marine system</title>
  <desc id="desc">A diagram connecting Tokyo allocation, corporate carriers and insurers, imperial ports, and the northern, continental, southern, and Pacific sea lanes.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071929"/><stop offset="1" stop-color="#102d3b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#sea)"/>
  <g fill="none" stroke="#71b7cc" stroke-width="5" opacity=".55">
    <path d="M600 177V255M600 366V437M600 366L215 455M600 366L985 455"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="390" y="55" width="420" height="122" rx="18" fill="#172c3b" stroke="#d6bd73" stroke-width="3"/>
    <text x="600" y="94" fill="#d6bd73" font-size="18" font-weight="700" letter-spacing="2">TOKYO PRIORITIES</text>
    <text x="600" y="125" fill="#fff" font-size="24" font-weight="700">Economic Board · ministries · Navy</text>
    <text x="600" y="151" fill="#b8c8d2" font-size="16">food · petroleum · steel · passengers · reserves</text>
    <rect x="300" y="255" width="600" height="111" rx="18" fill="#183f4d" stroke="#71b7cc" stroke-width="3"/>
    <text x="600" y="293" fill="#9ed9e8" font-size="18" font-weight="700" letter-spacing="2">COMMERCIAL NERVOUS SYSTEM</text>
    <text x="600" y="326" fill="#fff" font-size="25" font-weight="700">NYK · Osaka Shōsen · Mitsubishi · Mitsui</text>
    <text x="600" y="352" fill="#c5dbe2" font-size="16">ships · charters · banks · insurers · trading houses · yards</text>
    <g>
      <rect x="55" y="455" width="320" height="140" rx="18" fill="#163743" stroke="#6c9fb4" stroke-width="3"/>
      <text x="215" y="494" fill="#9ed9e8" font-size="18" font-weight="700">NORTHERN &amp; CONTINENTAL</text>
      <text x="215" y="531" fill="#fff" font-size="21">Karafuto · Urajio · Korea</text>
      <text x="215" y="559" fill="#c5dbe2" font-size="16">coal · timber · fish · machinery</text>
      <text x="215" y="584" fill="#c5dbe2" font-size="16">Manchukuo and Chinese ports</text>
    </g>
    <g>
      <rect x="440" y="437" width="320" height="176" rx="18" fill="#29433b" stroke="#94b66c" stroke-width="3"/>
      <text x="600" y="477" fill="#c8db9b" font-size="18" font-weight="700">SOUTHERN RESOURCES</text>
      <text x="600" y="514" fill="#fff" font-size="21">Singapore · Indochina · Indies</text>
      <text x="600" y="542" fill="#d6dfd1" font-size="16">oil · rubber · tin · rice</text>
      <text x="600" y="567" fill="#d6dfd1" font-size="16">tankers · cold stores · feeder fleets</text>
      <text x="600" y="592" fill="#d6dfd1" font-size="16">route allocation as political leverage</text>
    </g>
    <g>
      <rect x="825" y="455" width="320" height="140" rx="18" fill="#37384e" stroke="#9596c9" stroke-width="3"/>
      <text x="985" y="494" fill="#c8c9f0" font-size="18" font-weight="700">PACIFIC &amp; AMERICAS</text>
      <text x="985" y="531" fill="#fff" font-size="21">Micronesia · Philippines · Peru</text>
      <text x="985" y="559" fill="#d2d2df" font-size="16">bases · manufactures · minerals</text>
      <text x="985" y="584" fill="#d2d2df" font-size="16">passengers and prestige routes</text>
    </g>
  </g>
</svg>
