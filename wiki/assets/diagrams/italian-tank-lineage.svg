<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Italian tank lineage, 1943–1981</title>
  <desc id="desc">A five-stage timeline from the P40 through the Carro 80 Ariete II, showing increasing weight, gun caliber, engine power, and fire-control capability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101713"/><stop offset="1" stop-color="#20251f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".38"/></filter>
    <style>
      .kicker{font:700 19px Arial,sans-serif;letter-spacing:5px;fill:#c9a85a}.title{font:700 49px Georgia,serif;fill:#f2eee3}.sub{font:18px Arial,sans-serif;fill:#b7b9ae}.year{font:700 19px Arial,sans-serif;letter-spacing:2px;fill:#e8d9aa}.name{font:700 27px Georgia,serif;fill:#fff}.spec{font:17px Arial,sans-serif;fill:#d9ddd3}.note{font:15px Arial,sans-serif;fill:#aeb5aa}.axis{stroke:#9a8653;stroke-width:5}.tick{stroke:#c9a85a;stroke-width:4}.link{stroke:#697569;stroke-width:3;fill:none}.box{stroke:#6f786c;stroke-width:2}.footer{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#d6c895}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 0h54v900H0z" fill="#315843"/><path d="M54 0h24v900H54z" fill="#ece6d5"/><path d="M78 0h24v900H78z" fill="#813d3d"/>
  <text x="145" y="85" class="kicker">ITALIAN ARMORED DEVELOPMENT</text>
  <text x="145" y="148" class="title">The uninterrupted tank lineage</text>
  <text x="145" y="184" class="sub">IRI capital · Ansaldo and Fiat manufacture · OTO armament · Latin ammunition standards</text>
  <line x1="185" y1="330" x2="1480" y2="330" class="axis"/>
  <g class="tick"><line x1="240" y1="312" x2="240" y2="348"/><line x1="515" y1="312" x2="515" y2="348"/><line x1="790" y1="312" x2="790" y2="348"/><line x1="1065" y1="312" x2="1065" y2="348"/><line x1="1340" y1="312" x2="1340" y2="348"/></g>
  <g filter="url(#shadow)">
    <rect x="145" y="225" width="190" height="78" rx="8" fill="#4b5c4d" class="box"/><text x="168" y="255" class="year">1943</text><text x="168" y="286" class="name">P40</text>
    <rect x="385" y="370" width="260" height="160" rx="10" fill="#4a554b" class="box"/><text x="410" y="405" class="year">1945–47</text><text x="410" y="442" class="name">P35/43 · P38/43</text><text x="410" y="477" class="spec">35.0/38.0 t · 4 crew</text><text x="410" y="505" class="spec">75 mm / 90 mm</text>
    <rect x="660" y="225" width="260" height="160" rx="10" fill="#4d624e" class="box"/><text x="685" y="260" class="year">1957</text><text x="685" y="297" class="name">Carro 57 Ariete</text><text x="685" y="332" class="spec">38.0 t · 4 crew</text><text x="685" y="360" class="spec">90 mm · 750 hp</text>
    <rect x="935" y="370" width="260" height="180" rx="10" fill="#4d5a52" class="box"/><text x="960" y="405" class="year">1968</text><text x="960" y="442" class="name">Carro 68 Leone II</text><text x="960" y="477" class="spec">44.0 t · 105 mm</text><text x="960" y="505" class="spec">900 hp · 60 km/h</text><text x="960" y="533" class="note">Stabilized · active infrared</text>
    <rect x="1210" y="210" width="270" height="198" rx="10" fill="#5b5946" class="box"/><text x="1235" y="245" class="year">1981</text><text x="1235" y="282" class="name">Carro 80 Ariete II</text><text x="1235" y="317" class="spec">55.0 t · 120 mm</text><text x="1235" y="345" class="spec">1,300 hp · 65 km/h</text><text x="1235" y="373" class="note">Composite · laser · thermal</text>
  </g>
  <path d="M335 264 C375 264 375 430 385 430" class="link"/><path d="M645 430 C655 430 650 305 660 305" class="link"/><path d="M920 305 C930 305 925 450 935 450" class="link"/><path d="M1195 450 C1205 450 1200 310 1210 310" class="link"/>
  <g transform="translate(145 620)">
    <rect width="1335" height="150" rx="12" fill="#171d19" stroke="#4f594f" stroke-width="2"/>
    <text x="30" y="42" class="kicker">GENERATIONAL CHANGE</text>
    <text x="30" y="82" class="spec">75 mm wartime tank → selected 90 mm victory tank → four-crew main tank → Latin-standard 105 mm → 120 mm composite-armored tank</text>
    <text x="30" y="117" class="note">The historical OF-40 does not arise: Italy has no break requiring a Leopard-derived export lineage.</text>
  </g>
  <text x="145" y="838" class="footer">FRACTURED PEACE ARCHIVE · LAND ARMAMENTS REGISTER</text>
</svg>
