<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Five early postwar computing systems</title>
  <desc id="desc">A timeline from 1949 to 1955 comparing EDSAC, Pilot ACE, the IAS machine, Telefunken Rechenanlage 52, and the A-0 system by their institutional inheritance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10181d"/><stop offset="1" stop-color="#19262b"/></linearGradient>
    <style>.title{font:700 40px Georgia,serif;fill:#f4efe4}.sub{font:18px system-ui,sans-serif;letter-spacing:3px;fill:#aebec2}.year{font:700 21px system-ui,sans-serif;fill:#e1cf9b}.machine{font:700 23px system-ui,sans-serif;fill:#fff}.place{font:17px system-ui,sans-serif;fill:#b8c9cd}.inherit{font:italic 18px Georgia,serif;fill:#eef0e9}.axis{stroke:#719098;stroke-width:4}.tick{stroke:#719098;stroke-width:3}.guide{stroke:#385058;stroke-width:2;stroke-dasharray:5 7}.card{stroke-width:3}.date{font:700 17px system-ui,sans-serif;fill:#11191c}.note{font:17px system-ui,sans-serif;fill:#bed0d2}</style>
  </defs>
  <rect width="1400" height="820" rx="24" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Early postwar computing becomes a service</text><text x="70" y="108" class="sub">FIVE SYSTEMS · FIVE INSTITUTIONAL INHERITANCES · 1949–55</text>
  <line x1="180" y1="680" x2="1280" y2="680" class="axis"/>
  <g><line x1="180" y1="665" x2="180" y2="699" class="tick"/><text x="180" y="730" text-anchor="middle" class="year">1949</text><line x1="400" y1="665" x2="400" y2="699" class="tick"/><text x="400" y="730" text-anchor="middle" class="year">1950</text><line x1="620" y1="665" x2="620" y2="699" class="tick"/><text x="620" y="730" text-anchor="middle" class="year">1951</text><line x1="840" y1="665" x2="840" y2="699" class="tick"/><text x="840" y="730" text-anchor="middle" class="year">1952</text><line x1="1060" y1="665" x2="1060" y2="699" class="tick"/><text x="1060" y="730" text-anchor="middle" class="year">1953</text><line x1="1280" y1="665" x2="1280" y2="699" class="tick"/><text x="1280" y="730" text-anchor="middle" class="year">1954–55</text></g>
  <g transform="translate(80 160)"><rect width="242" height="144" rx="15" fill="#244e62" stroke="#7bb6cf" class="card"/><rect x="18" y="18" width="76" height="26" rx="6" fill="#7bb6cf"/><text x="56" y="37" text-anchor="middle" class="date">1949</text><text x="18" y="76" class="machine">EDSAC</text><text x="18" y="102" class="place">Cambridge</text><text x="18" y="130" class="inherit">university service</text><line x1="100" y1="144" x2="100" y2="505" class="guide"/></g>
  <g transform="translate(326 350)"><rect width="242" height="144" rx="15" fill="#39466b" stroke="#9daee6" class="card"/><rect x="18" y="18" width="76" height="26" rx="6" fill="#9daee6"/><text x="56" y="37" text-anchor="middle" class="date">1950</text><text x="18" y="76" class="machine">Pilot ACE</text><text x="18" y="102" class="place">NPL</text><text x="18" y="130" class="inherit">timing craft</text><line x1="74" y1="144" x2="74" y2="315" class="guide"/></g>
  <g transform="translate(592 160)"><rect width="242" height="144" rx="15" fill="#36534b" stroke="#91c8b7" class="card"/><rect x="18" y="18" width="108" height="26" rx="6" fill="#91c8b7"/><text x="72" y="37" text-anchor="middle" class="date">1951–52</text><text x="18" y="76" class="machine">Rechenanlage 52</text><text x="18" y="102" class="place">Telefunken</text><text x="18" y="130" class="inherit">instrument systems</text><line x1="128" y1="144" x2="128" y2="505" class="guide"/></g>
  <g transform="translate(842 350)"><rect width="242" height="144" rx="15" fill="#5a4436" stroke="#d2a47d" class="card"/><rect x="18" y="18" width="76" height="26" rx="6" fill="#d2a47d"/><text x="56" y="37" text-anchor="middle" class="date">1952</text><text x="18" y="76" class="machine">IAS machine</text><text x="18" y="102" class="place">Princeton</text><text x="18" y="130" class="inherit">published architecture</text><line x1="0" y1="144" x2="0" y2="315" class="guide"/></g>
  <g transform="translate(1090 160)"><rect width="242" height="144" rx="15" fill="#5d3e51" stroke="#d69abb" class="card"/><rect x="18" y="18" width="108" height="26" rx="6" fill="#d69abb"/><text x="72" y="37" text-anchor="middle" class="date">1952–53</text><text x="18" y="76" class="machine">A-0 system</text><text x="18" y="102" class="place">UNIVAC</text><text x="18" y="130" class="inherit">automatic programs</text><line x1="80" y1="144" x2="80" y2="505" class="guide"/></g>
  <text x="700" y="785" text-anchor="middle" class="note">The threshold was not one invention: it was the creation of repeatable machine-and-software institutions.</text>
</svg>
