<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Annual Arctic aid cycle</title><desc id="desc">Four phases show winter repair, spring planning, summer convoy unloading, and autumn inland distribution.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d9c26f"/></marker></defs>
  <rect width="1200" height="600" rx="24" fill="#07151e"/><text x="600" y="60" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">THE ARCTIC RELIEF YEAR</text>
  <g font-family="Arial,sans-serif">
    <circle cx="600" cy="315" r="170" fill="#0d2530" stroke="#d9c26f" stroke-width="4"/><text x="600" y="300" text-anchor="middle" fill="#fff" font-size="26">ONE SHORT NAVIGATION</text><text x="600" y="336" text-anchor="middle" fill="#d9c26f" font-size="23">SUPPORTS ONE LONG WINTER</text>
    <rect x="70" y="105" width="300" height="120" rx="18" fill="#283746" stroke="#79a9c2" stroke-width="3"/><text x="220" y="147" text-anchor="middle" fill="#fff" font-size="24">WINTER</text><text x="220" y="180" text-anchor="middle" fill="#dceaf2" font-size="17">repair · ration · ice roads</text><text x="220" y="205" text-anchor="middle" fill="#dceaf2" font-size="17">radio and emergency air supply</text>
    <rect x="830" y="105" width="300" height="120" rx="18" fill="#334036" stroke="#92b399" stroke-width="3"/><text x="980" y="147" text-anchor="middle" fill="#fff" font-size="24">SPRING</text><text x="980" y="180" text-anchor="middle" fill="#e0eee2" font-size="17">procure · survey · build barges</text><text x="980" y="205" text-anchor="middle" fill="#e0eee2" font-size="17">move equipment above flood level</text>
    <rect x="830" y="405" width="300" height="120" rx="18" fill="#463d2c" stroke="#c9ad70" stroke-width="3"/><text x="980" y="447" text-anchor="middle" fill="#fff" font-size="24">SUMMER</text><text x="980" y="480" text-anchor="middle" fill="#f3e6ca" font-size="17">convoys · pilotage · unloading</text><text x="980" y="505" text-anchor="middle" fill="#f3e6ca" font-size="17">round-the-clock upriver movement</text>
    <rect x="70" y="405" width="300" height="120" rx="18" fill="#3e3030" stroke="#d68578" stroke-width="3"/><text x="220" y="447" text-anchor="middle" fill="#fff" font-size="24">AUTUMN</text><text x="220" y="480" text-anchor="middle" fill="#f3d9d3" font-size="17">rail and road distribution</text><text x="220" y="505" text-anchor="middle" fill="#f3d9d3" font-size="17">cache before freeze-up</text>
    <path d="M370 165C585 60 720 60 830 165" fill="none" stroke="#d9c26f" stroke-width="4" marker-end="url(#arrow)"/><path d="M980 225V405" stroke="#d9c26f" stroke-width="4" marker-end="url(#arrow)"/><path d="M830 465C620 570 480 570 370 465" fill="none" stroke="#d9c26f" stroke-width="4" marker-end="url(#arrow)"/><path d="M220 405V225" stroke="#d9c26f" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
