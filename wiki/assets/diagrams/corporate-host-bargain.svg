<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Corporate-host bargain</title><desc id="desc">The bargain grants associated governments territorial jurisdiction while preserving Japanese ownership and strategic control.</desc><rect width="1200" height="675" fill="#111821"/><text x="600" y="58" text-anchor="middle" fill="#f0e5c8" font-family="Georgia,serif" font-size="32">The corporate–host bargain</text><g font-family="Arial,sans-serif"><rect x="80" y="105" width="480" height="430" rx="14" fill="#20374f" stroke="#75a5cf" stroke-width="3"/><text x="320" y="153" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">JAPANESE CORPORATE RESERVE</text><g fill="#d8e7f4" font-size="20"><text x="135" y="215">• controlling voting ownership</text><text x="135" y="265">• group finance and insurance</text><text x="135" y="315">• patents and strategic technology</text><text x="135" y="365">• standards and system direction</text><text x="135" y="415">• capital allocation and senior appointments</text><text x="135" y="465">• access to the imperial market</text></g><rect x="640" y="105" width="480" height="430" rx="14" fill="#435434" stroke="#a8c77d" stroke-width="3"/><text x="880" y="153" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">HOST-STATE JURISDICTION</text><g fill="#e5efd8" font-size="20"><text x="695" y="215">• taxation and national labor law</text><text x="695" y="265">• police access and inspection</text><text x="695" y="315">• public roads, utilities, and emergency duties</text><text x="695" y="365">• language, schools, and local promotion</text><text x="695" y="415">• domestic suppliers and spare reserves</text><text x="695" y="465">• limits on new land privilege</text></g><rect x="250" y="565" width="700" height="70" rx="12" fill="#6a2934" stroke="#e5c36b" stroke-width="3"/><text x="600" y="608" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">GREATER JURISDICTION · INCOMPLETE INDUSTRIAL SOVEREIGNTY</text><path d="M560 320 H640" stroke="#e5c36b" stroke-width="7"/><path d="M600 535 V560" stroke="#e5c36b" stroke-width="7"/></g></svg>
