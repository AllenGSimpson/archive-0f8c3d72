<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Development and organization of National Renewal</title>
  <desc id="desc">Timeline from the late-1940s Lindbergh movement through Rockwell, Buchanan government, the Omaha Rules, Harwood, and the 1993 schism, with the party's principal organizational layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a23"/><stop offset="1" stop-color="#152d38"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 34px Georgia,serif;fill:#f3f5f5}.subtitle{font:17px 'Segoe UI',sans-serif;fill:#afc0c4}.line{stroke:#9eb9c0;stroke-width:5;fill:none}.tick{stroke:#d6e2e5;stroke-width:4}.phase{fill:#174d5a;stroke:#b9d3d8;stroke-width:2;filter:url(#shadow)}.late{fill:#204f82;stroke:#c6d7eb;stroke-width:2;filter:url(#shadow)}.crisis{fill:#654429;stroke:#e3bd78;stroke-width:2;filter:url(#shadow)}.year{font:700 17px 'Segoe UI',sans-serif;fill:#e7eeee;text-anchor:middle}.event{font:700 18px 'Segoe UI',sans-serif;fill:#fff;text-anchor:middle}.note{font:14px 'Segoe UI',sans-serif;fill:#c3d0d3;text-anchor:middle}.head{font:700 18px 'Segoe UI',sans-serif;fill:#e3bd78;letter-spacing:1.4px}.org{fill:#202d34;stroke:#849ba1;stroke-width:2}.orgtitle{font:700 17px 'Segoe UI',sans-serif;fill:#f3f5f5;text-anchor:middle}.orgnote{font:13px 'Segoe UI',sans-serif;fill:#afbec2;text-anchor:middle}.arrow{stroke:#708c93;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#708c93"/></marker>
  </defs>
  <rect width="1400" height="760" rx="18" fill="url(#bg)"/>
  <text x="60" y="58" class="title">National Renewal: Party Development and Organization</text>
  <text x="60" y="88" class="subtitle">From postwar nationalist coalition to governing party, federal association, and five-party schism</text>

  <path class="line" d="M105 235 H1295"/>
  <g transform="translate(140 235)"><path class="tick" d="M0 -15 V15"/><rect class="phase" x="-90" y="-115" width="180" height="82" rx="12"/><text class="year" y="-87">late 1940s</text><text class="event" y="-61">Lindbergh</text><text class="note" y="-40">national formation</text></g>
  <g transform="translate(330 235)"><path class="tick" d="M0 -15 V15"/><rect class="phase" x="-90" y="30" width="180" height="82" rx="12"/><text class="year" y="57">mid-1960s</text><text class="event" y="82">Rockwell</text><text class="note" y="103">youth and mass party</text></g>
  <g transform="translate(515 235)"><path class="tick" d="M0 -15 V15"/><rect class="crisis" x="-90" y="-115" width="180" height="82" rx="12"/><text class="year" y="-87">1968</text><text class="event" y="-61">Plurality</text><text class="note" y="-40">House selects Rockefeller</text></g>
  <g transform="translate(690 235)"><path class="tick" d="M0 -15 V15"/><rect class="crisis" x="-90" y="30" width="180" height="82" rx="12"/><text class="year" y="57">1975</text><text class="event" y="82">Assassination</text><text class="note" y="103">Buchanan prevents revolt</text></g>
  <g transform="translate(875 235)"><path class="tick" d="M0 -15 V15"/><rect class="late" x="-100" y="-115" width="200" height="82" rx="12"/><text class="year" y="-87">1977–1985</text><text class="event" y="-61">Buchanan government</text><text class="note" y="-40">peace · production · ascent</text></g>
  <g transform="translate(1065 235)"><path class="tick" d="M0 -15 V15"/><rect class="late" x="-90" y="30" width="180" height="82" rx="12"/><text class="year" y="57">1985</text><text class="event" y="82">Omaha Rules</text><text class="note" y="103">federalized competition</text></g>
  <g transform="translate(1255 235)"><path class="tick" d="M0 -15 V15"/><rect class="crisis" x="-95" y="-115" width="190" height="82" rx="12"/><text class="year" y="-87">1992–1993</text><text class="event" y="-61">Harwood and schism</text><text class="note" y="-40">five-party republic</text></g>

  <text x="60" y="400" class="head">ORGANIZATIONAL LAYERS AT THE BUCHANAN–OMAHA TRANSITION</text>
  <g transform="translate(190 485)"><rect class="org" x="-125" y="-50" width="250" height="100" rx="12"/><text class="orgtitle" y="-12">National committee</text><text class="orgnote" y="14">conventions · records · rules</text><text class="orgnote" y="36">Registrar and national coordination</text></g>
  <g transform="translate(500 485)"><rect class="org" x="-125" y="-50" width="250" height="100" rx="12"/><text class="orgtitle" y="-12">State associations</text><text class="orgnote" y="14">ballot lines · nominations</text><text class="orgnote" y="36">regional differentiation</text></g>
  <g transform="translate(810 485)"><rect class="org" x="-125" y="-50" width="250" height="100" rx="12"/><text class="orgtitle" y="-12">Elected caucuses</text><text class="orgnote" y="14">governors · Congress</text><text class="orgnote" y="36">institutional independence</text></g>
  <g transform="translate(1120 485)"><rect class="org" x="-125" y="-50" width="250" height="100" rx="12"/><text class="orgtitle" y="-12">Movement network</text><text class="orgnote" y="14">clubs · youth · veterans</text><text class="orgnote" y="36">media · shooting organizations</text></g>
  <path class="arrow" d="M315 485 H365"/><path class="arrow" d="M625 485 H675"/><path class="arrow" d="M935 485 H985"/>

  <g transform="translate(260 650)"><rect class="phase" x="-150" y="-45" width="300" height="90" rx="12"/><text class="orgtitle" y="-12">Constitutional Buchananites</text><text class="orgnote" y="15">lawful succession · family policy</text><text class="orgnote" y="36">economic nationalism</text></g>
  <g transform="translate(700 650)"><rect class="phase" x="-150" y="-45" width="300" height="90" rx="12"/><text class="orgtitle" y="-12">Mission technocrats</text><text class="orgnote" y="15">space · production · education</text><text class="orgnote" y="36">administrative competence</text></g>
  <g transform="translate(1140 650)"><rect class="phase" x="-150" y="-45" width="300" height="90" rx="12"/><text class="orgtitle" y="-12">Radical and Old Guard</text><text class="orgnote" y="15">corporatism · racial nationalism</text><text class="orgnote" y="36">constitutional rupture rejected</text></g>
</svg>
