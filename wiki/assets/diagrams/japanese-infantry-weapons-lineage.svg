<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese infantry weapons and cartridge transitions, 1939–1982</title>
  <desc id="desc">Two timelines show service rifles and automatic support weapons moving from 7.7 by 58 millimeter through 6.5 by 45 millimeter to 5.8 by 40 millimeter ammunition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111815"/><stop offset="1" stop-color="#20231d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .title{font:700 39px Georgia,serif;letter-spacing:3px;fill:#f3ead5}.sub{font:600 18px Arial,sans-serif;letter-spacing:2px;fill:#c8a45c}.axis{stroke:#6e715f;stroke-width:3}.tick{stroke:#6e715f;stroke-width:2}.year{font:700 18px Arial,sans-serif;fill:#d9d2bf}.row{font:700 19px Arial,sans-serif;letter-spacing:2px;fill:#c8a45c}.box{rx:12;stroke-width:2;filter:url(#shadow)}.name{font:700 21px Georgia,serif;fill:#f7f0df}.kind{font:600 14px Arial,sans-serif;letter-spacing:.8px;fill:#d8d0bd}.spec{font:13px Arial,sans-serif;fill:#bbb6a7}.cal{font:700 15px Arial,sans-serif;fill:#141713}.flow77{stroke:#b08363;stroke-width:5;fill:none}.flow65{stroke:#79a29a;stroke-width:5;fill:none}.flow58{stroke:#a69d6a;stroke-width:5;fill:none}.legend{font:15px Arial,sans-serif;fill:#d0c8b7}.note{font:italic 17px Georgia,serif;fill:#c9c4b5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="66" text-anchor="middle" class="title">JAPANESE INFANTRY-WEAPON LINEAGE</text>
  <text x="800" y="102" text-anchor="middle" class="sub">SERVICE RIFLES · AUTOMATIC SUPPORT · THREE CARTRIDGE ERAS</text>
  <line x1="220" y1="155" x2="1490" y2="155" class="axis"/>
  <g text-anchor="middle">
    <line x1="270" y1="143" x2="270" y2="168" class="tick"/><text x="270" y="194" class="year">1939</text>
    <line x1="485" y1="143" x2="485" y2="168" class="tick"/><text x="485" y="194" class="year">1947</text>
    <line x1="715" y1="143" x2="715" y2="168" class="tick"/><text x="715" y="194" class="year">1956–57</text>
    <line x1="940" y1="143" x2="940" y2="168" class="tick"/><text x="940" y="194" class="year">1964–68</text>
    <line x1="1210" y1="143" x2="1210" y2="168" class="tick"/><text x="1210" y="194" class="year">1978</text>
    <line x1="1390" y1="143" x2="1390" y2="168" class="tick"/><text x="1390" y="194" class="year">1982</text>
  </g>

  <text x="35" y="292" class="row">SERVICE RIFLES</text>
  <path d="M270 350 H485" class="flow77"/><path d="M485 350 H715" class="flow77"/>
  <path d="M715 350 H940" class="flow65"/><path d="M940 350 H1390" class="flow65"/><path d="M1390 350 H1480" class="flow58"/>
  <g>
    <rect x="155" y="245" width="230" height="130" class="box" fill="#4a3a31" stroke="#b08363"/><rect x="172" y="260" width="82" height="25" rx="5" fill="#b08363"/><text x="213" y="278" text-anchor="middle" class="cal">7.7×58</text><text x="270" y="307" text-anchor="middle" class="name">Type 99 Rifle</text><text x="270" y="335" text-anchor="middle" class="kind">BOLT ACTION · 5 ROUNDS</text><text x="270" y="358" text-anchor="middle" class="spec">Wartime service rifle</text>
    <rect x="370" y="405" width="230" height="130" class="box" fill="#4a3a31" stroke="#b08363"/><rect x="387" y="420" width="82" height="25" rx="5" fill="#b08363"/><text x="428" y="438" text-anchor="middle" class="cal">7.7×58</text><text x="485" y="467" text-anchor="middle" class="name">Type 7 Self-Loading</text><text x="485" y="495" text-anchor="middle" class="kind">SEMIAUTOMATIC · 20 ROUNDS</text><text x="485" y="518" text-anchor="middle" class="spec">Detachable · charger-loadable</text>
    <rect x="600" y="245" width="230" height="130" class="box" fill="#304744" stroke="#79a29a"/><rect x="617" y="260" width="82" height="25" rx="5" fill="#79a29a"/><text x="658" y="278" text-anchor="middle" class="cal">6.5×45</text><text x="715" y="307" text-anchor="middle" class="name">Type 16 Automatic</text><text x="715" y="335" text-anchor="middle" class="kind">SELECTIVE FIRE · 25 ROUNDS</text><text x="715" y="358" text-anchor="middle" class="spec">First universal rifle</text>
    <rect x="825" y="405" width="230" height="130" class="box" fill="#304744" stroke="#79a29a"/><rect x="842" y="420" width="82" height="25" rx="5" fill="#79a29a"/><text x="883" y="438" text-anchor="middle" class="cal">6.5×45</text><text x="940" y="467" text-anchor="middle" class="name">Type 24 Automatic</text><text x="940" y="495" text-anchor="middle" class="kind">SELECTIVE FIRE · 30 ROUNDS</text><text x="940" y="518" text-anchor="middle" class="spec">Standard imperial assault rifle</text>
    <rect x="1275" y="245" width="230" height="130" class="box" fill="#484536" stroke="#a69d6a"/><rect x="1292" y="260" width="82" height="25" rx="5" fill="#a69d6a"/><text x="1333" y="278" text-anchor="middle" class="cal">5.8×40</text><text x="1390" y="307" text-anchor="middle" class="name">Type 42 Rifle</text><text x="1390" y="335" text-anchor="middle" class="kind">BURST CAPABLE · 30 ROUNDS</text><text x="1390" y="358" text-anchor="middle" class="spec">Elite and home-island issue</text>
  </g>

  <text x="35" y="667" class="row">AUTOMATIC SUPPORT</text>
  <path d="M715 720 H940" class="flow77"/><path d="M940 720 H1210" class="flow65"/><path d="M1210 720 H1480" class="flow58"/>
  <g>
    <rect x="600" y="615" width="230" height="130" class="box" fill="#4a3a31" stroke="#b08363"/><rect x="617" y="630" width="82" height="25" rx="5" fill="#b08363"/><text x="658" y="648" text-anchor="middle" class="cal">7.7×58</text><text x="715" y="677" text-anchor="middle" class="name">Type 17 GPMG</text><text x="715" y="705" text-anchor="middle" class="kind">DISINTEGRATING BELT</text><text x="715" y="728" text-anchor="middle" class="spec">Full-power general-purpose gun</text>
    <rect x="825" y="760" width="230" height="110" class="box" fill="#304744" stroke="#79a29a"/><rect x="842" y="775" width="82" height="25" rx="5" fill="#79a29a"/><text x="883" y="793" text-anchor="middle" class="cal">6.5×45</text><text x="940" y="822" text-anchor="middle" class="name">Type 28 Universal MG</text><text x="940" y="850" text-anchor="middle" class="kind">SQUAD AND TRIPOD WEAPON</text>
    <rect x="1095" y="615" width="230" height="130" class="box" fill="#484536" stroke="#a69d6a"/><rect x="1112" y="630" width="82" height="25" rx="5" fill="#a69d6a"/><text x="1153" y="648" text-anchor="middle" class="cal">5.8×40</text><text x="1210" y="677" text-anchor="middle" class="name">Type 38 SAW</text><text x="1210" y="705" text-anchor="middle" class="kind">100-ROUND BELT BOX</text><text x="1210" y="728" text-anchor="middle" class="spec">Small-caliber squad automatic weapon</text>
  </g>

  <rect x="85" y="806" width="22" height="12" fill="#b08363"/><text x="118" y="817" class="legend">7.7×58 mm full-power inheritance</text><rect x="360" y="806" width="22" height="12" fill="#79a29a"/><text x="393" y="817" class="legend">6.5×45 mm universal-rifle era</text><rect x="665" y="806" width="22" height="12" fill="#a69d6a"/><text x="698" y="817" class="legend">5.8×40 mm small-caliber system</text>
  <text x="1510" y="866" text-anchor="end" class="note">Transitions overlap; new issue does not imply instant retirement of the preceding caliber.</text>
</svg>
