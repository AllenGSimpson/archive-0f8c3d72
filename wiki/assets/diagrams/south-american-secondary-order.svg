<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Secondary political order of South America</title><desc id="desc">Diagram comparing Venezuela's American security ceiling, Uruguay's neutral clearing role, Paraguay's proxy marketplace, and Bolivia's route diplomacy.</desc>
  <rect width="1200" height="760" fill="#101722"/><rect x="32" y="32" width="1136" height="696" rx="18" fill="#172233" stroke="#53657b" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" fill="#f0f4f8" font-family="Georgia,serif" font-size="31">Secondary political order of South America</text>
  <text x="600" y="108" text-anchor="middle" fill="#aebdca" font-family="Arial,sans-serif" font-size="16">four methods of preserving statehood under unequal pressure</text>
  <rect x="80" y="150" width="480" height="210" rx="14" fill="#293c54" stroke="#77a9d2" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">Venezuela</text><text x="320" y="218" text-anchor="middle" fill="#bcd7eb" font-family="Arial,sans-serif" font-size="14">conditional sovereignty after 1966</text>
  <text x="115" y="258" fill="#edf5fb" font-family="Arial,sans-serif" font-size="15">• oil operations reviewed</text><text x="115" y="287" fill="#edf5fb" font-family="Arial,sans-serif" font-size="15">• strategic communications supervised</text><text x="115" y="316" fill="#edf5fb" font-family="Arial,sans-serif" font-size="15">• American air and naval access</text><text x="115" y="345" fill="#edf5fb" font-family="Arial,sans-serif" font-size="15">• elections and domestic government retained</text>
  <rect x="640" y="150" width="480" height="210" rx="14" fill="#354632" stroke="#8eb982" stroke-width="2"/>
  <text x="880" y="190" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">Uruguay</text><text x="880" y="218" text-anchor="middle" fill="#d9ead3" font-family="Arial,sans-serif" font-size="14">neutral commercial venue after restoration</text>
  <text x="675" y="258" fill="#edf7ea" font-family="Arial,sans-serif" font-size="15">• no major foreign base</text><text x="675" y="287" fill="#edf7ea" font-family="Arial,sans-serif" font-size="15">• banking, insurance, arbitration, shipping</text><text x="675" y="316" fill="#edf7ea" font-family="Arial,sans-serif" font-size="15">• civilian legitimacy reconstructed</text><text x="675" y="345" fill="#edf7ea" font-family="Arial,sans-serif" font-size="15">• Punta del Este diplomatic niche</text>
  <rect x="80" y="430" width="480" height="210" rx="14" fill="#4b4030" stroke="#c9a967" stroke-width="2"/>
  <text x="320" y="470" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">Paraguay</text><text x="320" y="498" text-anchor="middle" fill="#eddfbd" font-family="Arial,sans-serif" font-size="14">authoritarian proxy marketplace</text>
  <text x="115" y="538" fill="#f7eedb" font-family="Arial,sans-serif" font-size="15">• river transit and re-export commerce</text><text x="115" y="567" fill="#f7eedb" font-family="Arial,sans-serif" font-size="15">• foreign networks under police control</text><text x="115" y="596" fill="#f7eedb" font-family="Arial,sans-serif" font-size="15">• Argentina balanced with Brazil</text><text x="115" y="625" fill="#f7eedb" font-family="Arial,sans-serif" font-size="15">• infrastructure distributed through patronage</text>
  <rect x="640" y="430" width="480" height="210" rx="14" fill="#493746" stroke="#c887b5" stroke-width="2"/>
  <text x="880" y="470" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">Bolivia</text><text x="880" y="498" text-anchor="middle" fill="#f0d8e9" font-family="Arial,sans-serif" font-size="14">mineral and route diplomacy</text>
  <text x="675" y="538" fill="#f7eaf3" font-family="Arial,sans-serif" font-size="15">• Pacific outlets through Chile or Peru</text><text x="675" y="567" fill="#f7eaf3" font-family="Arial,sans-serif" font-size="15">• Atlantic routes through three neighbors</text><text x="675" y="596" fill="#f7eaf3" font-family="Arial,sans-serif" font-size="15">• mineral concessions as bargaining capital</text><text x="675" y="625" fill="#f7eaf3" font-family="Arial,sans-serif" font-size="15">• influence extensive, control fragmented</text>
  <path d="M560 255 H640M560 535 H640" stroke="#aebdca" stroke-width="3" stroke-dasharray="9 7"/><path d="M320 360 V430M880 360 V430" stroke="#aebdca" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="600" y="688" text-anchor="middle" fill="#aebdca" font-family="Arial,sans-serif" font-size="14">The four states share no alliance; geography and rival patronage create the comparison.</text>
</svg>
