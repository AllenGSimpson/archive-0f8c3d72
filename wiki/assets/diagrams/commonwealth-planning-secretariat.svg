<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Commonwealth Planning Secretariat</title><desc id="desc">Nine planning divisions combine national returns into capacity, contract, and route-failure reports for the Commonwealth Council.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="33" font-weight="700">Commonwealth Planning Secretariat</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">A common capacity picture without a Commonwealth command economy</text><g font-family="Arial,sans-serif"><g fill="#19303d" stroke="#638091"><rect x="70" y="180" width="190" height="82" rx="11"/><rect x="285" y="180" width="190" height="82" rx="11"/><rect x="500" y="180" width="190" height="82" rx="11"/><rect x="715" y="180" width="190" height="82" rx="11"/><rect x="930" y="180" width="190" height="82" rx="11"/><rect x="178" y="286" width="190" height="82" rx="11"/><rect x="393" y="286" width="190" height="82" rx="11"/><rect x="608" y="286" width="190" height="82" rx="11"/><rect x="823" y="286" width="190" height="82" rx="11"/></g><g fill="#d8ca91" text-anchor="middle" font-size="15" font-weight="700"><text x="165" y="214">SHIPPING</text><text x="380" y="214">FOOD</text><text x="595" y="214">FUEL</text><text x="810" y="214">MINERALS</text><text x="1025" y="214">INDUSTRY</text><text x="273" y="320">DEFENSE</text><text x="488" y="320">COMMUNICATIONS</text><text x="703" y="320">STANDARDS</text><text x="918" y="320">ROUTES</text></g><g fill="#aebbc2" text-anchor="middle" font-size="12"><text x="165" y="239">tonnage · ports · repair</text><text x="380" y="239">supply · reserves · cold chain</text><text x="595" y="239">coal · oil · power</text><text x="810" y="239">ore · refining · stocks</text><text x="1025" y="239">yards · tools · capacity</text><text x="273" y="345">arsenals · compatibility</text><text x="488" y="345">cable · radio · signals</text><text x="703" y="345">interfaces · qualifications</text><text x="918" y="345">failure · diversion · substitute</text></g><rect x="310" y="421" width="580" height="94" rx="14" fill="#293846" stroke="#d1b86d" stroke-width="2"/><text x="600" y="456" fill="#f0e8d5" text-anchor="middle" font-size="18" font-weight="700">COMMON CAPACITY &amp; EXPOSURE RECORD</text><text x="600" y="487" fill="#b8c4ca" text-anchor="middle" font-size="14">promises · deliveries · shortfalls · substitute routes · earlier warnings</text><path d="M600 368V421M600 515V548" stroke="#b49a5a" stroke-width="3"/><rect x="405" y="548" width="390" height="58" rx="11" fill="#20333f" stroke="#587382"/><text x="600" y="583" fill="#dce2e4" text-anchor="middle" font-size="16" font-weight="700">COMMONWEALTH COUNCIL REPORTING</text></g><text x="600" y="628" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">National governments retain appropriation, execution, and the right to refuse.</text></svg>
