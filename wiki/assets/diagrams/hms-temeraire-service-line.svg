<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">HMS Temeraire service line</title><desc id="desc">Timeline from commissioning in 1952 to missile reconstruction and active 1985 configuration.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="35" font-weight="700">HMS <tspan font-style="italic">Temeraire</tspan></text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">From post-defeat prestige battleship to armored missile and command flagship</text><path d="M135 285H1065" stroke="#b49a5a" stroke-width="5"/><g fill="#d1b86d"><circle cx="190" cy="285" r="13"/><circle cx="585" cy="285" r="13"/><circle cx="1010" cy="285" r="13"/></g><g font-family="Arial,sans-serif"><text x="190" y="237" fill="#d6c586" text-anchor="middle" font-size="26" font-weight="700">1952</text><text x="585" y="237" fill="#d6c586" text-anchor="middle" font-size="26" font-weight="700">1968–1974</text><text x="1010" y="237" fill="#d6c586" text-anchor="middle" font-size="26" font-weight="700">1985</text><rect x="70" y="330" width="300" height="150" rx="14" fill="#19303d" stroke="#638091"/><rect x="450" y="330" width="300" height="150" rx="14" fill="#293846" stroke="#d1b86d"/><rect x="830" y="330" width="300" height="150" rx="14" fill="#19303d" stroke="#638091"/><g fill="#edf0ed" text-anchor="middle" font-size="16" font-weight="700"><text x="220" y="370">COMMISSIONED</text><text x="600" y="370">RECONSTRUCTED</text><text x="980" y="370">ACTIVE FLAGSHIP</text></g><g fill="#b5c1c6" text-anchor="middle" font-size="13"><text x="220" y="404">Lion-class capital ship</text><text x="220" y="428">visible recovery symbol</text><text x="220" y="452">sister Lion commissioned 1949</text><text x="600" y="404">after turret removed</text><text x="600" y="428">missiles · aviation · electronics</text><text x="600" y="452">expanded command spaces</text><text x="980" y="404">58,000 t full load</text><text x="980" y="428">6 × 406 mm · 64 SAM cells</text><text x="980" y="452">16 land-attack · 2 helicopters</text></g></g><path d="M170 560h860l55-18-45-17-150-12-92-46H400l-95 46-135 12-55 20z" fill="#263846" stroke="#668296" stroke-width="2"/><rect x="470" y="505" width="215" height="16" rx="3" fill="#3b5260"/><rect x="535" y="479" width="85" height="28" rx="3" fill="#3b5260"/><circle cx="455" cy="518" r="9" fill="#d1b86d"/><circle cx="495" cy="518" r="9" fill="#d1b86d"/><text x="600" y="620" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">“Two ships for the flag; hundreds for the route” left Temeraire exceptional, not a template for further battleships.</text></svg>
