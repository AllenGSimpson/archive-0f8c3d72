<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Human Mars expeditions from 1992 to the early 2000s</title><desc id="desc">Timeline of the German Marsplan 92, British Valles Marineris expedition, American corporate Mars settlement, and Japanese direct expedition.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#172e3c"/></linearGradient><style>.title{font:700 40px Georgia,serif;fill:#f3f8fb}.sub{font:18px Arial,sans-serif;fill:#aec5cf;letter-spacing:2px}.axis{stroke:#73909d;stroke-width:4}.tick{stroke:#73909d;stroke-width:3}.year{font:700 20px Arial,sans-serif;fill:#d8e5ea}.box{fill:#112838;stroke-width:3}.head{font:700 25px Arial,sans-serif;fill:#fff}.date{font:700 18px Arial,sans-serif}.copy{font:17px Arial,sans-serif;fill:#c8d8df}.g{stroke:#df6565}.u{stroke:#66bbe0}.b{stroke:#aa98df}.j{stroke:#e2b951}.foot{font:17px Arial,sans-serif;fill:#b8cbd3}</style></defs>
  <rect width="1800" height="900" fill="url(#bg)"/><text x="900" y="66" text-anchor="middle" class="title">HUMAN EXPEDITIONS TO MARS</text><text x="900" y="103" text-anchor="middle" class="sub">FOUR SYSTEMS · 1992–EARLY 2000s</text>
  <line x1="170" y1="450" x2="1630" y2="450" class="axis"/><g class="year"><line x1="220" y1="430" x2="220" y2="470" class="tick"/><text x="220" y="505" text-anchor="middle">1992</text><line x1="465" y1="430" x2="465" y2="470" class="tick"/><text x="465" y="505" text-anchor="middle">1994</text><line x1="710" y1="430" x2="710" y2="470" class="tick"/><text x="710" y="505" text-anchor="middle">1996</text><line x1="955" y1="430" x2="955" y2="470" class="tick"/><text x="955" y="505" text-anchor="middle">1998</text><line x1="1200" y1="430" x2="1200" y2="470" class="tick"/><text x="1200" y="505" text-anchor="middle">2000</text><line x1="1570" y1="430" x2="1570" y2="470" class="tick"/><text x="1570" y="505" text-anchor="middle">2003</text></g>
  <g transform="translate(110 155)"><rect width="535" height="220" rx="22" class="box g"/><text x="30" y="48" class="head">GERMANY · MARSPLAN 92</text><text x="30" y="80" class="date" fill="#ef8383">DEPARTS 1992 · ARRIVES 1993</text><text x="30" y="125" class="copy">Integrated ship assembled at the Raumhafen</text><text x="30" y="160" class="copy">Five surface elements · Tharsis–Olympus base</text><text x="30" y="195" class="copy">First human arrival and Olympus rover traverse</text></g><line x1="340" y1="375" x2="340" y2="450" class="tick"/>
  <g transform="translate(740 155)"><rect width="500" height="220" rx="22" class="box b"/><text x="30" y="48" class="head">BRITISH COMMONWEALTH</text><text x="30" y="80" class="date" fill="#bba9ee">LANDS 1998</text><text x="30" y="125" class="copy">Greenwich Compact direct expedition</text><text x="30" y="160" class="copy">Complete independent mission chain</text><text x="30" y="195" class="copy">Western Valles Marineris</text></g><line x1="990" y1="375" x2="990" y2="450" class="tick"/>
  <g transform="translate(920 555)"><rect width="540" height="220" rx="22" class="box u"/><text x="30" y="48" class="head">AMERICAN CORPORATE PROGRAM</text><text x="30" y="80" class="date" fill="#80d2f2">FIRST CREW 1999 · RETURN c. 2001</text><text x="30" y="125" class="copy">Reconnaissance 1994 · cargo package 1996</text><text x="30" y="160" class="copy">Frontier-led settlement west of Olympus</text><text x="30" y="195" class="copy">Overlapping crews create continuing occupation</text></g><line x1="1165" y1="450" x2="1165" y2="555" class="tick"/>
  <g transform="translate(1300 155)"><rect width="410" height="220" rx="22" class="box j"/><text x="30" y="48" class="head">EMPIRE OF JAPAN</text><text x="30" y="80" class="date" fill="#f0cb70">EARLY 2000s</text><text x="30" y="125" class="copy">Long robotic preparation</text><text x="30" y="160" class="copy">Compact direct architecture</text><text x="30" y="195" class="copy">Exact landing year and site open</text></g><line x1="1510" y1="375" x2="1510" y2="450" class="tick"/>
  <text x="900" y="840" text-anchor="middle" class="foot">The Latin Space Community chose Ceres rather than a fifth Mars landing.</text>
</svg>
