<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">German post-1948 role-series aircraft register</title>
  <desc id="desc">Five continuing German aircraft design branches under the Reichsluftgeraetordnung role-series register. Exact post-1948 acceptance ordinals remain open.</desc>
  <rect width="1200" height="700" rx="28" fill="#151c1f"/>
  <text x="600" y="62" text-anchor="middle" fill="#f1e6cf" font-family="Georgia,serif" font-size="34" font-weight="700">German post-1948 aircraft register</text>
  <text x="600" y="94" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="18">national role-series ordinals · design-authority prefixes · exact acceptance chronology open</text>

  <rect x="92" y="130" width="1016" height="92" rx="18" fill="#233137" stroke="#bd7769" stroke-width="3"/>
  <text x="600" y="166" text-anchor="middle" fill="#f1e6cf" font-family="Arial,sans-serif" font-size="20" font-weight="700">Wartime designations remain grandfathered</text>
  <text x="600" y="197" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="16">Me 262 · Ta 183 · Ho 229 · Ar 234 · other aircraft already accepted under the wartime system</text>
  <path d="M600 222 V270" stroke="#bd7769" stroke-width="4"/>
  <polygon points="588,258 600,278 612,258" fill="#bd7769"/>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(38 292)">
      <rect width="210" height="230" rx="18" fill="#29383e" stroke="#82a7b0" stroke-width="3"/>
      <text x="105" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Messerschmitt</text>
      <text x="105" y="72" fill="#d9e0e2" font-size="16">high-speed interception</text>
      <text x="105" y="105" fill="#bac6c8" font-size="14">Me design authority</text>
      <text x="105" y="132" fill="#bac6c8" font-size="14">fighter role series (J)</text>
      <line x1="30" y1="153" x2="180" y2="153" stroke="#52666d"/>
      <text x="105" y="182" fill="#e1c477" font-size="15" font-weight="700">accepted ordinal open</text>
      <text x="105" y="207" fill="#bac6c8" font-size="13">former Me 501 withdrawn</text>
    </g>
    <g transform="translate(266 292)">
      <rect width="210" height="230" rx="18" fill="#29383e" stroke="#a0ad79" stroke-width="3"/>
      <text x="105" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Focke-Wulf</text>
      <text x="105" y="72" fill="#d9e0e2" font-size="16">fighter and support work</text>
      <text x="105" y="105" fill="#bac6c8" font-size="14">Fw design authority</text>
      <text x="105" y="132" fill="#bac6c8" font-size="14">fighter / support series</text>
      <line x1="30" y1="153" x2="180" y2="153" stroke="#52666d"/>
      <text x="105" y="182" fill="#e1c477" font-size="15" font-weight="700">accepted ordinals open</text>
      <text x="105" y="207" fill="#bac6c8" font-size="13">former Fw 502 withdrawn</text>
    </g>
    <g transform="translate(494 292)">
      <rect width="210" height="230" rx="18" fill="#29383e" stroke="#c69b71" stroke-width="3"/>
      <text x="105" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Arado</text>
      <text x="105" y="72" fill="#d9e0e2" font-size="16">strike / reconnaissance</text>
      <text x="105" y="105" fill="#bac6c8" font-size="14">Ar design authority</text>
      <text x="105" y="132" fill="#bac6c8" font-size="14">support / reconnaissance</text>
      <line x1="30" y1="153" x2="180" y2="153" stroke="#52666d"/>
      <text x="105" y="182" fill="#e1c477" font-size="15" font-weight="700">accepted ordinals open</text>
      <text x="105" y="207" fill="#bac6c8" font-size="13">former Ar 503 withdrawn</text>
    </g>
    <g transform="translate(722 292)">
      <rect width="210" height="230" rx="18" fill="#29383e" stroke="#968db1" stroke-width="3"/>
      <text x="105" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Horten-Gotha</text>
      <text x="105" y="72" fill="#d9e0e2" font-size="16">flying-wing families</text>
      <text x="105" y="105" fill="#bac6c8" font-size="14">Ho design authority</text>
      <text x="105" y="132" fill="#bac6c8" font-size="14">fighter / recon / bomber</text>
      <line x1="30" y1="153" x2="180" y2="153" stroke="#52666d"/>
      <text x="105" y="182" fill="#e1c477" font-size="15" font-weight="700">accepted ordinals open</text>
      <text x="105" y="207" fill="#bac6c8" font-size="13">former Ho 505 withdrawn</text>
    </g>
    <g transform="translate(950 292)">
      <rect width="210" height="230" rx="18" fill="#29383e" stroke="#789d91" stroke-width="3"/>
      <text x="105" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Junkers</text>
      <text x="105" y="72" fill="#d9e0e2" font-size="16">maritime / heavy systems</text>
      <text x="105" y="105" fill="#bac6c8" font-size="14">Ju design authority</text>
      <text x="105" y="132" fill="#bac6c8" font-size="14">maritime role series (Se)</text>
      <line x1="30" y1="153" x2="180" y2="153" stroke="#52666d"/>
      <text x="105" y="182" fill="#e1c477" font-size="15" font-weight="700">accepted ordinal open</text>
      <text x="105" y="207" fill="#bac6c8" font-size="13">former Ju 506 withdrawn</text>
    </g>
  </g>

  <rect x="230" y="568" width="740" height="66" rx="14" fill="#202b2f" stroke="#52666d" stroke-width="2"/>
  <text x="600" y="595" text-anchor="middle" fill="#f1e6cf" font-family="Arial,sans-serif" font-size="17" font-weight="700">Company projects do not consume service numbers until national acceptance</text>
  <text x="600" y="619" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="14">The superseded 500-series catalog is not an operational register.</text>
  <text x="600" y="674" text-anchor="middle" fill="#c2cdd0" font-family="Arial,sans-serif" font-size="15">J fighter · S support · B bomber · A reconnaissance · Se maritime · T / Sch / H / Vb supporting categories</text>
</svg>
