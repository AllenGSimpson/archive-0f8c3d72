<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">First German clean-register aircraft generation</title>
  <desc id="desc">Five German 500-series aircraft introduced from 1956 through 1962, arranged by mission and date.</desc>
  <rect width="1200" height="700" rx="28" fill="#151c1f"/>
  <text x="600" y="62" text-anchor="middle" fill="#f1e6cf" font-family="Georgia,serif" font-size="34" font-weight="700">First clean-register generation</text>
  <text x="600" y="94" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="18">purpose-built 500-series aircraft · five distinct missions · 1956–1962</text>
  <line x1="92" y1="352" x2="1105" y2="352" stroke="#bd7769" stroke-width="5"/><polygon points="1105,328 1153,352 1105,376" fill="#bd7769"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(38 126)"><rect width="190" height="180" rx="18" fill="#29383e" stroke="#82a7b0" stroke-width="3"/><text x="95" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Me 501A-1 Falke</text><text x="95" y="68" fill="#d9e0e2" font-size="17">1956</text><text x="95" y="103" fill="#bac6c8" font-size="14">all-weather interceptor</text><text x="95" y="130" fill="#bac6c8" font-size="14">1,620 km/h</text><text x="95" y="155" fill="#bac6c8" font-size="14">four missiles</text><line x1="95" y1="180" x2="95" y2="226" stroke="#82a7b0" stroke-width="3"/></g>
    <g transform="translate(261 398)"><rect width="190" height="180" rx="18" fill="#29383e" stroke="#a0ad79" stroke-width="3"/><text x="95" y="38" fill="#f1e6cf" font-size="18" font-weight="700">Fw 502A-1 Habicht</text><text x="95" y="68" fill="#d9e0e2" font-size="17">1957</text><text x="95" y="103" fill="#bac6c8" font-size="14">frontline fighter</text><text x="95" y="130" fill="#bac6c8" font-size="14">1,490 km/h</text><text x="95" y="155" fill="#bac6c8" font-size="14">two missiles</text><line x1="95" y1="-46" x2="95" y2="0" stroke="#a0ad79" stroke-width="3"/></g>
    <g transform="translate(484 126)"><rect width="190" height="180" rx="18" fill="#29383e" stroke="#c69b71" stroke-width="3"/><text x="95" y="38" fill="#f1e6cf" font-size="18" font-weight="700">Ar 503A-1 Blitz II</text><text x="95" y="68" fill="#d9e0e2" font-size="17">1958</text><text x="95" y="103" fill="#bac6c8" font-size="14">strike / reconnaissance</text><text x="95" y="130" fill="#bac6c8" font-size="14">1,670 km/h</text><text x="95" y="155" fill="#bac6c8" font-size="14">4,000 kg stores</text><line x1="95" y1="180" x2="95" y2="226" stroke="#c69b71" stroke-width="3"/></g>
    <g transform="translate(707 398)"><rect width="190" height="180" rx="18" fill="#29383e" stroke="#968db1" stroke-width="3"/><text x="95" y="34" fill="#f1e6cf" font-size="17" font-weight="700">Ho 505A-1</text><text x="95" y="58" fill="#f1e6cf" font-size="17" font-weight="700">Nachtflügel</text><text x="95" y="86" fill="#d9e0e2" font-size="17">1961</text><text x="95" y="118" fill="#bac6c8" font-size="14">penetration recon</text><text x="95" y="145" fill="#bac6c8" font-size="14">2,200 km radius</text><text x="95" y="168" fill="#bac6c8" font-size="14">5,000 kg internal</text><line x1="95" y1="-46" x2="95" y2="0" stroke="#968db1" stroke-width="3"/></g>
    <g transform="translate(930 126)"><rect width="190" height="180" rx="18" fill="#29383e" stroke="#789d91" stroke-width="3"/><text x="95" y="38" fill="#f1e6cf" font-size="19" font-weight="700">Ju 506A-1</text><text x="95" y="68" fill="#d9e0e2" font-size="17">1962</text><text x="95" y="103" fill="#bac6c8" font-size="14">maritime / electronic</text><text x="95" y="130" fill="#bac6c8" font-size="14">reconnaissance</text><text x="95" y="155" fill="#bac6c8" font-size="14">3,500 km radius</text><line x1="95" y1="180" x2="95" y2="226" stroke="#789d91" stroke-width="3"/></g>
    <circle cx="133" cy="352" r="9" fill="#e1c477"/><circle cx="356" cy="352" r="9" fill="#e1c477"/><circle cx="579" cy="352" r="9" fill="#e1c477"/><circle cx="802" cy="352" r="9" fill="#e1c477"/><circle cx="1025" cy="352" r="9" fill="#e1c477"/>
  </g>
  <text x="600" y="644" text-anchor="middle" fill="#c2cdd0" font-family="Arial,sans-serif" font-size="17">the 500 block regularizes public designations while preserving separate interceptor, fighter, strike, penetration, and maritime branches</text>
</svg>
