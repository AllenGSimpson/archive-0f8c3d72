<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Leadership of the Five Powers in 2000</title>
  <desc id="desc">Five panels identify fixed German, American and British leadership and explicitly mark later Japanese executive and Italian succession as open.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#111d29"/></linearGradient></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg2)"/>
  <text x="55" y="66" fill="#eef4f6" font-family="Georgia,serif" font-size="31">Who governs at the threshold?</text>
  <text x="55" y="99" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">Fixed offices are stated directly; unresolved successions remain visible rather than filled by inference</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(45 150)"><rect width="210" height="355" rx="16" fill="#231d20" stroke="#8e665d" stroke-width="3"/><text x="105" y="44" text-anchor="middle" fill="#f3e8e5" font-size="20" font-weight="700">GERMANY</text><circle cx="105" cy="112" r="42" fill="#8e665d"/><text x="105" y="119" text-anchor="middle" fill="#fff" font-size="24">W</text><text x="105" y="184" text-anchor="middle" fill="#edf2f4" font-size="17" font-weight="700">Wolfgang Hitler</text><text x="105" y="210" text-anchor="middle" fill="#bcc9cf" font-size="14">Führer · age 52</text><path d="M32 246H178" stroke="#4f3b40"/><text x="105" y="278" text-anchor="middle" fill="#d0bcc0" font-size="14">Adult household;</text><text x="105" y="300" text-anchor="middle" fill="#d0bcc0" font-size="14">later designation open</text><rect x="36" y="320" width="138" height="24" rx="12" fill="#4a3137"/><text x="105" y="337" text-anchor="middle" fill="#f5e9ec" font-size="12" font-weight="700">FIXED</text></g>
    <g transform="translate(270 150)"><rect width="210" height="355" rx="16" fill="#1b2825" stroke="#648f8c" stroke-width="3"/><text x="105" y="44" text-anchor="middle" fill="#e4f1ef" font-size="20" font-weight="700">UNITED STATES</text><circle cx="105" cy="112" r="42" fill="#648f8c"/><text x="105" y="119" text-anchor="middle" fill="#fff" font-size="24">H</text><text x="105" y="184" text-anchor="middle" fill="#edf2f4" font-size="17" font-weight="700">Andrew Hale</text><text x="105" y="210" text-anchor="middle" fill="#bcc9cf" font-size="14">President · 1997–2001</text><path d="M32 246H178" stroke="#385451"/><text x="105" y="278" text-anchor="middle" fill="#bad1ce" font-size="14">Bounded stability</text><text x="105" y="300" text-anchor="middle" fill="#bad1ce" font-size="14">mandate</text><rect x="36" y="320" width="138" height="24" rx="12" fill="#315955"/><text x="105" y="337" text-anchor="middle" fill="#e7f4f2" font-size="12" font-weight="700">FIXED</text></g>
    <g transform="translate(495 150)"><rect width="210" height="355" rx="16" fill="#1c242c" stroke="#657d93" stroke-width="3"/><text x="105" y="44" text-anchor="middle" fill="#e7edf3" font-size="20" font-weight="700">COMMONWEALTH</text><circle cx="105" cy="112" r="42" fill="#657d93"/><text x="105" y="119" text-anchor="middle" fill="#fff" font-size="24">E/M</text><text x="105" y="178" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="700">Elizabeth II</text><text x="105" y="202" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="700">Edward Mallory</text><text x="105" y="225" text-anchor="middle" fill="#bcc9cf" font-size="13">Sovereign · premier</text><path d="M32 246H178" stroke="#3c4d5e"/><text x="105" y="278" text-anchor="middle" fill="#c0ccd6" font-size="14">Mars settlement</text><text x="105" y="300" text-anchor="middle" fill="#c0ccd6" font-size="14">preserved across parties</text><rect x="36" y="320" width="138" height="24" rx="12" fill="#3b5369"/><text x="105" y="337" text-anchor="middle" fill="#edf4fa" font-size="12" font-weight="700">FIXED</text></g>
    <g transform="translate(720 150)"><rect width="210" height="355" rx="16" fill="#26231c" stroke="#b49962" stroke-width="3"/><text x="105" y="44" text-anchor="middle" fill="#f7f0de" font-size="20" font-weight="700">JAPAN</text><circle cx="105" cy="112" r="42" fill="#b49962"/><text x="105" y="119" text-anchor="middle" fill="#191711" font-size="24">A</text><text x="105" y="184" text-anchor="middle" fill="#edf2f4" font-size="17" font-weight="700">Akihito</text><text x="105" y="210" text-anchor="middle" fill="#bcc9cf" font-size="14">Emperor</text><path d="M32 246H178" stroke="#514a38"/><text x="105" y="278" text-anchor="middle" fill="#d4c9ad" font-size="14">Post-Nakasone</text><text x="105" y="300" text-anchor="middle" fill="#d4c9ad" font-size="14">premier not named</text><rect x="36" y="320" width="138" height="24" rx="12" fill="#655a3a"/><text x="105" y="337" text-anchor="middle" fill="#fff2ce" font-size="12" font-weight="700">PARTLY OPEN</text></g>
    <g transform="translate(945 150)"><rect width="210" height="355" rx="16" fill="#25271d" stroke="#7c8d67" stroke-width="3"/><text x="105" y="44" text-anchor="middle" fill="#edf1e4" font-size="20" font-weight="700">LATIN SYSTEM</text><circle cx="105" cy="112" r="42" fill="#7c8d67"/><text x="105" y="119" text-anchor="middle" fill="#fff" font-size="22">LI</text><text x="105" y="180" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="700">Common</text><text x="105" y="202" text-anchor="middle" fill="#edf2f4" font-size="16" font-weight="700">institutions</text><text x="105" y="225" text-anchor="middle" fill="#bcc9cf" font-size="13">No bloc sovereign</text><path d="M32 246H178" stroke="#4a4f39"/><text x="105" y="278" text-anchor="middle" fill="#cad2bc" font-size="14">Later Savoy and</text><text x="105" y="300" text-anchor="middle" fill="#cad2bc" font-size="14">executive order open</text><rect x="36" y="320" width="138" height="24" rx="12" fill="#4b5638"/><text x="105" y="337" text-anchor="middle" fill="#eff5e5" font-size="12" font-weight="700">OPEN</text></g>
  </g>
  <text x="600" y="566" text-anchor="middle" fill="#d5bd73" font-family="Arial,sans-serif" font-size="16" font-weight="700">Institutional continuity is canon even where an officeholder is not.</text>
  <text x="600" y="590" text-anchor="middle" fill="#8297a5" font-family="Arial,sans-serif" font-size="13">The comparison records gaps; it does not silently resolve them.</text>
</svg>
