<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">American Christian-Zionist support channels</title><desc id="desc">A network diagram showing American congregations and religious media funding lawful relief, bonds and development in Israel, with indirect defense effects and a disputed diversion route to militant intermediaries.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10181d"/><stop offset="1" stop-color="#21282e"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#9fb8c8"/></marker><marker id="warn" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d09877"/></marker><style>.title{font:700 39px Georgia,serif;fill:#f4efe5}.sub{font:18px system-ui,sans-serif;letter-spacing:3px;fill:#b6c7ce}.box{fill:#26353d;stroke:#7899aa;stroke-width:3}.aid{fill:#2a3935;stroke:#84aa96;stroke-width:3}.state{fill:#39372c;stroke:#cfb66b;stroke-width:4}.risk{fill:#432f2d;stroke:#ce8c75;stroke-width:3;stroke-dasharray:9 7}.head{font:700 22px system-ui,sans-serif;fill:#fff}.copy{font:17px system-ui,sans-serif;fill:#cad6da}.wire{fill:none;stroke:#9fb8c8;stroke-width:4;marker-end:url(#arr)}.indirect{fill:none;stroke:#cfb66b;stroke-width:4;stroke-dasharray:8 7;marker-end:url(#arr)}.warning{fill:none;stroke:#d09877;stroke-width:4;stroke-dasharray:7 7;marker-end:url(#warn)}.foot{font:italic 18px Georgia,serif;fill:#d6d8d5}</style></defs>
  <rect width="1400" height="820" rx="24" fill="url(#bg)"/><text x="70" y="72" class="title">Relief, investment, and the contested military boundary</text><text x="70" y="108" class="sub">AMERICAN CHRISTIAN-ZIONIST SUPPORT · EARLY 1950s</text>
  <g transform="translate(70 190)"><rect width="270" height="160" rx="14" class="box"/><text x="18" y="52" class="head">Donor networks</text><text x="18" y="86" class="copy">church offerings · radio</text><text x="18" y="115" class="copy">Bible institutes · conferences</text><text x="18" y="144" class="copy">direct mail · visiting speakers</text></g>
  <g transform="translate(445 160)"><rect width="300" height="210" rx="14" class="aid"/><text x="18" y="50" class="head">Lawful channels</text><text x="18" y="84" class="copy">relief organizations</text><text x="18" y="113" class="copy">Israeli bonds and credit</text><text x="18" y="142" class="copy">hospitals and housing</text><text x="18" y="171" class="copy">food and farm machinery</text><text x="18" y="200" class="copy">audited development projects</text></g>
  <g transform="translate(870 160)"><rect width="300" height="210" rx="14" class="state"/><text x="18" y="50" class="head">Israeli civilian system</text><text x="18" y="84" class="copy">refugee absorption · medicine</text><text x="18" y="113" class="copy">agriculture · infrastructure</text><text x="18" y="142" class="copy">foreign-exchange relief</text><text x="18" y="180" class="copy">frees domestic resources</text></g>
  <g transform="translate(1010 500)"><rect width="300" height="150" rx="14" class="state"/><text x="18" y="50" class="head">Defense capacity</text><text x="18" y="84" class="copy">taxes · fuel · mobilization</text><text x="18" y="113" class="copy">maintenance · ammunition</text></g>
  <g transform="translate(455 500)"><rect width="330" height="150" rx="14" class="risk"/><text x="18" y="50" class="head">Disputed diversion</text><text x="18" y="84" class="copy">frontier and medical fronts</text><text x="18" y="113" class="copy">Revisionist intermediaries</text></g>
  <path d="M340 270H445" class="wire"/><path d="M745 270H870" class="wire"/><path d="M1080 370V500" class="indirect"/><path d="M595 370V500" class="warning"/><path d="M785 575H1010" class="warning"/>
  <text x="700" y="745" text-anchor="middle" class="foot">The 1954–55 Palestine Funds controversy concerned the dashed route, not the legality of the whole support system.</text>
</svg>
