<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Corporate politics in the GEACPS</title><desc id="desc">Tokyo sets the strategic envelope, Japanese corporate houses operate economic systems, and associated governments administer national jurisdiction while patronage networks shape politics.</desc><rect width="1200" height="675" fill="#101722"/><text x="600" y="54" text-anchor="middle" fill="#f1e7cb" font-family="Georgia,serif" font-size="31">Corporate politics in the Co-Prosperity Sphere</text><g font-family="Arial,sans-serif"><rect x="420" y="90" width="360" height="105" rx="12" fill="#8f2534" stroke="#e6c873" stroke-width="3"/><text x="600" y="132" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">TOKYO</text><text x="600" y="164" text-anchor="middle" fill="#f9e8dc" font-size="17">defense · ownership · technology · routes</text><rect x="90" y="285" width="430" height="150" rx="12" fill="#253c58" stroke="#79a7cf" stroke-width="3"/><text x="305" y="328" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">JAPANESE CORPORATE HOUSES</text><text x="305" y="362" text-anchor="middle" fill="#d9e8f4" font-size="17">credit · standards · logistics · investment</text><text x="305" y="392" text-anchor="middle" fill="#d9e8f4" font-size="17">technology · careers · commercial information</text><rect x="680" y="285" width="430" height="150" rx="12" fill="#4b5a37" stroke="#abc77e" stroke-width="3"/><text x="895" y="328" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ASSOCIATED GOVERNMENTS</text><text x="895" y="362" text-anchor="middle" fill="#e5efd8" font-size="17">tax · police · labor · language · public access</text><text x="895" y="392" text-anchor="middle" fill="#e5efd8" font-size="17">citizenship · courts · ministries · elections</text><rect x="260" y="525" width="680" height="95" rx="12" fill="#4d365a" stroke="#bf91d0" stroke-width="3"/><text x="600" y="564" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">POLITICAL ENVIRONMENT</text><text x="600" y="596" text-anchor="middle" fill="#eeddf5" font-size="17">parties · media · institutes · schools · civic groups · development coalitions</text><g stroke="#d6b96d" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M500 195 L360 280"/><path d="M700 195 L840 280"/><path d="M520 360 L670 360"/><path d="M340 435 L500 520"/><path d="M860 435 L700 520"/></g></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d6b96d"/></marker></defs></svg>
