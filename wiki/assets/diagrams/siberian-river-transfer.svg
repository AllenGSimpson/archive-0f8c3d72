<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Siberian sea-to-river cargo transfer</title><desc id="desc">Cargo moves from ocean freighter to Arctic port, shallow-draft river fleet, inland railhead, and final local distribution.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d9c26f"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#07151e"/><text x="600" y="58" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">SEA–RIVER–RAIL TRANSFER CHAIN</text>
  <path d="M125 295H1075" stroke="#21485a" stroke-width="34" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <rect x="35" y="190" width="210" height="155" rx="18" fill="#253746" stroke="#73a8c7" stroke-width="3"/><text x="140" y="235" text-anchor="middle" fill="#fff" font-size="22">OCEAN SHIP</text><text x="140" y="272" text-anchor="middle" fill="#dceaf2" font-size="16">food · machinery</text><text x="140" y="297" text-anchor="middle" fill="#dceaf2" font-size="16">fuel · medicines</text>
    <rect x="330" y="145" width="220" height="245" rx="18" fill="#3c3428" stroke="#cba76d" stroke-width="3"/><text x="440" y="195" text-anchor="middle" fill="#fff" font-size="22">ARCTIC PORT</text><text x="440" y="232" text-anchor="middle" fill="#f4e6ca" font-size="16">pilot · lighter · crane</text><text x="440" y="257" text-anchor="middle" fill="#f4e6ca" font-size="16">warehouse · customs</text><text x="440" y="282" text-anchor="middle" fill="#f4e6ca" font-size="16">repair · fuel · radio</text><text x="440" y="335" text-anchor="middle" fill="#d9c26f" font-size="17">principal bottleneck</text>
    <rect x="635" y="190" width="220" height="155" rx="18" fill="#293a31" stroke="#86b98e" stroke-width="3"/><text x="745" y="235" text-anchor="middle" fill="#fff" font-size="22">RIVER FLEET</text><text x="745" y="272" text-anchor="middle" fill="#dff1e2" font-size="16">tug · barge · tanker</text><text x="745" y="297" text-anchor="middle" fill="#dff1e2" font-size="16">shallow-draft freighter</text>
    <rect x="940" y="190" width="225" height="155" rx="18" fill="#2d3148" stroke="#8797c4" stroke-width="3"/><text x="1052" y="235" text-anchor="middle" fill="#fff" font-size="22">INLAND SYSTEM</text><text x="1052" y="272" text-anchor="middle" fill="#e1e5f3" font-size="16">railhead · truck · air</text><text x="1052" y="297" text-anchor="middle" fill="#e1e5f3" font-size="16">winter road · local boat</text>
    <path d="M245 267H330" stroke="#d9c26f" stroke-width="5" marker-end="url(#arrow)"/><path d="M550 267H635" stroke="#d9c26f" stroke-width="5" marker-end="url(#arrow)"/><path d="M855 267H940" stroke="#d9c26f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="455" text-anchor="middle" fill="#f0d98b" font-size="20">Every transfer consumes time, labor, fuel, dry storage, and political permission.</text><text x="600" y="495" text-anchor="middle" fill="#bfc8cb" font-size="17">A cargo is strategically useful only when it reaches an inland recipient before freeze-up.</text>
  </g>
</svg>
