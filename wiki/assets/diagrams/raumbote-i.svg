<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Raumbote I and the satellite shock</title><desc id="desc">Germany's 1957 first satellite triggers British and American institutional responses and becomes a symbol of the applied-systems era.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#e1c36f"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#050f1d"/><circle cx="600" cy="250" r="83" fill="#14354d" stroke="#76bad4" stroke-width="4"/><path d="M540 272Q600 210 660 272" fill="none" stroke="#8ed0e6" stroke-width="4"/><ellipse cx="600" cy="250" rx="178" ry="86" fill="none" stroke="#d8bc68" stroke-width="3" stroke-dasharray="10 8" transform="rotate(-18 600 250)"/><circle cx="761" cy="204" r="13" fill="#f2d77a"/><path d="M748 194l-25-19M773 213l25 19" stroke="#f2d77a" stroke-width="5"/>
  <text x="600" y="54" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">RAUMBOTE I · 1957</text>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="135" width="280" height="230" rx="18" fill="#3a2a2d" stroke="#d47b7f" stroke-width="3"/><text x="195" y="180" text-anchor="middle" fill="#fff" font-size="22">GERMAN MILESTONE</text><text x="195" y="225" text-anchor="middle" fill="#f2d6d8" font-size="17">first artificial satellite</text><text x="195" y="255" text-anchor="middle" fill="#f2d6d8" font-size="17">radio and science payload</text><text x="195" y="300" text-anchor="middle" fill="#ffd89a" font-size="17">ANNOUNCED IN ORBIT</text>
    <rect x="865" y="105" width="280" height="290" rx="18" fill="#253643" stroke="#78aecb" stroke-width="3"/><text x="1005" y="150" text-anchor="middle" fill="#fff" font-size="22">SATELLITE SHOCK</text><text x="1005" y="198" text-anchor="middle" fill="#dbeaf2" font-size="17">British Silent Overflight</text><text x="1005" y="228" text-anchor="middle" fill="#dbeaf2" font-size="17">American Aerospace Command</text><text x="1005" y="258" text-anchor="middle" fill="#dbeaf2" font-size="17">spaceplane acceleration</text><text x="1005" y="308" text-anchor="middle" fill="#ffd89a" font-size="17">A GLOBAL CONTEST BEGINS</text>
    <path d="M335 250H405" stroke="#e1c36f" stroke-width="5" marker-end="url(#arrow)"/><path d="M792 250H853" stroke="#e1c36f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="455" text-anchor="middle" fill="#cbe4ea" font-size="20">A small payload produced an institutional transformation</text>
  </g>
</svg>
