<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Limited Southern War theater, 1941–1942</title>
  <desc id="desc">A schematic map of Japanese offensives through Malaya, the East Indies, Burma, and the short southern perimeter while the American Philippines remain neutral.</desc>
  <rect width="760" height="520" fill="#101511"/>
  <rect x="22" y="22" width="716" height="476" rx="4" fill="#171d18" stroke="#596057"/>
  <text x="48" y="58" fill="#d4b358" font-family="Georgia,serif" font-size="22">THE LIMITED SOUTHERN WAR</text>
  <text x="48" y="82" fill="#aeb5aa" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">SCHEMATIC THEATER · DECEMBER 1941–LATE 1942</text>
  <g fill="#29322b" stroke="#697268" stroke-width="1.3">
    <path d="M118 108l94 16 45 55-28 76-94 21-52-66z"/>
    <path d="M257 179l55-42 66 27 15 84-48 89-47-36 5-70z"/>
    <path d="M347 340l98-28 94 36-17 50-128 5z"/>
    <path d="M477 174l83-29 49 54-25 96-63-8-38-58z"/>
    <path d="M585 319l89 22 23 72-66 43-71-48z"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="12" fill="#e8e2d5">
    <text x="126" y="148">CHINA</text><text x="113" y="193">BURMA</text><text x="213" y="260">MALAYA</text>
    <text x="243" y="289">SINGAPORE</text><text x="333" y="361">SUMATRA</text><text x="435" y="385">JAVA</text>
    <text x="464" y="327">BORNEO</text><text x="548" y="261">CELEBES</text><text x="622" y="386">WESTERN</text><text x="616" y="402">NEW GUINEA</text>
    <text x="507" y="111">PHILIPPINES</text><text x="508" y="128" fill="#d99b90">AMERICAN · NEUTRAL</text>
    <text x="313" y="112">FORMOSA</text><text x="387" y="147">HAINAN</text><text x="308" y="211">INDOCHINA</text>
  </g>
  <ellipse cx="549" cy="120" rx="92" ry="52" fill="none" stroke="#a55b50" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="none" stroke="#d4b358" stroke-width="4" marker-end="url(#arrow)">
    <path d="M345 124 C330 173 288 208 246 244"/>
    <path d="M356 134 C405 206 437 279 427 347"/>
    <path d="M398 155 C477 192 514 249 514 315"/>
    <path d="M430 157 C533 187 594 259 628 351"/>
    <path d="M298 207 C223 196 176 204 139 231"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#d4b358"/></marker></defs>
  <g font-family="Arial,sans-serif" font-size="11">
    <rect x="48" y="438" width="664" height="38" fill="#0d110e" stroke="#3d443e"/>
    <line x1="70" y1="457" x2="116" y2="457" stroke="#d4b358" stroke-width="4"/>
    <text x="126" y="461" fill="#c9cfc6">Japanese offensives</text>
    <line x1="286" y1="457" x2="332" y2="457" stroke="#a55b50" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="342" y="461" fill="#c9cfc6">strict American exclusion</text>
    <text x="690" y="461" text-anchor="end" fill="#8f978d">not to scale</text>
  </g>
</svg>
