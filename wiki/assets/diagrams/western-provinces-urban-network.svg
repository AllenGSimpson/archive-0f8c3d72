<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Urban network of Jordan's western provinces</title>
  <desc id="desc">Schematic diagram connecting Jenin, Nablus, Ramallah, Jerusalem, Bethlehem, Hebron, Beersheba, Jericho, Gaza City, Amman, Aqaba, and the Israeli frontier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b24"/><stop offset="1" stop-color="#182b34"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .route{fill:none;stroke:#b5c4c8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.72}.secondary{stroke:#6f8e96;stroke-width:3;stroke-dasharray:10 10}.frontier{stroke:#d6a55d;stroke-width:3;stroke-dasharray:6 9;opacity:.8}.node{fill:#183e49;stroke:#bcd0d5;stroke-width:2;filter:url(#shadow)}.major{fill:#235f6d;stroke:#e2eef0;stroke-width:3}.holy{fill:#59482d;stroke:#e2c483;stroke-width:3}.outside{fill:#272f35;stroke:#85979c;stroke-width:2}.city{font:700 22px 'Segoe UI',sans-serif;fill:#f2f5f5;text-anchor:middle}.role{font:14px 'Segoe UI',sans-serif;fill:#b9c8cc;text-anchor:middle}.label{font:700 16px 'Segoe UI',sans-serif;fill:#d6a55d;letter-spacing:1.5px}.small{font:14px 'Segoe UI',sans-serif;fill:#9fb1b6}.title{font:700 34px Georgia,serif;fill:#f2f5f5}.subtitle{font:17px 'Segoe UI',sans-serif;fill:#aebfc3}
    </style>
  </defs>
  <rect width="1400" height="760" rx="18" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Western Provinces Urban Network</text>
  <text x="60" y="88" class="subtitle">Schematic administrative and transport relationships, c. 1955–1985 · not an exact-border map</text>

  <path class="frontier" d="M190 130 C245 235 205 345 245 455 S250 620 300 700"/>
  <text x="82" y="300" class="label" transform="rotate(-78 82 300)">ISRAELI FRONTIER</text>
  <path class="route" d="M515 145 L505 245 L515 345 L500 430 L500 515 L515 625"/>
  <path class="route" d="M500 430 L280 530 L515 625"/>
  <path class="secondary" d="M505 245 L795 335 L940 355"/>
  <path class="secondary" d="M515 345 L795 335"/>
  <path class="secondary" d="M515 625 L780 685"/>
  <path class="secondary" d="M280 530 L150 445"/>

  <g transform="translate(515 145)"><rect class="node" x="-100" y="-38" width="200" height="76" rx="12"/><text class="city" y="-3">Jenin</text><text class="role" y="23">northern gateway</text></g>
  <g transform="translate(505 245)"><rect class="major" x="-105" y="-40" width="210" height="80" rx="12"/><text class="city" y="-4">Nablus</text><text class="role" y="23">northern commercial center</text></g>
  <g transform="translate(515 345)"><rect class="node" x="-140" y="-40" width="280" height="80" rx="12"/><text class="city" y="-4">Ramallah</text><text class="role" y="23">administrative and professional center</text></g>
  <g transform="translate(500 430)"><rect class="holy" x="-110" y="-42" width="220" height="84" rx="12"/><text class="city" y="-5">Jerusalem</text><text class="role" y="23">political and religious center</text></g>
  <g transform="translate(500 515)"><rect class="holy" x="-100" y="-38" width="200" height="76" rx="12"/><text class="city" y="-3">Bethlehem</text><text class="role" y="23">pilgrimage and crafts</text></g>
  <g transform="translate(515 625)"><rect class="major" x="-105" y="-40" width="210" height="80" rx="12"/><text class="city" y="-4">Hebron</text><text class="role" y="23">southern highlands center</text></g>
  <g transform="translate(280 530)"><rect class="major" x="-100" y="-40" width="200" height="80" rx="12"/><text class="city" y="-4">Gaza City</text><text class="role" y="23">coastal and refugee center</text></g>
  <g transform="translate(150 445)"><rect class="outside" x="-82" y="-35" width="164" height="70" rx="12"/><text class="city" y="-2">Coast</text><text class="role" y="22">port and fishing</text></g>
  <g transform="translate(795 335)"><rect class="node" x="-95" y="-38" width="190" height="76" rx="12"/><text class="city" y="-3">Jericho</text><text class="role" y="23">Jordan Valley crossing</text></g>
  <g transform="translate(940 355)"><rect class="outside" x="-95" y="-38" width="190" height="76" rx="12"/><text class="city" y="-3">Amman</text><text class="role" y="23">national capital</text></g>
  <g transform="translate(780 685)"><rect class="outside" x="-95" y="-38" width="190" height="76" rx="12"/><text class="city" y="-3">Aqaba</text><text class="role" y="23">Red Sea outlet</text></g>
  <g transform="translate(515 705)"><rect class="node" x="-105" y="-34" width="210" height="68" rx="12"/><text class="city" y="-1">Beersheba</text><text class="role" y="22">southern administration</text></g>
  <path class="route" d="M515 665 L515 671"/>

  <g transform="translate(1000 545)">
    <text x="0" y="0" class="label">FUNCTIONAL GEOGRAPHY</text>
    <text x="0" y="34" class="small">Highland road: Jenin–Nablus–Jerusalem–Hebron</text>
    <text x="0" y="60" class="small">Valley road: Jericho–Amman</text>
    <text x="0" y="86" class="small">Southern road: Gaza–Beersheba–Aqaba</text>
    <text x="0" y="112" class="small">Dashed lines: secondary or frontier-sensitive links</text>
  </g>
</svg>
