<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">National Commonwealth Corridor</title><desc id="desc">A schematic east-west Canadian infrastructure system linking Atlantic ports, central industry, prairie and Alberta resources, Arctic routes, and Pacific ports while resisting automatic southward economic drainage.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.region{font:700 18px system-ui,sans-serif;fill:#f5eee4}.detail{font:14px system-ui,sans-serif;fill:#bac7d0}.node{fill:#172b37;stroke:#658396;stroke-width:2}.port{fill:#17333a;stroke:#6cb4b0}.resource{fill:#3b3421;stroke:#d2ad53}.line{fill:none;stroke:#e8bd57;stroke-width:8}.branch{fill:none;stroke:#75beba;stroke-width:4;stroke-dasharray:9 6}.south{fill:none;stroke:#b76a68;stroke-width:4;stroke-dasharray:8 8}.tag{font:700 13px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.09em}.warning{font:italic 15px Georgia,serif;fill:#dc8883}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">National Commonwealth Corridor</text><text x="48" y="92" class="s">A sovereign logistics system—not a single railway and not Canada's first transcontinental route</text>
  <path d="M112 335 H1088" class="line"/>
  <g transform="translate(44 245)"><rect class="node port" width="210" height="180" rx="9"/><text x="18" y="36" class="tag">ATLANTIC GATES</text><text x="18" y="72" class="region">Halifax · Saint John</text><text x="18" y="100" class="detail">Newfoundland frontage</text><text x="18" y="126" class="detail">shipping · repair · fuel</text><text x="18" y="152" class="detail">Commonwealth lifeline</text></g>
  <g transform="translate(294 245)"><rect class="node" width="230" height="180" rx="9"/><text x="18" y="36" class="tag">INDUSTRIAL CORE</text><text x="18" y="72" class="region">St Lawrence · Lakes</text><text x="18" y="100" class="detail">rail yards · highways</text><text x="18" y="126" class="detail">steel · refining · machinery</text><text x="18" y="152" class="detail">winterized communications</text></g>
  <g transform="translate(564 245)"><rect class="node resource" width="248" height="180" rx="9"/><text x="18" y="36" class="tag">RESOURCE HEARTLAND</text><text x="18" y="72" class="region">Prairies · Alberta</text><text x="18" y="100" class="detail">grain · potash · minerals</text><text x="18" y="126" class="detail">oil · gas · pipelines</text><text x="18" y="152" class="detail">depots · strategic stores</text></g>
  <g transform="translate(852 245)"><rect class="node port" width="304" height="180" rx="9"/><text x="18" y="36" class="tag">PACIFIC GATES</text><text x="18" y="72" class="region">Vancouver · Prince Rupert</text><text x="18" y="100" class="detail">British Columbia integration</text><text x="18" y="126" class="detail">fisheries · minerals · naval work</text><text x="18" y="152" class="detail">bounded Asian trade</text></g>
  <path d="M685 245 C670 182 611 154 540 154" class="branch"/><g transform="translate(397 116)"><rect class="node port" width="210" height="78" rx="8"/><text x="18" y="31" class="tag">NORTHERN BRANCH</text><text x="18" y="58" class="region">Churchill · Arctic</text></g>
  <path d="M405 425 C430 504 493 536 570 549" class="south"/><path d="M690 425 C690 494 674 523 650 550" class="south"/><text x="373" y="585" class="warning">Commercial gravity toward the United States remains strong</text>
  <path d="M105 455 H1095" stroke="#6cb4b0" stroke-width="2"/><text x="112" y="489" class="detail">rail</text><text x="232" y="489" class="detail">road</text><text x="352" y="489" class="detail">pipeline</text><text x="491" y="489" class="detail">ports</text><text x="608" y="489" class="detail">refining</text><text x="748" y="489" class="detail">communications</text><text x="924" y="489" class="detail">defense stores</text>
  <text x="48" y="636" class="s">Strategic schematic, not a geographic map. Projects, ownership, and completion dates vary by route and province.</text>
</svg>
