<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Layered Japanese yen area</title><desc id="desc">Four-layer diagram distinguishing domestic yen, local development currencies, clearing yen, and Gold Yen.</desc>
  <rect width="1200" height="675" fill="#101413"/><rect x="24" y="24" width="1152" height="627" rx="18" fill="#171d1b" stroke="#9e7d35" stroke-width="2"/>
  <text x="60" y="72" fill="#f1ead8" font-family="Georgia,serif" font-size="31" font-weight="700">The layered Japanese yen area</text>
  <text x="60" y="103" fill="#b9b5a8" font-family="Arial,sans-serif" font-size="15">Currency sovereignty survives at the surface; convertibility, credit, and settlement remain politically ordered.</text>
  <g font-family="Arial,sans-serif">
    <rect x="65" y="140" width="1070" height="95" rx="14" fill="#5e2024" stroke="#d9b55b"/><text x="95" y="172" fill="#fff4d8" font-size="13" letter-spacing="2">LAYER 1 · DOMESTIC AND INNER-IMPERIAL YEN</text><text x="95" y="202" fill="#ffffff" font-size="19" font-weight="700">Home islands · Chōsen · Taiwan · Karafuto · incorporated territories</text><text x="1100" y="190" text-anchor="end" fill="#f2d79c" font-size="14">fiat · par notes · controlled capital movement</text>
    <rect x="95" y="255" width="1010" height="95" rx="14" fill="#243a45" stroke="#7192a2"/><text x="125" y="287" fill="#dcecf3" font-size="13" letter-spacing="2">LAYER 2 · DEVELOPMENT AND ASSOCIATED CURRENCIES</text><text x="125" y="317" fill="#ffffff" font-size="18" font-weight="700">Manchukuo · China · Indochina · Malaya · East Indies · baht · peso</text><text x="1070" y="305" text-anchor="end" fill="#b9cbd3" font-size="14">pegs · bands · reserves · yen-denominated loans</text>
    <rect x="125" y="370" width="950" height="95" rx="14" fill="#25443b" stroke="#6aa68e"/><text x="155" y="402" fill="#e2f4ec" font-size="13" letter-spacing="2">LAYER 3 · GREATER EAST ASIA CLEARING YEN</text><text x="155" y="432" fill="#ffffff" font-size="18" font-weight="700">Noncash intergovernmental and large-corporate accounting unit</text><text x="1040" y="420" text-anchor="end" fill="#bed9ce" font-size="14">redeemed through approved Japanese output</text>
    <rect x="155" y="485" width="890" height="95" rx="14" fill="#42361e" stroke="#b89a52"/><text x="185" y="517" fill="#f3e6bd" font-size="13" letter-spacing="2">LAYER 4 · EXTERNAL GOLD YEN</text><text x="185" y="547" fill="#ffffff" font-size="18" font-weight="700">Bullion-defined trade certificate, first regularized through Indian commerce</text><text x="1010" y="535" text-anchor="end" fill="#e0c985" font-size="14">separate from domestic yen and clearing yen</text>
  </g>
  <path d="M600 235v20M600 350v20M600 465v20" stroke="#d9b55b" stroke-width="3"/>
  <text x="600" y="626" text-anchor="middle" fill="#aaa69a" font-family="Arial,sans-serif" font-size="13">There is no single Sphere-wide circulating currency and no general right to convert local money into Tokyo assets.</text>
</svg>
