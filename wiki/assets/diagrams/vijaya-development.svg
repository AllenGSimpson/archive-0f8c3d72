<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Development of the Vijaya armored family</title><desc id="desc">A process diagram showing Russian technical inheritance transformed by Indian engineering, production, service trials, and chemical-protection requirements.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#c7a24d"/></marker></defs><rect width="1200" height="620" fill="#111813"/><text x="58" y="68" fill="#eadfbf" font-family="Georgia,serif" font-size="36">Vijaya is an Indian tank with a Russian prehistory</text><text x="58" y="106" fill="#9da99f" font-family="Arial,sans-serif" font-size="18">Development lineage, not a claim of component identity or exact vehicle geometry.</text>
  <g font-family="Arial,sans-serif"><rect x="65" y="175" width="290" height="280" rx="10" fill="#202b24" stroke="#6c7a6f"/><text x="95" y="220" fill="#d9d1ba" font-size="23" font-weight="700">RUSSIAN INHERITANCE</text><text x="95" y="265" fill="#bbc5bd" font-size="18">T-54 / T-55 knowledge</text><text x="95" y="300" fill="#bbc5bd" font-size="18">diesel and transmission practice</text><text x="95" y="335" fill="#bbc5bd" font-size="18">turret and gun installation</text><text x="95" y="370" fill="#bbc5bd" font-size="18">suspension calculations</text><text x="95" y="405" fill="#bbc5bd" font-size="18">partial Object 140 research</text>
  <rect x="455" y="145" width="290" height="340" rx="10" fill="#202b24" stroke="#c7a24d"/><text x="485" y="190" fill="#d9d1ba" font-size="23" font-weight="700">INDIAN DEVELOPMENT</text><text x="485" y="235" fill="#bbc5bd" font-size="18">tropical cooling and filtration</text><text x="485" y="270" fill="#bbc5bd" font-size="18">monsoon-proof electrical systems</text><text x="485" y="305" fill="#bbc5bd" font-size="18">local armor and ammunition</text><text x="485" y="340" fill="#bbc5bd" font-size="18">Indian radios and stowage</text><text x="485" y="375" fill="#bbc5bd" font-size="18">railway and bridge limits</text><text x="485" y="410" fill="#bbc5bd" font-size="18">mass-production simplification</text><text x="485" y="445" fill="#bbc5bd" font-size="18">chemical-war protection</text>
  <rect x="845" y="175" width="290" height="280" rx="10" fill="#263229" stroke="#c7a24d"/><text x="875" y="220" fill="#e8dfc5" font-size="23" font-weight="700">VIJAYA FAMILY</text><text x="875" y="265" fill="#d9d1ba" font-size="18">Model 62 production tank</text><text x="875" y="300" fill="#d9d1ba" font-size="18">Vijaya A chemical-protected variant</text><text x="875" y="335" fill="#d9d1ba" font-size="18">Object 140-derived gun experiments</text><text x="875" y="370" fill="#d9d1ba" font-size="18">longer-gunned successor</text><text x="875" y="405" fill="#d9d1ba" font-size="18">shared recovery and engineer chassis</text>
  <path d="M365 315H435" stroke="#c7a24d" stroke-width="7" marker-end="url(#a)"/><path d="M755 315H825" stroke="#c7a24d" stroke-width="7" marker-end="url(#a)"/><text x="600" y="545" text-anchor="middle" fill="#9da99f" font-size="18">Congress financing, Indian factories, service trials, doctrine, and later variants make the lineage nationally Indian.</text></g>
</svg>
