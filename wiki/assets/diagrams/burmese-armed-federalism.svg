<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Armed federalism in Burma</title><desc id="desc">Relationship among the Union Army, State Guards, Japanese guarantee, and Thai stabilization role.</desc><rect width="1200" height="680" rx="32" fill="#10171d"/><text x="60" y="68" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">Armed federalism</text><text x="60" y="106" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">No armed institution is permitted to become completely dominant</text><g font-family="Arial,sans-serif"><g transform="translate(65 170)"><rect width="335" height="300" rx="20" fill="#3c3322" stroke="#d3aa52"/><text x="28" y="48" fill="#f1c86f" font-size="26" font-weight="700">UNION ARMY</text><text x="28" y="90" fill="#fff" font-size="18">Artillery · armor · aviation</text><text x="28" y="124" fill="#fff" font-size="18">Arsenals · communications</text><text x="28" y="158" fill="#fff" font-size="18">Strategic reserves</text><text x="28" y="205" fill="#a8bbc4" font-size="16">Union-wide legal mandate</text><text x="28" y="235" fill="#a8bbc4" font-size="16">Predominantly Bamar command culture</text></g><g transform="translate(435 170)"><rect width="330" height="300" rx="20" fill="#173d4a" stroke="#66b4c3"/><text x="28" y="48" fill="#9de0ea" font-size="26" font-weight="700">STATE GUARDS</text><text x="28" y="90" fill="#fff" font-size="18">Infantry · scouts · gendarmerie</text><text x="28" y="124" fill="#fff" font-size="18">Mortars · light vehicles</text><text x="28" y="158" fill="#fff" font-size="18">Local communications</text><text x="28" y="205" fill="#a8bbc4" font-size="16">Answer to constituent governments</text><text x="28" y="235" fill="#a8bbc4" font-size="16">Heavy systems legally restricted</text></g><g transform="translate(800 170)"><rect width="335" height="300" rx="20" fill="#19372b" stroke="#6ab58a"/><text x="28" y="48" fill="#91dbad" font-size="25" font-weight="700">EXTERNAL GUARANTEE</text><text x="28" y="90" fill="#fff" font-size="18">Japan · heavy supply and recognition</text><text x="28" y="124" fill="#fff" font-size="18">Thailand · daily stabilization</text><text x="28" y="158" fill="#fff" font-size="18">Fuel · radios · credit · mediation</text><text x="28" y="205" fill="#a8bbc4" font-size="16">Blocks conquest by Rangoon</text><text x="28" y="235" fill="#a8bbc4" font-size="16">Blocks unilateral secession</text></g></g><path d="M400 320H435M765 320H800" stroke="#f2e7d1" stroke-width="5" stroke-dasharray="7 8"/><text x="600" y="545" text-anchor="middle" fill="#e3c678" font-family="Arial,sans-serif" font-size="20">Japan controls whether local infantry conflict can become sustained modern war.</text><text x="600" y="580" text-anchor="middle" fill="#a8bbc4" font-family="Arial,sans-serif" font-size="17">Thailand manages eastern ceasefires, border supply, refugees, and liaison beneath the Japanese guarantee.</text><text x="60" y="638" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Security-system schematic</text></svg>
