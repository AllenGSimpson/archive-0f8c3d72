<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">American infantry-weapons development from 1933 to 1985</title><desc id="desc">Two-lane timeline showing rifle and carbine development above belt-fed support weapons.</desc><rect width="1200" height="560" fill="#11191f"/><text x="55" y="62" fill="#f2e9d7" font-family="Georgia,serif" font-size="34">American infantry weapons, 1933–1985</text><text x="55" y="98" fill="#aab7bf" font-family="Arial,sans-serif" font-size="18">Service arms · limited full-power branch · small-caliber standard · belt-fed support</text><text x="55" y="210" fill="#f2e9d7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">RIFLES</text><line x1="180" y1="205" x2="1090" y2="205" stroke="#71838d" stroke-width="3"/><text x="55" y="380" fill="#f2e9d7" font-family="Arial,sans-serif" font-size="19" font-weight="bold">SUPPORT</text><line x1="180" y1="375" x2="1090" y2="375" stroke="#71838d" stroke-width="3"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#315f75"><circle cx="275" cy="205" r="48"/><circle cx="450" cy="205" r="48"/><circle cx="690" cy="205" r="48"/><circle cx="865" cy="205" r="48"/><circle cx="1035" cy="205" r="48"/></g><g fill="#f3ead9" font-size="16" font-weight="bold"><text x="275" y="199">M1 Rifle</text><text x="275" y="222">1936</text><text x="450" y="199">M1 Carbine</text><text x="450" y="222">1942</text><text x="690" y="199">M15</text><text x="690" y="222">1959</text><text x="865" y="199">M16</text><text x="865" y="222">1964</text><text x="1035" y="199">M16A1</text><text x="1035" y="222">1967</text></g><g fill="#755d38"><circle cx="255" cy="375" r="48"/><circle cx="720" cy="375" r="48"/></g><g fill="#fff1d2" font-size="16" font-weight="bold"><text x="255" y="369">M2HB</text><text x="255" y="392">1933</text><text x="720" y="369">M60</text><text x="720" y="392">1960</text></g></g><g fill="#aab7bf" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="275" y="282">7.62×63</text><text x="450" y="282">7.62×33</text><text x="690" y="282">7.62×51</text><text x="865" y="282">5.56×45</text><text x="1035" y="282">5.56×45</text><text x="255" y="452">12.7×99</text><text x="720" y="452">7.62×51</text></g><text x="55" y="520" fill="#7f909a" font-family="Arial,sans-serif" font-size="15">M16 adoption follows ammunition, magazine, chrome-chamber, and cleaning trials rather than a Vietnam-scale emergency.</text></svg>
