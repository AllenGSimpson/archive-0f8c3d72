<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">German armored vehicle lineages from 1946 to 1981</title>
  <desc id="desc">Parallel infantry fighting vehicle and main battle tank timelines with introduction years, weights, and principal roles.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11171b"/><stop offset="1" stop-color="#202a31"/></linearGradient></defs>
  <rect width="1200" height="720" rx="26" fill="url(#bg2)"/>
  <text x="58" y="64" fill="#f2eadb" font-family="Georgia,serif" font-size="34">German armored lineages</text>
  <text x="58" y="98" fill="#aeb9c0" font-family="Arial,sans-serif" font-size="18">Registered systems in the Land Armaments Reference</text>
  <g font-family="Arial,sans-serif">
    <text x="60" y="162" fill="#d8b36a" font-size="22" font-weight="700">ARMORED INFANTRY</text>
    <line x1="105" y1="232" x2="1090" y2="232" stroke="#688898" stroke-width="5"/>
    <g transform="translate(80 185)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#263640" stroke="#688898"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Schützenpanzer 45 Kätzchen</text><text x="18" y="132" fill="#c7d0d5" font-size="16">1946 · 18.8 t · 3 + 8</text><text x="18" y="158" fill="#c7d0d5" font-size="15">20 mm cannon · first postwar IFV</text></g>
    <g transform="translate(450 185)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#263640" stroke="#688898"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Kätzchen II</text><text x="18" y="132" fill="#c7d0d5" font-size="16">1956 · 25.0 t · 3 + 8</text><text x="18" y="158" fill="#c7d0d5" font-size="15">Long 20 mm · 650 hp</text></g>
    <g transform="translate(820 185)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#263640" stroke="#688898"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Schützenpanzer 71 Greif</text><text x="18" y="132" fill="#c7d0d5" font-size="16">1972 · 31.5 t · 3 + 7</text><text x="18" y="158" fill="#c7d0d5" font-size="15">30 mm · Drachen ATGM · chassis family</text></g>
    <text x="60" y="426" fill="#d8b36a" font-size="22" font-weight="700">MAIN BATTLE TANKS</text>
    <line x1="105" y1="496" x2="1090" y2="496" stroke="#7c8068" stroke-width="5"/>
    <g transform="translate(80 449)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Panzer X Ausf. A</text><text x="18" y="132" fill="#d2d4c7" font-size="16">1956 · 49.5 t · 4 crew</text><text x="18" y="158" fill="#d2d4c7" font-size="15">Integrated technological generation</text></g>
    <g transform="translate(450 449)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Panzer XI Ausf. A</text><text x="18" y="132" fill="#d2d4c7" font-size="16">1967 · 44.0 t · 4 crew</text><text x="18" y="158" fill="#d2d4c7" font-size="15">Mobility and maintainability generation</text></g>
    <g transform="translate(820 449)"><circle cx="50" cy="47" r="12" fill="#d8b36a"/><rect y="76" width="300" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="18" y="104" fill="#fff" font-size="19" font-weight="700">Panzer XII Ausf. A</text><text x="18" y="132" fill="#d2d4c7" font-size="16">1981 · 57.0 t · 4 crew</text><text x="18" y="158" fill="#d2d4c7" font-size="15">120 mm · composite armor · digital FCS</text></g>
    <text x="60" y="688" fill="#aeb9c0" font-size="15">The Congo campaign changes employment and procurement criteria; it does not merge the two lineages or replace registered types with an unconfirmed “Otter” family.</text>
  </g>
</svg>
