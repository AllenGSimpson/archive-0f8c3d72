<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">German functional programming lineage</title>
  <desc id="desc">Timeline connecting Folge 81, Zivil-Planform, Felix Hitler's compiler project, the Prinzensprache nickname, open specification, and later space-logistics adoption.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131d"/><stop offset="1" stop-color="#182d3a"/></linearGradient><style>.title{font:700 38px Georgia,serif;fill:#f2e8d0}.sub{font:15px Arial,sans-serif;fill:#aebcc6;letter-spacing:1.5px}.year{font:700 18px Arial,sans-serif;fill:#d9bb78}.head{font:700 21px Arial,sans-serif;fill:#f4eee1}.copy{font:15px Arial,sans-serif;fill:#c2d0d8}.box{fill:#102434;stroke:#4c7890;stroke-width:2}.later{fill:#172b34;stroke:#a28755;stroke-width:2}.line{stroke:#6f9bb0;stroke-width:5;fill:none}.dot{fill:#dfc27e;stroke:#08131d;stroke-width:4}.foot{font:15px Arial,sans-serif;fill:#b9c4ca}</style></defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="700" y="56" text-anchor="middle" class="title">FROM RESEARCH LANGUAGE TO PRODUCTION NICHE</text>
  <text x="700" y="88" text-anchor="middle" class="sub">GERMAN FUNCTIONAL PROGRAMMING · 1981–2010</text>
  <path d="M110 380H1290" class="line"/>
  <circle cx="150" cy="380" r="13" class="dot"/><circle cx="370" cy="380" r="13" class="dot"/><circle cx="630" cy="380" r="13" class="dot"/><circle cx="880" cy="380" r="13" class="dot"/><circle cx="1120" cy="380" r="13" class="dot"/><circle cx="1280" cy="380" r="13" class="dot"/>
  <g transform="translate(55 145)"><rect width="190" height="170" rx="12" class="box"/><text x="95" y="34" text-anchor="middle" class="year">1981</text><text x="95" y="68" text-anchor="middle" class="head">FOLGE 81</text><text x="95" y="103" text-anchor="middle" class="copy">Typed strict core</text><text x="95" y="128" text-anchor="middle" class="copy">Research and compilers</text><text x="95" y="153" text-anchor="middle" class="copy">Immutable data</text></g>
  <g transform="translate(275 440)"><rect width="190" height="170" rx="12" class="box"/><text x="95" y="34" text-anchor="middle" class="year">1982</text><text x="95" y="68" text-anchor="middle" class="head">ZIVIL-PLANFORM</text><text x="95" y="103" text-anchor="middle" class="copy">Common services</text><text x="95" y="128" text-anchor="middle" class="copy">Typed interfaces</text><text x="95" y="153" text-anchor="middle" class="copy">Civilian language ecology</text></g>
  <g transform="translate(515 145)"><rect width="230" height="170" rx="12" class="later"/><text x="115" y="34" text-anchor="middle" class="year">2000–2002</text><text x="115" y="68" text-anchor="middle" class="head">PRIVATE PROJECT</text><text x="115" y="103" text-anchor="middle" class="copy">Felix studies Folge, ML, Lisp</text><text x="115" y="128" text-anchor="middle" class="copy">Libraries and compiler trials</text><text x="115" y="153" text-anchor="middle" class="copy">Production-first question</text></g>
  <g transform="translate(765 440)"><rect width="230" height="170" rx="12" class="later"/><text x="115" y="34" text-anchor="middle" class="year">2002–2004</text><text x="115" y="68" text-anchor="middle" class="head">COMPILER TEAM</text><text x="115" y="103" text-anchor="middle" class="copy">Planform and Klasse interop</text><text x="115" y="128" text-anchor="middle" class="copy">Tools, diagnostics, libraries</text><text x="115" y="153" text-anchor="middle" class="copy">Rough early implementations</text></g>
  <g transform="translate(1010 145)"><rect width="220" height="170" rx="12" class="later"/><text x="110" y="34" text-anchor="middle" class="year">2004–2006</text><text x="110" y="68" text-anchor="middle" class="head">PRINZENSPRACHE</text><text x="110" y="103" text-anchor="middle" class="copy">Public nickname</text><text x="110" y="128" text-anchor="middle" class="copy">Privilege controversy</text><text x="110" y="153" text-anchor="middle" class="copy">Open specification</text></g>
  <g transform="translate(1175 440)"><rect width="190" height="170" rx="12" class="later"/><text x="95" y="34" text-anchor="middle" class="year">2006–2010</text><text x="95" y="68" text-anchor="middle" class="head">BOUNDED NICHE</text><text x="95" y="103" text-anchor="middle" class="copy">Space-logistics proof</text><text x="95" y="128" text-anchor="middle" class="copy">Science and services</text><text x="95" y="153" text-anchor="middle" class="copy">Final name still open</text></g>
  <text x="700" y="695" text-anchor="middle" class="foot">Rechenplan remains the certified strategic standard; Werkcode, Klasse, and Bridge-family languages retain their established domains.</text>
</svg>
