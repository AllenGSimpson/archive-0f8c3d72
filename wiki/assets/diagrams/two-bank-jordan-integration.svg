<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Integration of Arab Palestine into the enlarged Kingdom of Jordan</title>
  <desc id="desc">Diagram showing the Hashemite crown and central ministries connecting East Bank institutions with the western Palestinian provinces, chamber, municipalities, citizenship, refugee administration, Jerusalem, and Gaza.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121b20"/><stop offset="1" stop-color="#1c2826"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#91aaa3"/></marker>
    <style>.head{font:700 42px Georgia,serif;fill:#f3e5c3}.sub{font:20px Arial,sans-serif;fill:#b9c8c3}.title{font:700 27px Georgia,serif;fill:#fff0ca}.label{font:700 18px Arial,sans-serif;fill:#eddfbd}.body{font:17px Arial,sans-serif;fill:#d7dfdc}.small{font:15px Arial,sans-serif;fill:#b8c5c1}.line{fill:none;stroke:#91aaa3;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="75" y="76" class="head">Integration of Arab Palestine into Jordan</text>
  <text x="77" y="112" class="sub">Military occupation, constitutional union, and continuing Palestinian institutions · 1948–1955</text>

  <rect x="550" y="158" width="500" height="138" rx="18" fill="#4b2730" stroke="#9b6570" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="204" text-anchor="middle" class="title">Hashemite crown and central government</text>
  <text x="800" y="239" text-anchor="middle" class="body">Cabinet · ministries · courts · treasury · Arab Legion</text>
  <text x="800" y="270" text-anchor="middle" class="small">Amman remains the royal and military capital</text>

  <path class="line" d="M680 297v86H370"/><path class="line" d="M800 297v86"/><path class="line" d="M920 297v86h310"/>

  <rect x="75" y="370" width="430" height="178" rx="18" fill="#314759" stroke="#668aa0" stroke-width="2" filter="url(#shadow)"/>
  <text x="108" y="415" class="title">East Bank establishment</text>
  <text x="108" y="451" class="body">Army core · tribes · palace patronage</text>
  <text x="108" y="483" class="body">older ministries · security command</text>
  <text x="108" y="518" class="small">Disproportionate control of coercive institutions</text>

  <rect x="585" y="370" width="430" height="178" rx="18" fill="#5a492d" stroke="#a68b57" stroke-width="2" filter="url(#shadow)"/>
  <text x="618" y="415" class="title">National legal union</text>
  <text x="618" y="451" class="body">Citizenship · parliament · courts</text>
  <text x="618" y="483" class="body">taxation · ministries · common currency</text>
  <text x="618" y="518" class="small">Equal nationality does not erase regional power</text>

  <rect x="1095" y="370" width="430" height="178" rx="18" fill="#365046" stroke="#719786" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128" y="415" class="title">Western Palestinian institutions</text>
  <text x="1128" y="451" class="body">Chamber · mayors · merchants · churches</text>
  <text x="1128" y="483" class="body">refugee representatives · professional bodies</text>
  <text x="1128" y="518" class="small">Access to the state without a separate executive</text>

  <path class="line" d="M800 549v74"/><path class="line" d="M1310 549v74H980"/>
  <rect x="390" y="610" width="820" height="192" rx="18" fill="#263637" stroke="#6b8582" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="654" text-anchor="middle" class="label">Western provincial administration</text>
  <text x="800" y="690" text-anchor="middle" class="body">Jerusalem and holy places · Nablus and central highlands · Hebron and south</text>
  <text x="800" y="722" text-anchor="middle" class="body">Gaza and refugee districts · Jordan Valley · Beersheba and the southern territories</text>
  <text x="800" y="758" text-anchor="middle" class="body">Municipalities · police · schools · health · waqf · property and refugee records</text>
  <text x="800" y="786" text-anchor="middle" class="small">Exact provincial borders and institutional titles remain open</text>

  <text x="75" y="861" class="small">The settlement produces one kingdom with shared nationality and ministries, but two durable political centers.</text>
</svg>
