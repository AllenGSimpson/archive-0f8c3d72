<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">American corporate frontiers around 2000</title><desc id="desc">Schematic showing the main German, Japanese, Latin, British, and domestic corporate competitors to American firms in the Americas.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#243442"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f7f3e9}.sub{font:17px Arial,sans-serif;fill:#b8c8d0;letter-spacing:2px}.center{fill:#17384a;stroke:#75bbda;stroke-width:4}.box{fill:#122632;stroke-width:3}.latin{stroke:#d49a72}.german{stroke:#d16868}.japan{stroke:#e0bd65}.british{stroke:#9489cf}.domestic{stroke:#76b986}.head{font:700 24px Arial,sans-serif;fill:#fff}.tag{font:700 15px Arial,sans-serif;letter-spacing:1.5px}.copy{font:18px Arial,sans-serif;fill:#d4dee3}.line{stroke:#7993a0;stroke-width:4}.foot{font:18px Arial,sans-serif;fill:#d7caa5}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="62" text-anchor="middle" class="title">AMERICAN CORPORATE FRONTIERS</text><text x="800" y="99" text-anchor="middle" class="sub">THE COMPETITOR CHANGES BY REGION · c. 2000</text>
  <g transform="translate(550 350)"><rect width="500" height="250" rx="35" class="center"/><text x="250" y="65" text-anchor="middle" class="head">AMERICAN FIRMS</text><text x="250" y="108" text-anchor="middle" class="copy">Gold-dollar finance · software · mining</text><text x="250" y="143" text-anchor="middle" class="copy">telecommunications · machinery · transport</text><text x="250" y="188" text-anchor="middle" class="copy">Commercial reach beyond formal alliances</text></g>
  <path d="M550 415L390 265M1050 415L1210 265M550 535L390 705M1050 535L1210 705M800 600V760" class="line" fill="none"/>
  <g transform="translate(65 145)"><rect width="390" height="220" rx="22" class="box latin"/><text x="195" y="52" text-anchor="middle" class="head">LATIN COUNTERWEIGHT</text><text x="195" y="84" text-anchor="middle" class="tag" fill="#e3ac86">CUBA · MEXICO · VENEZUELAN CULTURE</text><text x="25" y="132" class="copy">Spanish banking, construction, shipping,</text><text x="25" y="167" class="copy">tourism, media, Catholic and consumer ties</text></g>
  <g transform="translate(1145 145)"><rect width="390" height="220" rx="22" class="box japan"/><text x="195" y="52" text-anchor="middle" class="head">JAPANESE PACIFIC</text><text x="195" y="84" text-anchor="middle" class="tag" fill="#efd17d">PERU · ECUADOR</text><text x="25" y="132" class="copy">Ports, shipping, fisheries, mining, arms,</text><text x="25" y="167" class="copy">concessions and development finance</text></g>
  <g transform="translate(65 660)"><rect width="390" height="220" rx="22" class="box german"/><text x="195" y="52" text-anchor="middle" class="head">GERMAN STRATEGIC</text><text x="195" y="84" text-anchor="middle" class="tag" fill="#e58a8a">ARGENTINA</text><text x="25" y="132" class="copy">Defense industry, weapons, technical standards,</text><text x="25" y="167" class="copy">training and heavy industrial networks</text></g>
  <g transform="translate(1145 660)"><rect width="390" height="220" rx="22" class="box british"/><text x="195" y="52" text-anchor="middle" class="head">BRITISH POCKETS</text><text x="195" y="84" text-anchor="middle" class="tag" fill="#b4a9e8">BELIZE · JAMAICA · BAHAMAS</text><text x="25" y="132" class="copy">Banks, shipping, insurance, communications,</text><text x="25" y="167" class="copy">tourism, law and Commonwealth institutions</text></g>
  <g transform="translate(565 760)"><rect width="470" height="145" rx="22" class="box domestic"/><text x="235" y="48" text-anchor="middle" class="head">DOMESTIC BALANCE</text><text x="235" y="80" text-anchor="middle" class="tag" fill="#9bd3a5">CHILE · MEXICO · OTHER BALANCERS</text><text x="235" y="117" text-anchor="middle" class="copy">Local firms remain political instruments</text></g>
  <text x="800" y="955" text-anchor="middle" class="foot">Commercial influence does not by itself create a base, security veto, or formal bloc membership</text>
</svg>
