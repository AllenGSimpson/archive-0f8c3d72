<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Federal Yugoslav order</title><desc id="desc">Constituent governments and reserved Italian powers in the Federal Kingdom of Yugoslavia.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#f5d46b}.s{font:21px Arial,sans-serif;fill:#c9c3b8}.l{font:bold 25px Arial,sans-serif;fill:#fff}.b{stroke:#c6bda8;stroke-width:2;rx:15}</style></defs><rect width="1200" height="720" fill="#101513"/><text x="55" y="63" class="h">FEDERAL KINGDOM OF YUGOSLAVIA</text><text x="55" y="100" class="s">One crown and treaty over several national administrations</text>
  <rect x="380" y="135" width="440" height="100" class="b" fill="#51402f"/><text x="600" y="178" text-anchor="middle" class="l">ITALIAN RESERVED POWERS</text><text x="600" y="211" text-anchor="middle" class="s">Defense · arms · foreign policy · bases · customs alignment</text>
  <rect x="380" y="285" width="440" height="100" class="b" fill="#364454"/><text x="600" y="328" text-anchor="middle" class="l">FEDERAL CROWN AND CABINET</text><text x="600" y="361" text-anchor="middle" class="s">Assembly · internal market · limited army · arbitration</text>
  <path d="M600 235v50M600 385v55M140 440h920" stroke="#c49c4b" stroke-width="4"/><path d="M140 440v55M370 440v55M600 440v55M830 440v55M1060 440v55" stroke="#c49c4b" stroke-width="4"/>
  <rect x="45" y="495" width="190" height="105" class="b" fill="#4e3438"/><text x="140" y="556" text-anchor="middle" class="l">SERBIA</text>
  <rect x="275" y="495" width="190" height="105" class="b" fill="#483f35"/><text x="370" y="556" text-anchor="middle" class="l">CROATIA</text>
  <rect x="505" y="495" width="190" height="105" class="b" fill="#394a3e"/><text x="600" y="556" text-anchor="middle" class="l">BOSNIA</text>
  <rect x="735" y="495" width="190" height="105" class="b" fill="#3e3b4d"/><text x="830" y="556" text-anchor="middle" class="l">MONTENEGRO</text>
  <rect x="965" y="495" width="190" height="105" class="b" fill="#3b4850"/><text x="1060" y="545" text-anchor="middle" class="l">OTHER</text><text x="1060" y="577" text-anchor="middle" class="s">supervised areas</text>
  <text x="600" y="667" text-anchor="middle" class="s">Dalmatia, Hungarian acquisitions, German zones, and Bulgarian Macedonia remain outside the federation.</text>
</svg>
