<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lunar settlement thresholds</title><desc id="desc">A progression from permanent base through family settlement to self-reproducing colony, with the first lunar birth marking an important threshold but not completing the progression.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131d"/><stop offset="1" stop-color="#1c2b3a"/></linearGradient><style>.title{font:700 48px Arial,sans-serif;fill:#eef4f7}.sub{font:22px Arial,sans-serif;fill:#9fb3bd;letter-spacing:2px}.box{fill:#142735;stroke:#6c8795;stroke-width:3}.active{fill:#173444;stroke:#70cee7;stroke-width:5}.head{font:700 28px Arial,sans-serif;fill:#f2f7f9}.copy{font:19px Arial,sans-serif;fill:#b5c7cf}.year{font:700 22px Arial,sans-serif;fill:#70cee7}.line{stroke:#75919f;stroke-width:9}.dot{fill:#dce8ec;stroke:#70cee7;stroke-width:5}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1340" cy="120" r="260" fill="#d7e0e2" opacity=".08"/><text x="100" y="92" class="title">FROM BASE TO COLONY</text><text x="102" y="135" class="sub">THE FIRST LUNAR BIRTH AS A DEMOGRAPHIC THRESHOLD</text>
  <path d="M230 450H1370" class="line"/><circle cx="270" cy="450" r="18" class="dot"/><circle cx="800" cy="450" r="24" class="dot"/><circle cx="1330" cy="450" r="18" class="dot"/>
  <rect x="90" y="225" width="360" height="175" rx="24" class="box"/><text x="270" y="278" text-anchor="middle" class="head">PERMANENT BASE</text><text x="270" y="319" text-anchor="middle" class="copy">continuous occupation</text><text x="270" y="349" text-anchor="middle" class="copy">rotating crews · route home</text>
  <rect x="600" y="205" width="400" height="205" rx="24" class="active"/><text x="800" y="263" text-anchor="middle" class="head">FAMILY SETTLEMENT</text><text x="800" y="305" text-anchor="middle" class="copy">married households · several employers</text><text x="800" y="335" text-anchor="middle" class="copy">local services · multiyear residence</text><text x="800" y="375" text-anchor="middle" class="year">FIRST LUNAR BIRTH</text>
  <rect x="1150" y="225" width="360" height="175" rx="24" class="box"/><text x="1330" y="278" text-anchor="middle" class="head">COLONY</text><text x="1330" y="319" text-anchor="middle" class="copy">social reproduction</text><text x="1330" y="349" text-anchor="middle" class="copy">education · enduring identity</text>
  <path d="M800 475V615" stroke="#70cee7" stroke-width="5"/><rect x="400" y="615" width="800" height="145" rx="30" fill="#10242f" stroke="#426575" stroke-width="3"/><text x="800" y="665" text-anchor="middle" class="head">KENNEDY LUNAR SETTLEMENT SYSTEM</text><text x="800" y="705" text-anchor="middle" class="copy">The healthy birth proves childbirth is possible under the available regime.</text><text x="800" y="735" text-anchor="middle" class="copy">It does not settle conception, childhood development, Earth adaptation, or lunar citizenship.</text>
  <text x="100" y="840" class="copy">Late 1990s or early 2000s · exact date, child, parents, and medical record remain open</text>
</svg>
