<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Siberian city and railway chain</title><desc id="desc">Omsk, Novosibirsk, Krasnoyarsk, and Irkutsk form four political centers along the fragmented Trans-Siberian Railway.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151e"/><stop offset="1" stop-color="#111d2a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d9c26f"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f5f1e8" font-family="Georgia,serif" font-size="32">THE SIBERIAN CITY CHAIN</text>
  <text x="600" y="91" text-anchor="middle" fill="#9fb2bd" font-family="Arial,sans-serif" font-size="17">One inherited railway · four principal political centers</text>
  <path d="M92 285H1108" stroke="#3c3428" stroke-width="24" stroke-linecap="round"/><path d="M92 285H1108" stroke="#d9c26f" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(55 150)"><rect width="245" height="205" rx="18" fill="#253746" stroke="#73a8c7" stroke-width="3"/><text x="122" y="48" text-anchor="middle" fill="#fff" font-size="25">OMSK</text><text x="122" y="82" text-anchor="middle" fill="#dceaf2" font-size="16">Irtysh junction</text><text x="122" y="110" text-anchor="middle" fill="#dceaf2" font-size="16">military administration</text><text x="122" y="138" text-anchor="middle" fill="#dceaf2" font-size="16">western defense</text><text x="122" y="178" text-anchor="middle" fill="#f0d98b" font-size="15">DUAL STATE — WEST</text></g>
    <g transform="translate(335 150)"><rect width="245" height="205" rx="18" fill="#293a31" stroke="#86b98e" stroke-width="3"/><text x="122" y="48" text-anchor="middle" fill="#fff" font-size="25">NOVOSIBIRSK</text><text x="122" y="82" text-anchor="middle" fill="#dff1e2" font-size="16">Ob bridge</text><text x="122" y="110" text-anchor="middle" fill="#dff1e2" font-size="16">industry and design</text><text x="122" y="138" text-anchor="middle" fill="#dff1e2" font-size="16">railway workshops</text><text x="122" y="178" text-anchor="middle" fill="#f0d98b" font-size="15">DUAL STATE — EAST</text></g>
    <g transform="translate(620 150)"><rect width="245" height="205" rx="18" fill="#3c3428" stroke="#cba76d" stroke-width="3"/><text x="122" y="48" text-anchor="middle" fill="#fff" font-size="25">KRASNOYARSK</text><text x="122" y="82" text-anchor="middle" fill="#f4e6ca" font-size="16">Yenisei bridge</text><text x="122" y="110" text-anchor="middle" fill="#f4e6ca" font-size="16">river and customs</text><text x="122" y="138" text-anchor="middle" fill="#f4e6ca" font-size="16">Arctic access</text><text x="122" y="178" text-anchor="middle" fill="#f0d98b" font-size="15">CENTRAL STATE</text></g>
    <g transform="translate(900 150)"><rect width="245" height="205" rx="18" fill="#352f45" stroke="#aa91ca" stroke-width="3"/><text x="122" y="48" text-anchor="middle" fill="#fff" font-size="25">IRKUTSK</text><text x="122" y="82" text-anchor="middle" fill="#eee5f8" font-size="16">Angara and Baikal</text><text x="122" y="110" text-anchor="middle" fill="#eee5f8" font-size="16">Soviet restorationism</text><text x="122" y="138" text-anchor="middle" fill="#eee5f8" font-size="16">eastern frontier</text><text x="122" y="178" text-anchor="middle" fill="#f0d98b" font-size="15">IRKUTSK STATE</text></g>
    <text x="600" y="426" text-anchor="middle" fill="#f0d98b" font-size="20">Bridges, yards, locomotives, and dispatch offices become instruments of sovereignty.</text>
    <text x="600" y="466" text-anchor="middle" fill="#bfc8cb" font-size="17">Trade requires cooperation; mobilization rewards control of the next chokepoint.</text>
  </g>
</svg>
