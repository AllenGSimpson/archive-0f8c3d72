<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">First Butler ministry parliamentary method</title><desc id="desc">A Conservative minority government receives confidence and supply from Union Commonwealth while assembling different parliamentary majorities for defense, social policy, reform, and Commonwealth institutions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.gov{fill:#302b25;stroke:#be925d;stroke-width:2}.p{fill:#192e39;stroke:#6b8796;stroke-width:2}.o{fill:#25362b;stroke:#7d9f79;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.line{stroke:#cfa655;stroke-width:3;fill:none}.dash{stroke:#78909d;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">First Butler ministry, 1951-1955</text><text x="50" y="92" class="s">A minority government sustained by one agreement but deliberately not confined to one parliamentary partner</text>
  <g transform="translate(385 135)"><rect class="gov" width="430" height="120" rx="10"/><text x="215" y="36" text-anchor="middle" class="tag">CONSERVATIVE GOVERNMENT</text><text x="215" y="73" text-anchor="middle" class="t">R. A. Butler · Contract Ministry</text><text x="215" y="99" text-anchor="middle" class="d">Contracts, not commands</text></g>
  <path class="line" d="M210 350 H385 V215"/><g transform="translate(50 290)"><rect class="o" width="260" height="145" rx="9"/><text x="20" y="34" class="tag">UNION COMMONWEALTH</text><text x="20" y="73" class="t">Confidence and supply</text><text x="20" y="103" class="d">Defense · shipping · Indian Ocean</text><text x="20" y="126" class="d">No Cabinet office</text></g>
  <path class="dash" d="M600 255 V320 M170 320 H1030 M170 320 V365 M455 320 V365 M745 320 V365 M1030 320 V365"/>
  <g transform="translate(50 365)"><rect class="p" width="240" height="170" rx="9"/><text x="18" y="34" class="tag">DEFENSE MAJORITY</text><text x="18" y="76" class="t">UC + imperial Tories</text><text x="18" y="110" class="d">Fleet, merchant shipping,</text><text x="18" y="134" class="d">bases, strategic industry</text></g>
  <g transform="translate(335 365)"><rect class="p" width="240" height="170" rx="9"/><text x="18" y="34" class="tag">SOCIAL MAJORITY</text><text x="18" y="76" class="t">Labour + Conservatives</text><text x="18" y="110" class="d">Housing, health, pensions,</text><text x="18" y="134" class="d">apprenticeships</text></g>
  <g transform="translate(625 365)"><rect class="p" width="240" height="170" rx="9"/><text x="18" y="34" class="tag">REFORM MAJORITY</text><text x="18" y="76" class="t">Liberals + Common Wealth</text><text x="18" y="110" class="d">Inquiries, administration,</text><text x="18" y="134" class="d">constitutional scrutiny</text></g>
  <g transform="translate(910 365)"><rect class="p" width="240" height="170" rx="9"/><text x="18" y="34" class="tag">COMMONWEALTH</text><text x="18" y="76" class="t">Crown-system Tories</text><text x="18" y="110" class="d">Council, secretariat,</text><text x="18" y="134" class="d">long contracts</text></g>
  <text x="50" y="625" class="s">Mosley supplied survival, but no party held a monopoly over the government's legislation.</text>
</svg>
