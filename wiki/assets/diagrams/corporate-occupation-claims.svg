<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Corporate occupation and settlement claims</title><desc id="desc">Claims strengthen from survey to works, occupation, and settlement, while sovereignty remains disputed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121a"/><stop offset="1" stop-color="#102632"/></linearGradient><linearGradient id="bar"><stop stop-color="#315669"/><stop offset=".75" stop-color="#70afbd"/><stop offset="1" stop-color="#d9bf70"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">From corporate activity to settlement claim</text><text x="60" y="105" fill="#a0b4be" font-family="Arial,sans-serif" font-size="17">Protection strengthens as intention becomes maintained dependence</text><path d="M105 305H1010" stroke="url(#bar)" stroke-width="20" stroke-linecap="round"/><path d="M1010 275l70 30-70 30z" fill="#d9bf70"/>
<g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#dcebef" font-size="18" font-weight="700"><text x="135" y="235">SURVEY</text><text x="350" y="235">WORKS</text><text x="570" y="235">OCCUPATION</text><text x="790" y="235">SETTLEMENT</text><text x="1030" y="235">SOVEREIGNTY?</text></g><g fill="#abc0c9" font-size="15"><text x="135" y="365">notice · fieldwork</text><text x="350" y="365">installation · upkeep</text><text x="570" y="365">continuous crews</text><text x="790" y="365">residents · utilities</text><text x="1030" y="365">separate decision</text></g><g fill="#e8f2f4"><circle cx="135" cy="305" r="13"/><circle cx="350" cy="305" r="13"/><circle cx="570" cy="305" r="13"/><circle cx="790" cy="305" r="13"/></g><circle cx="1030" cy="305" r="14" fill="#122733" stroke="#e0c476" stroke-width="4" stroke-dasharray="5 4"/></g><text x="600" y="500" fill="#9eb3bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Corporate rights in installations and use do not themselves create a sovereign corporation</text></svg>
