<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Extraterrestrial corporate liability</title><desc id="desc">A flow from ordinary loss to insured harm, emergencies, and state-level treaty responsibility.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131b"/><stop offset="1" stop-color="#13242c"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#6aaec0"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#edf5f6" font-family="Georgia,serif" font-size="31">Allocation of extraterrestrial loss</text><text x="60" y="105" fill="#9fb4bd" font-family="Arial,sans-serif" font-size="17">Public responsibility grows with consequences, not merely with corporate size</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="205" width="230" height="175" rx="16" fill="#173342" stroke="#4f8598"/><text x="170" y="246" fill="#e5f1f4" font-size="19" font-weight="700">ORDINARY LOSS</text><text x="170" y="286" fill="#bed0d7" font-size="15">operator · contract</text><text x="170" y="313" fill="#bed0d7" font-size="15">retained risk</text><text x="170" y="340" fill="#bed0d7" font-size="15">civil remedy</text><rect x="335" y="205" width="230" height="175" rx="16" fill="#1d3d49" stroke="#5e9cac"/><text x="450" y="246" fill="#e5f1f4" font-size="19" font-weight="700">INSURED HARM</text><text x="450" y="286" fill="#bed0d7" font-size="15">vehicle · cargo · crew</text><text x="450" y="313" fill="#bed0d7" font-size="15">third party</text><text x="450" y="340" fill="#bed0d7" font-size="15">policy limits</text><rect x="615" y="205" width="230" height="175" rx="16" fill="#334145" stroke="#b69d59"/><text x="730" y="246" fill="#fff0c3" font-size="19" font-weight="700">EMERGENCY</text><text x="730" y="286" fill="#d7d0b9" font-size="15">rescue · mitigation</text><text x="730" y="313" fill="#d7d0b9" font-size="15">technical command</text><text x="730" y="340" fill="#d7d0b9" font-size="15">costs assessed later</text><rect x="895" y="205" width="250" height="175" rx="16" fill="#493032" stroke="#c77d7d"/><text x="1020" y="246" fill="#ffe0df" font-size="19" font-weight="700">PUBLIC EXPOSURE</text><text x="1020" y="286" fill="#e0c4c4" font-size="15">catastrophic harm</text><text x="1020" y="313" fill="#e0c4c4" font-size="15">treaty claim</text><text x="1020" y="340" fill="#e0c4c4" font-size="15">defined indemnity</text></g><g stroke="#6aaec0" stroke-width="3" marker-end="url(#a)"><path d="M285 292h35"/><path d="M565 292h35"/><path d="M845 292h35"/></g><text x="600" y="500" fill="#9fb4bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Registry identifies the state that must answer, investigate, and enforce</text></svg>
