<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Flags and registration in space</title><desc id="desc">Flag and registry support identity and jurisdiction but do not create territorial sovereignty.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131d"/><stop offset="1" stop-color="#132533"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Flag, registry, and title</text><text x="60" y="105" fill="#a3b6c1" font-family="Arial,sans-serif" font-size="17">Related evidence with different legal functions</text>
<g font-family="Arial,sans-serif"><rect x="75" y="180" width="300" height="260" rx="18" fill="#173548" stroke="#5e91a5"/><path d="M145 360V225m0 10h150l-30 45 30 45H145" fill="none" stroke="#e3edf0" stroke-width="8" stroke-linejoin="round"/><text x="225" y="395" fill="#dcebef" font-size="20" text-anchor="middle" font-weight="700">FLAG</text><text x="225" y="423" fill="#b8cbd3" font-size="15" text-anchor="middle">affiliation · ceremony · notice</text><rect x="450" y="180" width="300" height="260" rx="18" fill="#20414e" stroke="#72afbe"/><rect x="525" y="225" width="150" height="130" rx="8" fill="none" stroke="#dcebef" stroke-width="6"/><path d="M555 260h90m-90 30h90m-90 30h65" stroke="#dcebef" stroke-width="5"/><text x="600" y="395" fill="#dcebef" font-size="20" text-anchor="middle" font-weight="700">REGISTRY</text><text x="600" y="423" fill="#b8cbd3" font-size="15" text-anchor="middle">identity · jurisdiction · responsibility</text><rect x="825" y="180" width="300" height="260" rx="18" fill="#30383a" stroke="#a58f58"/><path d="M875 285h200M975 230l70 55-70 55" fill="none" stroke="#e0c476" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="975" y="395" fill="#f8e6b4" font-size="20" text-anchor="middle" font-weight="700">TERRITORIAL TITLE</text><text x="975" y="423" fill="#d2cbb8" font-size="15" text-anchor="middle">requires more than either symbol</text></g><text x="600" y="520" fill="#9fb2bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Maintained works and continuous use supply the strongest additional evidence</text></svg>
