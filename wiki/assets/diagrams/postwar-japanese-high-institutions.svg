<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d"><title id="t">High institutions of postwar Japan</title><desc id="d">Diagram showing the Emperor, Cabinet, Imperial Conference, Defense Council, armed services, ministries, court, and corporate houses.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#071015"/></linearGradient><style>.a{fill:#15232c;stroke:#79b8c7;stroke-width:2}.c{fill:#192027;stroke:#b09a70;stroke-width:1.5}.h{fill:#f2eadc;font:700 20px Georgia,serif;text-anchor:middle}.p{fill:#c9d2d2;font:14px Arial,sans-serif;text-anchor:middle}.l{stroke:#79b8c7;stroke-width:2;fill:none}.q{stroke:#b09a70;stroke-width:1.5;stroke-dasharray:7 7;fill:none}</style></defs><rect width="960" height="620" rx="24" fill="url(#b)"/><text class="h" x="480" y="42" font-size="26">High institutions of postwar Japan</text><text class="p" x="480" y="67">sanction, coordination, strategy, administration, and implementation</text><rect class="a" x="330" y="90" width="300" height="82" rx="14"/><text class="h" x="480" y="122">Emperor and court</text><text class="p" x="480" y="148">sanction, arbitration, legitimacy</text><rect class="a" x="330" y="225" width="300" height="82" rx="14"/><text class="h" x="480" y="257">Prime minister and Cabinet</text><text class="p" x="480" y="283">ordinary executive coordination</text><rect class="c" x="60" y="225" width="225" height="82" rx="14"/><text class="h" x="173" y="257">Imperial Conference</text><text class="p" x="173" y="283">exceptional settlement</text><rect class="c" x="675" y="225" width="225" height="82" rx="14"/><text class="h" x="788" y="257">Defense Council</text><text class="p" x="788" y="283">joint strategic policy</text><rect class="c" x="60" y="385" width="225" height="82" rx="14"/><text class="h" x="173" y="417">Army and Navy</text><text class="p" x="173" y="443">command, procurement, advice</text><rect class="c" x="368" y="385" width="225" height="82" rx="14"/><text class="h" x="480" y="417">Ministries</text><text class="p" x="480" y="443">budget, law, standards, plans</text><rect class="c" x="675" y="385" width="225" height="82" rx="14"/><text class="h" x="788" y="417">Banks and zaibatsu</text><text class="p" x="788" y="443">finance, production, networks</text><rect class="a" x="280" y="520" width="400" height="68" rx="14"/><text class="h" x="480" y="548">Imperial policy settlement</text><text class="p" x="480" y="572">no institution receives every power or every veto</text><path class="l" d="M480 172v53M330 266h-45M630 266h45M480 307v78M285 426h83M593 426h82M173 307v78M788 307v78M173 467l180 53M480 467v53M788 467L608 520"/><path class="q" d="M330 131L173 225M630 131l158 94"/></svg>
