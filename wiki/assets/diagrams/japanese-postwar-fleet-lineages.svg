<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Japanese postwar fleet lineages</title><desc id="desc">A timeline of battleship, carrier, cruiser, escort, attack-submarine, missile-submarine, and special transport development between 1941 and 1985.</desc>
  <rect width="1200" height="720" rx="24" fill="#10171b"/>
  <text x="58" y="58" fill="#f2ece2" font-family="Georgia,serif" font-size="35">Japanese naval lineages · 1941–1985</text>
  <text x="58" y="93" fill="#aebbc1" font-family="Arial,sans-serif" font-size="18">Commissioning and introduction bands from the controlling naval register</text>
  <g font-family="Arial,sans-serif">
    <line x1="170" y1="132" x2="1115" y2="132" stroke="#557581" stroke-width="3"/>
    <g fill="#9fb1b9" font-size="14" text-anchor="middle"><text x="170" y="119">1941</text><text x="330" y="119">1950</text><text x="490" y="119">1960</text><text x="650" y="119">1970</text><text x="810" y="119">1976</text><text x="970" y="119">1982</text><text x="1115" y="119">1985</text></g>
    <g fill="#e2bd6c" font-size="17" font-weight="700"><text x="58" y="190">HEAVY GUN</text><text x="58" y="275">FLEET CARRIERS</text><text x="58" y="360">LIGHT CARRIERS</text><text x="58" y="445">CRUISERS &amp; ESCORTS</text><text x="58" y="530">ATTACK SUBMARINES</text><text x="58" y="615">MISSILE &amp; TRANSPORT</text></g>
    <g fill="#2e3238" stroke="#8b7b81"><rect x="190" y="154" width="300" height="62" rx="11"/></g><text x="210" y="181" fill="#fff" font-size="17" font-weight="700">Yamato · Musashi</text><text x="210" y="202" fill="#c7c9cc" font-size="13">1941–42 · active 1985</text>
    <g fill="#3a2930" stroke="#b36a78"><rect x="220" y="238" width="210" height="62" rx="11"/><rect x="470" y="238" width="210" height="62" rx="11"/><rect x="720" y="238" width="210" height="62" rx="11"/><rect x="950" y="238" width="180" height="62" rx="11"/></g>
    <g fill="#fff" font-size="16" font-weight="700"><text x="240" y="265">Taihō improved</text><text x="490" y="265">Shinano</text><text x="740" y="265">Amagi · four ships</text><text x="970" y="265">Hakuryū · two</text></g><g fill="#d6c3c8" font-size="13"><text x="240" y="286">1944–48</text><text x="490" y="286">1946</text><text x="740" y="286">1957–65</text><text x="970" y="286">1980–83</text></g>
    <rect x="585" y="323" width="360" height="62" rx="11" fill="#293642" stroke="#64879a"/><text x="605" y="350" fill="#fff" font-size="16" font-weight="700">Zuihō II · four light carriers</text><text x="605" y="371" fill="#c3d0d6" font-size="13">1962–69 · all active</text>
    <rect x="440" y="408" width="680" height="62" rx="11" fill="#253943" stroke="#5c8b9e"/><text x="460" y="435" fill="#fff" font-size="16" font-weight="700">Ibuki · Takao II · Maya | Asakaze · Amatsukaze · Hatsuyuki | Isuzu · Chikugo · Yūbari</text><text x="460" y="456" fill="#c3d0d6" font-size="13">1952–82 · command, air defense, surface attack, ASW, route escort</text>
    <g fill="#303640" stroke="#697f9b"><rect x="620" y="493" width="230" height="62" rx="11"/><rect x="880" y="493" width="240" height="62" rx="11"/></g><g fill="#fff" font-size="16" font-weight="700"><text x="640" y="520">Type 24 · Type 30</text><text x="900" y="520">Type 38 SSN · Yūshio</text></g><g fill="#c7cdd6" font-size="13"><text x="640" y="541">1964–78</text><text x="900" y="541">1978–85</text></g>
    <g fill="#3b3426" stroke="#a5874b"><rect x="660" y="578" width="190" height="62" rx="11"/><rect x="880" y="578" width="240" height="62" rx="11"/></g><g fill="#fff" font-size="16" font-weight="700"><text x="680" y="605">Type 32 SSGN</text><text x="900" y="605">I-361 · I-460 · I-490</text></g><g fill="#d6ccb5" font-size="13"><text x="680" y="626">1972–79 · six active</text><text x="900" y="626">1944–76 · special transport</text></g>
    <text x="58" y="685" fill="#aebbc1" font-size="15">Line position is approximate within registered commissioning bands; it does not establish individual hull dates.</text>
  </g>
</svg>
