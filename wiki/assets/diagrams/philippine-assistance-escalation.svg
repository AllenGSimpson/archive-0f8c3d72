<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Philippine Independence Assistance Program</title><desc id="desc">A five-stage flow from the Siam Formula through civic assistance and covert support to the Davao Papers, revolt, and negotiated sovereignty.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.n{font:700 16px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.07em}.t{font:700 19px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c1ccd4}.box{fill:#162733;stroke:#537286;stroke-width:2}.civic{fill:#19343a;stroke:#55a6a1}.expose{fill:#4a3029;stroke:#ce8a67}.war{fill:#40262a;stroke:#c86870}.settle{fill:#263929;stroke:#78a86c}.arrow{fill:none;stroke:#e8bd57;stroke-width:4}.tip{fill:#e8bd57}.note{font:italic 15px Georgia,serif;fill:#84c7c3}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">Assistance, exposure, and sovereignty</text><text x="48" y="92" class="s">The program escalated by layers; it did not begin as an arms pipeline</text>
  <g transform="translate(48 150)"><rect class="box" width="196" height="225" rx="8"/><text x="18" y="34" class="n">1951 · FORMULA</text><text x="18" y="72" class="t">Siam Formula</text><text x="18" y="107" class="d">Domestic sovereignty</text><text x="18" y="132" class="d">Religious guarantees</text><text x="18" y="157" class="d">No annexation</text><text x="18" y="182" class="d">Treaty access only</text></g>
  <path d="M244 263 H275" class="arrow"/><polygon points="286,263 270,254 270,272" class="tip"/>
  <g transform="translate(286 128)"><rect class="box civic" width="216" height="270" rx="8"/><text x="18" y="34" class="n">1951–52 · PUBLIC</text><text x="18" y="72" class="t">Civic assistance</text><text x="18" y="107" class="d">Legal relief · scholarships</text><text x="18" y="132" class="d">Publishing · radio</text><text x="18" y="157" class="d">Political finance</text><text x="18" y="182" class="d">Trade · technical training</text><path d="M18 207 H198" stroke="#55a6a1"/><text x="18" y="237" class="t">Covert layer</text><text x="18" y="260" class="d">Arms · cadres · radios</text></g>
  <path d="M502 263 H533" class="arrow"/><polygon points="544,263 528,254 528,272" class="tip"/>
  <g transform="translate(544 150)"><rect class="box expose" width="196" height="225" rx="8"/><text x="18" y="34" class="n">1953 · EXPOSURE</text><text x="18" y="72" class="t">Davao Papers</text><text x="18" y="107" class="d">Panabo lorry accident</text><text x="18" y="132" class="d">Armored components</text><text x="18" y="157" class="d">Technicians · inventories</text><text x="18" y="182" class="d">Draft association treaty</text></g>
  <path d="M740 263 H771" class="arrow"/><polygon points="782,263 766,254 766,272" class="tip"/>
  <g transform="translate(782 128)"><rect class="box war" width="174" height="270" rx="8"/><text x="18" y="34" class="n">1953–56 · WAR</text><text x="18" y="72" class="t">Legitimacy crisis</text><text x="18" y="107" class="d">Arrests and emergency</text><text x="18" y="132" class="d">Luneta shootings</text><text x="18" y="157" class="d">Military defections</text><text x="18" y="182" class="d">National revolt</text><text x="18" y="222" class="d">Japan remains one</text><text x="18" y="247" class="d">degree below war</text></g>
  <path d="M956 263 H987" class="arrow"/><polygon points="998,263 982,254 982,272" class="tip"/>
  <g transform="translate(998 150)"><rect class="box settle" width="154" height="225" rx="8"/><text x="15" y="34" class="n">1957–58</text><text x="15" y="72" class="t">Settlement</text><text x="15" y="107" class="d">Withdrawal</text><text x="15" y="132" class="d">Sovereignty</text><text x="15" y="157" class="d">Association</text><text x="15" y="182" class="d">by treaty</text></g>
  <path d="M394 420 C460 530 810 548 1074 404" fill="none" stroke="#70b9b5" stroke-width="3" stroke-dasharray="9 7"/><polygon points="1083,397 1074,415 1065,400" fill="#70b9b5"/><text x="478" y="523" class="note">Political promises remain the basis on which postwar association claims legitimacy</text>
  <text x="48" y="620" class="s">Analytical sequence. Exact agencies, budgets, shipment totals, and internal program title remain open.</text>
</svg>
