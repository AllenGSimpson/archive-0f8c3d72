<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">World order in 2000</title>
  <desc id="desc">Five durable political systems surround a central armed concert and connect through trade, technical standards, orbital law, and strategic restraint.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#111d29"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="60" y="65" fill="#eef4f6" font-family="Georgia,serif" font-size="31">The five-system world at the millennium</text>
  <text x="60" y="98" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">Rival systems connected by rules and exchange, without a universal sovereign</text>
  <g stroke="#425769" stroke-width="3" fill="none"><path d="M600 320L290 190M600 320L910 190M600 320L185 420M600 320L1015 420M600 320L600 510"/></g>
  <g font-family="Arial,sans-serif" filter="url(#s)">
    <g transform="translate(465 235)"><circle cx="135" cy="85" r="96" fill="#162a36" stroke="#d3b868" stroke-width="3"/><text x="135" y="72" text-anchor="middle" fill="#fff4d2" font-size="21" font-weight="700">ARMED</text><text x="135" y="99" text-anchor="middle" fill="#fff4d2" font-size="21" font-weight="700">CONCERT</text><text x="135" y="129" text-anchor="middle" fill="#aebfc8" font-size="13">restraint · recognition</text></g>
    <g transform="translate(115 125)"><rect width="350" height="112" rx="16" fill="#231d20" stroke="#8e665d" stroke-width="3"/><text x="175" y="44" text-anchor="middle" fill="#f3e8e5" font-size="21" font-weight="700">EINHEITSPAKT</text><text x="175" y="73" text-anchor="middle" fill="#c7b5b1" font-size="15">continental empire · heavy industry</text><text x="175" y="94" text-anchor="middle" fill="#c7b5b1" font-size="15">German interplanetary infrastructure</text></g>
    <g transform="translate(735 125)"><rect width="350" height="112" rx="16" fill="#26231c" stroke="#b49962" stroke-width="3"/><text x="175" y="44" text-anchor="middle" fill="#f7f0de" font-size="21" font-weight="700">GEACPS</text><text x="175" y="73" text-anchor="middle" fill="#d0c4a8" font-size="15">maritime hierarchy · production networks</text><text x="175" y="94" text-anchor="middle" fill="#d0c4a8" font-size="15">Japanese robotics and standards</text></g>
    <g transform="translate(35 365)"><rect width="350" height="112" rx="16" fill="#1b2825" stroke="#648f8c" stroke-width="3"/><text x="175" y="44" text-anchor="middle" fill="#e4f1ef" font-size="21" font-weight="700">AMERICAN HEMISPHERE</text><text x="175" y="73" text-anchor="middle" fill="#b7cfcc" font-size="15">continental security · corporate reach</text><text x="175" y="94" text-anchor="middle" fill="#b7cfcc" font-size="15">platform markets and high traffic</text></g>
    <g transform="translate(815 365)"><rect width="350" height="112" rx="16" fill="#1c242c" stroke="#657d93" stroke-width="3"/><text x="175" y="44" text-anchor="middle" fill="#e7edf3" font-size="21" font-weight="700">BRITISH COMMONWEALTH</text><text x="175" y="73" text-anchor="middle" fill="#bac7d2" font-size="15">negotiated maritime system</text><text x="175" y="94" text-anchor="middle" fill="#bac7d2" font-size="15">sovereign planetary communications</text></g>
    <g transform="translate(425 488)"><rect width="350" height="100" rx="16" fill="#25271d" stroke="#7c8d67" stroke-width="3"/><text x="175" y="40" text-anchor="middle" fill="#edf1e4" font-size="21" font-weight="700">LATIN SYSTEM</text><text x="175" y="68" text-anchor="middle" fill="#c5ceb7" font-size="15">confederal institutions · exploration navy</text><text x="175" y="88" text-anchor="middle" fill="#c5ceb7" font-size="15">Mediterranean and Catholic public order</text></g>
  </g>
  <text x="600" y="604" text-anchor="middle" fill="#8195a3" font-family="Arial,sans-serif" font-size="13">Trade · technical standards · orbital safety · planetary communications · crisis restraint</text>
</svg>
