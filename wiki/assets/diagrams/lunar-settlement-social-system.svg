<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Five lunar settlement societies around the millennium</title>
  <desc id="desc">Kennedy, Mondhafen Süd, Serenity, Kaguya, and Sancta Maria Lunae surround a shared lunar civic field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10151b"/><stop offset="1" stop-color="#24231f"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#d7d5cb"/><stop offset=".72" stop-color="#8f918d"/><stop offset="1" stop-color="#626762"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity=".18" fill="#fff"><circle cx="80" cy="90" r="2"/><circle cx="167" cy="52" r="1.5"/><circle cx="1065" cy="118" r="2"/><circle cx="1120" cy="72" r="1"/><circle cx="1030" cy="640" r="1.5"/><circle cx="128" cy="625" r="1"/></g>
  <text x="600" y="52" text-anchor="middle" fill="#eee8d9" font-family="Georgia,serif" font-size="29">Five settlement traditions on one Moon</text>
  <text x="600" y="82" text-anchor="middle" fill="#aeb1ad" font-family="Arial,sans-serif" font-size="15">Shared traffic, rescue, science, and spectacle without shared sovereignty</text>
  <g stroke="#9fa39f" stroke-width="2" fill="none" opacity=".68"><path d="M600 330 L232 190"/><path d="M600 330 L968 190"/><path d="M600 330 L192 505"/><path d="M600 330 L1008 505"/><path d="M600 330 L600 610"/></g>
  <g filter="url(#shadow)"><circle cx="600" cy="330" r="145" fill="url(#moon)" stroke="#d9d7cd" stroke-width="2"/><circle cx="545" cy="285" r="22" fill="#777b77" opacity=".5"/><circle cx="652" cy="375" r="31" fill="#737773" opacity=".42"/><circle cx="650" cy="260" r="15" fill="#777b77" opacity=".45"/><text x="600" y="306" text-anchor="middle" fill="#151718" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">LUNAR SOCIETY</text><text x="600" y="342" text-anchor="middle" fill="#111" font-family="Georgia,serif" font-size="25">Common experience</text><text x="600" y="370" text-anchor="middle" fill="#242726" font-family="Arial,sans-serif" font-size="14">different law · work · household · memory</text></g>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g><rect x="72" y="118" width="320" height="140" rx="14" fill="#253142" stroke="#6482aa"/><text x="232" y="153" text-anchor="middle" fill="#dce9f6" font-size="14" letter-spacing="1.5">KENNEDY</text><text x="232" y="185" text-anchor="middle" fill="#fff" font-size="21">American corporate pluralism</text><text x="232" y="216" text-anchor="middle" fill="#c3cfdb" font-size="14">several employers · households · first birth</text></g>
    <g><rect x="808" y="118" width="320" height="140" rx="14" fill="#34272a" stroke="#a56a6e"/><text x="968" y="153" text-anchor="middle" fill="#f2dfe0" font-size="14" letter-spacing="1.5">MONDHAFEN SÜD</text><text x="968" y="185" text-anchor="middle" fill="#fff" font-size="21">German planned industry</text><text x="968" y="216" text-anchor="middle" fill="#d8c4c5" font-size="14">selected settlers · water · orbital supply</text></g>
    <g><rect x="32" y="435" width="320" height="140" rx="14" fill="#26362f" stroke="#6f947d"/><text x="192" y="470" text-anchor="middle" fill="#dcebe1" font-size="14" letter-spacing="1.5">SERENITY</text><text x="192" y="502" text-anchor="middle" fill="#fff" font-size="21">Commonwealth public service</text><text x="192" y="533" text-anchor="middle" fill="#c5d4ca" font-size="14">distributed nations · family accommodation</text></g>
    <g><rect x="848" y="435" width="320" height="140" rx="14" fill="#2f2c42" stroke="#8579ad"/><text x="1008" y="470" text-anchor="middle" fill="#e9e3fa" font-size="14" letter-spacing="1.5">KAGUYA</text><text x="1008" y="502" text-anchor="middle" fill="#fff" font-size="21">Japanese machine-first order</text><text x="1008" y="533" text-anchor="middle" fill="#cec9df" font-size="14">robotic preparation · compact residence</text></g>
    <g><rect x="440" y="570" width="320" height="120" rx="14" fill="#3a3222" stroke="#b09055"/><text x="600" y="605" text-anchor="middle" fill="#f1e4c8" font-size="14" letter-spacing="1.5">SANCTA MARIA LUNAE</text><text x="600" y="637" text-anchor="middle" fill="#fff" font-size="21">Latin scientific and religious life</text><text x="600" y="666" text-anchor="middle" fill="#dbceb7" font-size="14">multinational law · technical Latin · parish</text></g>
  </g>
  <text x="600" y="708" text-anchor="middle" fill="#8f928f" font-family="Arial,sans-serif" font-size="13">Settlement culture grows from the institutions that keep people alive—and from the reasons each sponsor believes they should stay.</text>
</svg>
