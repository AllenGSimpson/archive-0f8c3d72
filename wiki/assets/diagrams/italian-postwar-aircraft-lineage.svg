<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Italian postwar military aircraft registry</title>
  <desc id="desc">Timeline from the 1954 Aerfer Sagittario II research fighter through the G.91R, MB.326, Aerfer Leone, SM.82 Aquila, and 1982 Fiat G.85.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a24"/><stop offset="1" stop-color="#213139"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d5b86a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="600" y="57" text-anchor="middle" fill="#f2ead9" font-family="Georgia,serif" font-size="34" font-weight="700">Italian postwar aircraft registry</text>
  <text x="600" y="88" text-anchor="middle" fill="#afbbc1" font-family="Arial,sans-serif" font-size="17">research · tactical aviation · training · interception · maritime strike · air superiority</text>
  <path d="M105 345H1095" fill="none" stroke="#d5b86a" stroke-width="5" marker-end="url(#arrow)"/>
  <g fill="#d5b86a">
    <circle cx="145" cy="345" r="9"/><circle cx="325" cy="345" r="9"/><circle cx="505" cy="345" r="9"/><circle cx="685" cy="345" r="9"/><circle cx="865" cy="345" r="9"/><circle cx="1045" cy="345" r="9"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <rect x="60" y="135" width="170" height="165" rx="17" fill="#293c49" stroke="#ca8264" stroke-width="3"/>
    <text x="145" y="174" text-anchor="middle" fill="#f3ebdc" font-size="20" font-weight="700">Sagittario II</text><text x="145" y="204" text-anchor="middle" fill="#dce3e6" font-size="17">1954 trials</text><text x="145" y="235" text-anchor="middle" fill="#aebbc1" font-size="14">research fighter</text><text x="145" y="261" text-anchor="middle" fill="#aebbc1" font-size="14">1,210 km/h</text>
    <path d="M145 300V336" stroke="#ca8264" stroke-width="3"/>
    <rect x="240" y="390" width="170" height="165" rx="17" fill="#293c49" stroke="#d5b86a" stroke-width="3"/>
    <text x="325" y="430" text-anchor="middle" fill="#f3ebdc" font-size="20" font-weight="700">Fiat G.91R</text><text x="325" y="460" text-anchor="middle" fill="#dce3e6" font-size="17">1957</text><text x="325" y="491" text-anchor="middle" fill="#aebbc1" font-size="14">tactical · recon</text><text x="325" y="517" text-anchor="middle" fill="#aebbc1" font-size="14">four-country need</text>
    <path d="M325 354V390" stroke="#d5b86a" stroke-width="3"/>
    <rect x="420" y="135" width="170" height="165" rx="17" fill="#293c49" stroke="#7eb19a" stroke-width="3"/>
    <text x="505" y="174" text-anchor="middle" fill="#f3ebdc" font-size="18" font-weight="700">Aermacchi MB.326</text><text x="505" y="204" text-anchor="middle" fill="#dce3e6" font-size="17">1961</text><text x="505" y="235" text-anchor="middle" fill="#aebbc1" font-size="14">advanced trainer</text><text x="505" y="261" text-anchor="middle" fill="#aebbc1" font-size="14">light attack</text>
    <path d="M505 300V336" stroke="#7eb19a" stroke-width="3"/>
    <rect x="600" y="390" width="170" height="165" rx="17" fill="#293c49" stroke="#8ba8b8" stroke-width="3"/>
    <text x="685" y="430" text-anchor="middle" fill="#f3ebdc" font-size="20" font-weight="700">Aerfer Leone</text><text x="685" y="460" text-anchor="middle" fill="#dce3e6" font-size="17">1967</text><text x="685" y="491" text-anchor="middle" fill="#aebbc1" font-size="14">interceptor</text><text x="685" y="517" text-anchor="middle" fill="#aebbc1" font-size="14">2,150 km/h</text>
    <path d="M685 354V390" stroke="#8ba8b8" stroke-width="3"/>
    <rect x="780" y="135" width="170" height="165" rx="17" fill="#293c49" stroke="#8ea36e" stroke-width="3"/>
    <text x="865" y="174" text-anchor="middle" fill="#f3ebdc" font-size="18" font-weight="700">SM.82 Aquila</text><text x="865" y="204" text-anchor="middle" fill="#dce3e6" font-size="17">1974</text><text x="865" y="235" text-anchor="middle" fill="#aebbc1" font-size="14">maritime strike</text><text x="865" y="261" text-anchor="middle" fill="#aebbc1" font-size="14">patrol · 2,300 km</text>
    <path d="M865 300V336" stroke="#8ea36e" stroke-width="3"/>
    <rect x="960" y="390" width="170" height="165" rx="17" fill="#293c49" stroke="#d3956f" stroke-width="3"/>
    <text x="1045" y="430" text-anchor="middle" fill="#f3ebdc" font-size="20" font-weight="700">Fiat G.85</text><text x="1045" y="460" text-anchor="middle" fill="#dce3e6" font-size="17">1982</text><text x="1045" y="491" text-anchor="middle" fill="#aebbc1" font-size="14">air superiority</text><text x="1045" y="517" text-anchor="middle" fill="#aebbc1" font-size="14">2,350 km/h</text>
    <path d="M1045 354V390" stroke="#d3956f" stroke-width="3"/>
  </g>
  <text x="600" y="625" text-anchor="middle" fill="#b5c1c6" font-family="Arial,sans-serif" font-size="17">mission sequence, not a claim of shared airframe ancestry</text>
</svg>
