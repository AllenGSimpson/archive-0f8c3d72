<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Indian corporate frontier</title><desc id="desc">American gold-dollar finance and Japanese corporate networks compete inside Indian successor-state controls.</desc><defs><style>.bg{fill:#08111c}.p{fill:#102131;stroke:#3a5269;stroke-width:2}.us{fill:#4771aa}.jp{fill:#a64f4f}.in{fill:#c49c59}.h{font:700 30px Georgia,serif;fill:#f2f4ee}.t{font:18px Arial,sans-serif;fill:#d9e2e8}.s{font:15px Arial,sans-serif;fill:#a8b8c5}.k{font:700 15px Arial,sans-serif;fill:#07111a}.l{fill:none;stroke:#9fb2c1;stroke-width:4;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#9fb2c1"/></marker></defs><rect class="bg" width="1200" height="650" rx="18"/><text class="h" x="600" y="52" text-anchor="middle">Indian corporate frontier · c. 2000</text><rect class="p" x="55" y="115" width="330" height="195" rx="14"/><rect class="us" x="55" y="115" width="330" height="42" rx="14"/><text class="k" x="220" y="142" text-anchor="middle">AMERICAN COMMERCIAL OFFER</text><text class="t" x="80" y="196">Direct gold-dollar quotation</text><text class="t" x="80" y="230">Portable credit and insurance</text><text class="t" x="80" y="264">Software and flexible partnership</text><text class="s" x="80" y="294">Shallower inherited physical network</text><rect class="p" x="815" y="115" width="330" height="195" rx="14"/><rect class="jp" x="815" y="115" width="330" height="42" rx="14"/><text class="k" x="980" y="142" text-anchor="middle">JAPANESE CORPORATE OFFER</text><text class="t" x="840" y="196">Gold Yen settlement</text><text class="t" x="840" y="230">Ports, railways and workshops</text><text class="t" x="840" y="264">Employment, security and access</text><text class="s" x="840" y="294">Deeper inherited local network</text><rect class="p" x="375" y="355" width="450" height="210" rx="16"/><rect class="in" x="375" y="355" width="450" height="44" rx="16"/><text class="k" x="600" y="383" text-anchor="middle">INDIAN SUCCESSOR-STATE AUTHORITY</text><text class="t" x="600" y="440" text-anchor="middle">Licenses · customs · land · currency</text><text class="t" x="600" y="476" text-anchor="middle">Concessions · local partners · policing</text><text class="t" x="600" y="512" text-anchor="middle">Strategic-sector and termination rules</text><text class="s" x="600" y="545" text-anchor="middle">No common all-India investment code</text><path class="l" d="M305 310C350 345 400 365 455 385"/><path class="l" d="M895 310C850 345 800 365 745 385"/><rect class="p" x="430" y="105" width="340" height="140" rx="14"/><text class="t" x="600" y="147" text-anchor="middle">Shared transaction field</text><text class="s" x="600" y="183" text-anchor="middle">Bullion · concessions · procurement</text><text class="s" x="600" y="213" text-anchor="middle">Infrastructure · security · services</text><path class="l" d="M385 210h45"/><path class="l" d="M815 210h-45"/><path class="l" d="M600 245v105"/></svg>
