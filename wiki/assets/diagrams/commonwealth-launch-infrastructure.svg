<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Commonwealth launch infrastructure</title><desc id="desc">Diagram connecting distributed Commonwealth production to Cape York, Resolution, Serenity and planetary routes.</desc><rect width="1200" height="600" fill="#10161d"/><text x="60" y="60" fill="#d9e2ea" font-family="Georgia,serif" font-size="34">COMMONWEALTH LAUNCH INFRASTRUCTURE</text><text x="60" y="92" fill="#91a2b3" font-family="Arial,sans-serif" font-size="17">A sovereign route assembled from national workshares, 1988–2000</text><g font-family="Arial,sans-serif"><g fill="#182430" stroke="#7890a6" stroke-width="2"><rect x="60" y="145" width="235" height="100" rx="6"/><rect x="60" y="355" width="235" height="100" rx="6"/><rect x="365" y="250" width="235" height="100" rx="6"/><rect x="670" y="145" width="220" height="100" rx="6"/><rect x="670" y="355" width="220" height="100" rx="6"/><rect x="960" y="250" width="180" height="100" rx="6"/></g><g fill="#edf2f6" font-size="20"><text x="85" y="184">British design, engines,</text><text x="85" y="212">computing and command</text><text x="85" y="394">Canadian avionics,</text><text x="85" y="422">medicine and structures</text><text x="392" y="289">Cape York Space Range</text><text x="392" y="317">launch and recovery</text><text x="698" y="184">Resolution orbital</text><text x="698" y="212">operations center</text><text x="698" y="394">Serenity lunar complex</text><text x="698" y="422">and surface network</text><text x="986" y="289">Valles Marineris</text><text x="986" y="317">and planetary routes</text></g><g stroke="#d6a85f" stroke-width="5" fill="none"><path d="M295 195 C340 195 330 275 365 290"/><path d="M295 405 C340 405 330 325 365 310"/><path d="M600 285 C635 255 640 205 670 195"/><path d="M600 315 C635 345 640 395 670 405"/><path d="M890 195 C930 205 925 270 960 285"/><path d="M890 405 C930 395 925 330 960 315"/></g></g><text x="60" y="520" fill="#a9b7c4" font-family="Arial,sans-serif" font-size="17">Australia supplies the physical gateway; southern African, New Zealand and ocean stations maintain the tracking arc.</text><text x="60" y="550" fill="#a9b7c4" font-family="Arial,sans-serif" font-size="17">Common interfaces let separately funded national hardware operate as one route without creating a Commonwealth federation.</text></svg>
