<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Boardroom primary candidate funnel</title>
  <desc id="desc">Many prospective candidates pass through an institutional viability screen for finance, data, legal, media, staffing, and endorsements before a smaller public field reaches voters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121c"/><stop offset="1" stop-color="#192a38"/></linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#31576b"/><stop offset="1" stop-color="#183342"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".42"/></filter>
    <style>.eyebrow{font:600 22px Arial,sans-serif;letter-spacing:5px;fill:#69d0e5}.title{font:700 51px Georgia,serif;fill:#f4f0e7}.sub{font:23px Arial,sans-serif;fill:#b4c1c9}.head{font:700 24px Arial,sans-serif;fill:#f7f3e9}.copy{font:19px Arial,sans-serif;fill:#cad4da}.tiny{font:17px Arial,sans-serif;fill:#aab8c1}.candidate{fill:#d9e4e7;stroke:#fff;stroke-width:2}.selected{fill:#e5b36a;stroke:#ffe0a8;stroke-width:3}.service{fill:#132b38;stroke:#426678;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="76" class="eyebrow">AMERICAN POLITICAL PROCESS · LATE 1990s</text>
  <text x="80" y="138" class="title">The boardroom primary</text>
  <text x="80" y="180" class="sub">Institutional support determines who can prove viability before voters and party organizations make their formal choices.</text>

  <g transform="translate(85 245)" filter="url(#shadow)">
    <rect width="360" height="510" rx="28" class="service"/>
    <text x="32" y="55" class="head">EARLY SUPPORT</text>
    <text x="32" y="102" class="copy">Finance and favorable credit</text>
    <text x="32" y="146" class="copy">Polling and voter data</text>
    <text x="32" y="190" class="copy">Ballot and campaign counsel</text>
    <text x="32" y="234" class="copy">Staff and consultants</text>
    <text x="32" y="278" class="copy">Advertising and media access</text>
    <text x="32" y="322" class="copy">Travel and meeting space</text>
    <text x="32" y="366" class="copy">Institutional endorsements</text>
    <path d="M32 404H328" stroke="#426678"/>
    <text x="32" y="445" class="tiny">Review asks whether a candidate is viable,</text>
    <text x="32" y="475" class="tiny">compatible, accessible, predictable,</text>
    <text x="32" y="505" class="tiny">and preferable to available alternatives.</text>
  </g>

  <g transform="translate(535 238)">
    <path d="M0 0H530L415 440H115Z" fill="url(#funnel)" stroke="#5a8193" stroke-width="3"/>
    <text x="265" y="54" text-anchor="middle" class="head">PROSPECTIVE FIELD</text>
    <g transform="translate(55 92)">
      <circle cx="0" cy="0" r="23" class="candidate"/><circle cx="62" cy="0" r="23" class="candidate"/><circle cx="124" cy="0" r="23" class="candidate"/><circle cx="186" cy="0" r="23" class="candidate"/><circle cx="248" cy="0" r="23" class="candidate"/><circle cx="310" cy="0" r="23" class="candidate"/><circle cx="372" cy="0" r="23" class="candidate"/><circle cx="434" cy="0" r="23" class="candidate"/>
      <circle cx="31" cy="75" r="23" class="candidate"/><circle cx="93" cy="75" r="23" class="candidate"/><circle cx="155" cy="75" r="23" class="candidate"/><circle cx="217" cy="75" r="23" class="candidate"/><circle cx="279" cy="75" r="23" class="candidate"/><circle cx="341" cy="75" r="23" class="candidate"/><circle cx="403" cy="75" r="23" class="candidate"/>
    </g>
    <text x="265" y="245" text-anchor="middle" class="tiny">SPONSORSHIP · PARTY ACCESS · PUBLIC ATTENTION</text>
    <g transform="translate(170 315)"><circle cx="0" cy="0" r="26" class="selected"/><circle cx="64" cy="0" r="26" class="selected"/><circle cx="128" cy="0" r="26" class="selected"/><circle cx="192" cy="0" r="26" class="selected"/></g>
    <text x="265" y="402" text-anchor="middle" class="head">VIABLE CANDIDATES</text>
  </g>

  <g transform="translate(1155 245)" filter="url(#shadow)">
    <rect width="360" height="510" rx="28" class="service"/>
    <text x="180" y="56" text-anchor="middle" class="head">PUBLIC ELECTION</text>
    <g transform="translate(67 130)"><circle cx="0" cy="0" r="34" class="selected"/><circle cx="75" cy="0" r="34" class="selected"/><circle cx="150" cy="0" r="34" class="selected"/><circle cx="225" cy="0" r="34" class="selected"/></g>
    <text x="180" y="225" text-anchor="middle" class="copy">Voters retain meaningful choice</text>
    <text x="180" y="260" text-anchor="middle" class="copy">among the surviving field.</text>
    <path d="M40 305H320" stroke="#426678"/>
    <text x="180" y="357" text-anchor="middle" class="tiny">The filter is strongest in expensive</text>
    <text x="180" y="387" text-anchor="middle" class="tiny">urban and statewide campaigns.</text>
    <text x="180" y="442" text-anchor="middle" class="tiny">Local reputation, churches, unions,</text>
    <text x="180" y="472" text-anchor="middle" class="tiny">cooperatives, and personal wealth</text>
    <text x="180" y="502" text-anchor="middle" class="tiny">can still provide alternate entry.</text>
  </g>

  <text x="800" y="842" text-anchor="middle" class="copy">“The people vote in November. The corporations nominate in March.” — cynical late-century summary</text>
</svg>
