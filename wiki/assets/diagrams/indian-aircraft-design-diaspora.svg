<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Soviet aircraft-design diaspora in Iran and India</title>
  <desc id="desc">Diagram showing Soviet aviation lineages moving from the collapse through Siberian refuges to Iranian and Indian successor institutions.</desc>
  <defs><style>.bg{fill:#111820}.panel{fill:#1c2732;stroke:#60778a;stroke-width:2}.host{fill:#263849;stroke:#91b0c9;stroke-width:2}.line{fill:none;stroke:#d1aa52;stroke-width:5}.title{font:700 32px Georgia,serif;fill:#f2eee5}.h{font:700 22px Georgia,serif;fill:#f2eee5}.t{font:17px Arial,sans-serif;fill:#d9e1e7}.s{font:15px Arial,sans-serif;fill:#aebdca}.gold{fill:#d1aa52}</style></defs>
  <rect class="bg" width="1200" height="680" rx="22"/>
  <text class="title" x="600" y="55" text-anchor="middle">The Soviet Aircraft-Design Diaspora</text>
  <rect class="panel" x="410" y="90" width="380" height="100" rx="14"/><text class="h" x="600" y="128" text-anchor="middle">Soviet aviation institutions</text><text class="t" x="600" y="158" text-anchor="middle">teams · archives · test practice · tooling</text>
  <path class="line" d="M600 190V245M600 245H145V305M600 245H450V305M600 245H750V305M600 245H1055V305"/>
  <circle class="gold" cx="600" cy="245" r="8"/>
  <rect class="host" x="35" y="305" width="220" height="180" rx="14"/><text class="h" x="145" y="342" text-anchor="middle">Iran</text><text class="t" x="145" y="379" text-anchor="middle">Tupolev core</text><text class="t" x="145" y="409" text-anchor="middle">Sukhoi core</text><text class="s" x="145" y="446" text-anchor="middle">long-range aircraft</text><text class="s" x="145" y="470" text-anchor="middle">tactical strike</text>
  <rect class="host" x="340" y="305" width="220" height="180" rx="14"/><text class="h" x="450" y="342" text-anchor="middle">Hindustan</text><text class="t" x="450" y="379" text-anchor="middle">MiG branch</text><text class="s" x="450" y="416" text-anchor="middle">fighters · interceptors</text><text class="s" x="450" y="446" text-anchor="middle">defense of Delhi</text>
  <rect class="host" x="640" y="305" width="220" height="180" rx="14"/><text class="h" x="750" y="342" text-anchor="middle">Congress India</text><text class="t" x="750" y="379" text-anchor="middle">Ilyushin branch</text><text class="s" x="750" y="416" text-anchor="middle">attack · transport</text><text class="s" x="750" y="446" text-anchor="middle">dispersed-field support</text>
  <rect class="host" x="945" y="305" width="220" height="180" rx="14"/><text class="h" x="1055" y="342" text-anchor="middle">Hyderabad</text><text class="t" x="1055" y="379" text-anchor="middle">Yakovlev branch</text><text class="s" x="1055" y="416" text-anchor="middle">trainers · light fighters</text><text class="s" x="1055" y="446" text-anchor="middle">short runs · export</text>
  <rect class="panel" x="225" y="545" width="750" height="82" rx="14"/><text class="h" x="600" y="578" text-anchor="middle">Indianization</text><text class="t" x="600" y="608" text-anchor="middle">host-state finance, local engineers, climate, doctrine, engines, and production reshape every lineage</text>
</svg>
