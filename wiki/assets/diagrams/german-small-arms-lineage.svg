<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">German postwar small-arms lineage</title>
  <desc id="desc">A chronology of registered German rifles, machine guns, and the Einheitsleiste 79 mounting standard from 1944 to 1983.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10161b"/><stop offset="1" stop-color="#202a31"/></linearGradient></defs>
  <rect width="1200" height="720" rx="26" fill="url(#b)"/>
  <text x="58" y="64" fill="#f2eadb" font-family="Georgia,serif" font-size="34">German postwar small arms</text>
  <text x="58" y="98" fill="#aeb9c0" font-family="Arial,sans-serif" font-size="18">Registered service introductions and technical standards</text>
  <g font-family="Arial,sans-serif">
    <text x="60" y="154" fill="#d8b36a" font-size="21" font-weight="700">RIFLES</text>
    <line x1="110" y1="220" x2="1085" y2="220" stroke="#708b96" stroke-width="5"/>
    <g transform="translate(70 176)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="235" height="116" rx="14" fill="#263640" stroke="#66818a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">StG 44 / StG 45A</text><text x="16" y="128" fill="#c6d0d4" font-size="15">1944 / 1945 · 7.92×33 mm</text><text x="16" y="154" fill="#c6d0d4" font-size="14">Wartime and simplified export line</text></g>
    <g transform="translate(350 176)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="235" height="116" rx="14" fill="#263640" stroke="#66818a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">Gewehr 58</text><text x="16" y="128" fill="#c6d0d4" font-size="15">1958 · 7.92×57 mm</text><text x="16" y="154" fill="#c6d0d4" font-size="14">Full-power rifle and marksman arm</text></g>
    <g transform="translate(630 176)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="235" height="116" rx="14" fill="#263640" stroke="#66818a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">StG 60</text><text x="16" y="128" fill="#c6d0d4" font-size="15">1961 · 5.6×40 mm</text><text x="16" y="154" fill="#c6d0d4" font-size="14">Standard assault rifle</text></g>
    <g transform="translate(910 176)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="235" height="116" rx="14" fill="#263640" stroke="#66818a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">StG 82</text><text x="16" y="128" fill="#c6d0d4" font-size="15">1983 · 5.6×40 mm</text><text x="16" y="154" fill="#c6d0d4" font-size="14">Elite modular rifle</text></g>
    <text x="60" y="420" fill="#d8b36a" font-size="21" font-weight="700">AUTOMATIC FIRE AND INTERFACE</text>
    <line x1="110" y1="486" x2="1085" y2="486" stroke="#83866a" stroke-width="5"/>
    <g transform="translate(150 442)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="260" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">MG 68</text><text x="16" y="128" fill="#d2d4c7" font-size="15">1968 · 7.92×57 mm belt</text><text x="16" y="154" fill="#d2d4c7" font-size="14">Standard general-purpose MG</text></g>
    <g transform="translate(470 442)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="260" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">leichtes MG 76</text><text x="16" y="128" fill="#d2d4c7" font-size="15">1976 · 5.6×40 mm belt</text><text x="16" y="154" fill="#d2d4c7" font-size="14">Squad automatic weapon</text></g>
    <g transform="translate(790 442)"><circle cx="45" cy="44" r="11" fill="#d8b36a"/><rect y="72" width="260" height="116" rx="14" fill="#34362c" stroke="#858a6a"/><text x="16" y="100" fill="#fff" font-size="18" font-weight="700">Einheitsleiste 79</text><text x="16" y="128" fill="#d2d4c7" font-size="15">Standard · mounting interface</text><text x="16" y="154" fill="#d2d4c7" font-size="14">Native on StG 82; StG 60A6 adapter</text></g>
    <text x="60" y="686" fill="#aeb9c0" font-size="15">Dates and specifications follow the Land Armaments Reference; proposed intermediate Congo modifications remain outside the fixed registry.</text>
  </g>
</svg>
