<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Catholic sacramental practice beyond Earth</title>
  <desc id="desc">Four columns distinguish acts requiring a physically present priest, emergency acts possible without one, administrative support through communications, and care following death.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081019"/><stop offset="1" stop-color="#17293a"/></linearGradient></defs>
  <rect width="1200" height="690" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#eef4f6" font-family="Georgia,serif" font-size="31">Sacraments at interplanetary distance</text>
  <text x="60" y="103" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="17">Technology supports preparation and records; it does not replace sacramental presence</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(55 145)"><rect width="260" height="430" rx="20" fill="#263f50" stroke="#86b7c6" stroke-width="3"/><circle cx="130" cy="78" r="42" fill="none" stroke="#c7e2e9" stroke-width="5"/><path d="M130 50v56M102 78h56" stroke="#c7e2e9" stroke-width="5"/><text x="130" y="150" text-anchor="middle" fill="#ebf7fa" font-size="19" font-weight="700">Physical clerical presence</text><text x="30" y="196" fill="#c1d5dd" font-size="15">• Eucharistic consecration</text><text x="30" y="228" fill="#c1d5dd" font-size="15">• Sacramental confession</text><text x="30" y="260" fill="#c1d5dd" font-size="15">• Anointing of the sick</text><text x="30" y="292" fill="#c1d5dd" font-size="15">• Ordination and confirmation</text><text x="30" y="324" fill="#c1d5dd" font-size="15">• Marriage assistance</text><text x="30" y="374" fill="#8fa9b5" font-size="13">Radio and video cannot substitute</text><text x="30" y="394" fill="#8fa9b5" font-size="13">for the minister's presence.</text></g>
    <g transform="translate(335 145)"><rect width="260" height="430" rx="20" fill="#3e3a29" stroke="#d4bd70" stroke-width="3"/><path d="M130 40l38 65H92z" fill="none" stroke="#f0dc99" stroke-width="5"/><circle cx="130" cy="122" r="10" fill="#f0dc99"/><text x="130" y="150" text-anchor="middle" fill="#fff4cd" font-size="19" font-weight="700">When no priest is present</text><text x="30" y="196" fill="#ddd0a5" font-size="15">• Emergency baptism</text><text x="30" y="228" fill="#ddd0a5" font-size="15">• Prayer and catechesis</text><text x="30" y="260" fill="#ddd0a5" font-size="15">• Approved lay services</text><text x="30" y="292" fill="#ddd0a5" font-size="15">• Reserved Communion</text><text x="30" y="324" fill="#ddd0a5" font-size="15">• Accompaniment of the dying</text><text x="30" y="374" fill="#b2a77f" font-size="13">Impossible Mass attendance does</text><text x="30" y="394" fill="#b2a77f" font-size="13">not bind the crew.</text></g>
    <g transform="translate(615 145)"><rect width="260" height="430" rx="20" fill="#273b47" stroke="#759cab" stroke-width="3"/><rect x="91" y="38" width="78" height="84" rx="8" fill="none" stroke="#b9d1d9" stroke-width="5"/><path d="M108 61h44M108 81h44M108 101h30" stroke="#b9d1d9" stroke-width="4"/><text x="130" y="150" text-anchor="middle" fill="#e5f0f3" font-size="19" font-weight="700">Communications and records</text><text x="30" y="196" fill="#becfd6" font-size="15">• Instruction and counsel</text><text x="30" y="228" fill="#becfd6" font-size="15">• Faculty authentication</text><text x="30" y="260" fill="#becfd6" font-size="15">• Duplicate registers</text><text x="30" y="292" fill="#becfd6" font-size="15">• Later reports and review</text><text x="30" y="324" fill="#becfd6" font-size="15">• Family and diocesan notice</text><text x="30" y="374" fill="#8fa8b2" font-size="13">Delay changes administration,</text><text x="30" y="394" fill="#8fa8b2" font-size="13">not sacramental reality.</text></g>
    <g transform="translate(895 145)"><rect width="250" height="430" rx="20" fill="#2f3440" stroke="#8e96a8" stroke-width="3"/><path d="M125 41v85M84 80h82" stroke="#d1d5df" stroke-width="6"/><text x="125" y="150" text-anchor="middle" fill="#f0f1f5" font-size="19" font-weight="700">Death and committal</text><text x="28" y="196" fill="#cacdd5" font-size="15">• Civil certification</text><text x="28" y="228" fill="#cacdd5" font-size="15">• Ecclesiastical record</text><text x="28" y="260" fill="#cacdd5" font-size="15">• Safe custody of remains</text><text x="28" y="292" fill="#cacdd5" font-size="15">• Return where feasible</text><text x="28" y="324" fill="#cacdd5" font-size="15">• Emergency committal</text><text x="28" y="374" fill="#9fa5b1" font-size="13">Human remains are never treated</text><text x="28" y="394" fill="#9fa5b1" font-size="13">as ordinary cargo or debris.</text></g>
  </g>
  <text x="60" y="635" fill="#d9e2e6" font-family="Arial,sans-serif" font-size="16" font-weight="700">Continuity of doctrine · adaptation of administration · preservation of rites</text>
  <text x="60" y="665" fill="#8197a5" font-family="Arial,sans-serif" font-size="14">Year-2000 practice remains provisional in detail as Mars and Ceres extend travel and communications delay.</text>
</svg>
