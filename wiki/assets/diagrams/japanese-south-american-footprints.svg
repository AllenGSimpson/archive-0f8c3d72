<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Japanese Pacific footholds in South America</title><desc id="desc">Conceptual comparison of Peru as the strategic prize, Ecuador as secondary Pacific partner, and Chile as a balancing customer.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:21px Arial,sans-serif;fill:#d1d0c7}.l{font:bold 27px Arial,sans-serif;fill:#fff}.b{stroke:#c5c8c0;stroke-width:2;rx:18}</style></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">JAPAN ON THE SOUTH AMERICAN PACIFIC</text><text x="58" y="103" class="s">Different relationships beneath one trans-Pacific strategy</text>
  <g transform="translate(70 165)"><rect width="320" height="420" class="b" fill="#344950"/><text x="160" y="58" text-anchor="middle" class="l">PERU</text><text x="160" y="108" text-anchor="middle" class="s">Strategic prize</text><text x="160" y="163" text-anchor="middle" class="s">Ports - minerals - fisheries</text><text x="160" y="202" text-anchor="middle" class="s">arms - signals - repair</text><text x="160" y="241" text-anchor="middle" class="s">military access</text><text x="160" y="315" text-anchor="middle" class="s">Principal foothold</text><text x="160" y="354" text-anchor="middle" class="s">and Monroe dispute</text></g>
  <g transform="translate(440 165)"><rect width="320" height="420" class="b" fill="#3d4b3e"/><text x="160" y="58" text-anchor="middle" class="l">ECUADOR</text><text x="160" y="108" text-anchor="middle" class="s">Secondary partner</text><text x="160" y="163" text-anchor="middle" class="s">Guayaquil - oil - agriculture</text><text x="160" y="202" text-anchor="middle" class="s">shipping - cold storage</text><text x="160" y="241" text-anchor="middle" class="s">patrol and communications</text><text x="160" y="315" text-anchor="middle" class="s">Useful without formal</text><text x="160" y="354" text-anchor="middle" class="s">subordination</text></g>
  <g transform="translate(810 165)"><rect width="320" height="420" class="b" fill="#4b3d46"/><text x="160" y="58" text-anchor="middle" class="l">CHILE</text><text x="160" y="108" text-anchor="middle" class="s">Balancing customer</text><text x="160" y="163" text-anchor="middle" class="s">Copper - radar - patrol aircraft</text><text x="160" y="202" text-anchor="middle" class="s">coastal missiles - electronics</text><text x="160" y="241" text-anchor="middle" class="s">naval training</text><text x="160" y="315" text-anchor="middle" class="s">No Japanese base</text><text x="160" y="354" text-anchor="middle" class="s">multi-bloc procurement</text></g>
  <text x="600" y="652" text-anchor="middle" class="s">Arms, ports, shipping, minerals, and technical missions - not one uniform client system</text>
</svg>
