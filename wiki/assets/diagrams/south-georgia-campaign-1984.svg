<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">South Georgia campaign of 1984</title><desc id="d">Britain retakes lightly defended South Georgia while the much stronger East Falkland fortress remains intact.</desc><rect width="1200" height="520" rx="24" fill="#081722"/><text x="600" y="56" text-anchor="middle" fill="#f4f4ed" font-family="Georgia,serif" font-size="32">SOUTH GEORGIA · MAY 1984</text><g font-family="Arial,sans-serif"><path d="M115 290c80-95 180-130 285-75 55 28 88 74 152 90-66 46-140 66-230 62-94-3-167-30-207-77z" fill="#1d4d56" stroke="#79c1cf" stroke-width="4"/><text x="320" y="285" text-anchor="middle" fill="#efffff" font-size="24">SOUTH GEORGIA</text><text x="320" y="320" text-anchor="middle" fill="#d3eef2" font-size="18">light Argentine defense</text><path d="M85 150C220 95 345 105 460 180" fill="none" stroke="#d7bd75" stroke-width="5"/><path d="M450 168l24 22-32 7z" fill="#d7bd75"/><text x="215" y="115" text-anchor="middle" fill="#fff0bd" font-size="19">COMMONWEALTH TASK FORCE</text><rect x="690" y="125" width="430" height="265" rx="20" fill="#352c2a" stroke="#d38e7d" stroke-width="3"/><text x="905" y="175" text-anchor="middle" fill="#fff" font-size="24">EAST FALKLAND FORTRESS</text><text x="905" y="220" text-anchor="middle" fill="#f4d5ce" font-size="18">airfield · missiles · artillery</text><text x="905" y="252" text-anchor="middle" fill="#f4d5ce" font-size="18">radar · mines · submarines</text><text x="905" y="284" text-anchor="middle" fill="#f4d5ce" font-size="18">large entrenched garrison</text><text x="905" y="335" text-anchor="middle" fill="#ffd59c" font-size="20">UNAFFECTED BY THE VICTORY</text><text x="600" y="465" text-anchor="middle" fill="#bfe3ec" font-size="20">Real operational success → false expectation of a rapid main-island decision</text></g></svg>
