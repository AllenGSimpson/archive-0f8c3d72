<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Commonwealth Orbital Research and Communications Act priorities</title><desc id="desc">Five ordered priorities from tracking and warning to possible human flight.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="31" font-weight="700">Orbital Research and Communications Act · 1958</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">The Butler sequence: useful orbital sovereignty before crewed prestige</text><g font-family="Arial,sans-serif"><g fill="#203541" stroke="#688493"><rect x="70" y="195" width="196" height="192" rx="14"/><rect x="286" y="195" width="196" height="192" rx="14"/><rect x="502" y="195" width="196" height="192" rx="14"/><rect x="718" y="195" width="196" height="192" rx="14"/><rect x="934" y="195" width="196" height="192" rx="14"/></g><g fill="#d6c586" font-size="34" font-weight="700" text-anchor="middle"><text x="168" y="245">1</text><text x="384" y="245">2</text><text x="600" y="245">3</text><text x="816" y="245">4</text><text x="1032" y="245">5</text></g><g fill="#edf0ed" font-size="16" font-weight="700" text-anchor="middle"><text x="168" y="283">TRACK &amp; WARN</text><text x="384" y="283">WEATHER &amp;</text><text x="384" y="304">COMMUNICATE</text><text x="600" y="283">LAUNCH</text><text x="600" y="304">INDEPENDENTLY</text><text x="816" y="283">RECOVER</text><text x="816" y="304">VEHICLES</text><text x="1032" y="283">CONSIDER</text><text x="1032" y="304">HUMAN FLIGHT</text></g><g fill="#aebbc2" font-size="13" text-anchor="middle"><text x="168" y="336">High Mast</text><text x="168" y="357">orbit catalog</text><text x="384" y="336">civil value</text><text x="384" y="357">distributed routes</text><text x="600" y="336">Black Arrow</text><text x="600" y="357">Blue Streak</text><text x="816" y="336">Black Knight</text><text x="816" y="357">reentry chain</text><text x="1032" y="336">only after useful</text><text x="1032" y="357">orbital capacity</text></g><g fill="#b49a5a"><path d="M271 281l15 10-15 10z"/><path d="M487 281l15 10-15 10z"/><path d="M703 281l15 10-15 10z"/><path d="M919 281l15 10-15 10z"/></g><rect x="180" y="458" width="840" height="95" rx="14" fill="#293846" stroke="#d1b86d"/><text x="600" y="492" fill="#f0e8d5" text-anchor="middle" font-size="18" font-weight="700">COMMONWEALTH SPACE AND SIGNALS BOARD</text><text x="600" y="521" fill="#b8c4ca" text-anchor="middle" font-size="14">British design · Canadian avionics · Australian range · southern tracking · ocean telemetry</text></g><text x="600" y="611" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">No Moon deadline was attached to the statute.</text></svg>
