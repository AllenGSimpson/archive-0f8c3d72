<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">National Socialist metaphysical architecture</title>
  <desc id="desc">An analytical sequence from the Volk and inherited race through status, duty, struggle, historical rebirth, and leader-mediated authority, with documented, interpretive, and rejected claim levels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11171b"/><stop offset="1" stop-color="#222a2d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b79358"/></marker>
  </defs>
  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>
  <text x="58" y="64" fill="#f2eadb" font-family="Georgia,serif" font-size="34">National Socialist metaphysical architecture</text>
  <text x="58" y="98" fill="#aeb9c0" font-family="Arial,sans-serif" font-size="18">A later historical model of how worldview became status, duty, and command</text>
  <g font-family="Arial,sans-serif">
    <text x="60" y="154" fill="#d7b36b" font-size="21" font-weight="700">CORE SEQUENCE</text>
    <g transform="translate(52 190)"><rect width="190" height="126" rx="14" fill="#293840" stroke="#66808a"/><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">Volk and blood</text><text x="18" y="62" fill="#cad2d5" font-size="14">The racial community</text><text x="18" y="84" fill="#cad2d5" font-size="14">is treated as the</text><text x="18" y="106" fill="#cad2d5" font-size="14">enduring reality.</text></g>
    <line x1="248" y1="253" x2="275" y2="253" stroke="#b79358" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(284 190)"><rect width="190" height="126" rx="14" fill="#293840" stroke="#66808a"/><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">Inherited person</text><text x="18" y="62" fill="#cad2d5" font-size="14">Ancestry implies</text><text x="18" y="84" fill="#cad2d5" font-size="14">character, status,</text><text x="18" y="106" fill="#cad2d5" font-size="14">role, and value.</text></g>
    <line x1="480" y1="253" x2="507" y2="253" stroke="#b79358" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(516 190)"><rect width="190" height="126" rx="14" fill="#33362c" stroke="#858a68"/><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">Duty and welfare</text><text x="18" y="62" fill="#d4d5c8" font-size="14">Protection inside the</text><text x="18" y="84" fill="#d4d5c8" font-size="14">accepted group; duty</text><text x="18" y="106" fill="#d4d5c8" font-size="14">and exclusion beyond it.</text></g>
    <line x1="712" y1="253" x2="739" y2="253" stroke="#b79358" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(748 190)"><rect width="190" height="126" rx="14" fill="#3b322d" stroke="#98725f"/><text x="18" y="32" fill="#fff" font-size="18" font-weight="700">Struggle and rebirth</text><text x="18" y="62" fill="#d8cbc4" font-size="14">Conflict is naturalized;</text><text x="18" y="84" fill="#d8cbc4" font-size="14">history becomes fall,</text><text x="18" y="106" fill="#d8cbc4" font-size="14">awakening, and victory.</text></g>
    <line x1="944" y1="253" x2="971" y2="253" stroke="#b79358" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(980 190)"><rect width="168" height="126" rx="14" fill="#3b2e31" stroke="#966674"/><text x="16" y="32" fill="#fff" font-size="18" font-weight="700">Führer authority</text><text x="16" y="62" fill="#d8c8cc" font-size="14">The leader claims to</text><text x="16" y="84" fill="#d8c8cc" font-size="14">interpret and enact</text><text x="16" y="106" fill="#d8c8cc" font-size="14">the Volk's destiny.</text></g>
    <text x="60" y="378" fill="#d7b36b" font-size="21" font-weight="700">EVIDENTIARY LEVELS</text>
    <g transform="translate(60 410)"><rect width="335" height="190" rx="14" fill="#26383a" stroke="#5f8581"/><text x="20" y="34" fill="#fff" font-size="18" font-weight="700">Documented core</text><text x="20" y="70" fill="#c8d5d3" font-size="15">Racial hierarchy · Volksgemeinschaft</text><text x="20" y="98" fill="#c8d5d3" font-size="15">Führer principle · struggle · Lebensraum</text><text x="20" y="126" fill="#c8d5d3" font-size="15">Marriage control · settlement · classification</text><text x="20" y="160" fill="#aebfbc" font-size="14">Safe foundation for direct article statements</text></g>
    <g transform="translate(433 410)"><rect width="335" height="190" rx="14" fill="#35362d" stroke="#85876a"/><text x="20" y="34" fill="#fff" font-size="18" font-weight="700">Attributed interpretation</text><text x="20" y="70" fill="#d4d5c7" font-size="15">Political religion · national salvation</text><text x="20" y="98" fill="#d4d5c7" font-size="15">Sacral founder · blood as moral character</text><text x="20" y="126" fill="#d4d5c7" font-size="15">Millenarian and providential language</text><text x="20" y="160" fill="#bfc0ae" font-size="14">Useful when identified as a historical model</text></g>
    <g transform="translate(806 410)"><rect width="335" height="190" rx="14" fill="#3c2c30" stroke="#9a6170"/><text x="20" y="34" fill="#fff" font-size="18" font-weight="700">Contested or excluded</text><text x="20" y="70" fill="#dac7cc" font-size="15">One secret Gnostic religion</text><text x="20" y="98" fill="#dac7cc" font-size="15">Hitler as an exclusive worshipper of Odin</text><text x="20" y="126" fill="#dac7cc" font-size="15">One esoteric catechism shared by all</text><text x="20" y="160" fill="#c6afb5" font-size="14">Never presented as settled historical fact</text></g>
    <text x="60" y="666" fill="#aeb9c0" font-size="15">The model explains institutional action; it does not imply universal private belief or erase material interests and coercion.</text>
  </g>
</svg>
