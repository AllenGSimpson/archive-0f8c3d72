<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Baloch authority fracture, 1981–1984</title>
  <desc id="desc">Iranian support enters the Gwadar common government, which attempts to centralize the army, customs, and aid. Component authorities resist, while Kalat offers autonomy and a grand council, leading to defections and the collapse of the confederation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a25"/><stop offset="1" stop-color="#202c35"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7b56d"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d87867"/></marker>
    <style>
      .label{font:700 22px Georgia,serif;fill:#f5f1e6}.small{font:15px Arial,sans-serif;fill:#d7dde2}.head{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#d7b56d}.box{stroke:#71808c;stroke-width:2;rx:18;filter:url(#shadow)}.line{fill:none;stroke:#d7b56d;stroke-width:4;marker-end:url(#arrow)}.conflict{fill:none;stroke:#d87867;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" rx="24"/>
  <text x="60" y="55" class="head">BALOCH AUTHORITY FRACTURE · 1981–1984</text>

  <rect x="55" y="105" width="260" height="180" class="box" fill="#304b57"/>
  <text x="185" y="145" text-anchor="middle" class="label">Iran</text>
  <text x="85" y="180" class="small">• finance and recognition</text><text x="85" y="208" class="small">• equipment, fuel, advisers</text><text x="85" y="236" class="small">• frontier and political limits</text>

  <rect x="420" y="85" width="350" height="225" class="box" fill="#3b4b5b"/>
  <text x="595" y="128" text-anchor="middle" class="label">Gwadar common government</text>
  <text x="458" y="168" class="small">Common powers</text><text x="458" y="198" class="small">• army command</text><text x="458" y="226" class="small">• customs and finance</text><text x="458" y="254" class="small">• Iranian aid distribution</text><text x="458" y="282" class="small">• diplomacy and concessions</text>

  <rect x="875" y="105" width="270" height="180" class="box" fill="#4d3d37"/>
  <text x="1010" y="145" text-anchor="middle" class="label">Component authorities</text>
  <text x="905" y="180" class="small">Makran · Kharan · Chagai</text><text x="905" y="210" class="small">local courts and police</text><text x="905" y="240" class="small">land, taxes, appointments</text>

  <path d="M315 195H410" class="line"/><text x="362" y="180" text-anchor="middle" class="small">support</text>
  <path d="M770 190H865" class="conflict"/><text x="818" y="170" text-anchor="middle" class="small">centralization</text>

  <rect x="55" y="425" width="330" height="200" class="box" fill="#4b3d54"/>
  <text x="220" y="468" text-anchor="middle" class="label">Kalat autonomy offer</text>
  <text x="88" y="507" class="small">• hereditary authority retained</text><text x="88" y="537" class="small">• customary law and land</text><text x="88" y="567" class="small">• Baloch Grand Council</text><text x="88" y="597" class="small">• chartered Gwadar; frontier Chagai</text>

  <rect x="460" y="425" width="280" height="200" class="box" fill="#553e3e"/>
  <text x="600" y="468" text-anchor="middle" class="label">Confederal fracture</text>
  <text x="493" y="510" class="small">defection and neutrality</text><text x="493" y="542" class="small">local defense replaces</text><text x="493" y="570" class="small">common operational command</text>

  <rect x="815" y="425" width="330" height="200" class="box" fill="#345348"/>
  <text x="980" y="468" text-anchor="middle" class="label">Post-1984 Kalat order</text>
  <text x="850" y="507" class="small">subordinate principalities</text><text x="850" y="537" class="small">territorial grand council</text><text x="850" y="567" class="small">Gwadar special port charter</text><text x="850" y="597" class="small">Chagai frontier administration</text>

  <path d="M385 525H450" class="line"/><path d="M740 525H805" class="line"/>
  <path d="M930 285C900 350 770 372 680 415" class="conflict"/>
  <path d="M590 310V415" class="conflict"/>
  <text x="600" y="675" text-anchor="middle" class="small">The state possessed common institutions; it lacked an uncontested mechanism for compelling its component authorities to obey them.</text>
</svg>
