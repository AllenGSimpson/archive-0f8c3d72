<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Falklands Lisbon talks</title><desc id="d">Britain and Argentina approach a Portuguese mediation table through practical cooperation and sovereignty demands, with islander consent blocking a final timetable.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131c"/><stop offset="1" stop-color="#10293a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#85c8df"/></marker></defs><rect width="1200" height="520" rx="24" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" fill="#eef8fb" font-family="Georgia,serif" font-size="32">Lisbon, 1981–1982</text><g font-family="Arial,sans-serif"><rect x="70" y="120" width="280" height="180" rx="16" fill="#183b50" stroke="#76b9d2" stroke-width="2"/><text x="210" y="165" text-anchor="middle" fill="#fff" font-size="25">BRITAIN</text><text x="210" y="205" text-anchor="middle" fill="#cfe8f1" font-size="18">access · fisheries · travel</text><text x="210" y="235" text-anchor="middle" fill="#cfe8f1" font-size="18">seabed development</text><text x="210" y="265" text-anchor="middle" fill="#cfe8f1" font-size="18">consent before transfer</text><rect x="460" y="130" width="280" height="160" rx="80" fill="#263a44" stroke="#d9bd72" stroke-width="3"/><text x="600" y="190" text-anchor="middle" fill="#fff4cf" font-size="27">PORTUGAL</text><text x="600" y="225" text-anchor="middle" fill="#e9ddba" font-size="18">mediator and venue</text><text x="600" y="255" text-anchor="middle" fill="#e9ddba" font-size="17">practical agreement possible</text><rect x="850" y="120" width="280" height="180" rx="16" fill="#44332f" stroke="#d89979" stroke-width="2"/><text x="990" y="165" text-anchor="middle" fill="#fff" font-size="25">ARGENTINA</text><text x="990" y="210" text-anchor="middle" fill="#f4d8ca" font-size="18">explicit timetable</text><text x="990" y="240" text-anchor="middle" fill="#f4d8ca" font-size="18">sovereignty process</text><text x="990" y="270" text-anchor="middle" fill="#f4d8ca" font-size="18">binding political movement</text><path d="M350 210H452" stroke="#85c8df" stroke-width="4" marker-end="url(#a)"/><path d="M850 210H748" stroke="#85c8df" stroke-width="4" marker-end="url(#a)"/><rect x="310" y="360" width="580" height="95" rx="14" fill="#4a2227" stroke="#ef9b9b" stroke-width="2"/><text x="600" y="400" text-anchor="middle" fill="#fff" font-size="22">UNRESOLVED: SOVEREIGNTY TIMETABLE</text><text x="600" y="433" text-anchor="middle" fill="#ffd4d4" font-size="18">Islander consent and Argentine recovery could not be reconciled</text></g></svg>
