<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Everyday life in imperial peripheries in 2000</title><desc id="d">A status gradient separates metropolitan citizenship from associated, settler, registered, and excluded communities.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081418"/><stop offset="1" stop-color="#252d2f"/></linearGradient><linearGradient id="g"><stop stop-color="#527f89"/><stop offset=".52" stop-color="#8f865d"/><stop offset="1" stop-color="#7e4d4c"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f2f4f1" font-family="Georgia,serif" font-size="31">Everyday life across imperial status</text><text x="60" y="105" fill="#aab9b9" font-family="Arial,sans-serif" font-size="17">Infrastructure can travel farther than citizenship, ownership, or political voice</text><rect x="80" y="205" width="1040" height="90" rx="18" fill="url(#g)"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#f5f4ed" font-size="17" font-weight="700"><text x="184" y="250">METROPOLITAN</text><text x="392" y="250">ASSOCIATED</text><text x="600" y="250">SETTLER</text><text x="808" y="250">REGISTERED</text><text x="1016" y="250">EXCLUDED</text></g><g stroke="#b8c5c4" stroke-width="2"><path d="M288 205v90"/><path d="M496 205v90"/><path d="M704 205v90"/><path d="M912 205v90"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1d3034" stroke="#667f83"><rect x="80" y="355" width="240" height="120" rx="15"/><rect x="360" y="355" width="200" height="120" rx="15"/><rect x="600" y="355" width="240" height="120" rx="15"/><rect x="880" y="355" width="240" height="120" rx="15"/></g><g fill="#e6ece9" font-size="17" font-weight="700"><text x="200" y="400">INFRASTRUCTURE</text><text x="460" y="400">HOUSEHOLD GOODS</text><text x="720" y="400">CREDENTIALS</text><text x="1000" y="400">MOVEMENT</text></g><g fill="#aebfbe" font-size="14"><text x="200" y="432">rail / power / clinics</text><text x="460" y="432">urban and status-led</text><text x="720" y="432">training with ceilings</text><text x="1000" y="432">passes and registration</text></g></g><text x="600" y="555" fill="#a8b7b6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">No single colonial household represents the associated states, protectorates, concessions, and subject districts</text></svg>
