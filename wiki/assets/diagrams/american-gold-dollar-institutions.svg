<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Institutional operation of the restored American gold dollar</title>
  <desc id="desc">A flow diagram connecting Treasury gold custody, the Federal Reserve, licensed banks and foreign authorities, and the public access stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#1d2b38"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8c968"/><stop offset="1" stop-color="#9f7220"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#d7b858"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 93H1600" stroke="#d7b858" stroke-width="3" opacity=".7"/>
  <text x="80" y="62" fill="#f5f0df" font-family="Georgia,serif" font-size="34">THE RESTORED AMERICAN GOLD DOLLAR</text>
  <text x="1520" y="60" text-anchor="end" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">1949–1951</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="400" height="440" rx="12" fill="#1c2730" stroke="#d7b858" stroke-width="3"/>
    <rect x="100" y="205" width="340" height="128" rx="8" fill="url(#gold)"/>
    <path d="M135 296V244h270v52M160 244l110-44 110 44M180 255v41m60-41v41m60-41v41m60-41v41" fill="none" stroke="#3b2d13" stroke-width="10"/>
    <text x="270" y="383" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="31">U.S. TREASURY</text>
    <text x="270" y="426" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">owns monetary gold</text>
    <text x="270" y="466" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">sets redemption rules</text>
    <text x="270" y="506" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">licenses official access</text>
    <text x="270" y="556" text-anchor="middle" fill="#e7c962" font-family="Arial,sans-serif" font-size="24" font-weight="700">FORT KNOX + DEPOSITORIES</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="175" width="400" height="440" rx="12" fill="#1c2730" stroke="#6f8fa7" stroke-width="3"/>
    <circle cx="800" cy="270" r="75" fill="#25394a" stroke="#9bb2c2" stroke-width="5"/>
    <text x="800" y="254" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="30">FEDERAL</text>
    <text x="800" y="294" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="30">RESERVE</text>
    <text x="800" y="383" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="31">MONETARY OPERATIONS</text>
    <text x="800" y="426" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">notes and bank reserves</text>
    <text x="800" y="466" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">credit and open-market policy</text>
    <text x="800" y="506" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">payments and settlement</text>
    <text x="800" y="556" text-anchor="middle" fill="#9bb2c2" font-family="Arial,sans-serif" font-size="22" font-weight="700">DOES NOT OWN THE GOLD STOCK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="175" width="400" height="440" rx="12" fill="#1c2730" stroke="#739b7f" stroke-width="3"/>
    <path d="M1215 315h230M1240 315v-90h180v90M1270 225v90m60-90v90m60-90v90" fill="none" stroke="#99bda3" stroke-width="11"/>
    <text x="1330" y="383" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="31">LICENSED HOLDERS</text>
    <text x="1330" y="426" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">American banks</text>
    <text x="1330" y="466" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">foreign monetary authorities</text>
    <text x="1330" y="506" text-anchor="middle" fill="#d8e0e5" font-family="Arial,sans-serif" font-size="23">large commercial claimants</text>
    <text x="1330" y="556" text-anchor="middle" fill="#99bda3" font-family="Arial,sans-serif" font-size="22" font-weight="700">PUBLIC ACCESS EXPANDS BY STAGE</text>
  </g>

  <path d="M470 315H585" stroke="#d7b858" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1000 315H1115" stroke="#d7b858" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1115 505H1010" stroke="#d7b858" stroke-width="7" marker-end="url(#arrow)" opacity=".7"/>
  <text x="535" y="290" text-anchor="middle" fill="#e7cf83" font-family="Arial,sans-serif" font-size="18">parity</text>
  <text x="1065" y="290" text-anchor="middle" fill="#e7cf83" font-family="Arial,sans-serif" font-size="18">settlement</text>
  <text x="1065" y="538" text-anchor="middle" fill="#e7cf83" font-family="Arial,sans-serif" font-size="18">claims</text>

  <g transform="translate(70 700)">
    <text x="0" y="0" fill="#f5f0df" font-family="Georgia,serif" font-size="25">STAGED ACCESS</text>
    <line x1="0" y1="45" x2="1460" y2="45" stroke="#536773" stroke-width="4"/>
    <g fill="#d7b858"><circle cx="80" cy="45" r="15"/><circle cx="500" cy="45" r="15"/><circle cx="920" cy="45" r="15"/><circle cx="1380" cy="45" r="15"/></g>
    <g fill="#dce4e8" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">
      <text x="80" y="92">official banks and</text><text x="80" y="120">foreign authorities</text>
      <text x="500" y="92">large commercial</text><text x="500" y="120">dollar claims</text>
      <text x="920" y="92">regulated bullion</text><text x="920" y="120">and certificates</text>
      <text x="1380" y="92">legal ownership and</text><text x="1380" y="120">gold-coin circulation</text>
    </g>
  </g>
</svg>
