<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">British Indian Expeditionary Corps organization</title><desc id="desc">British Indian Ocean Command directs a corps built from maneuver, engineering, transport, base defense, specialist, and advisory elements within a larger theater establishment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12232d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.cmd{fill:#302a24;stroke:#bd925c;stroke-width:2}.box{fill:#1a2e39;stroke:#6b8695;stroke-width:2}.end{fill:#23362c;stroke:#7d9d79;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.line{stroke:#cfa655;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">British Indian Expeditionary Corps</text><text x="50" y="92" class="s">A field and garrison force whose support establishments outweighed its maneuver infantry</text>
  <g transform="translate(350 125)"><rect class="cmd" width="500" height="105" rx="10"/><text x="250" y="34" text-anchor="middle" class="tag">BRITISH INDIAN OCEAN COMMAND</text><text x="250" y="67" text-anchor="middle" class="t">Colombo headquarters · Trincomalee fortress</text><text x="250" y="91" text-anchor="middle" class="d">Theater total approximately 90,000-110,000</text></g>
  <path class="line" d="M600 230 V280 M150 280 H1050 M150 280 V315 M450 280 V315 M750 280 V315 M1050 280 V315"/>
  <g transform="translate(35 315)"><rect class="box" width="230" height="205" rx="9"/><text x="18" y="34" class="tag">MANEUVER</text><text x="18" y="75" class="t">Infantry and Gurkhas</text><text x="18" y="107" class="d">Artillery</text><text x="18" y="135" class="d">Armored reconnaissance</text><text x="18" y="163" class="d">Mobile reserve battalions</text></g>
  <g transform="translate(335 315)"><rect class="box" width="230" height="205" rx="9"/><text x="18" y="34" class="tag">MOVEMENT</text><text x="18" y="75" class="t">Royal Engineers</text><text x="18" y="107" class="d">Rail and transport troops</text><text x="18" y="135" class="d">Signals and recovery</text><text x="18" y="163" class="d">Medical services</text></g>
  <g transform="translate(635 315)"><rect class="box" width="230" height="205" rx="9"/><text x="18" y="34" class="tag">BASE DEFENSE</text><text x="18" y="75" class="t">Ports and airfields</text><text x="18" y="107" class="d">Royal Marines</text><text x="18" y="135" class="d">Naval landing parties</text><text x="18" y="163" class="d">Military police</text></g>
  <g transform="translate(935 315)"><rect class="box" width="230" height="205" rx="9"/><text x="18" y="34" class="tag">PARTNERS</text><text x="18" y="75" class="t">Advisory missions</text><text x="18" y="107" class="d">Protected-state forces</text><text x="18" y="135" class="d">Local intelligence</text><text x="18" y="163" class="d">Civil administration</text></g>
  <g transform="translate(325 570)"><rect class="end" width="550" height="62" rx="8"/><text x="275" y="27" text-anchor="middle" class="tag">DIRECT FIELD AND GARRISON FORCE</text><text x="275" y="50" text-anchor="middle" class="d">Approximately 45,000-65,000 at the early-1950s peak</text></g>
</svg>
