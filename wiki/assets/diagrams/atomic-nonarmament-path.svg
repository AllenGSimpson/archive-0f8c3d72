<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Atomic nonarmament path</title><desc id="desc">A timeline from early atomic-weapons theory through feasibility studies and mature latent capability to zero detonations and zero arsenals in 2000.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c28"/><stop offset="1" stop-color="#070d13"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".42"/></filter><style>.title{font:700 31px Georgia,serif;fill:#f6efe5}.sub{font:15px system-ui,sans-serif;fill:#aebdca}.year{font:700 16px system-ui,sans-serif;fill:#e7bf5b;letter-spacing:.08em}.head{font:700 20px Georgia,serif;fill:#f5f0e7}.body{font:14px system-ui,sans-serif;fill:#bbc8d2}.card{fill:#101b26;stroke:#3d5265;stroke-width:1.5}.line{stroke:#76c4c8;stroke-width:5}.dot{fill:#e3bb54;stroke:#fff0be;stroke-width:3}.zero{font:700 72px Georgia,serif;fill:#77ced0}.label{font:700 15px system-ui,sans-serif;fill:#cfe5e5}.fork{stroke:#d0695f;stroke-width:3;stroke-dasharray:8 7;fill:none}.stop{fill:#d0695f}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="42" y="61" class="title">The atomic weapon is invented intellectually</text><text x="42" y="90" class="sub">Feasibility grows; the production fork, test, and arsenal never follow</text>
  <path d="M90 340 H1110" class="line"/>
  <g transform="translate(120 340)"><circle r="13" class="dot"/><text x="-35" y="-38" class="year">1940s</text><rect x="-77" y="47" width="220" height="142" rx="15" class="card" filter="url(#shadow)"/><text x="-56" y="78" class="head">Concept</text><text x="-56" y="106" class="body">Fission explosive understood.</text><text x="-56" y="129" class="body">Atmospheric question enters</text><text x="-56" y="152" class="body">journalism and fiction.</text></g>
  <g transform="translate(390 340)"><circle r="13" class="dot"/><text x="-35" y="-38" class="year">1950s</text><rect x="-97" y="-202" width="248" height="146" rx="15" class="card" filter="url(#shadow)"/><text x="-75" y="-169" class="head">Feasibility studies</text><text x="-75" y="-141" class="body">American false start.</text><text x="-75" y="-118" class="body">German classified review.</text><text x="-75" y="-95" class="body">No procurement constituency.</text></g>
  <g transform="translate(660 340)"><circle r="13" class="dot"/><text x="-49" y="-38" class="year">c. 1960</text><rect x="-109" y="47" width="260" height="142" rx="15" class="card" filter="url(#shadow)"/><text x="-87" y="78" class="head">Cost is no longer enough</text><text x="-87" y="106" class="body">All Five could afford a program.</text><text x="-87" y="129" class="body">No first builder, compelling mission,</text><text x="-87" y="152" class="body">or stable monopoly appears.</text></g>
  <g transform="translate(900 340)"><circle r="13" class="dot"/><text x="-73" y="-38" class="year">1960s–70s</text><rect x="-116" y="-202" width="264" height="146" rx="15" class="card" filter="url(#shadow)"/><text x="-94" y="-169" class="head">Latent competence</text><text x="-94" y="-141" class="body">Germany comes closest.</text><text x="-94" y="-118" class="body">Power, propulsion, medicine,</text><text x="-94" y="-95" class="body">and space retain the investment.</text></g>
  <g transform="translate(1090 340)"><circle r="15" class="dot"/><text x="-47" y="-38" class="year">2000</text></g>
  <path d="M660 327 C660 260 690 231 755 210" class="fork"/><polygon points="755,210 735,201 740,221" class="stop"/><text x="677" y="238" class="body">weapons-production fork</text><circle cx="775" cy="203" r="18" class="stop"/><path d="M764 192 L786 214 M786 192 L764 214" stroke="#fff" stroke-width="4"/>
  <g transform="translate(920 508)"><rect width="238" height="122" rx="17" class="card" filter="url(#shadow)"/><text x="23" y="67" class="zero">0</text><text x="91" y="45" class="label">DETONATIONS</text><text x="91" y="70" class="label">WARHEAD LINES</text><text x="91" y="95" class="label">OPERATIONAL BOMBS</text></g>
  <text x="42" y="625" class="sub">Knowledge-rich, weapon-poor: no dedicated fissile-production system, test establishment, assembly service, or operational doctrine.</text>
</svg>
