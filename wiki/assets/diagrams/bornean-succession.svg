<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Bornean political succession</title><desc id="desc">The transformation of Bornean Malaya into the Bornean State beside the Kalimantan Federation.</desc><rect width="1200" height="650" rx="32" fill="#10171d"/><text x="60" y="70" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">The Bornean succession</text><text x="60" y="108" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">The island remains divided, but one of its two states changes constitutional identity</text><g font-family="Arial,sans-serif"><g transform="translate(65 170)"><rect width="315" height="270" rx="18" fill="#3c3322" stroke="#d3aa52"/><text x="25" y="48" fill="#f1c86f" font-size="25" font-weight="700">BORNEAN MALAYA</text><text x="25" y="90" fill="#fff" font-size="18">1947–1979</text><text x="25" y="132" fill="#a8bbc4" font-size="16">Malay-headed island empire</text><text x="25" y="162" fill="#a8bbc4" font-size="16">Brunei ceremonial center</text><text x="25" y="192" fill="#a8bbc4" font-size="16">Charter conflict and revolt</text></g><path d="M400 305H540" stroke="#f2e7d1" stroke-width="7"/><path d="m530 285 30 20-30 20" fill="none" stroke="#f2e7d1" stroke-width="7"/><g transform="translate(570 170)"><rect width="315" height="270" rx="18" fill="#173d4a" stroke="#66b4c3"/><text x="25" y="48" fill="#9de0ea" font-size="25" font-weight="700">BORNEAN STATE</text><text x="25" y="90" fill="#fff" font-size="18">From the 1977–79 settlement</text><text x="25" y="132" fill="#a8bbc4" font-size="16">Bornean nationality</text><text x="25" y="162" fill="#a8bbc4" font-size="16">Layered autonomy</text><text x="25" y="192" fill="#a8bbc4" font-size="16">Brunei separately guaranteed</text></g><g transform="translate(920 170)"><rect width="225" height="270" rx="18" fill="#19372b" stroke="#6ab58a"/><text x="20" y="45" fill="#91dbad" font-size="22" font-weight="700">KALIMANTAN</text><text x="20" y="74" fill="#91dbad" font-size="22" font-weight="700">FEDERATION</text><text x="20" y="118" fill="#fff" font-size="17">Separate throughout</text><text x="20" y="156" fill="#a8bbc4" font-size="15">Banjar and coastal rulers</text><text x="20" y="184" fill="#a8bbc4" font-size="15">Dayak autonomies</text><text x="20" y="212" fill="#a8bbc4" font-size="15">Oil corporate cities</text></g></g><text x="600" y="515" text-anchor="middle" fill="#e3c678" font-family="Arial,sans-serif" font-size="19">The successor Bornean State replaces Bornean Malaya; Kalimantan remains the second Bornean member.</text><text x="60" y="590" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Constitutional sequence · boundaries and final formal titles remain open</text></svg>
