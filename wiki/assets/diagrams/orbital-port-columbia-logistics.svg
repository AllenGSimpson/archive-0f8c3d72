<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">American orbital logistics system</title>
  <desc id="desc">Canaveral feeds Orbital Port Columbia using specialized spaceplanes; Columbia supports Kennedy Lunar Station and Liberty Yard.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#192f43"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7edcff"/></marker><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="650" rx="26" fill="url(#b)"/>
  <text x="55" y="66" fill="white" font-family="Georgia,serif" font-size="34" font-weight="700">The American orbital logistics chain</text>
  <text x="55" y="101" fill="#a9c1d0" font-family="Arial,sans-serif" font-size="18">Frequent low-orbit transport · lunar permanence · high-orbit Mars assembly</text>
  <path d="M260 335 H470" stroke="#7edcff" stroke-width="6" marker-end="url(#ar)"/><path d="M735 305 C825 245 890 210 975 210" fill="none" stroke="#f0c66d" stroke-width="5" marker-end="url(#ar)"/><path d="M735 360 C835 415 900 458 975 458" fill="none" stroke="#c39cff" stroke-width="5" marker-end="url(#ar)"/>
  <g font-family="Arial,sans-serif" filter="url(#sh)">
    <g transform="translate(55 255)"><rect width="210" height="155" rx="16" fill="#143b50" stroke="#7edcff"/><text x="18" y="34" fill="#95e7ff" font-size="16">EARTH</text><text x="18" y="67" fill="white" font-size="24" font-weight="700">Canaveral</text><text x="18" y="96" fill="#c1d5de" font-size="15">Runways · cryogenics</text><text x="18" y="121" fill="#c1d5de" font-size="15">Control · refurbishment</text></g>
    <g transform="translate(455 225)"><rect width="300" height="205" rx="18" fill="#234b62" stroke="#8bdfff"/><text x="20" y="36" fill="#9be8ff" font-size="16">LOW EARTH ORBIT</text><text x="20" y="72" fill="white" font-size="27" font-weight="700">Orbital Port Columbia</text><text x="20" y="105" fill="#c7d8e1" font-size="15">Crew rotation · repair · retrieval</text><text x="20" y="130" fill="#c7d8e1" font-size="15">Research · storage · redistribution</text><text x="20" y="164" fill="#8de6ae" font-size="15">Liberty / Enterprise / Ranger</text><text x="20" y="188" fill="#ffd988" font-size="15">Hercules heavy cargo</text></g>
    <g transform="translate(935 135)"><rect width="220" height="145" rx="16" fill="#4d4934" stroke="#f0c66d"/><text x="18" y="34" fill="#ffe29c" font-size="16">THE MOON</text><text x="18" y="68" fill="white" font-size="23" font-weight="700">Kennedy Station</text><text x="18" y="98" fill="#ded8bb" font-size="15">Continuous occupation</text><text x="18" y="122" fill="#ded8bb" font-size="15">Pilgrim test laboratory</text></g>
    <g transform="translate(935 390)"><rect width="220" height="145" rx="16" fill="#42385a" stroke="#c39cff"/><text x="18" y="34" fill="#d3bfff" font-size="16">HIGH ORBIT</text><text x="18" y="68" fill="white" font-size="23" font-weight="700">Liberty Yard</text><text x="18" y="98" fill="#d6cce4" font-size="15">Assembly · propellant</text><text x="18" y="122" fill="#d6cce4" font-size="15">Mars departure systems</text></g>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#b6cad6"><text x="290" y="315">runway-to-orbit fleet</text><text x="800" y="232">lunar logistics</text><text x="802" y="438">orbital tugs</text></g>
  <g transform="translate(80 500)" font-family="Arial,sans-serif"><rect width="760" height="78" rx="12" fill="#0d2637" stroke="#31576b"/><text x="18" y="29" fill="#e8f5fb" font-size="16" font-weight="700">Specialization, not one universal spacecraft</text><text x="18" y="55" fill="#a9c1d0" font-size="15">Hercules lifts mass · Liberty and Enterprise move crews and cargo · Ranger services objects already in orbit.</text></g>
</svg>
