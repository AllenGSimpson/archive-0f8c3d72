<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Route-home principle</title><desc id="desc">A force moves from a secure port through depots and defended transport nodes to a finite objective, stops at the last supportable point, and retains a planned withdrawal path.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.box{fill:#192e39;stroke:#6c8795;stroke-width:2}.goal{fill:#24362b;stroke:#7e9e79;stroke-width:2}.stop{fill:#39272a;stroke:#aa6c70;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.out{stroke:#cea654;stroke-width:4;fill:none}.home{stroke:#7d99a7;stroke-width:3;stroke-dasharray:10 7;fill:none}.x{stroke:#d67979;stroke-width:5}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Route-home principle</text><text x="50" y="92" class="s">Objective, sustainment, post-operation authority, stopping point, and withdrawal are one plan</text>
  <path class="out" d="M145 340 H1000"/><path class="home" d="M1000 405 H145"/><text x="560" y="322" text-anchor="middle" class="tag">OUTWARD SUPPORT</text><text x="560" y="436" text-anchor="middle" class="tag">PLANNED WITHDRAWAL</text>
  <g transform="translate(45 245)"><rect class="box" width="200" height="190" rx="10"/><text x="100" y="35" text-anchor="middle" class="tag">SECURE NODE</text><text x="100" y="82" text-anchor="middle" class="t">Port / airfield</text><text x="100" y="116" text-anchor="middle" class="d">Supply and repair</text><text x="100" y="141" text-anchor="middle" class="d">Medical evacuation</text><text x="100" y="166" text-anchor="middle" class="d">Reserve transport</text></g>
  <g transform="translate(330 245)"><rect class="box" width="200" height="190" rx="10"/><text x="100" y="35" text-anchor="middle" class="tag">ROUTE SYSTEM</text><text x="100" y="82" text-anchor="middle" class="t">Road / rail / river</text><text x="100" y="116" text-anchor="middle" class="d">Bridge and depot</text><text x="100" y="141" text-anchor="middle" class="d">Partner garrison</text><text x="100" y="166" text-anchor="middle" class="d">Signals and fuel</text></g>
  <g transform="translate(615 245)"><rect class="goal" width="200" height="190" rx="10"/><text x="100" y="35" text-anchor="middle" class="tag">FINITE OBJECTIVE</text><text x="100" y="82" text-anchor="middle" class="t">Relieve / reopen</text><text x="100" y="116" text-anchor="middle" class="d">Evacuate or defend</text><text x="100" y="141" text-anchor="middle" class="d">Named authority holds</text><text x="100" y="166" text-anchor="middle" class="d">afterward</text></g>
  <g transform="translate(900 245)"><rect class="stop" width="200" height="190" rx="10"/><text x="100" y="35" text-anchor="middle" class="tag">STOPPING POINT</text><text x="100" y="82" text-anchor="middle" class="t">Last defensible</text><text x="100" y="107" text-anchor="middle" class="t">railway</text><text x="100" y="145" text-anchor="middle" class="d">Opportunity beyond</text><text x="100" y="169" text-anchor="middle" class="d">does not enlarge mission</text></g>
  <path class="x" d="M1115 295 l45 90 M1160 295 l-45 90"/><text x="1137" y="415" text-anchor="middle" class="d">Open-ended pursuit</text>
  <text x="50" y="625" class="s">The route is political as well as physical: access, jurisdiction, local government, and consent determine whether it remains usable.</text>
</svg>
