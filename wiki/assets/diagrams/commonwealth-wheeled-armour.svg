<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Commonwealth wheeled armour</title><desc id="desc">Comparison of Ratel 20 and Ratel 90 with their terrain strengths and Falklands boundary.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#17251e"/><stop offset="1" stop-color="#364838"/></linearGradient><style>.h{font-family:Georgia,serif;fill:#f7f0dc}.s{font-family:Arial,sans-serif;fill:#d8e2d2}.n{font:700 38px Georgia,serif;fill:#fff}.d{font:23px Arial,sans-serif;fill:#e5eadf}.box{fill:#24362b;stroke:#d0b56b;stroke-width:3}</style></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="92" class="h" font-size="52" font-weight="700">Commonwealth wheeled armour</text><text x="82" y="136" class="s" font-size="23">South African road mobility and its hard terrain boundary · 1976–1985</text><rect class="box" x="110" y="235" width="640" height="330" rx="18"/><text x="160" y="310" class="n">Ratel 20</text><text x="160" y="362" class="d">1976 · 18.5 t · crew 3 + 7</text><text x="160" y="410" class="d">20×139 mm cannon</text><text x="160" y="458" class="d">Mechanized infantry carrier</text><text x="160" y="520" class="s" font-size="21">Falklands baseline: 6</text><rect class="box" x="850" y="235" width="640" height="330" rx="18"/><text x="900" y="310" class="n">Ratel 90</text><text x="900" y="362" class="d">1978 · 19.0 t · crew 4 + 6</text><text x="900" y="410" class="d">90 mm low-recoil gun</text><text x="900" y="458" class="d">Road-mobile fire support</text><text x="900" y="520" class="s" font-size="21">Falklands baseline: 3</text><path d="M170 680H1430" stroke="#d0b56b" stroke-width="5"/><text x="185" y="650" class="s" font-size="22">ROADS · GRAVEL · ENGINEERED TRACKS · FIRM GROUND</text><text x="185" y="742" fill="#efb4a3" font-family="Arial,sans-serif" font-size="23">POOR: DEEP PEAT · MARSH · BROKEN TRACKLESS SLOPES</text><text x="185" y="804" class="s" font-size="21">Falklands use begins after Mount Pleasant: convoy security and road-mobile support.</text></svg>
