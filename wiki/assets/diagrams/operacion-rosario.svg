<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Operación Rosario</title><desc id="d">Argentine marine, airborne, naval and electronic attacks converge on British positions before East Falkland is reinforced as a fortress.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d8bd77"/></marker></defs><rect width="1200" height="520" rx="24" fill="#08151d"/><text x="600" y="55" text-anchor="middle" fill="#f5f2e7" font-family="Georgia,serif" font-size="32">OPERACIÓN ROSARIO · APRIL 1984</text><g font-family="Arial,sans-serif"><g fill="#15364a" stroke="#6bb5d6" stroke-width="2"><rect x="50" y="115" width="240" height="80" rx="12"/><rect x="50" y="220" width="240" height="80" rx="12"/><rect x="50" y="325" width="240" height="80" rx="12"/></g><g fill="#eefaff" text-anchor="middle" font-size="19"><text x="170" y="164">MARINE LANDINGS</text><text x="170" y="269">AIRBORNE SEIZURE</text><text x="170" y="374">SPECIAL FORCES / EW</text></g><path d="M290 155L480 230M290 260L480 260M290 365L480 290" stroke="#d8bd77" stroke-width="4" marker-end="url(#a)"/><rect x="490" y="180" width="250" height="155" rx="18" fill="#3f2c2b" stroke="#df9588" stroke-width="3"/><text x="615" y="225" text-anchor="middle" fill="#fff" font-size="23">BRITISH GARRISON</text><text x="615" y="260" text-anchor="middle" fill="#f6d4cd" font-size="18">three-day defense</text><text x="615" y="290" text-anchor="middle" fill="#f6d4cd" font-size="18">Stanley protected</text><text x="615" y="318" text-anchor="middle" fill="#f6d4cd" font-size="18">surrender authorized</text><path d="M740 258H850" stroke="#d8bd77" stroke-width="4" marker-end="url(#a)"/><rect x="865" y="120" width="285" height="280" rx="18" fill="#213927" stroke="#7fba87" stroke-width="3"/><text x="1007" y="168" text-anchor="middle" fill="#f1fff1" font-size="23">EAST FALKLAND</text><text x="1007" y="205" text-anchor="middle" fill="#d6f1da" font-size="18">12,000–16,000 personnel</text><text x="1007" y="237" text-anchor="middle" fill="#d6f1da" font-size="18">artillery · air defense</text><text x="1007" y="269" text-anchor="middle" fill="#d6f1da" font-size="18">missiles · radar · engineers</text><text x="1007" y="301" text-anchor="middle" fill="#d6f1da" font-size="18">runway expansion</text><text x="1007" y="348" text-anchor="middle" fill="#fff4bd" font-size="18">SEIZURE → FORTRESS</text></g></svg>
