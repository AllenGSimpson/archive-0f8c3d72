<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Serenity logistics and construction chain</title><desc id="desc">Imported Earth cargo and polar volatiles pass through Serenity's landing complex, water recovery, local material processing, and construction yards.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c2e"/><stop offset="1" stop-color="#071018"/></linearGradient><style>.t{font:700 34px Georgia,serif;fill:#f3e8ca}.s{font:16px Arial,sans-serif;fill:#afbed0}.h{font:700 19px Arial,sans-serif;fill:#f7ead0}.b{font:14px Arial,sans-serif;fill:#d0dae5}.tag{font:700 12px Arial,sans-serif;letter-spacing:1.1px;fill:#9db4c8}.box{stroke:#7892ac;stroke-width:2}.line{fill:none;stroke:#b8cbd9;stroke-width:3}</style></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><text x="55" y="62" class="t">SERENITY LOGISTICS AND CONSTRUCTION</text><text x="55" y="92" class="s">Mare Serenitatis · imported volatiles, local bulk material, and closed settlement systems</text><path class="line" d="M315 210H440M760 210H885M600 285V390M315 495H440M760 495H885"/><rect class="box" x="55" y="145" width="260" height="135" rx="18" fill="#334b63"/><text x="80" y="180" class="tag">EXTERNAL SUPPLY</text><text x="80" y="215" class="h">Earth cargo</text><text x="80" y="245" class="b">Modules · machinery · water · hydrogen</text><rect class="box" x="55" y="430" width="260" height="135" rx="18" fill="#3f5260"/><text x="80" y="465" class="tag">CISLUNAR SUPPLY</text><text x="80" y="500" class="h">Polar volatiles</text><text x="80" y="530" class="b">Purchased or Commonwealth-carried</text><rect class="box" x="440" y="145" width="320" height="140" rx="18" fill="#655440"/><text x="465" y="180" class="tag">SURFACE GATEWAY</text><text x="465" y="215" class="h">Landing complex</text><text x="465" y="245" class="b">Approaches · pads · unloading · rescue</text><rect class="box" x="440" y="390" width="320" height="140" rx="18" fill="#31575b"/><text x="465" y="425" class="tag">CLOSED PROVISION</text><text x="465" y="460" class="h">Water recovery</text><text x="465" y="490" class="b">Collection · treatment · storage · reuse</text><rect class="box" x="885" y="145" width="260" height="135" rx="18" fill="#534d3b"/><text x="910" y="180" class="tag">LOCAL MATERIAL</text><text x="910" y="215" class="h">Basalt processing</text><text x="910" y="245" class="b">Shielding · pads · roads · bulk works</text><rect class="box" x="885" y="430" width="260" height="135" rx="18" fill="#4f4055"/><text x="910" y="465" class="tag">SETTLEMENT GROWTH</text><text x="910" y="500" class="h">Construction yards</text><text x="910" y="530" class="b">Assembly · excavation · testing · repair</text><rect x="475" y="305" width="250" height="65" rx="32" fill="#896f3f" stroke="#e4cc96" stroke-width="2"/><text x="600" y="345" text-anchor="middle" class="h">SERENITY SETTLEMENT</text><text x="55" y="610" class="s">Local oxygen reduces imported oxidizer demand; precision systems and biological supplies continue to arrive from Earth.</text></svg>
