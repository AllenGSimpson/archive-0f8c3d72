<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Sovereign States Experiment</title><desc id="desc">Eight Burmese nationality states and the unresolved common systems that cause the experiment to fail.</desc><rect width="1200" height="700" rx="32" fill="#10171d"/><text x="60" y="68" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">The Sovereign States Experiment</text><text x="60" y="106" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">Formal separation answers who is sovereign—and exposes everything sovereignty cannot separate</text><g font-family="Arial,sans-serif"><g transform="translate(55 155)"><rect width="500" height="390" rx="20" fill="#173d4a" stroke="#66b4c3"/><text x="25" y="46" fill="#9de0ea" font-size="25" font-weight="700">EIGHT RECOGNIZED STATES</text><g fill="#fff" font-size="20"><text x="30" y="100">Bamar Burma</text><text x="270" y="100">Shan</text><text x="30" y="150">Kachin</text><text x="270" y="150">Chin</text><text x="30" y="200">Karen</text><text x="270" y="200">Karenni</text><text x="30" y="250">Mon</text><text x="270" y="250">Arakan</text></g><path d="M25 285H475" stroke="#506d78"/><text x="25" y="325" fill="#a8bbc4" font-size="16">Citizenship · internal law · police</text><text x="25" y="355" fill="#a8bbc4" font-size="16">Education · ordinary taxation · national guards</text></g><g transform="translate(645 155)"><rect width="500" height="390" rx="20" fill="#3c3322" stroke="#d3aa52"/><text x="25" y="46" fill="#f1c86f" font-size="25" font-weight="700">COMMON PROBLEMS REMAIN</text><g fill="#fff" font-size="18"><text x="25" y="95">Mixed populations and minority districts</text><text x="25" y="135">Ports, railways, rivers, and customs transit</text><text x="25" y="175">Rangoon's banks and inherited bureaucracy</text><text x="25" y="215">Karen communities in the Bamar delta</text><text x="25" y="255">Wa, Pa-O, Ta’ang, and Kokang claims</text><text x="25" y="295">Northern Arakan's Muslim districts</text><text x="25" y="335">Collective defense and foreign bases</text></g></g></g><path d="M555 350H645" stroke="#eea8c2" stroke-width="6" stroke-dasharray="9 8"/><text x="600" y="605" text-anchor="middle" fill="#eea8c2" font-family="Arial,sans-serif" font-size="20">Border and transit incidents escalate into the War of the Burmese States.</text><text x="600" y="638" text-anchor="middle" fill="#a8bbc4" font-family="Arial,sans-serif" font-size="17">Japan and Thailand restore one international personality and common defense under exceptionally strong internal governments.</text></svg>
