<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese machine-first direct Mars architecture</title>
  <desc id="desc">Two-track diagram showing robotic survey and cargo preparation converging with a direct crew spacecraft at a verified Mars surface complex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071318"/><stop offset="1" stop-color="#10242a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#d6b45e"/></marker>
    <style>.title{font:700 40px Georgia,serif;fill:#f2ead8}.sub{font:600 17px Arial,sans-serif;letter-spacing:3px;fill:#9dbfc4}.lane{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#d6b45e}.box{fill:#112a32;stroke:#4c7d86;stroke-width:3;rx:18}.surface{fill:#33231f;stroke:#a66a52;stroke-width:3;rx:18}.head{font:700 22px Georgia,serif;fill:#f4ead7}.copy{font:16px Arial,sans-serif;fill:#c7d5d4}.line{stroke:#d6b45e;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7b9ca1;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}.foot{font:15px Arial,sans-serif;fill:#aebfbe}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">JAPANESE MACHINE-FIRST MARS ARCHITECTURE</text>
  <text x="800" y="106" text-anchor="middle" class="sub">A VERIFIED DESTINATION BEFORE HUMAN DEPARTURE</text>
  <text x="55" y="180" class="lane">ROBOTIC PREPARATION</text>
  <rect x="55" y="210" width="300" height="145" class="box"/><text x="205" y="250" text-anchor="middle" class="head">DISTRIBUTED SYSTEM</text><text x="205" y="286" text-anchor="middle" class="copy">Orbiters · relays · landers</text><text x="205" y="314" text-anchor="middle" class="copy">Rovers · fixed stations</text>
  <rect x="430" y="210" width="300" height="145" class="box"/><text x="580" y="250" text-anchor="middle" class="head">SITE VERIFICATION</text><text x="580" y="286" text-anchor="middle" class="copy">Weather · hazards · routes</text><text x="580" y="314" text-anchor="middle" class="copy">Surface strength · navigation</text>
  <rect x="805" y="180" width="365" height="205" class="surface"/><text x="987" y="224" text-anchor="middle" class="head">PREPOSITIONED SURFACE SYSTEM</text><text x="987" y="260" text-anchor="middle" class="copy">Power · communications · habitat</text><text x="987" y="290" text-anchor="middle" class="copy">Rovers · food · emergency stores</text><text x="987" y="320" text-anchor="middle" class="copy">Propellant plant · return vehicle</text><text x="987" y="354" text-anchor="middle" class="copy">Automatic checkout before crew launch</text>
  <path d="M355 282H430" class="line"/><path d="M730 282H805" class="line"/>
  <text x="55" y="505" class="lane">CREW FLIGHT</text>
  <rect x="250" y="535" width="340" height="165" class="box"/><text x="420" y="579" text-anchor="middle" class="head">COMPACT CREW SPACECRAFT</text><text x="420" y="617" text-anchor="middle" class="copy">Comparatively direct Earth–Mars route</text><text x="420" y="647" text-anchor="middle" class="copy">Does not await a lunar shipyard</text><text x="420" y="677" text-anchor="middle" class="copy">Exact stages and propulsion remain open</text>
  <rect x="805" y="505" width="365" height="225" class="surface"/><text x="987" y="552" text-anchor="middle" class="head">CREWED SURFACE EXPEDITION</text><text x="987" y="590" text-anchor="middle" class="copy">Landing at the operating site</text><text x="987" y="620" text-anchor="middle" class="copy">Inspection and commissioning</text><text x="987" y="650" text-anchor="middle" class="copy">Science and bounded field operations</text><text x="987" y="680" text-anchor="middle" class="copy">Return through the prepositioned chain</text>
  <path d="M590 617H805" class="line"/><path d="M987 385V505" class="dash"/>
  <rect x="1245" y="235" width="300" height="390" class="box"/><text x="1395" y="281" text-anchor="middle" class="head">COMMAND ROUTE</text><text x="1395" y="325" text-anchor="middle" class="copy">Hōrai orbital platform</text><text x="1395" y="357" text-anchor="middle" class="copy">Imperial deep-space network</text><text x="1395" y="389" text-anchor="middle" class="copy">Japanese mission authority</text><line x1="1290" y1="420" x2="1500" y2="420" stroke="#4c7d86" stroke-width="2"/><text x="1395" y="460" text-anchor="middle" class="copy">Associated-state science</text><text x="1395" y="492" text-anchor="middle" class="copy">and manufacturing participation</text><line x1="1290" y1="523" x2="1500" y2="523" stroke="#4c7d86" stroke-width="2"/><text x="1395" y="563" text-anchor="middle" class="copy">Delayed supervision</text><text x="1395" y="595" text-anchor="middle" class="copy">Local automatic fault response</text>
  <path d="M1245 338H1170" class="dash"/><path d="M1245 570H1170" class="dash"/>
  <text x="800" y="830" text-anchor="middle" class="foot">“Direct” describes the logistical campaign; the exact physical staging of the crew and return vehicles remains unregistered.</text>
</svg>
