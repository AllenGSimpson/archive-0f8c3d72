<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Division of Heydrich's institutional inheritance in 1978</title><desc id="desc">Heydrich's former security complex splits into foreign intelligence, domestic security and administrative audit, and Führer-household protection under Wolfgang and council arbitration.</desc>
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#141c25"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f8492"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg3)"/>
  <text x="55" y="65" fill="#eef4f6" font-family="Georgia,serif" font-size="31">The divided Heydrich inheritance</text><text x="55" y="98" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">Institutional reorganization · 1 October 1978</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(365 135)"><rect width="470" height="110" rx="18" fill="#2a2021" stroke="#96665f" stroke-width="3"/><text x="235" y="41" text-anchor="middle" fill="#f3e8e5" font-size="22" font-weight="700">HEYDRICH SECURITY COMPLEX</text><text x="235" y="72" text-anchor="middle" fill="#cdbbb6" font-size="15">intelligence · police influence · political files</text><text x="235" y="94" text-anchor="middle" fill="#cdbbb6" font-size="15">administrative review · privileged access</text></g>
    <path d="M600 245V300M600 300H205V345M600 300V345M600 300H995V345" fill="none" stroke="#6f8492" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(55 350)"><rect width="300" height="170" rx="17" fill="#1b252f" stroke="#657d93" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#e8eef3" font-size="20" font-weight="700">FOREIGN INTELLIGENCE</text><text x="150" y="79" text-anchor="middle" fill="#c1cdd6" font-size="15">Walter Schellenberg</text><text x="150" y="109" text-anchor="middle" fill="#aebdc7" font-size="13">external collection</text><text x="150" y="131" text-anchor="middle" fill="#aebdc7" font-size="13">and foreign assessment</text></g>
    <g transform="translate(450 350)"><rect width="300" height="170" rx="17" fill="#1b2a27" stroke="#648f8c" stroke-width="3"/><text x="150" y="40" text-anchor="middle" fill="#e7f2f0" font-size="18" font-weight="700">SECURITY &amp;</text><text x="150" y="64" text-anchor="middle" fill="#e7f2f0" font-size="18" font-weight="700">ADMINISTRATIVE AUDIT</text><text x="150" y="99" text-anchor="middle" fill="#c0d3d0" font-size="15">Matthias Kern</text><text x="150" y="130" text-anchor="middle" fill="#afc5c1" font-size="13">domestic record</text><text x="150" y="150" text-anchor="middle" fill="#afc5c1" font-size="13">cross-checking</text></g>
    <g transform="translate(845 350)"><rect width="300" height="170" rx="17" fill="#29261d" stroke="#b49962" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#f7f0de" font-size="19" font-weight="700">HOUSEHOLD PROTECTION</text><text x="150" y="79" text-anchor="middle" fill="#d4c8ac" font-size="15">Separate command</text><text x="150" y="109" text-anchor="middle" fill="#c8bda3" font-size="13">physical access</text><text x="150" y="131" text-anchor="middle" fill="#c8bda3" font-size="13">and immediate security</text></g>
  </g>
  <rect x="315" y="555" width="570" height="40" rx="12" fill="#111a21" stroke="#536777"/><text x="600" y="580" text-anchor="middle" fill="#dfe8eb" font-family="Arial,sans-serif" font-size="15" font-weight="700">Wolfgang and the Reich Leadership Council retain final arbitration</text>
</svg>
