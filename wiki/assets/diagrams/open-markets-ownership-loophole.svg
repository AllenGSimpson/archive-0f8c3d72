<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Investor-by-investor ownership loophole</title><desc id="desc">Several nominally separate foreign investors pass through banks, nominees, funds, and affiliates into one American corporation without their holdings being aggregated.</desc><rect width="1200" height="700" fill="#101713"/><text x="60" y="62" fill="#d8c58c" font-family="Georgia,serif" font-size="30">THE OWNERSHIP RULE MEASURED EACH NAME, NOT THE NETWORK</text><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><g fill="#163f46" stroke="#63c7d7" stroke-width="3"><rect x="55" y="125" width="215" height="78" rx="8"/><rect x="355" y="125" width="215" height="78" rx="8"/><rect x="655" y="125" width="215" height="78" rx="8"/><rect x="955" y="125" width="190" height="78" rx="8"/></g><g fill="#eef2e8"><text x="162" y="158">FOREIGN FIRM A</text><text x="162" y="184">below threshold</text><text x="462" y="158">CUSTODIAL BANK</text><text x="462" y="184">separate account</text><text x="762" y="158">INVESTMENT FUND</text><text x="762" y="184">separate filing</text><text x="1050" y="158">AFFILIATE</text><text x="1050" y="184">no explicit pact</text></g><g stroke="#d8c58c" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M162 203 365 345"/><path d="M462 203 490 345"/><path d="M762 203 650 345"/><path d="M1050 203 775 345"/></g><rect x="315" y="345" width="570" height="120" rx="10" fill="#463325" stroke="#d8c58c" stroke-width="4"/><text x="600" y="390" fill="#f3ead0" font-size="25">AMERICAN CORPORATION</text><text x="600" y="426" fill="#f3ead0">combined influence may be decisive</text><g stroke="#c45050" stroke-width="5" fill="none" stroke-dasharray="12 10"><path d="M95 535 H1105"/></g><text x="600" y="520" fill="#c45050" font-size="23">LEGAL AGGREGATION STOPPED HERE</text><text x="600" y="585" fill="#eef2e8">Voting advice · credit · clearing · licenses · board observers · supplier contracts</text><text x="600" y="625" fill="#9da99d" font-size="17">Archive reconstruction · conceptual ownership graph, not a registry of specific firms</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d8c58c"/></marker></defs></svg>
