<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Orbital restraint matrix</title>
  <desc id="desc">A matrix comparing orbital functions by human presence, persistence of harm, strategic interpretation, and principal restraint mechanism.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a25"/><stop offset="1" stop-color="#1b303b"/></linearGradient>
    <style>.title{font:29px Georgia,serif;fill:#f3ead8}.sub{font:15px Arial,sans-serif;fill:#b9ced3}.head{font:bold 13px Arial,sans-serif;fill:#e9dfcb;letter-spacing:.8px}.cell{font:14px Arial,sans-serif;fill:#d5e0e2}.row{font:bold 15px Georgia,serif;fill:#f3ead8}.grid{stroke:#617c86;stroke-width:1}.low{fill:#294d49}.mid{fill:#665a34}.high{fill:#693e42}.panel{fill:#203642}.note{font:13px Arial,sans-serif;fill:#aec2c7}</style>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <text x="52" y="52" class="title">Orbital restraint is a matrix of function and consequence</text>
  <text x="52" y="80" class="sub">No single label—civil, military, crewed, or commercial—settles the escalation risk</text>
  <g transform="translate(50 112)">
    <rect width="1100" height="408" rx="10" class="panel"/>
    <path d="M0 56H1100M240 0V408M440 0V408M630 0V408M840 0V408M0 126H1100M0 196H1100M0 266H1100M0 336H1100" class="grid"/>
    <text x="120" y="34" text-anchor="middle" class="head">ORBITAL FUNCTION</text><text x="340" y="34" text-anchor="middle" class="head">HUMAN EXPOSURE</text><text x="535" y="34" text-anchor="middle" class="head">PERSISTENT HARM</text><text x="735" y="34" text-anchor="middle" class="head">STRATEGIC READING</text><text x="970" y="34" text-anchor="middle" class="head">PRINCIPAL RESTRAINT</text>
    <rect x="241" y="57" width="198" height="68" class="low"/><rect x="441" y="57" width="188" height="68" class="mid"/><rect x="631" y="57" width="208" height="68" class="mid"/>
    <text x="22" y="88" class="row">Declared combat craft</text><text x="22" y="109" class="note">interceptor · armed inspector</text><text x="340" y="98" text-anchor="middle" class="cell">Usually low or bounded</text><text x="535" y="90" text-anchor="middle" class="cell">High if attack fragments</text><text x="535" y="108" text-anchor="middle" class="cell">the target</text><text x="735" y="90" text-anchor="middle" class="cell">Military target;</text><text x="735" y="108" text-anchor="middle" class="cell">stopping point possible</text><text x="970" y="90" text-anchor="middle" class="cell">Target classification</text><text x="970" y="108" text-anchor="middle" class="cell">and debris limitation</text>
    <rect x="241" y="127" width="198" height="68" class="low"/><rect x="441" y="127" width="188" height="68" class="low"/><rect x="631" y="127" width="208" height="68" class="high"/>
    <text x="22" y="158" class="row">Strategic warning</text><text x="22" y="179" class="note">command · submarine relay</text><text x="340" y="168" text-anchor="middle" class="cell">Often uncrewed</text><text x="535" y="168" text-anchor="middle" class="cell">Effect may be reversible</text><text x="735" y="160" text-anchor="middle" class="cell">Possible preparation</text><text x="735" y="178" text-anchor="middle" class="cell">for terrestrial attack</text><text x="970" y="160" text-anchor="middle" class="cell">Notification, substitutes,</text><text x="970" y="178" text-anchor="middle" class="cell">and constellation restraint</text>
    <rect x="241" y="197" width="198" height="68" class="high"/><rect x="441" y="197" width="188" height="68" class="high"/><rect x="631" y="197" width="208" height="68" class="high"/>
    <text x="22" y="228" class="row">Inhabited installation</text><text x="22" y="249" class="note">station · habitat · settlement utility</text><text x="340" y="238" text-anchor="middle" class="cell">Immediate mass-casualty risk</text><text x="535" y="230" text-anchor="middle" class="cell">Pressure, power, or debris</text><text x="535" y="248" text-anchor="middle" class="cell">can spread system-wide</text><text x="735" y="230" text-anchor="middle" class="cell">Attack upon life, not</text><text x="735" y="248" text-anchor="middle" class="cell">only equipment</text><text x="970" y="230" text-anchor="middle" class="cell">Life-support protection,</text><text x="970" y="248" text-anchor="middle" class="cell">direct channels, rescue</text>
    <rect x="241" y="267" width="198" height="68" class="mid"/><rect x="441" y="267" width="188" height="68" class="low"/><rect x="631" y="267" width="208" height="68" class="mid"/>
    <text x="22" y="298" class="row">Dual-use civil system</text><text x="22" y="319" class="note">navigation · weather · traffic</text><text x="340" y="308" text-anchor="middle" class="cell">Indirect crew and public risk</text><text x="535" y="308" text-anchor="middle" class="cell">Usually service-dependent</text><text x="735" y="300" text-anchor="middle" class="cell">Purpose disputed;</text><text x="735" y="318" text-anchor="middle" class="cell">effects may be strategic</text><text x="970" y="300" text-anchor="middle" class="cell">Registration, notice,</text><text x="970" y="318" text-anchor="middle" class="cell">sovereign redundancy</text>
    <rect x="241" y="337" width="198" height="70" class="high"/><rect x="441" y="337" width="188" height="70" class="mid"/><rect x="631" y="337" width="208" height="70" class="high"/>
    <text x="22" y="368" class="row">Rescue and safe navigation</text><text x="22" y="389" class="note">distress · approach · evacuation</text><text x="340" y="378" text-anchor="middle" class="cell">Explicit human-safety role</text><text x="535" y="370" text-anchor="middle" class="cell">Failure endangers later</text><text x="535" y="388" text-anchor="middle" class="cell">responders and neutrals</text><text x="735" y="370" text-anchor="middle" class="cell">Abuse destroys reciprocal</text><text x="735" y="388" text-anchor="middle" class="cell">protection for all</text><text x="970" y="370" text-anchor="middle" class="cell">Protected channels, markings,</text><text x="970" y="388" text-anchor="middle" class="cell">and cross-bloc duty</text>
  </g>
  <text x="600" y="558" text-anchor="middle" class="sub">Sovereign substitutes keep a lost service from becoming a strategic veto.</text>
  <text x="600" y="582" text-anchor="middle" class="note">Stockholm limits persistent hazards; Geneva makes intent and human safety legible during close encounters.</text>
</svg>
