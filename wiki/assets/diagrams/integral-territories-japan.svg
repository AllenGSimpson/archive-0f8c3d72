<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional structure of integral Japan</title>
  <desc id="desc">Japan's home islands connect to four great outer regions, older Micronesia, and later Pacific possessions through Japanese nationality and differentiated direct government, while associated states remain legally separate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a8b8ca"/>
    </marker>
    <style>
      .title{font:700 28px Georgia,serif;fill:#f8fafc}.sub{font:15px Arial,sans-serif;fill:#cbd5e1}.box{stroke-width:2;filter:url(#shadow)}.h{font:700 18px Arial,sans-serif;fill:#fff}.t{font:14px Arial,sans-serif;fill:#e5e7eb}.small{font:12px Arial,sans-serif;fill:#cbd5e1}.line{stroke:#a8b8ca;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="url(#bg)"/>
  <text x="600" y="43" text-anchor="middle" class="title">Integral Japan: one nationality, differentiated government</text>
  <text x="600" y="70" text-anchor="middle" class="sub">Direct Japanese sovereignty does not imply uniform institutions or equal metropolitan treatment</text>

  <rect x="450" y="103" width="300" height="94" rx="12" fill="#8a1c2c" stroke="#f1b8bf" class="box"/>
  <text x="600" y="137" text-anchor="middle" class="h">Home islands and imperial center</text>
  <text x="600" y="162" text-anchor="middle" class="t">Emperor · Diet · ministries · courts</text>
  <text x="600" y="183" text-anchor="middle" class="small">Japanese nationality and direct strategic authority</text>

  <path d="M510 197L207 265" class="line"/><path d="M570 197L495 265" class="line"/>
  <path d="M630 197L705 265" class="line"/><path d="M690 197L993 265" class="line"/>

  <rect x="70" y="268" width="275" height="105" rx="10" fill="#234f79" stroke="#93c5fd" class="box"/>
  <text x="207" y="300" text-anchor="middle" class="h">Chōsen</text>
  <text x="207" y="325" text-anchor="middle" class="t">Korean peninsula</text>
  <text x="207" y="348" text-anchor="middle" class="small">Governor-General · industrial region</text>

  <rect x="365" y="268" width="220" height="105" rx="10" fill="#356859" stroke="#9ad5bd" class="box"/>
  <text x="475" y="300" text-anchor="middle" class="h">Taiwan / Formosa</text>
  <text x="475" y="325" text-anchor="middle" class="t">Taihoku-centered region</text>
  <text x="475" y="348" text-anchor="middle" class="small">Settlement · industry · preservation</text>

  <rect x="615" y="268" width="220" height="105" rx="10" fill="#6b4f23" stroke="#f4d48c" class="box"/>
  <text x="725" y="300" text-anchor="middle" class="h">Ryukyu Islands</text>
  <text x="725" y="325" text-anchor="middle" class="t">Southwestern archipelago</text>
  <text x="725" y="348" text-anchor="middle" class="small">Prefectures · bases · regional culture</text>

  <rect x="855" y="268" width="275" height="105" rx="10" fill="#4b5563" stroke="#d1d5db" class="box"/>
  <text x="992" y="300" text-anchor="middle" class="h">Karafuto</text>
  <text x="992" y="325" text-anchor="middle" class="t">All Sakhalin</text>
  <text x="992" y="348" text-anchor="middle" class="small">Northern frontier · resources · security</text>

  <path d="M530 373L350 449" class="line"/><path d="M670 373L850 449" class="line"/>
  <rect x="170" y="452" width="360" height="102" rx="10" fill="#2d5d68" stroke="#9ed7df" class="box"/>
  <text x="350" y="484" text-anchor="middle" class="h">Older Micronesian possessions</text>
  <text x="350" y="509" text-anchor="middle" class="t">Former South Seas Mandate</text>
  <text x="350" y="532" text-anchor="middle" class="small">Deepest Pacific integration and longest nationality history</text>

  <rect x="670" y="452" width="360" height="102" rx="10" fill="#65526f" stroke="#dac0e6" class="box"/>
  <text x="850" y="484" text-anchor="middle" class="h">Later Pacific territories</text>
  <text x="850" y="509" text-anchor="middle" class="t">Melanesia and Polynesia</text>
  <text x="850" y="532" text-anchor="middle" class="small">1970s–80s movement toward nationality; schedules open</text>

  <rect x="115" y="584" width="970" height="43" rx="9" fill="#202938" stroke="#64748b" stroke-dasharray="7 5"/>
  <text x="600" y="611" text-anchor="middle" class="t">Outside this boundary: associated and protected states retain their own citizenship, flags, governments, and limited diplomacy</text>
</svg>
