<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Late Commonwealth African responsibility</title><desc id="desc">London retains strategic responsibility, local governments hold domestic authority, and intelligence knowledge sits between public claims.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#263642"/></linearGradient><style>.t{font:700 44px Georgia,serif;fill:#f8f2e8}.s{font:18px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.h{font:700 25px Arial,sans-serif;fill:#fff}.c{font:18px Arial,sans-serif;fill:#d8e2e7}.k{font:700 18px Arial,sans-serif;fill:#f0c66c}.f{font:19px Arial,sans-serif;fill:#e2d3aa}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="72" text-anchor="middle" class="t">THE LATE-COMMONWEALTH DISTANCE</text><text x="800" y="112" text-anchor="middle" class="s">KNOWLEDGE · DEVOLUTION · DENIABLE RESPONSIBILITY</text><rect x="100" y="190" width="420" height="460" rx="28" fill="#17384a" stroke="#69bce0" stroke-width="5"/><text x="310" y="255" text-anchor="middle" class="h">LONDON</text><text x="150" y="325" class="c">Routes and bases</text><text x="150" y="370" class="c">Alignment and sterling</text><text x="150" y="415" class="c">Major unrest</text><text x="150" y="460" class="c">International reputation</text><text x="150" y="535" class="k">STRATEGIC RESPONSIBILITY</text><rect x="1080" y="190" width="420" height="460" rx="28" fill="#332b1e" stroke="#d7b35e" stroke-width="5"/><text x="1290" y="255" text-anchor="middle" class="h">LOCAL GOVERNMENTS</text><text x="1130" y="325" class="c">Health and housing</text><text x="1130" y="370" class="c">Police and movement</text><text x="1130" y="415" class="c">Family policy</text><text x="1130" y="460" class="c">Segregation and labor</text><text x="1130" y="535" class="k">DOMESTIC RESPONSIBILITY</text><path d="M520 420H1080" stroke="#7b929d" stroke-width="6"/><rect x="590" y="315" width="420" height="210" rx="30" fill="#213420" stroke="#8ab46b" stroke-width="5"/><text x="800" y="380" text-anchor="middle" class="h">INTELLIGENCE</text><text x="800" y="430" text-anchor="middle" class="c">Knows more than ministers</text><text x="800" y="470" text-anchor="middle" class="c">publicly acknowledge</text><rect x="270" y="715" width="1060" height="75" rx="36" fill="#1a2b36" stroke="#80949f" stroke-width="3"/><text x="800" y="762" text-anchor="middle" class="f">The government seeks distance from actionable responsibility, not literal ignorance</text></svg>
