<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">German late-war and immediate-postwar jet generation</title>
  <desc id="desc">Seven registered German jet aircraft arranged chronologically from the Me 262A-1 in 1944 to the EF 131A-0 evaluation in 1949.</desc>
  <rect width="1200" height="760" rx="28" fill="#151c1f"/>
  <text x="600" y="62" text-anchor="middle" fill="#f1e6cf" font-family="Georgia,serif" font-size="35" font-weight="700">German early-jet generation</text>
  <text x="600" y="94" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="18">victory-era operations · bounded experiments · registry reform · 1944–1949</text>
  <line x1="72" y1="390" x2="1120" y2="390" stroke="#b66a62" stroke-width="5"/><polygon points="1120,366 1168,390 1120,414" fill="#b66a62"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(30 132)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#86a6ae" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="19" font-weight="700">Me 262A-1</text><text x="85" y="73" fill="#d6dde0" font-size="18">1944</text><text x="85" y="111" fill="#b8c5c8" font-size="14">heavy day</text><text x="85" y="135" fill="#b8c5c8" font-size="14">interceptor</text><text x="85" y="170" fill="#b8c5c8" font-size="14">870 km/h</text><line x1="85" y1="205" x2="85" y2="258" stroke="#86a6ae" stroke-width="3"/></g>
    <g transform="translate(180 443)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#c39b72" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="18" font-weight="700">Ar 234C-3</text><text x="85" y="67" fill="#f1e6cf" font-size="18" font-weight="700">Blitz</text><text x="85" y="98" fill="#d6dde0" font-size="18">1946</text><text x="85" y="135" fill="#b8c5c8" font-size="14">fast bomber</text><text x="85" y="159" fill="#b8c5c8" font-size="14">reconnaissance</text><text x="85" y="188" fill="#b8c5c8" font-size="14">1,500 kg stores</text><line x1="85" y1="-53" x2="85" y2="0" stroke="#c39b72" stroke-width="3"/></g>
    <g transform="translate(330 132)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#889f77" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="19" font-weight="700">He 162C</text><text x="85" y="73" fill="#d6dde0" font-size="18">1947</text><text x="85" y="111" fill="#b8c5c8" font-size="14">light point-defense</text><text x="85" y="135" fill="#b8c5c8" font-size="14">fighter</text><text x="85" y="170" fill="#b8c5c8" font-size="14">360 km radius</text><line x1="85" y1="205" x2="85" y2="258" stroke="#889f77" stroke-width="3"/></g>
    <g transform="translate(480 443)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#b66a62" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="19" font-weight="700">Me 262F</text><text x="85" y="73" fill="#d6dde0" font-size="18">1948</text><text x="85" y="111" fill="#b8c5c8" font-size="14">HG-II high-speed</text><text x="85" y="135" fill="#b8c5c8" font-size="14">interceptor</text><text x="85" y="170" fill="#b8c5c8" font-size="14">960 km/h</text><line x1="85" y1="-53" x2="85" y2="0" stroke="#b66a62" stroke-width="3"/></g>
    <g transform="translate(630 132)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#c4aa64" stroke-width="3"/><text x="85" y="39" fill="#f1e6cf" font-size="17" font-weight="700">Ta 183A-1</text><text x="85" y="64" fill="#f1e6cf" font-size="17" font-weight="700">Huckebein</text><text x="85" y="94" fill="#d6dde0" font-size="18">1948</text><text x="85" y="132" fill="#b8c5c8" font-size="14">frontline day</text><text x="85" y="156" fill="#b8c5c8" font-size="14">fighter</text><text x="85" y="185" fill="#b8c5c8" font-size="14">650 km radius</text><line x1="85" y1="205" x2="85" y2="258" stroke="#c4aa64" stroke-width="3"/></g>
    <g transform="translate(780 443)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#9189ae" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="19" font-weight="700">Ho 229A-2</text><text x="85" y="73" fill="#d6dde0" font-size="18">1948</text><text x="85" y="111" fill="#b8c5c8" font-size="14">penetration strike</text><text x="85" y="135" fill="#b8c5c8" font-size="14">flying wing</text><text x="85" y="170" fill="#b8c5c8" font-size="14">186-family total</text><line x1="85" y1="-53" x2="85" y2="0" stroke="#9189ae" stroke-width="3"/></g>
    <g transform="translate(980 132)"><rect width="170" height="205" rx="18" fill="#26343a" stroke="#769b91" stroke-width="3"/><text x="85" y="42" fill="#f1e6cf" font-size="19" font-weight="700">EF 131A-0</text><text x="85" y="73" fill="#d6dde0" font-size="18">1949 evaluation</text><text x="85" y="111" fill="#b8c5c8" font-size="14">forward-swept</text><text x="85" y="135" fill="#b8c5c8" font-size="14">recon bomber</text><text x="85" y="170" fill="#b8c5c8" font-size="14">16-program total</text><line x1="85" y1="205" x2="85" y2="258" stroke="#769b91" stroke-width="3"/></g>
    <circle cx="115" cy="390" r="9" fill="#e0c477"/><circle cx="265" cy="390" r="9" fill="#e0c477"/><circle cx="415" cy="390" r="9" fill="#e0c477"/><circle cx="565" cy="390" r="9" fill="#e0c477"/><circle cx="715" cy="390" r="9" fill="#e0c477"/><circle cx="865" cy="390" r="9" fill="#e0c477"/><circle cx="1065" cy="390" r="9" fill="#e0c477"/>
  </g>
  <text x="600" y="713" text-anchor="middle" fill="#c2cdd0" font-family="Arial,sans-serif" font-size="17">operational aircraft and evaluation programs remain distinct; clean-sheet service types move to the 500 block after 1948</text>
</svg>
