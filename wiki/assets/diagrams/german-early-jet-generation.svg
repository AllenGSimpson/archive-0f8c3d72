<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">German late-war and immediate-postwar high-speed aircraft branches</title>
  <desc id="desc">Operational, limited-service, experimental, and non-operational German jet and rocket-aircraft branches centered on Me 262, Ta 183, Ho 229, Ar 234, Me 163, Junkers evaluation work, and the He 162 program.</desc>
  <rect width="1200" height="700" rx="28" fill="#151c1f"/>
  <text x="600" y="60" text-anchor="middle" fill="#f1e6cf" font-family="Georgia,serif" font-size="34" font-weight="700">German late-war and immediate-postwar high-speed aircraft</text>
  <text x="600" y="94" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="18">service families · bounded developments · research programs · 1944–48 transition</text>

  <g font-family="Arial,sans-serif">
    <text x="54" y="145" fill="#e1c477" font-size="19" font-weight="700">OPERATIONAL AND LIMITED-SERVICE BRANCHES</text>
    <g transform="translate(54 168)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#82a7b0" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Me 262</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">regular wartime jet fighter</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">mature operational school</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">baseline for later high-speed work</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">detailed fleet register open</text>
    </g>
    <g transform="translate(334 168)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#7f9fb3" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Me 262 HG III</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">limited service · early 1947</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">wing-root engine research</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">high speed, low endurance</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">not an endless production alphabet</text>
    </g>
    <g transform="translate(614 168)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#a0ad79" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Ta 183</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">production / adoption bridge</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">compact swept-wing fighter school</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">feeds the post-1948 register</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">subtype chronology open</text>
    </g>
    <g transform="translate(894 168)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#968db1" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Ho 229 / H IX</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">operational flying-wing family</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">institutional Horten-Gotha bridge</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">fighter and penetration school</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">production total open</text>
    </g>

    <text x="54" y="404" fill="#e1c477" font-size="19" font-weight="700">OPERATIONAL SUPPORT, DEMONSTRATORS, AND EXPERIMENTS</text>
    <g transform="translate(54 427)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#c69b71" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Ar 234</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">operational bomber / reconnaissance</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">fast-strike and surveillance lineage</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">survives into postwar Arado work</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">detailed subtype record open</text>
    </g>
    <g transform="translate(334 427)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#bd7769" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Me 163 Komet</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">brief rocket-fighter branch</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">retained as technology demonstrator</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">gliding lessons survive</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">rocket-interceptor path ends</text>
    </g>
    <g transform="translate(614 427)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#789d91" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">Ju 287 / EF successors</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">sixteen-aircraft evaluation program</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">forward sweep and structures</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">no standard bomber fleet</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">individual suffixes remain open</text>
    </g>
    <g transform="translate(894 427)">
      <rect width="250" height="172" rx="16" fill="#29383e" stroke="#8c8580" stroke-width="3"/>
      <text x="20" y="38" fill="#f1e6cf" font-size="20" font-weight="700">He 162 program</text>
      <text x="20" y="70" fill="#d9e0e2" font-size="15">paper and prototype work only</text>
      <text x="20" y="99" fill="#bac6c8" font-size="14">no operational Volksjäger fleet</text>
      <text x="20" y="127" fill="#bac6c8" font-size="14">prototype details remain open</text>
      <text x="20" y="153" fill="#e1c477" font-size="13">former He 162C type withdrawn</text>
    </g>
  </g>

  <path d="M250 622 H950" stroke="#bd7769" stroke-width="4"/>
  <polygon points="938,611 958,622 938,633" fill="#bd7769"/>
  <text x="600" y="657" text-anchor="middle" fill="#f1e6cf" font-family="Arial,sans-serif" font-size="17" font-weight="700">1948 Reichsluftgerätordnung: newly accepted aircraft enter national role-series ordinals</text>
  <text x="600" y="682" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="14">Wartime identities remain grandfathered; experimental projects do not automatically become service types.</text>
</svg>
