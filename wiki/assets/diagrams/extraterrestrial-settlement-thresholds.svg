<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Extraterrestrial settlement thresholds</title>
  <desc id="desc">Four stages from expedition through permanent base and settlement to colony, distinguished by continuity, households, institutions, and social reproduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="1" stop-color="#101d2a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#708498"/>
      <stop offset="0.66" stop-color="#64b6c8"/>
      <stop offset="1" stop-color="#d4b86a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="60" y="68" fill="#edf4f7" font-family="Georgia,serif" font-size="31">When occupation becomes a society</text>
  <text x="60" y="103" fill="#9eb1bf" font-family="Arial,sans-serif" font-size="17">Functional thresholds used by historians; not a single international statutory test</text>
  <path d="M145 330H1055" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(60 154)">
      <rect width="245" height="315" rx="18" fill="#152432" stroke="#708498" stroke-width="2"/>
      <circle cx="122.5" cy="176" r="31" fill="#708498"/>
      <text x="122.5" y="62" text-anchor="middle" fill="#edf4f7" font-size="23" font-weight="700">EXPEDITION</text>
      <text x="122.5" y="100" text-anchor="middle" fill="#b9c8d0" font-size="16">Temporary presence</text>
      <text x="28" y="239" fill="#dce7eb" font-size="16">• One mission</text>
      <text x="28" y="270" fill="#dce7eb" font-size="16">• Fixed return plan</text>
      <text x="28" y="301" fill="#dce7eb" font-size="16">• Crew-defined life</text>
    </g>
    <g transform="translate(340 154)">
      <rect width="245" height="315" rx="18" fill="#142936" stroke="#5a9aad" stroke-width="2"/>
      <circle cx="122.5" cy="176" r="31" fill="#5a9aad"/>
      <text x="122.5" y="54" text-anchor="middle" fill="#edf4f7" font-size="22" font-weight="700">PERMANENT</text>
      <text x="122.5" y="82" text-anchor="middle" fill="#edf4f7" font-size="22" font-weight="700">BASE</text>
      <text x="122.5" y="116" text-anchor="middle" fill="#b9c8d0" font-size="16">Continuous occupation</text>
      <text x="28" y="239" fill="#dce7eb" font-size="16">• Rotating personnel</text>
      <text x="28" y="270" fill="#dce7eb" font-size="16">• Sponsor-controlled</text>
      <text x="28" y="301" fill="#dce7eb" font-size="16">• Return still expected</text>
    </g>
    <g transform="translate(620 154)">
      <rect width="245" height="315" rx="18" fill="#12303a" stroke="#64b6c8" stroke-width="2"/>
      <circle cx="122.5" cy="176" r="31" fill="#64b6c8"/>
      <text x="122.5" y="62" text-anchor="middle" fill="#edf4f7" font-size="23" font-weight="700">SETTLEMENT</text>
      <text x="122.5" y="100" text-anchor="middle" fill="#b9c8d0" font-size="16">Lives organized to remain</text>
      <text x="28" y="239" fill="#dce7eb" font-size="16">• Households</text>
      <text x="28" y="270" fill="#dce7eb" font-size="16">• Several employers</text>
      <text x="28" y="301" fill="#dce7eb" font-size="16">• Ordinary services</text>
    </g>
    <g transform="translate(900 154)">
      <rect width="245" height="315" rx="18" fill="#2b2d29" stroke="#d4b86a" stroke-width="2"/>
      <circle cx="122.5" cy="176" r="31" fill="#d4b86a"/>
      <text x="122.5" y="62" text-anchor="middle" fill="#fff7df" font-size="23" font-weight="700">COLONY</text>
      <text x="122.5" y="100" text-anchor="middle" fill="#d8cfb0" font-size="16">Social reproduction</text>
      <text x="28" y="239" fill="#f1ead4" font-size="16">• Born and educated</text>
      <text x="28" y="270" fill="#f1ead4" font-size="16">• Local households</text>
      <text x="28" y="301" fill="#f1ead4" font-size="16">• Expected continuity</text>
    </g>
  </g>
  <rect x="330" y="505" width="540" height="65" rx="12" fill="#0d1720" stroke="#536777"/>
  <text x="600" y="532" text-anchor="middle" fill="#dfe9ed" font-family="Arial,sans-serif" font-size="16" font-weight="700">A first birth is a demographic threshold—not proof of a complete colony.</text>
  <text x="600" y="555" text-anchor="middle" fill="#9eb1bf" font-family="Arial,sans-serif" font-size="14">Population, law, identity, and continuity develop at different speeds.</text>
</svg>
