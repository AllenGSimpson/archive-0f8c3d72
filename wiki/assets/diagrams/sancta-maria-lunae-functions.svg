<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Functions of Sancta Maria Lunae</title>
  <desc id="desc">Four connected functions—science, Catholic presence, strategic independence, and deep-space support—surround the Latin lunar establishment.</desc>
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#111d29"/></linearGradient><radialGradient id="moon"><stop stop-color="#dce2df"/><stop offset="1" stop-color="#6f7c7c"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg3)"/>
  <text x="58" y="66" fill="#eef4f6" font-family="Georgia,serif" font-size="31">Sancta Maria Lunae</text>
  <text x="58" y="99" fill="#9fb1be" font-family="Arial,sans-serif" font-size="17">The institutional identity of Our Lady of the Moon</text>
  <g transform="translate(600 330)"><circle r="132" fill="url(#moon)" opacity=".9"/><circle r="136" fill="none" stroke="#d4b86a" stroke-width="3"/><path d="M0-68V58M-43-25H43" stroke="#f5f0d9" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/><text x="0" y="181" text-anchor="middle" fill="#f1e6c5" font-family="Georgia,serif" font-size="21">OUR LADY OF THE MOON</text></g>
  <g stroke="#536c7b" stroke-width="3" fill="none"><path d="M478 270L350 205"/><path d="M722 270L850 205"/><path d="M478 390L350 455"/><path d="M722 390L850 455"/></g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(70 145)"><rect width="300" height="128" rx="16" fill="#142936" stroke="#64b6c8" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#eaf6f8" font-size="21" font-weight="700">SCIENCE</text><text x="150" y="75" text-anchor="middle" fill="#c0d5db" font-size="15">astronomy · geology · life support</text><text x="150" y="100" text-anchor="middle" fill="#c0d5db" font-size="15">navigation · communications</text></g>
    <g transform="translate(830 145)"><rect width="300" height="128" rx="16" fill="#2a2820" stroke="#d4b86a" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#fff5d8" font-size="21" font-weight="700">RELIGIOUS PRESENCE</text><text x="150" y="75" text-anchor="middle" fill="#d8cfb2" font-size="15">worship · pastoral order</text><text x="150" y="100" text-anchor="middle" fill="#d8cfb2" font-size="15">moral language for exploration</text></g>
    <g transform="translate(70 397)"><rect width="300" height="128" rx="16" fill="#231f27" stroke="#8c7494" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#f0e7f2" font-size="21" font-weight="700">STRATEGIC AUTONOMY</text><text x="150" y="75" text-anchor="middle" fill="#d0c1d4" font-size="15">permanent independent presence</text><text x="150" y="100" text-anchor="middle" fill="#d0c1d4" font-size="15">without copying every rival milestone</text></g>
    <g transform="translate(830 397)"><rect width="300" height="128" rx="16" fill="#1c2925" stroke="#6f9b80" stroke-width="3"/><text x="150" y="43" text-anchor="middle" fill="#e8f2eb" font-size="21" font-weight="700">DEEP-SPACE SUPPORT</text><text x="150" y="75" text-anchor="middle" fill="#bed2c5" font-size="15">exploration-yard experience</text><text x="150" y="100" text-anchor="middle" fill="#bed2c5" font-size="15">asteroid belt · Ceres trajectory</text></g>
  </g>
  <text x="600" y="588" text-anchor="middle" fill="#8297a5" font-family="Arial,sans-serif" font-size="13">Functional diagram only · exact site, layout, population, and occupation chronology remain open</text>
</svg>
