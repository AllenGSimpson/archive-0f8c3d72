<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">The layers of international software rights</title>
  <desc id="desc">A software work is shown as a bundle of authorship, source, executable, translation, adaptation, hardware implementation, distribution, maintenance and certification interests surrounded by five national legal systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#22272d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".36"/></filter>
    <style>.title{font:700 28px Georgia,serif;fill:#f0eadf}.sub{font:15px Arial,sans-serif;fill:#aeb8bf}.head{font:700 16px Arial,sans-serif;fill:#f4eee2}.body{font:13px Arial,sans-serif;fill:#c6cdd2}.label{font:700 14px Arial,sans-serif;fill:#e8dfcf}.box{stroke:#64717a;stroke-width:1.4}.link{stroke:#b89a63;stroke-width:2;fill:none;stroke-dasharray:6 5}</style>
  </defs>
  <rect width="1200" height="600" rx="18" fill="url(#bg)"/>
  <text class="title" x="55" y="54">A program is not one indivisible right</text>
  <text class="sub" x="55" y="81">Technical portability divides legal identity among creators, employers, platforms, publishers, states and territories</text>

  <g filter="url(#shadow)">
    <rect class="box" x="410" y="116" width="380" height="362" rx="16" fill="#332f2c" stroke="#b89a63"/>
    <text class="head" x="445" y="151">THE PROGRAM</text>
    <rect x="445" y="174" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="465" y="204">Authorship</text>
    <rect x="610" y="174" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="642" y="204">Source</text>
    <rect x="445" y="238" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="468" y="268">Executable</text>
    <rect x="610" y="238" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="637" y="268">Translation</text>
    <rect x="445" y="302" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="472" y="332">Adaptation</text>
    <rect x="610" y="302" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="622" y="324">Hardware</text><text class="body" x="628" y="341">implementation</text>
    <rect x="445" y="366" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="465" y="396">Distribution</text>
    <rect x="610" y="366" width="145" height="48" rx="8" fill="#344651"/><text class="label" x="622" y="388">Maintenance</text><text class="body" x="638" y="405">and escrow</text>
    <rect x="527" y="430" width="145" height="30" rx="7" fill="#4b4335"/><text class="label" x="552" y="450">Certification</text>

    <rect class="box" x="55" y="130" width="260" height="82" rx="10" fill="#293842"/><text class="head" x="78" y="159">United States</text><text class="body" x="78" y="184">Copyrightable product · license</text><text class="body" x="78" y="202">amid informal copying</text>
    <rect class="box" x="55" y="252" width="260" height="82" rx="10" fill="#293842"/><text class="head" x="78" y="281">Britain and Commonwealth</text><text class="body" x="78" y="306">Literary-technical work · service</text><text class="body" x="78" y="324">and institutional contract</text>
    <rect class="box" x="55" y="374" width="260" height="82" rx="10" fill="#293842"/><text class="head" x="78" y="403">Greater German Reich</text><text class="body" x="78" y="428">Technical plan · employer product</text><text class="body" x="78" y="446">certification · controlled export</text>

    <rect class="box" x="885" y="176" width="260" height="92" rx="10" fill="#283c35"/><text class="head" x="908" y="206">Empire of Japan</text><text class="body" x="908" y="231">Corporate work embedded in</text><text class="body" x="908" y="249">product, process and platform</text>
    <rect class="box" x="885" y="326" width="260" height="92" rx="10" fill="#3a3530"/><text class="head" x="908" y="356">Latin Bloc</text><text class="body" x="908" y="381">Moral authorship separated from</text><text class="body" x="908" y="399">publication and adaptation</text>
  </g>

  <path class="link" d="M315 171 C350 171 370 220 410 238"/><path class="link" d="M315 293 C350 293 370 293 410 293"/><path class="link" d="M315 415 C350 415 370 370 410 352"/><path class="link" d="M790 248 C830 238 850 222 885 222"/><path class="link" d="M790 350 C830 354 850 372 885 372"/>
  <text class="sub" x="360" y="544">Lucerne, c. 1978–79: name the transferred layer; do not assume that “ownership” answers every question</text>
</svg>
