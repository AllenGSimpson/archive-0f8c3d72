<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Great-power status in the Armed Concert</title><desc id="desc">Seven cumulative capability criteria connect to the five recognized systems: Germany, the United States, Japan, the British Commonwealth, and the Latin system.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.core{fill:#263727;stroke:#8dac6d;stroke-width:3}.criterion{fill:#172936;stroke:#5f7f92;stroke-width:2}.system{fill:#19323a;stroke:#68aaa7;stroke-width:2}.tag{font:700 13px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.07em}.t{font:700 18px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c1ccd4}.line{stroke:#e8bd57;stroke-width:2.5;fill:none}.note{font:italic 15px Georgia,serif;fill:#84c7c3}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="48" y="62" class="h">Great-power status is cumulative</text><text x="48" y="92" class="s">No single fleet count, economy, or space milestone creates membership in the Five</text>
  <g transform="translate(450 238)"><rect class="core" width="300" height="142" rx="70"/><text x="150" y="42" text-anchor="middle" class="tag">RECOGNIZED STRATEGIC INDEPENDENCE</text><text x="150" y="82" text-anchor="middle" class="t">No other state can dictate terms</text><text x="150" y="112" text-anchor="middle" class="d">across the system as a whole</text></g>
  <path d="M450 277 L314 175 M450 319 L286 319 M450 357 L314 478 M750 277 L886 175 M750 319 L914 319 M750 357 L886 478 M600 238 V150" class="line"/>
  <g transform="translate(448 108)"><rect class="criterion" width="304" height="70" rx="8"/><text x="152" y="29" text-anchor="middle" class="tag">INDUSTRIAL ECONOMY</text><text x="152" y="52" text-anchor="middle" class="d">production, energy, technical depth</text></g>
  <g transform="translate(62 128)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">OCEANIC MILITARY REACH</text><text x="18" y="58" class="d">fleets, lift, distant supply</text><text x="18" y="79" class="d">and independent operations</text></g>
  <g transform="translate(38 274)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">AEROSPACE SYSTEM</text><text x="18" y="58" class="d">independent launch, stations,</text><text x="18" y="79" class="d">communications and crews</text></g>
  <g transform="translate(62 432)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">STRATEGIC FLEETS</text><text x="18" y="58" class="d">submarines, carriers, missiles,</text><text x="18" y="79" class="d">merchant and auxiliary depth</text></g>
  <g transform="translate(868 128)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">CLIENTS AND BASES</text><text x="18" y="58" class="d">protected systems, access,</text><text x="18" y="79" class="d">foreign political obligations</text></g>
  <g transform="translate(892 274)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">GLOBAL FINANCE AND TRADE</text><text x="18" y="58" class="d">currencies, shipping, credit,</text><text x="18" y="79" class="d">standards and investment</text></g>
  <g transform="translate(868 432)"><rect class="criterion" width="270" height="92" rx="8"/><text x="18" y="30" class="tag">STRATEGIC DEPTH</text><text x="18" y="58" class="d">geography, reserves, population,</text><text x="18" y="79" class="d">industry and political endurance</text></g>
  <g transform="translate(112 575)"><rect class="system" width="176" height="52" rx="7"/><text x="88" y="32" text-anchor="middle" class="t">Germany</text></g><g transform="translate(312 575)"><rect class="system" width="176" height="52" rx="7"/><text x="88" y="32" text-anchor="middle" class="t">United States</text></g><g transform="translate(512 575)"><rect class="system" width="176" height="52" rx="7"/><text x="88" y="32" text-anchor="middle" class="t">Japan</text></g><g transform="translate(712 575)"><rect class="system" width="176" height="52" rx="7"/><text x="88" y="32" text-anchor="middle" class="t">Commonwealth</text></g><g transform="translate(912 575)"><rect class="system" width="176" height="52" rx="7"/><text x="88" y="32" text-anchor="middle" class="t">Latin system</text></g>
</svg>
