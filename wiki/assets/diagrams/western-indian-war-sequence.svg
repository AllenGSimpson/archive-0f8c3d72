<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Western Indian war sequence, 1947 to 1982</title>
  <desc id="desc">A timeline showing state formation, frontier campaigns, and the three consolidation wars of western India.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#28232c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".32"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d0b56e"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="55" y="66" fill="#f5eddb" font-family="Georgia,serif" font-size="34">THE WARS THAT MADE WESTERN INDIA</text>
  <text x="55" y="102" fill="#a9b6c2" font-family="Arial,sans-serif" font-size="17">State formation becomes frontier war, then limited territorial consolidation</text>
  <path d="M105 382H1090" stroke="#d0b56e" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g><rect x="55" y="150" width="230" height="150" rx="16" fill="#443b31" stroke="#d0b56e"/><text x="75" y="185" fill="#fff" font-size="21" font-weight="700">1947-49</text><text x="75" y="218" fill="#f0dfb8" font-size="18">Western Succession</text><text x="75" y="245" fill="#f0dfb8" font-size="18">Crisis</text><text x="75" y="275" fill="#bac4cd" font-size="15">Five rival centers emerge</text></g>
    <g><rect x="335" y="150" width="230" height="150" rx="16" fill="#403438" stroke="#bb8794"/><text x="355" y="185" fill="#fff" font-size="21" font-weight="700">1949-55</text><text x="355" y="218" fill="#efd9df" font-size="18">First Baloch Wars</text><text x="355" y="250" fill="#bac4cd" font-size="15">Claims harden around</text><text x="355" y="273" fill="#bac4cd" font-size="15">Las Bela and Quetta</text></g>
    <g><rect x="615" y="150" width="230" height="150" rx="16" fill="#2a4050" stroke="#70a9c2"/><text x="635" y="185" fill="#fff" font-size="21" font-weight="700">1957-69</text><text x="635" y="218" fill="#d9edf5" font-size="18">Campaign cycles</text><text x="635" y="250" fill="#bac4cd" font-size="15">Quetta consolidated;</text><text x="635" y="273" fill="#bac4cd" font-size="15">Harappa cannot be held</text></g>
    <g><rect x="895" y="150" width="250" height="150" rx="16" fill="#334234" stroke="#8fb38e"/><text x="915" y="185" fill="#fff" font-size="21" font-weight="700">1972-82</text><text x="915" y="218" fill="#dcedd8" font-size="18">Consolidation wars</text><text x="915" y="250" fill="#bac4cd" font-size="15">Clear limited victories;</text><text x="915" y="273" fill="#bac4cd" font-size="15">no accepted regional order</text></g>
  </g>
  <g fill="#d0b56e"><circle cx="155" cy="382" r="10"/><circle cx="430" cy="382" r="10"/><circle cx="710" cy="382" r="10"/><circle cx="1000" cy="382" r="10"/></g>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="75" y="455" width="315" height="148" rx="15" fill="#202b35" stroke="#667a8d"/><text x="98" y="491" fill="#fff" font-size="21" font-weight="700">FORMATION</text><text x="98" y="525" fill="#c2ccd5" font-size="16">Afghanistan moves south</text><text x="98" y="552" fill="#c2ccd5" font-size="16">Sindh takes Karachi</text><text x="98" y="579" fill="#c2ccd5" font-size="16">Kalat, Balochistan, Pakistan endure</text>
    <rect x="442" y="455" width="315" height="148" rx="15" fill="#202b35" stroke="#667a8d"/><text x="465" y="491" fill="#fff" font-size="21" font-weight="700">MOBILITY</text><text x="465" y="525" fill="#c2ccd5" font-size="16">Mounted rifles and truck columns</text><text x="465" y="552" fill="#c2ccd5" font-size="16">Rail, roads, wells, and passes</text><text x="465" y="579" fill="#c2ccd5" font-size="16">Mechanization remains incomplete</text>
    <rect x="809" y="455" width="315" height="148" rx="15" fill="#202b35" stroke="#667a8d"/><text x="832" y="491" fill="#fff" font-size="21" font-weight="700">CONSOLIDATION</text><text x="832" y="525" fill="#c2ccd5" font-size="16">Afghanistan gains influence</text><text x="832" y="552" fill="#c2ccd5" font-size="16">Kalat preserves its coast</text><text x="832" y="579" fill="#c2ccd5" font-size="16">Hindustan gains frontier depth</text>
  </g>
  <text x="600" y="686" text-anchor="middle" fill="#8899a8" font-family="Arial,sans-serif" font-size="16">Borders become harder as the states become stronger; legitimacy remains unsettled.</text>
</svg>
