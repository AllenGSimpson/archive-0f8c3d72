<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Founding sequence of the postwar Formula One championship</title><desc id="desc">A timeline from national racing revival through the Geneva conference, International Grand Prix Cup, and first Formula One World Championship.</desc>
  <defs><style>.h{font:bold 39px Georgia,serif;fill:#f0d172}.s{font:22px Arial,sans-serif;fill:#d4d2c9}.y{font:bold 26px Arial,sans-serif;fill:#fff}.b{stroke:#c8c8bf;stroke-width:2;rx:18}.a{fill:none;stroke:#f0d172;stroke-width:6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f0d172"/></marker></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">THE ROAD TO FORMULA ONE</text><text x="58" y="104" class="s">National reconstruction becomes a neutralized international championship</text>
  <path d="M135 350H1080" class="a" marker-end="url(#m)"/>
  <g transform="translate(55 175)"><rect width="245" height="250" class="b" fill="#2e454d"/><text x="122" y="56" text-anchor="middle" class="y">1948-1949</text><text x="122" y="103" text-anchor="middle" class="s">National revival</text><text x="122" y="151" text-anchor="middle" class="s">Hill climbs</text><text x="122" y="183" text-anchor="middle" class="s">airfield races</text><text x="122" y="215" text-anchor="middle" class="s">revived Grands Prix</text></g>
  <g transform="translate(330 370)"><rect width="245" height="250" class="b" fill="#39474a"/><text x="122" y="56" text-anchor="middle" class="y">1950</text><text x="122" y="103" text-anchor="middle" class="s">Geneva conference</text><text x="122" y="151" text-anchor="middle" class="s">FIA sporting office</text><text x="122" y="183" text-anchor="middle" class="s">neutral inspectors</text><text x="122" y="215" text-anchor="middle" class="s">German-Italian core</text></g>
  <g transform="translate(605 175)"><rect width="245" height="250" class="b" fill="#57442f"/><text x="122" y="56" text-anchor="middle" class="y">1951</text><text x="122" y="103" text-anchor="middle" class="s">International</text><text x="122" y="135" text-anchor="middle" class="s">Grand Prix Cup</text><text x="122" y="183" text-anchor="middle" class="s">Provisional formula</text><text x="122" y="215" text-anchor="middle" class="s">and arbitration test</text></g>
  <g transform="translate(880 370)"><rect width="245" height="250" class="b" fill="#523747"/><text x="122" y="56" text-anchor="middle" class="y">1952</text><text x="122" y="103" text-anchor="middle" class="s">Formula One</text><text x="122" y="135" text-anchor="middle" class="s">World Championship</text><text x="122" y="183" text-anchor="middle" class="s">Drivers + makers</text><text x="122" y="215" text-anchor="middle" class="s">from the first season</text></g>
</svg>
