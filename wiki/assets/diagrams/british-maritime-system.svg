<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Siege Commonwealth maritime system</title><desc id="desc">Carrier, escort, submarine, base, amphibious, and auxiliary systems organized around the Atlantic Cape Indian Ocean route.</desc>
  <rect width="1200" height="720" rx="24" fill="#0e171c"/>
  <text x="58" y="62" fill="#f1eee5" font-family="Georgia,serif" font-size="38">The Siege Commonwealth maritime system</text>
  <text x="58" y="98" fill="#b7c3ca" font-family="Arial,sans-serif" font-size="18">Sea power as the defended infrastructure of the Atlantic–Cape–Indian Ocean route</text>
  <g stroke="#d9ad58" stroke-width="3" fill="none"><path d="M350 238 L470 300"/><path d="M850 238 L730 300"/><path d="M350 505 L470 420"/><path d="M850 505 L730 420"/><path d="M600 230 L600 280"/><path d="M600 455 L600 515"/></g>
  <rect x="430" y="275" width="340" height="180" rx="90" fill="#263d49" stroke="#7ba6b8" stroke-width="4"/>
  <text x="600" y="337" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ATLANTIC–CAPE–</text>
  <text x="600" y="371" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">INDIAN OCEAN ROUTE</text>
  <text x="600" y="407" text-anchor="middle" fill="#cbd7dc" font-family="Arial,sans-serif" font-size="17">convoys · bases · repair · movement</text>
  <g font-family="Arial,sans-serif">
    <g><rect x="70" y="155" width="280" height="115" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="92" y="190" fill="#fff" font-size="20" font-weight="700">CARRIER AIR POWER</text><text x="92" y="222" fill="#c3cdd2" font-size="16">4 fleet · 3 light carriers</text><text x="92" y="248" fill="#c3cdd2" font-size="16">air cover · strike · warning</text></g>
    <g><rect x="850" y="155" width="280" height="115" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="872" y="190" fill="#fff" font-size="20" font-weight="700">ASW ESCORT SCREEN</text><text x="872" y="222" fill="#c3cdd2" font-size="16">28 destroyers · 48 frigates</text><text x="872" y="248" fill="#c3cdd2" font-size="16">helicopters · arrays · barriers</text></g>
    <g><rect x="460" y="135" width="280" height="95" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="482" y="172" fill="#fff" font-size="20" font-weight="700">COMMONWEALTH BASES</text><text x="482" y="203" fill="#c3cdd2" font-size="16">Canada · Africa · Gulf · Australasia</text></g>
    <g><rect x="70" y="470" width="280" height="115" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="92" y="505" fill="#fff" font-size="20" font-weight="700">SUBMARINE ARM</text><text x="92" y="537" fill="#c3cdd2" font-size="16">18 SSK · 16 SSN · 4 SSGN</text><text x="92" y="563" fill="#c3cdd2" font-size="16">screen · scout · ambush · strike</text></g>
    <g><rect x="850" y="470" width="280" height="115" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="872" y="505" fill="#fff" font-size="20" font-weight="700">AMPHIBIOUS LIFT</text><text x="872" y="537" fill="#c3cdd2" font-size="16">18 major ships</text><text x="872" y="563" fill="#c3cdd2" font-size="16">docks · helicopters · landing craft</text></g>
    <g><rect x="460" y="515" width="280" height="95" rx="15" fill="#22323b" stroke="#5f8fa3" stroke-width="2"/><text x="482" y="552" fill="#fff" font-size="20" font-weight="700">ROYAL FLEET AUXILIARY</text><text x="482" y="583" fill="#c3cdd2" font-size="16">36 oilers · stores · repair · medical</text></g>
  </g>
  <rect x="190" y="650" width="820" height="43" rx="12" fill="#40351f" stroke="#9f7b3b"/>
  <text x="600" y="678" text-anchor="middle" fill="#f3d58f" font-family="Arial,sans-serif" font-size="17" font-weight="700">GOVERNING THREAT · GERMAN SUBMARINE ACCESS TO COMMONWEALTH SEA LANES</text>
</svg>
