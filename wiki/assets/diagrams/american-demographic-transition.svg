<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">American demographic transition</title><desc id="desc">A smooth declining fertility line from Depression recovery through the early 1980s, without a sharp baby boom and bust.</desc><defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131b22"/><stop offset="1" stop-color="#29241f"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f2ecdf}.s{font:15px Arial,sans-serif;fill:#c1c7ca;letter-spacing:1.2px}.a{font:16px Arial,sans-serif;fill:#e3e6e7}.v{font:700 19px Arial,sans-serif;fill:#f1dca6}.line{stroke:#c8a763;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#60717b;stroke-width:1;opacity:.5}</style></defs><rect width="1200" height="630" fill="url(#bd)"/><text x="60" y="65" class="h">NO BABY-BOOM MOUNTAIN, NO BIRTH-BUST VALLEY</text><text x="60" y="98" class="s">WORKING SETTING RANGES · NOT A FIXED CENSUS SERIES</text><g class="grid"><path d="M110 180H1110M110 280H1110M110 380H1110M110 480H1110"/></g><path d="M130 348 C220 300 305 285 390 300 S560 333 650 355 S820 390 910 408 S1020 425 1080 440" class="line"/><g fill="#c8a763"><circle cx="190" cy="320" r="9"/><circle cx="390" cy="300" r="9"/><circle cx="650" cy="355" r="9"/><circle cx="910" cy="408" r="9"/><circle cx="1080" cy="440" r="9"/></g><text x="120" y="530" class="a">LATE 1940s</text><text x="324" y="530" class="a">1950s</text><text x="602" y="530" class="a">1960s</text><text x="860" y="530" class="a">1970s</text><text x="1010" y="530" class="a">EARLY 1980s</text><text x="120" y="560" class="a">Depression-delayed</text><text x="120" y="583" class="a">family recovery</text><text x="324" y="560" class="v">2.8–3.2</text><text x="600" y="560" class="a">gradual decline</text><text x="860" y="560" class="v">2.5–2.8</text><text x="1010" y="560" class="v">2.3–2.6</text><text x="110" y="151" class="s">TOTAL FERTILITY DIRECTION</text><text x="710" y="151" class="s">EACH COHORT MODERATELY LARGER AS TOTAL POPULATION GROWS</text></svg>
