<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Union Commonwealth organizational bridge</title>
  <desc id="desc">British Union personnel passed through veterans organizations, policy circles, and private social networks into Union Commonwealth after 1947.</desc>
  <rect width="1200" height="650" fill="#111820"/>
  <text x="60" y="66" fill="#f0eee8" font-family="Georgia,serif" font-size="32">From prohibited movement to post-defeat party</text>
  <text x="60" y="101" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="17">Organizational continuity did not make the memberships identical</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="160" width="275" height="190" rx="12" fill="#202b35" stroke="#6f8290" stroke-width="2"/>
    <text x="88" y="204" fill="#f0eee8" font-size="24" font-weight="700">British Union</text>
    <text x="88" y="240" fill="#c5d0d7" font-size="17">Prohibited in 1940</text>
    <text x="88" y="275" fill="#9fb0bd" font-size="16">• trained speakers</text>
    <text x="88" y="305" fill="#9fb0bd" font-size="16">• policy memoranda</text>
    <text x="88" y="335" fill="#9fb0bd" font-size="16">• local contacts</text>
    <path d="M335 255 H430" stroke="#d7b56d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="430" y="130" width="340" height="250" rx="12" fill="#24323a" stroke="#d7b56d" stroke-width="3"/>
    <text x="458" y="174" fill="#f0eee8" font-size="22" font-weight="700">Wartime bridge, 1944–47</text>
    <text x="458" y="214" fill="#c5d0d7" font-size="17" font-weight="700">Jeffrey Hamm</text>
    <text x="458" y="240" fill="#9fb0bd" font-size="15">League branches and veterans</text>
    <text x="458" y="278" fill="#c5d0d7" font-size="17" font-weight="700">A. Raven Thomson</text>
    <text x="458" y="304" fill="#9fb0bd" font-size="15">Policy circles and corporatism</text>
    <text x="458" y="342" fill="#c5d0d7" font-size="17" font-weight="700">Diana Mosley</text>
    <text x="458" y="368" fill="#9fb0bd" font-size="15">Money, contacts, salons, access</text>
    <path d="M770 255 H865" stroke="#d7b56d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="865" y="160" width="275" height="190" rx="12" fill="#2e3036" stroke="#8e7b86" stroke-width="2"/>
    <text x="893" y="204" fill="#f0eee8" font-size="23" font-weight="700">Union Commonwealth</text>
    <text x="893" y="240" fill="#c5d0d7" font-size="17">Founded after peace</text>
    <text x="893" y="275" fill="#9fb0bd" font-size="16">• mass veteran slate</text>
    <text x="893" y="305" fill="#9fb0bd" font-size="16">• 104 MPs in 1947</text>
    <text x="893" y="335" fill="#9fb0bd" font-size="16">• new voters and candidates</text>
    <rect x="150" y="455" width="900" height="120" rx="10" fill="#182129" stroke="#465865"/>
    <text x="600" y="497" fill="#f0eee8" font-size="20" font-weight="700" text-anchor="middle">What the bridge explains</text>
    <text x="600" y="531" fill="#b8c5ce" font-size="17" text-anchor="middle">rapid branch formation, speakers, printing, welfare contacts, and policy drafting</text>
    <text x="600" y="559" fill="#9fb0bd" font-size="16" text-anchor="middle">It does not explain the whole 1947 electorate, most of whom were not former British Union members.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d7b56d"/></marker></defs>
</svg>
