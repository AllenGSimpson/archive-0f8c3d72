<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Russian naval design diaspora in Iran and Karachi</title>
  <desc id="desc">Diagram showing principal Russian naval design cores in Iran and subsidiary production branches in Karachi.</desc>
  <defs><style>.bg{fill:#101922}.sea{fill:#142c3b;stroke:#5c91ad;stroke-width:2}.core{fill:#273b48;stroke:#d4b45e;stroke-width:3}.branch{fill:#21313d;stroke:#82a8bc;stroke-width:2}.line{fill:none;stroke:#d4b45e;stroke-width:5}.title{font:700 32px Georgia,serif;fill:#f3eee4}.h{font:700 23px Georgia,serif;fill:#f3eee4}.t{font:17px Arial,sans-serif;fill:#dce5ea}.s{font:15px Arial,sans-serif;fill:#afc0ca}</style></defs>
  <rect class="bg" width="1200" height="680" rx="22"/><text class="title" x="600" y="55" text-anchor="middle">Iran–Karachi Naval Design System</text>
  <rect class="sea" x="55" y="95" width="1090" height="515" rx="24"/>
  <rect class="core" x="135" y="155" width="380" height="155" rx="16"/><text class="h" x="325" y="195" text-anchor="middle">Iranian core establishments</text><text class="t" x="325" y="235" text-anchor="middle">Rubin · submarines</text><text class="t" x="325" y="266" text-anchor="middle">Nevskoye · landing and support ships</text>
  <rect class="branch" x="685" y="135" width="380" height="105" rx="16"/><text class="h" x="875" y="175" text-anchor="middle">Karachi submarine branch</text><text class="t" x="875" y="207" text-anchor="middle">small diesel-electric construction</text>
  <rect class="branch" x="685" y="280" width="380" height="105" rx="16"/><text class="h" x="875" y="320" text-anchor="middle">Severnoye branch</text><text class="t" x="875" y="352" text-anchor="middle">escorts · frigates · patrol vessels</text>
  <rect class="branch" x="685" y="425" width="380" height="105" rx="16"/><text class="h" x="875" y="465" text-anchor="middle">Nevskoye subsidiary</text><text class="t" x="875" y="497" text-anchor="middle">landing craft · auxiliaries · support vessels</text>
  <path class="line" d="M515 210H615V187H685M515 232H615V332H685M515 255H615V477H685"/>
  <text class="s" x="325" y="370" text-anchor="middle">Iran preserves long-cycle design capacity, oil finance,</text><text class="s" x="325" y="395" text-anchor="middle">secure yards, and strategic research.</text>
  <text class="s" x="325" y="455" text-anchor="middle">Karachi becomes a foreign production and adaptation center</text><text class="s" x="325" y="480" text-anchor="middle">for Sindh and the Pakistani successor market.</text>
</svg>
