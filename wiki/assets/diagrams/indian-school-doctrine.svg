<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Indian School of British warfare</title><desc id="desc">A secure maritime base supports fortified nodes and protected routes, partner forces hold territory, and a mobile reserve advances only to a limited objective with a route home.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.b{fill:#192e39;stroke:#6a8796;stroke-width:2}.g{fill:#23352b;stroke:#7c9e79;stroke-width:2}.r{fill:#38272a;stroke:#a56d70;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.line{stroke:#cea654;stroke-width:3;fill:none}.dash{stroke:#78909d;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Indian School of British warfare</text><text x="50" y="92" class="s">Maintain a supportable network without claiming to control all territory between its nodes</text>
  <g transform="translate(50 235)"><rect class="b" width="225" height="190" rx="10"/><text x="18" y="35" class="tag">MARITIME BASE</text><text x="18" y="78" class="t">Port and airfield</text><text x="18" y="110" class="d">Ships, fuel, repair, stores,</text><text x="18" y="134" class="d">medicine, communications,</text><text x="18" y="158" class="d">reinforcement, evacuation</text></g>
  <path class="line" d="M275 330 H350"/>
  <g transform="translate(350 160)"><rect class="b" width="270" height="340" rx="10"/><text x="18" y="35" class="tag">PROTECTED ROUTE</text><text x="18" y="80" class="t">Armoured convoys</text><text x="18" y="108" class="d">Reconnaissance and engineers</text><text x="18" y="157" class="t">Transport infrastructure</text><text x="18" y="185" class="d">Rail, road, bridge, and river</text><text x="18" y="234" class="t">Local intelligence</text><text x="18" y="262" class="d">Communities and partner officials</text><text x="18" y="311" class="t">Route home retained</text></g>
  <path class="line" d="M620 330 H700"/>
  <g transform="translate(700 160)"><rect class="g" width="250" height="340" rx="10"/><text x="18" y="35" class="tag">LIMITED OPERATION</text><text x="18" y="82" class="t">Partner army</text><text x="18" y="110" class="d">Territory and local government</text><text x="18" y="159" class="t">Mobile reserve</text><text x="18" y="187" class="d">Relief and route recovery</text><text x="18" y="236" class="t">Defined objective</text><text x="18" y="264" class="d">Relieve, reopen, evacuate,</text><text x="18" y="288" class="d">or defend one bounded position</text></g>
  <path class="dash" d="M950 330 H1015"/>
  <g transform="translate(1015 235)"><rect class="r" width="135" height="190" rx="10"/><text x="67" y="36" text-anchor="middle" class="tag">STOP</text><text x="67" y="78" text-anchor="middle" class="t">Last</text><text x="67" y="103" text-anchor="middle" class="t">defensible</text><text x="67" y="128" text-anchor="middle" class="t">railway</text><text x="67" y="160" text-anchor="middle" class="d">No pursuit</text></g>
  <text x="50" y="625" class="s">Later applications included the Gulf, Kuwait, African emergencies, island defense, and the Falklands.</text>
</svg>
