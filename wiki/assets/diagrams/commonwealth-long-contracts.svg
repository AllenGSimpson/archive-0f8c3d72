<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Commonwealth long contracts</title><desc id="desc">Reciprocal supply and purchasing commitments are connected by planning, shipping, finance, standards, and arbitration.</desc><rect width="1200" height="675" fill="#111615"/><rect x="34" y="34" width="1132" height="607" rx="16" fill="#1b211f" stroke="#b9a469" stroke-width="2"/><text x="72" y="86" fill="#eee8d6" font-family="Georgia,serif" font-size="32" font-weight="700">COMMONWEALTH LONG CONTRACTS</text><text x="72" y="119" fill="#b9a469" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">CONTRACTS, NOT COMMANDS</text><line x1="72" y1="142" x2="1128" y2="142" stroke="#5a635f"/><g font-family="Arial,sans-serif"><rect x="72" y="188" width="358" height="316" rx="12" fill="#22322d" stroke="#638779"/><text x="251" y="229" fill="#f2eddd" font-size="23" font-weight="700" text-anchor="middle">COMMONWEALTH SUPPLY</text><g fill="#ced7d1" font-size="17"><text x="103" y="270">• grain, meat and dairy</text><text x="103" y="303">• oil, gold and minerals</text><text x="103" y="336">• engines and electronics</text><text x="103" y="369">• vehicles and aircraft work</text><text x="103" y="402">• ship and port repair</text><text x="103" y="435">• regional production</text><text x="103" y="468">• route access and support</text></g><rect x="770" y="188" width="358" height="316" rx="12" fill="#2d3025" stroke="#9b8c57"/><text x="949" y="229" fill="#f2eddd" font-size="23" font-weight="700" text-anchor="middle">BRITISH SUPPLY</text><g fill="#d9d6ca" font-size="17"><text x="801" y="270">• machinery and ships</text><text x="801" y="303">• electrical equipment</text><text x="801" y="336">• radar and telecommunications</text><text x="801" y="369">• pharmaceuticals</text><text x="801" y="402">• aircraft engines</text><text x="801" y="435">• financial services</text><text x="801" y="468">• military designs</text></g><path d="M430 258H770" stroke="#b9a469" stroke-width="5"/><path d="M747 245l23 13-23 13" fill="none" stroke="#b9a469" stroke-width="5"/><path d="M770 426H430" stroke="#7ba08d" stroke-width="5"/><path d="M453 413l-23 13 23 13" fill="none" stroke="#7ba08d" stroke-width="5"/><rect x="475" y="292" width="250" height="101" rx="11" fill="#181d1b" stroke="#b9a469"/><text x="600" y="325" fill="#f2eddd" font-size="18" font-weight="700" text-anchor="middle">COMMON RECORD</text><text x="600" y="353" fill="#c6cec8" font-size="14" text-anchor="middle">shipping · credit · standards</text><text x="600" y="375" fill="#c6cec8" font-size="14" text-anchor="middle">delivery · reserves · arbitration</text><rect x="235" y="548" width="730" height="48" rx="24" fill="#b9a469"/><text x="600" y="578" fill="#111615" font-size="18" font-weight="700" text-anchor="middle">SOVEREIGN GOVERNMENTS · RECIPROCAL CAPACITY</text></g></svg>
