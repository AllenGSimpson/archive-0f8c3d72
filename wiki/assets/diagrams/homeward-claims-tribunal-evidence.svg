<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Homeward Claims Tribunal evidence</title><desc id="desc">Several types of official and corroborating evidence converge on a tribunal decision and administrative remedies.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="33" font-weight="700">Homeward Claims Tribunal</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">The damaged official file tested against converging human and material evidence</text><g fill="#19303d" stroke="#638091"><rect x="70" y="178" width="225" height="82" rx="11"/><rect x="70" y="282" width="225" height="82" rx="11"/><rect x="70" y="386" width="225" height="82" rx="11"/><rect x="905" y="178" width="225" height="82" rx="11"/><rect x="905" y="282" width="225" height="82" rx="11"/><rect x="905" y="386" width="225" height="82" rx="11"/></g><g fill="#d8ca91" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700"><text x="182" y="213">SERVICE FILES</text><text x="182" y="317">CLAIMANT TESTIMONY</text><text x="182" y="421">FELLOW PRISONERS</text><text x="1017" y="213">CAMP &amp; TRANSPORT</text><text x="1017" y="317">MEDICAL FINDINGS</text><text x="1017" y="421">LETTERS · PAY · WORK</text></g><g fill="#aebbc2" text-anchor="middle" font-family="Arial,sans-serif" font-size="11"><text x="182" y="238">unit · dates · status</text><text x="182" y="342">chronology · coercion · injury</text><text x="182" y="446">witness · corroboration</text><text x="1017" y="238">lists · transfers · neutral records</text><text x="1017" y="342">service connection · disability</text><text x="1017" y="446">family · arrears · placement</text></g><rect x="405" y="235" width="390" height="170" rx="17" fill="#293846" stroke="#d1b86d" stroke-width="2"/><text x="600" y="280" fill="#f0e8d5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">INDEPENDENT TRIBUNAL</text><text x="600" y="317" fill="#d6c586" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700">reconstruct · compare · reason</text><text x="600" y="352" fill="#b8c4ca" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">absence from one file is not conclusive</text><path d="M295 219L405 276M295 323H405M295 427L405 364M905 219L795 276M905 323H795M905 427L795 364" fill="none" stroke="#b49a5a" stroke-width="2"/><path d="M600 405V474" stroke="#b49a5a" stroke-width="3"/><rect x="250" y="474" width="700" height="92" rx="14" fill="#20333f" stroke="#587382"/><text x="600" y="510" fill="#dce2e4" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700">FINDING &amp; ADMINISTRATIVE REMEDY</text><text x="600" y="540" fill="#aebbc2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">status correction · arrears · compensation · dependant rights · treatment · training · priority</text><text x="600" y="615" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">The Tribunal establishes entitlement; the responsible department supplies the pension, treatment, job, or payment.</text></svg>
