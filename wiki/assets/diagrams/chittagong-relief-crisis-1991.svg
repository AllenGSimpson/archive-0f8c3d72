<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The 1991 Chittagong relief crisis</title>
  <desc id="desc">A split-flow diagram showing civilian requests for military relief assets, the expected Congress attack, retained assets at the Patna front, and worsened relief despite no invasion.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d28"/><stop offset="1" stop-color="#222635"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c9af71"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="56" y="68" fill="#f4eddc" font-family="Georgia,serif" font-size="33">THE CHITTAGONG RELIEF CRISIS · 1991</text><text x="56" y="104" fill="#9cacbc" font-family="Arial,sans-serif" font-size="17">A false alarm produced by a real precedent</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="174" width="300" height="180" rx="18" fill="#244b5f" stroke="#64a7bc"/><text x="95" y="216" fill="#fff" font-size="23" font-weight="700">CYCLONE APPROACHES</text><text x="95" y="253" fill="#d9eaf0" font-size="17">Chittagong · offshore islands</text><text x="95" y="282" fill="#d9eaf0" font-size="17">Ports · coastal installations</text><text x="95" y="320" fill="#fff" font-size="18">Civil authorities request aid</text>
    <rect x="450" y="145" width="300" height="235" rx="18" fill="#4a3d2d" stroke="#c9af71"/><text x="475" y="187" fill="#fff" font-size="23" font-weight="700">MILITARY DECISION</text><text x="475" y="224" fill="#eee2c7" font-size="17">1970 precedent remembered</text><text x="475" y="253" fill="#eee2c7" font-size="17">Congress intentions uncertain</text><path d="M475 275H725" stroke="#77684b"/><text x="475" y="306" fill="#fff" font-size="18">Hold major assets west:</text><text x="475" y="335" fill="#eee2c7" font-size="16">aircraft · engineers · trucks</text><text x="475" y="361" fill="#eee2c7" font-size="16">medicine · signals · troops</text>
    <rect x="830" y="174" width="300" height="180" rx="18" fill="#4c3036" stroke="#c66b73"/><text x="855" y="216" fill="#fff" font-size="23" font-weight="700">PATNA FRONT</text><text x="855" y="253" fill="#efdadd" font-size="17">Divisions remain in place</text><text x="855" y="282" fill="#efdadd" font-size="17">Aircraft held for reinforcement</text><text x="855" y="320" fill="#fff" font-size="18">No Congress invasion comes</text>
    <path d="M370 264H436" stroke="#c9af71" stroke-width="6" marker-end="url(#arrow)"/><path d="M750 264H816" stroke="#c9af71" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M600 395V474" stroke="#c9af71" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="295" y="488" width="610" height="142" rx="18" fill="#313444" stroke="#9996b4"/><text x="600" y="532" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">RELIEF CAPACITY REMAINS UNUSED</text><text x="600" y="570" text-anchor="middle" fill="#e3e1ee" font-size="18">Roads and embankments wait · survivors wait · legitimacy erodes</text><text x="600" y="603" text-anchor="middle" fill="#f0cf83" font-family="Georgia,serif" font-size="21">Congress need not attack; the memory of 1970 is enough.</text>
  </g>
  <text x="600" y="682" text-anchor="middle" fill="#8091a2" font-family="Arial,sans-serif" font-size="15">Conceptual archive reconstruction · exact units, casualty totals, and inquiry settlement remain open</text>
</svg>
