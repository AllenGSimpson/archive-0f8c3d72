<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">American presence at the Orbitaler Raumhafen</title><desc id="d">A timeline moves from refusal in the 1980s to limited presence in the 1990s and commercial service by 2000.</desc><rect width="1200" height="675" fill="#101820"/><text x="60" y="67" fill="#f4ecdc" font-family="Georgia,serif" font-size="34">American presence at the Raumhafen</text><text x="60" y="102" fill="#aeb9c7" font-family="Arial,sans-serif" font-size="18">Access expands; sovereign transport remains at Columbia</text><path d="M145 328 H1055" stroke="#7ca5c7" stroke-width="6"/><g fill="#7ca5c7"><circle cx="195" cy="328" r="15"/><circle cx="600" cy="328" r="15"/><circle cx="1005" cy="328" r="15"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#22303d" stroke="#6f95b5" stroke-width="3"><rect x="75" y="165" width="240" height="125" rx="12"/><rect x="480" y="365" width="240" height="125" rx="12"/><rect x="885" y="165" width="240" height="125" rx="12"/></g><g fill="#f4ecdc" font-size="22"><text x="195" y="208">1980s</text><text x="600" y="407">1990s</text><text x="1005" y="208">By 2000</text></g><g fill="#aeb9c7" font-size="15"><text x="195" y="241">no permanent module</text><text x="195" y="266">Columbia answers Germany</text><text x="600" y="440">limited national presence</text><text x="600" y="465">identity and date open</text><text x="1005" y="241">commercial cargo slots</text><text x="1005" y="266">Frontier beyond U.S. sphere</text></g></g><g font-family="Arial,sans-serif"><rect x="355" y="548" width="490" height="70" rx="12" fill="#3b2924" stroke="#cf986e" stroke-width="3"/><text x="600" y="576" text-anchor="middle" fill="#f4ecdc" font-size="18">Commercial optimization ≠ strategic dependence</text><text x="600" y="601" text-anchor="middle" fill="#d9b9a1" font-size="14">American and German sovereign lift remain available</text></g></svg>
