<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Italian infantry weapons and Latin standards, 1947–1982</title>
  <desc id="desc">A two-lane timeline showing Italian rifle and machine-gun adoption alongside the 7 millimeter, 5.6 millimeter, and Guida Comune Latin standards.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111813"/><stop offset="1" stop-color="#25291f"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".42"/></filter><style>.k{font:700 18px Arial,sans-serif;letter-spacing:5px;fill:#c9aa62}.t{font:700 47px Georgia,serif;fill:#f3efe5}.s{font:18px Arial,sans-serif;fill:#b8bbb0}.lane{font:700 17px Arial,sans-serif;letter-spacing:3px;fill:#d6c895}.y{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#ead9a9}.n{font:700 23px Georgia,serif;fill:#fff}.d{font:15px Arial,sans-serif;fill:#d9ddd3}.q{font:14px Arial,sans-serif;fill:#aeb4aa}.axis{stroke:#9a8653;stroke-width:4}.tick{stroke:#c9a85a;stroke-width:3}.line{stroke:#687367;stroke-width:3;fill:none}.box{stroke:#727b6e;stroke-width:2}.foot{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#d6c895}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 0h54v900H0z" fill="#315843"/><path d="M54 0h24v900H54z" fill="#ece6d5"/><path d="M78 0h24v900H78z" fill="#813d3d"/>
  <text x="145" y="82" class="k">ITALIAN SMALL ARMS · LATIN COMMON STANDARDS</text><text x="145" y="145" class="t">From national rifle stock to common interfaces</text><text x="145" y="182" class="s">The bloc standardizes cartridges and mounting surfaces while national industries keep their own weapons.</text>
  <text x="145" y="260" class="lane">ITALIAN SERVICE WEAPONS</text><line x1="145" y1="305" x2="1490" y2="305" class="axis"/>
  <g class="tick"><line x1="235" y1="291" x2="235" y2="319"/><line x1="500" y1="291" x2="500" y2="319"/><line x1="765" y1="291" x2="765" y2="319"/><line x1="1030" y1="291" x2="1030" y2="319"/><line x1="1365" y1="291" x2="1365" y2="319"/></g>
  <g filter="url(#sh)"><rect x="145" y="335" width="220" height="120" rx="9" fill="#4b5c4d" class="box"/><text x="168" y="368" class="y">1947</text><text x="168" y="403" class="n">Fucile Mod. 47</text><text x="168" y="433" class="d">7.35 mm · semiautomatic</text><rect x="385" y="335" width="225" height="120" rx="9" fill="#4d604d" class="box"/><text x="408" y="368" class="y">1958</text><text x="408" y="403" class="n">Fucile Aut. 58</text><text x="408" y="433" class="d">7 mm LC · selective fire</text><rect x="630" y="335" width="225" height="120" rx="9" fill="#4c5a52" class="box"/><text x="653" y="368" class="y">1959</text><text x="653" y="403" class="n">Mitragliatrice 59</text><text x="653" y="433" class="d">7 mm LC · belt-fed GPMG</text><rect x="875" y="335" width="225" height="120" rx="9" fill="#52614d" class="box"/><text x="898" y="368" class="y">1968</text><text x="898" y="403" class="n">Beretta AR-68</text><text x="898" y="433" class="d">5.6 mm LC · standard rifle</text><rect x="1220" y="335" width="270" height="120" rx="9" fill="#5b5846" class="box"/><text x="1243" y="368" class="y">1982</text><text x="1243" y="403" class="n">Beretta AR-82</text><text x="1243" y="433" class="d">5.6 mm LC · modular rifle</text></g>
  <text x="145" y="535" class="lane">COMMON LATIN STANDARDS</text><line x1="145" y1="580" x2="1490" y2="580" class="axis"/>
  <g filter="url(#sh)"><rect x="360" y="610" width="280" height="115" rx="9" fill="#48574a" class="box"/><text x="385" y="645" class="y">1958</text><text x="385" y="681" class="n">7×51 mm LC</text><text x="385" y="708" class="q">Full-power rifle and machine gun</text><rect x="760" y="610" width="280" height="115" rx="9" fill="#4a5d4d" class="box"/><text x="785" y="645" class="y">1968</text><text x="785" y="681" class="n">5.6×45 mm LC</text><text x="785" y="708" class="q">Small-caliber assault rifle</text><rect x="1160" y="610" width="330" height="115" rx="9" fill="#5b5846" class="box"/><text x="1185" y="645" class="y">1979</text><text x="1185" y="681" class="n">Guida Comune 79</text><text x="1185" y="708" class="q">Optical and accessory bar · not Picatinny</text></g>
  <path d="M500 455v125" class="line"/><path d="M765 455v125" class="line"/><path d="M985 455v125" class="line"/><path d="M1365 455v155" class="line"/>
  <text x="145" y="840" class="foot">FRACTURED PEACE ARCHIVE · LAND ARMAMENTS REGISTER</text>
</svg>
