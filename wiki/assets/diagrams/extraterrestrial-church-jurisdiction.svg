<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Catholic jurisdiction beyond Earth around 2000</title>
  <desc id="desc">The Holy See delegates to an Apostolic Administration for Extraterrestrial Missions. Home dioceses, rites, and ordinariates remain connected laterally. The administration serves orbital chaplaincies, a lunar parish, itinerant lunar missions, and Mars missions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f18"/><stop offset="1" stop-color="#18293b"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b18b3a"/><stop offset="1" stop-color="#ead58b"/></linearGradient></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f0f4f6" font-family="Georgia,serif" font-size="31">Catholic jurisdiction follows people, not celestial territory</text>
  <text x="60" y="101" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="17">Personal authority connects home churches to missions whose civil sponsors remain separate</text>
  <g font-family="Arial,sans-serif">
    <rect x="395" y="135" width="410" height="88" rx="17" fill="#3c3424" stroke="#e1c875" stroke-width="3"/>
    <text x="600" y="171" text-anchor="middle" fill="#fff4ca" font-size="20" font-weight="700">Holy See</text><text x="600" y="198" text-anchor="middle" fill="#d4c698" font-size="15">Universal law · papal delegation · final communion</text>
    <path d="M600 223v66" stroke="#e1c875" stroke-width="4"/>
    <rect x="310" y="289" width="580" height="108" rx="19" fill="#263e50" stroke="#8fc1d0" stroke-width="3"/>
    <text x="600" y="329" text-anchor="middle" fill="#e9f7fa" font-size="21" font-weight="700">Apostolic Administration for Extraterrestrial Missions</text><text x="600" y="357" text-anchor="middle" fill="#bdd5dd" font-size="15">Personal jurisdiction · faculties · records · chaplaincies · parishes</text><text x="600" y="379" text-anchor="middle" fill="#8eabb6" font-size="13">No civil sovereignty and no territorial claim to Moon, Mars, or orbit</text>
    <rect x="45" y="289" width="220" height="108" rx="18" fill="#202c37" stroke="#697f8f" stroke-width="2"/><text x="155" y="323" text-anchor="middle" fill="#dce6eb" font-size="17" font-weight="700">Home churches</text><text x="155" y="350" text-anchor="middle" fill="#aebdc6" font-size="14">Dioceses · Eastern rites</text><text x="155" y="372" text-anchor="middle" fill="#aebdc6" font-size="14">Orders · ordinariates</text>
    <path d="M265 343h45" stroke="#7fa0b1" stroke-width="3" stroke-dasharray="8 6"/><text x="287" y="331" text-anchor="middle" fill="#8fa6b3" font-size="11">identity</text>
    <path d="M600 397v70M165 467h870" stroke="#7dafbd" stroke-width="3" fill="none"/><path d="M165 467v38M455 467v38M745 467v38M1035 467v38" stroke="#7dafbd" stroke-width="3"/>
    <g transform="translate(55 505)"><rect width="220" height="132" rx="18" fill="#243643" stroke="#7199a9" stroke-width="2"/><text x="110" y="33" text-anchor="middle" fill="#e1edf1" font-size="17" font-weight="700">Orbital chaplaincies</text><text x="110" y="60" text-anchor="middle" fill="#afc3cc" font-size="14">Rotating clergy</text><text x="110" y="82" text-anchor="middle" fill="#afc3cc" font-size="14">Portable chapels</text><text x="110" y="104" text-anchor="middle" fill="#afc3cc" font-size="14">Five-system stations</text></g>
    <g transform="translate(345 505)"><rect width="220" height="132" rx="18" fill="#463d27" stroke="#dfc778" stroke-width="3"/><text x="110" y="33" text-anchor="middle" fill="#fff3c7" font-size="17" font-weight="700">Our Lady of the Moon</text><text x="110" y="60" text-anchor="middle" fill="#dacb9e" font-size="14">First permanent parish</text><text x="110" y="82" text-anchor="middle" fill="#dacb9e" font-size="14">Resident priest</text><text x="110" y="104" text-anchor="middle" fill="#dacb9e" font-size="14">Stable records</text></g>
    <g transform="translate(635 505)"><rect width="220" height="132" rx="18" fill="#243643" stroke="#7199a9" stroke-width="2"/><text x="110" y="33" text-anchor="middle" fill="#e1edf1" font-size="17" font-weight="700">Lunar missions</text><text x="110" y="60" text-anchor="middle" fill="#afc3cc" font-size="14">Itinerant clergy</text><text x="110" y="82" text-anchor="middle" fill="#afc3cc" font-size="14">Corporate annexes</text><text x="110" y="104" text-anchor="middle" fill="#afc3cc" font-size="14">Family settlements</text></g>
    <g transform="translate(925 505)"><rect width="220" height="132" rx="18" fill="#243643" stroke="#7199a9" stroke-width="2"/><text x="110" y="33" text-anchor="middle" fill="#e1edf1" font-size="17" font-weight="700">Planetary missions</text><text x="110" y="60" text-anchor="middle" fill="#afc3cc" font-size="14">Broad faculties</text><text x="110" y="82" text-anchor="middle" fill="#afc3cc" font-size="14">Mars · Ceres</text><text x="110" y="104" text-anchor="middle" fill="#afc3cc" font-size="14">Delayed oversight</text></g>
  </g>
  <text x="60" y="681" fill="#8197a5" font-family="Arial,sans-serif" font-size="14">Working framework: exact erection date, formal Latin title, first administrator, and later diocesan development remain open.</text>
</svg>
