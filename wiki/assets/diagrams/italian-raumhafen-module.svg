<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Italian scientific module at the Orbitaler Raumhafen</title><desc id="d">The Italian laboratory draws on German harbor services while remaining connected to an independent Latin space program.</desc><rect width="1200" height="675" fill="#12191e"/><text x="60" y="67" fill="#f4ecdc" font-family="Georgia,serif" font-size="34">Italian module · committed 1983</text><text x="60" y="102" fill="#afb9c0" font-family="Arial,sans-serif" font-size="18">Scientific access without strategic merger</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="430" y="210" width="340" height="210" rx="18" fill="#26323a" stroke="#d1c9b8" stroke-width="4"/><rect x="70" y="250" width="250" height="130" rx="12" fill="#3b2525" stroke="#c95b58" stroke-width="3"/><rect x="880" y="250" width="250" height="130" rx="12" fill="#243746" stroke="#6e9bc0" stroke-width="3"/><text x="600" y="258" fill="#f4ecdc" font-size="25">Italian scientific laboratory</text><g fill="#cbd3d7" font-size="16"><text x="600" y="301">solar observation · radiation</text><text x="600" y="330">medicine · materials</text><text x="600" y="372">exact manifest open</text></g><text x="195" y="296" fill="#f4ecdc" font-size="22">German harbor</text><text x="195" y="327" fill="#dca9a4" font-size="15">power · traffic · workshops</text><text x="195" y="351" fill="#dca9a4" font-size="15">emergency authority</text><text x="1005" y="296" fill="#f4ecdc" font-size="22">Latin program</text><text x="1005" y="327" fill="#a9c5dc" font-size="15">San Marco · Concordia</text><text x="1005" y="351" fill="#a9c5dc" font-size="15">Stella Maris · autonomy</text></g><g stroke-width="5" fill="none"><path d="M320 315 H430" stroke="#c95b58"/><path d="M770 315 H880" stroke="#6e9bc0"/></g><g font-family="Arial,sans-serif" fill="#afb9c0" font-size="17"><text x="60" y="570">Internal laboratory administration: Italian</text><text x="60" y="603">Common station operations: German</text><text x="60" y="636">Political result: cooperation with Germany and continued Latin independence</text></g></svg>
