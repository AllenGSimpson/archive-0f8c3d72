<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Domestic communications in 2000</title><desc id="d">Fixed, broadcast, network, mobile, and physical channels converge on the home.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07141b"/><stop offset="1" stop-color="#172b36"/></linearGradient></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eff5f5" font-family="Georgia,serif" font-size="31">Domestic communications in 2000</text><text x="60" y="105" fill="#a4b8bf" font-family="Arial,sans-serif" font-size="17">Several channels coexist; no single pocket device replaces them</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="330" r="125" fill="#25434c" stroke="#75a4af" stroke-width="3"/><text x="600" y="320" fill="#eff6f6" font-size="21" font-weight="700">HOUSEHOLD</text><text x="600" y="352" fill="#c4d5d8" font-size="15">family / work / services</text><g fill="#1b3039" stroke-width="3"><circle cx="170" cy="210" r="85" stroke="#95a96d"/><circle cx="405" cy="510" r="85" stroke="#8c9fb0"/><circle cx="795" cy="510" r="85" stroke="#ae8e70"/><circle cx="1030" cy="210" r="85" stroke="#9c82ad"/><circle cx="600" cy="125" r="74" stroke="#c1a758"/></g><g fill="#edf2ef" font-size="17" font-weight="700"><text x="170" y="205">FIXED</text><text x="170" y="228">telephone / fax</text><text x="405" y="505">PHYSICAL</text><text x="405" y="528">post / parcel</text><text x="795" y="505">CELLULAR</text><text x="795" y="528">portable voice</text><text x="1030" y="205">BROADCAST</text><text x="1030" y="228">radio / television</text><text x="600" y="121">DATA</text><text x="600" y="144">Weltnetz</text></g></g><g stroke="#638690" stroke-width="3"><path d="M250 232l235 68"/><path d="M457 443l75-37"/><path d="M743 443l-75-37"/><path d="M950 232l-235 68"/><path d="M600 199v6"/></g></svg>
