<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Occitan armored lineage, 1948–1980</title>
  <desc id="desc">Timeline of five Occitan tanks from the Char 48 Languedoc to the Char 80 Aigle, with the transition from oscillating to conventional turrets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17120f"/><stop offset="1" stop-color="#28231b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .kicker{font:700 19px Arial,sans-serif;letter-spacing:5px;fill:#f1c854}.title{font:700 49px Georgia,serif;fill:#f4eee1}.sub{font:18px Arial,sans-serif;fill:#c8beb0}.year{font:700 19px Arial,sans-serif;letter-spacing:2px;fill:#ffe08a}.name{font:700 26px Georgia,serif;fill:#fff}.spec{font:17px Arial,sans-serif;fill:#ece5d8}.note{font:15px Arial,sans-serif;fill:#c9bfb0}.axis{stroke:#b38e39;stroke-width:5}.tick{stroke:#f1c854;stroke-width:4}.link{stroke:#8d7650;stroke-width:3;fill:none}.box{stroke:#9e8758;stroke-width:2}.footer{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#e0ca8b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0h76v900H0z" fill="#981f24"/><path d="M26 0h24v900H26z" fill="#f1c232" opacity=".9"/>
  <text x="135" y="82" class="kicker">ATELIERS MÉCANIQUES D’OCCITANIE</text>
  <text x="135" y="145" class="title">From evacuation inheritance to Aigle</text>
  <text x="135" y="182" class="sub">Toulouse Evacuation · national design office · oscillating-turret period · Latin gun standards</text>
  <line x1="180" y1="330" x2="1480" y2="330" class="axis"/>
  <g class="tick"><line x1="240" y1="312" x2="240" y2="348"/><line x1="510" y1="312" x2="510" y2="348"/><line x1="780" y1="312" x2="780" y2="348"/><line x1="1050" y1="312" x2="1050" y2="348"/><line x1="1325" y1="312" x2="1325" y2="348"/></g>
  <g filter="url(#shadow)">
    <rect x="125" y="218" width="230" height="106" rx="9" fill="#61312c" class="box"/><text x="150" y="252" class="year">1948</text><text x="150" y="288" class="name">Char 48 Languedoc</text><text x="150" y="314" class="note">52 t · 90 mm</text>
    <rect x="380" y="370" width="260" height="170" rx="10" fill="#6f3b31" class="box"/><text x="405" y="405" class="year">1953</text><text x="405" y="442" class="name">Char 53 Toulouse</text><text x="405" y="477" class="spec">40 t · 100 mm</text><text x="405" y="505" class="note">12-round autoloader</text>
    <rect x="650" y="218" width="260" height="170" rx="10" fill="#754334" class="box"/><text x="675" y="253" class="year">1955</text><text x="675" y="290" class="name">Char Léger 55</text><text x="675" y="325" class="spec">15 t · 75 mm</text><text x="675" y="353" class="note">12-round autoloader</text>
    <rect x="920" y="370" width="260" height="170" rx="10" fill="#5d4c35" class="box"/><text x="945" y="405" class="year">1965</text><text x="945" y="442" class="name">Char 65 Aquitaine</text><text x="945" y="477" class="spec">38 t · 105 mm</text><text x="945" y="505" class="note">Conventional turret</text>
    <rect x="1190" y="205" width="290" height="195" rx="10" fill="#675637" class="box"/><text x="1215" y="240" class="year">1980</text><text x="1215" y="277" class="name">Char 80 Aigle</text><text x="1215" y="312" class="spec">52 t · 120 mm</text><text x="1215" y="340" class="spec">1,200 hp · 68 km/h</text><text x="1215" y="370" class="note">1980s Latin gun generation</text>
  </g>
  <path d="M355 270 C370 270 365 450 380 450" class="link"/><path d="M640 450 C645 450 645 300 650 300" class="link"/><path d="M910 300 C915 300 915 450 920 450" class="link"/><path d="M1180 450 C1185 450 1185 300 1190 300" class="link"/>
  <g transform="translate(135 625)">
    <rect width="1345" height="150" rx="12" fill="#1d1813" stroke="#786443" stroke-width="2"/>
    <text x="30" y="42" class="kicker">DESIGN SEQUENCE</text>
    <text x="30" y="82" class="spec">Heavy 90 mm first generation → oscillating-turret medium and light vehicles → conventional 105 mm tank → 120 mm Aigle</text>
    <text x="30" y="117" class="note">The registry fixes specifications and turret eras; armor, mechanisms, production totals, units, and combat records remain open.</text>
  </g>
  <text x="135" y="840" class="footer">FRACTURED PEACE ARCHIVE · LAND ARMAMENTS REGISTER</text>
</svg>
