<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">System of princely India</title><desc id="desc">Three levels of princely sovereignty connected through regional systems, the Chamber of Princes, and Hyderabad's material influence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a23"/><stop offset="1" stop-color="#252330"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".3"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cbb16f"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/><text x="55" y="67" fill="#f5eddb" font-family="Georgia,serif" font-size="34">PRINCELY INDIA: A SYSTEM WITHOUT A STATE</text><text x="55" y="103" fill="#9dabb9" font-family="Arial,sans-serif" font-size="17">Recognition, protection, and cooperation preserve separate sovereignties</text>
  <g font-family="Arial,sans-serif" filter="url(#s)">
    <rect x="60" y="150" width="325" height="145" rx="17" fill="#493d2c" stroke="#d1b66d"/><text x="85" y="190" fill="#fff" font-size="23" font-weight="700">SOVEREIGN STATES</text><text x="85" y="225" fill="#eee2c5" font-size="16">Government · army · courts</text><text x="85" y="253" fill="#eee2c5" font-size="16">Treaties · subjecthood · banking</text><text x="85" y="280" fill="#eee2c5" font-size="16">Example: Hyderabad, Rajkot, Gondal</text>
    <rect x="438" y="150" width="325" height="145" rx="17" fill="#284553" stroke="#66a1b2"/><text x="463" y="190" fill="#fff" font-size="23" font-weight="700">ASSOCIATED STATES</text><text x="463" y="225" fill="#d8e9ed" font-size="16">Domestic sovereignty retained</text><text x="463" y="253" fill="#d8e9ed" font-size="16">Protection · heavy arms · access</text><text x="463" y="280" fill="#d8e9ed" font-size="16">Foreign policy partly constrained</text>
    <rect x="816" y="150" width="325" height="145" rx="17" fill="#3b3848" stroke="#9895b3"/><text x="841" y="190" fill="#fff" font-size="23" font-weight="700">ESTATES &amp; CHIEFSHIPS</text><text x="841" y="225" fill="#e4e1ed" font-size="16">Hereditary land · police · courts</text><text x="841" y="253" fill="#e4e1ed" font-size="16">Customary rule · guard forces</text><text x="841" y="280" fill="#e4e1ed" font-size="16">External recognition disputed</text>
  </g>
  <path d="M220 315V382M600 315V382M979 315V382" stroke="#cbb16f" stroke-width="4" marker-end="url(#a)"/>
  <rect x="95" y="400" width="1010" height="116" rx="18" fill="#1b2530" stroke="#cbb16f" stroke-width="2"/><text x="600" y="441" text-anchor="middle" fill="#f4edda" font-family="Georgia,serif" font-size="27">CHAMBER OF PRINCES · NARENDRA MANDAL</text><text x="600" y="477" text-anchor="middle" fill="#bdc8d2" font-family="Arial,sans-serif" font-size="17">Recognition · transit · railways · dynastic disputes · arms standards · emergency consultation</text><text x="600" y="503" text-anchor="middle" fill="#d1b66d" font-family="Arial,sans-serif" font-size="16">No common tax · no federal citizenship · no power to command one army</text>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><rect x="70" y="580" width="185" height="86" rx="13" fill="#2b3440" stroke="#63778a"/><text x="162" y="616" fill="#fff">CENTRAL INDIA</text><text x="162" y="643" fill="#b9c5d0">Gwalior · Indore</text><rect x="285" y="580" width="185" height="86" rx="13" fill="#2b3440" stroke="#63778a"/><text x="377" y="616" fill="#fff">WESTERN STATES</text><text x="377" y="643" fill="#b9c5d0">Gujarat · Kathiawar</text><rect x="500" y="580" width="185" height="86" rx="13" fill="#2b3440" stroke="#63778a"/><text x="592" y="616" fill="#fff">EASTERN BELT</text><text x="592" y="643" fill="#b9c5d0">Orissa · Chhattisgarh</text><rect x="715" y="580" width="185" height="86" rx="13" fill="#2b3440" stroke="#63778a"/><text x="807" y="616" fill="#fff">RAJPUTANA</text><text x="807" y="643" fill="#b9c5d0">Concert of courts</text><rect x="930" y="580" width="185" height="86" rx="13" fill="#4a3a2b" stroke="#cbb16f"/><text x="1022" y="616" fill="#fff">HYDERABAD</text><text x="1022" y="643" fill="#eadbb9">Material patron</text></g>
  <path d="M600 516V559" stroke="#cbb16f" stroke-width="4" marker-end="url(#a)"/><text x="600" y="718" text-anchor="middle" fill="#80909f" font-family="Arial,sans-serif" font-size="15">Regional categories organize diplomacy; they do not dissolve the sovereignty of individual courts.</text>
</svg>
