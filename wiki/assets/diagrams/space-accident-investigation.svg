<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Interjurisdictional space accident investigation</title><desc id="d">Accident response proceeds from rescue through evidence, joint inquiry, legal findings, and correction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131a"/><stop offset="1" stop-color="#15242b"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#70adbc"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">From emergency to corrective action</text><text x="60" y="104" fill="#a3b6bf" font-family="Arial,sans-serif" font-size="17">Technical truth can be shared even when legal blame remains divided</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#193743" stroke="#5d93a4"><rect x="45" y="225" width="190" height="150" rx="15"/><rect x="275" y="225" width="190" height="150" rx="15"/><rect x="505" y="225" width="190" height="150" rx="15"/><rect x="735" y="225" width="190" height="150" rx="15"/><rect x="965" y="225" width="190" height="150" rx="15"/></g><g fill="#e4eff2" font-size="17" font-weight="700"><text x="140" y="268">RESCUE</text><text x="370" y="268">EVIDENCE</text><text x="600" y="268">JOINT INQUIRY</text><text x="830" y="268">LEGAL CASES</text><text x="1060" y="268">CORRECTION</text></g><g fill="#b9ccd3" font-size="14"><text x="140" y="307">stabilize</text><text x="140" y="333">preserve life</text><text x="370" y="307">telemetry</text><text x="370" y="333">custody</text><text x="600" y="307">sequence</text><text x="600" y="333">causes</text><text x="830" y="307">liability</text><text x="830" y="333">discipline</text><text x="1060" y="307">inspection</text><text x="1060" y="333">redesign</text></g></g><g stroke="#70adbc" stroke-width="3" marker-end="url(#a)"><path d="M235 300h25"/><path d="M465 300h25"/><path d="M695 300h25"/><path d="M925 300h25"/></g><text x="600" y="500" fill="#9fb3bc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Registries, operators, manufacturers, insurers, and governments follow different parts of the chain</text></svg>
