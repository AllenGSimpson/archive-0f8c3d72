<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Indian Operations Commission findings</title><desc id="desc">The Army, India Office, Royal Navy, local governors, and Treasury operated under different assumptions, converging on the commission's finding that Cabinet had not defined one Indian commitment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.box{fill:#192e39;stroke:#6b8796;stroke-width:2}.finding{fill:#38272a;stroke:#aa6d70;stroke-width:2}.result{fill:#24362b;stroke:#7e9d79;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 17px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.line{stroke:#cfa655;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Indian Operations Commission, 1952</text><text x="50" y="92" class="s">The failure was not one wrong assumption; it was the absence of a Cabinet decision among incompatible assumptions</text>
  <g transform="translate(45 135)"><rect class="box" width="200" height="110" rx="8"/><text x="18" y="32" class="tag">ARMY</text><text x="18" y="68" class="t">Buying time</text><text x="18" y="92" class="d">for political settlement</text></g>
  <g transform="translate(270 135)"><rect class="box" width="200" height="110" rx="8"/><text x="18" y="32" class="tag">INDIA OFFICE</text><text x="18" y="68" class="t">Federal successor</text><text x="18" y="92" class="d">might still emerge</text></g>
  <g transform="translate(495 135)"><rect class="box" width="200" height="110" rx="8"/><text x="18" y="32" class="tag">ROYAL NAVY</text><text x="18" y="68" class="t">Evacuate and hold</text><text x="18" y="92" class="d">ports and routes</text></g>
  <g transform="translate(720 135)"><rect class="box" width="200" height="110" rx="8"/><text x="18" y="32" class="tag">GOVERNORS</text><text x="18" y="68" class="t">Reinforcements</text><text x="18" y="92" class="d">would arrive later</text></g>
  <g transform="translate(945 135)"><rect class="box" width="200" height="110" rx="8"/><text x="18" y="32" class="tag">TREASURY</text><text x="18" y="68" class="t">Temporary cost</text><text x="18" y="92" class="d">would soon contract</text></g>
  <path class="line" d="M145 245 V310 M370 245 V310 M595 245 V310 M820 245 V310 M1045 245 V310 M145 310 H1045 M595 310 V345"/>
  <g transform="translate(260 345)"><rect class="finding" width="680" height="150" rx="11"/><text x="340" y="35" text-anchor="middle" class="tag">PRINCIPAL FINDING</text><text x="340" y="77" text-anchor="middle" class="t">Cabinet never decided whether Britain was preserving,</text><text x="340" y="104" text-anchor="middle" class="t">evacuating, partitioning, or selectively protecting India.</text><text x="340" y="132" text-anchor="middle" class="d">More force under the same ambiguity would not define victory.</text></g>
  <path class="line" d="M600 495 V535"/><g transform="translate(350 535)"><rect class="result" width="500" height="85" rx="9"/><text x="250" y="30" text-anchor="middle" class="tag">POLICY CONSEQUENCE</text><text x="250" y="59" text-anchor="middle" class="t">Indian Ocean Defence White Paper of 1952</text></g>
</svg>
