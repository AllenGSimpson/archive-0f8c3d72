<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Japanese settlement in Manchukuo</title><desc id="desc">A timeline from postwar expansion through family settlement and the late-1960s moratorium to a permanent Manchurian Japanese population.</desc><rect width="1200" height="675" fill="#111821"/><text x="600" y="58" text-anchor="middle" fill="#f0e4c6" font-family="Georgia,serif" font-size="31">Japanese settlement in Manchukuo, 1947–2000</text><path d="M115 335 H1085" stroke="#dfbd68" stroke-width="8"/><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="170" cy="335" r="18" fill="#dfbd68"/><rect x="55" y="130" width="230" height="145" rx="12" fill="#253d58" stroke="#78a7cf" stroke-width="3"/><text x="170" y="168" fill="#fff" font-size="21" font-weight="700">1947–EARLY 1950s</text><text x="170" y="203" fill="#dceaf5" font-size="17">victory settlement</text><text x="170" y="232" fill="#dceaf5" font-size="17">grants · concessions · land</text><circle cx="445" cy="335" r="18" fill="#dfbd68"/><rect x="330" y="390" width="230" height="145" rx="12" fill="#455535" stroke="#a8c57a" stroke-width="3"/><text x="445" y="429" fill="#fff" font-size="21" font-weight="700">1950s–1960s</text><text x="445" y="464" fill="#e5efd8" font-size="17">family settlement</text><text x="445" y="493" fill="#e5efd8" font-size="17">schools · clinics · towns</text><circle cx="720" cy="335" r="18" fill="#dfbd68"/><rect x="605" y="130" width="230" height="145" rx="12" fill="#73323b" stroke="#df9295" stroke-width="3"/><text x="720" y="168" fill="#fff" font-size="21" font-weight="700">1967–1969</text><text x="720" y="203" fill="#f7dfe0" font-size="17">settlement moratorium</text><text x="720" y="232" fill="#f7dfe0" font-size="17">new mass colonies end</text><circle cx="995" cy="335" r="18" fill="#dfbd68"/><rect x="880" y="390" width="230" height="145" rx="12" fill="#4b3757" stroke="#bb8dcc" stroke-width="3"/><text x="995" y="429" fill="#fff" font-size="21" font-weight="700">1970s–2000</text><text x="995" y="464" fill="#eee0f4" font-size="17">permanent community</text><text x="995" y="493" fill="#eee0f4" font-size="17">Japanese nation · Manchurian home</text><text x="600" y="615" fill="#f0e4c6" font-size="22" font-weight="700">Ending new settlement does not reverse the society already created.</text></g></svg>
