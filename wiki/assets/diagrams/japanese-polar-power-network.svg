<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese north-polar lunar power network</title><desc id="desc">A diagram showing solar arrays on a highly illuminated polar ridge, energy storage and reactor backup, local wired loads, and lossy microwave or laser transmission toward Kaguya Base.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#162432"/></linearGradient><linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59636a"/><stop offset=".55" stop-color="#a3abb0"/><stop offset="1" stop-color="#4c565d"/></linearGradient><style>.title{font:700 46px Arial,sans-serif;fill:#eef4f6}.sub{font:21px Arial,sans-serif;fill:#9db1bb;letter-spacing:2px}.head{font:700 23px Arial,sans-serif;fill:#f4f7f8}.copy{font:18px Arial,sans-serif;fill:#afc2ca}.box{fill:#102530;stroke:#5f8393;stroke-width:3}.power{stroke:#f1ca58;stroke-width:7}.beam{stroke:#70cde6;stroke-width:8;stroke-dasharray:18 15}</style></defs>
  <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1380" cy="130" r="120" fill="#f3d36a" opacity=".92"/><text x="80" y="82" class="title">NORTH-POLAR POWER STATION</text><text x="82" y="123" class="sub">JAPANESE ZAIBATSU LUNAR UTILITY · LATE 1990s</text>
  <path d="M0 680L190 600 360 625 560 410 710 470 850 610 1040 645 1210 590 1400 650 1600 610V900H0Z" fill="url(#ground)"/>
  <g transform="translate(475 370)"><rect x="0" y="0" width="290" height="120" rx="20" class="box"/><text x="145" y="46" text-anchor="middle" class="head">RIDGE POWER CORE</text><text x="145" y="80" text-anchor="middle" class="copy">storage · controls · reactor backup</text></g>
  <g fill="#1a4354" stroke="#87b4c6" stroke-width="3"><path d="M210 535l170-60 40 105-170 60z"/><path d="M820 405l190-35 23 110-190 35z"/></g><g stroke="#91b6c4" stroke-width="2"><path d="M245 523l170 20M282 507l170 20M863 410l160 28M880 450l150 26"/></g>
  <path d="M420 545L500 470M825 460L760 455" class="power"/><text x="285" y="455" class="head">SOLAR FIELDS</text><text x="285" y="480" class="copy">near-continuous, not uninterrupted</text>
  <rect x="130" y="700" width="360" height="110" rx="20" class="box"/><text x="310" y="743" text-anchor="middle" class="head">LOCAL MINES &amp; PROCESSING</text><text x="310" y="777" text-anchor="middle" class="copy">short wired links · reliable regional load</text><path d="M545 490L400 700" class="power"/>
  <rect x="1100" y="625" width="380" height="130" rx="20" class="box"/><text x="1290" y="672" text-anchor="middle" class="head">KAGUYA / DISTANT RECEIVERS</text><text x="1290" y="706" text-anchor="middle" class="copy">microwave or laser transmission</text><text x="1290" y="733" text-anchor="middle" class="copy">useful, but not a Moon-wide grid</text><path d="M760 440L1150 630" class="beam"/>
  <rect x="870" y="200" width="500" height="150" rx="22" fill="#2d2321" stroke="#dc8067" stroke-width="3"/><text x="1120" y="247" text-anchor="middle" class="head">LIMITS</text><text x="1120" y="283" text-anchor="middle" class="copy">terrain · long shadows · dust · receiver losses</text><text x="1120" y="316" text-anchor="middle" class="copy">thermal control · line of sight · customer distance</text>
  <text x="80" y="855" class="copy">Partial failure means failure of universality—not failure of the station itself.</text>
</svg>
