<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Japanese cyberpunk</title><desc id="desc">A person is surrounded by connected corporate, ministry, city, identity, and network systems that work successfully while obscuring authority.</desc><rect width="1200" height="675" fill="#0a1118"/><g stroke="#3dd7d0" stroke-width="3" fill="none" opacity=".8"><path d="M600 337 L180 135 M600 337 L1020 135 M600 337 L150 535 M600 337 L1050 535 M600 337 L600 90"/><circle cx="600" cy="337" r="145"/><circle cx="600" cy="337" r="245" stroke-dasharray="13 10"/></g><g font-family="Consolas,monospace" text-anchor="middle"><text x="600" y="54" fill="#f0dfbc" font-family="Georgia,serif" font-size="31">JAPANESE CYBERPUNK</text><rect x="480" y="265" width="240" height="145" rx="10" fill="#172834" stroke="#f04d72" stroke-width="4"/><text x="600" y="320" fill="#fff" font-size="24" font-weight="700">THE PERSON</text><text x="600" y="357" fill="#f7b4c5" font-size="17">legible · employed · connected</text><text x="600" y="385" fill="#f7b4c5" font-size="17">unable to locate authority</text><g fill="#b8fff7" font-size="20" font-weight="700"><text x="180" y="128">CORPORATION</text><text x="1020" y="128">MINISTRY</text><text x="150" y="560">CITY</text><text x="1050" y="560">IDENTITY SYSTEM</text><text x="600" y="105">WELTNETZ</text></g><text x="600" y="625" fill="#f0dfbc" font-size="21">Everything works. Every exit belongs to the same system.</text></g></svg>
