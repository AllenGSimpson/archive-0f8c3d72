<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Far Eastern aviation production and service system</title><desc id="desc">Japanese high-value systems and Manchukuoan components feed Russian final assembly, maintenance, and a distributed civil aviation network.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:22px Arial,sans-serif;fill:#c9c7bd}.l{font:bold 28px Arial,sans-serif;fill:#fff}.b{stroke:#c7c9c1;stroke-width:2;rx:18}.a{stroke:#efd274;stroke-width:6;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efd274"/></marker></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="60" y="65" class="h">AVIATION AS A DISTRIBUTED IMPERIAL SYSTEM</text><text x="60" y="102" class="s">Dependence in design; competence in operation, adaptation, and repair</text>
  <rect x="65" y="165" width="300" height="160" class="b" fill="#4a3131"/><text x="215" y="214" text-anchor="middle" class="l">JAPAN</text><text x="215" y="254" text-anchor="middle" class="s">Engines · avionics · instruments</text><text x="215" y="286" text-anchor="middle" class="s">alloys · licensed designs</text>
  <rect x="65" y="400" width="300" height="160" class="b" fill="#57462d"/><text x="215" y="449" text-anchor="middle" class="l">MANCHUKUO</text><text x="215" y="489" text-anchor="middle" class="s">Structures · landing gear · tanks</text><text x="215" y="521" text-anchor="middle" class="s">machine tools · airfield vehicles</text>
  <rect x="450" y="280" width="300" height="170" class="b" fill="#304954"/><text x="600" y="329" text-anchor="middle" class="l">RUSSIAN ASSEMBLY</text><text x="600" y="369" text-anchor="middle" class="s">Komsomolsk final assembly</text><text x="600" y="401" text-anchor="middle" class="s">cold-weather adaptation · repair</text><text x="600" y="431" text-anchor="middle" class="s">Khabarovsk training and overhaul</text>
  <rect x="835" y="205" width="300" height="310" class="b" fill="#3b4140"/><text x="985" y="254" text-anchor="middle" class="l">CIVIL NETWORK</text><text x="985" y="301" text-anchor="middle" class="s">Provincial airports</text><text x="985" y="338" text-anchor="middle" class="s">District airfields</text><text x="985" y="375" text-anchor="middle" class="s">Village strips and float bases</text><text x="985" y="412" text-anchor="middle" class="s">Weather · radio · rescue</text><text x="985" y="449" text-anchor="middle" class="s">Mail · medicine · passengers</text><text x="985" y="486" text-anchor="middle" class="s">Survey · emergency supply</text>
  <path d="M365 245l85 80M365 480l85-80M750 365h85" class="a" marker-end="url(#m)"/>
  <text x="600" y="625" text-anchor="middle" class="s">Japan retains the technological ceiling; Far Eastern crews make the system function in the north.</text>
</svg>
