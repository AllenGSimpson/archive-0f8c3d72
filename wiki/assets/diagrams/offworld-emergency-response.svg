<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Off-world emergency response</title><desc id="desc">An emergency response chain from detection through isolation, refuge and triage, rescue or repair, evacuation, and investigation.</desc><rect width="1200" height="610" fill="#11130f"/><text x="60" y="67" fill="#e8e4d8" font-family="Georgia,serif" font-size="32">Off-world emergency response</text><text x="60" y="101" fill="#a6a89d" font-family="Arial,sans-serif" font-size="17">Local survival acts in minutes · external rescue acts in orbital or transport time</text><path d="M135 282H1065" stroke="#596157" stroke-width="5"/><g font-family="Arial,sans-serif"><g transform="translate(35 150)"><rect width="180" height="250" rx="12" fill="#1d201c" stroke="#c7a95b" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">DETECT</text><circle cx="90" cy="128" r="27" fill="#c7a95b"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">alarm · report</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">account for people</text></g><g transform="translate(225 150)"><rect width="180" height="250" rx="12" fill="#1d201c" stroke="#a65348" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">ISOLATE</text><circle cx="90" cy="128" r="27" fill="#a65348"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">hatches · power</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">atmosphere · routes</text></g><g transform="translate(415 150)"><rect width="180" height="250" rx="12" fill="#252923" stroke="#d9bd71" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">REFUGE</text><circle cx="90" cy="128" r="27" fill="#d9bd71"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">triage · reserves</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">stabilize casualties</text></g><g transform="translate(605 150)"><rect width="180" height="250" rx="12" fill="#1d201c" stroke="#789b8b" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">RESPOND</text><circle cx="90" cy="128" r="27" fill="#789b8b"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">repair · tow · intercept</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">local or external aid</text></g><g transform="translate(795 150)"><rect width="180" height="250" rx="12" fill="#1d201c" stroke="#8d7352" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">EVACUATE</text><circle cx="90" cy="128" r="27" fill="#8d7352"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">only when safer</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">than shelter in place</text></g><g transform="translate(985 150)"><rect width="180" height="250" rx="12" fill="#1d201c" stroke="#6f7d73" stroke-width="3"/><text x="90" y="48" text-anchor="middle" fill="#e8e4d8" font-size="18" font-weight="700">REVIEW</text><circle cx="90" cy="128" r="27" fill="#6f7d73"/><text x="90" y="188" text-anchor="middle" fill="#e8e4d8" font-size="14">preserve evidence</text><text x="90" y="211" text-anchor="middle" fill="#a6a89d" font-size="14">restore ordinary law</text></g></g><rect x="150" y="465" width="900" height="80" rx="10" fill="#1d201c" stroke="#3b4038"/><text x="600" y="497" text-anchor="middle" fill="#e8e4d8" font-family="Arial,sans-serif" font-size="17" font-weight="700">Authority follows the immediate hazard</text><text x="600" y="525" text-anchor="middle" fill="#a6a89d" font-family="Arial,sans-serif" font-size="15">Private ownership and ordinary jurisdiction resume after the surviving system is secure</text></svg>
