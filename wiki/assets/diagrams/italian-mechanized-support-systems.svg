<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Italian mechanized and support systems, 1958–1983</title>
  <desc id="desc">A timeline showing the VCC-58 infantry carrier, VCC-72 Dardo infantry fighting vehicle, SIDAM-76 air-defense vehicle, Palmaria self-propelled howitzer, and Autoblindo 79 Centauro cavalry gun vehicle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111813"/><stop offset="1" stop-color="#24291f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".42"/></filter>
    <style>.k{font:700 18px Arial,sans-serif;letter-spacing:5px;fill:#c9aa62}.t{font:700 48px Georgia,serif;fill:#f3efe5}.s{font:18px Arial,sans-serif;fill:#b8bbb0}.y{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#ead9a9}.n{font:700 25px Georgia,serif;fill:#fff}.d{font:16px Arial,sans-serif;fill:#d9ddd3}.q{font:15px Arial,sans-serif;fill:#aeb4aa}.axis{stroke:#9a8653;stroke-width:5}.tick{stroke:#c9a85a;stroke-width:4}.line{stroke:#667265;stroke-width:3;fill:none}.box{stroke:#727b6e;stroke-width:2}.foot{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#d6c895}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 0h54v900H0z" fill="#315843"/><path d="M54 0h24v900H54z" fill="#ece6d5"/><path d="M78 0h24v900H78z" fill="#813d3d"/>
  <text x="145" y="82" class="k">ITALIAN COMBINED-ARMS EQUIPMENT</text><text x="145" y="146" class="t">Mechanized and support systems</text><text x="145" y="183" class="s">Infantry lift · fighting vehicles · mobile air defense · divisional artillery · wheeled cavalry</text>
  <line x1="190" y1="338" x2="1470" y2="338" class="axis"/>
  <g class="tick"><line x1="240" y1="320" x2="240" y2="356"/><line x1="520" y1="320" x2="520" y2="356"/><line x1="800" y1="320" x2="800" y2="356"/><line x1="1080" y1="320" x2="1080" y2="356"/><line x1="1360" y1="320" x2="1360" y2="356"/></g>
  <g filter="url(#shadow)">
    <rect x="140" y="215" width="245" height="115" rx="10" fill="#4b5c4d" class="box"/><text x="165" y="250" class="y">1958</text><text x="165" y="287" class="n">VCC-58</text><text x="165" y="315" class="d">3 + 8 · 20 mm carrier</text>
    <rect x="400" y="375" width="250" height="145" rx="10" fill="#50614e" class="box"/><text x="425" y="410" class="y">1972</text><text x="425" y="447" class="n">VCC-72 Dardo</text><text x="425" y="480" class="d">3 + 7 · 25 mm + ATGM</text><text x="425" y="505" class="q">Infantry fighting vehicle</text>
    <rect x="675" y="205" width="250" height="145" rx="10" fill="#4b5951" class="box"/><text x="700" y="240" class="y">1976</text><text x="700" y="277" class="n">SIDAM-76</text><text x="700" y="310" class="d">3 · four 25 mm cannon</text><text x="700" y="335" class="q">Radar-linked air defense</text>
    <rect x="950" y="375" width="260" height="145" rx="10" fill="#5b5846" class="box"/><text x="975" y="410" class="y">1980</text><text x="975" y="447" class="n">Palmaria</text><text x="975" y="480" class="d">5 · 155 mm L/39</text><text x="975" y="505" class="q">Divisional self-propelled artillery</text>
    <rect x="1230" y="195" width="265" height="165" rx="10" fill="#555d4c" class="box"/><text x="1255" y="230" class="y">1983</text><text x="1255" y="267" class="n">Centauro</text><text x="1255" y="300" class="d">4 · 105 mm low-recoil</text><text x="1255" y="327" class="q">Wheeled cavalry gun vehicle</text>
  </g>
  <path d="M385 272 C398 272 392 445 400 445" class="line"/><path d="M650 445 C662 445 665 276 675 276" class="line"/><path d="M925 276 C938 276 940 445 950 445" class="line"/><path d="M1210 445 C1220 445 1218 276 1230 276" class="line"/>
  <g transform="translate(145 625)"><rect width="1350" height="150" rx="12" fill="#171d19" stroke="#4f594f" stroke-width="2"/><text x="30" y="42" class="k">FUNCTIONAL FAMILY, NOT ONE CHASSIS</text><text x="30" y="82" class="d">The registry fixes five accepted systems and their battlefield roles; it does not establish a common hull or universal production line.</text><text x="30" y="116" class="q">“Centauro-type,” “Palmaria-type,” and “SIDAM-type” are retired comparison labels. The formal names shown here control.</text></g>
  <text x="145" y="840" class="foot">FRACTURED PEACE ARCHIVE · LAND ARMAMENTS REGISTER</text>
</svg>
