<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Development of the Japanese-Peruvian bridgehead</title><desc id="desc">Timeline from commercial and naval cultivation through the permanent Samanco-Chimbote complex, 1981 crisis, and late-1990s American commercial challenge.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:21px Arial,sans-serif;fill:#d1d0c7}.y{font:bold 25px Arial,sans-serif;fill:#fff}.b{stroke:#c5c8c0;stroke-width:2;rx:18}.a{fill:none;stroke:#efd274;stroke-width:6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efd274"/></marker></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">THE PERUVIAN BRIDGEHEAD</text><text x="58" y="103" class="s">Incremental access becomes a test of the Monroe system</text><path d="M120 350H1090" class="a" marker-end="url(#m)"/>
  <g transform="translate(45 165)"><rect width="250" height="250" class="b" fill="#2e454d"/><text x="125" y="56" text-anchor="middle" class="y">1969-1972</text><text x="125" y="103" text-anchor="middle" class="s">Commercial opening</text><text x="125" y="151" text-anchor="middle" class="s">Arms - fisheries</text><text x="125" y="183" text-anchor="middle" class="s">ports - training</text><text x="125" y="215" text-anchor="middle" class="s">weather - repair</text></g>
  <g transform="translate(325 375)"><rect width="250" height="250" class="b" fill="#384b43"/><text x="125" y="56" text-anchor="middle" class="y">1973-1980</text><text x="125" y="103" text-anchor="middle" class="s">Dual complex</text><text x="125" y="151" text-anchor="middle" class="s">Chimbote commerce</text><text x="125" y="183" text-anchor="middle" class="s">Samanco access</text><text x="125" y="215" text-anchor="middle" class="s">Peruvian sovereignty</text></g>
  <g transform="translate(605 165)"><rect width="250" height="250" class="b" fill="#58402f"/><text x="125" y="56" text-anchor="middle" class="y">1981</text><text x="125" y="103" text-anchor="middle" class="s">Samanco Crisis</text><text x="125" y="151" text-anchor="middle" class="s">Runway - submarine</text><text x="125" y="183" text-anchor="middle" class="s">missiles - signals</text><text x="125" y="215" text-anchor="middle" class="s">interim restraint</text></g>
  <g transform="translate(885 375)"><rect width="250" height="250" class="b" fill="#4d3547"/><text x="125" y="56" text-anchor="middle" class="y">1998-1999</text><text x="125" y="103" text-anchor="middle" class="s">American opening</text><text x="125" y="151" text-anchor="middle" class="s">Lima Compact</text><text x="125" y="183" text-anchor="middle" class="s">customs confrontation</text><text x="125" y="215" text-anchor="middle" class="s">revised access</text></g>
</svg>
