<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Cycle of Burmese wars and settlements</title><desc id="desc">Sequence from the Companion War through the Thai protectorate, with later dates deliberately open.</desc><rect width="1200" height="700" rx="32" fill="#10171d"/><text x="60" y="68" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">The Burmese war–settlement cycle</text><text x="60" y="106" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">Founding dates fixed · later war dates remain working chronology</text><g font-family="Arial,sans-serif"><path d="M120 340H1080" stroke="#52626b" stroke-width="8"/><g><circle cx="150" cy="340" r="48" fill="#3c3322" stroke="#d3aa52"/><text x="150" y="332" text-anchor="middle" fill="#fff" font-size="16">1948–53</text><text x="150" y="355" text-anchor="middle" fill="#fff" font-size="14">WAR</text><text x="150" y="425" text-anchor="middle" fill="#f1c86f" font-size="17" font-weight="700">Companion War</text></g><g><circle cx="340" cy="340" r="48" fill="#173d4a" stroke="#66b4c3"/><text x="340" y="332" text-anchor="middle" fill="#fff" font-size="16">1952–53</text><text x="340" y="355" text-anchor="middle" fill="#fff" font-size="14">PACT</text><text x="340" y="425" text-anchor="middle" fill="#9de0ea" font-size="17" font-weight="700">Rangoon Settlement</text></g><g><circle cx="530" cy="340" r="48" fill="#3c3322" stroke="#d3aa52"/><text x="530" y="332" text-anchor="middle" fill="#fff" font-size="16">1954–56</text><text x="530" y="355" text-anchor="middle" fill="#fff" font-size="14">CRISIS</text><text x="530" y="425" text-anchor="middle" fill="#f1c86f" font-size="17" font-weight="700">Federal Crisis</text></g><g><circle cx="720" cy="340" r="48" fill="#3b2530" stroke="#c87e9d"/><text x="720" y="332" text-anchor="middle" fill="#fff" font-size="14">LATER</text><text x="720" y="355" text-anchor="middle" fill="#fff" font-size="14">1960s</text><text x="720" y="425" text-anchor="middle" fill="#eea8c2" font-size="17" font-weight="700">Second War</text></g><g><circle cx="910" cy="340" r="48" fill="#272b3c" stroke="#8c92c7"/><text x="910" y="332" text-anchor="middle" fill="#fff" font-size="14">DATES</text><text x="910" y="355" text-anchor="middle" fill="#fff" font-size="14">OPEN</text><text x="910" y="425" text-anchor="middle" fill="#c9cdf5" font-size="17" font-weight="700">Sovereign States</text></g><g><circle cx="1080" cy="340" r="48" fill="#19372b" stroke="#6ab58a"/><text x="1080" y="332" text-anchor="middle" fill="#fff" font-size="14">MID-</text><text x="1080" y="355" text-anchor="middle" fill="#fff" font-size="14">1990s</text><text x="1080" y="425" text-anchor="middle" fill="#91dbad" font-size="17" font-weight="700">Thai Protectorate</text></g></g><path d="M915 500C915 620 600 620 600 500" fill="none" stroke="#c87e9d" stroke-width="4" stroke-dasharray="10 9"/><text x="755" y="595" text-anchor="middle" fill="#eea8c2" font-family="Arial,sans-serif" font-size="17">War of the Burmese States forces a common framework back into existence</text><text x="60" y="660" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Working later chronology · exact treaties, leaders, and campaign dates remain open</text></svg>
