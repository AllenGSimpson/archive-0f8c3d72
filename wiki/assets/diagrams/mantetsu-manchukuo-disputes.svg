<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Mantetsu–Manchukuo dispute cycle</title><desc id="desc">A national reform is followed by narrow corporate compliance, technical pressure in Tokyo, visible Manchukuoan escalation, and an unequal compromise.</desc><rect width="1200" height="675" fill="#111720"/><text x="600" y="52" text-anchor="middle" fill="#f0e5c7" font-family="Georgia,serif" font-size="31">The Mantetsu–Manchukuo dispute cycle</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="115" width="280" height="115" rx="12" fill="#4c5936" stroke="#aac678" stroke-width="3"/><text x="210" y="154" fill="#fff" font-size="21" font-weight="700">1 · NATIONAL DEMAND</text><text x="210" y="187" fill="#e3efd5" font-size="16">tax · police · promotion</text><text x="210" y="211" fill="#e3efd5" font-size="16">land · records · utilities</text><rect x="460" y="115" width="280" height="115" rx="12" fill="#243b56" stroke="#75a5ce" stroke-width="3"/><text x="600" y="154" fill="#fff" font-size="21" font-weight="700">2 · NARROW COMPLIANCE</text><text x="600" y="187" fill="#dceaf5" font-size="16">follow the text</text><text x="600" y="211" fill="#dceaf5" font-size="16">move authority elsewhere</text><rect x="850" y="115" width="280" height="115" rx="12" fill="#51405b" stroke="#bc91cc" stroke-width="3"/><text x="990" y="154" fill="#fff" font-size="21" font-weight="700">3 · TOKYO BRIEFING</text><text x="990" y="187" fill="#eee0f3" font-size="16">continuity · readiness</text><text x="990" y="211" fill="#eee0f3" font-size="16">credit · standards · precedent</text><rect x="240" y="385" width="310" height="115" rx="12" fill="#7a3039" stroke="#df8e91" stroke-width="3"/><text x="395" y="424" fill="#fff" font-size="21" font-weight="700">5 · UNEQUAL COMPROMISE</text><text x="395" y="457" fill="#f8dfe0" font-size="16">some jurisdiction conceded</text><text x="395" y="481" fill="#f8dfe0" font-size="16">strategic control retained</text><rect x="650" y="385" width="310" height="115" rx="12" fill="#6b5028" stroke="#e0bd68" stroke-width="3"/><text x="805" y="424" fill="#fff" font-size="21" font-weight="700">4 · VISIBLE ESCALATION</text><text x="805" y="457" fill="#f5e7c1" font-size="16">license · arrest · seizure</text><text x="805" y="481" fill="#f5e7c1" font-size="16">emergency decree</text><g stroke="#d7b765" stroke-width="6" fill="none" marker-end="url(#b)"><path d="M350 172 H450"/><path d="M740 172 H840"/><path d="M990 230 C990 305 900 340 830 380"/><path d="M650 442 H560"/><path d="M395 385 C310 320 230 300 210 240"/></g><text x="600" y="600" fill="#f0e5c7" font-size="22" font-weight="700">Mantetsu stops at Tokyo's red line and waits for Manchukuo to cross it.</text></g><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d7b765"/></marker></defs></svg>
