<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The fifteen Southern Archipelago states</title><desc id="desc">Schematic grouping of the successor states of the former Dutch East Indies by island region.</desc>
  <rect width="1200" height="720" rx="34" fill="#10171d"/><text x="60" y="72" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">The Southern Archipelago state system</text><text x="60" y="110" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">Fifteen sovereign states · common machinery without political federation</text>
  <g font-family="Arial,sans-serif"><g transform="translate(55 155)"><rect width="250" height="220" rx="18" fill="#173d4a" stroke="#66b4c3"/><text x="22" y="38" fill="#9de0ea" font-size="24" font-weight="700">JAVA · 3</text><text x="22" y="78" fill="#fff" font-size="19">Sunda</text><text x="22" y="112" fill="#fff" font-size="19">Mataram</text><text x="22" y="146" fill="#fff" font-size="19">East Java and Madura</text><text x="22" y="194" fill="#a8bbc4" font-size="15">Population and institutions divided</text></g>
  <g transform="translate(330 155)"><rect width="250" height="220" rx="18" fill="#3c3322" stroke="#d3aa52"/><text x="22" y="38" fill="#f1c86f" font-size="24" font-weight="700">SUMATRA · 4</text><text x="22" y="78" fill="#fff" font-size="19">Aceh</text><text x="22" y="112" fill="#fff" font-size="19">Tapanuli</text><text x="22" y="146" fill="#fff" font-size="19">Minangkabau</text><text x="22" y="180" fill="#fff" font-size="19">Sumatran Malay Federation</text></g>
  <g transform="translate(605 155)"><rect width="250" height="220" rx="18" fill="#19372b" stroke="#6ab58a"/><text x="22" y="38" fill="#91dbad" font-size="24" font-weight="700">BORNEO · 2</text><text x="22" y="82" fill="#fff" font-size="19">Bornean State</text><text x="22" y="118" fill="#fff" font-size="19">Kalimantan Federation</text><text x="22" y="166" fill="#a8bbc4" font-size="15">Bornean Malaya replaced</text><text x="22" y="190" fill="#a8bbc4" font-size="15">after the 1970s war</text></g>
  <g transform="translate(880 155)"><rect width="265" height="220" rx="18" fill="#3b2530" stroke="#c87e9d"/><text x="22" y="38" fill="#eea8c2" font-size="24" font-weight="700">SULAWESI · 2</text><text x="22" y="82" fill="#fff" font-size="19">South Sulawesi</text><text x="22" y="118" fill="#fff" font-size="19">North Sulawesi</text><text x="22" y="166" fill="#a8bbc4" font-size="15">Maritime south</text><text x="22" y="190" fill="#a8bbc4" font-size="15">Naval frontier north</text></g></g>
  <g transform="translate(55 410)" font-family="Arial,sans-serif"><rect width="1090" height="205" rx="20" fill="#272b3c" stroke="#8c92c7"/><text x="24" y="42" fill="#c9cdf5" font-size="24" font-weight="700">BALI AND THE EASTERN ISLANDS · 4</text><g fill="#fff" font-size="19"><text x="24" y="88">Bali</text><text x="245" y="88">Lombok–Sumbawa</text><text x="500" y="88">Eastern Lesser Sunda Federation</text><text x="850" y="88">Moluccan Federation</text></g><path d="M24 115H1066" stroke="#616985"/><text x="24" y="153" fill="#a8bbc4" font-size="16">Outside the system: Singapore · western New Guinea · eastern New Guinea · the Japanese South Pacific territories</text><text x="24" y="181" fill="#e3c678" font-size="16">Official collective usage rejects “Indonesia”; pan-archipelagic nationalists preserve it as an opposition idea.</text></g>
  <text x="60" y="672" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Conceptual arrangement · not a boundary map</text>
</svg>
