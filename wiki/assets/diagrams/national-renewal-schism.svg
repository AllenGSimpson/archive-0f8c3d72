<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">National Renewal schism</title><desc id="desc">The unified National Renewal party divides in 1993 into Harwood's continuing National Renewal, Constitutional Renewal, American Producers, and National Vanguard, alongside the surviving Democratic-Republicans.</desc><rect width="1200" height="700" fill="#101713"/><text x="600" y="60" fill="#d8c58c" text-anchor="middle" font-family="Georgia,serif" font-size="33">FROM ONE OPPOSITION TO FIVE NATIONAL FORCES</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="390" y="105" width="420" height="84" rx="10" fill="#185c67" stroke="#68d3e5" stroke-width="4"/><text x="600" y="140" fill="#fff" font-size="25">NATIONAL RENEWAL</text><text x="600" y="170" fill="#d6eef1" font-size="18">Omaha federation · 1985–1993</text><g stroke="#d8c58c" stroke-width="4" fill="none"><path d="M600 189 V260 H130 V325"/><path d="M600 260 H400 V325"/><path d="M600 260 H670 V325"/><path d="M600 260 H940 V325"/></g><g stroke-width="3"><rect x="30" y="325" width="205" height="112" rx="8" fill="#294b7a" stroke="#6f9fe0"/><rect x="295" y="325" width="210" height="112" rx="8" fill="#145e76" stroke="#63c7d7"/><rect x="565" y="325" width="210" height="112" rx="8" fill="#6b4f20" stroke="#d8c58c"/><rect x="835" y="325" width="210" height="112" rx="8" fill="#5b2027" stroke="#d55c6a"/><rect x="945" y="515" width="220" height="95" rx="8" fill="#38414a" stroke="#b4c1cc"/></g><g fill="#fff" font-size="20"><text x="132" y="365">NATIONAL RENEWAL</text><text x="132" y="395">Productive faction</text><text x="400" y="365">CONSTITUTIONAL</text><text x="400" y="395">RENEWAL</text><text x="670" y="365">AMERICAN</text><text x="670" y="395">PRODUCERS</text><text x="940" y="365">NATIONAL</text><text x="940" y="395">VANGUARD</text><text x="1055" y="550">DEMOCRATIC–</text><text x="1055" y="580">REPUBLICANS</text></g><g fill="#bfc9bf" font-size="16"><text x="132" y="420">Harwood</text><text x="400" y="420">Landry</text><text x="670" y="420">Crane · Kincaid</text><text x="940" y="420">Cade</text><text x="1055" y="602">surviving fifth force</text></g><path d="M1040 455 V515" stroke="#b4c1cc" stroke-width="3" stroke-dasharray="9 8"/><text x="600" y="650" fill="#9da99d" font-size="17">Archive reconstruction · labels stabilize after the 1993 caucus rupture</text></g></svg>
