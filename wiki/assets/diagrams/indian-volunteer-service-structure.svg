<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Indian Volunteer Service structure</title><desc id="desc">The British regulatory service divided volunteers among Crown companies, advisory missions, and client-state contract auxiliaries.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202b"/><stop offset="1" stop-color="#070c12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f5eee4}.s{font:15px system-ui,sans-serif;fill:#aebdca}.top{fill:#2c2520;stroke:#bc8e54;stroke-width:2}.box{fill:#172936;stroke:#5f7f92;stroke-width:2}.warn{fill:#3b2829;stroke:#bd6c6f;stroke-width:2}.t{font:700 20px system-ui,sans-serif;fill:#f5eee4}.d{font:14px system-ui,sans-serif;fill:#c2cdd4}.tag{font:700 12px system-ui,sans-serif;fill:#f4d57a;letter-spacing:.08em}.line{fill:none;stroke:#d3ad55;stroke-width:4}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Indian Volunteer Service</text><text x="50" y="92" class="s">A British regulatory framework for three distinct forms of foreign military service</text>
  <g transform="translate(370 132)"><rect class="top" width="460" height="120" rx="10"/><text x="230" y="35" text-anchor="middle" class="tag">CREATED c. 1949</text><text x="230" y="72" text-anchor="middle" class="t">Registration · contracts · discipline · assignment</text><text x="230" y="99" text-anchor="middle" class="d">Detailed ministry and headquarters remain open</text></g>
  <path d="M600 252 V305 M205 305 H995 M205 305 V340 M600 305 V340 M995 305 V340" class="line"/>
  <g transform="translate(48 340)"><rect class="box" width="314" height="190" rx="10"/><text x="18" y="34" class="tag">CROWN COMPANIES</text><text x="18" y="71" class="t">British military law</text><text x="18" y="104" class="d">ports · railways · airfields</text><text x="18" y="130" class="d">stores · camps · installations</text><text x="18" y="164" class="d">closest direct Crown control</text></g>
  <g transform="translate(443 340)"><rect class="box" width="314" height="190" rx="10"/><text x="18" y="34" class="tag">ADVISORY MISSIONS</text><text x="18" y="71" class="t">Attached to client forces</text><text x="18" y="104" class="d">training · staff · signals</text><text x="18" y="130" class="d">engineering · maintenance</text><text x="18" y="164" class="d">combat accompaniment disputed</text></g>
  <g transform="translate(838 340)"><rect class="warn" width="314" height="190" rx="10"/><text x="18" y="34" class="tag">CONTRACT AUXILIARIES</text><text x="18" y="71" class="t">Client-state contracts</text><text x="18" y="104" class="d">guards · specialists · field service</text><text x="18" y="130" class="d">approval and oversight varied</text><text x="18" y="164" class="d">principal source of controversy</text></g>
  <text x="600" y="590" text-anchor="middle" class="t">3,000–6,000 active at one time · 15,000–25,000 cumulative</text><text x="600" y="621" text-anchor="middle" class="s">Working estimates exclude regular Commonwealth forces and most locally recruited troops.</text>
</svg>
