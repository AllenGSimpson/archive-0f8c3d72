<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The White Parachutes and the Friedensbrot myth</title><desc id="desc">Four-stage diagram separating the authorized flight, local payload substitution, British political effect, and retrospective German myth.</desc>
  <rect width="1600" height="900" fill="#111923"/><text x="90" y="92" fill="#f4ead8" font-family="Georgia,serif" font-size="54">The flight, the payload, the crisis, the myth</text><text x="92" y="140" fill="#a9bac7" font-family="Arial,sans-serif" font-size="24">Four different decisions later compressed into “Unternehmen Friedensbrot”</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(80 220)"><rect width="315" height="410" rx="24" fill="#23313c" stroke="#8297a5" stroke-width="4"/><text x="158" y="62" fill="#dbe5eb" font-size="25" text-anchor="middle">1 · BERLIN</text><text x="158" y="115" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">Authorized sortie</text><path d="M90 210h135l-27-28h-40l-20-45-16 45h-42z" fill="#8297a5"/><text x="158" y="290" fill="#dbe5eb" font-size="22" text-anchor="middle">Final London penetration</text><text x="158" y="325" fill="#dbe5eb" font-size="22" text-anchor="middle">and propaganda mission</text><text x="158" y="372" fill="#f1c75b" font-size="20" text-anchor="middle">Payload not specified centrally</text></g>
    <path d="M410 425h90" stroke="#f1c75b" stroke-width="8"/><path d="M500 425l-24-16v32z" fill="#f1c75b"/>
    <g transform="translate(500 220)"><rect width="315" height="410" rx="24" fill="#23313c" stroke="#f1c75b" stroke-width="4"/><text x="158" y="62" fill="#f1c75b" font-size="25" text-anchor="middle">2 · AIRFIELD</text><text x="158" y="115" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">Local substitution</text><circle cx="158" cy="205" r="54" fill="#f4ead8"/><path d="M158 259v62M114 290h88" stroke="#f4ead8" stroke-width="8"/><rect x="123" y="318" width="70" height="40" fill="#b23a48"/><text x="158" y="386" fill="#dbe5eb" font-size="20" text-anchor="middle">Food · medicine · old leaflets</text></g>
    <path d="M830 425h90" stroke="#f1c75b" stroke-width="8"/><path d="M920 425l-24-16v32z" fill="#f1c75b"/>
    <g transform="translate(920 220)"><rect width="280" height="410" rx="24" fill="#23313c" stroke="#5b9bd5" stroke-width="4"/><text x="140" y="62" fill="#80b7e6" font-size="25" text-anchor="middle">3 · LONDON</text><text x="140" y="115" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">Political shock</text><path d="M65 275h150M90 275v-90h100v90M115 185v-52h50v52" fill="none" stroke="#80b7e6" stroke-width="9"/><text x="140" y="338" fill="#dbe5eb" font-size="21" text-anchor="middle">Crowds move to Westminster</text><text x="140" y="374" fill="#dbe5eb" font-size="21" text-anchor="middle">Confidence collapses</text></g>
    <path d="M1215 425h75" stroke="#f1c75b" stroke-width="8"/><path d="M1290 425l-24-16v32z" fill="#f1c75b"/>
    <g transform="translate(1290 220)"><rect width="250" height="410" rx="24" fill="#3a2930" stroke="#b23a48" stroke-width="4"/><text x="125" y="62" fill="#e58b95" font-size="25" text-anchor="middle">4 · REICH</text><text x="125" y="115" fill="#fff" font-size="29" font-weight="700" text-anchor="middle">Official myth</text><text x="125" y="205" fill="#f4ead8" font-family="Georgia,serif" font-size="27" text-anchor="middle">FRIEDENSBROT</text><text x="125" y="265" fill="#dbe5eb" font-size="20" text-anchor="middle">Goebbels names</text><text x="125" y="302" fill="#dbe5eb" font-size="20" text-anchor="middle">Göring claims</text><text x="125" y="339" fill="#dbe5eb" font-size="20" text-anchor="middle">Hitler interprets</text><text x="125" y="383" fill="#f1c75b" font-size="18" text-anchor="middle">Originator erased</text></g>
  </g><text x="800" y="790" fill="#f4ead8" font-family="Georgia,serif" font-size="34" text-anchor="middle">The sortie was authorized. The story of one perfect plan was not.</text>
</svg>
