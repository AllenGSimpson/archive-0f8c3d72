<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Indian armored design genealogies after the Soviet collapse</title><desc id="desc">A family-tree diagram showing Soviet design traditions divided among Congress India, Hindustan, Hyderabad, Rajputana, Khalistan-Kashmir, and Pakistani states.</desc>
  <rect width="1200" height="700" fill="#111813"/><text x="55" y="64" fill="#eadfbf" font-family="Georgia,serif" font-size="34">Indian armored design genealogies</text><text x="55" y="100" fill="#9da99f" font-family="Arial,sans-serif" font-size="18">No state inherits “the Soviet tank industry.” Each receives one branch of a broken technical family.</text>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
    <rect x="390" y="135" width="420" height="72" rx="9" fill="#263229" stroke="#c7a24d"/><text x="600" y="165" fill="#e8dfc5" font-weight="700">SOVIET DESIGN ESTABLISHMENT</text><text x="600" y="190" fill="#bac5bc">archives · engineers · partial bureaus · production traditions</text>
    <path d="M600 207V250M600 250H135M600 250H1065" stroke="#c7a24d" stroke-width="4" fill="none"/>
    <g fill="#202b24" stroke="#66766a">
      <rect x="35" y="290" width="200" height="145" rx="8"/><rect x="265" y="290" width="200" height="145" rx="8"/><rect x="500" y="290" width="200" height="145" rx="8"/><rect x="735" y="290" width="200" height="145" rx="8"/><rect x="965" y="290" width="200" height="145" rx="8"/>
    </g>
    <g fill="#d9d1ba" font-weight="700"><text x="135" y="325">KARTSEV–TAGIL</text><text x="365" y="325">MOROZOV–KHARKIV</text><text x="600" y="325">KOTIN–KIROV</text><text x="835" y="325">CHELYABINSK–KURGAN</text><text x="1065" y="325">LIGHT / WHEELED</text></g>
    <g fill="#b8c3ba"><text x="135" y="355">mass medium tanks</text><text x="135" y="382">Object 140 research</text><text x="135" y="409">standardized production</text><text x="365" y="355">Objects 430–435–432</text><text x="365" y="382">compact advanced armor</text><text x="365" y="409">maintenance-intensive</text><text x="600" y="355">heavy breakthrough armor</text><text x="600" y="382">Uralmash assault guns</text><text x="600" y="409">short-run prestige systems</text><text x="835" y="355">enclosed infantry carriers</text><text x="835" y="382">engineer and recovery family</text><text x="835" y="409">mechanized mass army</text><text x="1065" y="355">Astrov light vehicles</text><text x="1065" y="382">GAZ–Arzamas wheeled armor</text><text x="1065" y="409">mountain and desert mobility</text></g>
    <g stroke="#c7a24d" stroke-width="4"><path d="M135 250V290"/><path d="M365 250V290"/><path d="M600 250V290"/><path d="M835 250V290"/><path d="M1065 250V290"/></g>
    <g fill="#263229" stroke="#c7a24d"><rect x="35" y="500" width="200" height="112" rx="8"/><rect x="265" y="500" width="200" height="112" rx="8"/><rect x="500" y="500" width="200" height="112" rx="8"/><rect x="735" y="500" width="200" height="112" rx="8"/><rect x="965" y="500" width="200" height="112" rx="8"/></g>
    <g fill="#e8dfc5" font-weight="700"><text x="135" y="538">CONGRESS INDIA</text><text x="365" y="538">HINDUSTAN</text><text x="600" y="538">HYDERABAD / RAJPUTANA</text><text x="835" y="538">CONGRESS INDIA</text><text x="1065" y="538">KHALISTAN / PAKISTANI STATES</text></g>
    <g fill="#c7a24d"><text x="135" y="574">Vijaya family</text><text x="365" y="574">advanced rival family</text><text x="600" y="574">heavy and export vehicles</text><text x="835" y="574">mechanized fleet</text><text x="1065" y="574">specialized light fleets</text></g>
    <g stroke="#829087" stroke-width="3"><path d="M135 435V500"/><path d="M365 435V500"/><path d="M600 435V500"/><path d="M835 435V500"/><path d="M1065 435V500"/></g>
  </g>
</svg>
