<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Post-defeat British nationalist currents</title>
  <desc id="desc">Comparison of Union Commonwealth, Empire Loyalism, and constitutional Commonwealth nationalism.</desc>
  <rect width="1200" height="760" fill="#111820"/>
  <text x="60" y="62" fill="#f0eee8" font-family="Georgia,serif" font-size="32">Post-defeat British nationalist currents</text>
  <text x="60" y="98" fill="#9fb0bd" font-family="Arial,sans-serif" font-size="17">Shared grievances did not produce a common constitutional programme</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(55 145)">
      <rect width="340" height="440" rx="12" fill="#30262a" stroke="#a4555f" stroke-width="3"/>
      <text x="25" y="44" fill="#f0eee8" font-size="24" font-weight="700">Union Commonwealth</text>
      <text x="25" y="76" fill="#d6adb2" font-size="16">Mosleyite current</text>
      <text x="25" y="124" fill="#f0eee8" font-size="16" font-weight="700">Authority</text>
      <text x="25" y="150" fill="#bfc9cf" font-size="15">Executive national plan</text>
      <text x="25" y="190" fill="#f0eee8" font-size="16" font-weight="700">Political form</text>
      <text x="25" y="216" fill="#bfc9cf" font-size="15">Mass party and corporations</text>
      <text x="25" y="256" fill="#f0eee8" font-size="16" font-weight="700">Commonwealth</text>
      <text x="25" y="282" fill="#bfc9cf" font-size="15">Planned interdependence</text>
      <text x="25" y="322" fill="#f0eee8" font-size="16" font-weight="700">Parliament</text>
      <text x="25" y="348" fill="#bfc9cf" font-size="15">Structurally inadequate</text>
      <text x="25" y="388" fill="#f0eee8" font-size="16" font-weight="700">Foreign connection</text>
      <text x="25" y="414" fill="#bfc9cf" font-size="15">Continental fascist vocabulary</text>
    </g>
    <g transform="translate(430 145)">
      <rect width="340" height="440" rx="12" fill="#202f39" stroke="#6189a0" stroke-width="3"/>
      <text x="25" y="44" fill="#f0eee8" font-size="24" font-weight="700">Empire Loyalists</text>
      <text x="25" y="76" fill="#a9c5d4" font-size="16">Chestertonian current</text>
      <text x="25" y="124" fill="#f0eee8" font-size="16" font-weight="700">Authority</text>
      <text x="25" y="150" fill="#bfc9cf" font-size="15">Crown, empire, hierarchy</text>
      <text x="25" y="190" fill="#f0eee8" font-size="16" font-weight="700">Political form</text>
      <text x="25" y="216" fill="#bfc9cf" font-size="15">Pressure group and press</text>
      <text x="25" y="256" fill="#f0eee8" font-size="16" font-weight="700">Commonwealth</text>
      <text x="25" y="282" fill="#bfc9cf" font-size="15">Imperial loyalty and preference</text>
      <text x="25" y="322" fill="#f0eee8" font-size="16" font-weight="700">Parliament</text>
      <text x="25" y="348" fill="#bfc9cf" font-size="15">Suspects party government</text>
      <text x="25" y="388" fill="#f0eee8" font-size="16" font-weight="700">Foreign connection</text>
      <text x="25" y="414" fill="#bfc9cf" font-size="15">Anti-German and anti-American</text>
    </g>
    <g transform="translate(805 145)">
      <rect width="340" height="440" rx="12" fill="#343025" stroke="#b49a5a" stroke-width="3"/>
      <text x="25" y="44" fill="#f0eee8" font-size="23" font-weight="700">Constitutional right</text>
      <text x="25" y="76" fill="#d3c397" font-size="16">Powell and imperial Tories</text>
      <text x="25" y="124" fill="#f0eee8" font-size="16" font-weight="700">Authority</text>
      <text x="25" y="150" fill="#bfc9cf" font-size="15">Crown in Parliament</text>
      <text x="25" y="190" fill="#f0eee8" font-size="16" font-weight="700">Political form</text>
      <text x="25" y="216" fill="#bfc9cf" font-size="15">Party, research, Parliament</text>
      <text x="25" y="256" fill="#f0eee8" font-size="16" font-weight="700">Commonwealth</text>
      <text x="25" y="282" fill="#bfc9cf" font-size="15">Strategic duty and triage</text>
      <text x="25" y="322" fill="#f0eee8" font-size="16" font-weight="700">Parliament</text>
      <text x="25" y="348" fill="#bfc9cf" font-size="15">Sovereign British possession</text>
      <text x="25" y="388" fill="#f0eee8" font-size="16" font-weight="700">Foreign connection</text>
      <text x="25" y="414" fill="#bfc9cf" font-size="15">Specifically British vocabulary</text>
    </g>
    <path d="M225 585 L600 675 L975 585" fill="none" stroke="#7b8992" stroke-width="3" stroke-dasharray="8 8"/>
    <rect x="360" y="642" width="480" height="72" rx="36" fill="#1d272e" stroke="#7b8992" stroke-width="2"/>
    <text x="600" y="674" fill="#f0eee8" font-size="18" font-weight="700" text-anchor="middle">Possible later veteran synthesis</text>
    <text x="600" y="699" fill="#9fb0bd" font-size="14" text-anchor="middle">identity, organization, and electoral history remain open</text>
  </g>
</svg>
