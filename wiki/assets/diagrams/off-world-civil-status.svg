<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Off-world civil status record chain</title><desc id="d">A household event is recorded locally and transmitted into sponsor and terrestrial civil records.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08131a"/><stop offset="1" stop-color="#15252e"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#70aebe"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#eef5f7" font-family="Georgia,serif" font-size="31">Off-world civil status</text><text x="60" y="104" fill="#a3b6bf" font-family="Arial,sans-serif" font-size="17">Local facts enter several durable legal and social records</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="170" cy="300" r="105" fill="#183544" stroke="#5e94a7" stroke-width="3"/><text x="170" y="270" fill="#e6f1f3" font-size="20" font-weight="700">HOUSEHOLD EVENT</text><text x="170" y="307" fill="#bdd0d7" font-size="15">marriage · birth</text><text x="170" y="334" fill="#bdd0d7" font-size="15">parentage · death</text><rect x="380" y="205" width="240" height="190" rx="18" fill="#20424d" stroke="#70aebe"/><text x="500" y="250" fill="#e6f1f3" font-size="19" font-weight="700">LOCAL REGISTRAR</text><text x="500" y="292" fill="#bdd0d7" font-size="15">identity · witnesses</text><text x="500" y="319" fill="#bdd0d7" font-size="15">medical record</text><text x="500" y="346" fill="#bdd0d7" font-size="15">authenticated copy</text><rect x="700" y="205" width="240" height="190" rx="18" fill="#343d3f" stroke="#ae995f"/><text x="820" y="250" fill="#fae8b6" font-size="19" font-weight="700">SPONSOR SYSTEM</text><text x="820" y="292" fill="#d6d0bc" font-size="15">nationality · domicile</text><text x="820" y="319" fill="#d6d0bc" font-size="15">recognition · probate</text><text x="820" y="346" fill="#d6d0bc" font-size="15">jurisdiction</text><rect x="1000" y="205" width="150" height="190" rx="18" fill="#322e38" stroke="#8e7fa4"/><text x="1075" y="250" fill="#ece3f6" font-size="18" font-weight="700">PARALLEL</text><text x="1075" y="286" fill="#cec4db" font-size="14">religious</text><text x="1075" y="313" fill="#cec4db" font-size="14">employer</text><text x="1075" y="340" fill="#cec4db" font-size="14">medical</text></g><g stroke="#70aebe" stroke-width="3" marker-end="url(#a)"><path d="M275 300h90"/><path d="M620 300h65"/><path d="M940 300h45"/></g><text x="600" y="515" fill="#9fb3bc" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Birthplace and residence can be extraterrestrial while civil authority remains terrestrial</text></svg>
