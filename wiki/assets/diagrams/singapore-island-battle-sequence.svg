<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Battle of Singapore Island sequence</title>
  <desc id="desc">Schematic map showing Japanese crossings from Johore to Sarimbun and Kranji, advances through Bukit Timah, the Pasir Panjang ridge, Alexandra Hospital, and the final Singapore city perimeter.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1b25"/><stop offset="1" stop-color="#0d2a37"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33483e"/><stop offset="1" stop-color="#1e332f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d86b5c"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d9bd72"/></marker>
  </defs>
  <rect width="1200" height="820" fill="url(#sea)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="54" fill="#f1dfae" font-size="28" font-weight="700">BATTLE OF SINGAPORE ISLAND</text>
    <text x="53" y="82" fill="#9bb2bd" font-size="15" letter-spacing="1.2">CROSSINGS, CENTRAL ADVANCE, AND FINAL PERIMETER · FEBRUARY 1942</text>

    <path d="M20 120 C180 105 320 130 448 112 C596 91 760 113 902 100 C1012 91 1100 104 1180 120 L1180 212 C1038 202 920 220 806 205 C652 185 526 221 374 199 C238 180 128 208 20 193 Z" fill="#334a3b" stroke="#6f8c7d" stroke-width="2"/>
    <text x="520" y="160" fill="#d9e3d8" font-size="22" font-weight="700">JOHORE</text>
    <text x="500" y="185" fill="#a8bbae" font-size="14">Japanese 25th Army assembly area</text>

    <path d="M80 355 C125 302 218 269 324 267 C407 227 526 236 594 263 C685 240 775 269 824 312 C914 318 1008 369 1064 433 C1102 478 1091 550 1035 580 C965 620 888 640 806 681 C714 724 594 738 473 719 C354 700 242 663 167 606 C102 556 61 487 65 421 C67 393 71 373 80 355 Z" fill="url(#land)" stroke="#71907d" stroke-width="3" filter="url(#shadow)"/>

    <path d="M166 327 C274 324 367 336 450 368 C545 405 612 441 682 477 C759 516 836 538 967 548" fill="none" stroke="#617b76" stroke-width="6" stroke-dasharray="10 9" opacity=".8"/>
    <path d="M364 310 C434 360 500 409 570 469 C630 519 695 575 781 626" fill="none" stroke="#80928a" stroke-width="4" opacity=".7"/>

    <path d="M258 205 C245 244 222 278 192 316" fill="none" stroke="#d86b5c" stroke-width="7" marker-end="url(#arrow-red)"/>
    <path d="M360 208 C350 244 337 274 317 308" fill="none" stroke="#d86b5c" stroke-width="7" marker-end="url(#arrow-red)"/>
    <text x="91" y="236" fill="#ef9b8d" font-size="15" font-weight="700">5TH &amp; 18TH DIVISIONS</text>
    <text x="119" y="256" fill="#d5c6c1" font-size="13">night crossings</text>

    <path d="M704 202 C693 236 679 267 663 302" fill="none" stroke="#d86b5c" stroke-width="7" marker-end="url(#arrow-red)"/>
    <text x="700" y="236" fill="#ef9b8d" font-size="15" font-weight="700">IMPERIAL GUARDS</text>
    <text x="720" y="256" fill="#d5c6c1" font-size="13">Kranji crossing</text>

    <path d="M698 206 L744 287" stroke="#99a9ac" stroke-width="5" stroke-dasharray="6 6"/>
    <path d="M742 288 L762 316" stroke="#99a9ac" stroke-width="5"/>
    <text x="774" y="292" fill="#b8c5c8" font-size="13">damaged Causeway</text>

    <g transform="translate(148 303)">
      <circle r="13" fill="#d86b5c" stroke="#ffd0c7" stroke-width="2"/>
      <rect x="-13" y="20" width="205" height="57" rx="7" fill="#152833" stroke="#668594"/>
      <text x="4" y="43" fill="#f1dfae" font-size="17" font-weight="700">SARIMBUN BEACH</text>
      <text x="4" y="64" fill="#c6d5dc" font-size="13">principal bridgehead</text>
    </g>
    <g transform="translate(650 308)">
      <circle r="13" fill="#d86b5c" stroke="#ffd0c7" stroke-width="2"/>
      <rect x="-13" y="20" width="172" height="57" rx="7" fill="#152833" stroke="#668594"/>
      <text x="4" y="43" fill="#f1dfae" font-size="17" font-weight="700">KRANJI</text>
      <text x="4" y="64" fill="#c6d5dc" font-size="13">crossing crisis</text>
    </g>

    <path d="M183 353 C261 385 337 415 447 467" fill="none" stroke="#d86b5c" stroke-width="6" marker-end="url(#arrow-red)"/>
    <path d="M651 362 C596 393 539 428 473 470" fill="none" stroke="#d86b5c" stroke-width="6" marker-end="url(#arrow-red)"/>
    <g transform="translate(459 481)">
      <circle r="15" fill="#d9bd72" stroke="#fff0bd" stroke-width="2"/>
      <rect x="-87" y="23" width="220" height="61" rx="7" fill="#152833" stroke="#d9bd72"/>
      <text x="-68" y="48" fill="#f1dfae" font-size="18" font-weight="700">BUKIT TIMAH</text>
      <text x="-68" y="70" fill="#c6d5dc" font-size="13">roads · depots · high ground</text>
    </g>

    <ellipse cx="589" cy="421" rx="72" ry="35" fill="#183f50" stroke="#5b91a4" stroke-width="2" opacity=".9"/>
    <ellipse cx="692" cy="441" rx="56" ry="29" fill="#183f50" stroke="#5b91a4" stroke-width="2" opacity=".9"/>
    <text x="553" y="425" fill="#a9d0dc" font-size="12">reservoirs</text>

    <path d="M471 565 C518 591 551 617 594 646" fill="none" stroke="#d86b5c" stroke-width="6" marker-end="url(#arrow-red)"/>
    <g transform="translate(560 656)">
      <circle r="13" fill="#d9bd72" stroke="#fff0bd" stroke-width="2"/>
      <rect x="-137" y="20" width="240" height="59" rx="7" fill="#152833" stroke="#d9bd72"/>
      <text x="-119" y="44" fill="#f1dfae" font-size="17" font-weight="700">PASIR PANJANG</text>
      <text x="-119" y="65" fill="#c6d5dc" font-size="13">Bukit Chandu ridge</text>
    </g>

    <path d="M598 641 C644 615 686 595 733 573" fill="none" stroke="#d86b5c" stroke-width="5" marker-end="url(#arrow-red)"/>
    <g transform="translate(750 561)">
      <rect x="-11" y="-11" width="22" height="22" fill="#e7e7dc" stroke="#9b3c3c" stroke-width="2"/>
      <path d="M-7 0H7M0-7V7" stroke="#b83f3f" stroke-width="4"/>
      <rect x="18" y="-28" width="225" height="59" rx="7" fill="#152833" stroke="#8d6d6d"/>
      <text x="35" y="-4" fill="#f1dfae" font-size="16" font-weight="700">ALEXANDRA HOSPITAL</text>
      <text x="35" y="18" fill="#d2bbbb" font-size="13">patients and staff massacred</text>
    </g>

    <path d="M755 588 C796 610 836 623 878 628" fill="none" stroke="#d86b5c" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M836 548 C879 567 921 579 969 584" fill="none" stroke="#d86b5c" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M782 528 C823 510 870 502 916 507" fill="none" stroke="#d86b5c" stroke-width="5" marker-end="url(#arrow-red)"/>
    <path d="M820 493 C865 476 916 469 982 475" fill="none" stroke="#d9bd72" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M981 475 C1018 495 1028 543 1004 574 C974 613 916 656 837 674" fill="none" stroke="#d9bd72" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="873" y="455" fill="#f1dfae" font-size="15" font-weight="700">FINAL CITY PERIMETER</text>
    <text x="873" y="675" fill="#f1dfae" font-size="24" font-weight="700">SINGAPORE CITY</text>
    <text x="893" y="699" fill="#c6d5dc" font-size="13">capitulation · exact setting day open</text>

    <g transform="translate(54 742)">
      <rect width="1092" height="50" rx="7" fill="#10232d" stroke="#385461"/>
      <line x1="25" y1="17" x2="77" y2="17" stroke="#d86b5c" stroke-width="6" marker-end="url(#arrow-red)"/>
      <text x="91" y="22" fill="#c6d5dc" font-size="13">Japanese crossing or advance</text>
      <circle cx="321" cy="17" r="8" fill="#d9bd72" stroke="#fff0bd"/>
      <text x="337" y="22" fill="#c6d5dc" font-size="13">major battle position</text>
      <line x1="522" y1="17" x2="574" y2="17" stroke="#d9bd72" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="588" y="22" fill="#c6d5dc" font-size="13">contracted defensive perimeter</text>
      <text x="25" y="42" fill="#819aa7" font-size="12">Diagrammatic only: shorelines, distances, unit boundaries, and exact alternate chronology are not to scale.</text>
    </g>
  </g>
</svg>
