<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Japanese development-plan sequence</title><desc id="desc">Timeline from financial rectification through reconstruction, prosperity planning, and protected enterprise reform.</desc>
  <rect width="1200" height="675" fill="#101413"/><rect x="24" y="24" width="1152" height="627" rx="18" fill="#171d1b" stroke="#9e7d35" stroke-width="2"/>
  <text x="60" y="72" fill="#f1ead8" font-family="Georgia,serif" font-size="31" font-weight="700">From victory finance to mature developmental empire</text>
  <text x="60" y="103" fill="#b9b5a8" font-family="Arial,sans-serif" font-size="15">The same institutions move from stabilization to reconstruction, growth, and finally the management of accumulated weakness.</text>
  <path d="M120 333H1080" stroke="#b89a52" stroke-width="5"/>
  <g font-family="Arial,sans-serif">
    <circle cx="170" cy="333" r="18" fill="#d9b55b"/><rect x="65" y="150" width="260" height="150" rx="14" fill="#5e2024" stroke="#d9b55b"/><text x="95" y="182" fill="#fff4d8" font-size="13" letter-spacing="2">1948</text><text x="95" y="214" fill="#ffffff" font-size="19" font-weight="700">Financial Rectification</text><text x="95" y="242" fill="#f2d79c" font-size="13">protect small balances</text><text x="95" y="264" fill="#f2d79c" font-size="13">convert war claims</text><text x="95" y="286" fill="#f2d79c" font-size="13">stabilize yen and credit</text>
    <circle cx="455" cy="333" r="18" fill="#d9b55b"/><rect x="335" y="365" width="280" height="170" rx="14" fill="#243a45" stroke="#7192a2"/><text x="365" y="397" fill="#dcecf3" font-size="13" letter-spacing="2">1949–1953</text><text x="365" y="429" fill="#ffffff" font-size="19" font-weight="700">First Reconstruction Plan</text><text x="365" y="457" fill="#b9cbd3" font-size="13">shipping · oil · ports · steel</text><text x="365" y="479" fill="#b9cbd3" font-size="13">power · rail · food · housing</text><text x="365" y="501" fill="#b9cbd3" font-size="13">machine tools · technical schools</text>
    <circle cx="745" cy="333" r="18" fill="#d9b55b"/><rect x="625" y="150" width="280" height="150" rx="14" fill="#25443b" stroke="#6aa68e"/><text x="655" y="182" fill="#e2f4ec" font-size="13" letter-spacing="2">1960–1965</text><text x="655" y="214" fill="#ffffff" font-size="19" font-weight="700">Prosperity Plan</text><text x="655" y="242" fill="#bed9ce" font-size="13">household prosperity</text><text x="655" y="264" fill="#bed9ce" font-size="13">associated-state infrastructure</text><text x="655" y="286" fill="#bed9ce" font-size="13">industrial ladder and education</text>
    <circle cx="1030" cy="333" r="18" fill="#d9b55b"/><rect x="915" y="365" width="220" height="170" rx="14" fill="#42361e" stroke="#b89a52"/><text x="945" y="397" fill="#f3e6bd" font-size="13" letter-spacing="2">1970s–1980s</text><text x="945" y="429" fill="#ffffff" font-size="18" font-weight="700">Mature system</text><text x="945" y="457" fill="#dbc996" font-size="13">automation · electronics</text><text x="945" y="479" fill="#dbc996" font-size="13">protected capacity</text><text x="945" y="501" fill="#dbc996" font-size="13">bad loans · restructuring</text>
  </g>
  <text x="600" y="611" text-anchor="middle" fill="#aaa69a" font-family="Arial,sans-serif" font-size="13">Growth proves the usefulness of hierarchy while making associated states stronger and protected firms harder to close.</text>
</svg>
