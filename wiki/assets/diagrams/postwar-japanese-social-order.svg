<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d"><title id="t">Postwar Japanese social order</title><desc id="d">Diagram showing household life shaped by company, school, locality, welfare, and imperial nationality.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#071015"/></linearGradient><style>.n{fill:#15232c;stroke:#79b8c7;stroke-width:2}.s{fill:#192027;stroke:#b09a70;stroke-width:1.5}.h{fill:#f1eadc;font:700 21px Georgia,serif;text-anchor:middle}.p{fill:#c8d1d2;font:15px Arial,sans-serif;text-anchor:middle}.l{stroke:#79b8c7;stroke-width:2;fill:none}.q{stroke:#b09a70;stroke-width:1.5;stroke-dasharray:7 7;fill:none}</style></defs><rect width="960" height="620" rx="24" fill="url(#b)"/><text x="480" y="44" class="h" font-size="26">Postwar Japanese social order</text><text x="480" y="69" class="p">household security, technical mobility, and unequal membership</text><rect class="n" x="330" y="245" width="300" height="105" rx="52"/><text class="h" x="480" y="285">Household</text><text class="p" x="480" y="310">work, care, residence, education</text><rect class="s" x="60" y="120" width="235" height="88" rx="14"/><text class="h" x="178" y="153">Company</text><text class="p" x="178" y="179">job, housing, clinic, pension</text><rect class="s" x="665" y="120" width="235" height="88" rx="14"/><text class="h" x="783" y="153">School</text><text class="p" x="783" y="179">credentials, language, mobility</text><rect class="s" x="60" y="405" width="235" height="88" rx="14"/><text class="h" x="178" y="438">Locality</text><text class="p" x="178" y="464">prefecture, village, neighborhood</text><rect class="s" x="665" y="405" width="235" height="88" rx="14"/><text class="h" x="783" y="438">State and welfare</text><text class="p" x="783" y="464">benefits, veterans, family policy</text><rect class="n" x="330" y="515" width="300" height="70" rx="14"/><text class="h" x="480" y="544">Imperial nationality</text><text class="p" x="480" y="568">shared status, unequal lived standing</text><path class="l" d="M295 190l85 70M665 190l-85 70M295 425l85-95M665 425l-85-95M480 350v165"/><path class="q" d="M178 208v197M783 208v197"/><text class="p" x="480" y="100">Technical growth expands opportunity while concentrating power in metropolitan corridors and recognized institutions.</text></svg>
