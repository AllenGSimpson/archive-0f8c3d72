<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Layered alignments in the Americas around 2000</title><desc id="desc">Matrix comparing strategic alignment, cultural affinity, and corporate penetration in Venezuela, Cuba, Mexico, Argentina, Peru and Ecuador, Chile, and the Commonwealth Caribbean.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#223341"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f7f2e8}.sub{font:17px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.head{font:700 20px Arial,sans-serif;fill:#fff}.state{font:700 21px Arial,sans-serif;fill:#f2c873}.stateSmall{font:700 18px Arial,sans-serif;fill:#f2c873}.copy{font:17px Arial,sans-serif;fill:#d5dfe4}.grid{stroke:#607b8a;stroke-width:2}.shade{fill:#122735}.alt{fill:#172e3d}.foot{font:17px Arial,sans-serif;fill:#d9cba5}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="62" text-anchor="middle" class="title">THE AMERICAS HAVE THREE MAPS</text><text x="800" y="98" text-anchor="middle" class="sub">STRATEGIC CONTROL · CULTURAL AFFINITY · CORPORATE PENETRATION · c. 2000</text>
  <g transform="translate(70 145)"><rect width="1460" height="720" rx="22" fill="#0f222e" stroke="#6d8795" stroke-width="3"/><path d="M320 0V720M685 0V720M1050 0V720" class="grid"/><path d="M0 80H1460M0 170H1460M0 260H1460M0 350H1460M0 440H1460M0 530H1460M0 620H1460" class="grid"/>
    <rect y="80" width="1460" height="90" class="shade"/><rect y="260" width="1460" height="90" class="shade"/><rect y="440" width="1460" height="90" class="shade"/><rect y="620" width="1460" height="100" class="shade"/>
    <text x="25" y="50" class="head">STATE / REGION</text><text x="345" y="50" class="head">STRATEGIC</text><text x="710" y="50" class="head">CULTURAL</text><text x="1075" y="50" class="head">CORPORATE</text>
    <text x="25" y="135" class="state">VENEZUELA</text><text x="345" y="135" class="copy">American client</text><text x="710" y="135" class="copy">Latin layer survives</text><text x="1075" y="125" class="copy">American ceiling;</text><text x="1075" y="150" class="copy">Latin firms tolerated</text>
    <text x="25" y="225" class="state">CUBA</text><text x="345" y="225" class="copy">Sovereign · Latin-affiliated</text><text x="710" y="225" class="copy">Spanish / Latin</text><text x="1075" y="215" class="copy">Latin firms preferred;</text><text x="1075" y="240" class="copy">American firms restricted</text>
    <text x="25" y="315" class="state">MEXICO</text><text x="345" y="315" class="copy">Independent</text><text x="710" y="305" class="copy">Catholic-corporatist;</text><text x="710" y="330" class="copy">Spanish influence</text><text x="1075" y="305" class="copy">Mexican first · Latin counterweight</text><text x="1075" y="330" class="copy">Large American presence</text>
    <text x="25" y="405" class="state">ARGENTINA</text><text x="345" y="395" class="copy">Independent;</text><text x="345" y="420" class="copy">German-linked defense</text><text x="710" y="405" class="copy">Hispanic / national</text><text x="1075" y="395" class="copy">German strategic systems;</text><text x="1075" y="420" class="copy">American civilian commerce</text>
    <text x="25" y="495" class="state">PERU / ECUADOR</text><text x="345" y="485" class="copy">Japanese footholds under</text><text x="345" y="510" class="copy">American pressure</text><text x="710" y="495" class="copy">National / Pacific-facing</text><text x="1075" y="485" class="copy">Main Japanese–American</text><text x="1075" y="510" class="copy">corporate contest</text>
    <text x="25" y="585" class="state">CHILE</text><text x="345" y="585" class="copy">Independent balancer</text><text x="710" y="585" class="copy">National equilibrium</text><text x="1075" y="575" class="copy">Strong domestic firms;</text><text x="1075" y="600" class="copy">prominent American firms</text>
    <text x="25" y="664" class="stateSmall">COMMONWEALTH</text><text x="25" y="688" class="stateSmall">CARIBBEAN</text><text x="345" y="665" class="copy">Belize · Jamaica · Bahamas</text><text x="345" y="690" class="copy">Commonwealth positions</text><text x="710" y="675" class="copy">British Commonwealth</text><text x="1075" y="665" class="copy">British networks compete</text><text x="1075" y="690" class="copy">with American gravity</text>
  </g>
  <rect x="255" y="900" width="1090" height="55" rx="27" fill="#32291d" stroke="#d4b064" stroke-width="3"/><text x="800" y="935" text-anchor="middle" class="foot">One state can occupy three different positions at the same time</text>
</svg>
