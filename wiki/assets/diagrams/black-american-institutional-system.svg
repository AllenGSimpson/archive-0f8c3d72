<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Black American institutional system</title>
  <desc id="desc">A diagram showing how civic capital, cultural production, distribution institutions, and national audiences reinforce one another.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a22"/><stop offset="1" stop-color="#071015"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7a542"/><stop offset="1" stop-color="#f0ce78"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d7a542"/></marker>
    <style>
      .box{fill:#182630;stroke:#527083;stroke-width:2;rx:14;filter:url(#shadow)}
      .head{font:700 25px Georgia,serif;fill:#f7f0df;text-anchor:middle}
      .sub{font:17px system-ui,sans-serif;fill:#c9d2d7;text-anchor:middle}
      .label{font:700 17px system-ui,sans-serif;fill:#e5bd62;letter-spacing:1px;text-anchor:middle}
      .flow{fill:none;stroke:url(#gold);stroke-width:4;marker-end:url(#arrow)}
      .return{fill:none;stroke:#7693a2;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <text x="600" y="56" class="head" font-size="34">A self-reinforcing national public sphere</text>
  <text x="600" y="88" class="sub">Ownership permits institutions to reproduce audiences, leadership, credit, and cultural authority</text>

  <rect class="box" x="55" y="170" width="245" height="210"/>
  <text x="177" y="208" class="label">CIVIC CAPITAL</text>
  <text x="177" y="250" class="head">Banks and insurers</text>
  <text x="177" y="286" class="sub">Churches and colleges</text>
  <text x="177" y="318" class="sub">Professional societies</text>
  <text x="177" y="350" class="sub">Local advertisers</text>

  <rect class="box" x="355" y="170" width="245" height="210"/>
  <text x="477" y="208" class="label">PRODUCTION</text>
  <text x="477" y="250" class="head">Labels and film</text>
  <text x="477" y="286" class="sub">Newsrooms and presses</text>
  <text x="477" y="318" class="sub">Artists and technicians</text>
  <text x="477" y="350" class="sub">Research and training</text>

  <rect class="box" x="655" y="170" width="245" height="210"/>
  <text x="777" y="208" class="label">DISTRIBUTION</text>
  <text x="777" y="250" class="head">Radio and television</text>
  <text x="777" y="286" class="sub">Theaters and touring</text>
  <text x="777" y="318" class="sub">Booking and management</text>
  <text x="777" y="350" class="sub">Shops and syndication</text>

  <rect class="box" x="955" y="170" width="190" height="210"/>
  <text x="1050" y="208" class="label">PUBLICS</text>
  <text x="1050" y="250" class="head">Local audiences</text>
  <text x="1050" y="286" class="sub">National markets</text>
  <text x="1050" y="318" class="sub">Political constituencies</text>
  <text x="1050" y="350" class="sub">Foreign audiences</text>

  <path class="flow" d="M300 275H345"/>
  <path class="flow" d="M600 275H645"/>
  <path class="flow" d="M900 275H945"/>
  <path class="return" d="M1050 390C1050 535 177 535 177 390"/>
  <text x="600" y="510" class="head">Revenue, reputation, leadership, and political leverage return to the institutions</text>
  <text x="600" y="548" class="sub">Crossover can widen the audience without making outside admission the sole measure of success</text>
  <rect x="420" y="585" width="360" height="4" fill="url(#gold)" rx="2"/>
</svg>
