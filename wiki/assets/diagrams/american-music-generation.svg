<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Six forms of authority in American popular music</title><desc id="desc">A two-level diagram connects white and Black American music institutions through six major figures and permeable audiences.</desc><rect width="1200" height="675" fill="#101820"/><text x="58" y="67" fill="#f2eadb" font-family="Georgia,serif" font-size="34">American popular music · six forms of authority</text><text x="58" y="102" fill="#aeb9c7" font-family="Arial,sans-serif" font-size="18">Parallel institutions · permeable audiences · no single political ownership</text><rect x="62" y="147" width="516" height="410" rx="26" fill="#1c2c38" stroke="#7faed1" stroke-width="4"/><text x="320" y="188" fill="#e8edf2" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">White and general-market institutions</text><rect x="622" y="147" width="516" height="410" rx="26" fill="#293a31" stroke="#82b593" stroke-width="4"/><text x="880" y="188" fill="#e8edf2" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">Black-owned institutional world</text><g font-family="Arial,sans-serif"><rect x="101" y="224" width="197" height="112" rx="15" fill="#273b4b" stroke="#d9c7aa" stroke-width="3"/><text x="200" y="260" fill="#f4ecdf" font-size="20" text-anchor="middle">Frank Sinatra</text><text x="200" y="289" fill="#b9c4cf" font-size="14" text-anchor="middle">urban establishment</text><rect x="342" y="224" width="197" height="112" rx="15" fill="#273b4b" stroke="#d56a61" stroke-width="3"/><text x="441" y="260" fill="#f4ecdf" font-size="20" text-anchor="middle">Elvis Presley</text><text x="441" y="289" fill="#b9c4cf" font-size="14" text-anchor="middle">singular celebrity</text><rect x="101" y="382" width="197" height="112" rx="15" fill="#273b4b" stroke="#d49a68" stroke-width="3"/><text x="200" y="418" fill="#f4ecdf" font-size="20" text-anchor="middle">Johnny Cash</text><text x="200" y="447" fill="#b9c4cf" font-size="14" text-anchor="middle">rural moral voice</text><rect x="342" y="382" width="197" height="112" rx="15" fill="#273b4b" stroke="#8c99c6" stroke-width="3"/><text x="441" y="418" fill="#f4ecdf" font-size="20" text-anchor="middle">Bob Dylan</text><text x="441" y="447" fill="#b9c4cf" font-size="14" text-anchor="middle">unowned protest</text><rect x="662" y="251" width="197" height="138" rx="15" fill="#31483a" stroke="#d7b36a" stroke-width="3"/><text x="760" y="290" fill="#f4ecdf" font-size="20" text-anchor="middle">Aretha Franklin</text><text x="760" y="320" fill="#c4d1c7" font-size="14" text-anchor="middle">gospel and interpretive</text><text x="760" y="342" fill="#c4d1c7" font-size="14" text-anchor="middle">crossover authority</text><rect x="901" y="251" width="197" height="138" rx="15" fill="#31483a" stroke="#c18d68" stroke-width="3"/><text x="1000" y="290" fill="#f4ecdf" font-size="20" text-anchor="middle">Berry Gordy</text><text x="1000" y="320" fill="#c4d1c7" font-size="14" text-anchor="middle">ownership, training,</text><text x="1000" y="342" fill="#c4d1c7" font-size="14" text-anchor="middle">distribution, finance</text></g><path d="M539 278 C600 245 626 245 662 289" fill="none" stroke="#d9c7aa" stroke-width="5" stroke-dasharray="12 10"/><path d="M539 437 C616 478 697 444 732 389" fill="none" stroke="#d9c7aa" stroke-width="5" stroke-dasharray="12 10"/><path d="M859 320 H901" fill="none" stroke="#d9c7aa" stroke-width="5"/><text x="600" y="523" fill="#f2eadb" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">records · radio · touring · television · film · churches · venues · licensing</text><rect x="241" y="586" width="718" height="52" rx="18" fill="#392b2b" stroke="#c88667" stroke-width="3"/><text x="600" y="619" fill="#f2eadb" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Foreign listeners usually hear every branch simply as “American music.”</text></svg>
