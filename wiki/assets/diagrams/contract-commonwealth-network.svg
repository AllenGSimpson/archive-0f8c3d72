<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Contract Commonwealth network</title><desc id="desc">A Commonwealth planning secretariat links British finance, design, and guaranteed markets to distributed production in Canada, Australia, New Zealand, southern Africa, the Caribbean, Gulf, and Indian protected states.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.hub{fill:#302b25;stroke:#be925d;stroke-width:2}.node{fill:#192e39;stroke:#6b8796;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 17px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}.out{stroke:#cfa655;stroke-width:3;fill:none}.back{stroke:#7895a4;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Contract Commonwealth</text><text x="50" y="92" class="s">Sovereign partners coordinated by capacity information and reciprocal contracts, not a London production command</text>
  <g transform="translate(430 230)"><rect class="hub" width="340" height="220" rx="12"/><text x="170" y="37" text-anchor="middle" class="tag">PLANNING SECRETARIAT</text><text x="170" y="78" text-anchor="middle" class="t">Britain · design · finance · markets</text><text x="25" y="120" class="d">Shipping · food · fuel · minerals</text><text x="25" y="146" class="d">Industrial capacity · defense production</text><text x="25" y="172" class="d">Communications · standards · route plans</text><text x="25" y="201" class="d">Information and guarantees — no command power</text></g>
  <g transform="translate(45 140)"><rect class="node" width="260" height="125" rx="9"/><text x="18" y="34" class="tag">CANADA</text><text x="18" y="72" class="t">Grain · aluminum · engines</text><text x="18" y="99" class="d">vehicles · electronics</text></g>
  <g transform="translate(45 410)"><rect class="node" width="260" height="125" rx="9"/><text x="18" y="34" class="tag">AUSTRALIA + NEW ZEALAND</text><text x="18" y="72" class="t">Food · metals · munitions</text><text x="18" y="99" class="d">repair · maritime support</text></g>
  <g transform="translate(895 140)"><rect class="node" width="260" height="125" rx="9"/><text x="18" y="34" class="tag">SOUTHERN AFRICA</text><text x="18" y="72" class="t">Gold · minerals · ports</text><text x="18" y="99" class="d">repair · metals · route access</text></g>
  <g transform="translate(895 410)"><rect class="node" width="260" height="125" rx="9"/><text x="18" y="34" class="tag">CARIBBEAN · GULF · INDIA</text><text x="18" y="72" class="t">Sugar · oil · local production</text><text x="18" y="99" class="d">facilities · route services</text></g>
  <path class="out" d="M430 280 L305 220 M430 400 L305 475 M770 280 L895 220 M770 400 L895 475"/><path class="back" d="M305 245 L430 305 M305 500 L430 425 M895 245 L770 305 M895 500 L770 425"/>
  <text x="50" y="625" class="s">Arrows indicate reciprocal schedules: Commonwealth production flowed toward shared needs while British machinery, ships, services, and designs flowed outward.</text>
</svg>
