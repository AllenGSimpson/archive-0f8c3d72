<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Indian Ocean Defence White Paper hierarchy</title><desc id="desc">The White Paper divides Britain's Indian Ocean commitments into directly held positions, treaty-protected governments, strategic associates, and areas outside British obligation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13242d"/><stop offset="1" stop-color="#080d12"/></linearGradient><style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.a{fill:#24362b;stroke:#7e9d79;stroke-width:2}.b{fill:#1b303a;stroke:#6c8796;stroke-width:2}.c{fill:#302b25;stroke:#bf925d;stroke-width:2}.d0{fill:#38272a;stroke:#aa6d70;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f1cf78;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c4ced4}</style></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="50" y="62" class="h">Indian Ocean Defence White Paper, 1952</text><text x="50" y="92" class="s">Four categories replaced one undifferentiated claim to defend India</text>
  <g transform="translate(50 135)"><rect class="a" width="1100" height="105" rx="9"/><text x="25" y="34" class="tag">1 · DIRECTLY HELD</text><text x="25" y="72" class="t">Ceylon · Colombo · Trincomalee · Maldives · British facilities and defined defense districts</text></g>
  <g transform="translate(100 265)"><rect class="b" width="1000" height="105" rx="9"/><text x="25" y="34" class="tag">2 · PROTECTED BY TREATY</text><text x="25" y="72" class="t">Madras · Mysore · Travancore-Cochin · Maratha States Union · later protected governments</text></g>
  <g transform="translate(150 395)"><rect class="c" width="900" height="105" rx="9"/><text x="25" y="34" class="tag">3 · STRATEGICALLY ASSOCIATED</text><text x="25" y="72" class="t">Selected western Muslim and Sikh authorities · princes · transit and communications partners</text></g>
  <g transform="translate(200 525)"><rect class="d0" width="800" height="105" rx="9"/><text x="25" y="34" class="tag">4 · OUTSIDE BRITISH OBLIGATION</text><text x="25" y="72" class="t">Reconquest of Delhi or Bengal · one India restored · every warlord, communal war, or dynastic conflict</text></g>
</svg>
