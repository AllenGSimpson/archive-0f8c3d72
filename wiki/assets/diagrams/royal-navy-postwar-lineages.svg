    <g><rect x="180" y="424" width="185" height="47" rx="11" fill="#303d48" stroke="#647b91"/><text x="196" y="450" fill="#fff" font-size="15" font-weight="700">Battle · 24</text><text x="196" y="466" fill="#c8d0d6" font-size="12">1944–50</text></g>
