    <g><rect x="965" y="562" width="155" height="47" rx="11" fill="#363c48" stroke="#6c7891"/><text x="981" y="588" fill="#fff" font-size="15" font-weight="700">Trafalgar · 4</text><text x="981" y="604" fill="#c8ccd5" font-size="12">1981–85</text></g>
    <g><rect x="475" y="631" width="645" height="47" rx="11" fill="#40391f" stroke="#9f7b3b"/><text x="493" y="657" fill="#fff" font-size="15" font-weight="700">Round Table · Fearless · Ocean · Commonwealth Heavy Landing Ship</text><text x="493" y="673" fill="#d7caa7" font-size="12">1958–85 · logistic landing, docks, helicopters, vehicles</text></g>
