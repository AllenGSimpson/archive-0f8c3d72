    <g><rect x="470" y="217" width="235" height="47" rx="11" fill="#493239" stroke="#a25c72"/><text x="488" y="243" fill="#fff" font-size="16" font-weight="700">Malta · New Zealand</text><text x="488" y="259" fill="#d7c3c9" font-size="12">1958–61</text></g>
    <g><rect x="775" y="217" width="255" height="47" rx="11" fill="#493239" stroke="#a25c72"/><text x="793" y="243" fill="#fff" font-size="16" font-weight="700">Commonwealth · Dominion</text><text x="793" y="259" fill="#d7c3c9" font-size="12">1973–77</text></g>
    <g><rect x="885" y="286" width="235" height="47" rx="11" fill="#2d3f4d" stroke="#638ea5"/><text x="903" y="312" fill="#fff" font-size="16" font-weight="700">Invincible · three ships</text><text x="903" y="328" fill="#c3d0d7" font-size="12">1978–84</text></g>
