<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Royal Navy postwar lineages, 1944 to 1985</title><desc id="desc">Timeline bands for British capital ships, carriers, cruisers, escorts, submarines, and amphibious ships.</desc>
  <rect width="1200" height="720" rx="24" fill="#0e171c"/>
  <text x="58" y="60" fill="#f1eee5" font-family="Georgia,serif" font-size="38">Royal Navy lineages · 1944–1985</text>
  <text x="58" y="94" fill="#b7c3ca" font-family="Arial,sans-serif" font-size="18">Commissioning bands from the controlling naval register</text>
  <line x1="180" y1="130" x2="1120" y2="130" stroke="#6a8997" stroke-width="3"/>
  <g fill="#aab9c0" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><text x="180" y="118">1944</text><text x="350" y="118">1952</text><text x="515" y="118">1960</text><text x="680" y="118">1968</text><text x="845" y="118">1976</text><text x="1010" y="118">1984</text><text x="1120" y="118">1985</text></g>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e7bd61"><text x="58" y="177">ARMORED SHIPS</text><text x="58" y="246">FLEET CARRIERS</text><text x="58" y="315">LIGHT CARRIERS</text><text x="58" y="384">CRUISERS</text><text x="58" y="453">DESTROYERS</text><text x="58" y="522">FRIGATES</text><text x="58" y="591">SUBMARINES</text><text x="58" y="660">AMPHIBIOUS</text></g>
  <g font-family="Arial,sans-serif">
