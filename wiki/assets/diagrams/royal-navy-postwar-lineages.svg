    <g><rect x="535" y="493" width="165" height="47" rx="11" fill="#294047" stroke="#598994"/><text x="551" y="519" fill="#fff" font-size="14" font-weight="700">Rothesay · 20</text><text x="551" y="535" fill="#c4d1d5" font-size="12">1958–65</text></g>
    <g><rect x="700" y="493" width="190" height="47" rx="11" fill="#294047" stroke="#598994"/><text x="716" y="519" fill="#fff" font-size="14" font-weight="700">Leander · 26</text><text x="716" y="535" fill="#c4d1d5" font-size="12">1962–73</text></g>
    <g><rect x="890" y="493" width="230" height="47" rx="11" fill="#294047" stroke="#598994"/><text x="906" y="519" fill="#fff" font-size="14" font-weight="700">Broadsword · 18</text><text x="906" y="535" fill="#c4d1d5" font-size="12">1975–85</text></g>
    <g><rect x="415" y="562" width="245" height="47" rx="11" fill="#363c48" stroke="#6c7891"/><text x="431" y="588" fill="#fff" font-size="15" font-weight="700">Oberon · 24</text><text x="431" y="604" fill="#c8ccd5" font-size="12">1959–72 · conventional</text></g>
    <g><rect x="575" y="562" width="260" height="47" rx="11" fill="#363c48" stroke="#6c7891"/><text x="591" y="588" fill="#fff" font-size="15" font-weight="700">Valiant · Churchill · 12 SSN</text><text x="591" y="604" fill="#c8ccd5" font-size="12">1963–77</text></g>
