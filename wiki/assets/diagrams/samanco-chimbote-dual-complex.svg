<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Samanco-Chimbote dual complex</title><desc id="desc">Conceptual division between Chimbote commercial and industrial functions and Samanco naval access beneath Peruvian sovereignty.</desc>
  <defs><style>.h{font:bold 38px Georgia,serif;fill:#efd274}.s{font:21px Arial,sans-serif;fill:#d1d0c7}.l{font:bold 27px Arial,sans-serif;fill:#fff}.b{stroke:#c5c8c0;stroke-width:2;rx:18}.line{stroke:#899e95;stroke-width:5;fill:none}</style></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">ONE CORRIDOR, TWO FUNCTIONS</text><text x="58" y="103" class="s">Commercial visibility at Chimbote; controlled military access at Samanco</text>
  <rect x="105" y="165" width="440" height="330" class="b" fill="#2f4650"/><text x="325" y="218" text-anchor="middle" class="l">CHIMBOTE</text><text x="325" y="268" text-anchor="middle" class="s">Cargo handling - fisheries - steel</text><text x="325" y="307" text-anchor="middle" class="s">warehouses - civilian repair</text><text x="325" y="346" text-anchor="middle" class="s">urban labor - rail and road links</text><text x="325" y="410" text-anchor="middle" class="s">Japanese commerce is public</text><text x="325" y="447" text-anchor="middle" class="s">and legally ordinary</text>
  <rect x="655" y="165" width="440" height="330" class="b" fill="#3e3b49"/><text x="875" y="218" text-anchor="middle" class="l">SAMANCO</text><text x="875" y="268" text-anchor="middle" class="s">Naval pier - fuel - workshops</text><text x="875" y="307" text-anchor="middle" class="s">signals - weather - patrol aviation</text><text x="875" y="346" text-anchor="middle" class="s">hospital - rescue - training</text><text x="875" y="410" text-anchor="middle" class="s">Japanese access is rotational</text><text x="875" y="447" text-anchor="middle" class="s">and politically contested</text>
  <path d="M545 330h110" class="line"/><rect x="190" y="555" width="820" height="105" class="b" fill="#54382f"/><text x="600" y="597" text-anchor="middle" class="l">PERUVIAN SOVEREIGNTY</text><text x="600" y="636" text-anchor="middle" class="s">Land - police - fixed defenses - command - customs authority</text><path d="M325 495v60M875 495v60" class="line"/>
</svg>
