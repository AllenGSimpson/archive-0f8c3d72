    <rect x="245" y="350" width="280" height="75" rx="14" fill="#3d3330" stroke="#ca9c73" stroke-width="3"/><text x="385" y="381" text-anchor="middle" fill="#fff" font-size="20">LÉOPOLDVILLE</text><text x="385" y="406" text-anchor="middle" fill="#f1dfd1" font-size="15">southern historic districts</text>
    <rect x="740" y="92" width="300" height="75" rx="14" fill="#283a31" stroke="#87b993" stroke-width="3"/><text x="890" y="123" text-anchor="middle" fill="#fff" font-size="20">HIGH-GROUND KONGOSTADT</text><text x="890" y="148" text-anchor="middle" fill="#def0e2" font-size="15">government · port · grid control</text>
