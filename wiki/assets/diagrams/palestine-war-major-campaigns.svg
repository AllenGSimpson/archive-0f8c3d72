<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Major campaigns of the Palestine War</title>
  <desc id="desc">A chronological diagram connecting coastal Israeli victories, Jordanian highland victories, the southern campaign, and the Amman Settlement.</desc>
  <rect width="1120" height="620" fill="#111713"/>
  <text x="560" y="50" fill="#e9e1cf" font-family="Georgia,serif" font-size="29" text-anchor="middle">Major campaigns of the Palestine War</text>
  <text x="560" y="78" fill="#a8aea1" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">OPERATIONAL SEQUENCE · 1947–1950</text>
  <path d="M115 300H1005" stroke="#7e876f" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="140" cy="300" r="13" fill="#c7ab69"/><text x="140" y="340" fill="#ddd5c2" font-size="13">Nov. 1947</text>
    <rect x="55" y="145" width="210" height="110" rx="5" fill="#202824" stroke="#8d8e72"/>
    <text x="160" y="177" fill="#f0eadc" font-family="Georgia,serif" font-size="19">Mandate collapse</text><text x="160" y="204" fill="#bdc2b6" font-size="12">roads · convoys · militias</text><text x="160" y="225" fill="#bdc2b6" font-size="12">fragmented public services</text>
    <circle cx="350" cy="300" r="13" fill="#71a9bb"/><text x="350" y="340" fill="#ddd5c2" font-size="13">Apr.–May 1948</text>
    <rect x="275" y="355" width="230" height="125" rx="5" fill="#172b33" stroke="#5e9caf"/>
    <text x="390" y="388" fill="#f0eadc" font-family="Georgia,serif" font-size="19">Coastal victories</text><text x="390" y="415" fill="#b9d3da" font-size="12">Haifa port secured</text><text x="390" y="436" fill="#b9d3da" font-size="12">Jaffa captured beside Tel Aviv</text><text x="390" y="457" fill="#b9d3da" font-size="12">Israel retains the coastal core</text>
    <circle cx="575" cy="300" r="13" fill="#b28d63"/><text x="575" y="340" fill="#ddd5c2" font-size="13">May–Jul. 1948</text>
    <rect x="485" y="120" width="250" height="135" rx="5" fill="#33271f" stroke="#b28d63"/>
    <text x="610" y="153" fill="#f0eadc" font-family="Georgia,serif" font-size="19">Highland victories</text><text x="610" y="180" fill="#d7c4ac" font-size="12">Etzion Bloc falls</text><text x="610" y="201" fill="#d7c4ac" font-size="12">Latrun road position holds</text><text x="610" y="222" fill="#d7c4ac" font-size="12">Old City under Arab Legion</text>
    <circle cx="790" cy="300" r="13" fill="#9b7a58"/><text x="790" y="340" fill="#ddd5c2" font-size="13">1948–1950</text>
    <rect x="700" y="355" width="230" height="125" rx="5" fill="#2d251d" stroke="#9b7a58"/>
    <text x="815" y="388" fill="#f0eadc" font-family="Georgia,serif" font-size="19">Southern campaign</text><text x="815" y="415" fill="#d7c4ac" font-size="12">Gaza–Rafah system survives</text><text x="815" y="436" fill="#d7c4ac" font-size="12">Israel denied full Negev</text><text x="815" y="457" fill="#d7c4ac" font-size="12">territory passes to Jordan</text>
    <circle cx="1000" cy="300" r="13" fill="#c7ab69"/><text x="1000" y="340" fill="#ddd5c2" font-size="13">1950</text>
    <rect x="875" y="120" width="205" height="135" rx="5" fill="#302b20" stroke="#c7ab69" stroke-width="2"/>
    <text x="977" y="153" fill="#f0eadc" font-family="Georgia,serif" font-size="19">Amman Settlement</text><text x="977" y="180" fill="#e0cfaa" font-size="12">coastal Israel</text><text x="977" y="201" fill="#e0cfaa" font-size="12">enlarged Jordan</text><text x="977" y="222" fill="#e0cfaa" font-size="12">Jerusalem under Jordan</text>
  </g>
  <text x="560" y="555" fill="#9da59c" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">The diagram records the established strategic result; exact operational lines and several campaign sequences remain open.</text>
</svg>
