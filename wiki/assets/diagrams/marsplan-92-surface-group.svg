<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Marsplan 92 surface-group deployment</title>
  <desc id="desc">Operational sequence and schematic layout of the five Marsplan 92 descending elements, showing the remote reactor, connected pressure modules, vehicle park, and crew lander.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172738"/><stop offset="1" stop-color="#513429"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#fff4e6}.sub{font:18px Arial,sans-serif;fill:#d8c1af;letter-spacing:2px}.box{fill:#182a36;stroke-width:3}.n1{stroke:#e2bd55}.n2{stroke:#6bb0d3}.n3{stroke:#8cbc7e}.n4{stroke:#c98fd0}.n5{stroke:#e27260}.num{font:700 30px Arial,sans-serif;fill:#fff}.head{font:700 21px Arial,sans-serif;fill:#fff}.copy{font:16px Arial,sans-serif;fill:#cbd5d9}.surface{stroke:#b77b5b;stroke-width:5;fill:none}.corridor{stroke:#d8c576;stroke-width:12;stroke-dasharray:12 8;fill:none}.power{stroke:#e2bd55;stroke-width:5;fill:none}.label{font:700 16px Arial,sans-serif;fill:#f4d977}.foot{font:16px Arial,sans-serif;fill:#d4c3b5}</style></defs>
  <rect width="1800" height="1000" fill="url(#sky)"/><text x="900" y="62" text-anchor="middle" class="title">MARSPLAN 92 · SURFACE-GROUP DEPLOYMENT</text><text x="900" y="100" text-anchor="middle" class="sub">FIVE DESCENDING ELEMENTS · THARSIS–OLYMPUS REGION · 1993</text>
  <g transform="translate(70 145)"><rect width="310" height="185" rx="20" class="box n1"/><text x="25" y="44" class="num">1</text><text x="70" y="42" class="head">POWER &amp; CONSTRUCTION</text><text x="25" y="84" class="copy">Surface reactor · beacon · radar</text><text x="25" y="113" class="copy">Excavators · cables · inspection robots</text><text x="25" y="150" class="label">MISSION PROCEEDS ONLY AFTER CHECKOUT</text></g>
  <g transform="translate(405 145)"><rect width="310" height="185" rx="20" class="box n2"/><text x="25" y="44" class="num">2</text><text x="70" y="42" class="head">HABITATION &amp; MEDICAL</text><text x="25" y="84" class="copy">Command · galley · sickbay · bunks</text><text x="25" y="113" class="copy">Life support · hygiene · two airlocks</text><text x="25" y="150" class="label">CENTRAL OCCUPIED MODULE</text></g>
  <g transform="translate(740 145)"><rect width="310" height="185" rx="20" class="box n3"/><text x="25" y="44" class="num">3</text><text x="70" y="42" class="head">WORKSHOP &amp; STORES</text><text x="25" y="84" class="copy">Machine tools · repair benches · labs</text><text x="25" y="113" class="copy">Spares · food · emergency life support</text><text x="25" y="150" class="label">BASE MAINTENANCE CAPACITY</text></g>
  <g transform="translate(1075 145)"><rect width="310" height="185" rx="20" class="box n4"/><text x="25" y="44" class="num">4</text><text x="70" y="42" class="head">VEHICLES &amp; FIELD OPS</text><text x="25" y="84" class="copy">Pressurized rovers · tractors · trailers</text><text x="25" y="113" class="copy">Drills · repeaters · navigation beacons</text><text x="25" y="150" class="label">OLYMPUS TRAVERSE EQUIPMENT</text></g>
  <g transform="translate(1410 145)"><rect width="310" height="185" rx="20" class="box n5"/><text x="25" y="44" class="num">5</text><text x="70" y="42" class="head">CREW DESCENT / ASCENT</text><text x="25" y="84" class="copy">Crew arrives only after systems report</text><text x="25" y="113" class="copy">Habitat · lifeboat · return to orbit</text><text x="25" y="150" class="label">FINAL DESCENDING ELEMENT</text></g>
  <path d="M80 720 Q300 680 520 710 T950 700 T1380 710 T1740 690" class="surface"/>
  <g transform="translate(180 535)"><rect width="150" height="100" rx="16" class="box n1"/><rect x="45" y="-45" width="60" height="45" fill="#d0b753"/><text x="75" y="135" text-anchor="middle" class="label">REACTOR SITE</text></g>
  <g transform="translate(690 520)"><rect width="225" height="135" rx="28" class="box n2"/><text x="112" y="70" text-anchor="middle" class="head">HABITATION</text></g>
  <g transform="translate(1010 555)"><rect width="220" height="120" rx="24" class="box n3"/><text x="110" y="65" text-anchor="middle" class="head">WORKSHOP</text></g>
  <g transform="translate(1370 590)"><rect width="160" height="85" rx="18" class="box n5"/><path d="M25 85 L0 135 M135 85 L160 135" stroke="#e27260" stroke-width="4"/><text x="80" y="50" text-anchor="middle" class="head">CREW CRAFT</text></g>
  <g transform="translate(1060 755)"><rect width="190" height="62" rx="24" class="box n4"/><circle cx="35" cy="68" r="15" fill="#8da0a9"/><circle cx="155" cy="68" r="15" fill="#8da0a9"/><text x="95" y="40" text-anchor="middle" class="head">VEHICLE PARK</text></g>
  <path d="M915 588 C955 585 980 605 1010 615" class="corridor"/><path d="M915 620 C1060 725 1240 705 1370 630" class="corridor"/><path d="M330 585 C470 575 550 580 690 588" class="power"/>
  <text x="490" y="555" text-anchor="middle" class="label">POWER &amp; DATA · SEVERAL HUNDRED METRES</text><text x="1070" y="485" text-anchor="middle" class="label">FALTGÄNGE · ISOLATABLE BELLOWS PRESSURE PASSAGES</text>
  <text x="900" y="930" text-anchor="middle" class="foot">Modules may land 50–150 metres apart. Pressure doors isolate every connecting passage; the reactor remains outside the occupied pressure complex.</text>
</svg>
