<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
  <title id="title">American corporate Mars transportation architecture</title>
  <desc id="desc">Flow diagram of American corporate Mars operations from Earth and Orbital Port Columbia through an orbit-assembled transfer vehicle to Mars orbit, a Marsplane, cargo landers, and the Amazonis outpost.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071722"/><stop offset="1" stop-color="#203848"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f3f7f8}.sub{font:18px Arial,sans-serif;fill:#b8cbd4;letter-spacing:2px}.box{fill:#102a3a;stroke:#66b8df;stroke-width:3}.mars{fill:#38251f;stroke:#d7785e;stroke-width:3}.head{font:700 25px Arial,sans-serif;fill:#fff}.tag{font:700 15px Arial,sans-serif;fill:#87d2f2;letter-spacing:1.3px}.copy{font:17px Arial,sans-serif;fill:#ccd9df}.arrow{stroke:#d4bd68;stroke-width:5;fill:none;marker-end:url(#head)}.thin{stroke:#7d98a5;stroke-width:2;fill:none}.foot{font:16px Arial,sans-serif;fill:#b9c9d0}</style><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d4bd68"/></marker></defs>
  <rect width="1800" height="950" fill="url(#bg)"/><text x="900" y="64" text-anchor="middle" class="title">AMERICAN CORPORATE MARS ARCHITECTURE</text><text x="900" y="102" text-anchor="middle" class="sub">SEPARATE VEHICLES FOR EARTH ACCESS · TRANSIT · MARS ENTRY · SURFACE BUILDUP</text>
  <g transform="translate(70 190)"><rect width="320" height="210" rx="22" class="box"/><text x="25" y="48" class="head">EARTH–ORBIT ACCESS</text><text x="25" y="82" class="tag">MIXED TRANSPORT SYSTEM</text><text x="25" y="125" class="copy">Spaceplanes: crews, servicing,</text><text x="25" y="154" class="copy">high-value and return cargo</text><text x="25" y="183" class="copy">Vertical rockets: bulk and propellant</text></g>
  <g transform="translate(500 190)"><rect width="320" height="210" rx="22" class="box"/><text x="25" y="48" class="head">COLUMBIA &amp; ANNEX</text><text x="25" y="82" class="tag">ASSEMBLY AND TRAFFIC HUB</text><text x="25" y="125" class="copy">Crew transfer · docking · checkout</text><text x="25" y="154" class="copy">Consortium modules and stores</text><text x="25" y="183" class="copy">Interfaces with Liberty Yard</text></g>
  <g transform="translate(930 190)"><rect width="350" height="210" rx="22" class="box"/><text x="25" y="48" class="head">TRANSFER VEHICLE</text><text x="25" y="82" class="tag">ORBIT-ASSEMBLED INTERPLANETARY STAGE</text><text x="25" y="125" class="copy">Transit habitat · storm shelter</text><text x="25" y="154" class="copy">Power · propulsion · communications</text><text x="25" y="183" class="copy">Docking for Mars vehicles</text></g>
  <g transform="translate(1410 155)"><rect width="320" height="280" rx="22" class="mars"/><text x="25" y="48" class="head">MARS ORBIT</text><text x="25" y="82" class="tag" fill="#ef9a83">RENDEZVOUS AND RETURN</text><text x="25" y="125" class="copy">Transfer vehicle remains in orbit</text><text x="25" y="154" class="copy">Marsplane or ascent craft docks</text><text x="25" y="183" class="copy">Relay and navigation coverage</text><path d="M90 240 Q160 190 230 240 Q160 275 90 240" fill="#8ba7b4"/><circle cx="160" cy="240" r="18" fill="#d7785e"/></g>
  <path d="M390 295 H500" class="arrow"/><path d="M820 295 H930" class="arrow"/><path d="M1280 295 H1410" class="arrow"/>
  <g transform="translate(955 570)"><path d="M0 80 Q150 -10 300 80 L250 135 H50 Z" class="box"/><rect x="80" y="135" width="30" height="55" fill="#8da5b0"/><rect x="190" y="135" width="30" height="55" fill="#8da5b0"/><text x="150" y="235" text-anchor="middle" class="head">MARSPLANE</text><text x="150" y="265" text-anchor="middle" class="copy">Lifting-body entry · rocket final approach</text></g>
  <g transform="translate(1390 570)"><rect width="340" height="240" rx="22" class="mars"/><text x="25" y="48" class="head">AMAZONIS OUTPOST</text><text x="25" y="82" class="tag" fill="#ef9a83">WEST OR NORTHWEST OF OLYMPUS</text><text x="25" y="125" class="copy">Branded modules · prepared landing lane</text><text x="25" y="154" class="copy">Power · propellant · medicine · labs</text><text x="25" y="183" class="copy">Equipment yards and later additions</text><text x="25" y="212" class="copy">Separate owners under common standards</text></g>
  <g transform="translate(80 555)"><rect width="640" height="255" rx="22" class="mars"/><text x="25" y="48" class="head">STAGED SURFACE PREPARATION</text><text x="25" y="82" class="tag" fill="#ef9a83">1994 RECONNAISSANCE · 1996 CARGO · 1997–98 BUILDUP</text><text x="25" y="125" class="copy">Orbiters: mapping, weather, communications, navigation</text><text x="25" y="157" class="copy">First cargo: power, beacons, construction vehicles, emergency stores</text><text x="25" y="189" class="copy">Later cargo: habitat, return system, propellant equipment, landing lane</text><text x="25" y="221" class="copy">Crew commits only after independent power and return capability exist</text></g>
  <path d="M1550 435 C1520 500 1450 525 1300 650" class="arrow"/><path d="M1255 680 H1390" class="arrow"/><path d="M720 680 H955" class="arrow"/>
  <text x="900" y="900" text-anchor="middle" class="foot">The system preserves the American lifting-body tradition while ending the attempt to make one terrestrial spaceplane perform every stage of a planetary mission.</text>
</svg>
