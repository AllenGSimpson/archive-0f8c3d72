<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Five extraterrestrial settlement policies</title>
  <desc id="desc">Comparison of the German, American, Japanese, Commonwealth, and Latin approaches to settlement beyond Earth.</desc>
  <rect width="1200" height="700" fill="#08131d"/>
  <text x="600" y="55" fill="#f2e8d0" font-family="Georgia,serif" font-size="34" text-anchor="middle">FIVE POLITICS OF PERMANENCE</text>
  <text x="600" y="88" fill="#aebcc6" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Different answers to who settles, who governs, and what settlement is for</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(38 125)"><rect width="214" height="470" rx="10" fill="#102434" stroke="#3d7592"/><text x="107" y="42" fill="#d9ecf5" font-size="20" font-weight="bold" text-anchor="middle">GERMANY</text><text x="107" y="70" fill="#8fc0d8" font-size="13" text-anchor="middle">ORDERED EXPANSION</text><path d="M25 94h164" stroke="#3d7592"/><text x="22" y="126" fill="#f2e8d0" font-size="14">Social unit</text><text x="22" y="151" fill="#bac8d1" font-size="13">Selected technical families</text><text x="22" y="196" fill="#f2e8d0" font-size="14">Institution</text><text x="22" y="221" fill="#bac8d1" font-size="13">Integrated state system</text><text x="22" y="266" fill="#f2e8d0" font-size="14">Material center</text><text x="22" y="291" fill="#bac8d1" font-size="13">Industry and shipbuilding</text><text x="22" y="336" fill="#f2e8d0" font-size="14">Political promise</text><text x="22" y="361" fill="#bac8d1" font-size="13">Civilizational continuity</text><text x="22" y="406" fill="#f2e8d0" font-size="14">Tension</text><text x="22" y="431" fill="#bac8d1" font-size="13">Permanence through</text><text x="22" y="451" fill="#bac8d1" font-size="13">authoritarian selection</text></g>
    <g transform="translate(266 125)"><rect width="214" height="470" rx="10" fill="#102434" stroke="#4d87a7"/><text x="107" y="42" fill="#d9ecf5" font-size="20" font-weight="bold" text-anchor="middle">UNITED STATES</text><text x="107" y="70" fill="#8fc0d8" font-size="13" text-anchor="middle">COMMERCIAL FRONTIER</text><path d="M25 94h164" stroke="#4d87a7"/><text x="22" y="126" fill="#f2e8d0" font-size="14">Social unit</text><text x="22" y="151" fill="#bac8d1" font-size="13">Employees and households</text><text x="22" y="196" fill="#f2e8d0" font-size="14">Institution</text><text x="22" y="221" fill="#bac8d1" font-size="13">Companies under federal law</text><text x="22" y="266" fill="#f2e8d0" font-size="14">Material center</text><text x="22" y="291" fill="#bac8d1" font-size="13">Traffic and mixed employers</text><text x="22" y="336" fill="#f2e8d0" font-size="14">Political promise</text><text x="22" y="361" fill="#bac8d1" font-size="13">Opportunity and choice</text><text x="22" y="406" fill="#f2e8d0" font-size="14">Tension</text><text x="22" y="431" fill="#bac8d1" font-size="13">Choice under control of</text><text x="22" y="451" fill="#bac8d1" font-size="13">housing and return passage</text></g>
    <g transform="translate(494 125)"><rect width="214" height="470" rx="10" fill="#102434" stroke="#b18a47"/><text x="107" y="42" fill="#f6e3b7" font-size="20" font-weight="bold" text-anchor="middle">JAPAN</text><text x="107" y="70" fill="#d6b872" font-size="13" text-anchor="middle">MACHINE PREPARATION</text><path d="M25 94h164" stroke="#b18a47"/><text x="22" y="126" fill="#f2e8d0" font-size="14">Social unit</text><text x="22" y="151" fill="#bac8d1" font-size="13">Selected crews first</text><text x="22" y="196" fill="#f2e8d0" font-size="14">Institution</text><text x="22" y="221" fill="#bac8d1" font-size="13">Imperial command and firms</text><text x="22" y="266" fill="#f2e8d0" font-size="14">Material center</text><text x="22" y="291" fill="#bac8d1" font-size="13">Robots, relays, verified plant</text><text x="22" y="336" fill="#f2e8d0" font-size="14">Political promise</text><text x="22" y="361" fill="#bac8d1" font-size="13">Avoid preventable risk</text><text x="22" y="406" fill="#f2e8d0" font-size="14">Tension</text><text x="22" y="431" fill="#bac8d1" font-size="13">Sphere contribution beneath</text><text x="22" y="451" fill="#bac8d1" font-size="13">Japanese primacy</text></g>
    <g transform="translate(722 125)"><rect width="214" height="470" rx="10" fill="#102434" stroke="#768ba8"/><text x="107" y="42" fill="#e0e7f2" font-size="20" font-weight="bold" text-anchor="middle">COMMONWEALTH</text><text x="107" y="70" fill="#aebed6" font-size="13" text-anchor="middle">SOVEREIGN SERVICE</text><path d="M25 94h164" stroke="#768ba8"/><text x="22" y="126" fill="#f2e8d0" font-size="14">Social unit</text><text x="22" y="151" fill="#bac8d1" font-size="13">Corps, specialists, families</text><text x="22" y="196" fill="#f2e8d0" font-size="14">Institution</text><text x="22" y="221" fill="#bac8d1" font-size="13">Distributed public workshare</text><text x="22" y="266" fill="#f2e8d0" font-size="14">Material center</text><text x="22" y="291" fill="#bac8d1" font-size="13">Endurance and networks</text><text x="22" y="336" fill="#f2e8d0" font-size="14">Political promise</text><text x="22" y="361" fill="#bac8d1" font-size="13">Independent common capacity</text><text x="22" y="406" fill="#f2e8d0" font-size="14">Tension</text><text x="22" y="431" fill="#bac8d1" font-size="13">Shared project built upon</text><text x="22" y="451" fill="#bac8d1" font-size="13">unequal contributors</text></g>
    <g transform="translate(950 125)"><rect width="214" height="470" rx="10" fill="#102434" stroke="#967c55"/><text x="107" y="42" fill="#f1dfc0" font-size="20" font-weight="bold" text-anchor="middle">LATIN COMMUNITY</text><text x="107" y="70" fill="#d0ae79" font-size="13" text-anchor="middle">EXPLORATORY PRESENCE</text><path d="M25 94h164" stroke="#967c55"/><text x="22" y="126" fill="#f2e8d0" font-size="14">Social unit</text><text x="22" y="146" fill="#bac8d1" font-size="13">Technical and religious</text><text x="22" y="166" fill="#bac8d1" font-size="13">community</text><text x="22" y="196" fill="#f2e8d0" font-size="14">Institution</text><text x="22" y="221" fill="#bac8d1" font-size="13">Multinational workshare</text><text x="22" y="266" fill="#f2e8d0" font-size="14">Material center</text><text x="22" y="291" fill="#bac8d1" font-size="13">Science and exploration ships</text><text x="22" y="336" fill="#f2e8d0" font-size="14">Political promise</text><text x="22" y="361" fill="#bac8d1" font-size="13">Presence with moral purpose</text><text x="22" y="406" fill="#f2e8d0" font-size="14">Tension</text><text x="22" y="431" fill="#bac8d1" font-size="13">Common identity without</text><text x="22" y="451" fill="#bac8d1" font-size="13">common citizenship</text></g>
  </g>
  <path d="M110 635h980" stroke="#2f5367" stroke-width="2"/>
  <text x="600" y="670" fill="#9fb0ba" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">All five remain dependent upon Earth and preserve terrestrial nationality; none creates an independent off-world state by 2010.</text>
</svg>
