<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Technical Education and Apprenticeship Act pipeline</title><desc id="desc">The 1953 act linking schools, colleges, apprenticeships, Commonwealth scholarships, and strategic industries.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="32" font-weight="700">Technical Education and Apprenticeship Act · 1953</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">Education becomes an industrial route rather than a separate social service</text><g font-family="Arial,sans-serif"><rect x="70" y="190" width="220" height="154" rx="15" fill="#19303d" stroke="#638091"/><text x="180" y="225" fill="#d6c586" text-anchor="middle" font-size="17" font-weight="700">ENTRY ROUTES</text><text x="95" y="258" fill="#c3cdd1" font-size="14">• technical schools</text><text x="95" y="285" fill="#c3cdd1" font-size="14">• service training</text><text x="95" y="312" fill="#c3cdd1" font-size="14">• Commonwealth scholars</text><rect x="365" y="160" width="470" height="220" rx="16" fill="#263846" stroke="#d1b86d"/><text x="600" y="201" fill="#f0e8d5" text-anchor="middle" font-size="19" font-weight="700">SKILL FORMATION</text><g fill="#b9c5ca" font-size="14"><text x="400" y="239">Engineering colleges</text><text x="400" y="273">Industry-linked apprenticeships</text><text x="400" y="307">Instructor and standards programs</text><text x="400" y="341">Regional laboratories and workshops</text></g><rect x="910" y="190" width="220" height="154" rx="15" fill="#19303d" stroke="#638091"/><text x="1020" y="225" fill="#d6c586" text-anchor="middle" font-size="17" font-weight="700">QUALIFIED WORK</text><text x="935" y="258" fill="#c3cdd1" font-size="14">• skilled employment</text><text x="935" y="285" fill="#c3cdd1" font-size="14">• public corporations</text><text x="935" y="312" fill="#c3cdd1" font-size="14">• technical exporters</text><path d="M290 267H365M835 267H910" stroke="#b49a5a" stroke-width="4"/><path d="M350 257l15 10-15 10M895 257l15 10-15 10" fill="#b49a5a"/><text x="600" y="431" fill="#d6c586" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">STRATEGIC INDUSTRIES SUPPLIED</text><g fill="#20333f" stroke="#587382"><rect x="70" y="463" width="200" height="86" rx="11"/><rect x="285" y="463" width="200" height="86" rx="11"/><rect x="500" y="463" width="200" height="86" rx="11"/><rect x="715" y="463" width="200" height="86" rx="11"/><rect x="930" y="463" width="200" height="86" rx="11"/></g><g fill="#dce2e4" text-anchor="middle" font-size="14" font-weight="700"><text x="170" y="499">SHIPS &amp; AIRCRAFT</text><text x="385" y="499">RADAR &amp; SIGNALS</text><text x="600" y="499">POWER &amp; ATOMS</text><text x="815" y="499">MACHINES &amp; COMPUTING</text><text x="1030" y="499">CHEMISTRY &amp; MEDICINE</text></g><g fill="#9faeb6" text-anchor="middle" font-size="12"><text x="170" y="526">design · engines · repair</text><text x="385" y="526">electronics · telemetry</text><text x="600" y="526">grid · fuel · safety</text><text x="815" y="526">tools · accounts · control</text><text x="1030" y="526">materials · pharmaceuticals</text></g></g><text x="600" y="605" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">The later space programme drew upon personnel and institutions expanded four years before Raumbote I.</text></svg>
