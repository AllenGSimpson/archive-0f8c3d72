<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dominion Defence-in-Depth</title><desc id="desc">Canadian national survival doctrine showing warning and delay at the American frontier, dispersed government and logistics through the Shield, Rockies and Arctic, and reinforcement through Atlantic ports.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#162b38"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter><style>.ey{font:600 21px Arial,sans-serif;letter-spacing:5px;fill:#72d0df}.ttl{font:700 49px Georgia,serif;fill:#f3efe4}.sub{font:21px Arial,sans-serif;fill:#b8c5cc}.head{font:700 23px Arial,sans-serif;fill:#f5f0e6}.copy{font:18px Arial,sans-serif;fill:#c9d4d9}.tiny{font:16px Arial,sans-serif;fill:#aebcc3}.box{fill:#102732;stroke:#466979;stroke-width:2}.red{fill:#542c32;stroke:#bd6b70}.gold{fill:#4c4025;stroke:#c5a55a}.blue{fill:#173848;stroke:#68b9cd}.green{fill:#213f36;stroke:#73aa89}.arrow{stroke:#d9b96a;stroke-width:7;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#d9b96a"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="75" y="72" class="ey">CANADIAN STRATEGY · 1968–1988</text><text x="75" y="132" class="ttl">Dominion Defence-in-Depth</text><text x="75" y="174" class="sub">Survival by warning, time, distance, lawful continuity, and an Atlantic route that cannot be closed in one blow.</text>
  <g filter="url(#shadow)"><rect x="70" y="242" width="310" height="410" rx="24" class="box red"/><text x="100" y="290" class="head">1 · FRONTIER WARNING</text><text x="100" y="338" class="copy">Selected crossing delay</text><text x="100" y="376" class="copy">Air and lake surveillance</text><text x="100" y="414" class="copy">Exercise notification</text><text x="100" y="452" class="copy">Rapid mobilization</text><path d="M100 492H350" stroke="#8d5258"/><text x="100" y="530" class="tiny">Purpose: expose coercion early</text><text x="100" y="560" class="tiny">and prevent political surprise.</text>
  <rect x="455" y="242" width="310" height="410" rx="24" class="box gold"/><text x="485" y="290" class="head">2 · CONTINUITY</text><text x="485" y="338" class="copy">Dispersed government</text><text x="485" y="376" class="copy">Protected communications</text><text x="485" y="414" class="copy">Reserve fuel and stores</text><text x="485" y="452" class="copy">Militia and local services</text><path d="M485 492H735" stroke="#897540"/><text x="485" y="530" class="tiny">Purpose: deny decapitation</text><text x="485" y="560" class="tiny">after loss of the southern belt.</text>
  <rect x="840" y="242" width="310" height="410" rx="24" class="box blue"/><text x="870" y="290" class="head">3 · NATIONAL DEPTH</text><text x="870" y="338" class="copy">Canadian Shield</text><text x="870" y="376" class="copy">Rocky Mountains</text><text x="870" y="414" class="copy">Arctic air and supply routes</text><text x="870" y="452" class="copy">East–west corridor</text><path d="M870 492H1120" stroke="#3b7184"/><text x="870" y="530" class="tiny">Purpose: convert geography</text><text x="870" y="560" class="tiny">into occupation cost and time.</text>
  <rect x="1225" y="242" width="310" height="410" rx="24" class="box green"/><text x="1255" y="290" class="head">4 · ATLANTIC LINK</text><text x="1255" y="338" class="copy">Halifax and Saint John</text><text x="1255" y="376" class="copy">Newfoundland access</text><text x="1255" y="414" class="copy">Commonwealth shipping</text><text x="1255" y="452" class="copy">British reinforcement</text><path d="M1255 492H1505" stroke="#507c63"/><text x="1255" y="530" class="tiny">Purpose: keep the crisis</text><text x="1255" y="560" class="tiny">international and reversible.</text></g>
  <path d="M380 447H445M765 447H830M1150 447H1215" class="arrow"/><rect x="235" y="720" width="1130" height="92" rx="18" fill="#0d202a" stroke="#526f7b"/><text x="800" y="756" text-anchor="middle" class="head">DOCTRINAL END STATE</text><text x="800" y="790" text-anchor="middle" class="copy">A functioning Canadian government, an unconquered national depth, and time for diplomacy—not battlefield victory over America.</text>
</svg>
