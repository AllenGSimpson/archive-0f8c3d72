<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Japanese participation in the American opening</title><desc id="desc">Japanese institutions invest into American growth sectors while bounded gates admit selected nonvoting capital and joint ventures into Japan.</desc><rect width="1200" height="675" fill="#171316"/><text x="60" y="62" fill="#fff7ed" font-family="Georgia,serif" font-size="32">JAPANESE PARTICIPATION · CONTROLLED RECIPROCITY</text><text x="60" y="96" fill="#d6a7a7" font-family="Arial,sans-serif" font-size="17">Coordinated investment outward; bounded claims inward</text><rect x="55" y="145" width="410" height="440" rx="18" fill="#291c21" stroke="#ef4444" stroke-width="3"/><text x="260" y="194" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="29">JAPANESE SYSTEM</text><g font-family="Arial,sans-serif" font-size="17" fill="#fecaca"><text x="100" y="250">BANKS &amp; INSURERS</text><text x="100" y="300">TRADING COMPANIES</text><text x="100" y="350">PENSIONS &amp; EXPORTERS</text><text x="100" y="400">SINGAPORE OFFICES</text></g><rect x="735" y="145" width="410" height="440" rx="18" fill="#14243a" stroke="#60a5fa" stroke-width="3"/><text x="940" y="194" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="29">AMERICAN MARKET</text><g font-family="Arial,sans-serif" font-size="17" fill="#bfdbfe"><text x="790" y="250">SEMICONDUCTORS &amp; SOFTWARE</text><text x="790" y="300">MACHINE TOOLS &amp; AUTOS</text><text x="790" y="350">MEDIA &amp; TELECOM</text><text x="790" y="400">LOGISTICS &amp; SPACE</text></g><g stroke-width="5" fill="none"><path d="M465 280 C565 230 635 230 735 280" stroke="#fbbf24" marker-end="url(#j)"/><path d="M735 450 C635 510 565 510 465 450" stroke="#a7f3d0" marker-end="url(#j2)"/></g><text x="600" y="240" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="16">equities · funds · acquisitions</text><text x="600" y="535" text-anchor="middle" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="16">nonvoting claims · joint ventures · distribution</text><rect x="480" y="305" width="240" height="120" rx="14" fill="#24302c" stroke="#a7f3d0"/><text x="600" y="345" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">EXTERNAL-CAPITAL</text><text x="600" y="371" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">ZONES</text><text x="600" y="401" text-anchor="middle" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="14">profit without reorganization</text><defs><marker id="j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker><marker id="j2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a7f3d0"/></marker></defs></svg>
