<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Japanese corporate patronage</title><desc id="desc">Corporate resources move through development, careers, media, research, and civic institutions into a narrowed political field.</desc><rect width="1200" height="675" fill="#101720"/><text x="600" y="54" text-anchor="middle" fill="#efe3c5" font-family="Georgia,serif" font-size="31">From corporate self-defense to structural capture</text><g font-family="Arial,sans-serif"><rect x="55" y="125" width="240" height="110" rx="12" fill="#263d58" stroke="#79a7cf" stroke-width="3"/><text x="175" y="168" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">ECONOMIC POWER</text><text x="175" y="201" text-anchor="middle" fill="#dceaf5" font-size="16">credit · jobs · systems</text><rect x="350" y="95" width="500" height="250" rx="14" fill="#443452" stroke="#bb8fd0" stroke-width="3"/><text x="600" y="137" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">SPONSORSHIP CHANNELS</text><g fill="#eee0f4" font-size="18"><text x="405" y="185">• parties and campaigns</text><text x="405" y="225">• media and advertising</text><text x="405" y="265">• civic foundations</text><text x="640" y="185">• schools and scholarships</text><text x="640" y="225">• research institutes</text><text x="640" y="265">• development projects</text><text x="520" y="310">• careers, data, and technical advice</text></g><rect x="905" y="125" width="240" height="110" rx="12" fill="#465636" stroke="#aac87d" stroke-width="3"/><text x="1025" y="168" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">VIABLE POLITICS</text><text x="1025" y="201" text-anchor="middle" fill="#e7f0db" font-size="16">cooperative, national, credible</text><rect x="190" y="430" width="820" height="150" rx="14" fill="#71303a" stroke="#df9c91" stroke-width="3"/><text x="600" y="472" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">STRUCTURAL CAPTURE</text><text x="600" y="514" text-anchor="middle" fill="#f7e0df" font-size="18">The state retains elections, ministries, courts, and citizenship.</text><text x="600" y="548" text-anchor="middle" fill="#f7e0df" font-size="18">Serious government becomes difficult without corporate consent.</text><g stroke="#d8b765" stroke-width="6" marker-end="url(#c)"><path d="M295 180 H340"/><path d="M850 180 H895"/><path d="M1025 235 C1025 350 900 390 800 425"/></g></g><defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d8b765"/></marker></defs></svg>
