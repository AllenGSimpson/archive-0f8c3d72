<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Everyday life from 1950 to 1985</title><desc id="desc">Four phases move from repair and reconstruction through applied systems and household electronics to competing platforms.</desc><defs><style>.bg{fill:#11161b}.line{stroke:#a78f55;stroke-width:5}.node{fill:#1c252c;stroke:#607887;stroke-width:2}.t{fill:#f4f0e7;font:700 23px Georgia,serif}.k{fill:#d6b969;font:700 15px Arial,sans-serif;letter-spacing:2px}.s{fill:#c8d1d5;font:16px Arial,sans-serif}.n{fill:#0f1418;stroke:#a78f55;stroke-width:3}</style></defs><rect width="1200" height="650" class="bg"/><text x="600" y="50" text-anchor="middle" class="t">EVERYDAY MATERIAL CHANGE, 1950–1985</text><text x="600" y="79" text-anchor="middle" class="s">A shared technical sequence with different national institutions and household meanings</text><line x1="150" y1="175" x2="1050" y2="175" class="line"/><g><circle cx="150" cy="175" r="24" class="n"/><circle cx="450" cy="175" r="24" class="n"/><circle cx="750" cy="175" r="24" class="n"/><circle cx="1050" cy="175" r="24" class="n"/></g><g><rect x="40" y="225" width="220" height="195" rx="10" class="node"/><text x="150" y="260" text-anchor="middle" class="k">1950</text><text x="150" y="295" text-anchor="middle" class="t">Repair economy</text><text x="150" y="332" text-anchor="middle" class="s">Housing · rationing</text><text x="150" y="359" text-anchor="middle" class="s">surplus vehicles</text><text x="150" y="386" text-anchor="middle" class="s">shops · public works</text><rect x="340" y="225" width="220" height="195" rx="10" class="node"/><text x="450" y="260" text-anchor="middle" class="k">1955–1970</text><text x="450" y="295" text-anchor="middle" class="t">Applied systems</text><text x="450" y="332" text-anchor="middle" class="s">Reliability · cold chain</text><text x="450" y="359" text-anchor="middle" class="s">transistors · logistics</text><text x="450" y="386" text-anchor="middle" class="s">technical education</text><rect x="640" y="225" width="220" height="195" rx="10" class="node"/><text x="750" y="260" text-anchor="middle" class="k">1970–1980</text><text x="750" y="295" text-anchor="middle" class="t">Electronic home</text><text x="750" y="332" text-anchor="middle" class="s">Color TV · cassettes</text><text x="750" y="359" text-anchor="middle" class="s">calculators · video</text><text x="750" y="386" text-anchor="middle" class="s">personal computers</text><rect x="940" y="225" width="220" height="195" rx="10" class="node"/><text x="1050" y="260" text-anchor="middle" class="k">1980–1985</text><text x="1050" y="295" text-anchor="middle" class="t">Platform society</text><text x="1050" y="332" text-anchor="middle" class="s">Software · support</text><text x="1050" y="359" text-anchor="middle" class="s">video rental · records</text><text x="1050" y="386" text-anchor="middle" class="s">incompatible networks</text></g><rect x="120" y="490" width="960" height="100" rx="10" class="node"/><text x="600" y="525" text-anchor="middle" class="k">WHAT REMAINS UNEQUAL</text><text x="600" y="558" text-anchor="middle" class="s">Income · region · sex · citizenship · language · electricity · transport · legal status</text><text x="600" y="583" text-anchor="middle" class="s">The frontier of modernity follows grids, ports, schools, hospitals, bases, laboratories, and supply chains.</text></svg>
