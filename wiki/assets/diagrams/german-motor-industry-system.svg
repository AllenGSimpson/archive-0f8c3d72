<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Postwar German motor-industry system</title>
  <desc id="desc">A schematic showing Volkswagen, Auto Union, blocked American-owned firms, prestige specialists, and Borgward within the German vehicle market from 1947 to 1985.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171c22"/><stop offset="1" stop-color="#26323a"/></linearGradient>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#f4f0e5}.t{font:700 21px system-ui,sans-serif;fill:#f4f0e5}.s{font:500 15px system-ui,sans-serif;fill:#c5d2d6}.box{stroke:#e6d2a2;stroke-width:3}.line{stroke:#e6d2a2;stroke-width:4;fill:none}.thin{stroke:#7ba6b3;stroke-width:3;fill:none;stroke-dasharray:9 8}</style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="h">Motor industry of Germany · 1947–1985</text>
  <text x="600" y="82" text-anchor="middle" class="s">Protected competition inside a state-directed national product ladder</text>
  <path d="M600 112v58M160 170h880" class="line"/>
  <g transform="translate(35 170)"><rect width="235" height="175" rx="18" fill="#38566c" class="box"/><text x="117" y="38" text-anchor="middle" class="t">Volkswagenwerk</text><text x="117" y="68" text-anchor="middle" class="s">Labour Front / state</text><text x="117" y="98" text-anchor="middle" class="s">mass cars · vans</text><text x="117" y="125" text-anchor="middle" class="s">KdF certificates</text><text x="117" y="152" text-anchor="middle" class="s">front-drive transition</text></g>
  <g transform="translate(285 170)"><rect width="255" height="245" rx="18" fill="#4d4b68" class="box"/><text x="127" y="38" text-anchor="middle" class="t">Auto Union</text><text x="127" y="69" text-anchor="middle" class="s">intact in Saxony</text><text x="127" y="105" text-anchor="middle" class="s">DKW · mass / motorcycles</text><text x="127" y="135" text-anchor="middle" class="s">Wanderer · middle</text><text x="127" y="165" text-anchor="middle" class="s">Audi · technical prestige</text><text x="127" y="195" text-anchor="middle" class="s">Horch · official / luxury</text><text x="127" y="225" text-anchor="middle" class="s">four active rings</text></g>
  <g transform="translate(555 170)"><rect width="235" height="175" rx="18" fill="#5b4a36" class="box"/><text x="117" y="38" text-anchor="middle" class="t">Blocked firms</text><text x="117" y="72" text-anchor="middle" class="s">Opel · General Motors</text><text x="117" y="103" text-anchor="middle" class="s">Ford-Werke · Ford</text><text x="117" y="135" text-anchor="middle" class="s">American equity</text><text x="117" y="157" text-anchor="middle" class="s">German control</text></g>
  <g transform="translate(805 170)"><rect width="360" height="175" rx="18" fill="#385f52" class="box"/><text x="180" y="38" text-anchor="middle" class="t">Prestige and specialists</text><text x="180" y="72" text-anchor="middle" class="s">Mercedes-Benz · diesel · safety · luxury</text><text x="180" y="103" text-anchor="middle" class="s">BMW · sporting executive cars</text><text x="180" y="134" text-anchor="middle" class="s">Porsche · racing and contract engineering</text><text x="180" y="158" text-anchor="middle" class="s">NSU · rotary niche</text></g>
  <path d="M600 430v40" class="thin"/>
  <g transform="translate(255 470)"><rect width="690" height="120" rx="18" fill="#70484b" class="box"/><text x="345" y="36" text-anchor="middle" class="t">Borgward · managed industrial failure</text><text x="345" y="70" text-anchor="middle" class="s">independent Bremen middle market → 1960s finance crisis → passenger range reduced</text><text x="345" y="98" text-anchor="middle" class="s">Borgward Nutzfahrzeuge preserves trucks, specialist vehicles, plants, skills, and service</text></g>
  <g transform="translate(75 620)"><rect width="1050" height="38" rx="12" fill="#10151a" stroke="#7ba6b3"/><text x="525" y="25" text-anchor="middle" class="s">Surplus fleets → 1953–56 replacement boom → technical differentiation → protected commercial détente by 1985</text></g>
</svg>
