<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">International community of the Orbitaler Raumhafen</title><desc id="d">German station-wide command surrounds Italian, Japanese, and American national modules while Britain remains an external visitor.</desc><rect width="1200" height="675" fill="#10171f"/><text x="58" y="66" fill="#f3ead8" font-family="Georgia,serif" font-size="34">International Raumhafen community</text><text x="58" y="101" fill="#abb7c5" font-family="Arial,sans-serif" font-size="18">National interiors · German common operations</text><circle cx="600" cy="354" r="218" fill="#172330" stroke="#b2453d" stroke-width="6"/><circle cx="600" cy="354" r="88" fill="#332326" stroke="#d46b5e" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="338" fill="#f3ead8" font-size="23">German core</text><text x="600" y="369" fill="#e2b6ac" font-size="15">traffic · power · structure</text><text x="600" y="392" fill="#e2b6ac" font-size="15">emergency command</text><g fill="#203547" stroke="#7ea7c6" stroke-width="3"><rect x="178" y="196" width="218" height="106" rx="12"/><rect x="804" y="196" width="218" height="106" rx="12"/><rect x="804" y="423" width="218" height="106" rx="12"/></g><g fill="#f3ead8" font-size="21"><text x="287" y="236">Italian module</text><text x="287" y="265" font-size="15">committed 1983 · science</text><text x="913" y="236">Japanese group</text><text x="913" y="265" font-size="15">1985 + 1986 · laboratories</text><text x="913" y="463">American presence</text><text x="913" y="492" font-size="15">1990s · exact form open</text></g><rect x="178" y="423" width="218" height="106" rx="12" fill="#252a31" stroke="#777f89" stroke-width="3" stroke-dasharray="9 7"/><text x="287" y="463" fill="#f3ead8" font-size="21">Britain</text><text x="287" y="492" fill="#abb7c5" font-size="15">no permanent module</text></g><g stroke="#8fa4b8" stroke-width="4"><path d="M396 249 L526 315"/><path d="M804 249 L674 315"/><path d="M804 476 L674 393"/></g><path d="M396 476 Q480 510 505 437" fill="none" stroke="#777f89" stroke-width="3" stroke-dasharray="8 7"/><g font-family="Arial,sans-serif" fill="#abb7c5" font-size="17"><text x="58" y="614">Common hazard produces camaraderie; secure compartments preserve political and technical rivalry.</text><text x="58" y="645">The station becomes international without becoming independent of Germany.</text></g></svg>
