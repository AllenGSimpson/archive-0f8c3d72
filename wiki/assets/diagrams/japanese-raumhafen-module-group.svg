<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese module group on the Orbitaler Raumhafen</title>
  <desc id="desc">A schematic showing the Japanese science and robotics module arriving in 1985 and the life-sciences and environmental module arriving in 1986, both attached to a German-controlled station interface.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121a"/><stop offset="1" stop-color="#14242d"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#172d38"/><stop offset="1" stop-color="#203d49"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 730 C360 610 610 820 960 690 S1360 570 1600 650 V900 H0Z" fill="#0d1c24"/>
  <g fill="#dcebf0" font-family="Arial,Helvetica,sans-serif"><text x="100" y="95" font-size="50" font-weight="700">JAPANESE MODULE GROUP</text><text x="100" y="142" font-size="24" fill="#91aab5" letter-spacing="3">ORBITALER RAUMHAFEN · 1985–1986</text></g>
  <g filter="url(#shadow)"><rect x="610" y="230" width="380" height="440" rx="28" fill="#101b21" stroke="#b7c5ca" stroke-width="4"/><rect x="660" y="300" width="280" height="115" rx="14" fill="#293a42" stroke="#66808b" stroke-width="3"/><circle cx="800" cy="515" r="78" fill="#1b2c34" stroke="#d7e4e8" stroke-width="5"/><circle cx="800" cy="515" r="23" fill="#d7e4e8"/><path d="M800 437v156M722 515h156" stroke="#66808b" stroke-width="10"/></g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="340" font-size="24" fill="#e4edf0" font-weight="700">GERMAN STATION INTERFACE</text><text x="800" y="375" font-size="18" fill="#9db1ba">traffic · power · docking · emergencies</text><text x="800" y="625" font-size="20" fill="#9db1ba">Integrated command</text></g>
  <g filter="url(#shadow)"><rect x="110" y="280" width="390" height="320" rx="24" fill="url(#panel)" stroke="#d6dde0" stroke-width="4"/><rect x="1100" y="280" width="390" height="320" rx="24" fill="url(#panel)" stroke="#d6dde0" stroke-width="4"/></g>
  <path d="M500 440H610M990 440h110" stroke="#c9d5d9" stroke-width="18"/><path d="M500 440H610M990 440h110" stroke="#5c747e" stroke-width="6" stroke-dasharray="14 12"/>
  <g font-family="Arial,Helvetica,sans-serif"><circle cx="305" cy="350" r="38" fill="#f5f5f2"/><circle cx="305" cy="350" r="21" fill="#bc002d"/><text x="305" y="433" font-size="25" text-anchor="middle" fill="#e8f1f3" font-weight="700">SCIENCE &amp; ROBOTICS</text><text x="305" y="476" font-size="42" text-anchor="middle" fill="#7fd3e8" font-weight="700">1985</text><text x="305" y="520" font-size="19" text-anchor="middle" fill="#a9bec7">materials · compact electronics</text><text x="305" y="550" font-size="19" text-anchor="middle" fill="#a9bec7">automated spacecraft control</text><circle cx="1295" cy="350" r="38" fill="#f5f5f2"/><circle cx="1295" cy="350" r="21" fill="#bc002d"/><text x="1295" y="433" font-size="23" text-anchor="middle" fill="#e8f1f3" font-weight="700">LIFE SCIENCE &amp; ENVIRONMENT</text><text x="1295" y="476" font-size="42" text-anchor="middle" fill="#7fd3e8" font-weight="700">1986</text><text x="1295" y="520" font-size="19" text-anchor="middle" fill="#a9bec7">hydroponics · closed-cycle systems</text><text x="1295" y="550" font-size="19" text-anchor="middle" fill="#a9bec7">long-duration medicine</text></g>
  <g font-family="Arial,Helvetica,sans-serif"><rect x="350" y="735" width="900" height="80" rx="40" fill="#122832" stroke="#42616d" stroke-width="2"/><text x="800" y="769" font-size="22" fill="#dce8eb" text-anchor="middle" font-weight="700">JAPANESE INTERNAL ADMINISTRATION</text><text x="800" y="799" font-size="18" fill="#91aab5" text-anchor="middle">German operating language · shared interfaces · German station-wide emergency authority</text></g>
</svg>
