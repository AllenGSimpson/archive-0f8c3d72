<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Western Baloch campaign cycle, 1957 to 1969</title><desc id="desc">Three connected panels show Pakistan consolidating Quetta, Baloch raids toward Kandahar and Farah, and Kalat seizing Las Bela while confederated forces are dispersed.</desc>
  <rect width="1200" height="500" rx="28" fill="#101820"/>
  <text x="600" y="50" text-anchor="middle" fill="#f1e7ce" font-family="Georgia,serif" font-size="30" font-weight="700">Western consolidation without general peace</text>
  <text x="600" y="80" text-anchor="middle" fill="#9fb0b7" font-family="Arial,sans-serif" font-size="16">Campaign relationships, 1957–1969</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(40 118)"><rect width="340" height="230" rx="18" fill="#313943" stroke="#7792a8" stroke-width="2"/><text x="170" y="42" text-anchor="middle" fill="#e8edf0" font-size="22" font-weight="700">Quetta corridor</text><text x="170" y="78" text-anchor="middle" fill="#aec1cf" font-size="16">Pakistan · 1957–60</text><path d="M68 120 H272" stroke="#aec1cf" stroke-width="4" marker-end="url(#arrow)"/><text x="170" y="151" text-anchor="middle" fill="#d8e0e5" font-size="15">Rail, Sibi, Quetta–Pishin</text><text x="170" y="184" text-anchor="middle" fill="#f0c674" font-size="15" font-weight="700">Durable administrative core</text></g>
    <g transform="translate(430 118)"><rect width="340" height="230" rx="18" fill="#183f4a" stroke="#4da2a8" stroke-width="2"/><text x="170" y="42" text-anchor="middle" fill="#e8edf0" font-size="22" font-weight="700">Northern raids</text><text x="170" y="78" text-anchor="middle" fill="#8fd0d4" font-size="16">Balochistan · 1950s–60s</text><path d="M70 122 C130 80 210 80 270 122" fill="none" stroke="#8fd0d4" stroke-width="4" marker-end="url(#arrow)"/><text x="170" y="151" text-anchor="middle" fill="#d8e0e5" font-size="15">Chagai toward Kandahar / Farah</text><text x="170" y="184" text-anchor="middle" fill="#f0c674" font-size="15" font-weight="700">Reach demonstrated; no annexation</text></g>
    <g transform="translate(820 118)"><rect width="340" height="230" rx="18" fill="#4b3926" stroke="#b68a54" stroke-width="2"/><text x="170" y="42" text-anchor="middle" fill="#e8edf0" font-size="22" font-weight="700">Las Bela</text><text x="170" y="78" text-anchor="middle" fill="#e0b77d" font-size="16">Kalat · 1960–63</text><path d="M70 120 H270" stroke="#e0b77d" stroke-width="4" marker-end="url(#arrow)"/><text x="170" y="151" text-anchor="middle" fill="#d8e0e5" font-size="15">Interior approaches to the coast</text><text x="170" y="184" text-anchor="middle" fill="#f0c674" font-size="15" font-weight="700">Maritime outlet retained</text></g>
    <path d="M600 365 V406 M210 365 V406 H990 V365" fill="none" stroke="#c9b88f" stroke-width="3"/><rect x="275" y="406" width="650" height="58" rx="15" fill="#262c30" stroke="#c9b88f" stroke-width="2"/><text x="600" y="441" text-anchor="middle" fill="#f1e7ce" font-size="16" font-weight="700">Each state secured a finite objective; none could dominate the whole frontier</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d8e0e5"/></marker></defs>
</svg>
