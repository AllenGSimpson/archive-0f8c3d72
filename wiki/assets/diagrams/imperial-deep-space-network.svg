  <g fill="none" stroke="#c8a84e" stroke-width="3" opacity=".75"><path d="M170 520Q380 220 600 350T1010 145"/><path d="M300 560Q500 400 720 390T1070 250"/><path d="M440 535Q565 465 690 430"/><path d="M560 560Q650 490 720 390"/></g>
