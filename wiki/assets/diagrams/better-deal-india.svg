<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The Better Deal in divided India</title>
  <desc id="desc">Local security needs lead to limited British protection instruments, producing both a protective and an imperial interpretation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14232d"/><stop offset="1" stop-color="#080d12"/></linearGradient>
    <style>.h{font:700 34px Georgia,serif;fill:#f4eee4}.s{font:15px system-ui,sans-serif;fill:#acbbc5}.left{fill:#1c2d39;stroke:#6e8796;stroke-width:2}.mid{fill:#2f2a24;stroke:#c0935b;stroke-width:2}.good{fill:#21362a;stroke:#799d78;stroke-width:2}.bad{fill:#382426;stroke:#a86b6b;stroke-width:2}.tag{font:700 12px system-ui,sans-serif;fill:#f2d07a;letter-spacing:.08em}.t{font:700 18px system-ui,sans-serif;fill:#f4eee4}.d{font:14px system-ui,sans-serif;fill:#c3cdd3}.line{stroke:#cea653;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="50" y="62" class="h">The Better Deal</text><text x="50" y="92" class="s">An informal late-1950s reputation for limited British or British-client protection</text>
  <g transform="translate(50 150)"><rect class="left" width="280" height="390" rx="11"/><text x="22" y="38" class="tag">LOCAL REQUESTS</text><text x="22" y="88" class="t">Immediate needs</text><text x="22" y="120" class="d">Food and an open road</text><text x="22" y="148" class="d">Predictable courts</text><text x="22" y="176" class="d">Paid requisitions</text><text x="22" y="204" class="d">Minority protection</text><text x="22" y="256" class="t">Petitioning groups</text><text x="22" y="288" class="d">Villages and towns</text><text x="22" y="316" class="d">Merchants and port interests</text><text x="22" y="344" class="d">Princes and minority communities</text></g>
  <path class="line" d="M330 345 H420"/>
  <g transform="translate(420 150)"><rect class="mid" width="340" height="390" rx="11"/><text x="22" y="38" class="tag">LIMITED BRITISH INSTRUMENTS</text><text x="22" y="88" class="t">Protection treaties</text><text x="22" y="119" class="d">Local agreements, not all-India rule</text><text x="22" y="165" class="t">Client administration</text><text x="22" y="196" class="d">Local police, courts, and government</text><text x="22" y="242" class="t">Defended infrastructure</text><text x="22" y="273" class="d">Convoys, selected railways, and ports</text><text x="22" y="319" class="t">Advisers and guarantees</text><text x="22" y="350" class="d">British forces usually withdraw afterward</text></g>
  <path class="line" d="M760 267 H850 M760 425 H850"/>
  <g transform="translate(850 150)"><rect class="good" width="300" height="195" rx="10"/><text x="20" y="36" class="tag">SUPPORTERS' READING</text><text x="20" y="78" class="t">Protection by request</text><text x="20" y="109" class="d">Britain returns only where asked</text><text x="20" y="137" class="d">and no longer seeks to govern</text><text x="20" y="165" class="d">the whole subcontinent.</text></g>
  <g transform="translate(850 385)"><rect class="bad" width="300" height="195" rx="10"/><text x="20" y="36" class="tag">CRITICS' READING</text><text x="20" y="78" class="t">Dependency by crisis</text><text x="20" y="109" class="d">British policy helped arrange the</text><text x="20" y="137" class="d">conditions in which vulnerable</text><text x="20" y="165" class="d">communities had to ask.</text></g>
  <text x="50" y="630" class="s">The reputation was local, conditional, and contested; it did not restore the Raj.</text>
</svg>
