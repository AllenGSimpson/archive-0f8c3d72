<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">British tank lineage, 1943–1985</title>
  <desc id="desc">Diagram showing the principal British tank sequence from Cromwell and Comet through Centurion, Chieftain, and Challenger, with Charioteer and Conqueror as side branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#252a2c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".4"/></filter>
    <style>.kicker{font:700 19px Arial,sans-serif;letter-spacing:5px;fill:#d8bf68}.title{font:700 49px Georgia,serif;fill:#f2efe7}.sub{font:18px Arial,sans-serif;fill:#bdc7ca}.year{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#f2d584}.name{font:700 24px Georgia,serif;fill:#fff}.spec{font:16px Arial,sans-serif;fill:#e3e8e9}.note{font:15px Arial,sans-serif;fill:#bec9ca}.main{stroke:#b79b45;stroke-width:6}.branch{stroke:#7792a5;stroke-width:4;stroke-dasharray:10 7}.box{stroke:#82929a;stroke-width:2}.footer{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#d8cc99}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0h90v900H0z" fill="#c7b45d"/><path d="M30 0h30v900H30z" fill="#a23132"/>
  <text x="135" y="82" class="kicker">BRITISH ARMOURED DEVELOPMENT</text>
  <text x="135" y="145" class="title">The universal-tank line and its specialist branches</text>
  <text x="135" y="182" class="sub">Strong rifled guns · prepared-position fighting · Commonwealth transport and recovery discipline</text>
  <line x1="180" y1="445" x2="1470" y2="445" class="main"/>
  <g filter="url(#shadow)">
    <rect x="125" y="365" width="230" height="160" rx="10" fill="#3d4850" class="box"/><text x="150" y="401" class="year">1943–44</text><text x="150" y="440" class="name">Cromwell · Comet</text><text x="150" y="474" class="spec">75 mm → 77 mm HV</text><text x="150" y="501" class="note">Wartime cruiser bridge</text>
    <rect x="405" y="350" width="300" height="190" rx="10" fill="#46555d" class="box"/><text x="430" y="386" class="year">1945–62</text><text x="430" y="425" class="name">Centurion</text><text x="430" y="459" class="spec">17-pdr → 20-pdr → 105 mm L7</text><text x="430" y="486" class="note">Universal-tank foundation</text><text x="430" y="513" class="note">Mk 1 · 2 · 3 · 10 · 13</text>
    <rect x="800" y="350" width="300" height="190" rx="10" fill="#4d5960" class="box"/><text x="825" y="386" class="year">1966–82</text><text x="825" y="425" class="name">Chieftain</text><text x="825" y="459" class="spec">120 mm L11 · 54–57 t</text><text x="825" y="486" class="note">Mk 10 fights in Falklands</text><text x="825" y="513" class="note">Laser · passive night · applique</text>
    <rect x="1195" y="350" width="290" height="190" rx="10" fill="#565f63" class="box"/><text x="1220" y="386" class="year">1984</text><text x="1220" y="425" class="name">Challenger 1</text><text x="1220" y="459" class="spec">120 mm L11A5 · 62 t</text><text x="1220" y="486" class="note">Composite armor · 1,200 hp</text><text x="1220" y="513" class="note">Not deployed to Falklands</text>
  </g>
  <line x1="525" y1="350" x2="525" y2="270" class="branch"/><line x1="605" y1="350" x2="605" y2="270" class="branch"/>
  <g filter="url(#shadow)"><rect x="315" y="210" width="300" height="115" rx="10" fill="#33424b" class="box"/><text x="340" y="247" class="year">1952 SIDE BRANCH</text><text x="340" y="283" class="name">Charioteer</text><text x="340" y="307" class="note">Reserve and export stopgap</text><rect x="635" y="210" width="300" height="115" rx="10" fill="#34414a" class="box"/><text x="660" y="247" class="year">1956 HEAVY SUPPORT</text><text x="660" y="283" class="name">Conqueror Mk 2</text><text x="660" y="307" class="note">120 mm companion to Centurion</text></g>
  <rect x="135" y="665" width="1350" height="100" rx="9" fill="#283236" stroke="#697b83" stroke-width="2"/>
  <text x="170" y="705" class="spec">1985 SOUTH ATLANTIC BOUNDARY: 18 Chieftain Mk 10 · Challenger retained in Britain and Canada · Warrior remains in troop trials</text>
  <text x="170" y="739" class="note">The campaign tests mature upgraded systems, recovery capacity, and combined-arms integration rather than the newest fleet vehicles.</text>
  <text x="135" y="850" class="footer">FRACTURED PEACE ARCHIVE · COMMONWEALTH LAND ARMAMENTS REGISTER</text>
</svg>
