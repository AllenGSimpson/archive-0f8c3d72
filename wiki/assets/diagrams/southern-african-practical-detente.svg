<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Southern African practical détente</title><desc id="desc">South Africa, Rhodesia, Portuguese Africa, and Mittelafrika coordinate practical systems while remaining strategically divided.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#273744"/></linearGradient><style>.t{font:700 45px Georgia,serif;fill:#f8f2e8}.s{font:18px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.h{font:700 22px Arial,sans-serif;fill:#fff}.c{font:18px Arial,sans-serif;fill:#d8e2e7}.f{font:19px Arial,sans-serif;fill:#e2d3aa}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="72" text-anchor="middle" class="t">SOUTHERN AFRICAN PRACTICAL DÉTENTE</text><text x="800" y="112" text-anchor="middle" class="s">COOPERATION WITHOUT ALLIANCE · 1980s–1990s</text><g stroke="#758e9a" stroke-width="5"><path d="M800 440L300 250M800 440L1300 250M800 440L300 650M800 440L1300 650"/></g><rect x="560" y="280" width="480" height="320" rx="34" fill="#17394b" stroke="#6bbce0" stroke-width="5"/><text x="800" y="350" text-anchor="middle" class="h">PRACTICAL COORDINATION</text><text x="800" y="405" text-anchor="middle" class="c">Rail · ports · aviation · power</text><text x="800" y="450" text-anchor="middle" class="c">Borders · refugees · extradition</text><text x="800" y="495" text-anchor="middle" class="c">Disease · livestock · hydrography</text><text x="800" y="540" text-anchor="middle" class="c">Mining and transport corridors</text><rect x="90" y="170" width="420" height="170" rx="25" fill="#132a38" stroke="#8ab46b" stroke-width="4"/><text x="300" y="235" text-anchor="middle" class="h">SOUTH AFRICA</text><text x="300" y="280" text-anchor="middle" class="c">Commonwealth strategic hinge</text><rect x="1090" y="170" width="420" height="170" rx="25" fill="#132a38" stroke="#8ab46b" stroke-width="4"/><text x="1300" y="235" text-anchor="middle" class="h">RHODESIA</text><text x="1300" y="280" text-anchor="middle" class="c">Inland settler redoubt</text><rect x="90" y="570" width="420" height="170" rx="25" fill="#132a38" stroke="#d7b35e" stroke-width="4"/><text x="300" y="635" text-anchor="middle" class="h">PORTUGUESE AFRICA</text><text x="300" y="680" text-anchor="middle" class="c">Latin Atlantic and Indian Ocean</text><rect x="1090" y="570" width="420" height="170" rx="25" fill="#132a38" stroke="#d66f70" stroke-width="4"/><text x="1300" y="635" text-anchor="middle" class="h">MITTELAFRIKA</text><text x="1300" y="680" text-anchor="middle" class="c">German continental system</text><text x="800" y="825" text-anchor="middle" class="f">They remain rivals; they also remain neighbors tomorrow</text></svg>
