<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The Commonwealth intelligence world of James Bond</title>
  <desc id="desc">James Bond at the center of a Commonwealth network of British command, Canadian, Australian, New Zealand, South African, Caribbean, Indian, and Gulf partners facing rival bloc institutions.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6fa9d9"/></marker></defs>
  <rect width="1200" height="720" fill="#0b1118"/>
  <text x="600" y="54" fill="#f4e4c5" font-family="Georgia,serif" font-size="35" text-anchor="middle">JAMES BOND'S COMMONWEALTH WORLD</text>
  <text x="600" y="87" fill="#9eb2bd" font-family="Consolas,monospace" font-size="16" text-anchor="middle">DEFEATED BRITAIN · GLOBAL ROUTES · SHARED INTELLIGENCE · IMPERIAL RIVALRY</text>
  <g stroke="#6fa9d9" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M600 320 L600 205"/><path d="M520 340 L330 230"/><path d="M500 385 L295 385"/><path d="M520 430 L330 540"/><path d="M680 340 L870 230"/><path d="M700 385 L905 385"/><path d="M680 430 L870 540"/>
  </g>
  <g font-family="Consolas,monospace" text-anchor="middle">
    <g transform="translate(455 300)"><rect width="290" height="170" rx="85" fill="#1b2531" stroke="#e2b75d" stroke-width="4"/><text x="145" y="66" fill="#e2b75d" font-size="19" font-weight="700">007</text><text x="145" y="101" fill="#fff" font-size="29" font-weight="700">JAMES BOND</text><text x="145" y="131" fill="#c4d5dc" font-size="14">Commonwealth intelligence ideal</text></g>
    <g transform="translate(470 125)"><rect width="260" height="85" rx="10" fill="#17232c" stroke="#7da5b8" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">BRITISH COMMAND</text><text x="130" y="61" fill="#c4d5dc" font-size="13">London · Cape route · naval service</text></g>
    <g transform="translate(100 175)"><rect width="260" height="85" rx="10" fill="#17232c" stroke="#7da5b8" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">CANADA &amp; CARIBBEAN</text><text x="130" y="61" fill="#c4d5dc" font-size="13">Atlantic intelligence and access</text></g>
    <g transform="translate(55 345)"><rect width="260" height="85" rx="10" fill="#17232c" stroke="#7da5b8" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">AUSTRALIA &amp; N.Z.</text><text x="130" y="61" fill="#c4d5dc" font-size="13">Pacific surveillance and recovery</text></g>
    <g transform="translate(100 520)"><rect width="260" height="85" rx="10" fill="#17232c" stroke="#7da5b8" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">SOUTHERN ROUTE</text><text x="130" y="61" fill="#c4d5dc" font-size="13">South Africa · India · Gulf</text></g>
    <g transform="translate(840 175)"><rect width="260" height="85" rx="10" fill="#24191d" stroke="#dc5e5e" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">GERMAN SYSTEMS</text><text x="130" y="61" fill="#f2c4c4" font-size="13">U-boats · firms · Atlantic bases</text></g>
    <g transform="translate(885 345)"><rect width="260" height="85" rx="10" fill="#24191d" stroke="#dc5e5e" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">LATIN INTERESTS</text><text x="130" y="61" fill="#f2c4c4" font-size="13">Suez · Mediterranean · courts</text></g>
    <g transform="translate(840 520)"><rect width="260" height="85" rx="10" fill="#24191d" stroke="#dc5e5e" stroke-width="2"/><text x="130" y="34" fill="#fff" font-size="18" font-weight="700">PACIFIC RIVALS</text><text x="130" y="61" fill="#f2c4c4" font-size="13">trading houses · ports · clients</text></g>
  </g>
  <text x="600" y="676" fill="#f4e4c5" font-family="Georgia,serif" font-size="20" text-anchor="middle">America may be ally, patron, rival, or the overconfident power that imperils the mission.</text>
</svg>
