<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">German mature atmospheric aircraft fleet</title>
  <desc id="desc">Five parallel aircraft branches showing German types introduced from 1967 to 1983.</desc>
  <rect width="1200" height="900" rx="28" fill="#151c1f"/>
  <text x="600" y="58" text-anchor="middle" fill="#f1e6cf" font-family="Georgia,serif" font-size="34" font-weight="700">German mature atmospheric fleet</text>
  <text x="600" y="90" text-anchor="middle" fill="#bac6c8" font-family="Arial,sans-serif" font-size="18">five parallel branches · ten registered aircraft · 1967–1983</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(36 124)"><text x="0" y="30" fill="#e0c477" font-size="17" font-weight="700">HEAVY INTERCEPTION</text><rect x="220" width="330" height="104" rx="15" fill="#29383e" stroke="#82a7b0" stroke-width="3"/><text x="385" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Me 511A-1 Adler · 1967</text><text x="385" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">2,650 km/h · six long-range missiles</text><rect x="760" width="360" height="104" rx="15" fill="#29383e" stroke="#82a7b0" stroke-width="3"/><text x="940" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Me 521A-1 Falke II · 1978</text><text x="940" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">pulse-Doppler · 2,780 km/h · eight missiles</text><line x1="570" y1="52" x2="728" y2="52" stroke="#bd7769" stroke-width="4"/><polygon points="728,40 752,52 728,64" fill="#bd7769"/></g>
    <g transform="translate(36 264)"><text x="0" y="30" fill="#e0c477" font-size="17" font-weight="700">AIR SUPERIORITY</text><rect x="220" width="330" height="104" rx="15" fill="#29383e" stroke="#a0ad79" stroke-width="3"/><text x="385" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Fw 512A-1 Sperber · 1969</text><text x="385" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">2,250 km/h · four missiles</text><rect x="760" width="360" height="104" rx="15" fill="#29383e" stroke="#a0ad79" stroke-width="3"/><text x="940" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Fw 522A-1 Habicht II · 1980</text><text x="940" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">digital fighter · 2,420 km/h · six missiles</text><line x1="570" y1="52" x2="728" y2="52" stroke="#bd7769" stroke-width="4"/><polygon points="728,40 752,52 728,64" fill="#bd7769"/></g>
    <g transform="translate(36 404)"><text x="0" y="30" fill="#e0c477" font-size="17" font-weight="700">THEATER STRIKE</text><rect x="220" width="330" height="104" rx="15" fill="#29383e" stroke="#c69b71" stroke-width="3"/><text x="385" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Ar 513A-1 Blitz III · 1970</text><text x="385" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">low-level strike · 5,000 kg stores</text><rect x="760" width="360" height="104" rx="15" fill="#29383e" stroke="#c69b71" stroke-width="3"/><text x="940" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Ar 523A-1 Blitz IV · 1981</text><text x="940" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">terrain following · 7,000 kg stores</text><line x1="570" y1="52" x2="728" y2="52" stroke="#bd7769" stroke-width="4"/><polygon points="728,40 752,52 728,64" fill="#bd7769"/></g>
    <g transform="translate(36 544)"><text x="0" y="30" fill="#e0c477" font-size="17" font-weight="700">CLOSE SUPPORT</text><rect x="220" width="330" height="104" rx="15" fill="#29383e" stroke="#968db1" stroke-width="3"/><text x="385" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Fw 514A-1 Würger II · 1971</text><text x="385" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">two 30 mm cannon · 3,200 kg stores</text><rect x="760" width="360" height="104" rx="15" fill="#29383e" stroke="#968db1" stroke-width="3"/><text x="940" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Fw 524A-1 Würger III · 1982</text><text x="940" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">armored · 650 km radius · 4,500 kg stores</text><line x1="570" y1="52" x2="728" y2="52" stroke="#bd7769" stroke-width="4"/><polygon points="728,40 752,52 728,64" fill="#bd7769"/></g>
    <g transform="translate(36 684)"><text x="0" y="30" fill="#e0c477" font-size="17" font-weight="700">MARITIME AVIATION</text><rect x="220" width="330" height="104" rx="15" fill="#29383e" stroke="#789d91" stroke-width="3"/><text x="385" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Ju 516A-1 Seeadler · 1972</text><text x="385" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">4,100 km radius · four anti-ship missiles</text><rect x="760" width="360" height="104" rx="15" fill="#29383e" stroke="#789d91" stroke-width="3"/><text x="940" y="34" text-anchor="middle" fill="#f1e6cf" font-size="20" font-weight="700">Ju 526A-1 Seeadler II · 1983</text><text x="940" y="64" text-anchor="middle" fill="#bac6c8" font-size="15">5,000 km radius · six anti-ship missiles</text><line x1="570" y1="52" x2="728" y2="52" stroke="#bd7769" stroke-width="4"/><polygon points="728,40 752,52 728,64" fill="#bd7769"/></g>
  </g>
  <text x="600" y="850" text-anchor="middle" fill="#c2cdd0" font-family="Arial,sans-serif" font-size="17">airframes remain specialized; radar, missiles, ground control, computing, and orbital warning create the common combat system</text>
</svg>
