<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">West Falkland lodgment</title><desc id="d">British reconnaissance and bombardment lead through captured western positions to a durable air, repair and supply base.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#d6bd71"/></marker></defs><rect width="1200" height="520" rx="24" fill="#071821"/><text x="600" y="55" text-anchor="middle" fill="#f1f6f5" font-family="Georgia,serif" font-size="32">WEST FALKLAND LODGMENT · 1984</text><g font-family="Arial,sans-serif"><g fill="#163c50" stroke="#75bcd5" stroke-width="2"><rect x="45" y="150" width="245" height="150" rx="16"/><rect x="360" y="150" width="245" height="150" rx="16"/><rect x="675" y="150" width="245" height="150" rx="16"/><rect x="980" y="150" width="175" height="150" rx="16"/></g><g fill="#effcff" text-anchor="middle"><text x="168" y="195" font-size="21">PREPARE</text><text x="168" y="230" font-size="17">reconnaissance</text><text x="168" y="260" font-size="17">bombardment</text><text x="482" y="195" font-size="21">SECURE</text><text x="482" y="230" font-size="17">Port Howard</text><text x="482" y="260" font-size="17">Fox Bay · high ground</text><text x="797" y="195" font-size="21">BUILD</text><text x="797" y="230" font-size="17">airstrip · repair</text><text x="797" y="260" font-size="17">artillery · air defense</text><text x="1067" y="195" font-size="21">SUSTAIN</text><text x="1067" y="230" font-size="17">stores</text><text x="1067" y="260" font-size="17">helicopters</text></g><path d="M290 225H352M605 225H667M920 225H972" stroke="#d6bd71" stroke-width="5" marker-end="url(#a)"/><rect x="250" y="360" width="700" height="90" rx="18" fill="#283c2b" stroke="#79b985" stroke-width="3"/><text x="600" y="399" text-anchor="middle" fill="#effff1" font-size="22">DURABLE ISLAND BASE</text><text x="600" y="431" text-anchor="middle" fill="#d6f2da" font-size="18">Winter Quay → Crown Gate → East Falkland campaign</text></g></svg>
