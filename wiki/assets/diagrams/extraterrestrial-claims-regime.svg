<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Extraterrestrial claims regime around 2000</title>
  <desc id="desc">Nested zones show strongest protection at an occupied registered installation, with increasingly disputed claims toward safety zones, operating corridors, economic hinterlands, and unsupported paper sovereignty.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="1" stop-color="#101d2a"/>
    </linearGradient>
    <radialGradient id="zones">
      <stop offset="0" stop-color="#e2c46f"/>
      <stop offset=".23" stop-color="#62b4c6"/>
      <stop offset=".48" stop-color="#315b70"/>
      <stop offset=".73" stop-color="#243848"/>
      <stop offset="1" stop-color="#17242f"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg2)"/>
  <text x="60" y="68" fill="#edf4f7" font-family="Georgia,serif" font-size="31">The gradient of extraterrestrial claims</text>
  <text x="60" y="103" fill="#9eb1bf" font-family="Arial,sans-serif" font-size="17">The farther a claim extends beyond maintained works, the less settled its legal standing</text>
  <g transform="translate(355 350)">
    <circle r="220" fill="url(#zones)" opacity=".96"/>
    <circle r="220" fill="none" stroke="#607485" stroke-width="2" stroke-dasharray="9 8"/>
    <circle r="168" fill="none" stroke="#718b9c" stroke-width="2" stroke-dasharray="8 7"/>
    <circle r="116" fill="none" stroke="#71a7b6" stroke-width="2"/>
    <circle r="65" fill="none" stroke="#d7c27c" stroke-width="2"/>
    <path d="M-31 19V-8l31-25 31 25v27M-19 19V0H19v19M-45 19H45" fill="none" stroke="#0b1217" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial,sans-serif">
    <line x1="391" y1="318" x2="650" y2="168" stroke="#d7c27c" stroke-width="2"/>
    <circle cx="650" cy="168" r="4" fill="#d7c27c"/>
    <text x="672" y="162" fill="#fff4d3" font-size="19" font-weight="700">Occupied, registered installation</text>
    <text x="672" y="187" fill="#c5d2d8" font-size="15">Strongest protected interest</text>
    <line x1="441" y1="338" x2="650" y2="253" stroke="#70b7c5" stroke-width="2"/>
    <circle cx="650" cy="253" r="4" fill="#70b7c5"/>
    <text x="672" y="247" fill="#e9f6f8" font-size="19" font-weight="700">Immediate safety and operations</text>
    <text x="672" y="272" fill="#c5d2d8" font-size="15">Necessary exclusion has a strong practical case</text>
    <line x1="474" y1="382" x2="650" y2="340" stroke="#5e8ea2" stroke-width="2"/>
    <circle cx="650" cy="340" r="4" fill="#5e8ea2"/>
    <text x="672" y="334" fill="#dcebf0" font-size="19" font-weight="700">Active routes and resource works</text>
    <text x="672" y="359" fill="#c5d2d8" font-size="15">Rights strengthen with survey, use, and maintenance</text>
    <line x1="493" y1="433" x2="650" y2="427" stroke="#607485" stroke-width="2"/>
    <circle cx="650" cy="427" r="4" fill="#607485"/>
    <text x="672" y="421" fill="#d7e1e5" font-size="19" font-weight="700">Claimed economic hinterland</text>
    <text x="672" y="446" fill="#c5d2d8" font-size="15">Extent and duration remain disputed</text>
    <line x1="503" y1="485" x2="650" y2="514" stroke="#536572" stroke-width="2"/>
    <circle cx="650" cy="514" r="4" fill="#536572"/>
    <text x="672" y="508" fill="#cbd7dc" font-size="19" font-weight="700">Unsupported paper sovereignty</text>
    <text x="672" y="533" fill="#c5d2d8" font-size="15">A flag or map alone receives no general recognition</text>
  </g>
  <text x="60" y="587" fill="#8298a7" font-family="Arial,sans-serif" font-size="14">Year-2000 practice: protect people and maintained systems first; defer broad territorial settlement.</text>
</svg>
