<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Burmese federal architecture</title><desc id="desc">Schematic of the Bamar Union core, seven constituent states, and autonomous frontier districts.</desc><rect width="1200" height="730" rx="32" fill="#10171d"/><text x="60" y="68" fill="#f2e7d1" font-family="Georgia,serif" font-size="36">Burma’s asymmetric federal architecture</text><text x="60" y="106" fill="#99abb5" font-family="Arial,sans-serif" font-size="18">One international Union · a directly governed Bamar core · seven constituent states · nested autonomous districts</text><g font-family="Arial,sans-serif"><g transform="translate(55 155)"><rect width="310" height="430" rx="20" fill="#3c3322" stroke="#d3aa52"/><text x="25" y="46" fill="#f1c86f" font-size="25" font-weight="700">UNION CORE</text><text x="25" y="86" fill="#fff" font-size="18">Rangoon · Mandalay</text><text x="25" y="120" fill="#fff" font-size="18">Irrawaddy valley and delta</text><text x="25" y="166" fill="#a8bbc4" font-size="16">Foreign policy</text><text x="25" y="196" fill="#a8bbc4" font-size="16">Currency and customs</text><text x="25" y="226" fill="#a8bbc4" font-size="16">Heavy weapons and aviation</text><text x="25" y="256" fill="#a8bbc4" font-size="16">Strategic rail and river corridors</text><text x="25" y="300" fill="#e3c678" font-size="16">Bamar-led in practice</text><text x="25" y="330" fill="#e3c678" font-size="16">Union-wide in legal claim</text></g><g transform="translate(405 155)"><rect width="350" height="430" rx="20" fill="#173d4a" stroke="#66b4c3"/><text x="25" y="46" fill="#9de0ea" font-size="25" font-weight="700">CONSTITUENT STATES · 7</text><g fill="#fff" font-size="19"><text x="25" y="92">Shan</text><text x="185" y="92">Kachin</text><text x="25" y="132">Chin</text><text x="185" y="132">Karen</text><text x="25" y="172">Karenni</text><text x="185" y="172">Mon</text><text x="25" y="212">Arakan</text></g><path d="M25 240H325" stroke="#506d78"/><g fill="#a8bbc4" font-size="16"><text x="25" y="278">Language and education</text><text x="25" y="308">Land and customary law</text><text x="25" y="338">Religion and local administration</text><text x="25" y="368">Ordinary policing and State Guards</text><text x="25" y="398">Limited resource royalties</text></g></g><g transform="translate(795 155)"><rect width="350" height="430" rx="20" fill="#19372b" stroke="#6ab58a"/><text x="25" y="46" fill="#91dbad" font-size="25" font-weight="700">AUTONOMOUS DISTRICTS</text><g fill="#fff" font-size="18"><text x="25" y="92">Wa · Pa-O · Ta’ang/Palaung</text><text x="25" y="130">Kokang · Naga districts</text><text x="25" y="168">Delta Karen districts</text><text x="25" y="206">Northern Arakan district</text></g><path d="M25 235H325" stroke="#4d6f5d"/><g fill="#a8bbc4" font-size="16"><text x="25" y="272">Local councils and scouts</text><text x="25" y="302">Language and schooling</text><text x="25" y="332">Customary land systems</text><text x="25" y="362">Settlement protections</text><text x="25" y="392">Rights weaker than statehood</text></g></g></g><text x="600" y="645" text-anchor="middle" fill="#e3c678" font-family="Arial,sans-serif" font-size="19">Federal all the way down—yet authority weakens at each lower level.</text><text x="60" y="690" fill="#7f929d" font-family="Arial,sans-serif" font-size="15">Institutional schematic · not a canonical border map</text></svg>
