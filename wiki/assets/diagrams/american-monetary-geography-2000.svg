<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Monetary geography of the Americas around 2000</title><desc id="desc">Comparison of dollar use, sovereign gold currency, gold conversion, Latin settlement, and independent fiat in the American hemisphere.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#1a303c"/></linearGradient><style>.title{font:700 38px Georgia,serif;fill:#f3ead7}.sub{font:15px Arial,sans-serif;fill:#aebbc4;letter-spacing:1.4px}.head{font:700 20px Arial,sans-serif;fill:#f3ecdf}.copy{font:14px Arial,sans-serif;fill:#c3d0d7}.tag{font:700 14px Arial,sans-serif;fill:#dfc17b}.box{fill:#102532;stroke:#557c90;stroke-width:2}.gold{fill:#2b291e;stroke:#b3924f;stroke-width:2}.latin{fill:#2d2228;stroke:#9d6479;stroke-width:2}.fiat{fill:#1c2b25;stroke:#5d8a70;stroke-width:2;stroke-dasharray:9 6}.line{stroke:#6b93a5;stroke-width:4;fill:none}.foot{font:15px Arial,sans-serif;fill:#b9c4ca}</style></defs>
  <rect width="1400" height="760" fill="url(#bg)"/><text x="700" y="58" text-anchor="middle" class="title">MONEY ACROSS THE MATURE AMERICAN HEMISPHERE</text><text x="700" y="90" text-anchor="middle" class="sub">SECURITY ALIGNMENT DOES NOT PRODUCE ONE CURRENCY REGIME</text>
  <path d="M700 180V260M250 330H1150M250 330V390M475 330V390M700 330V390M925 330V390M1150 330V390" class="line"/>
  <g transform="translate(510 130)"><rect width="380" height="100" rx="14" class="gold"/><text x="190" y="37" text-anchor="middle" class="head">INTERNATIONAL BULLION CLEARING</text><text x="190" y="67" text-anchor="middle" class="copy">Gold dollars · Scudi · bank claims · bullion weights</text><text x="190" y="89" text-anchor="middle" class="tag">COMMON EXTERNAL LANGUAGE</text></g>
  <g transform="translate(140 390)"><rect width="220" height="220" rx="14" class="gold"/><text x="110" y="38" text-anchor="middle" class="head">DOLLAR USE</text><text x="110" y="72" text-anchor="middle" class="copy">Direct gold-dollar claims</text><text x="110" y="98" text-anchor="middle" class="copy">American banks and trade</text><text x="110" y="137" text-anchor="middle" class="tag">LOW FRICTION</text><text x="110" y="168" text-anchor="middle" class="copy">Less monetary autonomy</text><text x="110" y="194" text-anchor="middle" class="copy">Common in client systems</text></g>
  <g transform="translate(365 390)"><rect width="220" height="220" rx="14" class="gold"/><text x="110" y="38" text-anchor="middle" class="head">NATIONAL GOLD</text><text x="110" y="72" text-anchor="middle" class="copy">Sovereign notes and credit</text><text x="110" y="98" text-anchor="middle" class="copy">Fixed gold definition</text><text x="110" y="137" text-anchor="middle" class="tag">MEXICAN MODEL</text><text x="110" y="168" text-anchor="middle" class="copy">Dollar and Scudo access</text><text x="110" y="194" text-anchor="middle" class="copy">Reserve discipline</text></g>
  <g transform="translate(590 390)"><rect width="220" height="220" rx="14" class="box"/><text x="110" y="38" text-anchor="middle" class="head">GOLD CONVERSION</text><text x="110" y="72" text-anchor="middle" class="copy">Local currency retained</text><text x="110" y="98" text-anchor="middle" class="copy">Peg or conversion window</text><text x="110" y="137" text-anchor="middle" class="tag">MIXED SYSTEM</text><text x="110" y="168" text-anchor="middle" class="copy">Guarantee depends on</text><text x="110" y="194" text-anchor="middle" class="copy">reserves and controls</text></g>
  <g transform="translate(815 390)"><rect width="220" height="220" rx="14" class="latin"/><text x="110" y="38" text-anchor="middle" class="head">LATIN ACCESS</text><text x="110" y="72" text-anchor="middle" class="copy">Scudo settlement</text><text x="110" y="98" text-anchor="middle" class="copy">Spanish and Latin banks</text><text x="110" y="137" text-anchor="middle" class="tag">COUNTERWEIGHT</text><text x="110" y="168" text-anchor="middle" class="copy">Cuba and plural markets</text><text x="110" y="194" text-anchor="middle" class="copy">National money may remain</text></g>
  <g transform="translate(1040 390)"><rect width="220" height="220" rx="14" class="fiat"/><text x="110" y="38" text-anchor="middle" class="head">INDEPENDENT FIAT</text><text x="110" y="72" text-anchor="middle" class="copy">Managed national issue</text><text x="110" y="98" text-anchor="middle" class="copy">Hard-money invoices</text><text x="110" y="137" text-anchor="middle" class="tag">WORKING CASE</text><text x="110" y="168" text-anchor="middle" class="copy">Nicaragua proposed</text><text x="110" y="194" text-anchor="middle" class="copy">Final choice remains open</text></g>
  <text x="700" y="680" text-anchor="middle" class="foot">Corporate contracts can move exchange risk even where flags, central banks, and national currencies remain unchanged.</text>
</svg>
