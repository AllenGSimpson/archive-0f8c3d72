<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Postwar American presidential administrations, 1945–2001</title>
  <desc id="desc">A chronological diagram showing the administrations of James Byrnes, Thomas Dewey, Earl Warren, John Kennedy, Nelson Rockefeller, Pat Buchanan, Ronald Reagan, Thomas Harwood, and Andrew Hale, with their means of entering office and principal governing periods.</desc>
  <rect width="1200" height="780" rx="24" fill="#111821"/>
  <rect x="28" y="28" width="1144" height="724" rx="18" fill="#18222d" stroke="#334659" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" fill="#f0e7d5" font-family="Georgia,serif" font-size="30" font-weight="700">Postwar American administrations</text>
  <text x="600" y="101" text-anchor="middle" fill="#9eb0c2" font-family="Arial,sans-serif" font-size="15">1945–2001 · succession, direct election, and House selection</text>

  <line x1="100" y1="397" x2="1100" y2="397" stroke="#8797a8" stroke-width="4"/>
  <polygon points="1100,397 1080,386 1080,408" fill="#8797a8"/>

  <g font-family="Arial,sans-serif">
    <g>
      <line x1="115" y1="397" x2="115" y2="204" stroke="#5b80b2" stroke-width="3"/>
      <circle cx="115" cy="397" r="9" fill="#5b80b2"/>
      <rect x="60" y="132" width="190" height="72" rx="10" fill="#202f40" stroke="#5b80b2"/>
      <text x="75" y="157" fill="#f4efe5" font-size="17" font-weight="700">James F. Byrnes</text>
      <text x="75" y="179" fill="#b9c8d6" font-size="13">1945–1949 · succession</text>
      <text x="75" y="195" fill="#8fa4b8" font-size="12">Recovery and retrenchment</text>
    </g>

    <g>
      <line x1="245" y1="397" x2="245" y2="516" stroke="#a9605d" stroke-width="3"/>
      <circle cx="245" cy="397" r="9" fill="#a9605d"/>
      <rect x="165" y="516" width="210" height="72" rx="10" fill="#3a292b" stroke="#a9605d"/>
      <text x="180" y="541" fill="#f4efe5" font-size="17" font-weight="700">Thomas E. Dewey</text>
      <text x="180" y="563" fill="#d5bdc0" font-size="13">1949–1957 · elected</text>
      <text x="180" y="579" fill="#b8999c" font-size="12">Settlement and Philippines</text>
    </g>

    <g>
      <line x1="350" y1="397" x2="350" y2="250" stroke="#a9605d" stroke-width="3"/>
      <circle cx="350" cy="397" r="9" fill="#a9605d"/>
      <rect x="285" y="178" width="190" height="72" rx="10" fill="#3a292b" stroke="#a9605d"/>
      <text x="300" y="203" fill="#f4efe5" font-size="17" font-weight="700">Earl Warren</text>
      <text x="300" y="225" fill="#d5bdc0" font-size="13">1957–1961 · House</text>
      <text x="300" y="241" fill="#b8999c" font-size="12">Satellite response</text>
    </g>

    <g>
      <line x1="470" y1="397" x2="470" y2="470" stroke="#5b80b2" stroke-width="3"/>
      <circle cx="470" cy="397" r="9" fill="#5b80b2"/>
      <rect x="400" y="470" width="210" height="72" rx="10" fill="#202f40" stroke="#5b80b2"/>
      <text x="415" y="495" fill="#f4efe5" font-size="17" font-weight="700">John F. Kennedy</text>
      <text x="415" y="517" fill="#b9c8d6" font-size="13">1961–1969 · elected</text>
      <text x="415" y="533" fill="#8fa4b8" font-size="12">Mission state</text>
    </g>

    <g>
      <line x1="590" y1="397" x2="590" y2="204" stroke="#c79545" stroke-width="3"/>
      <circle cx="590" cy="397" r="9" fill="#c79545"/>
      <rect x="515" y="132" width="210" height="72" rx="10" fill="#3a3222" stroke="#c79545"/>
      <text x="530" y="157" fill="#f4efe5" font-size="17" font-weight="700">Nelson Rockefeller</text>
      <text x="530" y="179" fill="#ded0ae" font-size="13">1969–1977 · House</text>
      <text x="530" y="195" fill="#b9a57d" font-size="12">Compact and fusion</text>
    </g>

    <g>
      <line x1="710" y1="397" x2="710" y2="516" stroke="#42b9c5" stroke-width="3"/>
      <circle cx="710" cy="397" r="9" fill="#42b9c5"/>
      <rect x="645" y="516" width="205" height="72" rx="10" fill="#20373b" stroke="#42b9c5"/>
      <text x="660" y="541" fill="#f4efe5" font-size="17" font-weight="700">Pat Buchanan</text>
      <text x="660" y="563" fill="#b8dfe2" font-size="13">1977–1985 · elected</text>
      <text x="660" y="579" fill="#8fc3c8" font-size="12">Peace, Production, Ascent</text>
    </g>

    <g>
      <line x1="825" y1="397" x2="825" y2="250" stroke="#4c79b8" stroke-width="3"/>
      <circle cx="825" cy="397" r="9" fill="#4c79b8"/>
      <rect x="760" y="178" width="205" height="72" rx="10" fill="#202f43" stroke="#4c79b8"/>
      <text x="775" y="203" fill="#f4efe5" font-size="17" font-weight="700">Ronald Reagan</text>
      <text x="775" y="225" fill="#b9cce4" font-size="13">1985–1993 · elected</text>
      <text x="775" y="241" fill="#8faacb" font-size="12">Boom and depression</text>
    </g>

    <g>
      <line x1="940" y1="397" x2="940" y2="470" stroke="#42b9c5" stroke-width="3"/>
      <circle cx="940" cy="397" r="9" fill="#42b9c5"/>
      <rect x="875" y="470" width="205" height="72" rx="10" fill="#20373b" stroke="#42b9c5"/>
      <text x="890" y="495" fill="#f4efe5" font-size="17" font-weight="700">Thomas Harwood</text>
      <text x="890" y="517" fill="#b8dfe2" font-size="13">1993–1997 · elected</text>
      <text x="890" y="533" fill="#8fc3c8" font-size="12">Reconstruction and schism</text>
    </g>

    <g>
      <line x1="1055" y1="397" x2="1055" y2="204" stroke="#4c79b8" stroke-width="3"/>
      <circle cx="1055" cy="397" r="9" fill="#4c79b8"/>
      <rect x="950" y="132" width="190" height="72" rx="10" fill="#202f43" stroke="#4c79b8"/>
      <text x="965" y="157" fill="#f4efe5" font-size="17" font-weight="700">Andrew P. Hale</text>
      <text x="965" y="179" fill="#b9cce4" font-size="13">1997–2001 · House</text>
      <text x="965" y="195" fill="#8faacb" font-size="12">Bounded stability</text>
    </g>

    <text x="95" y="424" fill="#9eb0c2" font-size="12">1945</text>
    <text x="1080" y="424" fill="#9eb0c2" font-size="12">2001</text>

    <rect x="94" y="656" width="1012" height="58" rx="12" fill="#121b25" stroke="#334659"/>
    <circle cx="135" cy="685" r="7" fill="#5b80b2"/><text x="151" y="690" fill="#b7c5d3" font-size="13">Democratic traditions</text>
    <circle cx="340" cy="685" r="7" fill="#a9605d"/><text x="356" y="690" fill="#b7c5d3" font-size="13">Republican</text>
    <circle cx="495" cy="685" r="7" fill="#c79545"/><text x="511" y="690" fill="#b7c5d3" font-size="13">Fusion coalition</text>
    <circle cx="675" cy="685" r="7" fill="#42b9c5"/><text x="691" y="690" fill="#b7c5d3" font-size="13">National Renewal</text>
    <circle cx="880" cy="685" r="7" fill="#4c79b8"/><text x="896" y="690" fill="#b7c5d3" font-size="13">Democratic–Republican</text>
  </g>
</svg>
