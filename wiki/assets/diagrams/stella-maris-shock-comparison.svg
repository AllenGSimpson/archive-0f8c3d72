<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Stella Maris shock comparison</title>
  <desc id="desc">A stylized early-1990s British press comparison showing the older Resolution laboratory and the visibly growing Stella Maris station beneath the question Britain fifth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b27"/><stop offset="1" stop-color="#070d13"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6cb7c1"/><stop offset="1" stop-color="#28586c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c369"/><stop offset="1" stop-color="#8e6b26"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .headline{font:700 42px Georgia,serif;fill:#f5efe4}.sub{font:15px system-ui,sans-serif;fill:#aebdca}.name{font:700 25px Georgia,serif;fill:#f7f1e8}.detail{font:14px system-ui,sans-serif;fill:#bac6d0}.question{font:700 20px system-ui,sans-serif;fill:#e5bd58;letter-spacing:.13em}.panel{fill:#0d1721;stroke:#33495c;stroke-width:1.5}.thin{stroke:#a9c7cf;stroke-width:5;fill:none}.solar{fill:#263b4c;stroke:#82a3b2;stroke-width:2}.latin{fill:url(#gold);stroke:#f0d58b;stroke-width:2}.brit{fill:url(#blue);stroke:#9bd6db;stroke-width:2}.uncertain{font:700 76px Georgia,serif;fill:#e2ba55}.rule{stroke:#4a5e70;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="42" y="65" class="question">BRITAIN FIFTH?</text>
  <text x="42" y="115" class="headline">The comparison that changed the politics</text>
  <text x="42" y="145" class="sub">Britain · c. 1991–92 · silhouettes are interpretive and not to a common technical measure</text>
  <path d="M42 173 H1158" class="rule"/>

  <g transform="translate(70 212)" filter="url(#shadow)">
    <rect width="430" height="330" rx="20" class="panel"/>
    <text x="24" y="42" class="name">Resolution</text><text x="24" y="67" class="detail">older · continuously occupied · service-centered</text>
    <g transform="translate(215 178)">
      <rect x="-87" y="-32" width="174" height="64" rx="16" class="brit"/>
      <rect x="-18" y="-98" width="36" height="196" rx="9" class="brit"/>
      <circle r="31" fill="#d5e4e7" stroke="#79bbc3" stroke-width="5"/>
      <path d="M-190 -43 H-90 M90 -43 H190 M-190 43 H-90 M90 43 H190" class="thin"/>
      <rect x="-194" y="-70" width="95" height="54" class="solar"/><rect x="99" y="-70" width="95" height="54" class="solar"/>
      <rect x="-194" y="16" width="95" height="54" class="solar"/><rect x="99" y="16" width="95" height="54" class="solar"/>
    </g>
    <text x="24" y="294" class="detail">Research, signals, endurance, and a large ground network</text>
    <text x="24" y="317" class="detail">made simple silhouette comparisons incomplete.</text>
  </g>

  <text x="534" y="397" class="uncertain">?</text>

  <g transform="translate(700 212)" filter="url(#shadow)">
    <rect width="430" height="330" rx="20" class="panel"/>
    <text x="24" y="42" class="name">Stella Maris</text><text x="24" y="67" class="detail">newer · visibly modular · still expanding</text>
    <g transform="translate(215 178)">
      <circle r="55" fill="none" stroke="#e3c15e" stroke-width="18"/>
      <circle r="23" class="latin"/>
      <path d="M-55 0 H-155 M55 0 H155 M0 -55 V-116 M0 55 V116" stroke="#e4c66e" stroke-width="10"/>
      <rect x="-198" y="-37" width="80" height="74" rx="8" class="latin"/><rect x="118" y="-37" width="80" height="74" rx="8" class="latin"/>
      <rect x="-38" y="-146" width="76" height="52" rx="8" class="latin"/><rect x="-38" y="94" width="76" height="52" rx="8" class="latin"/>
      <path d="M-198 -61 H-118 M118 -61 H198" stroke="#b18b35" stroke-width="6"/>
    </g>
    <text x="24" y="294" class="detail">Photographs made multinational expansion look like a rank</text>
    <text x="24" y="317" class="detail">ordering even when the underlying measures differed.</text>
  </g>

  <path d="M70 581 H1130" class="rule"/>
  <text x="600" y="620" text-anchor="middle" class="name">A political shock, not a verified declaration of technical superiority</text>
  <text x="600" y="647" text-anchor="middle" class="sub">The public question supplied the force: could the comparison even be made?</text>
</svg>
