<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Technology transfer from racing categories</title><desc id="desc">Touring, endurance, Formula One, and Group 7 answer different engineering questions and transfer different kinds of technology to road vehicles and industry.</desc>
  <defs><style>.h{font:bold 39px Georgia,serif;fill:#f0d172}.s{font:21px Arial,sans-serif;fill:#d4d2c9}.l{font:bold 24px Arial,sans-serif;fill:#fff}.b{stroke:#c8c8bf;stroke-width:2;rx:16}.a{stroke:#f0d172;stroke-width:4;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f0d172"/></marker></defs>
  <rect width="1200" height="720" fill="#111718"/><text x="58" y="66" class="h">FOUR LABORATORIES, DIFFERENT ANSWERS</text><text x="58" y="104" class="s">Racing transfer is selective rather than automatic</text>
  <g transform="translate(45 155)"><rect width="250" height="260" class="b" fill="#34483e"/><text x="125" y="52" text-anchor="middle" class="l">TOURING + RALLY</text><text x="125" y="100" text-anchor="middle" class="s">Road survival</text><text x="125" y="136" text-anchor="middle" class="s">climate and abuse</text><text x="125" y="190" text-anchor="middle" class="s">Highest transfer to</text><text x="125" y="226" text-anchor="middle" class="s">mass automobiles</text></g>
  <g transform="translate(325 155)"><rect width="250" height="260" class="b" fill="#3d4650"/><text x="125" y="52" text-anchor="middle" class="l">ENDURANCE</text><text x="125" y="100" text-anchor="middle" class="s">Fuel, tires, brakes</text><text x="125" y="136" text-anchor="middle" class="s">and maintenance</text><text x="125" y="190" text-anchor="middle" class="s">Performance cars</text><text x="125" y="226" text-anchor="middle" class="s">and reliability</text></g>
  <g transform="translate(605 155)"><rect width="250" height="260" class="b" fill="#4b3845"/><text x="125" y="52" text-anchor="middle" class="l">FORMULA ONE</text><text x="125" y="100" text-anchor="middle" class="s">Peak circuit speed</text><text x="125" y="136" text-anchor="middle" class="s">inside the formula</text><text x="125" y="190" text-anchor="middle" class="s">Materials, controls</text><text x="125" y="226" text-anchor="middle" class="s">and aerodynamics</text></g>
  <g transform="translate(885 155)"><rect width="250" height="260" class="b" fill="#57442f"/><text x="125" y="52" text-anchor="middle" class="l">GROUP 7</text><text x="125" y="100" text-anchor="middle" class="s">What is possible?</text><text x="125" y="136" text-anchor="middle" class="s">Few performance limits</text><text x="125" y="190" text-anchor="middle" class="s">Experimental</text><text x="125" y="226" text-anchor="middle" class="s">and unpredictable</text></g>
  <path d="M170 415v85M450 415v85M730 415v85M1010 415v85M170 500h840M600 500v62" class="a" marker-end="url(#m)"/>
  <rect x="190" y="562" width="820" height="105" class="b" fill="#2e4146"/><text x="600" y="604" text-anchor="middle" class="l">INDUSTRIAL TRANSFER</text><text x="600" y="641" text-anchor="middle" class="s">Injection - brakes - tires - alloys - suspension - crash structures - data - engine controls</text>
</svg>
