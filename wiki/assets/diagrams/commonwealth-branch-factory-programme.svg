<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Commonwealth branch factory programme</title><desc id="desc">British capital, equipment, licenses, training, and orders support locally staffed factories and regional arsenals.</desc><rect width="1200" height="675" fill="#101514"/><rect x="34" y="34" width="1132" height="607" rx="16" fill="#1a211f" stroke="#bca66a" stroke-width="2"/><text x="72" y="86" fill="#f0e9d7" font-family="Georgia,serif" font-size="31" font-weight="700">COMMONWEALTH BRANCH FACTORY PROGRAMME</text><text x="72" y="119" fill="#bca66a" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">MOVE THE FACTORY, NOT THE WORKER</text><line x1="72" y1="142" x2="1128" y2="142" stroke="#59635e"/><g font-family="Arial,sans-serif"><rect x="72" y="190" width="272" height="330" rx="12" fill="#2d3025" stroke="#9c8d58"/><text x="208" y="230" fill="#f0e9d7" font-size="21" font-weight="700" text-anchor="middle">TRANSFER PACKAGE</text><g fill="#dad6c8" font-size="17"><text x="102" y="274">• capital</text><text x="102" y="311">• machinery</text><text x="102" y="348">• designs and licenses</text><text x="102" y="385">• technical instructors</text><text x="102" y="422">• guaranteed orders</text><text x="102" y="459">• standards and inspection</text></g><path d="M344 355H480" stroke="#bca66a" stroke-width="5"/><path d="M457 342l23 13-23 13" fill="none" stroke="#bca66a" stroke-width="5"/><rect x="480" y="190" width="240" height="330" rx="12" fill="#22352e" stroke="#6d947f"/><path d="M521 430V310h45v-55l48 31v-31l55 36v139z" fill="#314a40" stroke="#88ae99" stroke-width="2"/><rect x="541" y="364" width="26" height="66" fill="#bca66a"/><rect x="589" y="344" width="25" height="25" fill="#c8d7cf"/><rect x="635" y="344" width="25" height="25" fill="#c8d7cf"/><text x="600" y="230" fill="#f0e9d7" font-size="21" font-weight="700" text-anchor="middle">LOCAL PLANT</text><text x="600" y="473" fill="#d2dcd6" font-size="15" text-anchor="middle">branch factory · arsenal</text><text x="600" y="496" fill="#d2dcd6" font-size="15" text-anchor="middle">repair · processing</text><path d="M720 355H856" stroke="#7fa18f" stroke-width="5"/><path d="M833 342l23 13-23 13" fill="none" stroke="#7fa18f" stroke-width="5"/><rect x="856" y="190" width="272" height="330" rx="12" fill="#24302c" stroke="#668577"/><text x="992" y="230" fill="#f0e9d7" font-size="21" font-weight="700" text-anchor="middle">DURABLE CAPACITY</text><g fill="#d0dad4" font-size="17"><text x="886" y="274">• local skilled employment</text><text x="886" y="311">• regional repair depth</text><text x="886" y="348">• shorter supply routes</text><text x="886" y="385">• technical colleges</text><text x="886" y="422">• reciprocal production</text><text x="886" y="459">• national execution</text></g><rect x="260" y="554" width="680" height="46" rx="23" fill="#bca66a"/><text x="600" y="583" fill="#101514" font-size="18" font-weight="700" text-anchor="middle">DISTRIBUTED INDUSTRY · SELECTIVE MIGRATION</text></g></svg>
