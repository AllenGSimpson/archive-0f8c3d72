<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese Mars campaign readiness gates</title>
  <desc id="desc">Five sequential phases from long robotic observation through site preparation to crew commitment, with hold and replacement paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071318"/><stop offset="1" stop-color="#10242a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#d6b45e"/></marker>
    <style>.title{font:700 40px Georgia,serif;fill:#f2ead8}.sub{font:600 17px Arial,sans-serif;letter-spacing:3px;fill:#9dbfc4}.num{font:700 18px Arial,sans-serif;fill:#d6b45e}.head{font:700 21px Georgia,serif;fill:#f4ead7}.copy{font:15px Arial,sans-serif;fill:#c7d5d4}.gate{fill:#112a32;stroke:#4c7d86;stroke-width:3;rx:18}.go{fill:#263427;stroke:#78955d;stroke-width:3;rx:18}.hold{fill:#32211f;stroke:#9d6554;stroke-width:3;rx:18}.line{stroke:#d6b45e;stroke-width:5;fill:none;marker-end:url(#arrow)}.return{stroke:#9d6554;stroke-width:3;stroke-dasharray:11 10;fill:none;marker-end:url(#arrow)}.foot{font:15px Arial,sans-serif;fill:#aebfbe}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">THE JAPANESE MARS READINESS GATE</text>
  <text x="800" y="106" text-anchor="middle" class="sub">SURVIVAL RECORD BEFORE HUMAN COMMITMENT</text>
  <rect x="45" y="220" width="260" height="220" class="gate"/><text x="175" y="260" text-anchor="middle" class="num">01</text><text x="175" y="298" text-anchor="middle" class="head">OBSERVE</text><text x="175" y="336" text-anchor="middle" class="copy">Orbital mapping</text><text x="175" y="365" text-anchor="middle" class="copy">Weather and relay records</text><text x="175" y="394" text-anchor="middle" class="copy">Candidate regions</text>
  <rect x="360" y="220" width="260" height="220" class="gate"/><text x="490" y="260" text-anchor="middle" class="num">02</text><text x="490" y="298" text-anchor="middle" class="head">INSPECT</text><text x="490" y="336" text-anchor="middle" class="copy">Landers and rovers</text><text x="490" y="365" text-anchor="middle" class="copy">Hazards and bearing strength</text><text x="490" y="394" text-anchor="middle" class="copy">Navigation geometry</text>
  <rect x="675" y="220" width="260" height="220" class="gate"/><text x="805" y="260" text-anchor="middle" class="num">03</text><text x="805" y="298" text-anchor="middle" class="head">PREPOSITION</text><text x="805" y="336" text-anchor="middle" class="copy">Utilities and habitat</text><text x="805" y="365" text-anchor="middle" class="copy">Mobility and stores</text><text x="805" y="394" text-anchor="middle" class="copy">Return and propellant systems</text>
  <rect x="990" y="220" width="260" height="220" class="gate"/><text x="1120" y="260" text-anchor="middle" class="num">04</text><text x="1120" y="298" text-anchor="middle" class="head">PROVE</text><text x="1120" y="336" text-anchor="middle" class="copy">Extended automatic operation</text><text x="1120" y="365" text-anchor="middle" class="copy">Fuel reserve and transfer</text><text x="1120" y="394" text-anchor="middle" class="copy">Fault recovery</text>
  <rect x="1305" y="220" width="250" height="220" class="go"/><text x="1430" y="260" text-anchor="middle" class="num">05</text><text x="1430" y="298" text-anchor="middle" class="head">COMMIT CREW</text><text x="1430" y="336" text-anchor="middle" class="copy">Direct human flight</text><text x="1430" y="365" text-anchor="middle" class="copy">Inspection and occupation</text><text x="1430" y="394" text-anchor="middle" class="copy">Bounded surface campaign</text>
  <path d="M305 330H360" class="line"/><path d="M620 330H675" class="line"/><path d="M935 330H990" class="line"/><path d="M1250 330H1305" class="line"/>
  <rect x="545" y="575" width="510" height="145" class="hold"/><text x="800" y="620" text-anchor="middle" class="head">HOLD · REPAIR · REPLACE · WAIT</text><text x="800" y="658" text-anchor="middle" class="copy">A failed gate returns the campaign to robotic work.</text><text x="800" y="687" text-anchor="middle" class="copy">A missed launch window is safer than an unverified destination.</text>
  <path d="M1120 440V520Q1120 575 1055 625" class="return"/><path d="M545 645Q440 645 440 520V440" class="return"/>
  <text x="800" y="820" text-anchor="middle" class="foot">The exact formal criteria and decision authority remain open; the staged operating logic is established.</text>
</svg>
