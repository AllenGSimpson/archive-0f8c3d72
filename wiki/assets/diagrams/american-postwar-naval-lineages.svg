<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">American postwar naval class lineages, 1943 to 1985</title>
  <desc id="desc">A timeline grouping United States battleships, carriers, cruisers, escorts, submarines, and amphibious ships by their introduction periods.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#102a38"/></linearGradient>
    <style>
      .title{font:700 39px Georgia,serif;fill:#eff9fb}.sub{font:18px Arial,sans-serif;fill:#aac7d1;letter-spacing:2px}.axis{stroke:#557684;stroke-width:2}.tick{font:16px Arial,sans-serif;fill:#92afb9}.label{font:700 19px Arial,sans-serif;fill:#d9edf2}.box{stroke-width:2;rx:9}.txt{font:700 16px Arial,sans-serif;fill:#fff}.note{font:15px Arial,sans-serif;fill:#b8d0d8}.war{fill:#765b32;stroke:#d8ad64}.carrier{fill:#145b74;stroke:#61c7dc}.cruiser{fill:#4d3f78;stroke:#ad96e1}.escort{fill:#276149;stroke:#65c690}.submarine{fill:#173f63;stroke:#68a7dc}.amphib{fill:#754755;stroke:#d38ba2}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <text x="900" y="58" text-anchor="middle" class="title">AMERICAN POSTWAR NAVAL LINEAGES</text>
  <text x="900" y="94" text-anchor="middle" class="sub">COMMISSIONING BANDS · 1943–1985</text>
  <line x1="280" y1="145" x2="1715" y2="145" class="axis"/>
  <g class="tick"><text x="300" y="130">1943</text><text x="540" y="130">1950</text><text x="780" y="130">1960</text><text x="1020" y="130">1970</text><text x="1260" y="130">1980</text><text x="1640" y="130">1985</text></g>
  <g opacity=".24" class="axis"><line x1="300" y1="145" x2="300" y2="1010"/><line x1="540" y1="145" x2="540" y2="1010"/><line x1="780" y1="145" x2="780" y2="1010"/><line x1="1020" y1="145" x2="1020" y2="1010"/><line x1="1260" y1="145" x2="1260" y2="1010"/><line x1="1660" y1="145" x2="1660" y2="1010"/></g>
  <text x="45" y="210" class="label">BATTLESHIPS</text>
  <rect x="300" y="175" width="150" height="54" class="box war"/><text x="375" y="208" text-anchor="middle" class="txt">Iowa · 1943–45</text>
  <rect x="475" y="175" width="190" height="54" class="box war"/><text x="570" y="208" text-anchor="middle" class="txt">Montana · 1948–50</text>
  <text x="45" y="307" class="label">FLEET CARRIERS</text>
  <rect x="700" y="270" width="235" height="54" class="box carrier"/><text x="817" y="303" text-anchor="middle" class="txt">United States · 1957–63</text>
  <rect x="905" y="335" width="230" height="54" class="box carrier"/><text x="1020" y="368" text-anchor="middle" class="txt">Enterprise · 1965–70</text>
  <rect x="1085" y="270" width="270" height="54" class="box carrier"/><text x="1220" y="303" text-anchor="middle" class="txt">Saratoga · 1973–81</text>
  <text x="45" y="447" class="label">ASSAULT CARRIERS</text>
  <rect x="980" y="410" width="230" height="54" class="box carrier"/><text x="1095" y="443" text-anchor="middle" class="txt">Wasp · 1968–76</text>
  <rect x="1230" y="410" width="210" height="54" class="box carrier"/><text x="1335" y="443" text-anchor="middle" class="txt">America · 1979–81</text>
  <text x="45" y="544" class="label">CRUISERS</text>
  <rect x="800" y="505" width="240" height="54" class="box cruiser"/><text x="920" y="538" text-anchor="middle" class="txt">Long Beach · 1961–68</text>
  <rect x="1045" y="505" width="245" height="54" class="box cruiser"/><text x="1167" y="538" text-anchor="middle" class="txt">California · 1971–79</text>
  <rect x="1320" y="505" width="270" height="54" class="box cruiser"/><text x="1455" y="538" text-anchor="middle" class="txt">Ticonderoga · 1982–85</text>
  <text x="45" y="641" class="label">DESTROYERS / FRIGATES</text>
  <rect x="775" y="600" width="250" height="54" class="box escort"/><text x="900" y="633" text-anchor="middle" class="txt">Charles F. Adams · 1960–70</text>
  <rect x="980" y="665" width="210" height="54" class="box escort"/><text x="1085" y="698" text-anchor="middle" class="txt">Knox · 1968–77</text>
  <rect x="1135" y="600" width="235" height="54" class="box escort"/><text x="1252" y="633" text-anchor="middle" class="txt">Spruance · 1975–84</text>
  <rect x="1250" y="665" width="220" height="54" class="box escort"/><text x="1360" y="698" text-anchor="middle" class="txt">Perry · 1977–85</text>
  <text x="45" y="789" class="label">SUBMARINES</text>
  <rect x="570" y="750" width="230" height="54" class="box submarine"/><text x="685" y="783" text-anchor="middle" class="txt">Tang / Barbel · 1951–65</text>
  <rect x="905" y="815" width="210" height="54" class="box submarine"/><text x="1010" y="848" text-anchor="middle" class="txt">Triton · 1965–72</text>
  <rect x="1030" y="750" width="220" height="54" class="box submarine"/><text x="1140" y="783" text-anchor="middle" class="txt">Sturgeon · 1970–80</text>
  <rect x="1175" y="815" width="220" height="54" class="box submarine"/><text x="1285" y="848" text-anchor="middle" class="txt">Longbow · 1976–83</text>
  <rect x="1300" y="750" width="270" height="54" class="box submarine"/><text x="1435" y="783" text-anchor="middle" class="txt">Los Angeles · 1978–85</text>
  <text x="45" y="936" class="label">AMPHIBIOUS SHIPS</text>
  <rect x="800" y="900" width="225" height="54" class="box amphib"/><text x="912" y="933" text-anchor="middle" class="txt">Iwo Jima · 1961–70</text>
  <rect x="905" y="965" width="235" height="54" class="box amphib"/><text x="1022" y="998" text-anchor="middle" class="txt">Austin · 1965–77</text>
  <rect x="1030" y="900" width="260" height="54" class="box amphib"/><text x="1160" y="933" text-anchor="middle" class="txt">Newport · 1970–83</text>
  <text x="900" y="1060" text-anchor="middle" class="note">Bands show class entry into service, not retirement dates or uninterrupted construction.</text>
</svg>
