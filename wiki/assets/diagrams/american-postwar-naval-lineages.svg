<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Established American naval generations, 1943 to 1985</title>
  <desc id="desc">A bounded register separating the fixed neutral-war inheritance and named battleship generations from qualitative postwar carrier, cruiser, escort, submarine, amphibious, and support branches whose exact class identities and totals remain open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#102a38"/></linearGradient>
    <style>
      .title{font:700 39px Georgia,serif;fill:#eff9fb}.sub{font:18px Arial,sans-serif;fill:#aac7d1;letter-spacing:2px}.band{fill:#0d2230;stroke:#557684;stroke-width:2}.head{font:700 23px Arial,sans-serif;fill:#e9f6f8}.label{font:700 18px Arial,sans-serif;fill:#fff}.copy{font:16px Arial,sans-serif;fill:#c7dce3}.note{font:15px Arial,sans-serif;fill:#a9c3cc}.fixed{fill:#6b5232;stroke:#d8ad64;stroke-width:2}.branch{fill:#15546a;stroke:#61c7dc;stroke-width:2}.screen{fill:#285c48;stroke:#65c690;stroke-width:2}.undersea{fill:#173f63;stroke:#68a7dc;stroke-width:2}.open{font:700 15px Arial,sans-serif;fill:#f2d18a;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <text x="900" y="58" text-anchor="middle" class="title">ESTABLISHED AMERICAN NAVAL GENERATIONS</text>
  <text x="900" y="94" text-anchor="middle" class="sub">FIXED INHERITANCE · BOUNDED POSTWAR BRANCHES · 1943–1985</text>
  <rect x="55" y="135" width="1690" height="235" rx="18" class="band"/>
  <text x="85" y="178" class="head">FIXED NEUTRAL-WAR INHERITANCE AND BATTLESHIP GENERATIONS</text>
  <g transform="translate(85 210)"><rect width="360" height="112" rx="12" class="fixed"/><text x="180" y="34" text-anchor="middle" class="label">IOWA GENERATION · 1943–45</text><text x="180" y="66" text-anchor="middle" class="copy">four ships commissioned</text><text x="180" y="91" text-anchor="middle" class="copy">fast battle wing; later refits</text></g>
  <g transform="translate(470 210)"><rect width="360" height="112" rx="12" class="fixed"/><text x="180" y="34" text-anchor="middle" class="label">MONTANA GENERATION · 1946–47*</text><text x="180" y="66" text-anchor="middle" class="copy">Montana and Ohio</text><text x="180" y="91" text-anchor="middle" class="copy">heavy answer to Yamato family</text></g>
  <g transform="translate(855 210)"><rect width="360" height="112" rx="12" class="fixed"/><text x="180" y="34" text-anchor="middle" class="label">KENTUCKY GENERATION · c. 1960</text><text x="180" y="66" text-anchor="middle" class="copy">postwar missile-and-gun battleship</text><text x="180" y="91" text-anchor="middle" class="copy">exact class allocation open</text></g>
  <g transform="translate(1240 210)"><rect width="420" height="112" rx="12" class="fixed"/><text x="210" y="34" text-anchor="middle" class="label">MAINE GENERATION · c. 1984</text><text x="210" y="66" text-anchor="middle" class="copy">clean-sheet nuclear battleship</text><text x="210" y="91" text-anchor="middle" class="copy">armored fleet-command center</text></g>
  <text x="85" y="348" class="note">* Principal tables place both Montana-class commissions in 1946–47; a separate Ohio chronology remains unresolved.</text>
  <rect x="55" y="400" width="1690" height="610" rx="18" class="band"/>
  <text x="85" y="445" class="head">POSTWAR BRANCHES PRESERVED BY THE LATER REGISTER</text>
  <g transform="translate(85 485)"><rect width="510" height="138" rx="12" class="branch"/><text x="255" y="35" text-anchor="middle" class="label">FLEET AND ASSAULT AVIATION</text><text x="255" y="67" text-anchor="middle" class="copy">jet/drone generation c. 1958 · enlarged c. 1969</text><text x="255" y="94" text-anchor="middle" class="copy">mature nuclear generation c. 1979</text><text x="255" y="120" text-anchor="middle" class="open">≈ 5 OR 6 FIRST-LINE FLEET CARRIERS IN 1985</text></g>
  <g transform="translate(645 485)"><rect width="510" height="138" rx="12" class="branch"/><text x="255" y="35" text-anchor="middle" class="label">HEAVY AND LIGHT CRUISERS</text><text x="255" y="67" text-anchor="middle" class="copy">command · air defense · reconnaissance · drone relay</text><text x="255" y="94" text-anchor="middle" class="copy">USS Chicago fixed as 1960s nuclear experiment</text><text x="255" y="120" text-anchor="middle" class="open">OTHER CLASS IDENTITIES AND TOTALS OPEN</text></g>
  <g transform="translate(1205 485)"><rect width="455" height="138" rx="12" class="screen"/><text x="227" y="35" text-anchor="middle" class="label">DESTROYERS AND FRIGATES</text><text x="227" y="67" text-anchor="middle" class="copy">general-purpose destroyer families</text><text x="227" y="94" text-anchor="middle" class="copy">specialist ASW and ocean-frigate families</text><text x="227" y="120" text-anchor="middle" class="open">CLASS IDENTITIES AND TOTALS OPEN</text></g>
  <g transform="translate(85 665)"><rect width="510" height="150" rx="12" class="undersea"/><text x="255" y="35" text-anchor="middle" class="label">SUBMARINE FORCE</text><text x="255" y="67" text-anchor="middle" class="copy">capable nuclear reconnaissance-and-attack elite</text><text x="255" y="94" text-anchor="middle" class="copy">very small experimental guided-missile branch</text><text x="255" y="121" text-anchor="middle" class="copy">conventional coastal and training branch</text><text x="255" y="143" text-anchor="middle" class="open">EXACT POSTWAR CLASSES AND TOTALS OPEN</text></g>
  <g transform="translate(645 665)"><rect width="510" height="150" rx="12" class="branch"/><text x="255" y="35" text-anchor="middle" class="label">AMPHIBIOUS FORCE</text><text x="255" y="67" text-anchor="middle" class="copy">helicopter-assault function</text><text x="255" y="94" text-anchor="middle" class="copy">landing-platform-dock function</text><text x="255" y="121" text-anchor="middle" class="copy">fast tank-landing function</text><text x="255" y="143" text-anchor="middle" class="open">ALTERNATE CLASS REGISTRY OPEN</text></g>
  <g transform="translate(1205 665)"><rect width="455" height="150" rx="12" class="screen"/><text x="227" y="35" text-anchor="middle" class="label">FLEET SUPPORT</text><text x="227" y="67" text-anchor="middle" class="copy">mobile replenishment and repair</text><text x="227" y="94" text-anchor="middle" class="copy">mine warfare · protected approaches</text><text x="227" y="121" text-anchor="middle" class="copy">bases and fixed infrastructure</text><text x="227" y="143" text-anchor="middle" class="open">POSTWAR CLASSES AND TOTALS OPEN</text></g>
  <rect x="275" y="855" width="1250" height="105" rx="14" fill="#183544" stroke="#7aa4b4" stroke-width="2"/>
  <text x="900" y="895" text-anchor="middle" class="label">WITHDRAWN NUMERICAL WORKSHEET</text>
  <text x="900" y="925" text-anchor="middle" class="copy">Former carrier, cruiser, escort, submarine, amphibious, auxiliary, mine-warfare, and fast-combatant class ledgers</text>
  <text x="900" y="950" text-anchor="middle" class="open">DO NOT SUPPLY ACTIVE CLASS NAMES, HULL COUNTS, OR COMMISSIONING BANDS</text>
  <text x="900" y="1060" text-anchor="middle" class="note">The diagram distinguishes fixed generations from open registry work; it is not a complete ship list.</text>
</svg>
