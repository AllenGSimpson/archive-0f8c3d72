<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Homeward settlement support system</title><desc id="desc">Returned prisoners pass from Operation Homeward through records review into pensions, health, compensation, family support, training, employment, and housing.</desc><rect width="1200" height="675" fill="#08131c"/><rect x="34" y="34" width="1132" height="607" rx="22" fill="#101f2a" stroke="#b49a5a" stroke-width="2"/><text x="70" y="88" fill="#e8dfc8" font-family="Georgia,serif" font-size="34" font-weight="700">The Homeward settlement</text><text x="70" y="120" fill="#9faeb6" font-family="Arial,sans-serif" font-size="17">Homecoming converted into continuing social and administrative claims</text><rect x="70" y="238" width="240" height="126" rx="14" fill="#19303d" stroke="#638091"/><text x="190" y="277" fill="#d6c586" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">OPERATION HOMEWARD</text><text x="190" y="308" fill="#c3cdd1" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">reception · identity · medical</text><text x="190" y="333" fill="#c3cdd1" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">pay · leave · transport</text><rect x="414" y="225" width="372" height="152" rx="16" fill="#293846" stroke="#d1b86d" stroke-width="2"/><text x="600" y="264" fill="#f0e8d5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">HOMEWARD SETTLEMENT</text><text x="600" y="298" fill="#d6c586" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-weight="700">entitlement · review · placement</text><text x="600" y="330" fill="#b8c4ca" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Claims Tribunal resolves disputed records</text><rect x="890" y="238" width="240" height="126" rx="14" fill="#19303d" stroke="#638091"/><text x="1010" y="277" fill="#d6c586" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">RETURNED LIFE</text><text x="1010" y="308" fill="#c3cdd1" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">family · work · health</text><text x="1010" y="333" fill="#c3cdd1" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">training · housing · memory</text><path d="M310 301H414M786 301H890" stroke="#b49a5a" stroke-width="4"/><path d="M399 291l15 10-15 10M875 291l15 10-15 10" fill="#b49a5a"/><g fill="#20333f" stroke="#587382"><rect x="70" y="452" width="154" height="88" rx="10"/><rect x="239" y="452" width="154" height="88" rx="10"/><rect x="408" y="452" width="154" height="88" rx="10"/><rect x="577" y="452" width="154" height="88" rx="10"/><rect x="746" y="452" width="154" height="88" rx="10"/><rect x="915" y="452" width="215" height="88" rx="10"/></g><g fill="#dce2e4" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700"><text x="147" y="489">PENSIONS</text><text x="316" y="489">TREATMENT</text><text x="485" y="489">LABOR CLAIMS</text><text x="654" y="489">FAMILY SUPPORT</text><text x="823" y="489">TRAINING</text><text x="1022" y="489">EMPLOYMENT &amp; HOUSING</text></g><g fill="#9faeb6" text-anchor="middle" font-family="Arial,sans-serif" font-size="11"><text x="147" y="516">captivity · disability</text><text x="316" y="516">medical · psychiatric</text><text x="485" y="516">unpaid work · arrears</text><text x="654" y="516">allowances · dependants</text><text x="823" y="516">technical qualifications</text><text x="1022" y="516">priority within scarce supply</text></g><text x="600" y="606" fill="#8fa0a9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">No single benefit could reconstruct captivity; together they made it a continuing public obligation.</text></svg>
