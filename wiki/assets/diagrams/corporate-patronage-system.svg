<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Corporate patronage system</title><desc id="desc">Corporate portfolios supply finance, data, services, employment, and media to candidates and affiliated businesses, which return contracts, access, rules, and political protection.</desc><rect width="1200" height="700" fill="#101713"/><text x="600" y="58" fill="#d8c58c" text-anchor="middle" font-family="Georgia,serif" font-size="32">THE CORPORATE-PATRONAGE REPUBLIC</text><g font-family="Arial,sans-serif" text-anchor="middle"><g stroke-width="4"><rect x="70" y="145" width="290" height="125" rx="10" fill="#294b7a" stroke="#6f9fe0"/><rect x="455" y="145" width="290" height="125" rx="10" fill="#5b2027" stroke="#d55c6a"/><rect x="840" y="145" width="290" height="125" rx="10" fill="#145e76" stroke="#63c7d7"/><rect x="300" y="430" width="260" height="115" rx="10" fill="#403c2a" stroke="#d8c58c"/><rect x="640" y="430" width="260" height="115" rx="10" fill="#38414a" stroke="#b4c1cc"/></g><g fill="#fff" font-size="22"><text x="215" y="188">SYSTEMS FIRM</text><text x="215" y="222">finance · standards</text><text x="600" y="188">SPONSOR PORTFOLIO</text><text x="600" y="222">data · media · careers</text><text x="985" y="188">AFFILIATED FIRMS</text><text x="985" y="222">legal · insurance · buying</text><text x="430" y="472">CANDIDATES</text><text x="430" y="507">visibility before voting</text><text x="770" y="472">PUBLIC AUTHORITY</text><text x="770" y="507">contracts · rules · access</text></g><g stroke="#d8c58c" stroke-width="4" fill="none" marker-end="url(#c)"><path d="M360 205 H455"/><path d="M745 205 H840"/><path d="M540 270 455 430"/><path d="M660 270 745 430"/><path d="M560 488 H640"/><path d="M770 430 C800 350 660 330 635 270"/></g><text x="600" y="610" fill="#eef2e8" font-size="22">1998 settlement: disclose and register sponsorship rather than abolish it</text><text x="600" y="650" fill="#9da99d" font-size="17">Conceptual map · exact corporate portfolios and federal enterprise categories remain open</text></g><defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d8c58c"/></marker></defs></svg>
