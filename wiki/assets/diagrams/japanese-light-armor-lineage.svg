<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese armored vehicle families, 1947–1980</title>
  <desc id="desc">A timeline separating the victory-era Chi-Ru tank, Type 4 Kai carrier, post-1952 Yu transport family, Ho infantry combat family, and Ke light-tank family.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111815"/><stop offset="1" stop-color="#20231d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .title{font:700 39px Georgia,serif;letter-spacing:3px;fill:#f3ead5}.sub{font:600 18px Arial,sans-serif;letter-spacing:2px;fill:#c8a45c}.axis{stroke:#6e715f;stroke-width:3}.tick{stroke:#6e715f;stroke-width:2}.year{font:700 18px Arial,sans-serif;fill:#d9d2bf}.row{font:700 19px Arial,sans-serif;letter-spacing:2px;fill:#c8a45c}.box{rx:12;stroke-width:2;filter:url(#shadow)}.name{font:700 23px Georgia,serif;fill:#f7f0df}.kind{font:600 15px Arial,sans-serif;letter-spacing:1px;fill:#d8d0bd}.spec{font:14px Arial,sans-serif;fill:#bbb6a7}.note{font:italic 17px Georgia,serif;fill:#c9c4b5}.family{font:700 15px Arial,sans-serif;letter-spacing:1px;fill:#141713}.dash{stroke:#b7a568;stroke-width:3;stroke-dasharray:9 8;fill:none}.stem{stroke:#8f907d;stroke-width:2}.legend{font:14px Arial,sans-serif;fill:#d0c8b7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="66" text-anchor="middle" class="title">JAPANESE ARMORED VEHICLE FAMILIES</text>
  <text x="800" y="102" text-anchor="middle" class="sub">VICTORY-ERA LEGACY · 1952 REGISTRY · DIFFERENT TACTICAL ROLES</text>

  <line x1="250" y1="155" x2="1460" y2="155" class="axis"/>
  <g text-anchor="middle">
    <line x1="310" y1="143" x2="310" y2="168" class="tick"/><text x="310" y="194" class="year">1947</text>
    <line x1="540" y1="143" x2="540" y2="168" class="tick"/><text x="540" y="194" class="year">1956</text>
    <line x1="620" y1="143" x2="620" y2="168" class="tick"/><text x="620" y="194" class="year">1958</text>
    <line x1="960" y1="143" x2="960" y2="168" class="tick"/><text x="960" y="194" class="year">1973</text>
    <line x1="1040" y1="143" x2="1040" y2="168" class="tick"/><text x="1040" y="194" class="year">1975</text>
    <line x1="1270" y1="143" x2="1270" y2="168" class="tick"/><text x="1270" y="194" class="year">1980</text>
  </g>

  <text x="38" y="282" class="row">BATTLEFIELD TANKS</text>
  <line x1="310" y1="205" x2="310" y2="230" class="stem"/>
  <rect x="225" y="230" width="270" height="120" class="box" fill="#304538" stroke="#88a77c"/>
  <rect x="241" y="244" width="54" height="25" rx="5" fill="#88a77c"/><text x="268" y="262" text-anchor="middle" class="family">CHI</text>
  <text x="360" y="278" text-anchor="middle" class="name">Type 7 Chi-Ru</text><text x="360" y="306" text-anchor="middle" class="kind">MAIN-FORCE TANK · 49.5 t</text><text x="360" y="330" text-anchor="middle" class="spec">88 mm · five crew · victory standard</text>
  <path d="M500 290 H535" class="dash"/><polygon points="535,282 551,290 535,298" fill="#b7a568"/>
  <rect x="551" y="230" width="300" height="120" class="box" fill="#37413d" stroke="#9ea8a1"/>
  <rect x="567" y="244" width="58" height="25" rx="5" fill="#9ea8a1"/><text x="596" y="262" text-anchor="middle" class="family">SHU</text>
  <text x="701" y="278" text-anchor="middle" class="name">Type 16 Shu-Ha</text><text x="701" y="306" text-anchor="middle" class="kind">MAIN-FORCE TANK · 36.0 t</text><text x="701" y="330" text-anchor="middle" class="spec">Separate post-1952 lineage</text>

  <text x="38" y="458" class="row">INFANTRY TRANSPORT</text>
  <rect x="225" y="404" width="270" height="120" class="box" fill="#4b4032" stroke="#b99b62"/>
  <rect x="241" y="418" width="92" height="25" rx="5" fill="#b99b62"/><text x="287" y="436" text-anchor="middle" class="family">TYPE 4</text>
  <text x="360" y="452" text-anchor="middle" class="name">Type 4 Kai</text><text x="360" y="480" text-anchor="middle" class="kind">TRACKED APC · 12.0–12.3 t</text><text x="360" y="504" text-anchor="middle" class="spec">1947 convertible-roof variant</text>
  <rect x="551" y="404" width="300" height="120" class="box" fill="#354a48" stroke="#75a8a2"/>
  <rect x="567" y="418" width="50" height="25" rx="5" fill="#75a8a2"/><text x="592" y="436" text-anchor="middle" class="family">YU</text>
  <text x="701" y="452" text-anchor="middle" class="name">Type 18 Yu-Ha</text><text x="701" y="480" text-anchor="middle" class="kind">TRACKED APC · 17.5 t</text><text x="701" y="504" text-anchor="middle" class="spec">Army Kō · tropical/export Otsu</text>
  <rect x="1120" y="404" width="300" height="120" class="box" fill="#354a48" stroke="#75a8a2"/>
  <rect x="1136" y="418" width="50" height="25" rx="5" fill="#75a8a2"/><text x="1161" y="436" text-anchor="middle" class="family">YU</text>
  <text x="1270" y="452" text-anchor="middle" class="name">Type 40 Yu-Ni</text><text x="1270" y="480" text-anchor="middle" class="kind">WHEELED APC · 18.0 t</text><text x="1270" y="504" text-anchor="middle" class="spec">Imperial rapid-reaction transport</text>

  <text x="38" y="634" class="row">CLOSE BATTLE</text>
  <rect x="810" y="580" width="300" height="120" class="box" fill="#473b49" stroke="#a388ac"/>
  <rect x="826" y="594" width="50" height="25" rx="5" fill="#a388ac"/><text x="851" y="612" text-anchor="middle" class="family">HO</text>
  <text x="960" y="628" text-anchor="middle" class="name">Type 33 Ho-He</text><text x="960" y="656" text-anchor="middle" class="kind">INFANTRY COMBAT VEHICLE · 28.5 t</text><text x="960" y="680" text-anchor="middle" class="spec">30 mm cannon · Type 33 ATGM</text>

  <text x="38" y="782" class="row">LIGHT GUN SYSTEM</text>
  <rect x="890" y="728" width="300" height="120" class="box" fill="#474939" stroke="#aeb177"/>
  <rect x="906" y="742" width="50" height="25" rx="5" fill="#aeb177"/><text x="931" y="760" text-anchor="middle" class="family">KE</text>
  <text x="1040" y="776" text-anchor="middle" class="name">Type 35 Ke-Yo</text><text x="1040" y="804" text-anchor="middle" class="kind">LIGHT TANK · 22.0 t</text><text x="1040" y="828" text-anchor="middle" class="spec">90 mm low-recoil gun · airborne/reconnaissance</text>

  <text x="1450" y="744" text-anchor="end" class="note">Rows show registry role, not direct chassis ancestry.</text>
  <line x1="1120" y1="857" x2="1185" y2="857" class="dash"/><text x="1198" y="862" class="legend">chronological transition to a new battlefield-tank category</text>
</svg>
