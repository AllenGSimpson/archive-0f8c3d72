<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Latin Bloc investment in the American boom</title><desc id="desc">Italy, Occitania, Spain, and Portugal connect through a Scudo investment window to New York while retaining different national reservations.</desc><rect width="1200" height="675" fill="#171421"/><text x="60" y="62" fill="#faf5ff" font-family="Georgia,serif" font-size="32">ONE ATLANTIC WINDOW · FOUR NATIONAL BARGAINS</text><text x="60" y="96" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="17">Latin participation in the World Market Boom</text><g font-family="Arial,sans-serif"><rect x="55" y="145" width="250" height="135" rx="14" fill="#38223c" stroke="#e879f9"/><text x="180" y="187" text-anchor="middle" fill="#fff" font-size="23">ITALY</text><text x="180" y="220" text-anchor="middle" fill="#f5d0fe" font-size="15">private access · IRI reserve</text><text x="180" y="246" text-anchor="middle" fill="#f5d0fe" font-size="15">strategic obligations protected</text><rect x="55" y="395" width="250" height="135" rx="14" fill="#38223c" stroke="#e879f9"/><text x="180" y="437" text-anchor="middle" fill="#fff" font-size="23">OCCITANIA</text><text x="180" y="470" text-anchor="middle" fill="#f5d0fe" font-size="15">aerospace · computing · pharma</text><text x="180" y="496" text-anchor="middle" fill="#f5d0fe" font-size="15">highest exposure</text><rect x="895" y="145" width="250" height="135" rx="14" fill="#38223c" stroke="#e879f9"/><text x="1020" y="187" text-anchor="middle" fill="#fff" font-size="23">SPAIN</text><text x="1020" y="220" text-anchor="middle" fill="#f5d0fe" font-size="15">trade · branches · ventures</text><text x="1020" y="246" text-anchor="middle" fill="#f5d0fe" font-size="15">portfolio control limited</text><rect x="895" y="395" width="250" height="135" rx="14" fill="#38223c" stroke="#e879f9"/><text x="1020" y="437" text-anchor="middle" fill="#fff" font-size="23">PORTUGAL</text><text x="1020" y="470" text-anchor="middle" fill="#f5d0fe" font-size="15">Atlantic and Lusophone broker</text><text x="1020" y="496" text-anchor="middle" fill="#f5d0fe" font-size="15">ports · shipping protected</text><circle cx="600" cy="335" r="132" fill="#33245a" stroke="#c4b5fd" stroke-width="4"/><text x="600" y="303" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="26">SCUDO</text><text x="600" y="336" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="26">INVESTMENT</text><text x="600" y="369" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="26">WINDOW</text><text x="600" y="402" text-anchor="middle" fill="#ddd6fe" font-size="14">monitored · reversible</text></g><g stroke="#fbbf24" stroke-width="4" fill="none"><path d="M305 215 L490 285"/><path d="M305 462 L490 385"/><path d="M895 215 L710 285"/><path d="M895 462 L710 385"/></g><rect x="430" y="565" width="340" height="70" rx="12" fill="#14304a" stroke="#60a5fa"/><text x="600" y="595" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20">NEW YORK ACCESS</text><text x="600" y="620" text-anchor="middle" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="14">listings · bonds · minority capital · branches</text><path d="M600 467 V565" stroke="#60a5fa" stroke-width="5" marker-end="url(#l)"/><defs><marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60a5fa"/></marker></defs></svg>
