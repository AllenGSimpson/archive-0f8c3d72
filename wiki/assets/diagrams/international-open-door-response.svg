<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">International response to the American opening</title><desc id="desc">Capital flows from Britain, Japan, Germany, and the Latin Bloc toward the open American market, while each foreign system retains domestic safeguards.</desc><rect width="1200" height="675" fill="#111827"/><text x="60" y="62" fill="#f8fafc" font-family="Georgia,serif" font-size="32">THE AMERICAN MARKET AS COMMON CAPITAL GATE</text><text x="60" y="96" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">1985–1990 · participation abroad, selective imitation at home</text><circle cx="600" cy="342" r="142" fill="#16324f" stroke="#63b3ed" stroke-width="4"/><text x="600" y="322" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="30">UNITED STATES</text><text x="600" y="356" text-anchor="middle" fill="#bae6fd" font-family="Arial,sans-serif" font-size="18">New York capital</text><text x="600" y="384" text-anchor="middle" fill="#bae6fd" font-family="Arial,sans-serif" font-size="18">software · space · industry</text><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><g><rect x="70" y="150" width="285" height="105" rx="12" fill="#243b53" stroke="#a3b8cc"/><text x="212" y="188" fill="#fff">BRITAIN</text><text x="212" y="220" fill="#cbd5e1" font-size="16">closest imitation · 3 firebreaks</text></g><g><rect x="845" y="150" width="285" height="105" rx="12" fill="#3b2222" stroke="#f87171"/><text x="987" y="188" fill="#fff">JAPAN</text><text x="987" y="220" fill="#fecaca" font-size="16">investment · bounded home access</text></g><g><rect x="70" y="470" width="285" height="105" rx="12" fill="#303238" stroke="#d1d5db"/><text x="212" y="508" fill="#fff">GERMANY</text><text x="212" y="540" fill="#e5e7eb" font-size="16">market as instrument · audit</text></g><g><rect x="845" y="470" width="285" height="105" rx="12" fill="#3b2f4a" stroke="#c4b5fd"/><text x="987" y="508" fill="#fff">LATIN BLOC</text><text x="987" y="540" fill="#ddd6fe" font-size="16">four national bargains</text></g></g><g stroke="#fbbf24" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M355 230 C430 250 445 280 470 300"/><path d="M845 230 C770 250 755 280 730 300"/><path d="M355 495 C430 465 445 425 470 405"/><path d="M845 495 C770 465 755 425 730 405"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker></defs><text x="600" y="635" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">The foreign systems entered the American market; none surrendered organized political control at home.</text></svg>
