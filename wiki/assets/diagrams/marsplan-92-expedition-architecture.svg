<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Marsplan 92 expedition architecture</title>
  <desc id="desc">Schematic of the German Marsplan 92 integrated expedition vessel, including its nuclear propulsion spine, hydrogen tanks, paired rotating habitats, orbital command node, and lander cluster.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131c"/><stop offset="1" stop-color="#24303b"/></linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#445765"/><stop offset=".5" stop-color="#9fb0b9"/><stop offset="1" stop-color="#3b4c58"/></linearGradient>
    <style>.title{font:700 42px Georgia,serif;fill:#f5f1e8}.sub{font:18px Arial,sans-serif;fill:#b8c4ca;letter-spacing:2px}.line{stroke:#d5b858;stroke-width:8;fill:none}.thin{stroke:#708591;stroke-width:3;fill:none}.tank{fill:url(#tank);stroke:#d9e1e5;stroke-width:2}.module{fill:#152c3c;stroke:#d5b858;stroke-width:3}.lander{fill:#243949;stroke:#d87362;stroke-width:3}.label{font:700 20px Arial,sans-serif;fill:#f7f4ec}.copy{font:17px Arial,sans-serif;fill:#c8d3d8}.tag{font:700 15px Arial,sans-serif;fill:#e2c66c;letter-spacing:1.3px}.arrow{stroke:#b9c7ce;stroke-width:2;marker-end:url(#head)}.foot{font:16px Arial,sans-serif;fill:#aebdc4}</style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b9c7ce"/></marker>
  </defs>
  <rect width="1800" height="900" fill="url(#bg)"/>
  <text x="900" y="62" text-anchor="middle" class="title">MARSPLAN 92 · INTEGRATED EXPEDITION VESSEL</text>
  <text x="900" y="100" text-anchor="middle" class="sub">ORBIT-ASSEMBLED SHIP COMPLEX · SCHEMATIC, NOT TO SCALE</text>

  <line x1="180" y1="440" x2="1580" y2="440" class="line"/>
  <g transform="translate(90 365)"><path d="M0 75 L65 25 L125 25 L125 125 L65 125 Z" class="module"/><circle cx="30" cy="50" r="18" fill="#df6d5e"/><circle cx="30" cy="100" r="18" fill="#df6d5e"/><circle cx="72" cy="50" r="18" fill="#df6d5e"/><circle cx="72" cy="100" r="18" fill="#df6d5e"/></g>
  <rect x="230" y="370" width="110" height="140" rx="12" class="module"/>
  <g><ellipse cx="435" cy="440" rx="78" ry="112" class="tank"/><ellipse cx="590" cy="440" rx="78" ry="112" class="tank"/><ellipse cx="745" cy="440" rx="78" ry="112" class="tank"/><ellipse cx="900" cy="440" rx="78" ry="112" class="tank"/></g>
  <g><line x1="1020" y1="440" x2="1120" y2="260" class="thin"/><line x1="1020" y1="440" x2="1120" y2="620" class="thin"/><rect x="1080" y="195" width="210" height="120" rx="42" class="module"/><rect x="1080" y="565" width="210" height="120" rx="42" class="module"/><path d="M1015 410a44 44 0 1 1 0 60a44 44 0 1 1 0-60" fill="#263c4b" stroke="#d5b858" stroke-width="3"/></g>
  <g transform="translate(1330 305)"><rect width="175" height="270" rx="28" class="module"/><circle cx="87" cy="56" r="32" fill="#5b7484"/><rect x="45" y="105" width="85" height="105" rx="12" fill="#203a4b" stroke="#9eb2bc" stroke-width="2"/><path d="M55 270 L25 315 M120 270 L150 315" class="thin"/></g>
  <g transform="translate(1515 220)"><path d="M0 70 L65 0 L130 70 L105 155 L25 155 Z" class="lander"/><path d="M0 240 L65 170 L130 240 L105 325 L25 325 Z" class="lander"/><path d="M-10 410 L55 340 L120 410 L95 495 L15 495 Z" class="lander"/><path d="M135 240 L200 170 L265 240 L240 325 L160 325 Z" class="lander"/><path d="M135 410 L200 340 L265 410 L240 495 L160 495 Z" class="lander"/></g>

  <g><text x="115" y="690" class="tag">NUCLEAR-THERMAL PROPULSION</text><text x="115" y="718" class="copy">Clustered engines · shadow shield · radiators</text><line x1="235" y1="665" x2="180" y2="520" class="arrow"/></g>
  <g><text x="390" y="735" class="tag">HYDROGEN PROPELLANT</text><text x="390" y="763" class="copy">Departure, capture, maneuver, and protected return reserves</text><line x1="630" y1="710" x2="630" y2="560" class="arrow"/></g>
  <g><text x="975" y="145" class="tag">PAIRED ROTATING HABITATS</text><text x="975" y="173" class="copy">Cruise living space · balance · redundancy · partial gravity</text><line x1="1120" y1="185" x2="1160" y2="225" class="arrow"/></g>
  <g><text x="1290" y="660" class="tag">ORBITAL COMMAND NODE</text><text x="1290" y="688" class="copy">Navigation · Mars mapping · return control</text><line x1="1400" y1="635" x2="1412" y2="560" class="arrow"/></g>
  <g><text x="1470" y="760" class="tag">FIVE DESCENDING ELEMENTS</text><text x="1470" y="788" class="copy">Four cargo landers and crew descent/ascent system</text><line x1="1610" y1="735" x2="1645" y2="690" class="arrow"/></g>
  <text x="900" y="858" text-anchor="middle" class="foot">The ship enters Mars orbit as one connected system; its propulsion, rotating quarters, fuel reserve, and orbital command section remain above Mars while the base descends.</text>
</svg>
