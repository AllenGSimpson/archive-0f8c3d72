<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Chilean domestic-capital system</title><desc id="desc">Copper revenue and public strategic assets support development finance, domestic enterprise, procurement, and controlled foreign participation.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101c26"/><stop offset="1" stop-color="#263138"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#c8d0ce"/></marker><style>.h{font:700 28px Georgia,serif;fill:#f3ead6}.t{font:700 19px Georgia,serif;fill:#f3ead6}.k{font:700 12px Arial,sans-serif;letter-spacing:1.6px;fill:#afbfbc}.p{font:14px Arial,sans-serif;fill:#d1d7d5}.b{stroke:#748784;stroke-width:2;filter:url(#s)}.l{stroke:#c8d0ce;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="520" fill="url(#bg)"/><text class="h" x="600" y="45" text-anchor="middle">Chilean domestic-capital system</text><rect class="b" x="420" y="80" width="360" height="105" rx="14" fill="#6d4a2e"/><text class="k" x="600" y="108" text-anchor="middle">PUBLIC STRATEGIC FOUNDATION</text><text class="t" x="600" y="140" text-anchor="middle">Copper revenue and national assets</text><text class="p" x="600" y="165" text-anchor="middle">Ports · communications · energy · defense capacity</text><rect class="b" x="70" y="235" width="300" height="125" rx="14" fill="#394d68"/><text class="k" x="220" y="264" text-anchor="middle">DIRECTED CAPITAL</text><text class="t" x="220" y="297" text-anchor="middle">Development finance</text><text class="p" x="220" y="326" text-anchor="middle">Credit · guarantees · project loans</text><rect class="b" x="450" y="235" width="300" height="125" rx="14" fill="#3b604d"/><text class="k" x="600" y="264" text-anchor="middle">NATIONAL OPERATORS</text><text class="t" x="600" y="297" text-anchor="middle">Chilean enterprise</text><text class="p" x="600" y="326" text-anchor="middle">Firms · contractors · suppliers · exporters</text><rect class="b" x="830" y="235" width="300" height="125" rx="14" fill="#58415b"/><text class="k" x="980" y="264" text-anchor="middle">CONTROLLED FOREIGN INPUT</text><text class="t" x="980" y="297" text-anchor="middle">External capital and technology</text><text class="p" x="980" y="326" text-anchor="middle">American largest · other suppliers diversified</text><rect class="b" x="310" y="410" width="580" height="80" rx="14" fill="#62592f"/><text class="t" x="600" y="443" text-anchor="middle">Procurement and investment review</text><text class="p" x="600" y="470" text-anchor="middle">Local production · training · maintenance · strategic exclusions</text><path class="l" d="M510 185L270 225"/><path class="l" d="M600 185V225"/><path class="l" d="M690 185L930 225"/><path class="l" d="M220 360L465 402"/><path class="l" d="M600 360V400"/><path class="l" d="M980 360L735 402"/></svg>
