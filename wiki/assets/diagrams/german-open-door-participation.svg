<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">German participation in American markets</title><desc id="desc">German investors pass through an Atlantic participation service into American markets while domestic market windows admit only bounded claims.</desc><rect width="1200" height="675" fill="#151719"/><text x="60" y="62" fill="#f5f5f4" font-family="Georgia,serif" font-size="32">THE MARKET AS INSTRUMENT</text><text x="60" y="96" fill="#a8a29e" font-family="Arial,sans-serif" font-size="17">German participation, technical mediation, and state legibility</text><g font-family="Arial,sans-serif"><rect x="55" y="155" width="300" height="360" rx="16" fill="#24282b" stroke="#d6d3d1"/><text x="205" y="205" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="27">GERMAN CAPITAL</text><text x="95" y="265" fill="#d6d3d1" font-size="17">banks · insurers</text><text x="95" y="310" fill="#d6d3d1" font-size="17">industrial firms</text><text x="95" y="355" fill="#d6d3d1" font-size="17">pensions · exporters</text><text x="95" y="400" fill="#d6d3d1" font-size="17">Frankfurt · Hamburg · Vienna</text><rect x="440" y="210" width="320" height="250" rx="18" fill="#26331f" stroke="#84cc16" stroke-width="3"/><text x="600" y="265" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">ATLANTIK-</text><text x="600" y="299" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="25">BETEILIGUNGSDIENST</text><text x="600" y="345" text-anchor="middle" fill="#d9f99d" font-size="16">filings · analysis · legal · proxy</text><text x="600" y="376" text-anchor="middle" fill="#d9f99d" font-size="16">settlement · participant records</text><text x="600" y="416" text-anchor="middle" fill="#bef264" font-size="14">coordination need not equal ownership</text><rect x="845" y="155" width="300" height="360" rx="16" fill="#17283f" stroke="#60a5fa"/><text x="995" y="205" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="27">AMERICA</text><text x="885" y="265" fill="#bfdbfe" font-size="17">equities · bonds</text><text x="885" y="310" fill="#bfdbfe" font-size="17">licenses · software</text><text x="885" y="355" fill="#bfdbfe" font-size="17">distribution · industry</text><text x="885" y="400" fill="#bfdbfe" font-size="17">commercial technology</text></g><g stroke="#fbbf24" stroke-width="5" fill="none" marker-end="url(#g)"><path d="M355 335 H440"/><path d="M760 335 H845"/></g><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker></defs><rect x="190" y="555" width="820" height="60" rx="12" fill="#3a2720" stroke="#f59e0b"/><text x="600" y="592" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="18">1990 lesson: map every claim · convert losses into managed obligations · keep politics above capital</text></svg>
