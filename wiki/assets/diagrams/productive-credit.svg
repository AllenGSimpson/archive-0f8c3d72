<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Productive credit</title><desc id="d">National Renewal policy divides finance by intended productive and speculative use.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151d"/><stop offset="1" stop-color="#263037"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#8aa1a8"/></marker></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="#f2f5f3" font-family="Georgia,serif" font-size="31">Productive credit</text><text x="60" y="105" fill="#a7b9bd" font-family="Arial,sans-serif" font-size="17">Finance judged by the capacity it is intended to create</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="225" width="250" height="180" rx="18" fill="#283c43" stroke="#819ca5" stroke-width="3"/><text x="205" y="270" fill="#edf3f2" font-size="20" font-weight="700">CREDIT</text><text x="205" y="312" fill="#bdcdd0" font-size="15">tax / banks / guarantees</text><text x="205" y="340" fill="#bdcdd0" font-size="15">procurement / funds</text><rect x="465" y="160" width="300" height="190" rx="18" fill="#29473e" stroke="#91ad7d" stroke-width="3"/><text x="615" y="205" fill="#f0f4ef" font-size="20" font-weight="700">PRODUCTIVE</text><text x="615" y="245" fill="#c8d8cf" font-size="15">factory / farm / housing</text><text x="615" y="273" fill="#c8d8cf" font-size="15">machine / computer / power</text><text x="615" y="301" fill="#c8d8cf" font-size="15">transport / skilled work</text><rect x="465" y="405" width="300" height="130" rx="18" fill="#49363a" stroke="#aa7771" stroke-width="3"/><text x="615" y="455" fill="#f4eeee" font-size="20" font-weight="700">SPECULATIVE</text><text x="615" y="490" fill="#ddc1c1" font-size="15">price gain without maintained capacity</text><rect x="885" y="225" width="245" height="180" rx="18" fill="#3c3942" stroke="#9a8daa" stroke-width="3"/><text x="1008" y="270" fill="#f1eef5" font-size="19" font-weight="700">JUDGMENT</text><text x="1008" y="312" fill="#d0c9d8" font-size="15">administrative</text><text x="1008" y="340" fill="#d0c9d8" font-size="15">political / imperfect</text></g><g stroke="#8aa1a8" stroke-width="3" marker-end="url(#a)"><path d="M330 300l120-70"/><path d="M330 335l120 95"/><path d="M765 255l105 45"/><path d="M765 470l105-120"/></g></svg>
