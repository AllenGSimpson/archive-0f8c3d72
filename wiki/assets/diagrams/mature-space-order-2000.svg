<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The five mature space systems around 2000</title><desc id="desc">Comparison of German, American, Japanese, British Commonwealth, and Latin orbital, lunar, and planetary systems.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#192b3e"/></linearGradient><style>.title{font:700 42px Georgia,serif;fill:#f1f7fb}.sub{font:18px Arial,sans-serif;fill:#acc3cf;letter-spacing:2px}.box{fill:#112737;stroke-width:3}.g{stroke:#d75656}.u{stroke:#65b7dc}.j{stroke:#e0b44f}.b{stroke:#9b8bd1}.l{stroke:#75bd82}.head{font:700 28px Arial,sans-serif;fill:#f5f8fb}.tag{font:700 16px Arial,sans-serif;letter-spacing:1.5px}.copy{font:18px Arial,sans-serif;fill:#c8d7df}.strong{font:700 20px Arial,sans-serif;fill:#fff}.axis{stroke:#617d8a;stroke-width:2}.foot{font:18px Arial,sans-serif;fill:#b5cad3}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="800" y="65" text-anchor="middle" class="title">THE FIVE MATURE SPACE SYSTEMS</text><text x="800" y="102" text-anchor="middle" class="sub">ORBIT · MOON · PLANETARY REACH · AROUND 2000</text>
  <line x1="800" y1="145" x2="800" y2="900" class="axis" opacity=".35"/><line x1="100" y1="520" x2="1500" y2="520" class="axis" opacity=".35"/>
  <g transform="translate(80 145)"><rect width="680" height="330" rx="24" class="box g"/><text x="35" y="50" class="head">GREATER GERMAN REICH</text><text x="35" y="82" class="tag" fill="#ef8181">INTERPLANETARY SHIPBUILDING POWER</text><text x="35" y="130" class="strong">Orbit</text><text x="145" y="130" class="copy">Raumhafen · Raumwerft · Promenadenring</text><text x="35" y="180" class="strong">Moon</text><text x="145" y="180" class="copy">Mondhafen Süd · structural industry</text><text x="35" y="230" class="strong">Mars</text><text x="145" y="230" class="copy">First human base · Tharsis–Olympus · 1993</text><text x="35" y="280" class="strong">Doctrine</text><text x="145" y="280" class="copy">Build the complete expedition in orbit</text></g>
  <g transform="translate(840 145)"><rect width="680" height="330" rx="24" class="box u"/><text x="35" y="50" class="head">UNITED STATES</text><text x="35" y="82" class="tag" fill="#7ed1f2">COMMERCIAL TRANSPORT AND SETTLEMENT</text><text x="35" y="130" class="strong">Orbit</text><text x="145" y="130" class="copy">Columbia · Frontier Annex · mixed carriers</text><text x="35" y="180" class="strong">Moon</text><text x="145" y="180" class="copy">Kennedy Station · corporate extraction</text><text x="35" y="230" class="strong">Mars</text><text x="145" y="230" class="copy">First corporate crew west of Olympus · 1999</text><text x="35" y="280" class="strong">Doctrine</text><text x="145" y="280" class="copy">Spaceplanes for service; rockets for bulk lift</text></g>
  <g transform="translate(80 565)"><rect width="450" height="320" rx="24" class="box j"/><text x="30" y="50" class="head">EMPIRE OF JAPAN</text><text x="30" y="82" class="tag" fill="#f0cb73">MACHINE-FIRST PRECISION</text><text x="30" y="130" class="strong">Hōrai and Raumhafen modules</text><text x="30" y="175" class="copy">Kaguya Base after robotic preparation</text><text x="30" y="220" class="copy">Polar power and closed-cycle systems</text><text x="30" y="265" class="copy">Compact direct Mars expedition</text></g>
  <g transform="translate(575 565)"><rect width="450" height="320" rx="24" class="box b"/><text x="30" y="50" class="head">BRITISH COMMONWEALTH</text><text x="30" y="82" class="tag" fill="#b9a9eb">DISTRIBUTED SOVEREIGN ACCESS</text><text x="30" y="130" class="strong">Resolution and High Mast</text><text x="30" y="175" class="copy">Serenity in Mare Serenitatis</text><text x="30" y="220" class="copy">Commonwealth industrial workshare</text><text x="30" y="265" class="copy">Valles Marineris landing · 1998</text></g>
  <g transform="translate(1070 565)"><rect width="450" height="320" rx="24" class="box l"/><text x="30" y="50" class="head">LATIN SPACE COMMUNITY</text><text x="30" y="82" class="tag" fill="#9ad6a3">EXPLORATORY NAVY</text><text x="30" y="130" class="strong">Stella Maris exploration yard</text><text x="30" y="175" class="copy">Our Lady of the Moon</text><text x="30" y="220" class="copy">Asteroid-belt resource surveys</text><text x="30" y="265" class="copy">First human expedition to Ceres</text></g>
  <rect x="265" y="925" width="1070" height="44" rx="22" fill="#173448" stroke="#66899a"/><text x="800" y="954" text-anchor="middle" class="foot">Independent access coexists with shared rescue, registration, communications, and encounter rules</text>
</svg>
