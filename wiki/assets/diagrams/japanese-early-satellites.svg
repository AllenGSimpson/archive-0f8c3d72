<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Japan's first three practical satellites</title><desc id="desc">Archive technical comparison of Ōsumi I, Kuroshio I, and Yamabiko I.</desc>
