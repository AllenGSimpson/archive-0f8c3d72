<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The 1990 cross-bloc financial shock</title><desc id="desc">An American forced-sale cascade transmits losses outward, where British, Japanese, German, and Latin firebreaks stop a general depression.</desc><rect width="1200" height="675" fill="#11151c"/><text x="60" y="62" fill="#f8fafc" font-family="Georgia,serif" font-size="32">THE 1990 CROSS-BLOC SHOCK</text><text x="60" y="96" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Losses traveled; the American household-credit cascade did not</text><rect x="60" y="150" width="1080" height="125" rx="18" fill="#451a1a" stroke="#ef4444" stroke-width="3"/><text x="600" y="190" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="27">AMERICAN FORCED DIVESTITURE</text><text x="600" y="226" text-anchor="middle" fill="#fecaca" font-family="Arial,sans-serif" font-size="18">equity ↓ → collateral ↓ → credit ↓ → orders &amp; employment ↓</text><g stroke="#f87171" stroke-width="5" marker-end="url(#s)"><path d="M250 275 V365"/><path d="M485 275 V365"/><path d="M715 275 V365"/><path d="M950 275 V365"/></g><g font-family="Arial,sans-serif"><g><rect x="85" y="365" width="270" height="180" rx="14" fill="#1f3448" stroke="#60a5fa"/><text x="220" y="405" text-anchor="middle" fill="#fff" font-size="22">BRITAIN</text><text x="220" y="440" text-anchor="middle" fill="#bfdbfe" font-size="15">freeze · clearing guarantee</text><text x="220" y="468" text-anchor="middle" fill="#bfdbfe" font-size="15">gradual unwind</text><text x="220" y="515" text-anchor="middle" fill="#86efac" font-weight="bold" font-size="16">CASCADE STOPPED</text></g><g><rect x="365" y="365" width="270" height="180" rx="14" fill="#3c2025" stroke="#fb7185"/><text x="500" y="405" text-anchor="middle" fill="#fff" font-size="22">JAPAN</text><text x="500" y="440" text-anchor="middle" fill="#fecdd3" font-size="15">merger · cross-shareholding</text><text x="500" y="468" text-anchor="middle" fill="#fecdd3" font-size="15">directed rollover</text><text x="500" y="515" text-anchor="middle" fill="#86efac" font-weight="bold" font-size="16">CASCADE STOPPED</text></g><g><rect x="645" y="365" width="270" height="180" rx="14" fill="#2d3033" stroke="#d6d3d1"/><text x="780" y="405" text-anchor="middle" fill="#fff" font-size="22">GERMANY</text><text x="780" y="440" text-anchor="middle" fill="#e7e5e4" font-size="15">support · long claims</text><text x="780" y="468" text-anchor="middle" fill="#e7e5e4" font-size="15">ownership audit</text><text x="780" y="515" text-anchor="middle" fill="#86efac" font-weight="bold" font-size="16">CASCADE STOPPED</text></g><g><rect x="925" y="365" width="220" height="180" rx="14" fill="#362747" stroke="#c4b5fd"/><text x="1035" y="405" text-anchor="middle" fill="#fff" font-size="22">LATIN BLOC</text><text x="1035" y="440" text-anchor="middle" fill="#ddd6fe" font-size="15">state banks · IRI</text><text x="1035" y="468" text-anchor="middle" fill="#ddd6fe" font-size="15">Development Bank · Scudo</text><text x="1035" y="515" text-anchor="middle" fill="#86efac" font-weight="bold" font-size="16">CASCADE STOPPED</text></g></g><rect x="255" y="585" width="690" height="56" rx="10" fill="#17352a" stroke="#4ade80"/><text x="600" y="620" text-anchor="middle" fill="#bbf7d0" font-family="Arial,sans-serif" font-size="18">1991–1992 settlement: trade and interoperability survive · broad foreign ownership closes</text><defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f87171"/></marker></defs></svg>
