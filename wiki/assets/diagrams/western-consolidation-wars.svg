<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Western Indian consolidation wars, 1972 to 1982</title>
  <desc id="desc">Comparison of the Kashmir-Khalistan War, Second Las Bela War, and Hindustan-Rajputana War.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#29232b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/><text x="55" y="66" fill="#f5eddb" font-family="Georgia,serif" font-size="34">THREE WARS OF CONSOLIDATION</text><text x="55" y="103" fill="#a9b6c2" font-family="Arial,sans-serif" font-size="17">Each produces a limited winner, a surviving loser, and a stronger external constraint</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="55" y="155" width="340" height="405" rx="19" fill="#263747" stroke="#73a0bc"/><text x="80" y="197" fill="#fff" font-size="21" font-weight="700">KASHMIR-KHALISTAN</text><text x="80" y="227" fill="#cce2ee" font-size="17">1972-75</text><line x1="80" y1="251" x2="370" y2="251" stroke="#73a0bc"/><text x="80" y="289" fill="#fff" font-size="16" font-weight="700">OPENING</text><text x="80" y="316" fill="#d7e1e8" font-size="15">Khalistan takes the initiative</text><text x="80" y="354" fill="#fff" font-size="16" font-weight="700">INTERVENTION</text><text x="80" y="381" fill="#d7e1e8" font-size="15">Afghanistan enters for Kashmir</text><text x="80" y="419" fill="#fff" font-size="16" font-weight="700">SETTLEMENT</text><text x="80" y="446" fill="#d7e1e8" font-size="15">Most of the line restored</text><text x="80" y="473" fill="#d7e1e8" font-size="15">Permanent Afghan access</text><rect x="80" y="498" width="290" height="42" rx="9" fill="#172631"/><text x="225" y="525" text-anchor="middle" fill="#dcebf2" font-size="15">Kashmir survives; Kabul gains</text>
    <rect x="430" y="155" width="340" height="405" rx="19" fill="#3a382b" stroke="#c2aa68"/><text x="455" y="197" fill="#fff" font-size="21" font-weight="700">SECOND LAS BELA</text><text x="455" y="227" fill="#efe2b9" font-size="17">1976-79</text><line x1="455" y1="251" x2="745" y2="251" stroke="#c2aa68"/><text x="455" y="289" fill="#fff" font-size="16" font-weight="700">OPENING</text><text x="455" y="316" fill="#e4dfcf" font-size="15">Balochistan attacks for the coast</text><text x="455" y="354" fill="#fff" font-size="16" font-weight="700">INTERVENTION</text><text x="455" y="381" fill="#e4dfcf" font-size="15">Iran arms one side; Sindh the other</text><text x="455" y="419" fill="#fff" font-size="16" font-weight="700">SETTLEMENT</text><text x="455" y="446" fill="#e4dfcf" font-size="15">Kalat retains most of Las Bela</text><text x="455" y="473" fill="#e4dfcf" font-size="15">Mechanized rivalry deepens</text><rect x="455" y="498" width="290" height="42" rx="9" fill="#292719"/><text x="600" y="525" text-anchor="middle" fill="#f0e7c9" font-size="15">Kalat holds; dispute survives</text>
    <rect x="805" y="155" width="340" height="405" rx="19" fill="#3d2f35" stroke="#bd8492"/><text x="830" y="197" fill="#fff" font-size="21" font-weight="700">HINDUSTAN-RAJPUTANA</text><text x="830" y="227" fill="#efd9df" font-size="17">1979-82</text><line x1="830" y1="251" x2="1120" y2="251" stroke="#bd8492"/><text x="830" y="289" fill="#fff" font-size="16" font-weight="700">OPENING</text><text x="830" y="316" fill="#e6dce0" font-size="15">Hindustan concentrates one army</text><text x="830" y="354" fill="#fff" font-size="16" font-weight="700">INTERVENTION</text><text x="830" y="381" fill="#e6dce0" font-size="15">Rivals calibrate aid to Rajputana</text><text x="830" y="419" fill="#fff" font-size="16" font-weight="700">SETTLEMENT</text><text x="830" y="446" fill="#e6dce0" font-size="15">Narrow belt and demilitarized line</text><text x="830" y="473" fill="#e6dce0" font-size="15">Rajput joint institutions deepen</text><rect x="830" y="498" width="290" height="42" rx="9" fill="#2b1e24"/><text x="975" y="525" text-anchor="middle" fill="#f1e1e5" font-size="15">Hindustan wins; conquest stops</text>
  </g>
  <rect x="145" y="620" width="910" height="72" rx="14" fill="#1d2730" stroke="#738494"/><text x="600" y="650" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="22">COMMON RESULT</text><text x="600" y="678" text-anchor="middle" fill="#b9c5cf" font-family="Arial,sans-serif" font-size="16">Harder borders and stronger armies without an accepted final settlement</text>
</svg>
