<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">British Fighter Development, 1944–1964</title>
  <desc id="desc">A timeline and lineage chart connecting Meteor, Vampire, Attacker, Hunter, Javelin, and Lightning through Royal Air Force, export, and Fleet Air Arm branches.</desc>
  <defs><style>
    .bg{fill:#101f2e}.rule{stroke:#71889b;stroke-width:4}.branch{fill:none;stroke:#e2bd56;stroke-width:5}.branch2{fill:none;stroke:#75b3b0;stroke-width:5}.branch3{fill:none;stroke:#c47f63;stroke-width:5}.dot{fill:#8799a8}.box{stroke-width:2}.h{font:700 38px Georgia,serif;fill:#fff6df}.sub{font:20px Arial,sans-serif;fill:#e7f1f5}.year{font:700 17px Arial,sans-serif;fill:#ffd563}.label{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#f6fbff}.name{font:700 25px Arial,sans-serif;fill:white}.copy{font:16px Arial,sans-serif;fill:white}.small{font:14px Arial,sans-serif;fill:#dbe8ee}
  </style></defs>
  <rect class="bg" width="1200" height="900"/>
  <text class="h" x="60" y="65">British Fighter Development, 1944–1964</text>
  <text class="sub" x="62" y="102">Home defense · lightweight Commonwealth reach · carrier conversion · Mach 2 interception</text>
  <line class="rule" x1="120" y1="155" x2="1110" y2="155"/>
  <g class="year"><text x="135" y="135">1944</text><text x="300" y="135">1946</text><text x="430" y="135">1947</text><text x="555" y="135">1948</text><text x="735" y="135">1954</text><text x="865" y="135">1956</text><text x="1035" y="135">1964</text></g>
  <g class="dot"><circle cx="155" cy="155" r="7"/><circle cx="320" cy="155" r="7"/><circle cx="450" cy="155" r="7"/><circle cx="575" cy="155" r="7"/><circle cx="755" cy="155" r="7"/><circle cx="885" cy="155" r="7"/><circle cx="1055" cy="155" r="7"/></g>
  <text class="label" x="60" y="215">ROYAL AIR FORCE · DEFENSIVE JET FOUNDATION</text>
  <rect class="box" x="100" y="235" width="275" height="115" rx="12" fill="#396c87" stroke="#9dccdf"/>
  <text class="name" x="125" y="276">Meteor F.3</text><text class="copy" x="125" y="310">Defensive twin jet · 1944</text><text class="small" x="125" y="335">Four 20 mm cannon</text>
  <path class="branch" d="M375 292 C510 292 555 290 690 290"/>
  <text class="label" x="60" y="410">LIGHTWEIGHT / COMMONWEALTH AND EXPORT</text>
  <rect class="box" x="120" y="430" width="275" height="110" rx="12" fill="#3f7c70" stroke="#9ed7ca"/>
  <text class="name" x="145" y="470">Vampire F.1</text><text class="copy" x="145" y="503">Lightweight fighter · 1946</text><text class="small" x="145" y="527">Single engine · four cannon</text>
  <rect class="box" x="460" y="430" width="285" height="110" rx="12" fill="#4a887c" stroke="#a9ded2"/>
  <text class="name" x="485" y="470">Vampire FB.5</text><text class="copy" x="485" y="503">Fighter-bomber · 1948</text><text class="small" x="485" y="527">Export reach · 900 kg stores</text>
  <path class="branch2" d="M395 485 L460 485"/>
  <text class="label" x="60" y="605">FLEET AIR ARM · CARRIER CONVERSION</text>
  <rect class="box" x="185" y="625" width="310" height="110" rx="12" fill="#855845" stroke="#d8a187"/>
  <text class="name" x="210" y="665">Attacker FB.1</text><text class="copy" x="210" y="698">First Fleet Air Arm jet · 1947</text><text class="small" x="210" y="722">Four cannon · 900 kg stores</text>
  <text class="label" x="705" y="215">MATURE SPECIALIZATION</text>
  <rect class="box" x="690" y="235" width="225" height="105" rx="12" fill="#665a86" stroke="#b5a8d5"/>
  <text class="name" x="715" y="273">Hunter F.1</text><text class="copy" x="715" y="304">Day fighter · 1954</text><text class="small" x="715" y="328">Four 30 mm ADEN</text>
  <rect class="box" x="690" y="365" width="235" height="115" rx="12" fill="#665a86" stroke="#b5a8d5"/>
  <text class="name" x="715" y="405">Javelin FAW.1</text><text class="copy" x="715" y="438">All-weather · 1956</text><text class="small" x="715" y="463">Radar · cannon · four missiles</text>
  <rect class="box" x="965" y="295" width="210" height="130" rx="12" fill="#305e83" stroke="#f0c657" stroke-width="4"/>
  <text class="label" x="990" y="325">MACH 2 DEFENSE</text><text class="name" x="990" y="363">Lightning F.3</text><text class="copy" x="990" y="395">Interceptor · 1964</text><text class="small" x="990" y="418">Cannon · two missiles</text>
  <path class="branch" d="M915 287 C950 287 948 320 965 335"/><path class="branch" d="M925 422 C950 422 950 390 965 375"/>
  <rect x="660" y="610" width="485" height="150" rx="12" fill="#1a3041" stroke="#57758a" stroke-width="2"/>
  <text class="label" x="690" y="647">THE STRATEGIC RULE</text><text class="copy" x="690" y="682">No single fighter replaces the whole system.</text><text class="copy" x="690" y="711">Home warning, carrier reach, export access, day fighting,</text><text class="copy" x="690" y="740">and all-weather interception remain separate requirements.</text>
  <line class="rule" x1="60" y1="812" x2="1140" y2="812"/>
  <text class="small" x="62" y="848">1947 defeat redirects British aviation toward survival of the home islands and the maritime Commonwealth.</text>
  <text class="small" x="62" y="874">Canadian interceptors and British strike, bomber, reconnaissance, and VTOL lines continue in separate registers.</text>
</svg>
