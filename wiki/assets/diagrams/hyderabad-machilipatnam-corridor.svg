<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hyderabad to Machilipatnam corridor</title><desc id="desc">A schematic west-to-east route from Hyderabad through Warangal and Vijayawada to the port of Machilipatnam, with connected threats and trade flows.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b24"/><stop offset="1" stop-color="#1c2d36"/></linearGradient><marker id="g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d3b56c"/></marker><marker id="b" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#69a9c0"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/><text x="55" y="69" fill="#f4edda" font-family="Georgia,serif" font-size="34">HYDERABAD–MACHILIPATNAM CORRIDOR</text><text x="55" y="105" fill="#9cacb9" font-family="Arial,sans-serif" font-size="17">A chain of transport, treaty, customs, and security relationships</text>
  <path d="M100 345C325 313 515 333 712 328C887 325 1012 301 1121 314" fill="none" stroke="#d3b56c" stroke-width="15" opacity=".45"/><path d="M100 345C325 313 515 333 712 328C887 325 1012 301 1121 314" fill="none" stroke="#f0d38b" stroke-width="4" marker-end="url(#g)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(130 345)"><circle r="52" fill="#4a3928" stroke="#d3b56c" stroke-width="3"/><text y="-3" fill="#fff" font-size="20" font-weight="700">HYDERABAD</text><text y="24" fill="#ebdcb7" font-size="14">court · industry</text></g><g transform="translate(425 327)"><circle r="47" fill="#304451" stroke="#78a4b4" stroke-width="3"/><text y="-2" fill="#fff" font-size="20" font-weight="700">WARANGAL</text><text y="23" fill="#d8e5e9" font-size="14">inner hinge</text></g><g transform="translate(747 327)"><circle r="49" fill="#304451" stroke="#78a4b4" stroke-width="3"/><text y="-2" fill="#fff" font-size="20" font-weight="700">VIJAYAWADA</text><text y="23" fill="#d8e5e9" font-size="14">associated center</text></g><g transform="translate(1055 314)"><circle r="58" fill="#245365" stroke="#69a9c0" stroke-width="3"/><text y="-4" fill="#fff" font-size="18" font-weight="700">MACHILIPATNAM</text><text y="23" fill="#d6ecf1" font-size="14">port and outlet</text></g></g>
  <path d="M1040 414C879 494 707 498 542 480C366 462 234 483 132 432" fill="none" stroke="#69a9c0" stroke-width="5" stroke-dasharray="13 9" marker-end="url(#b)"/><text x="600" y="531" text-anchor="middle" fill="#afd2de" font-family="Arial,sans-serif" font-size="17">imports west: machinery · fuel · specialists · arms</text><text x="600" y="561" text-anchor="middle" fill="#e8d7ac" font-family="Arial,sans-serif" font-size="17">exports east: commodities · repairs · prototypes · bullion trade</text>
  <g font-family="Arial,sans-serif"><rect x="115" y="151" width="300" height="93" rx="14" fill="#3f3035" stroke="#b9636c"/><text x="140" y="188" fill="#fff" font-size="20" font-weight="700">TPS PRESSURE</text><text x="140" y="218" fill="#edd7da" font-size="16">forests · villages · sabotage · rail</text><path d="M328 244L397 286" stroke="#b9636c" stroke-width="4"/><rect x="760" y="145" width="337" height="99" rx="14" fill="#3f3c4b" stroke="#9894b1"/><text x="785" y="182" fill="#fff" font-size="20" font-weight="700">ASSOCIATED SOVEREIGNTY</text><text x="785" y="212" fill="#e2dfee" font-size="16">access does not require direct annexation</text></g>
  <rect x="75" y="616" width="1050" height="55" rx="10" fill="#131f28" stroke="#506576"/><text x="600" y="650" text-anchor="middle" fill="#aebbc6" font-family="Arial,sans-serif" font-size="16">Schematic only · exact borders, treaties, rail ownership, customs division, and garrisons remain open.</text>
</svg>
