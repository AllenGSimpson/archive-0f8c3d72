<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Global corporate geopolitics</title><desc id="desc">Strategic spheres remain separate while corporate networks cross them under host-state ceilings.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a25"/><stop offset="1" stop-color="#202d38"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#e1bb69"/></marker></defs><rect width="1200" height="680" rx="24" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" fill="#f1eadb" font-family="Georgia,serif" font-size="32">Two maps of the mature world economy</text><text x="600" y="90" text-anchor="middle" fill="#afbdc8" font-family="Arial,sans-serif" font-size="16">Strategic authority remains territorial; corporate service follows routes, contracts, and technical systems</text><g filter="url(#shadow)" font-family="Arial,sans-serif"><rect x="55" y="135" width="320" height="390" rx="18" fill="#24384b" stroke="#6694b5" stroke-width="2"/><text x="215" y="180" text-anchor="middle" fill="#d8edf9" font-size="24" font-weight="700">STATE SPHERE</text><text x="215" y="217" text-anchor="middle" fill="#b8cfde" font-size="17">bases · armed force · intelligence</text><text x="215" y="247" text-anchor="middle" fill="#b8cfde" font-size="17">command · intervention · crisis veto</text><path d="M95 292h240M95 355h240M95 418h240" stroke="#49667c"/><text x="215" y="327" text-anchor="middle" fill="#f0f4f7" font-size="18">sets the security ceiling</text><text x="215" y="390" text-anchor="middle" fill="#f0f4f7" font-size="18">controls law and physical access</text><text x="215" y="453" text-anchor="middle" fill="#f0f4f7" font-size="18">decides the crisis response</text><rect x="825" y="135" width="320" height="390" rx="18" fill="#493a29" stroke="#d1a85f" stroke-width="2"/><text x="985" y="180" text-anchor="middle" fill="#fff0d0" font-size="24" font-weight="700">CORPORATE SPHERE</text><text x="985" y="217" text-anchor="middle" fill="#dec9a7" font-size="17">finance · standards · maintenance</text><text x="985" y="247" text-anchor="middle" fill="#dec9a7" font-size="17">transport · data · concessions</text><path d="M865 292h240M865 355h240M865 418h240" stroke="#776040"/><text x="985" y="327" text-anchor="middle" fill="#fff8e9" font-size="18">crosses alliance boundaries</text><text x="985" y="390" text-anchor="middle" fill="#fff8e9" font-size="18">creates functional dependence</text><text x="985" y="453" text-anchor="middle" fill="#fff8e9" font-size="18">competes below the war threshold</text><rect x="435" y="188" width="330" height="285" rx="18" fill="#31433a" stroke="#82aa8a" stroke-width="2"/><text x="600" y="230" text-anchor="middle" fill="#e3f2e5" font-size="23" font-weight="700">HOST-STATE CEILING</text><text x="600" y="271" text-anchor="middle" fill="#c4ddc8" font-size="17">licenses · customs · ownership rules</text><text x="600" y="304" text-anchor="middle" fill="#c4ddc8" font-size="17">local capacity · records · reserves</text><path d="M475 337h250" stroke="#5e8068"/><text x="600" y="378" text-anchor="middle" fill="#edf7ee" font-size="18">commerce remains bounded while</text><text x="600" y="408" text-anchor="middle" fill="#edf7ee" font-size="18">the host can enforce and substitute</text></g><path d="M380 250C465 125 730 125 820 250" fill="none" stroke="#e1bb69" stroke-width="5" marker-end="url(#arrow)"/><path d="M820 430C720 575 480 575 380 430" fill="none" stroke="#e1bb69" stroke-width="5" marker-end="url(#arrow)"/><text x="600" y="133" text-anchor="middle" fill="#e9c982" font-family="Arial,sans-serif" font-size="16">commercial services cross outward</text><text x="600" y="555" text-anchor="middle" fill="#e9c982" font-family="Arial,sans-serif" font-size="16">capital, technology, and standards cross back</text><rect x="198" y="590" width="804" height="50" rx="12" fill="#17242e" stroke="#5d7180"/><text x="600" y="621" text-anchor="middle" fill="#e7edf0" font-family="Georgia,serif" font-size="19">A contract extends a network; only dependence changes the strategic map.</text></svg>
