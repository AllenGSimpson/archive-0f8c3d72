<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Japanese joint-service combat-aircraft lineage through 1985</title>
  <desc id="desc">The A8M through A10M single-engine carrier-fighter family and the B8Y through B10Y twin-engine systems-aircraft family converge in Japan's integrated fleet-defense system by 1985.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a23"/><stop offset="1" stop-color="#173039"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter>
    <style>.title{font:700 38px Georgia,serif;fill:#f5efe0}.sub{font:18px Arial,sans-serif;fill:#b9cbcf}.lane{font:700 18px Arial,sans-serif;fill:#f0cf68;letter-spacing:1px}.name{font:700 18px Arial,sans-serif;fill:#fff}.meta{font:14px Arial,sans-serif;fill:#dce7e7}.role{font:13px Arial,sans-serif;fill:#bfd0d0}.box{stroke:#b9ccca;stroke-width:1.5;rx:10;filter:url(#shadow)}.arrow{stroke:#d9bd65;stroke-width:4;fill:none}.join{stroke:#83aaa9;stroke-width:3;fill:none;stroke-dasharray:9 7}.note{font:14px Arial,sans-serif;fill:#b9cbcf}</style>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="58" fill="#bb2633"/>
  <text x="70" y="75" class="title">Japanese Joint-Service Combat-Aircraft Lineage</text>
  <text x="70" y="108" class="sub">Two complementary carrier-capable families · late 1940s–1985</text>

  <text x="70" y="190" class="lane">SINGLE-ENGINE CARRIER AIR SUPERIORITY</text>
  <path d="M205 342 H1025" class="arrow"/><path d="M1014 332 L1030 342 L1014 352" class="arrow"/>
  <rect class="box" x="105" y="235" width="275" height="145" fill="#32616e"/>
  <text x="125" y="270" class="name">A8M Senpū</text>
  <text x="125" y="298" class="meta">first flight 1947 · service c. 1948–49</text>
  <text x="125" y="326" class="role">Very light first-generation carrier jet</text>
  <text x="125" y="351" class="role">A8M1 / A8M2 development</text>
  <rect class="box" x="465" y="235" width="275" height="145" fill="#32616e"/>
  <text x="485" y="270" class="name">A9M Shippū</text>
  <text x="485" y="298" class="meta">1955–70 · four principal marks</text>
  <text x="485" y="326" class="role">Transonic carrier fighter evolving</text>
  <text x="485" y="351" class="role">through radar, missiles, and data links</text>
  <rect class="box" x="825" y="235" width="275" height="145" fill="#32616e"/>
  <text x="845" y="270" class="name">A10M</text>
  <text x="845" y="298" class="meta">prototype 1976 · service c. 1978–80</text>
  <text x="845" y="326" class="role">Modern single-engine air-superiority</text>
  <text x="845" y="351" class="role">platform, long-lived through 1985</text>

  <text x="70" y="480" class="lane">TWIN-ENGINE SYSTEMS AIRCRAFT</text>
  <path d="M205 632 H1025" class="arrow"/><path d="M1014 622 L1030 632 L1014 642" class="arrow"/>
  <rect class="box" x="105" y="525" width="275" height="145" fill="#8d4149"/>
  <text x="125" y="560" class="name">B8Y Keiun family</text>
  <text x="125" y="588" class="meta">B8Y1 c. 1947–49 · B8Y2 in 1950s</text>
  <text x="125" y="616" class="role">Carrier-capable attack and systems</text>
  <text x="125" y="641" class="role">aircraft descended from R2Y work</text>
  <rect class="box" x="465" y="525" width="275" height="145" fill="#8d4149"/>
  <text x="485" y="560" class="name">B9Y family</text>
  <text x="485" y="588" class="meta">late 1950s–60s</text>
  <text x="485" y="616" class="role">New swept-wing, twin-engine,</text>
  <text x="485" y="641" class="role">normally two-seat heavy aircraft</text>
  <rect class="box" x="825" y="525" width="275" height="145" fill="#8d4149"/>
  <text x="845" y="560" class="name">B10Y and later marks</text>
  <text x="845" y="588" class="meta">1960s–80s</text>
  <text x="845" y="616" class="role">Sensor-heavy fleet-defense and</text>
  <text x="845" y="641" class="role">multirole platform</text>

  <path d="M970 380 C970 706 1015 700 1015 748" class="join"/>
  <path d="M970 670 C970 708 1015 710 1015 748" class="join"/>
  <rect class="box" x="735" y="748" width="390" height="92" fill="#296e63"/>
  <text x="760" y="784" class="name">Integrated fleet defense · 1985</text>
  <text x="760" y="811" class="role">Airborne warning · optical/radio links · missiles</text>
  <text x="760" y="831" class="role">Surface ships · satellites · carrier groups</text>
  <rect x="70" y="735" width="595" height="96" rx="14" fill="#222f35" stroke="#d9bd65" stroke-width="2"/>
  <text x="92" y="770" class="name">No automatic A11M or A12M by 1985</text>
  <text x="92" y="798" class="role">Later radar, engine, cockpit, structural, electronic-warfare,</text>
  <text x="92" y="820" class="role">and weapons packages remain A10M marks or Kai packages.</text>
  <text x="70" y="875" class="note">A new A-number requires a genuinely new aerodynamic architecture rather than routine modernization.</text>
</svg>
