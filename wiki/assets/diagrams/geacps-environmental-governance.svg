<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Environmental governance in the Co-Prosperity Sphere</title><desc id="desc">Development ministries, host governments, corporations, and affected communities interact through project approval, monitoring, compensation, and repair.</desc><rect width="960" height="520" fill="#101710"/><rect x="34" y="34" width="892" height="452" rx="18" fill="#172019" stroke="#b59b56" stroke-width="3"/><text x="480" y="78" text-anchor="middle" fill="#eee7d7" font-family="Georgia,serif" font-size="28">Environmental governance in Japanese Asia</text><g font-family="Arial,sans-serif"><rect x="75" y="140" width="350" height="100" rx="12" fill="#20352f" stroke="#6c9485" stroke-width="2"/><text x="250" y="178" text-anchor="middle" fill="#f0eadc" font-size="20" font-weight="700">HOST GOVERNMENTS</text><text x="250" y="207" text-anchor="middle" fill="#d1d7d0" font-size="14">permits · health law · land · compensation</text><rect x="535" y="140" width="350" height="100" rx="12" fill="#332b27" stroke="#9b7564" stroke-width="2"/><text x="710" y="178" text-anchor="middle" fill="#f0eadc" font-size="20" font-weight="700">CORPORATIONS AND AGENCIES</text><text x="710" y="207" text-anchor="middle" fill="#d8ceca" font-size="14">design · operation · monitoring · repair</text><rect x="305" y="295" width="350" height="88" rx="12" fill="#28283a" stroke="#8484a8" stroke-width="2"/><text x="480" y="330" text-anchor="middle" fill="#f0eadc" font-size="19" font-weight="700">PROJECT AND POLLUTION RECORDS</text><text x="480" y="357" text-anchor="middle" fill="#d5d5e2" font-size="14">water · air · fisheries · forest · mine · waste</text><rect x="305" y="423" width="350" height="38" rx="9" fill="#3b3420" stroke="#b59b56" stroke-width="2"/><text x="480" y="448" text-anchor="middle" fill="#efe6ce" font-size="16">COMMUNITY CLAIMS AND COMPENSATION</text><path d="M250 240 L420 295M710 240 L540 295M480 383 V423" fill="none" stroke="#b59b56" stroke-width="3"/></g></svg>
