<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Occitan mechanized-support system</title><desc id="desc">Sanglier infantry fighting vehicles and wheeled reconnaissance feeding artillery observation, fire-control electronics, and close-air-support coordination.</desc><rect width="1200" height="560" fill="#11191f"/><text x="55" y="62" fill="#f2e9d7" font-family="Georgia,serif" font-size="34">Occitan mechanized-support system</text><text x="55" y="98" fill="#aab7bf" font-family="Arial,sans-serif" font-size="18">Tracked combat power · wheeled observation · integrated supporting fires</text><rect x="70" y="175" width="330" height="130" rx="14" fill="#315f75"/><text x="235" y="216" fill="#f4ead8" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Sanglier · 1972</text><text x="235" y="252" fill="#d5e0e6" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">3 + 7 · 27 t · 30 mm</text><text x="235" y="278" fill="#d5e0e6" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Saetta ATGM</text><rect x="70" y="365" width="330" height="105" rx="14" fill="#496344"/><text x="235" y="406" fill="#f4ead8" font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle">WHEELED RECONNAISSANCE</text><text x="235" y="438" fill="#dce5d8" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">scouting · screening · observation</text><rect x="610" y="220" width="505" height="190" rx="16" fill="#6b4b37"/><text x="862" y="264" fill="#f4ead8" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">BATTLEFIELD INTEGRATION</text><text x="862" y="310" fill="#ead8cb" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">artillery observation</text><text x="862" y="342" fill="#ead8cb" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">fire-control electronics</text><text x="862" y="374" fill="#ead8cb" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">close-air-support coordination</text><path d="M400 240 H605" stroke="#8999a2" stroke-width="5" marker-end="url(#a)"/><path d="M400 415 C520 415 525 360 605 360" fill="none" stroke="#8999a2" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8999a2"/></marker></defs><text x="55" y="525" fill="#7f909a" font-family="Arial,sans-serif" font-size="15">Only Sanglier has a fixed vehicle registry; reconnaissance platforms and electronic suites remain open.</text></svg>
