<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Daily-life system of an early Martian settlement</title>
  <desc id="desc">A central settlement node linked to habitat, supplies, communications, medicine, surface operations, and law.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111620"/><stop offset="1" stop-color="#201611"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b89255"/><stop offset="1" stop-color="#6f4a2d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b9b6ab"/></marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity=".14" fill="#c46d46"><circle cx="105" cy="628" r="115"/><circle cx="1110" cy="78" r="150"/></g>
  <text x="600" y="54" text-anchor="middle" fill="#e7dfcc" font-family="Georgia,serif" font-size="29">Early Martian settlement as an operating system</text>
  <text x="600" y="84" text-anchor="middle" fill="#a8aaa7" font-family="Arial,sans-serif" font-size="15">No routine survives alone; every failure consumes another system's margin</text>
  <g stroke="#b9b6ab" stroke-width="2.2" fill="none" opacity=".82" marker-end="url(#arrow)">
    <path d="M470 306 C390 265 355 230 322 194"/><path d="M470 372 C380 390 350 415 316 447"/><path d="M730 306 C815 262 850 230 884 194"/><path d="M730 372 C820 392 850 420 884 451"/><path d="M545 430 C510 510 475 540 435 574"/><path d="M655 430 C690 510 725 540 765 574"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="460" y="260" width="280" height="180" rx="18" fill="url(#core)" stroke="#d4b276" stroke-width="2"/>
    <text x="600" y="310" text-anchor="middle" fill="#fff7e4" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">INHABITED CORE</text>
    <text x="600" y="353" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="29">Everyday Martian life</text>
    <text x="600" y="386" text-anchor="middle" fill="#f0dfbf" font-family="Arial,sans-serif" font-size="15">crew · machinery · records · judgment</text>
    <text x="600" y="414" text-anchor="middle" fill="#f0dfbf" font-family="Arial,sans-serif" font-size="15">without prompt rescue from Earth</text>
  </g>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g><rect x="78" y="118" width="270" height="130" rx="14" fill="#202a36" stroke="#6683a4"/><text x="213" y="153" text-anchor="middle" fill="#d9e7f4" font-size="14" letter-spacing="1.5">HABITAT</text><text x="213" y="183" text-anchor="middle" fill="#fff" font-size="20">Pressure and power</text><text x="213" y="212" text-anchor="middle" fill="#b9c4cc" font-size="14">air · heat · sleep · maintenance</text></g>
    <g><rect x="78" y="408" width="270" height="130" rx="14" fill="#263129" stroke="#739272"/><text x="213" y="443" text-anchor="middle" fill="#dcebd9" font-size="14" letter-spacing="1.5">SUPPLIES</text><text x="213" y="473" text-anchor="middle" fill="#fff" font-size="20">Food and water</text><text x="213" y="502" text-anchor="middle" fill="#c4d0c2" font-size="14">stores · recovery · local processing</text></g>
    <g><rect x="852" y="118" width="270" height="130" rx="14" fill="#29283a" stroke="#8177aa"/><text x="987" y="153" text-anchor="middle" fill="#e7e2fa" font-size="14" letter-spacing="1.5">COMMUNICATION</text><text x="987" y="183" text-anchor="middle" fill="#fff" font-size="20">Delayed Earth</text><text x="987" y="212" text-anchor="middle" fill="#c7c3d9" font-size="14">relays · messages · local authority</text></g>
    <g><rect x="852" y="408" width="270" height="130" rx="14" fill="#35272a" stroke="#a96d6d"/><text x="987" y="443" text-anchor="middle" fill="#f4dddd" font-size="14" letter-spacing="1.5">MEDICINE</text><text x="987" y="473" text-anchor="middle" fill="#fff" font-size="20">Care without evacuation</text><text x="987" y="502" text-anchor="middle" fill="#d7c2c2" font-size="14">stabilize · treat · endure</text></g>
    <g><rect x="300" y="548" width="270" height="120" rx="14" fill="#332d25" stroke="#9e8560"/><text x="435" y="583" text-anchor="middle" fill="#f2e4cb" font-size="14" letter-spacing="1.5">SURFACE</text><text x="435" y="613" text-anchor="middle" fill="#fff" font-size="20">Routes and rescue margin</text><text x="435" y="642" text-anchor="middle" fill="#d3c7b3" font-size="14">rovers · beacons · caches · dust</text></g>
    <g><rect x="630" y="548" width="270" height="120" rx="14" fill="#232e32" stroke="#668b92"/><text x="765" y="583" text-anchor="middle" fill="#dbedf0" font-size="14" letter-spacing="1.5">JURISDICTION</text><text x="765" y="613" text-anchor="middle" fill="#fff" font-size="20">Command and claims</text><text x="765" y="642" text-anchor="middle" fill="#c0d0d2" font-size="14">safety · law · rescue · rivalry</text></g>
  </g>
  <text x="600" y="700" text-anchor="middle" fill="#8f918e" font-family="Arial,sans-serif" font-size="13">The first settlements are extensions of terrestrial systems, but distance makes local judgment unavoidable.</text>
</svg>
