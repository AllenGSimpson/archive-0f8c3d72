<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">American-Japanese corporate competition in India</title><desc id="desc">American gold-dollar portability competes against entrenched Japanese physical and political networks across Indian successor states.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#263541"/></linearGradient><style>.t{font:700 42px Georgia,serif;fill:#f8f2e8}.s{font:18px Arial,sans-serif;fill:#b8c9d2;letter-spacing:2px}.h{font:700 27px Arial,sans-serif;fill:#fff}.k{font:700 18px Arial,sans-serif;letter-spacing:1px}.c{font:19px Arial,sans-serif;fill:#d8e2e7}.f{font:17px Arial,sans-serif;fill:#e2d3aa}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="70" text-anchor="middle" class="t">THE INDIAN CORPORATE FRONTIER</text><text x="800" y="110" text-anchor="middle" class="s">AMERICAN PORTABILITY · JAPANESE DEPTH · 1990s–2000s</text><rect x="80" y="170" width="650" height="540" rx="30" fill="#17374a" stroke="#69bce0" stroke-width="5"/><text x="405" y="230" text-anchor="middle" class="h">AMERICAN FIRMS</text><text x="405" y="268" text-anchor="middle" class="k" fill="#78c9ea">THE MONEY ALREADY TRAVELS</text><text x="135" y="335" class="c">Direct gold-dollar quotation</text><text x="135" y="385" class="c">Portable cross-border settlement</text><text x="135" y="435" class="c">Neutral-merchant acceptance</text><text x="135" y="485" class="c">Software, services, and insurance</text><text x="135" y="535" class="c">Flexible partnerships</text><text x="135" y="600" class="c">Less inherited political baggage</text><rect x="870" y="170" width="650" height="540" rx="30" fill="#3c301d" stroke="#d7b45e" stroke-width="5"/><text x="1195" y="230" text-anchor="middle" class="h">JAPANESE ZAIBATSU</text><text x="1195" y="268" text-anchor="middle" class="k" fill="#efc66c">THE NETWORK IS ALREADY THERE</text><text x="925" y="335" class="c">Ports, railways, and warehouses</text><text x="925" y="385" class="c">Workshops and local employment</text><text x="925" y="435" class="c">Security detachments</text><text x="925" y="485" class="c">Court and government relationships</text><text x="925" y="535" class="c">Integrated production and shipping</text><text x="925" y="600" class="c">Gold Yen settlement architecture</text><rect x="180" y="755" width="1240" height="72" rx="35" fill="#1a2b36" stroke="#80949f" stroke-width="3"/><text x="800" y="800" text-anchor="middle" class="f">Rivalry in finance, concessions, standards, transport, mining, and security—below the threshold of state war</text></svg>
