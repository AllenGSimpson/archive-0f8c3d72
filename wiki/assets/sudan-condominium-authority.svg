<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Authority in the Italo–Egyptian Sudan</title><desc id="desc">Diagram showing Italian strategic control, Egyptian administrative participation, and Sudanese local government.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b27"/><stop offset="1" stop-color="#17231f"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8d1d2"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/><text x="600" y="60" fill="#f5ead0" font-family="Georgia,serif" font-size="34" text-anchor="middle">The condominium state</text><text x="600" y="92" fill="#aebbc0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Three governing layers connected through Khartoum, the railway, and the Nile</text>
  <g filter="url(#s)"><rect x="55" y="140" width="330" height="360" rx="18" fill="#48252a" stroke="#c47f78" stroke-width="2"/><rect x="435" y="140" width="330" height="360" rx="18" fill="#173f2b" stroke="#76a989" stroke-width="2"/><rect x="815" y="140" width="330" height="360" rx="18" fill="#3c3724" stroke="#bca769" stroke-width="2"/><rect x="250" y="555" width="700" height="105" rx="18" fill="#263842" stroke="#80a6b6" stroke-width="2"/></g>
  <g fill="#fff" font-family="Georgia,serif" font-size="25" text-anchor="middle"><text x="220" y="183">Italian reserve authority</text><text x="600" y="183">Egyptian participation</text><text x="980" y="183">Sudanese government</text><text x="600" y="592">Shared operating system</text></g>
  <g fill="#f2dedb" font-family="Arial,sans-serif" font-size="19"><text x="90" y="238">• external defense</text><text x="90" y="280">• Port Sudan and Red Sea</text><text x="90" y="322">• strategic railways</text><text x="90" y="364">• high commission</text><text x="90" y="406">• foreign access</text><text x="90" y="448">• mobile reserves</text></g>
  <g fill="#e1efe5" font-family="Arial,sans-serif" font-size="19"><text x="470" y="238">• Arabic administration</text><text x="470" y="280">• personnel and training</text><text x="470" y="322">• finance and Nile policy</text><text x="470" y="364">• commercial connection</text><text x="470" y="406">• ministerial liaison</text><text x="470" y="448">• northern institutions</text></g>
  <g fill="#eee8cf" font-family="Arial,sans-serif" font-size="19"><text x="850" y="238">• district officials</text><text x="850" y="280">• local police and units</text><text x="850" y="322">• land and taxation</text><text x="850" y="364">• tribal and religious leaders</text><text x="850" y="406">• municipalities and markets</text><text x="850" y="448">• southern missions</text></g>
  <text x="600" y="626" fill="#dce7e9" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Khartoum · Nile traffic · Sudan Railways · export boards · district administration</text>
  <path d="M220 500 L410 575" stroke="#c8d1d2" stroke-width="3" marker-end="url(#a)"/><path d="M600 500 L600 555" stroke="#c8d1d2" stroke-width="3" marker-end="url(#a)"/><path d="M980 500 L790 575" stroke="#c8d1d2" stroke-width="3" marker-end="url(#a)"/>
</svg>
