<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Authority in Italian-protected Egypt</title>
  <desc id="desc">Diagram contrasting Egyptian ordinary government with Italian strategic reserve powers and their shared institutions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b26"/><stop offset="1" stop-color="#1a2226"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7c5cb"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="600" y="64" fill="#f2e9d2" font-family="Georgia,serif" font-size="34" text-anchor="middle">The protectorate’s divided sovereignty</text>
  <text x="600" y="96" fill="#aebbc1" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Ordinary Egyptian administration beneath Italian control of the strategic state</text>
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="430" height="400" rx="18" fill="#113f2c" stroke="#77a98b" stroke-width="2"/>
    <rect x="710" y="145" width="430" height="400" rx="18" fill="#452027" stroke="#c9857e" stroke-width="2"/>
    <rect x="430" y="565" width="340" height="105" rx="18" fill="#39444b" stroke="#b7c5cb" stroke-width="2"/>
  </g>
  <text x="275" y="190" fill="#fff" font-family="Georgia,serif" font-size="27" text-anchor="middle">Egyptian Crown and ministries</text>
  <text x="925" y="190" fill="#fff" font-family="Georgia,serif" font-size="27" text-anchor="middle">Italian High Commission</text>
  <g fill="#e6f0e9" font-family="Arial,sans-serif" font-size="21">
    <text x="100" y="245">• ordinary taxation and payroll</text><text x="100" y="291">• courts and municipalities</text><text x="100" y="337">• schools and civil service</text><text x="100" y="383">• agriculture and most police</text><text x="100" y="429">• visible national institutions</text><text x="100" y="475">• routine domestic administration</text>
  </g>
  <g fill="#fae5e2" font-family="Arial,sans-serif" font-size="21">
    <text x="750" y="245">• defense and foreign policy</text><text x="750" y="291">• Suez and strategic basing</text><text x="750" y="337">• reserves and foreign borrowing</text><text x="750" y="383">• customs preferences</text><text x="750" y="429">• major concessions</text><text x="750" y="475">• senior military advising</text>
  </g>
  <text x="600" y="602" fill="#fff" font-family="Georgia,serif" font-size="23" text-anchor="middle">Joint machinery</text>
  <text x="600" y="634" fill="#e5ebed" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">development boards · canal revenue · railways · ports · electricity</text>
  <path d="M350 545 L500 585" stroke="#b7c5cb" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 545 L700 585" stroke="#b7c5cb" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
