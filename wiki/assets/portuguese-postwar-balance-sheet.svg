<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Portugal's postwar balance sheet</title><desc id="d">Foreign claims converted gradually into productive ships, machinery, power, ports, and communications.</desc><rect width="1200" height="680" fill="#111817"/><text x="600" y="65" text-anchor="middle" fill="#efe2c5" font-family="Georgia,serif" font-size="39">FROM WARTIME CLAIMS TO PRODUCTIVE CAPACITY</text><g font-family="Georgia,serif" text-anchor="middle"><rect x="70" y="145" width="330" height="365" rx="9" fill="#263530" stroke="#91a99d" stroke-width="3"/><text x="235" y="194" fill="#f3ead6" font-size="30">1947 balance sheet</text><g fill="#cbd5ce" font-family="Arial,sans-serif" font-size="21"><text x="235" y="252">sterling balances</text><text x="235" y="296">German clearing claims</text><text x="235" y="340">gold and foreign reserves</text><text x="235" y="384">shipping and insurance claims</text><text x="235" y="428">commodity stocks</text><text x="235" y="472">colonial accounts</text></g><rect x="800" y="145" width="330" height="365" rx="9" fill="#263530" stroke="#91a99d" stroke-width="3"/><text x="965" y="194" fill="#f3ead6" font-size="30">Productive settlement</text><g fill="#cbd5ce" font-family="Arial,sans-serif" font-size="21"><text x="965" y="252">merchant ships and engines</text><text x="965" y="296">electrical machinery</text><text x="965" y="340">machine tools and rail stock</text><text x="965" y="384">ports and repair yards</text><text x="965" y="428">communications equipment</text><text x="965" y="472">interest-bearing securities</text></g></g><path d="M430 330h330" stroke="#d1ad64" stroke-width="18"/><path d="M760 330l-58-42v84z" fill="#d1ad64"/><text x="595" y="292" text-anchor="middle" fill="#f0e2c4" font-family="Georgia,serif" font-size="26">gradual conversion</text><text x="595" y="378" text-anchor="middle" fill="#aebbb4" font-family="Arial,sans-serif" font-size="19">reserve discipline · annual ceilings · Portuguese control</text><text x="600" y="600" text-anchor="middle" fill="#d7c89f" font-family="Georgia,serif" font-size="28">Portugal has financial credibility; its shortage is usable capacity.</text></svg>
