<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Machine-readable product-code route</title><desc id="desc">A product identity travels from factory through warehouse and retail, crossing a conversion gateway.</desc><rect width="1200" height="675" fill="#111a1b"/><text x="60" y="70" fill="#f2ead9" font-family="Georgia,serif" font-size="34">Machine-readable commerce</text><text x="60" y="105" fill="#aebcba" font-family="Arial,sans-serif" font-size="18">The code follows the product; the visible label remains local</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1e3435" stroke="#70aeb0" stroke-width="3"><rect x="55" y="205" width="200" height="118" rx="10"/><rect x="323" y="205" width="200" height="118" rx="10"/><rect x="677" y="205" width="200" height="118" rx="10"/><rect x="945" y="205" width="200" height="118" rx="10"/></g><rect x="526" y="399" width="148" height="106" rx="10" fill="#503c22" stroke="#d7b76f" stroke-width="3"/><g fill="#f2ead9" font-size="22"><text x="155" y="247">Factory</text><text x="423" y="247">Warehouse</text><text x="777" y="247">Large retailer</text><text x="1045" y="247">Checkout</text><text x="600" y="440">Bloc gateway</text></g><g fill="#aebcba" font-size="15"><text x="155" y="277">assign identity</text><text x="423" y="277">scan and count</text><text x="777" y="277">price and replenish</text><text x="1045" y="277">read or key manually</text><text x="600" y="469">relabel · map</text><text x="600" y="490">convert catalog</text></g></g><g stroke="#7ec0c1" stroke-width="5" fill="none"><path d="M255 264 H323"/><path d="M523 264 H677"/><path d="M877 264 H945"/></g><g fill="#7ec0c1"><path d="M314 256 l15 8 -15 8z"/><path d="M668 256 l15 8 -15 8z"/><path d="M936 256 l15 8 -15 8z"/></g><g stroke="#d7b76f" stroke-width="3" stroke-dasharray="8 7"><path d="M600 399 V323"/></g><g fill="#f2ead9"><rect x="110" y="375" width="9" height="100"/><rect x="124" y="375" width="4" height="100"/><rect x="136" y="375" width="13" height="100"/><rect x="155" y="375" width="5" height="100"/><rect x="168" y="375" width="10" height="100"/><rect x="185" y="375" width="4" height="100"/><rect x="197" y="375" width="15" height="100"/></g><text x="161" y="507" fill="#aebcba" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">symbol unsettled</text><g font-family="Arial,sans-serif" fill="#aebcba" font-size="17"><text x="60" y="605">Large chains gain visibility and replenishment; small shops retain manual pricing and human knowledge.</text><text x="60" y="638">By 1985 no single global product code joins the five standards families.</text></g></svg>
