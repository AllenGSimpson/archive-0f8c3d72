<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Differentiated authority in Italian North Africa</title><desc id="desc">Comparison of direct integration in Libya, supervised administration in Tunisia, inherited French institutions in Algeria, and military route control in the Sahara.</desc>
  <rect width="1200" height="700" fill="#111817"/><text x="600" y="62" text-anchor="middle" fill="#f0e1c1" font-family="Georgia,serif" font-size="38">FOUR DIFFERENT SYSTEMS</text><text x="600" y="100" text-anchor="middle" fill="#9faea6" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">ONE ITALIAN SOVEREIGNTY, UNEQUAL ADMINISTRATIVE DEPTH</text>
  <g font-family="Georgia,serif" text-anchor="middle"><rect x="390" y="134" width="420" height="76" rx="8" fill="#7b2929" stroke="#dfc27f" stroke-width="3"/><text x="600" y="167" fill="#fff4dc" font-size="28">Rome and the Italian Crown</text><text x="600" y="193" fill="#e7d5ac" font-size="18">defense · customs · ports · concessions · external authority</text></g>
  <g stroke="#c8a25e" stroke-width="5"><path d="M600 210v70M150 280h900M150 280v55M450 280v55M750 280v55M1050 280v55"/></g>
  <g font-family="Georgia,serif" text-anchor="middle"><g fill="#263832" stroke="#93aa9e" stroke-width="3"><rect x="38" y="335" width="224" height="130" rx="8"/><rect x="338" y="335" width="224" height="130" rx="8"/><rect x="638" y="335" width="224" height="130" rx="8"/><rect x="938" y="335" width="224" height="130" rx="8"/></g><g fill="#f2ead8" font-size="27"><text x="150" y="379">Libya</text><text x="450" y="379">Tunisia</text><text x="750" y="379">Algeria</text><text x="1050" y="379">Sahara</text></g><g fill="#cbd5ce" font-family="Arial,sans-serif" font-size="17"><text x="150" y="413">DIRECT INTEGRATION</text><text x="150" y="441">Fourth Shore municipalities</text><text x="450" y="413">SUPERVISED MACHINERY</text><text x="450" y="441">Tunisian and French offices</text><text x="750" y="413">INHERITED SOCIETY</text><text x="750" y="441">French law and municipalities</text><text x="1050" y="413">POINTS AND LINES</text><text x="1050" y="441">garrisons, oases, air routes</text></g></g>
  <path d="M150 465v75M450 465v75M750 465v75M1050 465v75" stroke="#748d80" stroke-width="4"/><rect x="87" y="540" width="1026" height="86" rx="8" fill="#1d2926" stroke="#748d80" stroke-width="3"/><text x="600" y="576" text-anchor="middle" fill="#f1e8d4" font-family="Georgia,serif" font-size="27">Settlers · local officials · Muslim and Jewish institutions · police · merchants · notables</text><text x="600" y="605" text-anchor="middle" fill="#aebbb4" font-family="Arial,sans-serif" font-size="18">The mix changes by territory; strategic systems remain Italian-controlled.</text>
</svg>
