<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sudan as a corridor state</title><desc id="desc">Schematic relationship among the Nile, Khartoum, Gezira, Atbara, Port Sudan, export regions, and thinner peripheral administration.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172534"/><stop offset="1" stop-color="#11191d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".32"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d3b469"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/><text x="600" y="60" fill="#f3ead5" font-family="Georgia,serif" font-size="34" text-anchor="middle">Sudan: government along points and lines</text><text x="600" y="91" fill="#acbac1" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Authority is densest at the river, railway, ports, irrigated districts, and principal towns</text>
  <path d="M310 620 C350 550 380 500 425 445 C465 395 480 350 510 300 C540 250 560 205 585 135" fill="none" stroke="#68a9cc" stroke-width="26" opacity=".8"/><path d="M310 620 C350 550 380 500 425 445 C465 395 480 350 510 300 C540 250 560 205 585 135" fill="none" stroke="#b8dcec" stroke-width="4"/>
  <path d="M500 310 L715 265 L945 205" fill="none" stroke="#8f7960" stroke-width="13"/><path d="M500 310 L715 265 L945 205" fill="none" stroke="#d3b469" stroke-width="3" marker-end="url(#a)"/>
  <g filter="url(#s)"><circle cx="500" cy="310" r="66" fill="#3d3428" stroke="#d3b469" stroke-width="3"/><circle cx="405" cy="460" r="54" fill="#294229" stroke="#8bb080" stroke-width="3"/><circle cx="715" cy="265" r="48" fill="#3a3032" stroke="#b58387" stroke-width="3"/><circle cx="945" cy="205" r="62" fill="#263f49" stroke="#79a9ba" stroke-width="3"/></g>
  <g fill="#fff" font-family="Georgia,serif" text-anchor="middle"><text x="500" y="305" font-size="24">Khartoum</text><text x="500" y="335" font-size="15">capital and junction</text><text x="405" y="456" font-size="22">Gezira</text><text x="405" y="482" font-size="14">irrigation and cotton</text><text x="715" y="270" font-size="20">Atbara</text><text x="945" y="199" font-size="23">Port Sudan</text><text x="945" y="228" font-size="14">Red Sea gateway</text></g>
  <g fill="#d8e2e4" font-family="Arial,sans-serif" font-size="18"><text x="75" y="185">Peripheral districts</text><text x="75" y="217">• livestock and gum arabic</text><text x="75" y="247">• local leaders and police</text><text x="75" y="277">• missions and district officers</text><text x="75" y="307">• irregular commodity taxation</text><text x="75" y="337">• thin road and radio coverage</text></g>
  <rect x="650" y="480" width="470" height="145" rx="17" fill="#263039" stroke="#657d89"/><text x="885" y="520" fill="#f3ead5" font-family="Georgia,serif" font-size="23" text-anchor="middle">Strategic flows</text><text x="690" y="556" fill="#dce5e8" font-family="Arial,sans-serif" font-size="17">north: Nile administration and Egyptian finance</text><text x="690" y="585" fill="#dce5e8" font-family="Arial,sans-serif" font-size="17">east: railway, exports, Italian naval defense</text><text x="690" y="614" fill="#dce5e8" font-family="Arial,sans-serif" font-size="17">south and west: negotiated local government</text>
</svg>
