<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Atlantic and Overseas Development Plan</title><desc id="d">Six priorities linking Portugal, Atlantic islands, and overseas corridors.</desc><rect width="1200" height="700" fill="#101817"/><text x="600" y="63" text-anchor="middle" fill="#efe2c5" font-family="Georgia,serif" font-size="38">PLANO DE FOMENTO ATLÂNTICO E ULTRAMARINO</text><text x="600" y="101" text-anchor="middle" fill="#a8b7af" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">1948–1953 · SIX INVESTMENT PRIORITIES</text><g stroke="#c7a35f" stroke-width="5"><path d="M600 215v315"/><path d="M200 270h800M200 475h800"/></g><circle cx="600" cy="375" r="105" fill="#7b2829" stroke="#e1c57f" stroke-width="4"/><text x="600" y="363" text-anchor="middle" fill="#fff4db" font-family="Georgia,serif" font-size="31">Portuguese</text><text x="600" y="402" text-anchor="middle" fill="#fff4db" font-family="Georgia,serif" font-size="31">sovereignty</text><g font-family="Georgia,serif" text-anchor="middle" fill="#f1e8d4"><g><circle cx="200" cy="210" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="200" y="205" font-size="25">Electricity</text><text x="200" y="235" font-size="18">dams · grids · power</text></g><g><circle cx="600" cy="190" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="600" y="185" font-size="25">Ports &amp; ships</text><text x="600" y="215" font-size="18">yards · cargo · fisheries</text></g><g><circle cx="1000" cy="210" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="1000" y="205" font-size="25">Agriculture</text><text x="1000" y="235" font-size="18">food · roads · storage</text></g><g><circle cx="200" cy="540" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="200" y="535" font-size="25">Basic industry</text><text x="200" y="565" font-size="18">cement · chemicals</text></g><g><circle cx="600" cy="565" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="600" y="560" font-size="25">Technical skills</text><text x="600" y="590" font-size="18">engineers · operators</text></g><g><circle cx="1000" cy="540" r="82" fill="#283832" stroke="#8fa79b" stroke-width="3"/><text x="1000" y="535" font-size="25">Imperial corridors</text><text x="1000" y="565" font-size="18">ports · rail · radio</text></g></g><text x="600" y="672" text-anchor="middle" fill="#aebbb4" font-family="Arial,sans-serif" font-size="18">Projects save foreign exchange, earn exports, or lower the future cost of defending the empire.</text></svg>
