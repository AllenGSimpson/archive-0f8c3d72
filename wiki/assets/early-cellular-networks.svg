<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Early cellular telephone workflow</title><desc id="desc">Pagers and vehicle telephones connect professional users through urban radio cells and the fixed network.</desc><rect width="1200" height="675" fill="#101620"/><text x="60" y="70" fill="#f3ebdb" font-family="Georgia,serif" font-size="34">Professional mobility in 1985</text><text x="60" y="105" fill="#aab6c7" font-family="Arial,sans-serif" font-size="18">Pager → telephone → returned call</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1d2b3b" stroke="#6f9fc8" stroke-width="3"><rect x="60" y="215" width="190" height="112" rx="10"/><rect x="355" y="215" width="190" height="112" rx="10"/><rect x="655" y="215" width="190" height="112" rx="10"/><rect x="950" y="215" width="190" height="112" rx="10"/></g><g fill="#f3ebdb" font-size="22"><text x="155" y="258">Pager</text><text x="450" y="258">Car / case phone</text><text x="750" y="258">Urban radio cells</text><text x="1045" y="258">Fixed network</text></g><g fill="#aab6c7" font-size="15"><text x="155" y="288">number or service code</text><text x="450" y="288">registered equipment</text><text x="750" y="288">limited cities · corridors</text><text x="1045" y="288">office · home · operator</text></g></g><g stroke="#80b8e2" stroke-width="5" fill="none"><path d="M250 271 H355"/><path d="M545 271 H655"/><path d="M845 271 H950"/></g><g fill="#80b8e2"><path d="M346 263 l15 8 -15 8z"/><path d="M646 263 l15 8 -15 8z"/><path d="M941 263 l15 8 -15 8z"/></g><g stroke="#d2b66c" stroke-width="4" fill="none"><path d="M708 203 q42 -88 84 0"/><path d="M722 203 q28 -56 56 0"/><path d="M738 203 q12 -25 24 0"/></g><g font-family="Arial,sans-serif"><rect x="410" y="420" width="380" height="86" rx="12" fill="#3b3120" stroke="#d2b66c" stroke-width="3"/><text x="600" y="455" text-anchor="middle" fill="#f3ebdb" font-size="21">Pocket handset</text><text x="600" y="483" text-anchor="middle" fill="#d2b66c" font-size="16">elite demonstration or specialist equipment</text><text x="60" y="598" fill="#aab6c7" font-size="17">Networks stop at regional and bloc boundaries; travelers rent local equipment or return to fixed telephones.</text><text x="60" y="632" fill="#aab6c7" font-size="17">Mobile voice is institutional and aspirational, not yet a mass personal utility.</text></g></svg>
