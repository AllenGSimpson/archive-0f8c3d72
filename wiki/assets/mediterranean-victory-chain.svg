<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Italian Mediterranean victory chain</title>
  <desc id="desc">A causal sequence from convoy reform and the Second Battle of El Alamein through Egypt and Suez to the Algerian counteroffensive and Lisbon settlement.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c8b16f"/></marker><style>.bg{fill:#0d1117}.sea{fill:#132938}.box{fill:#1b222c;stroke:#8392a1;stroke-width:2}.win{fill:#26382e;stroke:#7db894}.settle{fill:#372f20;stroke:#c8b16f}.t{fill:#f1f4f7;font:700 22px Georgia,serif}.s{fill:#b9c4cf;font:15px Arial,sans-serif}.arrow{stroke:#c8b16f;stroke-width:4;fill:none;marker-end:url(#a)}.thin{stroke:#66869b;stroke-width:2;fill:none;stroke-dasharray:8 7}</style></defs>
  <rect class="bg" width="1200" height="620" rx="24"/><path class="sea" d="M0 430C150 370 250 490 400 430s260-50 400 0 260 30 400-20v210H0z"/>
  <rect class="box" x="35" y="70" width="205" height="115" rx="12"/><text class="t" x="137" y="108" text-anchor="middle">Convoy Reform</text><text class="s" x="137" y="138" text-anchor="middle">shipping · air cover</text><text class="s" x="137" y="162" text-anchor="middle">ports · shared priority</text>
  <path class="arrow" d="M240 127h50"/>
  <rect class="win" x="290" y="70" width="205" height="115" rx="12"/><text class="t" x="392" y="106" text-anchor="middle">Second Alamein</text><text class="s" x="392" y="138" text-anchor="middle">Italian-led breakthrough</text><text class="s" x="392" y="162" text-anchor="middle">with Rommel assistance</text>
  <path class="arrow" d="M495 127h50"/>
  <rect class="win" x="545" y="70" width="205" height="115" rx="12"/><text class="t" x="647" y="106" text-anchor="middle">Egyptian Advance</text><text class="s" x="647" y="138" text-anchor="middle">ports · rail · Delta</text><text class="s" x="647" y="162" text-anchor="middle">moving supply corridor</text>
  <path class="arrow" d="M750 127h50"/>
  <rect class="win" x="800" y="70" width="165" height="115" rx="12"/><text class="t" x="882" y="106" text-anchor="middle">Suez</text><text class="s" x="882" y="138" text-anchor="middle">secured by 1945</text><text class="s" x="882" y="162" text-anchor="middle">British route closed</text>
  <path class="arrow" d="M965 127h45"/>
  <rect class="settle" x="1010" y="70" width="155" height="115" rx="12"/><text class="t" x="1087" y="106" text-anchor="middle">Lisbon</text><text class="s" x="1087" y="138" text-anchor="middle">treaty control</text><text class="s" x="1087" y="162" text-anchor="middle">in 1947</text>
  <path class="thin" d="M137 185v215h815"/>
  <rect class="box" x="250" y="315" width="255" height="115" rx="12"/><text class="t" x="377" y="352" text-anchor="middle">British Torch Bridgehead</text><text class="s" x="377" y="384" text-anchor="middle">Algiers without US armies</text><text class="s" x="377" y="408" text-anchor="middle">or replacement system</text>
  <path class="arrow" d="M505 372h80"/>
  <rect class="win" x="585" y="315" width="255" height="115" rx="12"/><text class="t" x="712" y="352" text-anchor="middle">Axis Interdiction</text><text class="s" x="712" y="384" text-anchor="middle">containment · submarines</text><text class="s" x="712" y="408" text-anchor="middle">air attack · mobile reserve</text>
  <path class="arrow" d="M840 372h80"/>
  <rect class="settle" x="920" y="315" width="245" height="115" rx="12"/><text class="t" x="1042" y="352" text-anchor="middle">Algiers Capitulation</text><text class="s" x="1042" y="384" text-anchor="middle">western route closed</text><text class="s" x="1042" y="408" text-anchor="middle">Rommel receives baton</text>
  <text class="s" x="600" y="535" text-anchor="middle">Victory is cumulative: joint command creates supply; supply creates battlefield choice; sea denial removes Britain's recovery paths.</text>
</svg>
