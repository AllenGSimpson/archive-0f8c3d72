<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Egyptian economic corridor</title>
  <desc id="desc">Diagram of agricultural production, Cairo, Alexandria, Suez, and the Italian commercial system.</desc>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182838"/><stop offset="1" stop-color="#10171d"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d7b66d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="720" rx="24" fill="url(#sky)"/>
  <text x="600" y="62" fill="#f3ead8" font-family="Georgia,serif" font-size="34" text-anchor="middle">The Nile–Mediterranean–Suez corridor</text>
  <text x="600" y="94" fill="#aab8c0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Production, administration, finance, shipping, and strategic control in one connected system</text>
  <path d="M145 535 C255 485 300 415 390 400 C470 387 530 337 600 300 C700 248 770 260 860 230" fill="none" stroke="#397dad" stroke-width="42" opacity=".65"/>
  <path d="M155 535 C265 485 310 420 395 405 C480 390 535 340 605 305 C700 260 770 265 865 235" fill="none" stroke="#72b4d6" stroke-width="6"/>
  <g filter="url(#s)">
    <rect x="65" y="460" width="260" height="150" rx="18" fill="#29472b" stroke="#85a56d" stroke-width="2"/><rect x="350" y="325" width="245" height="150" rx="18" fill="#493b2e" stroke="#c3a56e" stroke-width="2"/><rect x="650" y="135" width="240" height="150" rx="18" fill="#253e4b" stroke="#70a6bd" stroke-width="2"/><rect x="905" y="325" width="240" height="150" rx="18" fill="#3c3037" stroke="#bc8796" stroke-width="2"/>
  </g>
  <g fill="#fff" font-family="Georgia,serif" font-size="25" text-anchor="middle"><text x="195" y="500">Nile agriculture</text><text x="472" y="365">Cairo</text><text x="770" y="175">Alexandria</text><text x="1025" y="365">Suez Canal Zone</text></g>
  <g fill="#dce6e8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="195" y="535">cotton · grain · irrigation</text><text x="195" y="563">rural credit · processing</text><text x="472" y="400">ministries · banks · rail</text><text x="472" y="428">technical education</text><text x="770" y="210">port · cotton exchange</text><text x="770" y="238">finance · shipping</text><text x="1025" y="400">tolls · bases · transit</text><text x="1025" y="428">inspection · fuel</text></g>
  <path d="M325 535 L350 435" stroke="#d7b66d" stroke-width="4" marker-end="url(#a)"/><path d="M595 360 L660 255" stroke="#d7b66d" stroke-width="4" marker-end="url(#a)"/><path d="M890 240 L995 325" stroke="#d7b66d" stroke-width="4" marker-end="url(#a)"/>
  <rect x="360" y="615" width="480" height="64" rx="15" fill="#1f2a30" stroke="#6b7d86"/><text x="600" y="643" fill="#f3ead8" font-family="Georgia,serif" font-size="21" text-anchor="middle">Italian–Egyptian Development Board</text><text x="600" y="666" fill="#b8c4c9" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">credit and procurement connect every node; Rome controls the strategic terms</text>
</svg>
