<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Five colour television systems</title><desc id="desc">Five broadcast systems exchange television through converter gateways.</desc><defs><linearGradient id="screen" x1="0" x2="1"><stop stop-color="#4cb3d4"/><stop offset=".33" stop-color="#78b66a"/><stop offset=".66" stop-color="#e6c85c"/><stop offset="1" stop-color="#d86161"/></linearGradient></defs><rect width="1200" height="675" fill="#15141a"/><text x="58" y="70" fill="#f5eddd" font-family="Georgia,serif" font-size="34">Colour television standards, 1965–1985</text><text x="58" y="105" fill="#b6afbd" font-family="Arial,sans-serif" font-size="18">One televised world, five signal families</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#292631" stroke="#797080" stroke-width="3"><rect x="52" y="165" width="194" height="105" rx="10"/><rect x="277" y="165" width="194" height="105" rx="10"/><rect x="729" y="165" width="194" height="105" rx="10"/><rect x="954" y="165" width="194" height="105" rx="10"/><rect x="503" y="455" width="194" height="105" rx="10"/></g><g fill="#f5eddd" font-size="21"><text x="149" y="207">American</text><text x="149" y="237" font-size="15">backward compatible</text><text x="374" y="207">German</text><text x="374" y="237" font-size="15">phase-correcting</text><text x="826" y="207">Commonwealth</text><text x="826" y="237" font-size="15">industrial autonomy</text><text x="1051" y="207">Japanese</text><text x="1051" y="237" font-size="15">manufacture · conversion</text><text x="600" y="497">Latin</text><text x="600" y="527" font-size="15">long and mixed relays</text></g><rect x="473" y="295" width="254" height="130" rx="18" fill="#23242a" stroke="#e8c76b" stroke-width="4"/><rect x="500" y="319" width="200" height="68" rx="8" fill="url(#screen)"/><text x="600" y="411" fill="#f5eddd" font-size="17">standards converter</text></g><g stroke="#9992a0" stroke-width="4" fill="none" stroke-dasharray="9 8"><path d="M246 217 L482 320"/><path d="M471 217 L540 297"/><path d="M729 217 L660 297"/><path d="M954 217 L718 320"/><path d="M600 455 L600 425"/></g><g font-family="Arial,sans-serif" fill="#b6afbd" font-size="17"><text x="62" y="615">Recorded film crosses comparatively easily; live and taped television needs conversion.</text><text x="62" y="644">Colour is established by 1975, while monochrome sets remain numerous through 1985.</text></g></svg>
