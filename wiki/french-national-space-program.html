<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="description" content="The French national space program was the État français effort to demonstrate domestic manufacture of a crewed launcher and spacecraft. Begun as a small scientific institution in the 1980s and expanded into a national prototype in the 1990s, it achieved an all-French crewed orbital flight around 2000 from a German-controlled range. The state subsequently purchased transport while its surviving factories entered international supply chains."><title>French national space program | Fractured Peace Archive</title><link rel="stylesheet" href="styles.css?v=20260815a"></head><body data-article="french-national-space-program"><script src="article-data.js"></script><script src="six-lore-french-politics-article-data.js"></script><script src="article-renderer.js?v=1027"></script><script src="app.js"></script></body></html>
