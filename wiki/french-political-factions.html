<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="description" content="The political traditions surviving the defeat and partition of France included authoritarian administrative conservatives, Doriotist mass organizations, Catholic counterrevolutionaries, provincialists, Gaullists, former members of the Parti Social Français, Communists, and clandestine nationalist networks. Their opposition to the Third Republic had never made the interwar right a single movement. After 1947, disagreement over collaboration, French unity, Catholic authority, and the political status of the provinces divided these traditions among several states."><title>French Political Factions | Fractured Peace Archive</title><link rel="stylesheet" href="styles.css?v=20260816"></head><body data-article="french-political-factions"><script src="article-data.js"></script><script src="six-lore-french-factions-article-data.js"></script><script src="article-renderer.js?v=1027"></script><script src="app.js?v=1564"></script></body></html>
